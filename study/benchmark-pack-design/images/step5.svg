<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#f8fafc"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-family="Pretendard, Segoe UI, sans-serif" fill="#1f2937">야간 운영 생산성 대시보드</text>

  <rect x="72" y="84" width="308" height="114" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="226" y="114" text-anchor="middle" font-size="16" fill="#111827">실행 루프</text>
  <text x="226" y="140" text-anchor="middle" font-size="14" fill="#374151">우선순위 큐 -> WIP=3 실행</text>
  <text x="226" y="164" text-anchor="middle" font-size="14" fill="#374151">검증 게이트 -> 통합</text>
  <text x="226" y="186" text-anchor="middle" font-size="14" fill="#374151">아침 브리핑 자동 생성</text>

  <rect x="420" y="84" width="308" height="114" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="574" y="114" text-anchor="middle" font-size="16" fill="#155e75">핵심 지표</text>
  <text x="574" y="140" text-anchor="middle" font-size="14" fill="#0f766e">Throughput: 9개 완료</text>
  <text x="574" y="164" text-anchor="middle" font-size="14" fill="#0f766e">Cycle Time: 평균 42분</text>
  <text x="574" y="186" text-anchor="middle" font-size="14" fill="#0f766e">재작업률: 18%</text>

  <rect x="72" y="220" width="656" height="110" rx="12" fill="#fef9c3" stroke="#fde047"/>
  <text x="400" y="252" text-anchor="middle" font-size="17" fill="#713f12">다음날 개선 규칙</text>
  <text x="400" y="278" text-anchor="middle" font-size="14" fill="#854d0e">Throughput 낮음 -> 작업 분할</text>
  <text x="400" y="300" text-anchor="middle" font-size="14" fill="#854d0e">Cycle Time 높음 -> 병목 단계 분해</text>
  <text x="400" y="322" text-anchor="middle" font-size="14" fill="#854d0e">재작업률 높음 -> 검증 조건 강화</text>
</svg>
