<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q26 용암 플로우·냉각 단계형 실험실</title>
<style>
:root{--bg:#090b0d;--panel:#17191d;--line:#3a3430;--ink:#f3eee9;--muted:#a99c92;--orange:#ff7847;--amber:#ffd068;--cyan:#68d5dc;--red:#ff5d4f}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0b0a0a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#0b0a0adc}.hud b{color:var(--orange)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#6a5a50}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#190a05}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--orange);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--orange)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#81736b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="주황 UV 스크롤에서 곡류 플로우맵, 이중 위상, 온도 기반 크러스트·균열과 변위·국소 냉각 반응까지 쌓는 용암 단계"></canvas><div class="hud"><span>Q26 · <b id="stage">주황 텍스처 직선 스크롤</b></span><span id="status">굽이에서 흐름 파괴</span></div></div>
<div class="steps" role="group" aria-label="용암 흐름 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>균일 UV 스크롤</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>플로우맵</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>이중 위상</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>균일 온도 실패</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>온도·크러스트</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>변위·국소 반응</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">플로우 속도</label><output id="speedOut">60%</output></div><input id="speed" type="range" min="0" max="100" value="60"></div><div><div class="ct"><label for="cool">냉각·크러스트</label><output id="coolOut">45%</output></div><input id="cool" type="range" min="0" max="100" value="45"></div><div class="toggles" role="group" aria-label="플로우 위상과 국소 유체 반응 옵션"><button id="phase" aria-pressed="false">2위상 crossfade</button><button id="local" aria-pressed="false">국소 시뮬·냉각</button></div></div>
<div class="metrics"><div class="m"><small>굽이 방향 오차</small><strong id="mDirection">55°</strong></div><div class="m"><small>위상 맥동</small><strong id="mPulse">—</strong></div><div class="m"><small>고온 이미시브 면적</small><strong id="mHot">100%</strong></div><div class="m"><small>검은 크러스트 면적</small><strong id="mCrust">0%</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:.60,cool:.45,phase:false,local:false},names=['주황 텍스처 직선 스크롤','flow vector field','phase A / B','흐르지만 전부 같은 온도','temperature → emissive/crust','displacement + local shallow-water'];
const desc=['<b>문제 재현:</b> 한 UV 방향으로 주황 무늬를 밀면 강이 굽고 합류해도 무늬는 직진해 늘어집니다. 온도와 두께도 없어 빛나는 벽지처럼 보입니다.','<b>지점별 방향:</b> 플로우맵의 RG 벡터로 각 위치의 UV를 다른 방향으로 이류시킵니다. 화살표와 무늬가 곡류 접선을 따라 돌아가지만 한 위상은 시간이 갈수록 늘어집니다.','<b>무한 흐름 속임수:</b> 시간이 반 주기 어긋난 두 샘플을 번갈아 crossfade해 각 위상이 늘어나기 전에 리셋합니다. 위상 맥동을 낮추며 곡류를 계속 흐르게 합니다.','<b>남은 실패:</b> 방향은 맞지만 발원지·느린 가장자리·균열까지 모두 같은 주황색입니다. 뜨거움과 굳음의 대비가 없어 용암의 위압감이 생기지 않습니다.','<b>온도에서 재질 파생:</b> 속도·발원 거리·노이즈로 온도를 만들고 뜨거운 곳은 HDR 이미시브, 식은 가장자리는 검고 거친 크러스트로 바꿉니다. 균열 마스크 사이로만 벌건 빛이 샙니다.','<b>연출·반응·규칙 분리:</b> 흐름 방향 노이즈 변위로 끈적한 두께를 주고, 물이 닿는 국소 영역만 높이장·냉각 버퍼로 굳힙니다. 데미지는 별도 게임 볼륨이 담당합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#f3eee9'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(8,6,5,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function centerY(px,w,h){return h*(.49+.13*Math.sin(px/w*Math.PI*2-.65)+.045*Math.sin(px/w*Math.PI*5))}
function riverPath(w,h){const n=70,half=h*.18;x.beginPath();for(let i=0;i<=n;i++){const px=i*w/n,py=centerY(px,w,h)-half*(.75+.18*Math.sin(i*.35));if(i===0)x.moveTo(px,py);else x.lineTo(px,py)}for(let i=n;i>=0;i--){const px=i*w/n,py=centerY(px,w,h)+half*(.75+.18*Math.sin(i*.35));x.lineTo(px,py)}x.closePath()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);x.fillStyle='#1c1a19';x.fillRect(0,0,w,h);for(let i=0;i<90;i++){x.fillStyle=`rgba(80,72,66,${.08+(i%5)*.02})`;x.beginPath();x.arc((i*97)%w,(i*53)%h,2+i%7,0,7);x.fill()}riverPath(w,h);x.fillStyle='#b83218';x.fill();x.save();riverPath(w,h);x.clip();const hot=x.createLinearGradient(0,0,w,0);hot.addColorStop(0,'#ffdf66');hot.addColorStop(.35,'#ff6b28');hot.addColorStop(1,'#a92716');x.fillStyle=hot;x.fillRect(0,0,w,h);
if(S.step===0){x.strokeStyle='rgba(255,230,120,.78)';x.lineWidth=8;for(let yy=h*.20;yy<h*.80;yy+=34){x.beginPath();x.moveTo(-20+S.speed*40,yy);x.lineTo(w+20,yy);x.stroke()}tag('ONE UV DIRECTION',w*.08,h*.22,'#ff7178')}
if(S.step>=1){const long=S.phase?28:110+S.speed*70;for(let i=0;i<34;i++){const px=w*(.03+(i%17)/17*.94),py=centerY(px,w,h)+(Math.floor(i/17)-.5)*h*.12,dy=centerY(Math.min(w,px+5),w,h)-centerY(Math.max(0,px-5),w,h),a=Math.atan2(dy,10);x.strokeStyle=i%2?'rgba(255,235,150,.66)':'rgba(255,130,55,.75)';x.lineWidth=5;x.beginPath();x.moveTo(px-Math.cos(a)*long*.5,py-Math.sin(a)*long*.5);x.lineTo(px+Math.cos(a)*long*.5,py+Math.sin(a)*long*.5);x.stroke();if(i%4===0){x.strokeStyle='#68d5dc';x.lineWidth=1.5;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*28,py+Math.sin(a)*28);x.stroke()}}tag(S.phase?'PHASE A × B · RESET BEFORE STRETCH':'SINGLE PHASE · UV STRETCH',w*.07,h*.78,S.phase?'#68d5dc':'#ff7178')}
if(S.step===3)tag('TEMPERATURE = 1 EVERYWHERE',w*.60,h*.27,'#ff7178');
if(S.step>=4){const crust=Math.min(.72,S.cool*.75);x.fillStyle=`rgba(20,18,17,${crust})`;for(let i=0;i<26;i++){const px=(i*79)%w,py=centerY(px,w,h)+Math.sin(i*4.1)*h*.10;x.beginPath();x.ellipse(px,py,20+(i%4)*10,7+(i%3)*6,i*.4,0,7);x.fill()}x.strokeStyle='rgba(255,79,35,.92)';x.lineWidth=2;for(let i=0;i<20;i++){const px=(i*91)%w,py=centerY(px,w,h)+Math.cos(i*2.7)*h*.11;x.beginPath();x.moveTo(px-18,py);x.lineTo(px-5,py+6);x.lineTo(px+6,py-4);x.lineTo(px+20,py+3);x.stroke()}tag('HOT HDR EMISSIVE',w*.08,h*.40,'#ffd068');tag('COOL CRUST · CRACK LEAK',w*.62,h*.68,'#ff7847')}
x.restore();x.strokeStyle='#4a3e38';x.lineWidth=5;riverPath(w,h);x.stroke();
if(S.step>=5){x.strokeStyle='#ffb04f';x.lineWidth=2;for(let i=0;i<70;i++){const px=i*w/69,py=centerY(px,w,h)-h*.18*(.75+.18*Math.sin(i*.35))-Math.sin(i*.9)*S.speed*7;x.lineTo(px,py)}x.stroke();tag('TESSELLATION · FLOW DISPLACEMENT',w*.06,h*.16,'#ffd068');if(S.local){const cx=w*.66,cy=centerY(cx,w,h),g=x.createRadialGradient(cx,cy,0,cx,cy,70);g.addColorStop(0,'rgba(12,18,19,.95)');g.addColorStop(1,'rgba(12,18,19,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,72,0,7);x.fill();x.strokeStyle='#68d5dc';x.lineWidth=3;x.beginPath();x.arc(cx,cy,38,0,7);x.stroke();tag('WATER IMPULSE → COOLING RT',cx-75,cy-58,'#68d5dc')}tag('VISUAL FLOW / LOCAL REACTION / DAMAGE VOLUME',w*.07,h*.91,'#f3eee9')}}
function metrics(){const dir=S.step===0?55:0,pulse=S.step<1?'—':S.phase?'3%':'22%',hot=S.step<4?100:Math.max(14,100-S.cool*72-(S.local?8:0)),crust=S.step<4?0:Math.min(78,S.cool*68+(S.local?12:0));$('mDirection').textContent=dir+'°';$('mPulse').textContent=pulse;$('mHot').textContent=hot.toFixed(0)+'%';$('mCrust').textContent=crust.toFixed(0)+'%'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['굽이에서 흐름 파괴','방향은 맞고 무늬는 늘어남','늘어짐 없이 반복','전부 같은 주황','뜨거움↔검은 껍질','보기·반응·규칙 분리'][S.step];$('phase').setAttribute('aria-pressed',String(S.phase));$('local').setAttribute('aria-pressed',String(S.local));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.phase=S.step>=2;S.local=S.step===5;ui()});$('speed').oninput=e=>{S.speed=+e.target.value/100;$('speedOut').textContent=e.target.value+'%';ui()};$('cool').oninput=e=>{S.cool=+e.target.value/100;$('coolOut').textContent=e.target.value+'%';ui()};$('phase').onclick=()=>{S.phase=!S.phase;ui()};$('local').onclick=()=>{S.local=!S.local;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
