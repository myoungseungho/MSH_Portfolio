<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q60 임팩트 피드백 동기화 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="무작위 최대 흔들림에서 방향성 카메라, 트라우마 누적, 채널별 강도 매핑, 단일 임팩트 이벤트 동기화와 접근성 완화까지 발전하는 타격 피드백 실험"></canvas><div class="hud"><span>Q60 · <b id="stage">각 채널을 따로 최대 출력</b></span><span id="status">카메라·VFX·진동·소리가 서로 다른 박자</span></div></div>
<div class="steps" role="group" aria-label="임팩트 피드백 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>무작위 최대</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>방향성 셰이크</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>트라우마</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>채널 매핑</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>단일 이벤트</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>접근성·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="hits">연속 타격 수</label><output id="hitsOut">7 hits</output></div><input id="hits" type="range" min="1" max="12" value="7"></div><div><div class="ct"><label for="intensity">타격 강도</label><output id="intensityOut">72%</output></div><input id="intensity" type="range" min="10" max="100" value="72"></div><div class="toggles" role="group" aria-label="채널 동기화와 멀미 완화 설정"><button id="sync" aria-pressed="false">채널 동기화</button><button id="reduce" aria-pressed="false">흔들림 완화</button></div></div>
<div class="metrics"><div class="m"><small>누적 트라우마</small><strong id="mTrauma">1.00</strong></div><div class="m"><small>카메라 최대 오프셋</small><strong id="mOffset">18.0 px</strong></div><div class="m"><small>채널 시작 오차</small><strong id="mSkew">83 ms</strong></div><div class="m"><small>감각 과부하</small><strong id="mLoad">위험</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,hits:7,intensity:72,sync:false,reduce:false,t:0};
const names=['각 채널을 따로 최대 출력','타격 반대 방향으로 카메라 반동','트라우마 누적·상한·감쇠','감각별 강도와 파형 분리','하나의 ImpactEvent로 프레임 정렬','멀미 완화·화면 밖 LOD'],status=['카메라·VFX·진동·소리가 서로 다른 박자','랜덤 진동이 아닌 읽을 수 있는 반동','연타가 쌓여도 제곱 곡선과 상한으로 포화','카메라=저주파 · 진동=저주파+짧은 고주파','같은 강도·방향·프레임을 네 채널에 발행','피해 정보는 유지하고 흔들림만 줄임'];
const desc=['<b>실패 재현:</b> 매 타격마다 랜덤 카메라, 큰 스파크, 100% 진동과 소리를 제각각 재생하면 연타에서 전부 겹쳐 화면과 손이 지칩니다.','<b>방향을 가진 반동:</b> 카메라는 타격 방향의 반대로 짧게 밀렸다가 감쇠합니다. 랜덤 고주파 떨림보다 어디서 맞았는지 읽히고 멀미가 줄어듭니다.','<b>연타 포화:</b> hit마다 trauma를 더하되 1에서 자르고, 실제 흔들림은 trauma²로 계산한 뒤 매 프레임 감쇠합니다. 타격 수를 올려도 무한 합산되지 않습니다.','<b>같은 숫자를 쓰지 않습니다:</b> 카메라는 묵직한 저주파, 진동은 긴 저주파와 짧은 고주파, VFX는 충돌 방향 원뿔, 사운드는 둔한 어택으로 매핑합니다.','<b>한 번만 발행:</b> ImpactEvent가 프레임·위치·방향·강도를 담아 네 채널에 동시에 배포합니다. 동기화 토글로 80ms 넘던 시작 오차가 사라지는지 보세요.','<b>정보는 남기고 자극은 줄이기:</b> 흔들림 완화는 카메라 오프셋과 진동만 낮추고 방향 VFX는 유지합니다. 화면 밖·작은 타격은 예산에서 제외합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const directional=S.step>=1,traumaOn=S.step>=2,mapped=S.step>=3,synced=S.step>=4&&S.sync,reduced=S.step>=5&&S.reduce,raw=S.hits*S.intensity/180,trauma=traumaOn?Math.min(1,raw):Math.min(1,raw*1.7),offset=(directional?11:18)*(traumaOn?trauma*trauma:trauma)*(reduced?.28:1),skew=synced?0:mapped?46:83,load=reduced?'낮음':S.hits>8||offset>14?'위험':mapped?'보통':'높음';return{directional,traumaOn,mapped,synced,reduced,trauma,offset,skew,load}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),pulse=(S.t%80)/80,hit=pulse<.16,amp=hit?(1-pulse/.16)*v.offset:v.offset*Math.max(0,1-pulse)*.24,dx=v.directional?-amp:Math.sin(S.t*2.7)*amp,dy=v.directional?amp*.18:Math.cos(S.t*3.1)*amp*.65;x.fillStyle='#0d1924';x.fillRect(0,0,w,h);const vx=w*.08+dx,vy=h*.17+dy,vw=w*.54,vh=h*.62;x.fillStyle='#142837';x.fillRect(vx,vy,vw,vh);x.strokeStyle=v.reduced?'#8ce3ae':'#60778c';x.lineWidth=3;x.strokeRect(vx,vy,vw,vh);for(let i=0;i<8;i++)line(vx+i*vw/7,vy+vh*.15,vx+i*vw/7-55,vy+vh*.45,'#294355',2);
const cx=vx+vw*.64,cy=vy+vh*.54;line(vx+vw*.22,cy,vx+vw*.55,cy,'#72ceff',12);x.fillStyle='#ffd06e';x.beginPath();x.arc(cx,cy,32,0,7);x.fill();if(hit){for(let i=0;i<(v.mapped?9:18);i++){const a=v.mapped?Math.PI+(i-4)*.12:i/18*Math.PI*2,r=40+((i*17)%70);line(cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,v.mapped?'#8ce3ae':'#ff7f78',3)}}label(v.directional?'CAMERA KICK ← HIT DIRECTION':'RANDOM POSITION NOISE',vx+vw*.50,vy+28,v.directional?'#8ce3ae':'#ff7f78','center');
const px=w*.70,py=h*.18,pw=w*.25;label(S.step>=4?'IMPACT EVENT BUS':'SEPARATE TRIGGERS',px+pw*.5,py-14,S.step>=4?'#8ce3ae':'#ff7f78','center');const rows=[['CAMERA',v.directional?'LOW FREQ KICK':'RANDOM'],['VFX',v.mapped?'DIRECTION CONE':'FULL BURST'],['RUMBLE',v.mapped?'LOW + SHORT HIGH':'100%'],['SOUND',v.mapped?'DULL ATTACK':'LOUD']];rows.forEach((r,i)=>{const y=py+i*h*.12,xs=px+(v.synced?0:(i%2?18:-12));x.fillStyle=i===0?'#72ceff':i===1?'#8ce3ae':i===2?'#ffd06e':'#c5b5ff';x.fillRect(xs,y,8,28);label(r[0],xs+18,y+12,'#9aaabf');label(r[1],xs+pw*.48,y+12,'#f5f8fc');if(S.step>=4)line(px-32,py+h*.18, xs,y+14,'#52677b',1,[4,4])});
if(S.step>=2){const gy=h*.85,gx=w*.10,gw=w*.53;line(gx,gy,gx+gw,gy,'#52677b',2);x.fillStyle='#8ce3ae';x.fillRect(gx,gy-8,gw*v.trauma,16);label(`trauma ${v.trauma.toFixed(2)} → shake ${Math.pow(v.trauma,2).toFixed(2)}`,gx+gw*.5,gy-17,'#8ce3ae','center');for(let i=0;i<S.hits;i++){const hx=gx+gw*(i+1)/(S.hits+1);line(hx,gy+12,hx,gy+22,'#ffd06e',2)}}if(S.step>=5)label(v.reduced?'REDUCED MOTION · CAMERA ×0.28 · VFX KEPT':'FULL MOTION',w*.76,h*.80,v.reduced?'#8ce3ae':'#ffd06e','center');c.dataset.hit=String(hit)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('sync').setAttribute('aria-pressed',String(S.sync));$('reduce').setAttribute('aria-pressed',String(S.reduce));const v=vals();$('mTrauma').textContent=v.trauma.toFixed(2);$('mOffset').textContent=v.offset.toFixed(1)+' px';$('mSkew').textContent=v.skew+' ms';$('mLoad').textContent=v.load;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.sync=S.step>=4;S.reduce=S.step>=5;S.t=0;update()});$('hits').oninput=e=>{S.hits=+e.target.value;$('hitsOut').textContent=S.hits+' hits';S.t=0;update()};$('intensity').oninput=e=>{S.intensity=+e.target.value;$('intensityOut').textContent=S.intensity+'%';S.t=0;update()};$('sync').onclick=()=>{S.sync=!S.sync;update()};$('reduce').onclick=()=>{S.reduce=!S.reduce;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
