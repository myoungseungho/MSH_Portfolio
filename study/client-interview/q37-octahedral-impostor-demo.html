<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q37 옥타헤드럴 임포스터 단계형 실험실</title>
<style>
:root{--bg:#08100e;--panel:#111f1a;--line:#2d473b;--ink:#f3fff8;--muted:#98b0a2;--view:#74dfad;--sun:#ffd27f;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#172b26}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#08100edd}.hud b{color:var(--view)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#557866}button:focus-visible,input:focus-visible{outline:2px solid var(--view);outline-offset:2px}button[aria-pressed=true]{background:var(--view);border-color:var(--view);color:#06140e}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--view);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--view)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758f80;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="카메라 추적 빌보드에서 각도별 옥타헤드럴 캡처, 뷰 블렌딩, 노멀·깊이 리라이팅과 메시 전환까지 쌓는 원경 나무"></canvas><div class="hud"><span>Q37 · <b id="stage">카메라 추적 빌보드 1장</b></span><span id="status">나를 따라 회전</span></div></div>
<div class="steps" role="group" aria-label="임포스터 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>한 장 빌보드</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>옥타 캡처 아틀라스</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>프레임 스냅 실패</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>인접 뷰 블렌딩</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>노멀·깊이 리라이팅</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>메시↔임포스터 페이드</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="orbit">카메라 궤도각</label><output id="orbitOut">22°</output></div><input id="orbit" type="range" min="-180" max="180" value="22"></div><div><div class="ct"><label for="sunAngle">태양 방향</label><output id="sunAngleOut">35°</output></div><input id="sunAngle" type="range" min="-90" max="90" value="35"></div><div class="toggles" role="group" aria-label="뷰 블렌딩과 현재 광원 재조명 옵션"><button id="blend" aria-pressed="false">인접 뷰 블렌딩</button><button id="relight" aria-pressed="false">현재 광원 리라이팅</button></div></div>
<div class="metrics"><div class="m"><small>사용 캡처 뷰</small><strong id="mViews">1</strong></div><div class="m"><small>각도 스냅 오차</small><strong id="mSnap">0°</strong></div><div class="m"><small>광원 불일치</small><strong id="mLight">48%</strong></div><div class="m"><small>표현 삼각형</small><strong id="mTris">2</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,orbit:22,sun:35,blend:false,relight:false},names=['single camera-facing billboard','8×8 octahedral capture atlas','nearest discrete atlas frame','2-view angular interpolation','normal/depth runtime relighting','mesh / impostor dither transition'],desc=['<b>문제 재현:</b> 정면 나무 한 장을 항상 카메라 쪽으로 돌리면 궤도각을 바꿔도 실루엣이 그대로라 나무 자체가 플레이어를 따라 도는 종이판처럼 보입니다.','<b>방향별 사진첩:</b> 구를 옥타헤드럴 격자로 펼쳐 8×8 방향의 색·노멀·깊이를 미리 저장합니다. 현재 시선에 가장 가까운 프레임에서 각도별 실루엣을 꺼냅니다.','<b>이산 프레임의 대가:</b> 최근접 한 칸만 고르면 궤도각이 22.5° 경계를 넘을 때 실루엣이 한 번에 바뀝니다. 슬라이더를 천천히 움직여 스냅 오차를 확인하세요.','<b>프레임 사이를 연속으로:</b> 현재 방향을 감싸는 인접 2개 뷰를 각도 가중으로 섞어 실루엣·깊이가 부드럽게 회전합니다.','<b>스냅샷이 아니라 재료:</b> 아틀라스의 노멀·깊이·알베도를 현재 태양 방향으로 다시 조명해 노을·밤에도 주변 메시와 같은 빛을 받습니다.','<b>가까워질 때도 숨김:</b> 실제 메시와 임포스터를 짧은 디더 크로스페이드로 겹쳐 TAA가 전환을 녹입니다. 먼 표현은 2삼각형, 근경은 메시로 자연스럽게 승격합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function nearest(){return Math.round(S.orbit/45)*45}function tag(t,px,py,co='#f3fff8'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(4,12,8,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function tree(cx,base,size,a,alpha=1){const rad=a*Math.PI/180,side=Math.sin(rad),front=Math.cos(rad),lit=S.relight&&S.step>=4?Math.max(.18,.5+.5*Math.cos((S.sun-a)*Math.PI/180)):.76;x.save();x.globalAlpha=alpha;x.fillStyle=`rgb(${70*lit|0},${105*lit|0},${57*lit|0})`;x.fillRect(cx-size*.06,base-size*.58,size*.12,size*.58);const lobes=[[-.22,-.56,.25], [.10,-.68,.29], [.28,-.47,.23],[-.05,-.40,.31]];for(let i=0;i<lobes.length;i++){let [ox,oy,r]=lobes[i],depth=(i%2?front:-front),px=cx+(ox+side*(.18+depth*.08))*size,py=base+(oy+depth*.035)*size;x.fillStyle=`rgb(${Math.max(15,(53+depth*20)*lit)|0},${Math.max(28,(126+depth*24)*lit)|0},${Math.max(18,(62+depth*12)*lit)|0})`;x.beginPath();x.ellipse(px,py,r*size*(.72+Math.abs(front)*.28),r*size,0,0,7);x.fill()}x.restore()}
function atlas(w,h){const ox=w*.06,oy=h*.18,s=18;x.strokeStyle='rgba(116,223,173,.45)';for(let j=0;j<8;j++)for(let i=0;i<8;i++){x.strokeRect(ox+i*s,oy+j*s,s-2,s-2);let idx=j*8+i,sel=Math.abs(((idx%8)*45-180)-nearest())<23;x.fillStyle=sel?'#74dfad':'rgba(116,223,173,.18)';x.fillRect(ox+i*s+4,oy+j*s+4,s-10,s-10)}tag('8×8 OCTAHEDRAL DIRECTIONS',ox,oy-10,'#74dfad')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.58,base=h*.82,size=h*.62,discrete=S.step>=1&&!S.blend,angle=S.step===0?0:discrete?nearest():S.orbit;x.fillStyle='#5c7d87';x.fillRect(0,0,w,h);x.fillStyle='#385b38';x.fillRect(0,h*.72,w,h*.28);if(S.step>=1)atlas(w,h);if(S.blend&&S.step>=3){const lo=Math.floor(S.orbit/45)*45,hi=lo+45,t=(S.orbit-lo)/45;tree(cx,base,size,lo,1-t);tree(cx,base,size,hi,t)}else tree(cx,base,size,angle);if(S.step===0){x.strokeStyle='#ff8179';x.lineWidth=2;x.setLineDash([5,4]);x.beginPath();x.arc(cx,base-size*.45,size*.46,0,7);x.stroke();x.setLineDash([]);tag(`CAMERA ${S.orbit}° · BILLBOARD ROTATES TO FACE`,w*.38,h*.18,'#ff8179')}if(S.step>=1)tag(`CAPTURE VIEW ${nearest()}°`,w*.47,h*.16,'#74dfad');if(S.step===2)tag(`NEAREST ONLY · SNAP ERROR ${Math.abs(S.orbit-nearest())}°`,w*.48,h*.88,'#ff8179');if(S.blend&&S.step>=3)tag('2 ADJACENT VIEWS · ANGULAR BLEND',w*.44,h*.89,'#f3fff8');if(S.step>=4){const sunX=w*(.65+S.sun/250);x.fillStyle='#ffd27f';x.beginPath();x.arc(sunX,h*.12,12,0,7);x.fill();tag(S.relight?'NORMAL+DEPTH → CURRENT SUN':'BAKED DAYLIGHT · MISMATCH',w*.48,h*.24,S.relight?'#ffd27f':'#ff8179')}if(S.step>=5){x.globalAlpha=.18;x.strokeStyle='#f3fff8';for(let i=0;i<34;i++){let a=i/34*Math.PI*2,r=size*(.2+.22*(i%4)/3),px=cx+Math.cos(a)*r,py=base-size*.48+Math.sin(a)*r;x.beginPath();x.moveTo(cx,base-size*.22);x.lineTo(px,py);x.stroke()}x.globalAlpha=1;for(let y=0;y<h;y+=8)for(let xx=(y/8)%2?0:4;xx<w;xx+=8){x.fillStyle='rgba(240,255,246,.10)';x.fillRect(xx,y,3,3)}tag('MESH 50% ↔ IMPOSTOR 50% · TAA DITHER',w*.39,h*.95,'#91e2b4')}}
function metrics(){const snap=S.step<1?0:Math.abs(S.orbit-nearest()),views=S.blend&&S.step>=3?2:1,light=S.relight&&S.step>=4?0:Math.min(100,Math.abs(S.sun-15)*1.2+24);$('mViews').textContent=views;$('mSnap').textContent=(S.blend&&S.step>=3?'0':snap)+'°';$('mLight').textContent=Math.round(light)+'%';$('mTris').textContent=S.step>=5?'2 ↔ 48K':'2'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['나를 따라 회전','각도별 실루엣','경계에서 프레임 점프','부드러운 시점 변화','시간대 빛 일치','전환 팝 제거'][S.step];$('explain').innerHTML=desc[S.step];$('blend').setAttribute('aria-pressed',String(S.blend));$('relight').setAttribute('aria-pressed',String(S.relight));metrics();draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.blend=S.step>=3;S.relight=S.step>=4;ui()});$('orbit').oninput=e=>{S.orbit=+e.target.value;$('orbitOut').textContent=e.target.value+'°';ui()};$('sunAngle').oninput=e=>{S.sun=+e.target.value;$('sunAngleOut').textContent=e.target.value+'°';ui()};$('blend').onclick=()=>{S.blend=!S.blend;ui()};$('relight').onclick=()=>{S.relight=!S.relight;ui()};ui();addEventListener('resize',draw)})();
</script></body></html>
