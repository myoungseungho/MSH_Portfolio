<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q88 입력 지연 실험실</title><style>
:root{--bg:#0a0d14;--panel:#131923;--line:#384356;--ink:#f6f7fa;--muted:#a0abba;--cyan:#71d6ff;--green:#80e0a4;--gold:#ffd06c;--red:#ff807a;--violet:#bca0ff}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#101722}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#060910df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8591a2;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="버튼 입력이 장치 폴링, 시뮬레이션, 렌더 스레드, GPU, 프레젠트, 스캔아웃을 지나 픽셀로 도착하는 지연 사슬 실험"></canvas><div class="hud"><span>Q88 · <b id="stage">프레임 맨 앞에서 입력 읽기</b></span><span id="status">입력이 여러 단계와 대기 큐를 지나 뒤늦게 픽셀로 도착</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>순진한 파이프라인</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>버튼→픽셀 측정</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>큐 깊이 확인</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>큐 1의 버블</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>늦은 샘플·Reflex</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>프레임 예산</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="queue">Frames in flight</label><output id="queueOut">3장</output></div><input id="queue" type="range" min="1" max="4" value="3"></div><div><div class="ct"><label for="load">GPU 부하</label><output id="loadOut">72%</output></div><input id="load" type="range" min="30" max="100" value="72"></div><div class="toggles"><button id="late" aria-pressed="false">늦은 입력 샘플</button><button id="reflex" aria-pressed="false">동적 시작 제어</button></div></div>
<div class="metrics"><div class="m"><small>버튼→픽셀</small><strong id="mTotal">89 ms</strong></div><div class="m"><small>입력 표본 나이</small><strong id="mAge">16 ms</strong></div><div class="m"><small>GPU 활용률</small><strong id="mUtil">96%</strong></div><div class="m"><small>처리량</small><strong id="mFps">60 fps</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,queue:3,load:.72,late:false,reflex:false};const names=['프레임 맨 앞에서 입력 읽기','버튼부터 픽셀까지 마커로 측정','미리 쌓인 프레임 찾기','큐를 1장으로 강제','마지막 순간 입력 + 동적 CPU 시작','게임·렌더·GPU 예산을 한 프레임에'];const stats=['입력이 여러 단계와 대기 큐를 지나 뒤늦게 픽셀로 도착','감으로 고치지 않고 각 마디의 ms를 분리','큐 한 장마다 약 16.6ms의 오래된 입력이 추가','지연은 줄지만 CPU↔GPU 빈틈으로 처리량 손실','큐는 얕게, GPU는 굶기지 않는 시작 시점 선택','입력 직결 경로가 16.6ms 예산을 넘지 않게 우선'];const desc=['<b>지연은 합계입니다:</b> 장치 폴링→게임 시뮬→렌더 명령→GPU→프레젠트→스캔아웃이 모두 더해집니다. 60fps라는 숫자만 같아도 큐가 깊으면 손은 늦게 따라옵니다.','<b>먼저 측정:</b> 버튼 순간과 실제 픽셀 변화를 표시하고 각 스레드에 마커를 심습니다. 그래프에서 어느 구간과 대기열이 가장 긴지 직접 읽습니다.','<b>Frames in flight:</b> CPU가 GPU보다 여러 프레임 앞서면 활용률은 높지만 화면은 오래된 입력을 보여줍니다. 큐 슬라이더를 늘려 총 지연이 한 프레임씩 증가하는 것을 보세요.','<b>깊이만 자른 반쪽 해법:</b> 큐 1장은 오래된 프레임을 없애지만 GPU 작업 사이에 빈 버블이 생깁니다. 부하가 높을수록 처리량 손실이 커집니다.','<b>늦은 샘플링 + Reflex류 제어:</b> 시뮬 직전에 최신 입력을 읽고 GPU가 끝날 시점에 CPU를 출발시켜, 큐는 얕게 유지하면서 GPU의 빈 시간을 줄입니다. 두 버튼을 꺼 차이를 비교하세요.','<b>예산이 최종 방어선:</b> 게임·렌더·GPU가 각자 예산 안에 들고 카메라·조준·발사를 우선 처리해야 지연이 다음 프레임으로 밀리지 않습니다. GPU 부하를 올려 예산 초과를 확인하세요.'];
function calc(){let q=S.step<2?3:S.step===3?1:S.queue,base=19+S.load*22,age=S.late&&S.step>=4?2:16,total=base+q*16.6+age,util=Math.min(99,65+q*11),fps=60;if(S.step===3){util=Math.round(70+S.load*15);fps=Math.round(60-(S.load-.3)*18)}if(S.step>=4&&S.reflex){q=1;util=Math.round(91+S.load*7);total=base+9+age;fps=S.load>.92?54:60}if(S.step===5&&S.load>.82){let over=(S.load-.82)*95;total+=over;fps=Math.round(60-over*.7)}return{q,total,age,util,fps}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),labels=['POLL','GAME','RENDER','QUEUE','GPU','PRESENT','SCANOUT'],colors=['#71d6ff','#80e0a4','#bca0ff','#ff807a','#ffd06c','#71d6ff','#80e0a4'],weights=[7,12,13,V.q*16.6,18+S.load*10,8,9],sum=weights.reduce((a,b)=>a+b,0),left=w*.05,right=w*.95,y=h*.29,bh=h*.22;x.fillStyle='#101722';x.fillRect(0,0,w,h);let px=left;for(let i=0;i<labels.length;i++){let ww=(right-left)*weights[i]/sum;x.fillStyle=colors[i]+'bb';x.fillRect(px,y,ww-3,bh);x.fillStyle='#081019';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(labels[i],px+6,y+20);x.fillText(weights[i].toFixed(0)+'ms',px+6,y+38);px+=ww}x.strokeStyle='#8a9aae';x.beginPath();x.moveTo(left,h*.65);x.lineTo(right,h*.65);x.stroke();let inputX=left+(S.late&&S.step>=4?(right-left)*.17:0);x.fillStyle='#71d6ff';x.beginPath();x.arc(inputX,h*.65,7,0,Math.PI*2);x.fill();x.fillText('BUTTON',inputX-18,h*.71);x.fillStyle='#80e0a4';x.beginPath();x.arc(right,h*.65,7,0,Math.PI*2);x.fill();x.fillText('PIXEL',right-15,h*.71);x.fillStyle='#f5f7fb';x.font='600 12px ui-monospace,Consolas,monospace';x.fillText(`${Math.round(V.total)} ms`,(inputX+right)/2-20,h*.61);if(S.step===3&&!S.reflex){x.fillStyle='#ff807a';x.fillRect(w*.47,h*.76,w*.13,h*.055);x.fillStyle='#f5f7fb';x.fillText('GPU BUBBLE',w*.485,h*.8)}$('mTotal').textContent=Math.round(V.total)+' ms';$('mAge').textContent=V.age+' ms';$('mUtil').textContent=V.util+'%';$('mFps').textContent=V.fps+' fps';c.dataset.total=Math.round(V.total);c.dataset.age=V.age;c.dataset.util=V.util;c.dataset.fps=V.fps;c.dataset.queue=V.q}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('late').setAttribute('aria-pressed',String(S.late));$('reflex').setAttribute('aria-pressed',String(S.reflex));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.late=S.step>=4;S.reflex=S.step>=4;S.queue=S.step===3?1:3;$('queue').value=S.queue;$('queueOut').textContent=S.queue+'장';update()});$('queue').oninput=e=>{S.queue=+e.target.value;$('queueOut').textContent=e.target.value+'장';draw()};$('load').oninput=e=>{S.load=+e.target.value/100;$('loadOut').textContent=e.target.value+'%';draw()};$('late').onclick=()=>{S.late=!S.late;update()};$('reflex').onclick=()=>{S.reflex=!S.reflex;update()};update();addEventListener('resize',draw)})();
</script></body></html>
