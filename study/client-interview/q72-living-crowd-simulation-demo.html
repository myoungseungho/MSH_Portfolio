<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q72 살아 있는 군중 시뮬레이션 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="동일한 개별 캐릭터 군중에서 인스턴싱과 VAT, 시드 변주, 플로우필드, 공간 분할 RVO와 근접 승격까지 발전하는 군중 시뮬레이션"></canvas><div class="hud"><span>Q72 · <b id="stage">수백 개별 캐릭터 액터</b></span><span id="status">비싸고 모두 같은 위상으로 걸음</span></div></div>
<div class="steps" role="group" aria-label="살아 있는 군중 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>개별 복제 액터</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>인스턴싱·VAT</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>시드 변주</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>플로우필드</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>공간분할 RVO</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>근접 승격·반응</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="density">광장 군중 수</label><output id="densityOut">500명</output></div><input id="density" type="range" min="100" max="1000" step="100" value="500"></div><div><div class="ct"><label for="proximity">플레이어 접근 거리</label><output id="proximityOut">8 m</output></div><input id="proximity" type="range" min="1" max="20" value="8"></div><div class="toggles"><button id="avoid" aria-pressed="false">RVO 회피</button><button id="react" aria-pressed="false">놀람 이벤트</button></div></div>
<div class="metrics"><div class="m"><small>군중 드로우콜</small><strong id="mDraw">500</strong></div><div class="m"><small>이웃 쌍 검사 / frame</small><strong id="mPairs">124,750</strong></div><div class="m"><small>예상 겹침 개체</small><strong id="mOverlap">96명</strong></div><div class="m"><small>풀 액터로 승격</small><strong id="mPromoted">0명</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,density:500,proximity:8,avoid:false,react:false,t:0};
const names=['수백 개별 캐릭터 액터','GPU 인스턴싱·VAT 표현','시드로 외형·위상·속도 변주','플로우필드로 거시 동선 분리','공간 타일 안에서만 RVO 회피','플레이어 주변만 진짜 액터로 승격'],status=['비싸고 모두 같은 위상으로 걸음','렌더 비용은 낮지만 아직 복제 군단','같은 데이터가 서로 다르게 보임','노점·출구에 따라 각자 다른 큰 흐름','가까운 이웃만 예측해 미리 비켜 감','충돌·대화·놀람은 근접 소수가 담당'];
const desc=['<b>두 문제를 동시에 재현:</b> 캐릭터 액터를 그대로 복제하면 드로우콜·애님 평가가 늘고 모두 같은 위상으로 걸어 복제 티가 납니다.','<b>표현 비용부터 제거:</b> 메시를 인스턴싱하고 반복 클립을 VAT로 재생해 개체당 CPU 렌더 비용을 트랜스폼 수준으로 낮춥니다.','<b>시드 하나로 조합 폭발:</b> 상·하의 색, 키, 걷기 클립, 재생 속도와 위상을 인스턴스별로 흩뿌려 데이터 증가 없이 외형을 분산합니다.','<b>거시 판단은 필드로:</b> 출구와 노점이 만든 방향장을 따라 각자 다른 레인을 선택합니다. 개별 경로 탐색 없이 광장의 흐름이 생깁니다.','<b>미시 회피는 이웃만:</b> 공간 그리드로 같은·인접 타일의 이웃만 찾고 RVO가 충돌 예상 속도를 미리 꺾습니다. 전수 쌍 검사를 피합니다.','<b>가까운 소수만 진짜:</b> 플레이어 반경 안 개체는 캡슐·애님 그래프·반응을 가진 풀 액터로 승격하고, 멀어지면 위상 보존 크로스페이드로 강등합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const inst=S.step>=1,varied=S.step>=2,flow=S.step>=3,rvo=S.step>=4&&S.avoid,promote=S.step>=5,pairs=rvo?Math.round(S.density*7.2):S.step>=4?Math.round(S.density*(S.density-1)/2):Math.round(S.density*(S.density-1)/2),promoted=promote?Math.min(36,Math.round(S.proximity*S.proximity*.22)):0,overlap=rvo?Math.max(2,Math.round(S.density*.018)):Math.round(S.density*(flow?.14:.192)),draw=inst?2+promoted:S.density;return{inst,varied,flow,rvo,promote,pairs,promoted,overlap,draw}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),px=w*.50,py=h*.52,plazaX=w*.05,plazaY=h*.16,plazaW=w*.90,plazaH=h*.66;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#172c36';x.fillRect(plazaX,plazaY,plazaW,plazaH);x.strokeStyle='#52677b';x.strokeRect(plazaX,plazaY,plazaW,plazaH);if(S.step===0)label(`${S.density.toLocaleString()} CPU ACTORS · SYNC PHASE`,w*.5,plazaY+22,'#ff7f78');else if(S.step===1)label('2 DRAWS · GPU INSTANCES · VAT',w*.5,plazaY+22,'#8ce3ae');if(v.flow){for(let gy=0;gy<4;gy++)for(let gx=0;gx<8;gx++){const ax=plazaX+55+gx*(plazaW-110)/7,ay=plazaY+45+gy*(plazaH-90)/3,dir=gx<4?-.38:.38;line(ax,ay,ax+28,ay+dir*28,'rgba(112,206,255,.38)',2);x.fillStyle='rgba(112,206,255,.38)';x.beginPath();x.arc(ax+28,ay+dir*28,3,0,7);x.fill()}label('FLOW FIELD · STALLS ← → EXITS',w*.5,plazaY+22,'#70ceff')}if(S.step>=4){const cell=plazaW/8;x.strokeStyle='rgba(255,208,110,.20)';x.lineWidth=1;for(let i=1;i<8;i++){line(plazaX+i*cell,plazaY,plazaX+i*cell,plazaY+plazaH,'rgba(255,208,110,.20)',1)}for(let i=1;i<4;i++)line(plazaX,plazaY+i*plazaH/4,plazaX+plazaW,plazaY+i*plazaH/4,'rgba(255,208,110,.20)',1);label(v.rvo?'LOCAL NEIGHBORS → RVO':'GRID BUILT · RVO OFF',w*.82,plazaY+plazaH-10,v.rvo?'#8ce3ae':'#ff7f78')}
const reps=72;for(let i=0;i<reps;i++){const seed=(i*73)%97,baseX=plazaX+24+(seed%12)*(plazaW-48)/11,baseY=plazaY+38+Math.floor(seed/12)*(plazaH-76)/7,phase=v.varied?S.t*.04+i*.61:S.t*.04,dir=v.flow?(i%3-1)*.28:0,avoidOffset=v.rvo?Math.sin(i*2.1+S.t*.02)*7:0,cx=baseX+Math.sin(phase*.22)*18+avoidOffset,cy=baseY+Math.sin(phase)*4+dir*22,promoted=v.promote&&Math.hypot(cx-px,cy-py)<S.proximity*8,color=promoted?'#ffd06e':v.varied?`hsl(${185+(i*31)%90} 68% ${58+(i%3)*5}%)`:'#70ceff';x.fillStyle=color;x.beginPath();x.arc(cx,cy-7,4.5,0,7);x.fill();x.fillRect(cx-2.5,cy-2,5,13);if(promoted){x.strokeStyle='#ffd06e';x.beginPath();x.arc(cx,cy,10,0,7);x.stroke()}if(S.react&&promoted){line(cx,cy-14,cx+(cx-px)*.25,cy-27,'#ff7f78',2);x.fillStyle='#ff7f78';x.beginPath();x.arc(cx+(cx-px)*.25,cy-27,2.5,0,7);x.fill()}}
x.fillStyle='#f5f8fc';x.beginPath();x.arc(px,py-10,9,0,7);x.fill();x.fillRect(px-4,py-1,8,24);if(v.promote){x.strokeStyle='#ffd06e';x.setLineDash([6,4]);x.beginPath();x.arc(px,py,S.proximity*8,0,7);x.stroke();x.setLineDash([]);label(`PROMOTION RADIUS ${S.proximity}m`,px,Math.min(plazaY+plazaH-30,py+S.proximity*8+22),'#ffd06e')}label(S.react?'LOCAL REACTION: FLEE':'PLAYER',px,py-31,S.react?'#ff7f78':'#f5f8fc')
$('mDraw').textContent=v.draw.toLocaleString();$('mPairs').textContent=v.pairs.toLocaleString();$('mOverlap').textContent=v.overlap+'명';$('mPromoted').textContent=v.promoted+'명';c.dataset.pairs=v.pairs;c.dataset.promoted=v.promoted}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('avoid').setAttribute('aria-pressed',String(S.avoid));$('react').setAttribute('aria-pressed',String(S.react));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.avoid=S.step>=4;S.react=S.step>=5;S.t=0;update()});$('density').oninput=e=>{S.density=+e.target.value;$('densityOut').textContent=S.density.toLocaleString()+'명';update()};$('proximity').oninput=e=>{S.proximity=+e.target.value;$('proximityOut').textContent=S.proximity+' m';update()};$('avoid').onclick=()=>{S.avoid=!S.avoid;update()};$('react').onclick=()=>{S.react=!S.react;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
