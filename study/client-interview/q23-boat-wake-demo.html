<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q23 파도·항적·거품 단계형 실험실</title>
<style>
:root{--bg:#080d13;--panel:#111a25;--line:#2a3a4c;--ink:#edf4fa;--muted:#93a6ba;--cyan:#62d7e7;--foam:#eef8ef;--amber:#ffd06b;--red:#ff7178}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#07101a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#061316}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6d8197;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="스크롤 노멀에서 기어스트너 수면 형상, 렌더타겟 웨이크 기록·확산과 형상 기반 거품까지 쌓는 배 항적 단계"></canvas><div class="hud"><span>Q23 · <b id="stage">스크롤 노멀 수면</b></span><span id="status">반짝임만 이동</span></div></div>
<div class="steps" role="group" aria-label="파도와 항적 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>노멀만 스크롤</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>기어스트너 형상</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>상호작용 없음</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>웨이크 스탬프</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>확산·감쇠·앵커</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>형상 기반 거품</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="amp">앰비언트 파도 진폭</label><output id="ampOut">45 cm</output></div><input id="amp" type="range" min="0" max="100" value="45"></div><div><div class="ct"><label for="speed">배 속도</label><output id="speedOut">12 kn</output></div><input id="speed" type="range" min="0" max="24" value="12"></div><div class="toggles" role="group" aria-label="항적 기록과 거품 생애 옵션"><button id="wake" aria-pressed="false">웨이크 기록</button><button id="foam" aria-pressed="false">거품 생성·소멸</button></div></div>
<div class="metrics"><div class="m"><small>수면 실루엣 변위</small><strong id="mHeight">0 cm</strong></div><div class="m"><small>V자 항적 길이</small><strong id="mWake">0 m</strong></div><div class="m"><small>기록 임펄스</small><strong id="mStamp">0</strong></div><div class="m"><small>활성 거품 면적</small><strong id="mFoam">0%</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,amp:.45,speed:12,wake:false,foam:false},names=['스크롤 노멀 수면','Gerstner 정점 변위','앰비언트 파도만','렌더타겟 임펄스','월드 앵커 확산·감쇠','웨이크·마루·교차 폼'];
const desc=['<b>문제 재현:</b> 노멀맵을 스크롤하면 빛 반짝임은 움직이지만 수면 실루엣은 평평하고 배가 지나가도 아무 흔적이 없습니다. 형상과 상호작용이 모두 빠졌습니다.','<b>앰비언트 형상:</b> 방향·파장·진폭이 다른 기어스트너 파를 합성해 정점을 위아래뿐 아니라 마루 쪽으로 모읍니다. 뾰족한 마루와 넓은 골이 실루엣까지 만듭니다.','<b>문제 분리:</b> 절차적 파도는 아무도 없어도 반복될 뿐 배의 위치와 시간을 기억하지 못합니다. 배를 놓아도 물은 그 아래를 그대로 통과합니다.','<b>국소 사건 기록:</b> 카메라 주변 수면 렌더타겟에 뱃머리와 선체가 V자 임펄스를 매 프레임 찍습니다. 발·투사체도 같은 높이·노멀 버퍼에 다른 크기의 스탬프만 남기면 됩니다.','<b>기억의 진화:</b> 이전 프레임 버퍼를 이웃으로 확산하고 감쇠해 항적이 넓어지며 사라지게 합니다. 버퍼 원점을 월드 격자에 스냅하고 근·원 캐스케이드로 나눠 카메라 이동에도 흔적을 유지합니다.','<b>거품은 결과:</b> 웨이크 강도, 접히는 파도 마루, 물체·지형 깊이 교차를 합쳐 폼 마스크를 만듭니다. 노이즈 디졸브·흐름·빛 반응으로 생성→이동→소멸 생애를 주면 스티커가 아닙니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#edf4fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function boat(cx,cy,scale=1){x.save();x.translate(cx,cy);x.fillStyle='#d69b58';x.beginPath();x.moveTo(32*scale,0);x.lineTo(-22*scale,-15*scale);x.lineTo(-31*scale,0);x.lineTo(-22*scale,15*scale);x.closePath();x.fill();x.fillStyle='#3c4650';x.fillRect(-8*scale,-8*scale,18*scale,16*scale);x.restore()}
function bufferInset(w,h){const ix=w*.72,iy=h*.08,iw=w*.23,ih=h*.27;x.fillStyle='#071019';x.fillRect(ix,iy,iw,ih);x.strokeStyle='#62d7e7';x.strokeRect(ix,iy,iw,ih);for(let i=0;i<9;i++){x.strokeStyle='rgba(98,215,231,.18)';x.beginPath();x.moveTo(ix+i*iw/8,iy+20);x.lineTo(ix+i*iw/8,iy+ih);x.moveTo(ix,iy+20+i*(ih-20)/8);x.lineTo(ix+iw,iy+20+i*(ih-20)/8);x.stroke()}x.strokeStyle='#ffd06b';x.lineWidth=3;x.beginPath();x.moveTo(ix+iw*.72,iy+ih*.52);x.lineTo(ix+iw*.16,iy+ih*.25);x.moveTo(ix+iw*.72,iy+ih*.52);x.lineTo(ix+iw*.16,iy+ih*.79);x.stroke();tag('WAKE RT · HEIGHT/NORMAL',ix+8,iy+15,'#62d7e7')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.55,cy=h*.51,length=S.wake?(70+S.speed*12):0,amp=S.step>=1?S.amp:0;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#0b4860');bg.addColorStop(1,'#06293d');x.fillStyle=bg;x.fillRect(0,0,w,h);
// ambient wave contour field
for(let i=0;i<21;i++){x.strokeStyle=`rgba(105,210,226,${S.step===0?.18:.10+amp*.18})`;x.lineWidth=S.step>=1&&i%5===0?2:1;x.beginPath();const yy=h*(.08+i*.044);x.moveTo(0,yy);for(let xx=0;xx<w;xx+=12){const a=S.step>=1?Math.sin(xx*.025+i*.8)*amp*9+Math.sin(xx*.011-i)*amp*5:Math.sin(xx*.035+i)*2;x.lineTo(xx,yy+a)}x.stroke()}
if(S.step===0){x.strokeStyle='#ff7178';x.lineWidth=3;x.beginPath();x.moveTo(w*.08,h*.82);x.lineTo(w*.36,h*.82);x.stroke();tag('FLAT GEOMETRY · NORMAL LIGHT ONLY',w*.08,h*.79,'#ff7178')}
if(S.step>=1){const ox=w*.07,oy=h*.20;x.strokeStyle='#ffd06b';x.lineWidth=2;x.beginPath();x.moveTo(ox,oy);for(let i=0;i<90;i++){const a=i/89*Math.PI*4,px=ox+i*2.3,py=oy-Math.sin(a)*amp*18-Math.max(0,Math.sin(a))*amp*8;x.lineTo(px,py)}x.stroke();tag('GERSTNER · SHARP CREST',ox,oy-28,'#ffd06b')}
boat(cx,cy);
if(S.step===2)tag('NO MEMORY · NO WAKE',cx-160,cy+70,'#ff7178');
if(S.step>=3)bufferInset(w,h);
if(S.wake&&S.step>=3){const raw=S.step===3;for(let i=0;i<Math.max(3,Math.round(S.speed*.7));i++){const t=i/Math.max(1,S.speed*.7),px=cx-28-t*length,spread=12+t*(42+S.speed*1.7),alpha=raw?.65:(1-t)*.56;x.strokeStyle=`rgba(130,225,236,${alpha})`;x.lineWidth=raw?5:2+3*(1-t);x.beginPath();x.moveTo(px,cy-spread);x.lineTo(px-14,cy-spread-4);x.moveTo(px,cy+spread);x.lineTo(px-14,cy+spread+4);x.stroke();if(raw){x.fillStyle='rgba(255,208,107,.54)';x.beginPath();x.arc(px,cy,4,0,7);x.fill()}}tag(raw?'RAW STAMPS · FRAME N':'PREV → DIFFUSE → DECAY',cx-length,cy-72,raw?'#ffd06b':'#62d7e7')}
if(S.step>=4){x.strokeStyle='#62d7e7';x.setLineDash([5,4]);x.strokeRect(w*.05,h*.09,w*.60,h*.80);x.setLineDash([]);tag('WORLD GRID SNAP · NEAR/FAR CASCADE',w*.06,h*.88,'#62d7e7')}
if(S.foam&&S.step>=5){for(let i=0;i<36;i++){const t=(i%18)/18,side=i<18?-1:1,px=cx-20-t*length,py=cy+side*(15+t*(43+S.speed*1.7)),r=2+(i%4)*.8;x.fillStyle=`rgba(238,248,239,${.82-t*.55})`;x.beginPath();x.arc(px+Math.sin(i*4)*5,py,r,0,7);x.fill()}for(let i=0;i<18;i++){const px=(i*97)%w,py=(i*53)%h;if(Math.sin(i*2.7)>.35){x.fillStyle='rgba(238,248,239,.36)';x.beginPath();x.ellipse(px,py,10,2,0,0,7);x.fill()}}tag('WAKE ∪ CREST ∪ DEPTH INTERSECTION',w*.38,h*.84,'#eef8ef');tag('NOISE DISSOLVE · FLOW · LIGHT',w*.07,h*.63,'#ffd06b')}}
function metrics(){const height=S.step>=1?S.amp*100:0,len=S.wake?Math.round((70+S.speed*12)*.34):0,stamps=S.wake&&S.step>=3?Math.max(3,Math.round(S.speed*.7)):0,foam=S.foam&&S.step>=5?Math.min(34,5+S.speed*.9+S.amp*10):0;$('mHeight').textContent=height.toFixed(0)+' cm';$('mWake').textContent=len+' m';$('mStamp').textContent=String(stamps);$('mFoam').textContent=foam.toFixed(0)+'%'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['반짝임만 이동','실루엣 마루·골','배 아래로 파도 통과','위치·시간을 기록','퍼지고 사라지는 흔적','형상에서 포말 파생'][S.step];$('wake').setAttribute('aria-pressed',String(S.wake));$('foam').setAttribute('aria-pressed',String(S.foam));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.wake=S.step>=3;S.foam=S.step===5;ui()});$('amp').oninput=e=>{S.amp=+e.target.value/100;$('ampOut').textContent=e.target.value+' cm';ui()};$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=e.target.value+' kn';ui()};$('wake').onclick=()=>{S.wake=!S.wake;ui()};$('foam').onclick=()=>{S.foam=!S.foam;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
