<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q33 골짜기 안개 걷힘 단계형 실험실</title>
<style>
:root{--bg:#081016;--panel:#121e25;--line:#30434e;--ink:#f2f8fb;--muted:#9aabb4;--fog:#b7d8dd;--sun:#ffd98e;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#223744}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081016dd}.hud b{color:var(--fog)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#61737c}button:focus-visible,input:focus-visible{outline:2px solid var(--fog);outline-offset:2px}button[aria-pressed=true]{background:var(--fog);border-color:var(--fog);color:#071318}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--fog);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--fog)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788b94;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="거리 안개에서 지수 높이 안개, froxel 덩어리·빛줄기와 시간대 곡선으로 능선부터 걷히는 골짜기 안개"></canvas><div class="hud"><span>Q33 · <b id="stage">거리 안개</b></span><span id="status">하늘과 골짜기가 똑같이 흐림</span></div></div>
<div class="steps" role="group" aria-label="골짜기 안개 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>거리 안개</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>지수 높이안개</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>균일 벽 실패</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>froxel·3D 노이즈</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>빛줄기·half-res</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>시간대 걷힘</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="time">시간대</label><output id="timeOut">05:30</output></div><input id="time" type="range" min="50" max="90" value="55"></div><div><div class="ct"><label for="density">기준 밀도</label><output id="densityOut">75%</output></div><input id="density" type="range" min="0" max="100" value="75"></div><div class="toggles" role="group" aria-label="3D 결 및 템포럴 옵션"><button id="noise" aria-pressed="false">3D 안개 결</button><button id="temporal" aria-pressed="false">half-res 템포럴</button></div></div>
<div class="metrics"><div class="m"><small>안개 상단</small><strong id="mTop">620 m</strong></div><div class="m"><small>능선 가시성</small><strong id="mRidge">35%</strong></div><div class="m"><small>골짜기 밀도</small><strong id="mValley">75%</strong></div><div class="m"><small>프레임당 스텝</small><strong id="mSteps">1</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,time:5.5,density:.75,noise:false,temporal:false,t:0},names=['distance color lerp','analytic exponential height fog','uniform height wall','froxel density + 3D noise','shadowed in-scattering + temporal','ToD density / top / threshold curves'],desc=['<b>문제 재현:</b> 픽셀 거리만으로 안개색을 섞으면 같은 거리의 하늘·능선·골짜기가 똑같이 흐리고, fog distance를 늘려도 화면 전체가 균일하게 옅어집니다.','<b>낮은 곳에 고임:</b> density=d0·exp(-falloff·height)를 시선에 적분해 골짜기 바닥은 짙고 능선은 안개 바다 위로 솟게 합니다.','<b>아날리틱의 한계:</b> 높이는 맞지만 매끈한 균일 벽이라 덩어리·이동·빛줄기가 없고 걷힐 때도 생명력 없이 투명도만 줄어듭니다.','<b>밀도를 셀마다 변조:</b> froxel 3D 그리드의 밀도를 월드 노이즈로 깎아 안개 패치와 틈이 흘러갑니다. 결 토글로 균일 높이안개와 비교하세요.','<b>빛과 비용을 함께:</b> 섀도우맵 가시성을 곱한 인스캐터링으로 아침 빛줄기를 만들고, half-res·지수 깊이 슬라이스·템포럴 누적으로 스텝을 줄입니다.','<b>연출이 아닌 상태 곡선:</b> 05→09시 슬라이더가 기준 밀도·상단 높이·노이즈 임계값을 함께 밀어 능선부터 걷히고 마지막에 마을이 드러납니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fb'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,13,18,.84)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}function ridge(base,amp,seed,w,h){x.beginPath();x.moveTo(0,h);for(let i=0;i<=60;i++){let px=i*w/60,py=base+Math.sin(i*.27+seed)*amp+Math.sin(i*.61+seed)*amp*.28;x.lineTo(px,py)}x.lineTo(w,h);x.closePath()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,height=S.step>=1,vol=S.step>=3,lit=S.step>=4,tod=S.step>=5,clear=tod?Math.max(0,Math.min(1,(S.time-5)/4)):0,d=S.density*(tod?1-clear*.82:1),top=h*(height?.52-clear*.18:.22);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,`rgb(${45+clear*75|0},${78+clear*70|0},${102+clear*75|0})`);sky.addColorStop(1,'#d8b985');x.fillStyle=sky;x.fillRect(0,0,w,h);const sx=w*(.62+clear*.14),sy=h*(.28-clear*.13);x.fillStyle='#ffd98e';x.beginPath();x.arc(sx,sy,13,0,7);x.fill();ridge(h*.45,h*.10,1,w,h);x.fillStyle='#3d5860';x.fill();ridge(h*.62,h*.13,3,w,h);x.fillStyle='#334c4d';x.fill();ridge(h*.78,h*.12,5,w,h);x.fillStyle='#263d38';x.fill();for(let i=0;i<7;i++){let px=w*(.42+i*.035),py=h*(.72+(i%2)*.025);x.fillStyle='#b49062';x.fillRect(px,py,10,14);x.fillStyle='#6f4939';x.beginPath();x.moveTo(px-3,py);x.lineTo(px+5,py-7);x.lineTo(px+13,py);x.fill()}if(height){const g=x.createLinearGradient(0,top,0,h);g.addColorStop(0,'rgba(192,217,218,0)');g.addColorStop(.28,`rgba(192,217,218,${d*.56})`);g.addColorStop(1,`rgba(202,223,222,${d*.92})`);x.fillStyle=g;x.fillRect(0,top,w,h-top)}else{x.fillStyle=`rgba(190,207,207,${d*.55})`;x.fillRect(0,0,w,h)}if(vol&&S.noise){for(let i=0;i<12;i++){let px=(i*127+S.t*.7)%(w+180)-90,py=top+h*(.10+(i%4)*.08),r=50+(i%3)*28;x.fillStyle=`rgba(220,235,232,${d*(.12+(i%3)*.08)})`;x.beginPath();x.ellipse(px,py,r,r*.32,0,0,7);x.fill()}}if(lit){x.fillStyle=`rgba(255,224,153,${d*.14})`;for(let i=0;i<4;i++){x.beginPath();x.moveTo(sx+i*22,sy+10);x.lineTo(w*(.40+i*.12),h);x.lineTo(w*(.47+i*.12),h);x.closePath();x.fill()}}if(S.step===0)tag('DISTANCE ONLY · SKY = VALLEY',w*.05,h*.90,'#ff8179');if(height)tag('EXPONENTIAL HEIGHT INTEGRAL',w*.05,h*.55,'#b7d8dd');if(S.step===2)tag('UNIFORM WALL · NO PATCH / SHAFT',w*.55,h*.55,'#ff8179');if(vol)tag(S.noise?'FROXEL + ADVECTED 3D NOISE':'3D NOISE OFF',w*.55,h*.62,S.noise?'#b7d8dd':'#ff8179');if(lit)tag('SHADOWED IN-SCATTERING',w*.60,h*.33,'#ffd98e');if(tod){tag(`ToD ${S.time.toFixed(1)}h · TOP ↓ · DENSITY ↓`,w*.05,h*.18,'#f2f8fb');if(clear>.62)tag('VILLAGE REVEALED',w*.40,h*.69,'#ffd98e')}}
function metrics(){const tod=S.step>=5,clear=tod?Math.max(0,Math.min(1,(S.time-5)/4)):0,d=S.density*(tod?1-clear*.82:1),top=620-clear*500,ridge=Math.min(100,35+clear*65+(S.step>=1?12:0));$('mTop').textContent=Math.round(top)+' m';$('mRidge').textContent=Math.round(ridge)+'%';$('mValley').textContent=Math.round(d*100)+'%';$('mSteps').textContent=S.step<3?'1 analytic':S.temporal&&S.step>=4?'24 + history':'64'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['하늘과 골짜기가 똑같이 흐림','저지대 안개 바다','균일한 벽','패치가 흘러감','빛줄기·비용 절감','능선부터 마을까지 공개'][S.step];$('explain').innerHTML=desc[S.step];$('noise').setAttribute('aria-pressed',String(S.noise));$('temporal').setAttribute('aria-pressed',String(S.temporal));metrics();draw()}function tick(){S.t+=1;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.noise=S.step>=3;S.temporal=S.step>=4;if(S.step===5&&S.time<8){S.time=8;$('time').value=80;$('timeOut').textContent='08:00'}ui()});$('time').oninput=e=>{S.time=+e.target.value/10;let hr=Math.floor(S.time),min=Math.round((S.time-hr)*60);$('timeOut').textContent=String(hr).padStart(2,'0')+':'+String(min).padStart(2,'0');ui()};$('density').oninput=e=>{S.density=+e.target.value/100;$('densityOut').textContent=e.target.value+'%';ui()};$('noise').onclick=()=>{S.noise=!S.noise;ui()};$('temporal').onclick=()=>{S.temporal=!S.temporal;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
