<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q54 가이드 헤어 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="본 몇 개로 통째로 흔들리는 포니테일을 카드 본 체인, 충돌 프록시, 가이드 스트랜드와 렌더 가닥 보간, 자기충돌과 거리 LOD로 발전시키는 과정"></canvas><div class="hud"><span>Q54 · <b id="stage">본 3개 포니테일</b></span><span id="status">가닥이 아니라 한 덩어리로 흔들림</span></div></div>
<div class="steps" role="group" aria-label="헤어 시뮬레이션 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>본 뭉텅이</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>카드·본 체인</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>충돌 프록시</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>가이드 보간</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>결 분리·바람</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>LOD·렌더 안정</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="turn">고개 회전</label><output id="turnOut">42°</output></div><input id="turn" type="range" min="-90" max="90" value="42"></div><div><div class="ct"><label for="guides">가이드 밀도</label><output id="guidesOut">12개</output></div><input id="guides" type="range" min="4" max="20" value="12"></div><div class="toggles" role="group" aria-label="충돌 프록시와 LOD 렌더 안정 설정"><button id="collision" aria-pressed="false">얼굴·어깨 충돌</button><button id="lod" aria-pressed="false">LOD+헤어 AA</button></div></div>
<div class="metrics"><div class="m"><small>물리로 푸는 가이드</small><strong id="mGuides">3 bones</strong></div><div class="m"><small>보간 렌더 가닥</small><strong id="mRender">1 덩어리</strong></div><div class="m"><small>프록시 관통</small><strong id="mPen">14%</strong></div><div class="m"><small>헤어 GPU 비용</small><strong id="mGpu">0.2 ms</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,turn:42,guides:12,collision:false,lod:false,t:0};
const names=['본 3개 포니테일','카드 다발마다 본 체인','머리·턱·어깨 스피어 충돌','소수 가이드에서 수천 가닥 보간','가이드 자기충돌과 공유 바람','거리에 따라 가이드·렌더를 단계 축소'],status=['가닥이 아니라 한 덩어리로 흔들림','텍스처는 결, 본은 찰랑임을 담당','표면 밖으로 밀어 얼굴·목 관통 차단','시뮬 해상도와 렌더 해상도를 분리','뭉침을 풀고 각 가닥에 위상차 부여','원거리는 카드 폴백, 얇은 선은 전용 AA'];
const desc=['<b>첫 근사:</b> 본 세 개가 포니테일 전체를 한 덩어리로 흔듭니다. 싸지만 고개를 돌려도 모든 결이 같은 궤적을 따라 뻣뻣하게 움직이고 어깨를 뚫습니다.','<b>일반 게임 해법:</b> 카드 다발마다 뿌리→끝 본 체인을 두어 서로 다른 위상으로 흔듭니다. 가닥 모양은 텍스처가, 큰 찰랑임은 본이 만듭니다.','<b>감김과 접촉:</b> 뒤통수·턱·목·어깨를 스피어로 근사해 가이드가 안쪽으로 들어가면 skin offset 바깥으로 투영합니다. 토글로 관통을 비교하세요.','<b>핵심 분리:</b> 실제 물리로 푸는 것은 소수의 굵은 가이드뿐이고, 촘촘한 렌더 스트랜드는 가까운 가이드 사이를 보간합니다. 밀도를 바꿔 두 수가 다름을 보세요.','<b>가닥다운 움직임:</b> 가이드에만 약한 자기충돌을 걸고 바람 위상차를 더해 결이 서로 벌어졌다 모입니다. 고개 회전을 바꾸면 뿌리보다 끝이 늦게 따라옵니다.','<b>실전 품질 계단:</b> 근접은 스트랜드, 중거리는 가이드 축소, 원거리는 카드로 폴백합니다. 헤어 AA가 픽셀보다 얇은 가닥의 지글거림을 눌러줍니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const guides=S.step<1?3:S.step<3?8:S.guides,coll=S.step>=2&&S.collision,lod=S.step>=5&&S.lod,sim=lod?Math.max(4,Math.round(guides*.35)):guides,render=S.step<3?(S.step===0?'1 덩어리':'8 cards'):(lod?'600 cards':`${guides*420} strands`),pen=coll?0:14,gpu=S.step<3?.2:lod?.7:(.55+guides*.12);return{guides,coll,lod,sim,render,pen,gpu}}
function architecture(w,h,v){const ox=w*.035,oy=h*.18,gw=w*.32,gh=h*.66;label(S.step<3?'BONE / CARD REPRESENTATION':'SIMULATION ≠ RENDER DENSITY',ox,oy-16,S.step<3?'#72c9ff':'#8ce4b4');if(S.step===0){for(let i=0;i<3;i++){const px=ox+gw*.28+i*gw*.18,py=oy+i*gh*.19;x.fillStyle='#ffd17f';x.beginPath();x.arc(px,py,8,0,7);x.fill();if(i)line(ox+gw*.28+(i-1)*gw*.18,oy+(i-1)*gh*.19,px,py,'#ffd17f',12)}label('3 BONES → ONE SHAPE',ox+gw*.50,oy+gh*.70,'#ff8179','center');return}if(S.step<3){for(let card=0;card<5;card++){const sx=ox+gw*(.16+card*.15),phase=card*.35;for(let i=0;i<4;i++){const px=sx+Math.sin(S.t*.04+i*.6+phase)*9,py=oy+i*gh*.16;if(i)line(sx+Math.sin(S.t*.04+(i-1)*.6+phase)*9,oy+(i-1)*gh*.16,px,py,card%2?'#72c9ff':'#8ce4b4',6);x.fillStyle='#ffd17f';x.beginPath();x.arc(px,py,4,0,7);x.fill()}}label(S.step===1?'CARD TEXTURE × BONE CHAINS':'CARD CHAINS + COLLISION PROXIES',ox+gw*.50,oy+gh*.73,'#8ce4b4','center');return}const guideCount=Math.min(12,v.sim),renderLines=32;for(let i=0;i<renderLines;i++){const u=i/(renderLines-1),near=Math.round(u*(guideCount-1))/(guideCount-1),px=ox+gw*(.12+u*.76),py0=oy+gh*.08,py1=oy+gh*.62+Math.sin(S.t*.045+i*.37)*8;x.strokeStyle=i%(Math.max(1,Math.round(renderLines/guideCount)))===0?'#ffd17f':'#72c9ff66';x.lineWidth=i%(Math.max(1,Math.round(renderLines/guideCount)))===0?2.5:1;x.beginPath();x.moveTo(px,py0);x.quadraticCurveTo(px+(near-u)*35+Math.sin(S.t*.035+i)*4,oy+gh*.34,px+Math.sin(S.t*.03+i*.2)*12,py1);x.stroke()}label(`${v.sim} GUIDE CURVES`,ox+gw*.22,oy+gh*.77,'#ffd17f','center');label(`→ ${v.render} INTERPOLATED`,ox+gw*.66,oy+gh*.84,'#72c9ff','center')}
function head(w,h,v){const cx=w*.70,cy=h*.34,turn=S.turn*Math.PI/180,lag=turn*.42+Math.sin(S.t*.045)*.14,spread=S.step>=4?18:5;label('RUNTIME HEAD · ROOT TO TIP LAG',w*.49,h*.15,S.step>=3?'#8ce4b4':'#72c9ff');x.fillStyle='#f2f8fc';x.beginPath();x.arc(cx,cy,42,0,7);x.fill();x.fillStyle='#31576b';x.beginPath();x.arc(cx,cy-8,45,Math.PI,Math.PI*2);x.fill();line(cx-85,cy+92,cx+85,cy+92,'#72c9ff',26);if(S.step>=2){x.globalAlpha=.32;for(const p of [[cx,cy,49],[cx,cy+54,28],[cx-65,cy+90,32],[cx+65,cy+90,32]]){x.fillStyle=v.coll?'#8ce4b4':'#ff8179';x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill()}x.globalAlpha=1;if(S.step<3)label(v.coll?'SPHERE PROXIES + SKIN OFFSET':'PROXIES OFF · FACE/SHOULDER PENETRATION',cx,cy+142,v.coll?'#8ce4b4':'#ff8179','center')}
const count=S.step<1?1:S.step<3?6:Math.min(30,v.sim*2.2);for(let i=0;i<count;i++){const u=count===1?.5:i/(count-1),rootX=cx-30+u*60,side=(u-.5),phase=i*.71;let tipX=rootX-Math.sin(lag)*145+Math.sin(S.t*.04+phase)*spread,tipY=cy+190-Math.abs(Math.sin(lag))*35+Math.cos(S.t*.05+phase)*spread*.28;if(v.coll&&tipY>cy+62&&Math.abs(tipX-cx)<78)tipX=cx+(tipX<cx?-82:82);x.strokeStyle=S.step<3?(i%2?'#72c9ff':'#8ce4b4'):(i%Math.max(1,Math.round(count/v.sim))===0?'#ffd17f':'#72c9ff99');x.lineWidth=S.step===0?22:S.step<3?7:v.lod?2.3:1.4;x.beginPath();x.moveTo(rootX,cy-24);x.bezierCurveTo(rootX+Math.sin(turn)*24,cy+42,tipX+side*30,cy+95,tipX,tipY);x.stroke()}line(cx,cy-70,cx+Math.sin(turn)*70,cy-70-Math.cos(turn)*16,'#ffd17f',3);label(`HEAD ${S.turn}°`,cx+72,cy-54,'#ffd17f','center');if(S.step>=3)label('YELLOW = SIM GUIDES · BLUE = RENDER STRANDS',cx,h*.76,'#f2f8fc','center');if(S.step>=5)label(v.lod?'MID LOD: 35% GUIDES · CARD FALLBACK · AA ON':'HERO LOD: FULL GROOM · AA OFF',cx,h*.82,v.lod?'#8ce4b4':'#ff8179','center')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);architecture(w,h,v);head(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('collision').setAttribute('aria-pressed',String(S.collision));$('lod').setAttribute('aria-pressed',String(S.lod));const v=vals();$('mGuides').textContent=S.step<1?'3 bones':v.sim+' guides';$('mRender').textContent=v.render;$('mPen').textContent=v.pen+'%';$('mGpu').textContent=v.gpu.toFixed(1)+' ms';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.collision=S.step>=2;S.lod=S.step>=5;update()});$('turn').oninput=e=>{S.turn=+e.target.value;$('turnOut').textContent=S.turn+'°';update()};$('guides').oninput=e=>{S.guides=+e.target.value;$('guidesOut').textContent=S.guides+'개';update()};$('collision').onclick=()=>{S.collision=!S.collision;update()};$('lod').onclick=()=>{S.lod=!S.lod;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
