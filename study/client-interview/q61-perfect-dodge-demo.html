<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q61 퍼펙트 회피 슬로모션 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="전역 슬로모션 실패에서 플레이어 시간 보정, 진입 복귀 커브, 시간 레이어, 물리 안정화와 게이지 제한까지 발전하는 퍼펙트 회피 실험"></canvas><div class="hud"><span>Q61 · <b id="stage">모두 0.3배로 느려짐</b></span><span id="status">플레이어도 굼떠져 회피 보상이 사라짐</span></div></div>
<div class="steps" role="group" aria-label="퍼펙트 회피 슬로모션 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전역 감속</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>플레이어 보정</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>진입·복귀 커브</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>시간 레이어</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>물리 안정화</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>게이지·쿨다운</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="scale">월드 시간 배율</label><output id="scaleOut">0.30×</output></div><input id="scale" type="range" min="10" max="80" value="30"></div><div><div class="ct"><label for="window">슬로모션 지속</label><output id="windowOut">1.2 s</output></div><input id="window" type="range" min="3" max="20" value="12"></div><div class="toggles" role="group" aria-label="플레이어 보정과 실시간 레이어 설정"><button id="compensate" aria-pressed="false">플레이어 보정</button><button id="unscaled" aria-pressed="false">UI·입력 실시간</button></div></div>
<div class="metrics"><div class="m"><small>적 상대 속도</small><strong id="mEnemy">0.30×</strong></div><div class="m"><small>플레이어 상대 속도</small><strong id="mPlayer">0.30×</strong></div><div class="m"><small>물리 서브스텝</small><strong id="mSteps">1</strong></div><div class="m"><small>남은 회피 게이지</small><strong id="mGauge">100%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,scale:.3,window:1.2,compensate:false,unscaled:false,t:0};
const names=['모두 0.3배로 느려짐','플레이어만 역배율로 보정','부드러운 감속·정점·복귀','scaled와 unscaled 시간 분리','고정 dt·서브스텝·보간','정확한 회피만 제한적으로 보상'],status=['플레이어도 굼떠져 회피 보상이 사라짐','적과 투사체만 느리고 플레이어는 정상','계단 없이 시간 속으로 들어갔다 나옴','입력·UI는 즉시, 월드·물리는 감속','작은 dt에서도 투사체가 매끄럽게 이동','게이지와 쿨다운이 남용을 막음'];
const desc=['<b>실패 재현:</b> 전역 timeScale만 낮추면 적뿐 아니라 플레이어의 회피·입력·물리까지 함께 느려집니다. 절묘한 회피를 했는데 보상 구간을 활용할 수 없습니다.','<b>상대적 빠름 만들기:</b> 월드는 느리게 두고 플레이어 액터만 1 / globalScale로 보정합니다. 토글을 켜면 적은 느려지고 플레이어는 정상 속도를 유지합니다.','<b>계단을 커브로:</b> 즉시 0.3으로 떨어뜨리지 않고 짧게 진입하고, 정점에서 머문 뒤 부드럽게 복귀합니다. 상단 그래프의 현재 시간이 커브를 따라 움직입니다.','<b>서로 다른 시계:</b> 게임플레이·물리는 scaled, 입력·UI와 특정 VFX는 unscaled 시간으로 갱신합니다. 토글을 끄면 UI 커서까지 느려지는 실패를 비교할 수 있습니다.','<b>느려져도 끊기지 않게:</b> 고정 dt와 서브스텝으로 충돌 안정성을 지키고 렌더 보간으로 작은 이동 사이를 채웁니다. 배율이 낮을수록 필요한 서브스텝이 늘어납니다.','<b>희소성이 보상입니다:</b> 진짜 퍼펙트 회피에만 발동하고 지속 시간만큼 게이지를 소비합니다. 긴 지속 시간을 선택하면 남은 게이지가 줄어 반복 사용이 제한됩니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const comp=S.step>=1&&S.compensate,curve=S.step>=2,layers=S.step>=3&&S.unscaled,stable=S.step>=4,gated=S.step>=5,player=comp?1:S.scale,steps=stable?Math.ceil(1/S.scale):1,gauge=gated?Math.max(0,100-S.window*38):100;return{comp,curve,layers,stable,gated,player,steps,gauge}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),cycle=(S.t%180)/180,curveT=v.curve?(cycle<.15?1-(1-S.scale)*(cycle/.15):cycle<.72?S.scale:S.scale+(1-S.scale)*((cycle-.72)/.28)):S.scale,enemyPhase=(S.t*S.scale%180)/180,playerPhase=(S.t*v.player%180)/180;x.fillStyle='#102331';x.fillRect(0,0,w,h);
const gx=w*.07,gy=h*.15,gw=w*.48,gh=h*.20;label('GLOBAL TIME DILATION CURVE',gx,gy-10,'#70ceff');line(gx,gy+gh,gx+gw,gy+gh,'#52677b',2);line(gx,gy,gx,gy+gh,'#52677b',2);x.beginPath();for(let i=0;i<=60;i++){const u=i/60,val=v.curve?(u<.15?1-(1-S.scale)*(u/.15):u<.72?S.scale:S.scale+(1-S.scale)*((u-.72)/.28)):S.scale;const px=gx+u*gw,py=gy+gh-val*gh;(i?x.lineTo(px,py):x.moveTo(px,py))}x.strokeStyle='#70ceff';x.lineWidth=3;x.stroke();const mx=gx+cycle*gw;line(mx,gy-3,mx,gy+gh+5,'#ffd06e',2);label(`${curveT.toFixed(2)}×`,mx,gy+gh+21,'#ffd06e','center');
const floor=h*.70,x0=w*.08,x1=w*.93;line(x0,floor,x1,floor,'#60768a',3);label('ENEMY / WORLD CLOCK',x0,h*.44,'#ff7f78');label('PLAYER ACTOR CLOCK',x0,h*.54,'#8ce3ae');const ex=x0+enemyPhase*(x1-x0),px=x0+playerPhase*(x1-x0);x.fillStyle='#ff7f78';x.beginPath();x.arc(ex,floor-78,16,0,7);x.fill();line(ex,floor-62,ex,floor-18,'#ff7f78',10);line(ex+12,floor-48,ex+62,floor-48,'#f5f8fc',7);x.fillStyle='#8ce3ae';x.beginPath();x.arc(px,floor-16,16,0,7);x.fill();line(px,floor,px-34,floor+22,'#8ce3ae',8);line(px,floor,px+40,floor+7,'#8ce3ae',8);
for(let i=0;i<9;i++){const bx=x0+i*(x1-x0)/8;x.fillStyle=i<Math.round(enemyPhase*8)?'#ff7f78':'#32475a';x.fillRect(bx,h*.46,32,5);x.fillStyle=i<Math.round(playerPhase*8)?'#8ce3ae':'#32475a';x.fillRect(bx,h*.56,32,5)}if(v.comp)label(`PLAYER CUSTOM × ${(1/S.scale).toFixed(2)} → NET 1.00×`,w*.70,h*.39,'#8ce3ae','center');
if(S.step>=3){const rows=[['WORLD / PHYSICS',`${S.scale.toFixed(2)}×`],['PLAYER',v.comp?'1.00×':`${S.scale.toFixed(2)}×`],['INPUT + UI',v.layers?'1.00× REALTIME':`${S.scale.toFixed(2)}× LAG`],['VFX',v.layers?'SELECTIVE CLOCK':'ALL SCALED']];rows.forEach((r,i)=>{const xx=w*.60+(i%2)*w*.19,yy=h*.14+Math.floor(i/2)*h*.10;label(r[0],xx,yy,'#9aaabf');label(r[1],xx,yy+24,v.layers&&i>=2?'#8ce3ae':'#ffd06e')})}if(S.step>=4)label(`FIXED dt / ${v.steps} SUBSTEPS / RENDER INTERPOLATION`,w*.72,h*.80,'#70ceff','center');if(S.step>=5){x.fillStyle='#223a4c';x.fillRect(w*.08,h*.86,w*.47,14);x.fillStyle='#8ce3ae';x.fillRect(w*.08,h*.86,w*.47*v.gauge/100,14);label(`DODGE GAUGE ${v.gauge.toFixed(0)}% · COOLDOWN`,w*.315,h*.84,v.gauge>25?'#8ce3ae':'#ff7f78','center')}c.dataset.enemy=enemyPhase.toFixed(3);c.dataset.player=playerPhase.toFixed(3)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('compensate').setAttribute('aria-pressed',String(S.compensate));$('unscaled').setAttribute('aria-pressed',String(S.unscaled));const v=vals();$('mEnemy').textContent=S.scale.toFixed(2)+'×';$('mPlayer').textContent=v.player.toFixed(2)+'×';$('mSteps').textContent=String(v.steps);$('mGauge').textContent=v.gauge.toFixed(0)+'%';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.compensate=S.step>=1;S.unscaled=S.step>=3;S.t=0;update()});$('scale').oninput=e=>{S.scale=+e.target.value/100;$('scaleOut').textContent=S.scale.toFixed(2)+'×';S.t=0;update()};$('window').oninput=e=>{S.window=+e.target.value/10;$('windowOut').textContent=S.window.toFixed(1)+' s';update()};$('compensate').onclick=()=>{S.compensate=!S.compensate;S.t=0;update()};$('unscaled').onclick=()=>{S.unscaled=!S.unscaled;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
