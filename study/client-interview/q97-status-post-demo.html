<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q97 상태 포스트 스택 실험실</title><style>
:root{--bg:#090d11;--panel:#131a20;--line:#39464d;--ink:#f5f7f5;--muted:#9fa9a5;--green:#75de92;--purple:#bd9bff;--red:#ff7771;--cyan:#70d4ee}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#121921}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#06090bdf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--green)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#06140b}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--green);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#84918c;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="독, 취기, 부상 상태가 원자 포스트 파라미터로 분해되고 채널별 규칙과 상한을 거쳐 한 패스에 합성되는 실험"></canvas><div class="hud"><span>Q97 · <b id="stage">상태마다 풀스크린 패스</b></span><span id="status">세 상태가 겹치면 세 번 읽고 쓰며 순서마다 결과도 달라짐</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전용 셰이더 3개</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>원자 연산 분해</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>무작정 더하기</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>강도 페이드</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>채널 규칙·상한</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>통합 1패스</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="poison">독 · 초록 틴트</label><output id="poisonOut">65%</output></div><input id="poison" type="range" min="0" max="100" value="65"></div><div><div class="ct"><label for="drunk">취기 · 이중상</label><output id="drunkOut">55%</output></div><input id="drunk" type="range" min="0" max="100" value="55"></div><div><div class="ct"><label for="injury">부상 · 심박 비네트</label><output id="injuryOut">70%</output></div><input id="injury" type="range" min="0" max="100" value="70"></div></div>
<div class="metrics"><div class="m"><small>풀스크린 패스</small><strong id="mPass">3</strong></div><div class="m"><small>블러 반경</small><strong id="mBlur">8.2 px</strong></div><div class="m"><small>왜곡 총량 / 상한</small><strong id="mWobble">12.0 / 8px</strong></div><div class="m"><small>고유 신호 유지</small><strong id="mSignal">1 / 3</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,p:.65,d:.55,i:.70,t:0};const names=['상태마다 풀스크린 패스','UV·색수차·블러·틴트·비네트로 분해','모든 파라미터를 단순 가산','각 상태 강도를 시간 커브로 전환','틴트=가중 · 블러=max · 왜곡=sum+cap','합성 파라미터를 한 셰이더에서 처리'];const stats=['세 상태가 겹치면 세 번 읽고 쓰며 순서마다 결과도 달라짐','상태는 완제품이 아니라 같은 연산의 숫자 묶음','색은 회색으로 뭉개지고 흔들림은 발작 수준','붙고 풀릴 때 뚝 끊기지 않고 스르륵 이동','독·취기·부상 고유 채널이 겹쳐도 각각 살아남음','상태가 늘어도 화면 읽기·쓰기는 정확히 한 번'];const desc=['<b>완제품의 조합 폭발:</b> 독·취기·부상 셰이더를 차례로 돌리면 상태 수만큼 풀스크린 대역폭을 쓰고 적용 순서마다 색과 블러가 달라집니다.','<b>원자 연산:</b> UV 디스토션, 색수차, 블러, 틴트, 비네트, 이중상으로 쪼갭니다. 각 상태는 이 공통 연산의 파라미터 세트가 됩니다.','<b>덧셈은 합성 규칙이 아닙니다:</b> 세 색과 왜곡을 무작정 더하면 회색 뭉텅이·과한 흔들림이 되어 어느 상태도 구분되지 않습니다.','<b>강도 0→1 페이드:</b> 상태가 붙고 풀릴 때 모든 파라미터를 시간 커브로 움직여 독이 퍼지고 해독되듯 자연스럽게 전환합니다. 슬라이더로 중간 상태를 확인하세요.','<b>채널마다 다른 수학:</b> 색은 강도 가중, 블러는 최대, 왜곡은 누적 후 8px 상한. 독=초록, 취기=이중상, 부상=붉은 심박이라는 고유 신호도 보존합니다.','<b>한 번만 그리기:</b> 합성된 파라미터를 단일 포스트에 넣어 UV→색수차→가장자리 블러·틴트 순으로 처리합니다. 상태가 모두 0이면 패스 등록 자체를 생략합니다.'];
function calc(){let active=[S.p,S.d,S.i].filter(v=>v>.01).length,pass=S.step===0?active:S.step<5?Math.max(1,active):active?1:0,blur=S.step<4?(S.d*9+S.i*8):Math.max(S.d*9,S.i*8),raw=(S.p*5+S.d*9+S.i*4),wob=S.step>=4?Math.min(8,raw):raw,signals=S.step<2?active:S.step===2?1:S.step>=4?active:Math.max(1,active-1);return{active,pass,blur,wob,signals}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),pulse=.5+.5*Math.sin(S.t*.07),dx=Math.sin(S.t*.045)*V.wob;x.fillStyle='#172029';x.fillRect(0,0,w,h);x.save();x.translate(dx,0);x.fillStyle='#33444d';x.fillRect(w*.08,h*.16,w*.84,h*.69);x.fillStyle='#d7d8d3';x.beginPath();x.arc(w*.5,h*.42,37,0,Math.PI*2);x.fill();x.fillRect(w*.46,h*.49,w*.08,h*.23);x.restore();if(S.d>.02){x.globalAlpha=S.d*.25;x.drawImage(c,Math.round(12*S.d),0,w,h);x.globalAlpha=1}let tint=S.step===2?'rgba(110,110,100,.45)':`rgba(${Math.round(40+S.i*180)},${Math.round(70+S.p*160)},${Math.round(55+S.d*80)},${.15+Math.max(S.p,S.i)*.25})`;x.fillStyle=tint;x.fillRect(0,0,w,h);let g=x.createRadialGradient(w/2,h/2,w*.18,w/2,h/2,w*.69);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(180,10,15,${S.i*.55*pulse})`);x.fillStyle=g;x.fillRect(0,0,w,h);if(S.p>.02){x.strokeStyle='#75de92';x.lineWidth=5;for(let k=0;k<4;k++){x.beginPath();for(let px=0;px<w;px+=10)x.lineTo(px,30+k*12+Math.sin(px*.025+S.t*.04+k)*S.p*8);x.stroke()}}$('mPass').textContent=V.pass;$('mBlur').textContent=V.blur.toFixed(1)+' px';$('mWobble').textContent=V.wob.toFixed(1)+' / 8px';$('mSignal').textContent=V.signals+' / '+V.active;c.dataset.passes=V.pass;c.dataset.blur=V.blur.toFixed(1);c.dataset.wobble=V.wob.toFixed(1);c.dataset.signals=V.signals+','+V.active}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;update()});[['poison','p'],['drunk','d'],['injury','i']].forEach(([id,key])=>$(id).oninput=e=>{S[key]=+e.target.value/100;$(id+'Out').textContent=e.target.value+'%';draw()});function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw)})();
</script></body></html>
