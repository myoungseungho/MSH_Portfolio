<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q74 도시 NPC 생활 시뮬레이션 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="모든 도시 NPC 상시 풀 AI에서 시간대 스케줄, 상태 재구성, 시뮬레이션 버블, 스마트 오브젝트와 자극 연쇄까지 발전하는 도시 생활 실험"></canvas><div class="hud"><span>Q74 · <b id="stage">도시 전원 항상 로드·풀 AI</b></span><span id="status">플레이어 반대편 골목도 같은 비용</span></div></div>
<div class="steps" role="group" aria-label="도시 NPC 생활 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전원 풀 AI</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>시간대 스케줄</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>요약 상태 재구성</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>시뮬 버블</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스마트 오브젝트</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>자극 파문</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="time">도시 시각</label><output id="timeOut">08:00</output></div><input id="time" type="range" min="0" max="23" value="8"></div><div><div class="ct"><label for="radius">플레이어 시뮬 버블</label><output id="radiusOut">35 m</output></div><input id="radius" type="range" min="10" max="70" value="35"></div><div class="toggles"><button id="rain" aria-pressed="false">비 내리기</button><button id="weapon" aria-pressed="false">칼 뽑기</button></div></div>
<div class="metrics"><div class="m"><small>실제 로드 NPC</small><strong id="mLoaded">1,200명</strong></div><div class="m"><small>요약 상태만 유지</small><strong id="mSummary">0명</strong></div><div class="m"><small>스마트 오브젝트 사용</small><strong id="mSmart">0명</strong></div><div class="m"><small>자극 반응 NPC</small><strong id="mReact">0명</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,time:8,radius:35,rain:false,weapon:false,t:0};
const names=['도시 전원 항상 로드·풀 AI','시간표로 삶의 규칙 정의','오프스크린은 최소 영속 상태로 재구성','플레이어 주변만 실제로 스트리밍','월드가 행동을 광고하는 스마트 오브젝트','1차·2차 자극이 군중 사이로 감쇠 전파'],status=['플레이어 반대편 골목도 같은 비용','시각만 알면 있어야 할 장소를 계산','위치·활동·관계 요약으로 삶을 복원','버블 밖은 규칙, 안쪽만 진짜 액터','침대·좌판·처마가 구체 행동을 제공','총성·도망·비 반응이 파문처럼 퍼짐'];
const desc=['<b>실패 재현:</b> 1,200명을 항상 메모리에 두고 반대편 골목까지 인지·행동트리를 매 프레임 돌립니다. 멀어져도 비용이 줄지 않습니다.','<b>삶의 뼈대:</b> 06시 집, 08시 좌판, 12시 식당, 20시 술집, 22시 침대처럼 시간대별 목표와 활동을 정의합니다.','<b>과정 대신 결과:</b> 멀리 있는 동안 실제 보행은 생략하고 현재 시각의 위치·활동·부상·관계 요약만 유지해 접근 순간 자연스럽게 복원합니다.','<b>도시 전체가 아니라 버블만:</b> 영속 NPC는 예정 위치에 온디맨드 스폰하고 익명 행인은 구역·시간 밀도로 생성합니다. 버블 밖은 조용히 요약 상태가 됩니다.','<b>목적지가 행동을 제공:</b> 좌판은 판매, 침대는 수면, 처마는 비 피하기를 광고합니다. 스케줄이 장소만 정해도 도착 후 행동은 월드에서 선택합니다.','<b>반응도 두 층:</b> 칼·비가 1차 자극을 만들고 놀란 NPC가 2차 공포 발원지가 됩니다. 반경·감쇠·시간 제한으로 파문을 멈춥니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function schedule(){return S.time<6?['HOME','SLEEP']:S.time<11?['MARKET','SELL']:S.time<15?['INN','EAT']:S.time<20?['WORKSHOP','WORK']:S.time<22?['TAVERN','DRINK']:['HOME','SLEEP']}
function vals(){const sched=S.step>=1,summary=S.step>=2,bubble=S.step>=3,smart=S.step>=4,stim=S.step>=5,loaded=bubble?Math.round(28+S.radius*S.radius*.12):summary?120:1200,summ=summary?1200-loaded:0,smartUse=smart?Math.round(loaded*(S.rain?.72:.58)):0,react=stim?(S.weapon?Math.min(loaded,Math.round(12+S.radius*1.7)):S.rain?smartUse:0):0;return{sched,summary,bubble,smart,stim,loaded,summ,smartUse,react}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),mapX=w*.05,mapY=h*.16,mapW=w*.90,mapH=h*.66,px=w*.52,py=h*.52,locs={HOME:[mapX+mapW*.14,mapY+mapH*.25],MARKET:[mapX+mapW*.46,mapY+mapH*.30],INN:[mapX+mapW*.72,mapY+mapH*.26],WORKSHOP:[mapX+mapW*.25,mapY+mapH*.72],TAVERN:[mapX+mapW*.73,mapY+mapH*.72]},sch=schedule();x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#142a35';x.fillRect(mapX,mapY,mapW,mapH);x.strokeStyle='#52677b';x.strokeRect(mapX,mapY,mapW,mapH);Object.entries(locs).forEach(([n,p],i)=>{x.fillStyle='#263d49';x.fillRect(p[0]-42,p[1]-24,84,48);label(n,p[0],p[1]+4,n===sch[0]?'#8ce3ae':'#9aaabf');if(v.smart){label(['BED · SLEEP','STALL · SELL','TABLE · EAT','ANVIL · WORK','SEAT · DRINK'][i],p[0],p[1]+38,'#ffd06e')}});if(v.sched){const route=['HOME','MARKET','INN','WORKSHOP','TAVERN','HOME'];for(let i=0;i<route.length-1;i++){const a=locs[route[i]],b=locs[route[i+1]];line(a[0],a[1],b[0],b[1],route[i]===sch[0]?'#8ce3ae':'#52677b',2,[6,5])}label(`${String(S.time).padStart(2,'0')}:00 → ${sch[0]} / ${sch[1]}`,w*.5,mapY+22,'#8ce3ae')}else label('1,200 LIVE ACTORS · ALWAYS ON',w*.5,mapY+22,'#ff7f78');
x.fillStyle='#f5f8fc';x.beginPath();x.arc(px,py,9,0,7);x.fill();label('PLAYER',px,py-21,'#f5f8fc');if(v.bubble){x.strokeStyle='#70ceff';x.setLineDash([7,4]);x.beginPath();x.arc(px,py,S.radius*4.2,0,7);x.stroke();x.setLineDash([]);label(`LIVE SIM BUBBLE ${S.radius}m`,px,Math.min(mapY+mapH-12,py+S.radius*4.2+21),'#70ceff')}
for(let i=0;i<60;i++){const a=i*.72,r=28+(i%12)*18,cx=px+Math.cos(a)*r,cy=py+Math.sin(a)*r*.62,inside=!v.bubble||Math.hypot(cx-px,cy-py)<S.radius*4.2;if(!inside&&v.summary){x.globalAlpha=.16}else if(!inside)continue;const responding=v.stim&&((S.weapon&&r<S.radius*4.1*(.35+(S.t%90)/140))||(S.rain&&inside));x.fillStyle=responding?'#ff7f78':'#70ceff';x.beginPath();x.arc(cx,cy-5,4,0,7);x.fill();x.fillRect(cx-2,cy,4,11);if(responding&&S.weapon){line(cx,cy,cx+Math.cos(a)*16,cy+Math.sin(a)*16,'#ff7f78',2)}x.globalAlpha=1}if(v.summary)label('OUTSIDE: POSITION + ACTIVITY + RELATION SUMMARY',w*.5,mapY+mapH-10,'#9aaabf');if(v.stim&&S.weapon){for(let k=1;k<=3;k++){x.strokeStyle=`rgba(255,127,120,${.7-k*.16})`;x.beginPath();x.arc(px,py,25+k*((S.t*2)%65),0,7);x.stroke()}label('FEAR: SOUND → SECONDARY FLEE',w*.31,mapY+mapH-34,'#ff7f78')}if(v.smart&&S.rain){for(let i=0;i<20;i++)line(mapX+i*mapW/20,mapY,mapX-14+i*mapW/20,mapY+mapH,'rgba(112,206,255,.28)',1);label('RAIN → ROOF SMART OBJECT',w*.69,mapY+mapH-34,'#70ceff')}
$('mLoaded').textContent=v.loaded.toLocaleString()+'명';$('mSummary').textContent=v.summ.toLocaleString()+'명';$('mSmart').textContent=v.smartUse.toLocaleString()+'명';$('mReact').textContent=v.react.toLocaleString()+'명';c.dataset.loaded=v.loaded;c.dataset.react=v.react}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('rain').setAttribute('aria-pressed',String(S.rain));$('weapon').setAttribute('aria-pressed',String(S.weapon));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.rain=S.step>=4;S.weapon=S.step>=5;S.t=0;update()});$('time').oninput=e=>{S.time=+e.target.value;$('timeOut').textContent=String(S.time).padStart(2,'0')+':00';update()};$('radius').oninput=e=>{S.radius=+e.target.value;$('radiusOut').textContent=S.radius+' m';update()};$('rain').onclick=()=>{S.rain=!S.rain;update()};$('weapon').onclick=()=>{S.weapon=!S.weapon;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
