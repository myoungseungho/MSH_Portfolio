<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q79 GPU 대량 입자 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="CPU 개별 입자 갱신을 GPU 컴퓨트 버퍼와 Indirect Draw, 뎁스 충돌, 화면 기여도 예산으로 발전시키는 대량 눈보라 실험"></canvas><div class="hud"><span>Q79 · <b id="stage">CPU에서 입자를 하나씩 갱신</b></span><span id="status">게임 스레드 반복과 매 프레임 업로드가 병목</span></div></div>
<div class="steps" role="group" aria-label="GPU 대량 입자 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>CPU 개별 갱신</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>GPU 컴퓨트</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>상태 버퍼</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>프리리스트·Indirect</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>세계 충돌</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>컬링·LOD 예산</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="count">논리 입자 수</label><output id="countOut">100,000개</output></div><input id="count" type="range" min="10" max="200" step="10" value="100"></div><div><div class="ct"><label for="wind">글로벌 바람</label><output id="windOut">→ 35%</output></div><input id="wind" type="range" min="-100" max="100" value="35"></div><div class="toggles"><button id="collision" aria-pressed="false">뎁스 충돌</button><button id="budget" aria-pressed="false">화면 기여도 예산</button></div></div>
<div class="metrics"><div class="m"><small>CPU→GPU 업로드</small><strong id="mUpload">3.2 MB/f</strong></div><div class="m"><small>컴퓨트 그룹 / CPU 루프</small><strong id="mGroups">100,000</strong></div><div class="m"><small>살아있음 / 실제 Draw</small><strong id="mDraw">100k / 100k</strong></div><div class="m"><small>추정 프레임 비용</small><strong id="mCost">12.5 ms</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,count:100000,wind:.35,collision:false,budget:false,t:0,particles:[],collisions:0};
const names=['CPU에서 위치·속도·수명을 하나씩 갱신','256개 스레드 그룹이 GPU에서 병렬 적분','위치·속도·수명을 GPU 버퍼에 계속 유지','죽은 슬롯 재활용 + GPU가 Draw 개수 기록','윈드 필드 샘플 + 뎁스/SDF 근사 충돌','카메라 볼륨·LOD·업데이트율로 GPU 예산 제한'];
const status=['게임 스레드 반복과 매 프레임 업로드가 병목','CPU는 디스패치 한 번만 제출','상태가 GPU 안에 남아 왕복 대역폭이 0','CPU readback 없이 살아있는 것만 그린다','바닥·계단에서 튕기거나 미끄러진다','안 보이는 입자는 시뮬·렌더하지 않는다'];
const desc=['<b>순진한 구조:</b> CPU가 수만 개 위치·속도·수명을 순회하고 바뀐 상태를 매 프레임 GPU로 올립니다. 개수 슬라이더를 올리면 CPU 루프와 업로드가 선형으로 폭증합니다.','<b>병렬성 활용:</b> 독립적인 입자를 256 스레드 컴퓨트 그룹으로 나눠 GPU에서 동시에 적분합니다. CPU는 수십만 번의 루프 대신 디스패치 한 번만 냅니다.','<b>GPU 안에서 닫기:</b> 위치·속도·수명·색을 구조화 버퍼에 두고 다음 프레임도 그대로 읽습니다. CPU↔GPU 상태 왕복이 사라지고 바람 필드도 셰이더에서 직접 샘플합니다.','<b>생사 관리까지 GPU로:</b> 죽은 인덱스는 atomic 프리리스트에 반납하고 스폰 때 재사용합니다. 살아있는 카운터가 Indirect 인자 버퍼를 써 CPU readback 없이 필요한 수만 그립니다.','<b>근사 세계 반응:</b> 화면 뎁스와 비교해 바닥·계단 뒤로 간 입자를 튕기거나 미끄럽니다. 충돌 버튼을 끄면 그대로 관통해 화면공간 근사의 역할을 직접 볼 수 있습니다.','<b>보이는 값에만 비용:</b> 카메라 밖 스폰을 줄이고 먼 입자는 격프레임 갱신합니다. 예산 버튼은 논리 상태를 유지하면서 시뮬·Draw 수와 오버드로만 줄여 프레임을 지킵니다.'];
function seed(){S.particles=Array.from({length:360},(_,i)=>({x:(i*73%359)/359,y:(i*191%353)/353,vx:0,vy:.0015+(i%9)*.00022,life:.2+(i%80)/100,type:i%3}));S.collisions=0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function surface(px,w,h){if(px>w*.57&&px<w*.73)return h*(.72-(px/w-.57)*.72);return h*.78}
function simulate(){const active=S.budget&&S.step>=5?180:S.particles.length;for(let i=0;i<active;i++){const p=S.particles[i],gust=Math.sin(S.t*.025+p.y*8)*.00016;p.vx+=(S.wind*.000035+gust);p.vx*=.985;p.vy+=.000018;p.x+=p.vx;p.y+=p.vy;const sy=surface(p.x*c.clientWidth,c.clientWidth,c.clientHeight)/c.clientHeight;if(S.step>=4&&S.collision&&p.y>sy){p.y=sy;p.vy=-Math.abs(p.vy)*(.25+(i%5)*.08);p.vx+=S.wind*.0003;S.collisions++}if(p.y>1.04||p.x>1.05||p.x<-.05||p.life<=0){p.x=(i*37%100)/100;p.y=-.04;p.vx=0;p.vy=.0015+(i%9)*.00022;p.life=1}p.life-=.0007}}
function values(){const alive=Math.round(S.count*(.82+.12*Math.sin(S.t*.01))),groups=Math.ceil(S.count/256),draw=S.step>=3?alive:S.count,visible=S.step>=5&&S.budget?Math.round(draw*.38):draw,upload=S.step>=2?0:S.count*32/1e6,cost=S.step===0?.9+S.count/8600:S.step<5?.42+S.count/82000:.35+visible/105000;return{alive,groups,draw,visible,upload,cost}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values();x.fillStyle='#0d1726';x.fillRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#17243a');sky.addColorStop(1,'#09121e');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#26394b';x.fillRect(0,h*.78,w,h*.22);x.fillStyle='#33495d';for(let i=0;i<4;i++)x.fillRect(w*(.57+i*.04),h*(.72-i*.03),w*.16-i*w*.04,h*.06);const active=S.budget&&S.step>=5?180:S.particles.length;for(let i=0;i<active;i++){const p=S.particles[i],px=p.x*w,py=p.y*h;x.strokeStyle=p.type===0?'rgba(225,241,255,.8)':p.type===1?'rgba(112,206,255,.72)':'rgba(255,208,110,.62)';x.lineWidth=p.type===1?1.4:1;x.beginPath();x.moveTo(px,py);x.lineTo(px-S.wind*8,py-(p.type===1?13:5));x.stroke()}if(S.step===0){x.fillStyle='rgba(255,127,120,.12)';x.fillRect(0,0,w,h);x.fillStyle='#ff7f78';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`${S.count.toLocaleString()} CPU UPDATE LOOP + ${v.upload.toFixed(1)} MB UPLOAD`,w*.34,h*.14)}else{x.fillStyle='#8ce3ae';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`${v.groups.toLocaleString()} GROUPS × 256 THREADS · GPU RESIDENT`,w*.36,h*.14)}if(S.step>=3){x.fillStyle='#70ceff';x.fillText(`ALIVE COUNTER ${Math.round(v.alive/1000)}k → DRAW INDIRECT ${Math.round(v.visible/1000)}k`,w*.34,h*.20)}if(S.step>=4){x.fillStyle=S.collision?'#ffd06e':'#ff7f78';x.fillText(S.collision?`DEPTH COLLISION · ${S.collisions} CONTACTS`:'DEPTH COLLISION OFF · PARTICLES PASS THROUGH',w*.35,h*.88)}const flow=S.particles.slice(0,active).reduce((n,p)=>n+p.vx,0)/active;$('mUpload').textContent=v.upload.toFixed(1)+' MB/f';$('mGroups').textContent=S.step===0?S.count.toLocaleString():v.groups.toLocaleString();$('mDraw').textContent=Math.round(v.alive/1000)+'k / '+Math.round(v.visible/1000)+'k';$('mCost').textContent=v.cost.toFixed(2)+' ms';c.dataset.upload=v.upload.toFixed(2);c.dataset.groups=v.groups;c.dataset.alive=v.alive;c.dataset.draw=v.visible;c.dataset.cost=v.cost.toFixed(3);c.dataset.collisions=S.collisions;c.dataset.flow=flow.toFixed(5)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('collision').setAttribute('aria-pressed',String(S.collision));$('budget').setAttribute('aria-pressed',String(S.budget));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.collision=S.step>=4;S.budget=S.step>=5;seed();update()});$('count').oninput=e=>{S.count=+e.target.value*1000;$('countOut').textContent=S.count.toLocaleString()+'개';update()};$('wind').oninput=e=>{S.wind=+e.target.value/100;$('windOut').textContent=(S.wind<0?'← ':'→ ')+Math.abs(+e.target.value)+'%';update()};$('collision').onclick=()=>{S.collision=!S.collision;update()};$('budget').onclick=()=>{S.budget=!S.budget;update()};function tick(){S.t++;simulate();draw();requestAnimationFrame(tick)}seed();update();tick();addEventListener('resize',draw);
})();
</script></body></html>
