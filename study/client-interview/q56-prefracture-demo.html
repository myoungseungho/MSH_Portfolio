<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q56 프리프랙처 파괴 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="파괴 순간 실시간 절단과 전부 스폰하는 실패를 프리프랙처, 타격 필드, 연결 그래프 계층 붕괴, 청크 풀과 수명, 서버 권위 상태로 개선하는 과정"></canvas><div class="hud"><span>Q56 · <b id="stage">실시간 절단·전부 스폰</b></span><span id="status">한 프레임에 메시·충돌·바디 생성이 몰림</span></div></div>
<div class="steps" role="group" aria-label="파괴 시스템 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>런타임 절단</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>프리프랙처</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>타격 필드</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>지지·계층</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>풀·수명</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>권위 상태</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="impact">타격 위치 X</label><output id="impactOut">42%</output></div><input id="impact" type="range" min="5" max="95" value="42"></div><div><div class="ct"><label for="strength">폭발 세기</label><output id="strengthOut">62%</output></div><input id="strength" type="range" min="10" max="100" value="62"></div><div class="toggles" role="group" aria-label="지지 그래프와 풀 서버 권위 설정"><button id="support" aria-pressed="false">지지 연결 그래프</button><button id="pool" aria-pressed="false">풀+서버 상태</button></div></div>
<div class="metrics"><div class="m"><small>파괴 프레임 할당</small><strong id="mAlloc">38.0 ms</strong></div><div class="m"><small>활성 물리 청크</small><strong id="mChunks">64</strong></div><div class="m"><small>지지 잃은 청크</small><strong id="mUnsupported">0</strong></div><div class="m"><small>네트워크 동기화</small><strong id="mNet">파편 전체?</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,impact:42,strength:62,support:false,pool:false,t:0};
const names=['실시간 절단·전부 스폰','오프라인에서 구운 청크','데미지 반경의 청크만 분리','지지 링크가 끊기면 위쪽 연쇄 붕괴','프리워밍 풀·활성 분산·잔해 수명','서버는 파괴 상태, 클라는 파편 물리'],status=['한 프레임에 메시·충돌·바디 생성이 몰림','런타임에는 이미 나뉜 조각을 보이기만 함','타격 위치와 세기에 따라 다른 구멍','약한 충격은 큰 덩어리, 강한 충격은 세분화','새로 만들지 않고 예산 안에서 빌려 씀','길이 열린 상태만 모두 같고 흩어짐은 로컬'];
const desc=['<b>실패 재현:</b> 맞는 순간 메시를 자르고 충돌을 굽고 64개 리지드바디를 한꺼번에 생성하므로 38ms 히치가 나고 잔해가 계속 누적됩니다.','<b>미리 잘라두기:</b> 오프라인 보로노이 청크를 정적 벽 뒤에 숨겨 두고, 런타임에는 이미 준비된 조각을 전환합니다. 절단·충돌 빌드가 사라집니다.','<b>국소 활성화:</b> 타격 위치의 데미지 필드 안에 있는 청크만 링크를 끊고 물리로 바꿉니다. 위치와 세기를 움직여 구멍 모양·활성 청크 수를 비교하세요.','<b>구조 붕괴:</b> 바닥까지 이어진 지지 링크를 탐색해 아래 청크가 끊기면 위쪽도 중력에 넘깁니다. 세기가 높으면 큰 청크가 더 작은 계층으로 갈라집니다.','<b>히치와 누적 제거:</b> 바디·볼록 헐을 풀에서 프리워밍하고 큰 조각부터 여러 프레임에 나눠 켭니다. 활성 상한 밖 작은 파편은 파티클로, 멎은 잔해는 Sleep·페이드합니다.','<b>멀티플레이 경계:</b> 서버는 “어느 청크 링크가 끊겼는가”와 시드만 동기화하고, 비결정적인 파편 궤적은 각 클라가 로컬로 꾸밉니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function brokenMap(){const out=[],cols=8,rows=6,ix=S.impact/100*(cols-1),iy=rows*.66,radius=.8+S.strength/26;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){let broken=S.step===0||S.step>=2&&Math.hypot(col-ix,(r-iy)*1.15)<radius,unsupported=false;if(S.step>=3&&S.support&&!broken){for(let rr=r+1;rr<rows;rr++)if(Math.abs(col-ix)<1.25&&Math.hypot(col-ix,(rr-iy)*1.15)<radius){unsupported=true;break}}out.push({r,col,broken,unsupported})}return out}
function vals(){const map=brokenMap(),raw=map.filter(v=>v.broken||v.unsupported).length,pool=S.step>=4&&S.pool,alloc=S.step===0?38:S.step===1?7:S.step<4?3.5:pool?.4:18,chunks=S.step===0?64:pool?Math.min(16,raw):raw,unsupported=map.filter(v=>v.unsupported).length,net=S.step<5?'미정':pool?'상태 18 B + 시드':'청크 transform 폭증';return{map,pool,alloc,chunks,unsupported,net}}
function pipeline(w,h,v){const ox=w*.035,oy=h*.18,gw=w*.31,gh=h*.68,narrow=w<900;label('DESTRUCTION COST PATH',ox,oy-16,'#72c9ff');const rows=[['CUT MESH',S.step<1?'RUNTIME BOOLEAN':'OFFLINE BAKE'],['BUILD COLLISION',S.step<1?'NOW':'PREBAKED HULL'],['SPAWN CHUNKS',S.step<4?'ALLOCATE':'POOL BORROW'],['ACTIVATE',S.step<4?'ONE FRAME':'STAGGER'],['DEBRIS',S.step<4?'ACCUMULATE':'CAP / SLEEP'],['NETWORK',S.step<5?'UNDEFINED':'STATE + SEED']];rows.forEach((r,i)=>{const y=oy+i*gh*.14;label(r[0],ox,y+11,'#97aab8');line(ox+gw*.34,y+5,ox+gw*.50,y+5,'#526b79');label(narrow&&r[1]==='PREBAKED HULL'?'BAKED HULL':r[1],ox+gw*.54,y+11,i<=S.step?'#8ce4b4':'#758b9b')});if(S.step>=3){if(!narrow){const tx=ox+gw*.08,ty=oy+gh*.84;for(let i=0;i<6;i++){const px=tx+i*gw*.14;line(px,ty,px,ty-28,i<3?'#ff8179':'#8ce4b4',2);x.fillStyle=i<3?'#ff8179':'#8ce4b4';x.beginPath();x.arc(px,ty-32,5,0,7);x.fill()}}label(v.unsupported+' UNSUPPORTED VIA GRAPH',ox+gw*.45,oy+gh*.98,v.unsupported?'#ff8179':'#8ce4b4','center')}}
function wall(w,h,v){const wx=w*.43,wy=h*.18,ww=w*.51,wh=h*.62,cols=8,rows=6,cw=ww/cols,ch=wh/rows,phase=Math.min(1,(S.t%150)/65),hitX=wx+S.impact/100*ww,hitY=wy+wh*.66;label('PRE-FRACTURED WALL · RUNTIME CHUNKS',wx,wy-16,S.step<1?'#ff8179':'#8ce4b4');line(wx,wy+wh+20,wx+ww,wy+wh+20,'#526b79',3);if(S.step===0){for(let i=0;i<5;i++){const a=i*Math.PI*.4+S.t*.015;line(hitX,hitY,hitX+Math.cos(a)*ww*.30,hitY+Math.sin(a)*wh*.30,'#ff8179',2)}label('BOOLEAN CUT + 64 BODY CREATE',hitX,hitY-35,'#ff8179','center')}
v.map.forEach((p,idx)=>{const baseX=wx+p.col*cw+(p.r%2?5:0),baseY=wy+p.r*ch,wc=cw-4,hc=ch-4,active=p.broken||p.unsupported;let dx=0,dy=0,rot=0;if(active&&S.step!==1){const vx=(p.col-(S.impact/100*(cols-1)))*(.8+S.strength/70),vy=(p.r-rows*.66)*.25;dx=vx*phase*35;dy=(vy*phase*20+phase*phase*120)*(p.unsupported?.65:1);rot=(idx%3-1)*phase*.22}if(v.pool&&idx%3===0&&active){x.globalAlpha=.24}x.save();x.translate(baseX+wc/2+dx,baseY+hc/2+dy);x.rotate(rot);x.fillStyle=active&&S.step>=2?'#b9794e':'#496779';x.fillRect(-wc/2,-hc/2,wc,hc);x.strokeStyle=active&&S.step>=2?'#ffd17f':S.step>=1?'#72c9ff':'#ff8179';x.strokeRect(-wc/2,-hc/2,wc,hc);if(S.step>=1){line(-wc/2,-hc/2,wc/2,hc/2,'#2d4354',1)}x.restore();x.globalAlpha=1;if(S.step>=3&&S.support&&!active&&p.r<rows-1)line(baseX+wc/2,baseY+hc,baseX+wc/2,baseY+ch,'#8ce4b4',1,[3,3])});if(S.step>=2){x.strokeStyle='#ff8179';x.setLineDash([6,4]);x.beginPath();x.arc(hitX,hitY,(.8+S.strength/26)*cw,0,7);x.stroke();x.setLineDash([]);label(`DAMAGE FIELD ${S.strength}%`,hitX,hitY-12,'#ff8179','center')}if(S.step>=4)label(v.pool?'POOL 32 · ACTIVE CAP 16 · FADE OLD':'RUNTIME ALLOC · NO DEBRIS CAP',wx+ww*.52,wy+wh*.94,v.pool?'#8ce4b4':'#ff8179','center');if(S.step>=5)label(v.pool?'SERVER: BROKEN MASK + SEED → CLIENT: LOCAL DEBRIS':'REPLICATE EVERY CHUNK TRANSFORM?',wx+ww*.52,wy+wh*1.05,v.pool?'#8ce4b4':'#ff8179','center')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);pipeline(w,h,v);wall(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('support').setAttribute('aria-pressed',String(S.support));$('pool').setAttribute('aria-pressed',String(S.pool));const v=vals();$('mAlloc').textContent=v.alloc.toFixed(1)+' ms';$('mChunks').textContent=String(v.chunks);$('mUnsupported').textContent=String(v.unsupported);$('mNet').textContent=v.net;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.support=S.step>=3;S.pool=S.step>=4;S.t=0;update()});$('impact').oninput=e=>{S.impact=+e.target.value;$('impactOut').textContent=S.impact+'%';S.t=0;update()};$('strength').oninput=e=>{S.strength=+e.target.value;$('strengthOut').textContent=S.strength+'%';S.t=0;update()};$('support').onclick=()=>{S.support=!S.support;S.t=0;update()};$('pool').onclick=()=>{S.pool=!S.pool;S.t=0;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
