<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q46 손 접촉·모션 워핑 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="벽 접촉점을 트레이스로 찾고 몸을 모션 워핑한 뒤 2본 핸드 IK로 손바닥을 표면에 맞추는 과정"></canvas><div class="hud"><span>Q46 · <b id="stage">고정 짚기 애니메이션</b></span><span id="status">거리·높이가 달라지면 허공 또는 관통</span></div></div>
<div class="steps" role="group" aria-label="손 접촉 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 짚기 애님</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>트레이스·소켓</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>핸드 2본 IK</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>고무팔 한계</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>몸 모션 워핑</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>각도·컨텍스트·폴백</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">접촉점 거리</label><output id="distanceOut">115 cm</output></div><input id="distance" type="range" min="45" max="190" value="115"></div><div><div class="ct"><label for="angle">접근 각도</label><output id="angleOut">28°</output></div><input id="angle" type="range" min="-80" max="80" value="28"></div><div class="toggles" role="group" aria-label="여러 프레임 yaw 워프와 팔 신전 한계·폴백"><button id="yawwarp" aria-pressed="false">yaw 분산 워프</button><button id="clamp" aria-pressed="false">신전 한계·폴백</button></div></div>
<div class="metrics"><div class="m"><small>손-표면 오차</small><strong id="mGap">35 cm</strong></div><div class="m"><small>팔 신전율</small><strong id="mExtend">118%</strong></div><div class="m"><small>회전 스냅</small><strong id="mYaw">28°/frame</strong></div><div class="m"><small>상호작용 판정</small><strong id="mStatus">허용</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,distance:115,angle:28,yawwarp:false,clamp:false,t:0},names=['single authored hand-contact clip','surface trace + target socket','analytic hand two-bone IK','IK absorbs too much error','root motion warped into reach range','context clip + distributed yaw + fallback'],desc=['<b>문제 재현:</b> 특정 거리·높이에 맞춘 짚기 애님 하나는 실제 표면이 달라지면 손이 허공에 남거나 벽을 관통합니다.','<b>목표를 먼저 확정:</b> 전방 스윕은 임의 벽의 위치·노멀을, 문손잡이 같은 정형 대상은 미리 배치한 핸드 소켓을 줍니다.','<b>남은 오차를 손끝에서:</b> 어깨·팔꿈치·손 2본 IK로 목표에 맞추고 손바닥을 표면 노멀에 정렬합니다.','<b>IK 하나의 대가:</b> 몸이 멀리 남은 채 손만 목표로 끌면 팔이 관절 한계를 넘어 고무처럼 펴집니다. 거리를 늘려 보세요.','<b>큰 오차는 몸이 흡수:</b> 접촉 프레임에 맞춰 루트 위치·회전을 워프해 자연스러운 팔 길이 안으로 들어온 뒤 IK는 마지막 몇 cm만 고칩니다.','<b>접근 상황까지 구분:</b> 좌·정면·우측 컨텍스트 애님을 고르고 yaw를 접근 구간에 나눠 보정합니다. 범위를 벗어나거나 못 닿으면 억지 접촉 대신 폴백합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let warp=S.step>=4,ik=S.step>=2,rawExtend=Math.round(S.distance/98*100),extend=warp?Math.min(91,Math.round(58+S.distance*.17)):rawExtend,out=S.distance>170||Math.abs(S.angle)>65,gap=ik?(warp?2:Math.max(0,S.distance-98)):Math.abs(S.distance-80),yaw=S.step>=4?(S.yawwarp?Math.abs(S.angle)/12:Math.abs(S.angle)):Math.abs(S.angle),status=S.step>=5&&S.clamp&&out?'폴백':S.step>=5&&out?'억지 허용':'허용';return{warp,ik,extend,gap,yaw,status,out}}
function arm(sx,sy,tx,ty,co){let L=72,dx=tx-sx,dy=ty-sy,d=Math.min(140,Math.max(15,Math.hypot(dx,dy))),mx=(sx+tx)/2,my=(sy+ty)/2,px=-dy/d,py=dx/d,k=Math.sqrt(Math.max(0,L*L-d*d/4)),ex=mx+px*k*.78,ey=my+py*k*.78;x.strokeStyle=co;x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(sx,sy);x.lineTo(ex,ey);x.lineTo(tx,ty);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(ex,ey,5,0,7);x.fill();return{ex,ey}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),floor=h*.80,wallX=w*.76,targetY=h*(.46-S.angle*.0015),idealX=wallX-10,baseX=v.warp?wallX-w*.29:w*.38,shoulderX=baseX+w*.035,shoulderY=h*.42,authHandX=baseX+w*.17,authHandY=h*.48,targetX=v.ik?idealX:authHandX,targetHandY=v.ik?targetY:authHandY,blocked=S.step>=5&&S.clamp&&v.out;x.fillStyle='#142631';x.fillRect(0,0,w,h);x.fillStyle='#405d6d';x.fillRect(wallX,0,w-wallX,floor);for(let y=0;y<floor;y+=42){x.strokeStyle='#526e7d';x.beginPath();x.moveTo(wallX,y);x.lineTo(w,y);x.stroke()}x.strokeStyle='#526c7c';x.lineWidth=3;x.beginPath();x.moveTo(w*.08,floor);x.lineTo(wallX,floor);x.stroke();if(S.step>=1){x.strokeStyle='#ffd17f';x.setLineDash([6,4]);x.beginPath();x.moveTo(baseX,h*.48);x.lineTo(idealX,targetY);x.stroke();x.setLineDash([]);x.fillStyle='#ffd17f';x.beginPath();x.arc(idealX,targetY,7,0,7);x.fill();x.strokeStyle='#ffd17f';x.lineWidth=3;x.beginPath();x.moveTo(idealX,targetY);x.lineTo(idealX-35,targetY);x.stroke();tag(S.step===1?'SWEEP HIT · POSITION + NORMAL':'HAND TARGET SOCKET / SURFACE HIT',w*.54,h*.20,'#ffd17f')}if(v.warp){x.strokeStyle='#8ce4b4';x.lineWidth=3;x.setLineDash([5,4]);x.beginPath();x.moveTo(w*.38,floor-8);x.lineTo(baseX,floor-8);x.stroke();x.setLineDash([]);tag(`ROOT WARP ${(S.distance-92).toFixed(0)} cm`,w*.38,floor-20,'#8ce4b4')}x.fillStyle='#6b9bb0';x.fillRect(baseX-w*.035,h*.36,w*.07,h*.25);x.strokeStyle='#72c9ff';x.lineWidth=11;x.beginPath();x.moveTo(baseX,h*.36);x.lineTo(baseX,h*.23);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(baseX,h*.19,19,0,7);x.fill();x.strokeStyle='#72c9ff';x.lineWidth=9;x.beginPath();x.moveTo(baseX-w*.02,h*.61);x.lineTo(baseX-w*.07,floor);x.moveTo(baseX+w*.02,h*.61);x.lineTo(baseX+w*.07,floor);x.stroke();let handX=blocked?Math.min(idealX-45,shoulderX+120):targetX,handY=blocked?targetY+18:targetHandY,co=v.extend>100&&!v.warp?'#ff8179':blocked?'#97aab8':'#72c9ff';arm(shoulderX,shoulderY,handX,handY,co);x.save();x.translate(handX,handY);x.rotate(v.ik?Math.PI/2:0);x.strokeStyle=blocked?'#97aab8':'#8ce4b4';x.lineWidth=10;x.beginPath();x.moveTo(-12,0);x.lineTo(12,0);x.stroke();x.restore();if(S.step===0){x.strokeStyle='#ff8179';x.setLineDash([5,4]);x.beginPath();x.moveTo(authHandX,authHandY);x.lineTo(idealX,targetY);x.stroke();x.setLineDash([]);tag(`${v.gap.toFixed(0)} cm GAP / PENETRATION`,w*.46,h*.29,'#ff8179')}if(S.step===2)tag('TWO-BONE IK + PALM NORMAL ALIGNMENT',w*.43,h*.29,'#8ce4b4');if(S.step===3){x.strokeStyle='#ff8179';x.beginPath();x.arc(shoulderX,shoulderY,145,0,Math.PI*2);x.stroke();tag(`${v.extend}% EXTENSION · RUBBER ARM`,w*.39,h*.18,'#ff8179')}if(S.step>=4)tag('WARP LARGE ERROR → IK LAST CENTIMETERS',w*.37,h*.28,'#8ce4b4');if(S.step>=5){let arc=Math.abs(S.angle)*Math.PI/180;x.strokeStyle=S.yawwarp?'#8ce4b4':'#ff8179';x.lineWidth=4;x.beginPath();x.arc(baseX,floor-4,65,-Math.PI/2-arc,-Math.PI/2);x.stroke();tag(S.yawwarp?'YAW SPREAD ACROSS APPROACH FRAMES':'ALL YAW IN ONE FRAME',w*.16,h*.25,S.yawwarp?'#8ce4b4':'#ff8179');tag(S.angle<-20?'LEFT CONTACT CLIP':S.angle>20?'RIGHT CONTACT CLIP':'FRONT CONTACT CLIP',w*.16,h*.34,'#72c9ff');if(blocked){x.strokeStyle='#ff8179';x.lineWidth=4;x.beginPath();x.moveTo(idealX-30,targetY-30);x.lineTo(idealX+5,targetY+5);x.moveTo(idealX+5,targetY-30);x.lineTo(idealX-30,targetY+5);x.stroke();tag('OUT OF ENTRY RANGE → CANCEL / FALLBACK',w*.48,h*.62,'#ff8179')}else tag('CONTACT WINDOW · IK WEIGHT 100%',w*.52,h*.62,'#8ce4b4')}
}function metrics(){const v=vals();$('mGap').textContent=v.gap.toFixed(0)+' cm';$('mExtend').textContent=v.extend+'%';$('mYaw').textContent=v.yaw.toFixed(1)+'°/frame';$('mStatus').textContent=v.status}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['거리·높이가 달라지면 허공 또는 관통','세계가 정확한 목표를 제공','손끝은 표면에 정렬','몸은 멀고 관절은 과신전','큰 오차는 루트가 흡수','억지 스냅보다 자연스러운 취소'][S.step];$('explain').innerHTML=desc[S.step];$('yawwarp').setAttribute('aria-pressed',String(S.yawwarp));$('clamp').setAttribute('aria-pressed',String(S.clamp));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.yawwarp=S.step===5;S.clamp=S.step===5;ui()});$('distance').oninput=e=>{S.distance=+e.target.value;$('distanceOut').textContent=e.target.value+' cm';ui()};$('angle').oninput=e=>{S.angle=+e.target.value;$('angleOut').textContent=e.target.value+'°';ui()};$('yawwarp').onclick=()=>{S.yawwarp=!S.yawwarp;ui()};$('clamp').onclick=()=>{S.clamp=!S.clamp;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
