<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q44 풋 IK·골반 보정 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="평지 애니메이션의 두 발을 지면 레이캐스트, 2본 IK, 골반 하강과 발 노멀 정렬로 계단에 맞추는 과정"></canvas><div class="hud"><span>Q44 · <b id="stage">평지 기준 FK 재생</b></span><span id="status">한 발은 뜨고 한 발은 관통</span></div></div>
<div class="steps" role="group" aria-label="풋 IK 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>애님 그대로 FK</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>양발 지면 레이</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>2본 IK</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>도달 한계</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>골반·발 노멀</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>풋 락·IK LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="roughness">지형 높이차</label><output id="roughnessOut">42 cm</output></div><input id="roughness" type="range" min="0" max="80" value="42"></div><div><div class="ct"><label for="speed">이동 속도</label><output id="speedOut">3.0 m/s</output></div><input id="speed" type="range" min="0" max="8" step=".5" value="3"></div><div class="toggles" role="group" aria-label="접지 발 월드 고정과 군중 IK LOD"><button id="footlock" aria-pressed="false">접지 발 풋 락</button><button id="iklod" aria-pressed="false">거리별 IK LOD</button></div></div>
<div class="metrics"><div class="m"><small>발-지면 오차</small><strong id="mError">42 cm</strong></div><div class="m"><small>접지 발 미끄러짐</small><strong id="mSlide">54 cm/s</strong></div><div class="m"><small>200 NPC 레이/프레임</small><strong id="mRays">400</strong></div><div class="m"><small>다리 도달</small><strong id="mReach">불안정</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,roughness:42,speed:3,footlock:false,iklod:false,t:0},names=['flat-ground FK pose','per-foot ground raycasts','analytic two-bone IK','leg reach limit exposed','pelvis offset + foot normal alignment','foot planting + stride warp + IK LOD'],desc=['<b>문제 재현:</b> 평지 애니메이션의 발 위치를 그대로 쓰면 계단에서는 왼발이 뜨고 오른발은 바닥을 뚫습니다.','<b>세계를 측정:</b> 각 발목 위에서 아래로 레이를 쏴 실제 접촉 높이와 표면 노멀을 얻습니다. 아직 다리는 애님 자세 그대로입니다.','<b>목표로 역산:</b> 허벅지·정강이 길이로 발 목표를 만족하는 무릎 위치를 한 번에 풀고 폴 벡터로 앞으로 굽힙니다.','<b>발만 당겨서는 부족:</b> 높이차가 커지면 한 다리가 최대 길이를 넘어 목표에 못 닿고 몸이 위에 붕 뜹니다.','<b>몸 전체를 얹기:</b> 낮은 발 기준으로 골반을 내리고 두 레이의 높이·노멀에 발바닥을 맞춰 양쪽 다리를 가동 범위로 돌려놓습니다.','<b>이동과 군중까지:</b> 접지 커브 동안 발 월드 위치를 잠그고 보폭을 속도에 맞춥니다. 먼 NPC는 레이를 줄이는 IK LOD로 예산을 지킵니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let ik=S.step>=2,pelvis=S.step>=4,error=ik?(pelvis?1:Math.max(2,S.roughness-36)):S.roughness,slide=S.step>=5&&S.footlock?Math.max(0,S.speed*2):S.speed*18,rays=S.iklod&&S.step>=5?68:400,reach=S.roughness>55&&!pelvis?'초과':ik&&!pelvis?'불안정':pelvis?'안정':'미보정';return{error,slide,rays,reach,ik,pelvis}}
function groundY(px,w,h){let center=w*.5,r=(px-center)/(w*.22),step=r<0?-S.roughness*.72:S.roughness*.28,wave=Math.sin(px*.035)*S.roughness*.08;return h*.78-step+wave}function limb(ax,ay,tx,ty,bend,co){let L=78,dx=tx-ax,dy=ty-ay,d=Math.min(L*1.94,Math.max(12,Math.hypot(dx,dy))),mx=(ax+tx)/2,my=(ay+ty)/2,px=-dy/d,py=dx/d,k=Math.sqrt(Math.max(0,L*L-d*d/4)),kx=mx+px*k*bend,ky=my+py*k*bend;x.strokeStyle=co;x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(ax,ay);x.lineTo(kx,ky);x.lineTo(tx,ty);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(kx,ky,5,0,7);x.fill();return{kx,ky}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.fillStyle='#142631';x.fillRect(0,0,w,h);x.fillStyle='#294654';x.beginPath();x.moveTo(0,h);for(let px=0;px<=w;px+=4)x.lineTo(px,groundY(px,w,h));x.lineTo(w,h);x.fill();const lx=w*.43,rx=w*.57,lgy=groundY(lx,w,h),rgy=groundY(rx,w,h),animY=h*.70,pelvisY=h*.40+(v.pelvis?Math.max(0,S.roughness-18)*.55:0),hipL=w*.47,hipR=w*.53,targetL=v.ik?lgy-5:animY,targetR=v.ik?rgy-5:animY;if(S.step>=1){[[lx,lgy],[rx,rgy]].forEach((p,i)=>{x.strokeStyle='#ffd17f';x.setLineDash([6,4]);x.beginPath();x.moveTo(p[0],h*.46);x.lineTo(p[0],p[1]);x.stroke();x.setLineDash([]);x.fillStyle='#ffd17f';x.beginPath();x.arc(p[0],p[1],6,0,7);x.fill();tag(`HIT ${i?'R':'L'} · NORMAL`,p[0]-42,p[1]-18,'#ffd17f')})}x.fillStyle='#6c9fb5';x.fillRect(w*.445,pelvisY-28,w*.11,40);x.strokeStyle='#72c9ff';x.lineWidth=11;x.beginPath();x.moveTo(w*.50,pelvisY-28);x.lineTo(w*.50,pelvisY-112);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(w*.50,pelvisY-130,20,0,7);x.fill();limb(hipL,pelvisY,lx,targetL,-1,v.reach==='초과'?'#ff8179':'#72c9ff');limb(hipR,pelvisY,rx,targetR,1,v.reach==='초과'?'#ff8179':'#72c9ff');function foot(px,py,gy,left){let angle=S.step>=4?Math.atan((groundY(px+20,w,h)-groundY(px-20,w,h))/40):0;x.save();x.translate(px,py);x.rotate(angle);x.strokeStyle=S.step>=4?'#8ce4b4':'#f2f8fc';x.lineWidth=7;x.beginPath();x.moveTo(left?-15:-8,0);x.lineTo(left?13:20,0);x.stroke();x.restore();if(S.step===0){x.strokeStyle='#ff8179';x.setLineDash([4,4]);x.beginPath();x.moveTo(px,py);x.lineTo(px,gy);x.stroke();x.setLineDash([])}}foot(lx,targetL,lgy,true);foot(rx,targetR,rgy,false);if(S.step===0)tag('FK FEET IGNORE WORLD SURFACE',w*.34,h*.20,'#ff8179');if(S.step===2)tag('TWO-BONE IK · POLE VECTOR FORWARD',w*.34,h*.19,'#8ce4b4');if(S.step===3){x.strokeStyle='#ff8179';x.beginPath();x.arc(hipL,pelvisY,157,0,Math.PI*2);x.stroke();tag('MAX LEG REACH',w*.25,h*.27,'#ff8179')}if(S.step>=4){x.strokeStyle='#8ce4b4';x.lineWidth=2;x.beginPath();x.moveTo(w*.39,pelvisY-34);x.lineTo(w*.61,pelvisY-34);x.stroke();tag(`PELVIS OFFSET ${(Math.max(0,S.roughness-18)*.55).toFixed(0)} px`,w*.43,pelvisY-48,'#8ce4b4')}if(S.step>=5){const lockX=lx+Math.sin(S.t*.04*S.speed)*34;if(!S.footlock){x.globalAlpha=.23;x.fillStyle='#ff8179';for(let i=0;i<5;i++)x.fillRect(lockX-i*12,lgy-12,18,8);x.globalAlpha=1;tag('CAPSULE SPEED ≠ ANIM STRIDE → SLIDE',w*.28,h*.91,'#ff8179')}else tag('CONTACT CURVE → WORLD-SPACE FOOT LOCK',w*.31,h*.91,'#8ce4b4');if(S.iklod){for(let i=0;i<10;i++){x.fillStyle=i<2?'#72c9ff':i<5?'#ffd17f':'#516876';x.fillRect(w*.70+i*18,h*.24+i*7,8,28)}tag('NEAR 60Hz · MID 10Hz · FAR OFF',w*.68,h*.21,'#8ce4b4')}}
}function metrics(){const v=vals();$('mError').textContent=v.error.toFixed(0)+' cm';$('mSlide').textContent=v.slide.toFixed(0)+' cm/s';$('mRays').textContent=v.rays;$('mReach').textContent=v.reach}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['한 발은 뜨고 한 발은 관통','접촉점과 노멀 확보','발 목표에 맞춰 관절 역산','긴 목표는 다리 밖','몸·발바닥까지 지형에 정렬','접지 안정성과 군중 예산'][S.step];$('explain').innerHTML=desc[S.step];$('footlock').setAttribute('aria-pressed',String(S.footlock));$('iklod').setAttribute('aria-pressed',String(S.iklod));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.footlock=S.step===5;S.iklod=S.step===5;ui()});$('roughness').oninput=e=>{S.roughness=+e.target.value;$('roughnessOut').textContent=e.target.value+' cm';ui()};$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=(+e.target.value).toFixed(1)+' m/s';ui()};$('footlock').onclick=()=>{S.footlock=!S.footlock;ui()};$('iklod').onclick=()=>{S.iklod=!S.iklod;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
