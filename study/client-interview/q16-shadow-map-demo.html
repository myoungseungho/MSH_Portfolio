<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q16 섀도우맵 단계형 실험실</title>
<style>
:root{--bg:#090d13;--panel:#121a25;--line:#2b394b;--ink:#edf3fa;--muted:#94a5b9;--sun:#ffd16a;--cyan:#66d8e7;--red:#ff6b72}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#080c12}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--sun)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#171106}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--sun)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6e8096;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="픽셀 광선 검사에서 섀도우맵 깊이 비교, 바이어스, PCF와 안정화까지 쌓아가는 그림자 구현 단계"></canvas><div class="hud"><span>Q16 · <b id="stage">픽셀마다 광선</b></span><span id="status">비용 폭발</span></div></div>
<div class="steps" role="group" aria-label="섀도우맵 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>순진한 광선</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>광원 깊이맵</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>깊이 비교</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>바이어스 함정</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>접촉 복구</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>PCF·안정화</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="bias">깊이 바이어스</label><output id="biasOut">18%</output></div><input id="bias" type="range" min="0" max="100" value="18"></div><div><div class="ct"><label for="pcf">PCF 커널</label><output id="pcfOut">1×1</output></div><input id="pcf" type="range" min="0" max="3" value="0" step="1"></div><div class="toggles" role="group" aria-label="그림자 안정화 옵션"><button id="contact" aria-pressed="false">발밑 접촉 보강</button><button id="snap" aria-pressed="false">텍셀 스냅</button></div></div>
<div class="metrics"><div class="m"><small>가림 검사 / 픽셀</small><strong id="mTests">1,000K+</strong></div><div class="m"><small>자기 그림자 오판</small><strong id="mAcne">—</strong></div><div class="m"><small>발밑 분리 간격</small><strong id="mGap">—</strong></div><div class="m"><small>카메라 이동 안정성</small><strong id="mStable">낮음</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,bias:.18,pcf:0,contact:false,snap:false},names=['픽셀마다 광선','광원 시점 깊이맵','깊이 한 번 비교','바이어스의 두 실패','슬로프·노멀 + 접촉','PCF + 텍셀 스냅'];
const desc=['<b>문제 재현:</b> 화면 픽셀마다 태양을 향해 광선을 쏘면 그림자는 정확하지만, 수백만 픽셀 × 수백만 삼각형의 교차 검사가 필요해 실시간 예산이 무너집니다.','<b>검사를 뒤집기:</b> 태양 시점에서 씬을 한 번 그려 각 방향의 가장 가까운 깊이만 저장합니다. 오른쪽 깊이맵의 밝기가 태양과의 거리를 뜻합니다.','<b>한 번의 비교:</b> 화면 픽셀을 광원 공간으로 옮겨 내 깊이와 저장 깊이를 비교합니다. 저장값보다 멀면 앞에 가림물이 있으므로 그림자입니다.','<b>정밀도 함정:</b> 바이어스가 작으면 바닥이 자신을 가려 검은 애크니가 생기고, 너무 크면 그림자가 물체에서 떨어지는 피터패닝이 생깁니다. 슬라이더로 두 실패를 직접 오가 보세요.','<b>역할 분담:</b> 기울어진 면에는 슬로프 바이어스, 표면에는 노멀 오프셋을 적용하고, 해상도가 놓친 발밑 한 픽셀은 컨택트 섀도우로 복구합니다.','<b>최종 안정화:</b> 주변 깊이 비교의 평균인 PCF로 계단을 부드럽게 하고, 광원 격자를 월드 텍셀에 스냅해 카메라 이동 때 경계가 끓지 않게 합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function label(text,px,py,color='#eef3fa'){x.fillStyle='rgba(5,9,14,.82)';x.fillRect(px-7,py-14,x.measureText(text).width+14,22);x.fillStyle=color;x.font='600 10px system-ui';x.fillText(text,px,py)}
function sun(w,h){const sx=w*.12,sy=h*.16;x.fillStyle='#ffd16a';x.beginPath();x.arc(sx,sy,19,0,7);x.fill();x.strokeStyle='rgba(255,209,106,.38)';x.lineWidth=2;for(let i=0;i<8;i++){const a=i*Math.PI/4;x.beginPath();x.moveTo(sx+26*Math.cos(a),sy+26*Math.sin(a));x.lineTo(sx+35*Math.cos(a),sy+35*Math.sin(a));x.stroke()}return[sx,sy]}
function character(cx,ground){x.strokeStyle='#dce7f2';x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(cx,ground-95,13,0,7);x.stroke();x.beginPath();x.moveTo(cx,ground-80);x.lineTo(cx,ground-38);x.moveTo(cx,ground-68);x.lineTo(cx-20,ground-50);x.moveTo(cx,ground-68);x.lineTo(cx+20,ground-54);x.moveTo(cx,ground-38);x.lineTo(cx-15,ground-4);x.moveTo(cx,ground-38);x.lineTo(cx+17,ground-4);x.stroke()}
function depthInset(w,h){const ix=w*.735,iy=h*.10,iw=w*.22,ih=h*.33;x.fillStyle='#071019';x.fillRect(ix,iy,iw,ih);x.strokeStyle='#66d8e7';x.lineWidth=1;x.strokeRect(ix,iy,iw,ih);for(let i=0;i<18;i++){const v=i<7?35+i*7:i<12?95+i*4:190+i*2;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(ix+i*iw/18,iy+24,iw/18+1,ih-24)}x.fillStyle='#66d8e7';x.font='600 9px ui-monospace,monospace';x.fillText('LIGHT-SPACE DEPTH',ix+8,iy+15);x.fillStyle='#05080d';x.fillRect(ix+iw*.43,iy+ih*.32,iw*.16,ih*.68)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,gY=h*.78,cx=w*.48,[sx,sy]=sun(w,h);x.clearRect(0,0,w,h);let bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#173047');bg.addColorStop(.76,'#294350');bg.addColorStop(.77,'#172019');bg.addColorStop(1,'#0c120f');x.fillStyle=bg;x.fillRect(0,0,w,h);sun(w,h);x.fillStyle='#253929';x.fillRect(0,gY,w,h-gY);x.strokeStyle='#52715a';x.lineWidth=2;x.beginPath();x.moveTo(0,gY);x.lineTo(w,gY);x.stroke();
// caster tree and character
x.fillStyle='#473327';x.fillRect(w*.30,gY-112,20,112);x.fillStyle='#31563b';for(const [ox,oy,r] of [[-.03,-.35,34],[.02,-.42,38],[.055,-.31,30]]){x.beginPath();x.arc(w*(.31+ox),gY+h*oy,r,0,7);x.fill()}character(cx,gY);
if(S.step===0){x.strokeStyle='rgba(255,107,114,.55)';x.lineWidth=1;for(let i=0;i<22;i++){const px=w*(.06+i*.042),py=gY-(i%4)*12;x.beginPath();x.moveTo(px,py);x.lineTo(sx,sy);x.stroke()}label('× 2,073,600 PIXEL RAYS',w*.62,h*.20,'#ff7c82');x.fillStyle='rgba(255,107,114,.75)';for(let i=0;i<9;i++)x.fillRect(w*.60+i*8,h*.24,4,16+(i%3)*7)}
if(S.step>=1){depthInset(w,h);x.strokeStyle='rgba(102,216,231,.42)';x.setLineDash([5,5]);for(const px of [w*.30,w*.49,w*.63]){x.beginPath();x.moveTo(sx,sy);x.lineTo(px,gY);x.stroke()}x.setLineDash([]);label('PASS 1 · 깊이만 기록',w*.06,h*.44,'#66d8e7')}
if(S.step>=2){const low=S.step===3&&S.bias<.26,high=S.step===3&&S.bias>.60,smart=S.step>=4;let gap=high?8:smart&&!S.contact?2:0,soft=S.step>=5?S.pcf:0,shadowStart=cx+12+gap,shadowEnd=w*.82;x.save();x.beginPath();x.rect(0,gY-3,w,h-gY+5);x.clip();if(soft===0){x.fillStyle='rgba(2,4,7,.78)';x.beginPath();x.moveTo(shadowStart,gY);x.lineTo(shadowEnd,gY+31);x.lineTo(shadowEnd+20,gY+42);x.lineTo(shadowStart,gY+7);x.fill()}else{for(let i=soft*5;i>=0;i--){x.fillStyle=`rgba(2,4,7,${.48/(soft*5+1)})`;x.beginPath();x.moveTo(shadowStart-i,gY);x.lineTo(shadowEnd+i*2,gY+31+i*.35);x.lineTo(shadowEnd+20+i*2,gY+43+i*.35);x.lineTo(shadowStart-i,gY+7);x.fill()}}if(S.contact&&S.step>=4){const g=x.createRadialGradient(cx+8,gY,0,cx+8,gY,32);g.addColorStop(0,'rgba(0,0,0,.92)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(cx-25,gY-8,70,25)}x.restore();
if(low){x.fillStyle='rgba(4,5,7,.66)';for(let yy=gY-5;yy<gY+52;yy+=8)for(let xx=40+(yy%3)*7;xx<w-30;xx+=27){x.beginPath();x.ellipse(xx,yy,10,2.3,-.1,0,7);x.fill()}label('SELF-SHADOW · ACNE',w*.07,h*.62,'#ff7c82')}
if(high){x.strokeStyle='#ff6b72';x.lineWidth=2;x.beginPath();x.moveTo(cx+11,gY+2);x.lineTo(shadowStart,gY+2);x.stroke();label('PETER-PANNING · 그림자 분리',w*.56,h*.68,'#ff7c82')}
if(S.step===2){x.strokeStyle='#ffd16a';x.lineWidth=2;x.beginPath();x.moveTo(w*.61,h*.49);x.lineTo(w*.61,h*.70);x.stroke();label('pixelDepth > mapDepth ?',w*.45,h*.46,'#ffd16a')}
if(S.step>=4){label('SLOPE + NORMAL OFFSET',w*.06,h*.54,'#66d8e7');if(S.contact)label('CONTACT 복구',w*.44,h*.86,'#66d8e7')}
if(S.step>=5){const y=h*.57;x.strokeStyle=S.snap?'#66d8e7':'rgba(255,107,114,.7)';x.lineWidth=1;for(let i=0;i<14;i++){const xx=w*.06+i*10+(S.snap?0:3.4);x.strokeRect(xx,y+(i%2)*2,9,8)}label(S.snap?'월드 텍셀에 고정':'격자 어긋남 → 스위밍',w*.06,h*.53,S.snap?'#66d8e7':'#ff7c82')}
}character(cx,gY)}
function metrics(){const low=S.step===3&&S.bias<.26,high=S.step===3&&S.bias>.60,smart=S.step>=4;$('mTests').textContent=S.step===0?'1,000K+':'1 depth';$('mAcne').textContent=S.step<3?'—':low?Math.round((.26-S.bias)*280)+'%':smart?'< 1%':'0%';$('mGap').textContent=S.step<3?'—':high?Math.round((S.bias-.60)*34)+' px':smart&&!S.contact?'2 px':'0 px';$('mStable').textContent=S.step>=5&&S.snap?'높음 (고정)':S.step>=5?'낮음 (스위밍)':'낮음'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['비용 폭발','깊이 텍스처 1회','광선 → 숫자 비교','애크니 ↔ 피터패닝','접촉 역할 분담','부드럽고 안정적'][S.step];$('contact').setAttribute('aria-pressed',String(S.contact));$('snap').setAttribute('aria-pressed',String(S.snap));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===3){S.bias=.08;$('bias').value=8;$('biasOut').textContent='8%'}if(S.step===4){S.bias=.34;$('bias').value=34;$('biasOut').textContent='34%'}if(S.step===5){S.pcf=2;$('pcf').value=2;$('pcfOut').textContent='5×5'}ui()});$('bias').oninput=e=>{S.bias=+e.target.value/100;$('biasOut').textContent=e.target.value+'%';ui()};$('pcf').oninput=e=>{S.pcf=+e.target.value;$('pcfOut').textContent=(S.pcf*2+1)+'×'+(S.pcf*2+1);ui()};$('contact').onclick=()=>{S.contact=!S.contact;ui()};$('snap').onclick=()=>{S.snap=!S.snap;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
