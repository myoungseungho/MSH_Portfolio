*{box-sizing:border-box}html,body{margin:0}body{background:#090c12;color:#edf2f8;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#r{padding:14px}.view{height:330px;border:1px solid #2b3546;border-radius:12px;overflow:hidden;background:#111a27}canvas{width:100%;height:100%;display:block}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:12px}.controls label{color:#ffcb7a;font-weight:700;font-size:12px}.controls input{width:100%;accent-color:#ffb448}.controls button{border:1px solid #354157;border-radius:8px;background:#151b27;color:#b9c5d6;padding:8px 12px;cursor:pointer}.controls button.on{background:#ffb448;color:#171008}.note{margin:11px 0 0;border-left:2px solid #4d95a5;padding-left:10px;color:#abb8ca;font-size:12px;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:11px;background:#2b3546;border:1px solid #2b3546;border-radius:9px;overflow:hidden}.metrics div{background:#121823;padding:8px 10px;font:12px ui-monospace,Consolas,monospace}.metrics small{display:block;color:#718096;font-size:9px}@media(max-width:560px){.view{height:260px}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}</style></head><body><div id="r"><div class="view"><canvas id="c" role="img" aria-label="문항 인터랙티브 시뮬레이션"></canvas></div><div class="controls"><label id="label" for="range"></label><input id="range" type="range" min="0" max="100" value="25"><button id="mode" type="button"></button></div><p class="note" id="note"></p><div class="metrics"><div><small>입력</small><span id="m1"></span></div><div><small>처리 상태</small><span id="m2"></span></div><div><small>출력 변화</small><span id="m3"></span></div></div></div><script>
(()=>{const q=Math.max(11,Math.min(50,+(new URLSearchParams(location.search).get('q')||11))),c=document.querySelector('#c'),x=c.getContext('2d'),$=s=>document.querySelector(s);const names={11:'눈 변형·복원',12:'진흙·모래 발자국',13:'이끼·녹·물때',14:'유리 굴절·흡수',15:'비등방성 광택',16:'동적 태양 그림자',17:'거리별 그림자 품질',18:'젖은 바닥 반사',19:'호수 거울 반사',20:'접촉 음영 AO',21:'환경 반사',22:'물 굴절·깊이',23:'배·캐릭터 항적',24:'폭포 물보라',25:'빗방울 파문',26:'용암 흐름·냉각',27:'대기 원근감',28:'볼류메트릭 광선',29:'비·젖음·건조',30:'눈보라 화이트아웃',31:'볼류메트릭 구름',32:'전역 바람장',33:'골짜기 안개 소산',34:'피사계 심도',35:'모션 블러',36:'LOD 전환',37:'먼 배경 임포스터',38:'프러스텀·오클루전 컬링',39:'월드 스트리밍',40:'월드 원점 이동',41:'패스트 트래블 프리로드',42:'원거리 월드 렌더링',43:'NPC 활성화 버블',44:'발 IK',45:'관성 감속·풋락',46:'손 IK·워핑',47:'경사 보행 IK',48:'상·하체 레이어',49:'무기 상태 블렌딩',50:'절벽 균형 애니메이션'};let p=.25,on=false,t=0;const group=q<=15?0:q<=21?1:q<=26?2:q<=35?3:q<=43?4:5;$('#label').textContent=`Q${q} · ${names[q]}`;$('#mode').textContent='기본 구현';$('#note').textContent='슬라이더와 개선 모드를 바꾸면 문항의 핵심 현상이 화면에서 즉시 달라집니다.';function rs(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}function glow(cx,cy,r,col,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}function bg(w,h,a='#17243a',b='#314b51'){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,w,h)}function surface(w,h){bg(w,h);x.fillStyle=q===13?'#5a5648':q===14?'#24445c':q===15?'#6d747d':'#dce8ed';x.fillRect(0,h*.48,w,h*.52);if(q===11||q===12){for(let i=0;i<7;i++){const xx=w*(.18+i*.11),d=(on?36:10)*p;x.fillStyle='#71828a';x.beginPath();x.ellipse(xx,h*.58+(i%2)*20,25,9+d,0,0,7);x.fill();if(on){x.strokeStyle='#f3fbff';x.lineWidth=3;x.stroke()}}}else if(q===13){for(let i=0;i<35;i++){x.fillStyle=i%2?'#4d7e3f':'#8d4c2e';x.beginPath();x.arc((i*83)%w,h*.5+((i*47)%(h*.5)),3+p*8,0,7);x.fill()}}else if(q===14){x.save();x.globalAlpha=.7;x.fillStyle='#9be3ef';x.transform(1,0,on?p*.35:0,1,w*.35,0);x.fillRect(0,h*.2,w*.28,h*.6);x.restore();glow(w*.48,h*.45,120,'65,205,235',p)}else{for(let i=0;i<12;i++){x.strokeStyle=`rgba(255,235,180,${.08+p*.08})`;x.lineWidth=on?2:10;x.beginPath();x.moveTo(0,h*(.2+i*.045));x.lineTo(w,h*(.35+i*.025));x.stroke()}}}function light(w,h){bg(w,h);x.fillStyle='#354936';x.fillRect(0,h*.6,w,h*.4);const cx=w*.48,cy=h*.58;if(q===18||q===19||q===21){x.fillStyle=on?'rgba(95,175,220,.65)':'rgba(90,100,115,.25)';for(let i=0;i<6;i++)x.fillRect(w*.12,h*(.63+i*.05),w*.75,on?5:2)}else{x.fillStyle='#e5ddcc';x.fillRect(cx-15,cy-90,30,90);x.fillStyle='rgba(5,10,15,.55)';x.beginPath();x.ellipse(cx+p*w*.32,cy+18,40+p*w*.3,on?8:22,0,0,7);x.fill();if(q===20){glow(cx,cy,80,'0,0,0',on?.6*p:.1)}}}function fluid(w,h){bg(w,h,'#182333','#163e52');x.fillStyle=q===26?'#4a1710':'#1c6380';x.fillRect(0,h*.45,w,h*.55);if(q===26){for(let i=0;i<8;i++){x.strokeStyle=i%2?'#ff5b19':'#ffb22f';x.lineWidth=3+p*8;x.beginPath();x.moveTo(0,h*(.5+i*.05));x.bezierCurveTo(w*.3,h*(.35+i*.08),w*.7,h*(.7-i*.03),w,h*(.5+i*.04));x.stroke()}}else{for(let i=0;i<10;i++){const r=(i+1)*p*18;x.strokeStyle=`rgba(190,235,255,${1-i/11})`;x.beginPath();x.ellipse(w*.5,h*.58,r,r*.22,0,0,7);x.stroke()}if(q===24||q===23)for(let i=0;i<45;i++){x.fillStyle='#dff7ff';x.fillRect((i*97+t*70)%w,h*.42+((i*37)%120),2+p*4,2+p*4)}}}function air(w,h){bg(w,h,q>=34?'#182038':'#31577a',q===30?'#dce7ec':'#6c7a73');for(let i=0;i<7;i++){const z=i/7,yy=h*(.28+z*.08);x.fillStyle=`rgba(200,225,235,${on?p*z:.08})`;x.fillRect(0,yy,w,h*.12)}if(q===28){x.fillStyle=`rgba(255,230,160,${on?.15+p*.55:.08})`;x.beginPath();x.moveTo(w*.25,0);x.lineTo(w*.7,h);x.lineTo(w*.42,h);x.fill()}if(q===30||q===32)for(let i=0;i<70;i++){x.fillStyle='#edf7ff';x.fillRect((i*71+t*(on?180:40))%w,(i*43)%h,2+p*5,2)}if(q===34){x.filter=`blur(${on?p*9:0}px)`;glow(w*.5,h*.5,100,'255,190,90',.8);x.filter='none'}if(q===35){x.fillStyle='rgba(255,255,255,.4)';for(let i=0;i<14;i++)x.fillRect(w*.2+i*35,h*.55,on?20+p*45:5,4)}}function world(w,h){bg(w,h,'#31577a','#66816d');const count=on?Math.round(8+p*55):Math.round(70-p*20);for(let i=0;i<count;i++){const z=((i*53)%100)/100,sz=3+z*18;x.fillStyle=i%3?'#243c2a':'#7b6b54';x.fillRect((i*89)%w,h*.35+z*h*.55,sz,sz*1.8)}if(q===39||q===41){x.strokeStyle='#ffbd60';x.lineWidth=3;x.strokeRect(w*.3-p*w*.2,h*.25,w*(.4+p*.4),h*.6)}if(q===40){x.fillStyle='#fff';x.font='14px monospace';x.fillText(on?'ORIGIN REBASED (0,0,0)':'WORLD 8,000,000m',20,30)}}function anim(w,h){bg(w,h,'#20283b','#263a38');const cx=w*.5,gy=h*.78,phase=on?Math.sin(t*3)*p:0;x.strokeStyle='#f2b58f';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(cx,gy-120);x.lineTo(cx+phase*40,gy-65);x.lineTo(cx-35,gy-10+(q===44||q===47?Math.sin(p*3)*35:0));x.moveTo(cx+phase*40,gy-65);x.lineTo(cx+45,gy-(q===50?p*45:10));x.moveTo(cx+phase*20,gy-95);x.lineTo(cx+(q===46||q===48?90*p:35),gy-65);x.stroke();x.fillStyle='#f2b58f';x.beginPath();x.arc(cx,gy-145,20,0,7);x.fill();x.strokeStyle='#7db2cc';x.lineWidth=4;x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy-(q===47?p*90:0));x.stroke()}function draw(ts=0){t=ts/1000;rs();const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);[surface,light,fluid,air,world,anim][group](w,h);$('#m1').textContent=Math.round(p*100)+'%';$('#m2').textContent=on?'개선 ON':'기본';$('#m3').textContent=(on?Math.round(p*100):Math.round(p*20))+'%';requestAnimationFrame(draw)}$('#range').oninput=e=>p=+e.target.value/100;$('#mode').onclick=()=>{on=!on;$('#mode').classList.toggle('on',on);$('#mode').textContent=on?'개선 구현':'기본 구현'};addEventListener('resize',rs);draw();try{parent.postMessage({type:'q-lab-h',h:Math.ceil($('#r').getBoundingClientRect().height)+4},'*')}catch(e){}})();</script></body></html>
