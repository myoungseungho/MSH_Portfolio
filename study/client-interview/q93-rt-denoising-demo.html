<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q93 RT 디노이즈 실험실</title><style>
:root{--bg:#080c13;--panel:#111925;--line:#334258;--ink:#f4f7fb;--muted:#9cabbc;--cyan:#73d7ff;--violet:#b59cff;--green:#7fe0a5;--red:#ff7d78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#101826}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#050910df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8292a5;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="1spp 레이트레이싱 반사가 공간 필터, 모션 벡터 재투영, 템포럴 누적과 분산 클램프로 정리되는 실험"></canvas><div class="hud"><span>Q93 · <b id="stage">광선을 많이 쏘기</b></span><span id="status">오프라인은 깨끗하지만 16ms 실시간 예산을 수십 배 초과</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>수백 spp</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>실시간 1spp</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>공간 필터</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>시간 누적</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>재투영·클램프</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>잔상↔노이즈</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="turn">카메라 회전 속도</label><output id="turnOut">15°/s</output></div><input id="turn" type="range" min="0" max="180" value="15"></div><div><div class="ct"><label for="history">히스토리 길이</label><output id="historyOut">16 frames</output></div><input id="history" type="range" min="1" max="32" value="16"></div><div class="toggles"><button id="spatial" aria-pressed="false">공간 폴백</button><button id="clamp" aria-pressed="false">분산 클램프</button></div></div>
<div class="metrics"><div class="m"><small>유효 샘플</small><strong id="mSpp">256 spp</strong></div><div class="m"><small>잔여 노이즈</small><strong id="mNoise">2%</strong></div><div class="m"><small>고스팅</small><strong id="mGhost">0%</strong></div><div class="m"><small>히스토리 유효</small><strong id="mValid">100%</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,turn:15,history:16,spatial:false,clamp:false};const names=['픽셀마다 수백 광선 평균','실시간 예산의 1spp 반사','깊이·노멀을 지키는 공간 필터','모션 벡터로 이전 프레임 샘플 누적','가려짐 판정 + 분산 범위로 히스토리 클램프','히스토리 길이로 노이즈와 잔상 협상'];const stats=['오프라인은 깨끗하지만 16ms 실시간 예산을 수십 배 초과','소금·후추처럼 매 프레임 끓는 몬테카를로 노이즈','비슷한 표면 이웃만 섞어 경계는 보존','정지하면 프레임마다 샘플이 쌓여 빠르게 수렴','새로 드러난 영역은 버리고 공간 필터로 대신 채움','길면 깨끗하지만 늦고, 짧으면 즉각적이지만 거칠어짐'];const desc=['<b>정답이지만 실시간 불가:</b> 수백 광선을 평균내면 깨끗하지만 한 프레임 비용이 예산을 수십 배 넘습니다. 게임은 1spp 이하에서 복원해야 합니다.','<b>샘플 부족의 모습:</b> 픽셀마다 한 광선만 쏘면 어두운 방과 반사가 무작위 점으로 끓습니다. 광선을 늘릴 수 없으니 다른 픽셀과 프레임에서 빌립니다.','<b>공간에서 빌리기:</b> 깊이·노멀·러프니스가 비슷한 이웃만 섞는 바이래터럴/à-trous 필터로 경계는 남기고 노이즈를 낮춥니다. 강하면 디테일이 무뎌집니다.','<b>시간에서 빌리기:</b> 모션 벡터로 현재 픽셀의 이전 위치를 찾아 히스토리를 누적합니다. 카메라가 멈추면 유효 샘플이 히스토리 길이만큼 증가합니다.','<b>언제 버릴지 판단:</b> 새로 드러난 영역, 화면 밖 재투영, 조명 변화는 히스토리를 거부합니다. 이번 프레임 이웃의 분산 범위를 벗어난 값도 클램프합니다.','<b>정직한 트레이드오프:</b> 히스토리를 길게 믿으면 깨끗하지만 움직이는 반사가 늦게 따라옵니다. 회전 속도와 길이를 바꾸고 공간 폴백·클램프를 껐다 켜 보세요.'];
function calc(){let valid=Math.max(0,100-S.turn*.48),spp=S.step===0?256:S.step<3?1:Math.max(1,Math.round(S.history*valid/100)),noise=S.step===0?2:S.step===1?72:S.step===2?31:Math.round(70/Math.sqrt(spp)),ghost=S.step>=3?Math.round(S.history*S.turn/170):0;if(S.step>=4&&S.clamp){ghost=Math.round(ghost*.35);noise+=5}if(S.spatial&&S.step>=2){noise=Math.round(noise*.62);ghost=Math.round(ghost*.9)}return{valid:Math.round(valid),spp,noise:Math.min(99,noise),ghost:Math.min(99,ghost)}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function hash(n){let v=Math.sin(n*127.1+S.turn*3.1)*43758.5453;return v-Math.floor(v)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc();x.fillStyle='#0e1724';x.fillRect(0,0,w,h);x.fillStyle='#172a3b';x.fillRect(0,h*.52,w,h*.48);let count=Math.round(80+V.noise*9);for(let i=0;i<count;i++){let px=hash(i)*w,py=hash(i+991)*h*.74,bright=hash(i+2201)>.5;x.globalAlpha=.12+V.noise/125;x.fillStyle=bright?'#d8f4ff':'#05080d';x.fillRect(px,py,2+(i%3),2+(i%3))}x.globalAlpha=1;x.fillStyle='#ffcf72';x.beginPath();x.arc(w*.28,h*.35,34,0,Math.PI*2);x.fill();x.fillStyle='#6ed1ff55';x.beginPath();x.ellipse(w*.66,h*.69,w*.16,h*.08,0,0,Math.PI*2);x.fill();if(V.ghost>8){x.globalAlpha=Math.min(.55,V.ghost/100);x.fillStyle='#ffcf72';x.beginPath();x.arc(w*.28+V.ghost*1.5,h*.35,34,0,Math.PI*2);x.fill();x.globalAlpha=1}x.strokeStyle='#7fe0a5';x.lineWidth=3;x.beginPath();x.arc(w*.82,h*.27,44,-Math.PI/2,-Math.PI/2+Math.PI*2*V.valid/100);x.stroke();x.fillStyle='#f4f7fb';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`HISTORY ${V.valid}%`,w*.785,h*.28);$('mSpp').textContent=V.spp+' spp';$('mNoise').textContent=V.noise+'%';$('mGhost').textContent=V.ghost+'%';$('mValid').textContent=V.valid+'%';c.dataset.spp=V.spp;c.dataset.noise=V.noise;c.dataset.ghost=V.ghost;c.dataset.valid=V.valid}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('spatial').setAttribute('aria-pressed',String(S.spatial));$('clamp').setAttribute('aria-pressed',String(S.clamp));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.spatial=S.step>=2;S.clamp=S.step>=4;update()});$('turn').oninput=e=>{S.turn=+e.target.value;$('turnOut').textContent=e.target.value+'°/s';draw()};$('history').oninput=e=>{S.history=+e.target.value;$('historyOut').textContent=e.target.value+' frames';draw()};$('spatial').onclick=()=>{S.spatial=!S.spatial;update()};$('clamp').onclick=()=>{S.clamp=!S.clamp;update()};update();addEventListener('resize',draw)})();
</script></body></html>
