<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q89 다이내믹 해상도 실험실</title><style>
:root{--bg:#0b0d13;--panel:#171923;--line:#414352;--ink:#f8f7f3;--muted:#aaa9b2;--orange:#ffad63;--gold:#ffd36f;--red:#ff7774;--cyan:#73d6ff;--green:#83dfa6}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#19151a}canvas{width:100%;height:100%;display:block;image-rendering:auto}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07080ddf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--orange)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#1b0d05}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--orange);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--orange)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#92919b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="전투 강도가 높아질 때 다이내믹 해상도, 예측, 히스테리시스, TSR, 품질 스케일러가 프레임 예산을 지키는 실험"></canvas><div class="hud"><span>Q89 · <b id="stage">고정 네이티브 화질</b></span><span id="status">화려한 순간의 GPU 시간이 16.6ms 예산을 넘음</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 최고 화질</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>GPU 버짓 측정</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>DRS</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>반응 지연·뿌연 화면</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>예측·TSR</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>품질 오케스트라</button></div><p id="explain" class="explain"></p>
<div class="controls"><div><div class="ct"><label for="battle">전투 강도</label><output id="battleOut">72%</output></div><input id="battle" type="range" min="10" max="100" value="72"></div><div><div class="ct"><label for="floor">해상도 하한</label><output id="floorOut">60%</output></div><input id="floor" type="range" min="45" max="85" value="60"></div><div class="toggles"><button id="tsr" aria-pressed="false">TSR 복원</button><button id="quality" aria-pressed="false">품질 스케일러</button></div></div>
<div class="metrics"><div class="m"><small>GPU 시간 / 예산</small><strong id="mGpu">22.1 / 16.6ms</strong></div><div class="m"><small>내부 해상도</small><strong id="mRes">100%</strong></div><div class="m"><small>1% low</small><strong id="mLow">45 fps</strong></div><div class="m"><small>추가 절감</small><strong id="mCuts">없음</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,battle:.72,floor:.60,tsr:false,quality:false};const names=['고정 네이티브 화질','프레임별 GPU 시간을 예산과 비교','예산 초과만큼 내부 해상도 축소','한 박자 늦고 선명도가 출렁이는 DRS','부하 예측·히스테리시스·TSR 복원','그림자·파티클·반사까지 예산 지휘'];const stats=['화려한 순간의 GPU 시간이 16.6ms 예산을 넘음','평균이 아니라 전투 절정의 1% low를 관찰','필요한 순간 화질을 빌려 프레임 바닥을 방어','완료된 GPU 시간을 보고 뒤늦게 급격히 변경','미리 천천히 내리고 시간 정보로 디테일 복원','눈에 덜 띄는 항목부터 여러 손잡이를 나눠 조절'];const desc=['<b>최악의 순간이 기준:</b> 평소 네이티브 60fps여도 폭발·반투명·적이 겹치면 25ms까지 뜁니다. 전투 강도를 올려 고정 화질의 바닥을 확인하세요.','<b>GPU 예산 계측:</b> 목표 60fps의 16.6ms와 실제 GPU 시간을 매 프레임 비교합니다. 평균보다 붉은 초과 영역과 1% low를 봅니다.','<b>다이내믹 해상도:</b> 예산 초과 비율에 맞춰 내부 픽셀 수를 낮춰 16.6ms 근처로 돌립니다. 하한을 정해 적 식별에 필요한 최소 선명도는 보장합니다.','<b>단순 DRS의 상처:</b> 이미 느려진 프레임을 본 뒤 급히 내리면 첫 히치는 못 막고, 네이티브 확대만으로는 뿌옇고 해상도가 펌핑합니다.','<b>예측·히스테리시스 + TSR:</b> 부하 상승 추세를 먼저 반영하고 여유 밴드 안에서는 해상도를 고정합니다. 여러 프레임의 정보를 누적해 낮춘 픽셀의 디테일을 복원합니다.','<b>여러 손잡이의 순서:</b> 해상도만 바닥까지 몰지 않고 먼 그림자, 화면 밖 파티클, 반사를 차례로 줄입니다. 핵심 캐릭터와 조준선은 끝까지 지킵니다.'];
function calc(){let raw=7+S.battle*21,res=1,gpu=raw,cuts='없음';if(S.step>=2){res=Math.max(S.floor,Math.min(1,Math.sqrt(9.2/Math.max(1,raw-7))));gpu=7+(raw-7)*res*res}if(S.step===3){gpu+=2.8;res=Math.max(S.floor,res-.07)}if(S.step>=4&&S.tsr)gpu+=.8;if(S.step>=5&&S.quality&&gpu>16.6){gpu-=3.4;cuts='먼 그림자·파티클';res=Math.min(1,res+.08)}let low=Math.round(1000/Math.max(gpu,16.6));return{raw,res,gpu,low,cuts}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc();x.fillStyle='#17131b';x.fillRect(0,0,w,h);let block=S.step>=2&&!S.tsr?Math.round(2+(1-V.res)*15):1;for(let yy=0;yy<h*.64;yy+=block)for(let xx=0;xx<w;xx+=block){let glow=Math.max(0,1-Math.hypot(xx-w*.52,yy-h*.36)/(w*.25)),n=(Math.sin(xx*.07)+Math.cos(yy*.09))*10;x.fillStyle=`rgb(${Math.round(31+glow*210+n)},${Math.round(25+glow*82)},${Math.round(31+glow*26)})`;x.fillRect(xx,yy,block,block)}for(let i=0;i<Math.round(18+S.battle*55);i++){let a=i*2.4,r=(i%13)*7+22,px=w*.52+Math.cos(a)*r,py=h*.37+Math.sin(a)*r*.55;x.fillStyle=i%3?'#ffd36f':'#ff7774';x.beginPath();x.arc(px,py,2+(i%4),0,Math.PI*2);x.fill()}x.fillStyle='#f8f7f3';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(S.tsr&&S.step>=4?'TEMPORAL RECONSTRUCTION: HISTORY + MOTION VECTORS':'CURRENT FRAME: DIRECT UPSCALE',w*.04,h*.59);let cy=h*.73,ch=h*.13;x.fillStyle='#292d38';x.fillRect(w*.08,cy,w*.84,ch);x.fillStyle=V.gpu>16.6?'#ff7774':'#83dfa6';x.fillRect(w*.08,cy,w*.84*Math.min(V.gpu/28,1),ch);x.strokeStyle='#f8f7f3';let bx=w*.08+w*.84*16.6/28;x.beginPath();x.moveTo(bx,cy-8);x.lineTo(bx,cy+ch+8);x.stroke();x.fillText('16.6ms BUDGET',bx-40,cy-12);$('mGpu').textContent=V.gpu.toFixed(1)+' / 16.6ms';$('mRes').textContent=Math.round(V.res*100)+'%';$('mLow').textContent=V.low+' fps';$('mCuts').textContent=V.cuts;c.dataset.gpu=V.gpu.toFixed(1);c.dataset.res=Math.round(V.res*100);c.dataset.low=V.low;c.dataset.cuts=V.cuts}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('tsr').setAttribute('aria-pressed',String(S.tsr));$('quality').setAttribute('aria-pressed',String(S.quality));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.tsr=S.step>=4;S.quality=S.step>=5;update()});$('battle').oninput=e=>{S.battle=+e.target.value/100;$('battleOut').textContent=e.target.value+'%';draw()};$('floor').oninput=e=>{S.floor=+e.target.value/100;$('floorOut').textContent=e.target.value+'%';draw()};$('tsr').onclick=()=>{S.tsr=!S.tsr;update()};$('quality').onclick=()=>{S.quality=!S.quality;update()};update();addEventListener('resize',draw)})();
</script></body></html>
