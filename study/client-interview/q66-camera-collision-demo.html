<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q66 3인칭 카메라 충돌 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="고정 거리 카메라의 벽 관통에서 스프링암, 스피어 스윕, 비대칭 보간, 가림 페이드와 좁은 공간 모드까지 발전하는 3인칭 카메라 실험"></canvas><div class="hud"><span>Q66 · <b id="stage">캐릭터 뒤 고정 거리</b></span><span id="status">벽이 있어도 카메라가 뒤로 관통</span></div></div>
<div class="steps" role="group" aria-label="3인칭 카메라 충돌 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 거리</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>스프링암</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>스피어 스윕</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>비대칭 보간</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>가림 페이드</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>좁은 공간 모드</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="gap">캐릭터와 뒤 벽 간격</label><output id="gapOut">1.6 m</output></div><input id="gap" type="range" min="4" max="60" value="16"></div><div><div class="ct"><label for="lag">복귀 부드러움</label><output id="lagOut">12</output></div><input id="lag" type="range" min="2" max="24" value="12"></div><div class="toggles" role="group" aria-label="스피어 스윕과 가림 페이드 설정"><button id="sweep" aria-pressed="false">스피어 스윕</button><button id="fade" aria-pressed="false">가림 페이드</button></div></div>
<div class="metrics"><div class="m"><small>실제 스프링암 길이</small><strong id="mArm">4.0 m</strong></div><div class="m"><small>캐릭터 가시성</small><strong id="mVisible">18%</strong></div><div class="m"><small>near clip 위험</small><strong id="mClip">높음</strong></div><div class="m"><small>벽 해제 뒤 복귀</small><strong id="mReturn">즉시</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,gap:1.6,lag:12,sweep:false,fade:false,t:0,currentArm:4};
const names=['캐릭터 뒤 고정 거리','충돌하면 스프링암 축소','모서리를 스피어로 안정 검출','빠른 수축·느린 복귀','카메라와 캐릭터 사이 가림 처리','좁은 공간용 FOV·거리·높이 모드'],status=['벽이 있어도 카메라가 뒤로 관통','벽 앞까지 당겨 캐릭터를 유지','라인 트레이스의 모서리 튐 제거','벽에 즉시 대응하고 벗어나면 천천히 복원','기둥·아군은 반투명해 캐릭터를 보존','답답한 방에서는 근접 카메라로 자연스럽게 전환'];
const desc=['<b>실패 재현:</b> 카메라를 캐릭터 뒤 4m에 고정합니다. 뒤 벽 간격이 4m보다 작으면 카메라가 벽 바깥으로 나가 화면이 벽 텍스처로 찹니다.','<b>원하는 길이와 가능한 길이 분리:</b> 피벗에서 목표 카메라 위치까지 검사하고 벽에 닿으면 스프링암 길이를 접점 앞까지 줄입니다.','<b>선이 아닌 부피:</b> 스피어 스윕이 모서리와 얇은 기둥을 안정적으로 검출하고 near clip까지 고려해 카메라가 벽에 너무 붙지 않게 합니다.','<b>들어갈 때 빠르고 나올 때 느리게:</b> 벽 접근에는 즉시 수축하고 장애물이 사라진 뒤에는 복귀 속도를 제한합니다. 슬라이더가 느린 복원 정도를 바꿉니다.','<b>카메라를 당겨도 안 보이는 경우:</b> 캐릭터와 카메라 사이 기둥·아군은 시야 페이드로 반투명 처리합니다. 월드는 충돌시키고 시야 문제는 별도 레이어로 풉니다.','<b>공간에 맞는 구도:</b> 매우 좁은 곳에서는 최소 거리, 넓은 FOV와 어깨 높이 오프셋을 적용하고, 벽에서 벗어나면 히스테리시스로 기본 추적 모드로 돌아갑니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const collision=S.step>=1,swept=S.step>=2&&S.sweep,interp=S.step>=3,faded=S.step>=4&&S.fade,tight=S.step>=5&&S.gap<2.0,desired=tight?1.15:4,minClear=swept?.42:.12,target=collision?Math.max(.55,Math.min(desired,S.gap-minClear)):desired;if(!interp)S.currentArm=target;else{const k=target<S.currentArm?.38:1/Math.max(3,S.lag);S.currentArm+=(target-S.currentArm)*k}const penetrates=!collision&&S.gap<desired,visible=faded?94:penetrates?18:S.gap<1.1?48:88,clip=swept?'낮음':S.gap<1.4?'높음':'보통',ret=interp?`${S.lag} 프레임 완화`:'즉시';return{collision,swept,interp,faded,tight,desired,target,arm:S.currentArm,penetrates,visible,clip,ret}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.78,pivot=w*.58,scale=w*.095,wall=pivot-S.gap*scale,cam=pivot-v.arm*scale;x.fillStyle='#102331';x.fillRect(0,0,w,h);line(w*.04,ground,w*.96,ground,'#60768a',3);x.fillStyle='#455b70';x.fillRect(wall-18,h*.18,36,ground-h*.18);label('BACK WALL',Math.max(45,wall),h*.15,'#9aaabf','center');
line(pivot,ground-105,pivot,ground-26,'#70ceff',11);x.fillStyle='#70ceff';x.beginPath();x.arc(pivot,ground-128,17,0,7);x.fill();line(pivot,ground-86,pivot+38,ground-70,'#70ceff',8);line(pivot,ground-28,pivot-28,ground+2,'#70ceff',8);line(pivot,ground-28,pivot+28,ground+2,'#70ceff',8);label('PLAYER PIVOT',pivot,ground-157,'#70ceff','center');
line(pivot,ground-108,cam,ground-78,v.swept?'#8ce3ae':'#ffd06e',3,[7,4]);x.fillStyle=v.penetrates?'#ff7f78':'#ffd06e';x.beginPath();x.arc(cam,ground-78,12,0,7);x.fill();x.fillRect(cam-20,ground-91,15,24);label(`CAM ${v.arm.toFixed(2)}m`,cam,ground-111,v.penetrates?'#ff7f78':'#ffd06e','center');if(v.swept){x.strokeStyle='#8ce3ae';x.lineWidth=2;x.beginPath();x.arc(cam,ground-78,22,0,7);x.stroke();label('SPHERE SWEEP',w*.36,h*.33,'#8ce3ae','center')}else if(v.collision)label('LINE TRACE · CORNER RISK',w*.36,h*.33,'#ff7f78','center');
const occX=pivot-55;x.globalAlpha=v.faded?.22:1;x.fillStyle='#6f5b4a';x.fillRect(occX,ground-190,30,190);x.globalAlpha=1;if(S.step>=4)label(v.faded?'OCCLUDER FADE 22%':'OCCLUDER BLOCKS VIEW',occX+15,ground-205,v.faded?'#8ce3ae':'#ff7f78','center');
const rx=w*.70,ry=h*.18,rw=w*.25,rh=h*.42;x.fillStyle='#0b151e';x.fillRect(rx,ry,rw,rh);x.strokeStyle='#52677b';x.strokeRect(rx,ry,rw,rh);label('CAMERA PREVIEW',rx+rw*.5,ry-12,'#70ceff','center');const fov=v.tight?78:58,sz=v.visible/100;x.fillStyle='#70ceff';x.globalAlpha=.35+.65*sz;x.beginPath();x.arc(rx+rw*.5,ry+rh*.62,28*sz+.1,0,7);x.fill();x.globalAlpha=1;x.fillStyle=v.penetrates?'#455b70':'#24394a';x.fillRect(rx,ry,rw,ry*.0+rh*.18);label(v.penetrates?'WALL TEXTURE FILLS VIEW':v.tight?'TIGHT SPACE MODE':'PLAYER VISIBLE',rx+rw*.5,ry+rh*.20,v.penetrates?'#ff7f78':'#8ce3ae','center');label(`FOV ${fov}° · VIS ${v.visible}%`,rx+rw*.5,ry+rh*.88,'#f5f8fc','center');
if(v.interp){const gy=h*.69,gx=w*.72,gw=w*.21;line(gx,gy,gx+gw,gy,'#52677b',2);x.fillStyle='#8ce3ae';x.fillRect(gx,gy-6,gw*Math.min(1,v.arm/4),12);label('FAST IN ← ARM → SLOW OUT',gx+gw*.5,gy-17,'#8ce3ae','center')}if(v.tight)label('MIN DIST 1.15m · SHOULDER HEIGHT SMOOTH',w*.38,h*.70,'#8ce3ae','center');$('mArm').textContent=v.arm.toFixed(2)+' m';$('mVisible').textContent=v.visible+'%';$('mClip').textContent=v.clip;$('mReturn').textContent=v.ret;c.dataset.arm=v.arm.toFixed(3);c.dataset.penetrates=String(v.penetrates)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('sweep').setAttribute('aria-pressed',String(S.sweep));$('fade').setAttribute('aria-pressed',String(S.fade));const v=vals();$('mArm').textContent=v.arm.toFixed(2)+' m';$('mVisible').textContent=v.visible+'%';$('mClip').textContent=v.clip;$('mReturn').textContent=v.ret;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.sweep=S.step>=2;S.fade=S.step>=4;S.currentArm=4;S.t=0;update()});$('gap').oninput=e=>{S.gap=+e.target.value/10;$('gapOut').textContent=S.gap.toFixed(1)+' m';update()};$('lag').oninput=e=>{S.lag=+e.target.value;$('lagOut').textContent=S.lag;update()};$('sweep').onclick=()=>{S.sweep=!S.sweep;update()};$('fade').onclick=()=>{S.fade=!S.fade;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
