<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q100 수중 믹스 스냅샷 실험실</title><style>
:root{--bg:#071016;--panel:#0f1d27;--line:#304a5a;--ink:#f3f8fb;--muted:#98adba;--cyan:#70d6ed;--gold:#ffd173;--green:#7fe0a5;--red:#ff7d76}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#102532}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#041019df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#06141a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8098a5;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="개별 소리 로우패스가 월드 버스, 개인 버스 분리, 수면 위·수중 믹스 스냅샷 보간과 히스테리시스로 발전하는 실험"></canvas><div class="hud"><span>Q100 · <b id="stage">소리마다 필터 부착</b></span><span id="status">기존·신규 보이스를 모두 추적해야 하고 해제 누락 발생</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>개별 필터</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>월드 버스</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>전부 먹먹한 문제</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>버스 분리</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스냅샷 보간</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>히스테리시스</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="depth">리스너 수면 높이</label><output id="depthOut">−18 cm</output></div><input id="depth" type="range" min="-50" max="50" value="-18"></div><div><div class="ct"><label for="transition">스냅샷 전환 시간</label><output id="transitionOut">420 ms</output></div><input id="transition" type="range" min="50" max="1200" step="10" value="420"></div><div class="toggles"><button id="split" aria-pressed="false">월드·개인 버스 분리</button><button id="hysteresis" aria-pressed="false">±10cm 데드존</button></div></div>
<div class="metrics"><div class="m"><small>월드 LPF 컷오프</small><strong id="mCut">0.8 kHz</strong></div><div class="m"><small>숨·심박 게인</small><strong id="mPersonal">−8 dB</strong></div><div class="m"><small>수중 스냅샷 가중치</small><strong id="mBlend">100%</strong></div><div class="m"><small>경계 재트리거 / 초</small><strong id="mTrigger">12회</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,depth:-18,transition:420,split:false,hyst:false,t:0};const names=['재생 중인 소리마다 로우패스 부착','모든 디에게틱 소리를 월드 서브믹스에서 한 번 처리','UI·숨·심박까지 같은 필터에 잠김','월드와 개인/논디에게틱 버스를 분리','수면 위↔수중 믹스 스냅샷을 시간 보간','진입 −10cm·이탈 +10cm + 원샷 쿨다운'];const stats=['기존·신규 보이스를 모두 추적해야 하고 해제 누락 발생','새 소리도 자동으로 공용 LPF와 감쇠를 통과','정보와 신체 내부 소리까지 먹먹해 몰입·가독성 손실','월드만 닫고 숨·심박·UI는 오히려 앞으로 강조','20kHz→0.8kHz와 버스 게인을 수백 ms에 걸쳐 스윕','파도 경계에서 상태·첨벙 원샷이 발작하지 않음'];const desc=['<b>개별 관리의 함정:</b> 수십 보이스에 필터를 붙이고 새 소리에도 반복하며 나올 때 전부 풀어야 합니다. 하나라도 빠지면 물 밖에서도 먹먹한 소리가 남습니다.','<b>믹스 최상단:</b> 모든 월드 사운드가 지나가는 버스 하나에 LPF·감쇠·수중 리버브를 걸면 보이스를 추적하지 않아도 한 번에 매질이 바뀝니다.','<b>라우팅이 정보 범위를 결정:</b> 마스터 전체를 닫으면 UI·나레이션·숨·심박도 같이 먹먹합니다. 물의 영향을 받을 것과 받지 않을 것을 버스로 나눠야 합니다.','<b>버스 분리:</b> 월드/디에게틱에는 LPF와 감쇠, 개인/논디에게틱에는 선명한 숨·심박 강조를 적용합니다. 분리 버튼으로 내부 소리 게인이 달라지는지 보세요.','<b>스냅샷 보간:</b> 수면 위와 수중의 컷오프·볼륨·리버브 세트를 정의하고 리스너 깊이 가중치와 전환 시간으로 부드럽게 보간합니다.','<b>경계 안정성:</b> −10cm에서 진입, +10cm에서 이탈하는 데드존과 최소 유지·첨벙 쿨다운을 둡니다. 수면 근처에서 버튼을 껐다 켜 재트리거 차이를 확인하세요.'];
S.current=1;
function calc(){let underwater=S.depth<0,blend=S.step>=4?S.current:underwater?1:0,cut=20;if(S.step>=1)cut=20-(19.2*blend);let personal=S.step<3||!S.split?(underwater?-8:0):(underwater?5:0),trigger=S.step>=5&&S.hyst?Math.max(0,Math.round(2-Math.abs(S.depth)/12)):Math.abs(S.depth)<12?12:underwater?1:0;if(S.step<4)blend=underwater?1:0;return{underwater,blend,cut,personal,trigger}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),surface=h*.29,earY=surface-S.depth*3;x.fillStyle='#8fc5d2';x.fillRect(0,0,w,surface);x.fillStyle='#16485d';x.fillRect(0,surface,w,h-surface);x.strokeStyle='#d7fbff';x.lineWidth=3;x.beginPath();for(let px=0;px<=w;px+=8)x.lineTo(px,surface+Math.sin(px*.035+S.t*.03)*4);x.stroke();x.fillStyle='#ffd173';x.beginPath();x.arc(w*.16,earY,12,0,Math.PI*2);x.fill();x.fillStyle='#f3f8fb';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText('LISTENER EAR',w*.12,earY-20);let buses=[{y:h*.48,label:'WORLD / DIEGETIC',color:'#70d6ed'},{y:h*.68,label:'PERSONAL / UI · BREATH · HEART',color:'#ffd173'}];for(let b of buses){x.fillStyle='#071016cc';x.fillRect(w*.29,b.y,w*.58,54);x.fillStyle=b.color;x.fillRect(w*.31,b.y+10,w*.18,34);x.fillStyle='#f3f8fb';x.fillText(b.label,w*.325,b.y+31);x.strokeStyle=b.color;x.beginPath();x.moveTo(w*.49,b.y+27);x.lineTo(w*.82,b.y+27);x.stroke()}if(S.step>=1){x.fillStyle='#70d6ed';x.fillRect(w*.61,h*.48+10,w*.18,34);x.fillStyle='#071016';x.fillText(`LPF ${V.cut.toFixed(1)}kHz`,w*.65,h*.48+31)}if(S.step>=3&&S.split){x.fillStyle='#ffd173';x.fillRect(w*.61,h*.68+10,w*.18,34);x.fillStyle='#071016';x.fillText(`GAIN ${V.personal>0?'+':''}${V.personal}dB`,w*.65,h*.68+31)}if(S.step>=4){x.fillStyle='#071016dd';x.fillRect(w*.04,h*.83,w*.92,50);x.fillStyle='#70d6ed';x.fillRect(w*.05,h*.845,w*.9*V.blend,20);x.fillStyle='#f3f8fb';x.fillText(`AIR  ${Math.round((1-V.blend)*100)}%`,w*.06,h*.88);x.fillText(`UNDERWATER  ${Math.round(V.blend*100)}%`,w*.77,h*.88)}if(S.step>=5&&S.hyst){x.strokeStyle='#7fe0a5';x.setLineDash([6,4]);for(let yy of[surface-30,surface+30]){x.beginPath();x.moveTo(0,yy);x.lineTo(w*.27,yy);x.stroke()}x.setLineDash([]);x.fillText('+10cm EXIT',8,surface-35);x.fillText('−10cm ENTER',8,surface+48)}$('mCut').textContent=V.cut.toFixed(1)+' kHz';$('mPersonal').textContent=(V.personal>0?'+':'')+V.personal+' dB';$('mBlend').textContent=Math.round(V.blend*100)+'%';$('mTrigger').textContent=V.trigger+'회';c.dataset.cutoff=V.cut.toFixed(1);c.dataset.personal=V.personal;c.dataset.blend=Math.round(V.blend*100);c.dataset.trigger=V.trigger;c.dataset.underwater=V.underwater}
const baseDraw=draw;draw=()=>{baseDraw();if(S.step===2){const w=c.clientWidth,h=c.clientHeight;x.fillStyle='#70d6ed';x.fillRect(w*.61,h*.68+10,w*.18,34);x.fillStyle='#071016';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`LPF ${calc().cut.toFixed(1)}kHz`,w*.65,h*.68+31);x.fillStyle='#ff7d76';x.fillText('UI · BREATH ALSO MUFFLED',w*.61,h*.68-7)}};
function advance(){let target=Math.max(0,Math.min(1,(10-S.depth)/20));S.current+=(target-S.current)*Math.min(.35,48/S.transition);requestAnimationFrame(advance)}advance();
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('split').setAttribute('aria-pressed',String(S.split));$('hysteresis').setAttribute('aria-pressed',String(S.hyst));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.split=S.step>=3;S.hyst=S.step>=5;update()});$('depth').oninput=e=>{S.depth=+e.target.value;$('depthOut').textContent=(S.depth<0?'−':'+')+Math.abs(S.depth)+' cm';draw()};$('transition').oninput=e=>{S.transition=+e.target.value;$('transitionOut').textContent=e.target.value+' ms';draw()};$('split').onclick=()=>{S.split=!S.split;update()};$('hysteresis').onclick=()=>{S.hyst=!S.hyst;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw)})();
</script></body></html>
