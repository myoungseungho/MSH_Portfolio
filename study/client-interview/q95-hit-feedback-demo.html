<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q95 피격 화면 피드백 실험실</title><style>
:root{--bg:#0c0d12;--panel:#19191f;--line:#45434b;--ink:#f7f6f4;--muted:#aaa6aa;--red:#ff625f;--gold:#ffd06b;--cyan:#70d5ff}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#18181d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#08080cdf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--red)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#210706}button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--red);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--red)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#918d92;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="피격 강도와 방향, 체력에 따라 일시 비네트, 방향 호, 지속 심박, 카메라 셰이크와 접근성 패턴이 합성되는 실험"></canvas><div class="hud"><span>Q95 · <b id="stage">화면 전체에 빨간 판</b></span><span id="status">스친 피해도 치명타도 같고 중앙의 적까지 가림</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>빨간 오버레이</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>비네트 커브</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>방향 인디케이터</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>위험 심박 레이어</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>임펄스 셰이크</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>접근성 중복 신호</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="damage">피격 방향</label><output id="damageOut">오른쪽 45°</output></div><input id="damage" type="range" min="-180" max="180" value="45"></div><div><div class="ct"><label for="health">남은 체력</label><output id="healthOut">28%</output></div><input id="health" type="range" min="1" max="100" value="28"></div><div class="toggles"><button id="shake" aria-pressed="false">회전 셰이크</button><button id="access" aria-pressed="false">색약 패턴·형태</button></div></div>
<div class="metrics"><div class="m"><small>중앙 가림</small><strong id="mOcclude">34%</strong></div><div class="m"><small>방향 정보</small><strong id="mDir">없음</strong></div><div class="m"><small>회전 셰이크</small><strong id="mShake">0.0°</strong></div><div class="m"><small>지속 경고</small><strong id="mPulse">꺼짐</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,dir:45,health:28,shake:false,access:false,t:0};const names=['화면 전체에 빨간 판','가장자리 비네트를 감쇠 커브로','월드 피해 방향을 화면 가장자리로 투영','일시 피격과 지속 저체력을 별도 합성','짧은 위치·회전 임펄스를 가산','색·형태·밝기·리듬으로 위험을 중복 부호화'];const stats=['스친 피해도 치명타도 같고 중앙의 적까지 가림','피격 순간만 튕기고 중앙 가독성은 보존','오른쪽·뒤·왼쪽 중 어디서 맞았는지 즉시 표시','체력 위험은 심박으로 남고 매 피격 효과는 독립','짧은 덜컹만 남겨 타격감과 멀미를 분리','붉은색을 못 보아도 패턴과 조임으로 같은 정보 전달'];const desc=['<b>정보가 없는 판때기:</b> 화면 전체 빨강은 피해 강도·방향·위험도를 구분하지 못하고 가장 위험한 순간에 적을 가립니다.','<b>시간 커브 포스트:</b> 피격 순간 비네트·채도·색수차를 올렸다 빠르게 감쇠시킵니다. 중앙은 비워 가독성을 지키고 강도는 피해량에 비례시킵니다.','<b>방향을 형태로:</b> 공격자 방향을 카메라 공간에 투영해 해당 가장자리에 붉은 호를 둡니다. 슬라이더를 돌려 호가 화면 둘레를 따라 움직이는지 보세요.','<b>두 시간축:</b> 매 피격은 짧은 임펄스, 낮은 체력은 심박 리듬의 지속 비네트로 따로 합성합니다. 체력을 내려 맥동 강도를 확인하세요.','<b>카메라 임팩트:</b> 위치와 회전 셰이크를 분리하고 짧은 감쇠로 덜컹만 남깁니다. 회전 셰이크를 끄면 멀미를 줄이면서 비네트·히트스톱으로 손맛을 보존합니다.','<b>색은 보조 채널:</b> 색약 모드에서는 방향 호의 패턴, 테두리 밝기와 수축, HUD 리듬을 함께 써 색을 구분하지 못해도 위험과 방향을 읽게 합니다.'];
function calc(){let low=S.health<35,occ=S.step===0?34:S.step>=1?5:34,dir=S.step>=2?`${S.dir>15?'오른쪽':S.dir<-15?'왼쪽':'정면'} ${Math.abs(S.dir)}°`:'없음',shake=S.step>=4&&S.shake?1.8:0,pulse=S.step>=3&&low?'심박 '+Math.round(55+(35-S.health)*2)+' bpm':'꺼짐';return{low,occ,dir,shake,pulse}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),pulse=V.low&&S.step>=3?.55+.25*Math.sin(S.t*.08):.35,rot=V.shake*Math.sin(S.t*.7)*Math.PI/180;x.fillStyle='#23242b';x.fillRect(0,0,w,h);x.save();x.translate(w/2,h/2);x.rotate(rot);x.translate(-w/2,-h/2);x.fillStyle='#3b454c';x.fillRect(w*.12,h*.18,w*.76,h*.68);x.fillStyle='#15171b';x.fillRect(w*.35,h*.26,w*.3,h*.6);x.fillStyle='#d8d5ce';x.beginPath();x.arc(w*.5,h*.46,38,0,Math.PI*2);x.fill();x.fillRect(w*.46,h*.52,w*.08,h*.23);x.restore();if(S.step===0){x.fillStyle='#ff24245c';x.fillRect(0,0,w,h)}else{let g=x.createRadialGradient(w/2,h/2,w*.15,w/2,h/2,w*.68);g.addColorStop(0,'rgba(255,40,35,0)');g.addColorStop(.7,'rgba(255,40,35,.05)');g.addColorStop(1,`rgba(255,40,35,${pulse})`);x.fillStyle=g;x.fillRect(0,0,w,h)}if(S.step>=2){let a=(S.dir-90)*Math.PI/180,cx=w/2+Math.cos(a)*w*.38,cy=h/2+Math.sin(a)*h*.34;x.strokeStyle=S.access&&S.step>=5?'#ffd06b':'#ff625f';x.lineWidth=9;x.setLineDash(S.access&&S.step>=5?[10,6]:[]);x.beginPath();x.arc(cx,cy,32,a+2.1,a+4.2);x.stroke();x.setLineDash([])}if(S.access&&S.step>=5){x.strokeStyle='#f7f6f4';x.lineWidth=3;for(let i=0;i<5;i++)x.strokeRect(10+i*8,10+i*8,w-20-i*16,h-20-i*16)}$('mOcclude').textContent=V.occ+'%';$('mDir').textContent=V.dir;$('mShake').textContent=V.shake.toFixed(1)+'°';$('mPulse').textContent=V.pulse;c.dataset.occlude=V.occ;c.dataset.dir=V.dir;c.dataset.shake=V.shake.toFixed(1);c.dataset.pulse=V.pulse}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('shake').setAttribute('aria-pressed',String(S.shake));$('access').setAttribute('aria-pressed',String(S.access));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.shake=S.step>=4;S.access=S.step>=5;update()});$('damage').oninput=e=>{S.dir=+e.target.value;$('damageOut').textContent=(S.dir>15?'오른쪽 ':S.dir<-15?'왼쪽 ':'정면 ')+Math.abs(S.dir)+'°';draw()};$('health').oninput=e=>{S.health=+e.target.value;$('healthOut').textContent=e.target.value+'%';draw()};$('shake').onclick=()=>{S.shake=!S.shake;update()};$('access').onclick=()=>{S.access=!S.access;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw)})();
</script></body></html>
