<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q43 마을 시뮬레이션 LOD 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179;--sleep:#516876}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="플레이어 거리에 따라 마을 NPC가 휴면, 임포스터 루프, 저빈도 AI, 풀 AI로 전환되고 오디오가 분해되는 과정"></canvas><div class="hud"><span>Q43 · <b id="stage">전 세계 풀 시뮬레이션</b></span><span id="status">보이지 않는 NPC도 매 프레임</span></div></div>
<div class="steps" role="group" aria-label="마을 시뮬레이션 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>모두 풀 AI</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>거리 온·오프</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>경계 팝·정지</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>AI·애님 티어</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스케줄·상태 복원</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>관찰·오디오 존</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">마을까지 거리</label><output id="distanceOut">700 m</output></div><input id="distance" type="range" min="0" max="2500" step="50" value="700"></div><div><div class="ct"><label for="population">마을 NPC 수</label><output id="populationOut">120 명</output></div><input id="population" type="range" min="20" max="500" step="20" value="120"></div><div class="toggles" role="group" aria-label="망원경 관찰 승격과 경량 상태 지속"><button id="observe" aria-pressed="false">망원경으로 관찰</button><button id="persist" aria-pressed="false">경량 상태 지속</button></div></div>
<div class="metrics"><div class="m"><small>AI CPU 비용</small><strong id="mCpu">14.4 ms</strong></div><div class="m"><small>풀 AI 개체</small><strong id="mFull">120</strong></div><div class="m"><small>화면상 활동감</small><strong id="mAlive">살아 있음</strong></div><div class="m"><small>재활성화 상태</small><strong id="mState">리셋</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,distance:700,population:120,observe:false,persist:false,t:0},names=['all villages full simulation','hard activation volume','cold activation pop','AI · animation update tiers','dormant schedule + persistent state','perception priority + audio crossfade'],desc=['<b>문제 재현:</b> 세계의 모든 NPC가 보이지 않아도 매 프레임 판단·경로·본 애니메이션·개별 오디오를 갱신합니다. 인구를 늘려 CPU 비용을 보세요.','<b>첫 절약:</b> 가까운 마을만 켜고 먼 마을은 완전히 잠재우지만, 경계 하나로 모든 것이 동시에 켜지고 꺼집니다.','<b>스위치의 흔적:</b> 경계를 넘는 순간 NPC가 한꺼번에 나타나 멍하니 시작하고 앰비언스도 뚝 연결됩니다. 거리 슬라이더로 경계를 왕복해 보세요.','<b>시뮬레이션도 LOD:</b> 근거리는 풀 AI, 중거리는 저빈도 AI·애님 LOD, 원거리는 임포스터 작업 루프, 비가시는 휴면으로 점진 전환합니다.','<b>잠들어도 세계는 기억:</b> 생사·위치·스케줄 진행도를 작은 레코드로 남겨 다시 켤 때 이미 하던 행동 중인 상태로 복원합니다.','<b>거리보다 인지:</b> 망원경으로 보는 먼 마을은 값싼 루프 티어로 승격하고, 소리는 원거리 앰비언스 한 점에서 근거리 개별 음원으로 크로스페이드합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function tier(){if(S.step===0)return'full';if(S.step<=2)return S.distance<650?'full':'sleep';if(S.distance<300)return'full';if(S.distance<900)return'mid';if(S.distance<1800||S.observe&&S.step>=5)return'loop';return'sleep'}function vals(){let t=tier(),full=t==='full'?S.population:0,cpu=S.step===0?S.population*.12:t==='full'?S.population*.12:t==='mid'?S.population*.025:t==='loop'?S.population*.004:.05,alive=t==='sleep'?'정지':t==='loop'?'루프 활동':t==='mid'?'간헐 활동':'살아 있음',state=S.persist&&S.step>=4?'이어짐':S.step>=2?'리셋':'유지';return{t,full,cpu,alive,state}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.76;x.fillStyle='#142733';x.fillRect(0,0,w,h);x.fillStyle='#243f4e';x.beginPath();x.moveTo(0,ground);for(let i=0;i<=12;i++)x.lineTo(i*w/12,ground-24-Math.sin(i*1.4)*18);x.lineTo(w,h);x.lineTo(0,h);x.fill();for(let i=0;i<7;i++){let px=w*.25+i*w*.08,bh=34+(i%3)*14;x.fillStyle='#4c7182';x.fillRect(px,ground-bh,55,bh);x.beginPath();x.moveTo(px-5,ground-bh);x.lineTo(px+28,ground-bh-20);x.lineTo(px+60,ground-bh);x.fill()}const shown=v.t==='sleep'&&S.step>=1?0:Math.min(28,Math.ceil(S.population/12)),speed=v.t==='full'?1:v.t==='mid' ? .35 : v.t==='loop' ? .18 : 0;for(let i=0;i<shown;i++){let base=w*.27+(i%10)*w*.048,row=Math.floor(i/10),phase=S.t*.035*speed+i*1.7,px=base+Math.sin(phase)*(v.t==='full'?13:v.t==='mid'?6:3),py=ground-4-row*24,co=v.t==='full'?'#72c9ff':v.t==='mid'?'#ffd17f':'#8ce4b4';x.fillStyle=co;x.beginPath();x.arc(px,py-12,4,0,7);x.fill();x.fillRect(px-2,py-8,4,10)}x.fillStyle='#f2f8fc';x.beginPath();x.arc(w*.10,ground-10,8,0,7);x.fill();x.fillStyle='#72c9ff';x.beginPath();x.moveTo(w*.10+9,ground-10);x.lineTo(w*.10+25,ground-17);x.lineTo(w*.10+25,ground-3);x.fill();if(S.step===0){for(let i=0;i<5;i++)tag(`OFFSCREEN VILLAGE ${i+1} · FULL AI`,w*.04+(i%2)*w*.67,h*(.18+i*.11),'#ff8179')}if(S.step>=1){x.strokeStyle='#ff8179';x.setLineDash([6,4]);x.beginPath();x.arc(w*.50,ground,w*.24,Math.PI,0);x.stroke();x.setLineDash([]);tag('ACTIVATION BOUNDARY',w*.43,h*.29,S.step<=2?'#ff8179':'#97aab8')}if(S.step===2){tag(v.t==='sleep'?'ALL NPC / AUDIO OFF':'COLD SPAWN · EVERYONE STARTS NOW',w*.34,h*.56,'#ff8179')}if(S.step>=3){const bands=[['FULL AI + BONE ANIM','#72c9ff'],['LOW-RATE AI + ANIM LOD','#ffd17f'],['IMPOSTER WORK LOOPS','#8ce4b4'],['DORMANT STATE ONLY','#708794']];bands.forEach((b,i)=>{let y=h*(.16+i*.09);x.fillStyle=b[1];x.globalAlpha=v.t===['full','mid','loop','sleep'][i]?1:.25;x.fillRect(w*.72,y-12,w*.20,16);x.globalAlpha=1;tag(b[0],w*.72,y,b[1])})}if(S.step>=4&&S.persist){tag('DEAD · POSITION · SCHEDULE · FACTION PERSIST',w*.28,h*.92,'#8ce4b4');tag(v.t==='sleep'?'SIM OFF · TIME-ONLY SCHEDULE ADVANCE':'RESTORE INTO IN-PROGRESS ACTION',w*.56,h*.92,'#8ce4b4')}if(S.step>=5){x.strokeStyle='#ffd17f';x.globalAlpha=.75;x.lineWidth=3;x.beginPath();x.arc(w*.50,ground,w*.30,Math.PI,0);x.stroke();x.beginPath();x.arc(w*.50,ground,w*.16,Math.PI,0);x.stroke();x.globalAlpha=1;tag('VILLAGE AMBIENCE',w*.24,h*.47,'#ffd17f');tag('INDIVIDUAL SOURCES',w*.56,h*.60,'#72c9ff');if(S.observe){x.strokeStyle='#8ce4b4';x.setLineDash([5,4]);x.beginPath();x.moveTo(w*.11,ground-12);x.lineTo(w*.47,h*.42);x.lineTo(w*.62,h*.48);x.closePath();x.stroke();x.setLineDash([]);tag('OBSERVED → CHEAP VISIBLE LOOP TIER',w*.20,h*.37,'#8ce4b4')}}}
function metrics(){const v=vals();$('mCpu').textContent=v.cpu.toFixed(2)+' ms';$('mFull').textContent=v.full;$('mAlive').textContent=v.alive;$('mState').textContent=v.state}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['보이지 않는 NPC도 매 프레임','한 경계에서 전부 스위치','태어난 티가 나는 마을','인지 거리에 따라 점진 전환','시뮬 오프 ≠ 상태 폐기','보이는 것과 들리는 것에 예산'][S.step];$('explain').innerHTML=desc[S.step];$('observe').setAttribute('aria-pressed',String(S.observe));$('persist').setAttribute('aria-pressed',String(S.persist));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.observe=S.step===5;S.persist=S.step>=4;ui()});$('distance').oninput=e=>{S.distance=+e.target.value;$('distanceOut').textContent=e.target.value+' m';ui()};$('population').oninput=e=>{S.population=+e.target.value;$('populationOut').textContent=e.target.value+' 명';ui()};$('observe').onclick=()=>{S.observe=!S.observe;ui()};$('persist').onclick=()=>{S.persist=!S.persist;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
