<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q62 타깃 어시스트 의도 보존 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="가장 가까운 적에게 순간 회전하는 실패에서 입력 방향 부채꼴, 각도·거리 점수, 히스테리시스, 소프트 회전·모션 워프와 명시적 입력 우선까지 발전하는 타깃 어시스트 실험"></canvas><div class="hud"><span>Q62 · <b id="stage">가장 가까운 적에게 즉시 스냅</b></span><span id="status">뒤쪽 적에게 180° 돌아 조작 의도를 빼앗음</span></div></div>
<div class="steps" role="group" aria-label="타깃 어시스트 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>최근접 스냅</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>입력 부채꼴</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>각도·거리 점수</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>히스테리시스</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>소프트 워프</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>명시 입력 우선</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="cone">후보 부채꼴</label><output id="coneOut">55°</output></div><input id="cone" type="range" min="20" max="100" value="55"></div><div><div class="ct"><label for="strength">어시스트 강도</label><output id="strengthOut">62%</output></div><input id="strength" type="range" min="0" max="100" value="62"></div><div class="toggles" role="group" aria-label="대상 유지와 명시적 입력 설정"><button id="history" aria-pressed="false">직전 대상 유지</button><button id="explicit" aria-pressed="false">명시 입력 우선</button></div></div>
<div class="metrics"><div class="m"><small>선택된 대상</small><strong id="mTarget">뒤의 A</strong></div><div class="m"><small>자동 회전량</small><strong id="mTurn">168°</strong></div><div class="m"><small>모션 워프</small><strong id="mWarp">0.0 m</strong></div><div class="m"><small>플레이어 의도</small><strong id="mIntent">침범</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,cone:55,strength:62,history:false,explicit:false,t:0};
const names=['가장 가까운 적에게 즉시 스냅','입력 방향 부채꼴로 후보 제한','각도 중심 점수로 한 명 선택','직전 대상 유지로 떨림 억제','공격 중 소프트 회전·모션 워프','명시적 방향이 어시스트를 이김'],status=['뒤쪽 적에게 180° 돌아 조작 의도를 빼앗음','시야 밖·뒤쪽 적은 후보에서 제외','가까움보다 “내가 본 방향”을 더 크게 반영','점수가 비슷해도 대상이 매 프레임 바뀌지 않음','한 프레임 스냅 없이 제한된 각속도로 접근','뒤를 입력하면 앞의 대상에게 끌려가지 않음'];
const desc=['<b>실패 재현:</b> 거리만 보고 가장 가까운 적을 즉시 바라보면 뒤에 있던 적에게 180° 돌아섭니다. 시스템이 공격 대상을 대신 결정한 상태입니다.','<b>후보부터 줄이기:</b> 스틱 입력이 있으면 입력 방향, 없으면 캐릭터 정면을 기준으로 부채꼴과 거리 안의 적만 후보가 됩니다. 각도 슬라이더로 경계를 확인하세요.','<b>의도를 점수화:</b> 후보마다 각도 오차와 거리를 가중합하되 각도 가중치를 더 크게 둡니다. 가장 가까운 적보다 플레이어가 바라본 쪽의 적이 선택됩니다.','<b>대상 흔들림 막기:</b> 점수가 비슷한 두 적 사이에서 매 프레임 선택이 바뀌지 않도록 직전 대상 보너스와 교체 임계값을 둡니다. 토글로 잠금 유무를 비교하세요.','<b>붙이되 순간이동시키지 않기:</b> 공격 윈도 동안 최대 회전각을 제한해 부드럽게 향하고, 루트 모션은 짧은 거리만 목표 쪽으로 워프합니다. 강도가 회전과 워프 상한을 함께 바꿉니다.','<b>명령보다 앞서지 않기:</b> 플레이어가 반대 방향을 명확히 입력하면 자동 회전을 금지합니다. PvP에서는 보정을 약하게 두고, 위치 판정이 중요한 백스탭은 어시스트보다 우선합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
const enemies=[{n:'앞의 B',a:-18,d:.62},{n:'앞의 C',a:28,d:.72},{n:'옆의 D',a:67,d:.50},{n:'뒤의 A',a:168,d:.30},{n:'먼 E',a:-44,d:.91}];
function vals(){const filtered=S.step>=1,scored=S.step>=2,history=S.step>=3&&S.history,soft=S.step>=4,explicit=S.step>=5&&S.explicit,inputAngle=explicit?150:-8,candidates=enemies.map((e,i)=>({...e,i,err:Math.abs((((e.a-inputAngle)+540)%360)-180)})).filter(e=>!filtered||e.err<=S.cone);let target;if(!scored)target=(filtered?candidates:enemies).slice().sort((a,b)=>a.d-b.d)[0];else target=candidates.map(e=>({...e,score:(1-e.err/180)*.78+(1-e.d)*.22+(history&&e.n==='앞의 C'?.18:0)})).sort((a,b)=>b.score-a.score)[0];if(!target)target={n:'없음',a:inputAngle,d:1,err:0};let diff=Math.abs((((target.a-inputAngle)+540)%360)-180),turn=explicit?0:soft?Math.min(diff,90*S.strength/100):diff,warp=soft?Math.min(.8,target.d*.55)*S.strength/100:0;return{filtered,scored,history,soft,explicit,inputAngle,candidates,target,diff,turn,warp,intent:explicit?'보존':S.step>=1?'보조':'침범'}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),cx=w*.35,cy=h*.51,R=Math.min(w*.29,h*.38);x.fillStyle='#102331';x.fillRect(0,0,w,h);for(let r=.25;r<=1;r+=.25){x.strokeStyle='#2b4255';x.lineWidth=1;x.beginPath();x.arc(cx,cy,R*r,0,7);x.stroke()}line(cx-R,cy,cx+R,cy,'#2b4255',1);line(cx,cy-R,cx,cy+R,'#2b4255',1);
const ia=v.inputAngle*Math.PI/180;if(v.filtered){x.fillStyle='#70ceff16';x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,R,ia-S.cone*Math.PI/180,ia+S.cone*Math.PI/180);x.closePath();x.fill();line(cx,cy,cx+Math.cos(ia-S.cone*Math.PI/180)*R,cy+Math.sin(ia-S.cone*Math.PI/180)*R,'#70ceff',1,[5,4]);line(cx,cy,cx+Math.cos(ia+S.cone*Math.PI/180)*R,cy+Math.sin(ia+S.cone*Math.PI/180)*R,'#70ceff',1,[5,4])}
line(cx,cy,cx+Math.cos(ia)*R*.88,cy+Math.sin(ia)*R*.88,'#70ceff',6);label(v.explicit?'EXPLICIT INPUT':'STICK / FACING',cx+Math.cos(ia)*R*.92,cy+Math.sin(ia)*R*.92,'#70ceff','center');
enemies.forEach(e=>{const a=e.a*Math.PI/180,px=cx+Math.cos(a)*R*e.d,py=cy+Math.sin(a)*R*e.d,inCone=!v.filtered||Math.abs((((e.a-v.inputAngle)+540)%360)-180)<=S.cone,chosen=e.n===v.target.n;x.fillStyle=chosen?'#ffd06e':inCone?'#8ce3ae':'#485d70';x.beginPath();x.arc(px,py,chosen?13:9,0,7);x.fill();label(e.n,px,py-16,chosen?'#ffd06e':inCone?'#8ce3ae':'#788ba1','center');if(v.scored&&inCone)label(`${(1-Math.abs((((e.a-v.inputAngle)+540)%360)-180)/180).toFixed(2)}θ`,px,py+27,'#9aaabf','center')});
x.fillStyle='#f5f8fc';x.beginPath();x.arc(cx,cy,14,0,7);x.fill();const ta=v.target.a*Math.PI/180,tx=cx+Math.cos(ta)*R*v.target.d,ty=cy+Math.sin(ta)*R*v.target.d;line(cx,cy,tx,ty,v.soft?'#ffd06e':'#ff7f78',v.soft?3:6,v.soft?[6,4]:[]);if(v.soft){const p=(Math.sin(S.t*.045)+1)/2,wx=cx+(tx-cx)*p*v.warp,wy=cy+(ty-cy)*p*v.warp;x.fillStyle='#8ce3ae';x.beginPath();x.arc(wx,wy,7,0,7);x.fill();label(`SOFT TURN ≤ ${v.turn.toFixed(0)}° · WARP ${v.warp.toFixed(2)}m`,cx,cy+R+28,'#8ce3ae','center')}
const rx=w*.69,ry=h*.17;label(v.scored?'CANDIDATE SCORE':'TARGET RULE',rx,ry-12,'#70ceff');const rows=v.scored?v.candidates.map(e=>[e.n,`ANGLE ${e.err.toFixed(0)}° · DIST ${e.d.toFixed(2)}`]):[['RULE',v.filtered?'CONE + NEAREST':'GLOBAL NEAREST'],['RESULT',v.target.n]];rows.slice(0,5).forEach((r,i)=>{label(r[0],rx,ry+i*h*.10,r[0]===v.target.n?'#ffd06e':'#9aaabf');label(r[1],rx+w*.12,ry+i*h*.10,'#f5f8fc')});if(S.step>=3)label(v.history?'HYSTERESIS +0.18 · TARGET STABLE':'NO HISTORY · MAY FLICKER',w*.80,h*.72,v.history?'#8ce3ae':'#ff7f78','center');if(S.step>=5)label(v.explicit?'ASSIST YIELDS TO INPUT / BACKSTAB SAFE':'ASSIST MAY OVERRIDE INTENT',w*.80,h*.82,v.explicit?'#8ce3ae':'#ff7f78','center');c.dataset.target=v.target.n;c.dataset.intent=v.intent}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('history').setAttribute('aria-pressed',String(S.history));$('explicit').setAttribute('aria-pressed',String(S.explicit));const v=vals();$('mTarget').textContent=v.target.n;$('mTurn').textContent=v.turn.toFixed(0)+'°';$('mWarp').textContent=v.warp.toFixed(2)+' m';$('mIntent').textContent=v.intent;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.history=S.step>=3;S.explicit=S.step>=5;S.t=0;update()});$('cone').oninput=e=>{S.cone=+e.target.value;$('coneOut').textContent=S.cone+'°';update()};$('strength').oninput=e=>{S.strength=+e.target.value;$('strengthOut').textContent=S.strength+'%';update()};$('history').onclick=()=>{S.history=!S.history;update()};$('explicit').onclick=()=>{S.explicit=!S.explicit;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
