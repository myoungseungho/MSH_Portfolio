<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q92 컬러 그레이딩 실험실</title><style>
:root{--bg:#0b0c12;--panel:#171821;--line:#424351;--ink:#f7f6f4;--muted:#aaa8b0;--orange:#ffad72;--cyan:#6ed5df;--gold:#ffd36d;--red:#ff7d78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#151621}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07080ddf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--orange)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#1b0c06}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--orange);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--orange)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#92909a;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="HDR 선형 장면이 톤매핑, Log 인코딩, 3D LUT, 지역 볼륨 블렌드와 디더링을 거쳐 영화 색감으로 변하는 실험"></canvas><div class="hud"><span>Q92 · <b id="stage">대비·채도 슬라이더</b></span><span id="status">전 색 구간을 똑같이 움직여 원하는 필름 색 분리가 불가능</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>단순 슬라이더</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>3D LUT</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>잘못된 순서</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>Log·톤매핑</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>볼륨 블렌드</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>정밀도·디더</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="exposure">씬 노출</label><output id="exposureOut">+0.0 EV</output></div><input id="exposure" type="range" min="-20" max="20" value="0"></div><div><div class="ct"><label for="blend">사막 ↔ 설산 LUT</label><output id="blendOut">50%</output></div><input id="blend" type="range" min="0" max="100" value="50"></div><div class="toggles"><button id="log" aria-pressed="false">Log 공간</button><button id="dither" aria-pressed="false">출력 디더</button></div></div>
<div class="metrics"><div class="m"><small>그레이딩 공간</small><strong id="mSpace">LDR RGB</strong></div><div class="m"><small>LUT 큐브</small><strong id="mLut">없음</strong></div><div class="m"><small>하이라이트 클립</small><strong id="mClip">18%</strong></div><div class="m"><small>밴딩 단계</small><strong id="mBands">42</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,ev:0,blend:.5,log:false,dither:false};const names=['대비·채도 슬라이더','입력 RGB→출력 RGB를 3D LUT로 조회','LDR LUT를 HDR 선형값에 바로 적용','씬 리퍼드 Log에서 그레이딩 후 출력 매핑','지역·시간대 LUT를 가중 블렌드','33³ 고정밀 LUT + 최종 블루노이즈 디더'];const stats=['전 색 구간을 똑같이 움직여 원하는 필름 색 분리가 불가능','아티스트의 복잡한 비선형 색 변환을 한 번에 재현','밝은 값이 0~1 밖으로 나가 클립·탈색','하이라이트 전 구간을 보존하며 필름 롤오프','경계와 시간 변화에서 세계의 색 온도가 연속 이동','부드러운 하늘의 큐브 격자 밴딩을 미세 노이즈로 분산'];const desc=['<b>전역 슬라이더의 한계:</b> 채도·대비 배율만으로는 그림자는 청록, 피부와 불은 주황, 하이라이트는 시안처럼 색 구간별 비선형 변환을 만들 수 없습니다.','<b>3D LUT:</b> 전문 툴에서 만든 입력 RGB→출력 RGB 변환을 33³ 큐브에 굽고 런타임에는 삼선형 보간 한 번으로 조회합니다.','<b>순서와 색공간:</b> 0~1 LDR을 가정한 LUT에 HDR 값을 바로 넣으면 밝은 불빛이 클립되고 채도가 빠집니다. 노출을 올려 손실을 확인하세요.','<b>Log 그레이딩:</b> HDR 선형 밝기를 Log로 압축해 전 구간을 담고 그레이딩한 뒤 SDR/HDR 디스플레이 매핑을 분리합니다. Log 버튼으로 클립률 차이를 보세요.','<b>포스트 볼륨:</b> 지역·시간대의 두 LUT를 가중 보간합니다. 사막↔설산 슬라이더를 움직이면 그림자와 하이라이트의 색 온도가 끊김 없이 이동합니다.','<b>정밀도와 디더:</b> 16³ 큐브의 계단을 33³ 고정밀 LUT로 줄이고, 최종 8비트 출력 직전 약한 노이즈로 남은 밴딩을 눈에 덜 띄게 분산합니다.'];
function calc(){let clip=S.step===2?18+Math.max(0,S.ev)*14:S.log&&S.step>=3?1:6,bands=S.step<1?6:S.step<5?S.log?33:10:S.dither?256:37;return{clip:Math.min(96,clip),bands,space:S.log&&S.step>=3?'ACEScc Log':'LDR RGB',lut:S.step<1?'없음':S.step<5?'16³':'33³'}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),warm=1-S.blend,cool=S.blend,steps=Math.max(3,V.bands);for(let yy=0;yy<h;yy+=3){let t=yy/h,v=Math.round(t*steps)/steps,roll=S.log&&S.step>=3?Math.pow(v,.72):v;let r=20+roll*(190+warm*45),g=25+roll*(135+warm*25),b=38+roll*(150+cool*70);x.fillStyle=`rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`;x.fillRect(0,yy,w,4)}x.fillStyle='#10131a99';x.fillRect(w*.07,h*.18,w*.86,h*.53);for(let i=0;i<9;i++){let px=w*(.13+i*.092),lum=i/8*Math.pow(2,S.ev),rr=Math.min(255,35+lum*(S.step>=1?220+warm*45:200)),gg=Math.min(255,30+lum*(155+warm*20)),bb=Math.min(255,34+lum*(130+cool*80));x.fillStyle=`rgb(${rr},${gg},${bb})`;x.fillRect(px,h*.27,w*.065,h*.31);x.fillStyle='#f7f6f4';x.font='9px ui-monospace,Consolas,monospace';x.fillText((i/8*8).toFixed(0)+' stop',px,h*.62)}if(S.dither&&S.step>=5){x.globalAlpha=.18;for(let i=0;i<500;i++){x.fillStyle=i%2?'#fff':'#000';x.fillRect((i*83)%w,(i*47)%Math.round(h*.17),1,1)}x.globalAlpha=1}$('mSpace').textContent=V.space;$('mLut').textContent=V.lut;$('mClip').textContent=Math.round(V.clip)+'%';$('mBands').textContent=V.bands;c.dataset.space=V.space;c.dataset.lut=V.lut;c.dataset.clip=Math.round(V.clip);c.dataset.bands=V.bands;c.dataset.blend=Math.round(S.blend*100)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('log').setAttribute('aria-pressed',String(S.log));$('dither').setAttribute('aria-pressed',String(S.dither));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.log=S.step>=3;S.dither=S.step>=5;update()});$('exposure').oninput=e=>{S.ev=+e.target.value/10;$('exposureOut').textContent=(S.ev>=0?'+':'')+S.ev.toFixed(1)+' EV';draw()};$('blend').oninput=e=>{S.blend=+e.target.value/100;$('blendOut').textContent=e.target.value+'%';draw()};$('log').onclick=()=>{S.log=!S.log;update()};$('dither').onclick=()=>{S.dither=!S.dither;update()};update();addEventListener('resize',draw)})();
</script></body></html>
