<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q67 다이내믹 전투 프레이밍 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="고정 전투 카메라에서 타겟 그룹, 바운딩 프레이밍, 스프링 안정화와 플레이어 입력 권한 양보까지 발전하는 실험"></canvas><div class="hud"><span>Q67 · <b id="stage">플레이어만 고정 추적</b></span><span id="status">옆과 뒤의 적은 화면 밖</span></div></div>
<div class="steps" role="group" aria-label="다이내믹 전투 프레이밍 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 추적</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>적 수 거리</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>타겟 그룹</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>프러스텀 역산</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스프링 안정화</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>권한·인디케이터</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="count">주변 적 수</label><output id="countOut">6명</output></div><input id="count" type="range" min="1" max="10" value="6"></div><div><div class="ct"><label for="spread">적 분산 반경</label><output id="spreadOut">7.0 m</output></div><input id="spread" type="range" min="20" max="100" value="70"></div><div class="toggles"><button id="manual" aria-pressed="false">수동 카메라 입력</button><button id="indicator" aria-pressed="false">화면 밖 위협 표시</button></div></div>
<div class="metrics"><div class="m"><small>주시점 편향</small><strong id="mLook">0.0 m</strong></div><div class="m"><small>카메라 거리 / FOV</small><strong id="mFrame">5.0m / 55°</strong></div><div class="m"><small>화면 안 타겟</small><strong id="mInside">2 / 7</strong></div><div class="m"><small>자동 회전 권한</small><strong id="mAuthority">100%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,count:6,spread:7,manual:false,indicator:false,t:0,look:0,dist:5,fov:55};
const names=['플레이어만 고정 추적','적 수만큼 거리 증가','가중 타겟 그룹','바운딩을 프러스텀에 맞춤','데드존과 스프링으로 안정화','수동 입력에 권한 양보'],status=['옆과 뒤의 적은 화면 밖','분산 방향은 모르고 무조건 후퇴','플레이어와 위협의 무게중심을 주시','FOV 상한 뒤 부족분만 거리로 해결','멤버 변화에도 구도가 덜컥이지 않음','못 담는 위협은 UI로, 회전은 유저에게'];
const desc=['<b>실패 재현:</b> 플레이어 등 뒤 5m만 유지하면 적이 늘어도 구도는 같습니다. 적 수와 분산 반경을 바꿔 화면 밖 타겟을 확인합니다.','<b>거리 하나의 한계:</b> 적 수만큼 뒤로 빠져도 어느 방향에 퍼졌는지는 모릅니다. 멀리 떨어진 적 하나가 캐릭터를 콩알처럼 만듭니다.','<b>무엇을 담을지 정의:</b> 플레이어 가중치를 가장 크게 두고 적은 거리·위협도로 감가해 가중 무게중심과 바운딩 반경을 계산합니다.','<b>두 손잡이로 역산:</b> 먼저 FOV를 72°까지만 넓히고 부족한 반경은 거리로 해결합니다. 그래도 못 담는 대상은 프레이밍에서 포기합니다.','<b>입퇴장을 부드럽게:</b> 작은 중심 변화는 데드존으로 무시하고 look-at·거리·FOV를 크리티컬 댐프 스프링으로 수렴시킵니다.','<b>카메라 권한 배분:</b> 수동 입력 중에는 자동 yaw를 빠르게 양보하고 거리·FOV만 보조합니다. 못 담는 적은 가장자리 방향 표시로 넘깁니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function calc(){const grouped=S.step>=2,framed=S.step>=3,smooth=S.step>=4,authority=S.step>=5?(S.manual?12:100):100,radius=2.2+S.spread*.53,rawLook=grouped?Math.sin(S.t*.012)*Math.min(2.2,S.spread*.22):0,rawFov=framed?Math.min(72,55+radius*1.7):55,rawDist=S.step===1?5+S.count*.42:framed?Math.max(5,radius/Math.tan(rawFov*Math.PI/360)):5;if(smooth){const dead=Math.abs(rawLook-S.look)<.22;S.look+=(dead?0:rawLook-S.look)*.08;S.dist+=(rawDist-S.dist)*.07;S.fov+=(rawFov-S.fov)*.07}else{S.look=rawLook;S.dist=rawDist;S.fov=rawFov}const baseCap=Math.max(2,Math.floor(6-S.spread/20)),fitCap=Math.max(1,Math.floor((S.dist+S.fov/18)/(1+S.spread/20)))+2,softCap=S.step>=5?6:99,inside=Math.min(S.count+1,framed?fitCap:baseCap,softCap),outside=S.count+1-inside;return{grouped,framed,smooth,authority,radius,inside,outside}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=calc(),cy=h*.50,left=w*.05,mapW=w*.54,previewX=w*.65,previewW=w*.30;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.strokeStyle='#52677b';x.strokeRect(left,h*.16,mapW,h*.61);label('TACTICAL SPACE',left+mapW*.5,h*.13,'#70ceff');const px=left+mapW*.50,py=cy;x.fillStyle='#70ceff';x.beginPath();x.arc(px,py,15,0,7);x.fill();label('PLAYER ×3 WEIGHT',px,py-25,'#70ceff');let pts=[];for(let i=0;i<S.count;i++){const a=i/S.count*Math.PI*2+.35,r=S.spread*(7+((i*17)%5));const ex=px+Math.cos(a)*r,ey=py+Math.sin(a)*r*.55;pts.push([ex,ey]);x.fillStyle='#ff7f78';x.beginPath();x.arc(ex,ey,8,0,7);x.fill();if(v.grouped)line(px,py,ex,ey,'rgba(255,127,120,.32)',1,[3,4])}if(v.grouped){x.strokeStyle='#8ce3ae';x.lineWidth=2;x.beginPath();x.arc(px+S.look*18,py,v.radius*12,0,7);x.stroke();x.fillStyle='#8ce3ae';x.beginPath();x.arc(px+S.look*18,py,5,0,7);x.fill();label('WEIGHTED CENTER',px+S.look*18,py+v.radius*12+22,'#8ce3ae')}else label(S.step===1?'COUNT ONLY → DISTANCE':'FIXED LOOK-AT',px,py+52,S.step===1?'#ffd06e':'#ff7f78');
x.fillStyle='#0b151e';x.fillRect(previewX,h*.16,previewW,h*.61);x.strokeStyle='#52677b';x.strokeRect(previewX,h*.16,previewW,h*.61);label('CAMERA FRAME',previewX+previewW*.5,h*.13,'#70ceff');const margin=25,shown=Math.min(S.count,v.inside-1);x.fillStyle='#70ceff';x.beginPath();x.arc(previewX+previewW*.5+S.look*5,cy,18,0,7);x.fill();for(let j=0;j<shown;j++){const a=j/Math.max(1,shown)*Math.PI*2;x.fillStyle='#ff7f78';x.beginPath();x.arc(previewX+previewW*.5+Math.cos(a)*(previewW*.34),cy+Math.sin(a)*h*.18,7,0,7);x.fill()}if(v.outside>0){label(`${v.outside} OFF-SCREEN`,previewX+previewW*.5,h*.23,'#ff7f78');if(S.step>=5&&S.indicator){x.fillStyle='#ffd06e';x.beginPath();x.moveTo(previewX+previewW-margin,cy);x.lineTo(previewX+previewW-margin-14,cy-9);x.lineTo(previewX+previewW-margin-14,cy+9);x.fill();label('THREAT',previewX+previewW-margin-18,cy-15,'#ffd06e','right')}}if(v.framed)label(`BOUND r=${v.radius.toFixed(1)}m → ${S.dist.toFixed(1)}m / ${S.fov.toFixed(0)}°`,previewX+previewW*.5,h*.72,'#8ce3ae');if(S.step>=5)label(S.manual?'MANUAL YAW · AUTO YIELDS':'AUTO FRAMING ACTIVE',previewX+previewW*.5,h*.82,S.manual?'#ffd06e':'#8ce3ae');
$('mLook').textContent=S.look.toFixed(1)+' m';$('mFrame').textContent=S.dist.toFixed(1)+'m / '+S.fov.toFixed(0)+'°';$('mInside').textContent=v.inside+' / '+(S.count+1);$('mAuthority').textContent=v.authority+'%';c.dataset.look=S.look.toFixed(3);c.dataset.dist=S.dist.toFixed(3)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('manual').setAttribute('aria-pressed',String(S.manual));$('indicator').setAttribute('aria-pressed',String(S.indicator));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.manual=false;S.indicator=S.step>=5;S.look=0;S.dist=5;S.fov=55;update()});$('count').oninput=e=>{S.count=+e.target.value;$('countOut').textContent=S.count+'명';update()};$('spread').oninput=e=>{S.spread=+e.target.value/10;$('spreadOut').textContent=S.spread.toFixed(1)+' m';update()};$('manual').onclick=()=>{S.manual=!S.manual;update()};$('indicator').onclick=()=>{S.indicator=!S.indicator;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
