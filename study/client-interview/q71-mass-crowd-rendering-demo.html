<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q71 대군중 렌더링 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="개별 스켈레탈 액터에서 GPU 인스턴싱, VAT, 변주, 거리 LOD와 임포스터 디더 전환까지 발전하는 대군중 렌더링 실험"></canvas><div class="hud"><span>Q71 · <b id="stage">병사마다 액터·스켈레톤·AI</b></span><span id="status">드로우콜·본·틱·픽셀 비용이 동시에 폭발</span></div></div>
<div class="steps" role="group" aria-label="대군중 렌더링 최적화 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>개별 액터</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>GPU 인스턴싱</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>VAT 애니메이션</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>인스턴스 변주</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>거리 LOD</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>컬링·디더 전환</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="count">군중 규모</label><output id="countOut">6,000명</output></div><input id="count" type="range" min="500" max="10000" step="500" value="6000"></div><div><div class="ct"><label for="distance">카메라와 군중 거리</label><output id="distanceOut">45 m</output></div><input id="distance" type="range" min="5" max="120" value="45"></div><div class="toggles"><button id="variation" aria-pressed="false">시간·색 변주</button><button id="dither" aria-pressed="false">LOD 디더 전환</button></div></div>
<div class="metrics"><div class="m"><small>드로우콜</small><strong id="mDraw">6,000</strong></div><div class="m"><small>CPU 본 계산 / frame</small><strong id="mBones">360k</strong></div><div class="m"><small>AI·틱 갱신</small><strong id="mTicks">6,000</strong></div><div class="m"><small>예상 GPU 프레임</small><strong id="mFrame">96 ms</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,count:6000,distance:45,variation:false,dither:false,t:0};
const names=['병사마다 액터·스켈레톤·AI','같은 메시를 한 번에 제출','정점 포즈를 텍스처에서 샘플','싼 인스턴스 데이터로 복제감 제거','근접·VAT·임포스터로 비용 계층화','안 보이는 개체 제거·전환을 시간으로 분산'],status=['드로우콜·본·틱·픽셀 비용이 동시에 폭발','GPU 제출 비용을 메시 종류 수로 축소','런타임 CPU 스키닝을 0으로 전환','시간·속도·색·위치 지터로 동기화 해체','멀수록 메시·애님·틱을 싸게 교체','프러스텀·거리 컬링과 디더로 팝인 억제'];
const desc=['<b>실패 재현:</b> 병사마다 스켈레탈 메시·60본·AI 틱을 그대로 둡니다. 군중 수를 올리면 네 비용 축이 동시에 증가합니다.','<b>드로우콜부터 묶기:</b> 같은 메시를 인스턴스 버퍼 하나로 제출해 수천 번의 draw를 병종 수 수준으로 낮춥니다. 본 계산과 AI는 아직 남습니다.','<b>본 계산을 GPU 룩업으로:</b> 구운 정점 포즈를 VAT에서 샘플하고 인스턴스별 재생 시간만 넘겨 CPU 스키닝을 제거합니다.','<b>같은 것을 다르게 보이게:</b> 시간 오프셋·재생 속도·색·스케일 지터를 인스턴스 데이터로 흩뿌려 로봇처럼 동시에 움직이는 느낌을 깹니다.','<b>거리별 표현 예산:</b> 가까운 소수는 스켈레탈, 중간은 VAT 저폴리, 먼 다수는 임포스터로 바꾸고 AI 갱신률도 낮춥니다.','<b>그리지 않는 것이 가장 싸다:</b> 화면 밖·가려진 개체를 제거하고 임포스터↔메시를 디더 크로스페이드와 히스테리시스로 섞습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const inst=S.step>=1,vat=S.step>=2,varied=S.step>=3&&S.variation,lod=S.step>=4,culled=S.step>=5,visible=culled?Math.round(S.count*Math.max(.16,Math.min(.72,85/(S.distance+80)))):S.count,draw=inst?(lod?3:2):visible,bones=vat?0:lod?Math.round(visible*.08*60):visible*60,ticks=lod?Math.round(visible*(S.distance>70?.08:.22)):visible,frame=Math.max(4,Math.round(draw*.009+bones*.00012+ticks*.002+(lod?visible*.001:visible*.003)));return{inst,vat,varied,lod,culled,visible,draw,bones,ticks,frame}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),fieldX=w*.05,fieldY=h*.17,fieldW=w*.60,fieldH=h*.65,panelX=w*.71;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#142b35';x.fillRect(fieldX,fieldY,fieldW,fieldH);x.strokeStyle='#52677b';x.strokeRect(fieldX,fieldY,fieldW,fieldH);label('BATTLEFIELD SAMPLE · 96 REPRESENTATIVES',fieldX+fieldW*.5,fieldY-13,'#70ceff');const cols=16,rows=6;for(let i=0;i<cols*rows;i++){const col=i%cols,row=Math.floor(i/cols),depth=row/(rows-1),px=fieldX+24+col*(fieldW-48)/(cols-1),py=fieldY+30+row*(fieldH-55)/(rows-1),near=S.distance<24&&row>3,lodType=v.lod?(near?'SKEL':row>2?'VAT':'IMP'):'FULL',phase=v.varied?(S.t*.05+i*.73)%6.28:S.t*.05,size=5+depth*7,dy=Math.sin(phase)*3;if(v.culled&&((i*17)%7<2||px<fieldX+fieldW*.12))continue;if(lodType==='IMP'){x.fillStyle='#7890a2';x.fillRect(px-size*.55,py-size+dy,size*1.1,size*1.7)}else{x.fillStyle=v.varied?`hsl(${190+(i*29)%65} 70% ${58+(i%3)*5}%)`:'#70ceff';x.beginPath();x.arc(px,py-size+dy,size*.42,0,7);x.fill();x.fillRect(px-size*.25,py-size*.55+dy,size*.5,size*1.2)}if(v.dither&&v.lod&&row===3){x.globalAlpha=.35+((i%4)/6);x.fillStyle='#ffd06e';x.fillRect(px-size*.7,py-size+dy,size*1.4,size*1.8);x.globalAlpha=1}}if(v.varied)label('ASYNC PHASE · TINT · SCALE',fieldX+fieldW*.5,fieldY+fieldH-10,'#8ce3ae');else if(v.vat)label('ALL INSTANCES SAMPLE SAME VAT PHASE',fieldX+fieldW*.5,fieldY+fieldH-10,'#ff7f78');if(v.culled){x.strokeStyle='#ffd06e';x.setLineDash([6,5]);x.strokeRect(fieldX+fieldW*.12,fieldY+12,fieldW*.78,fieldH-24);x.setLineDash([]);label('VISIBLE SET ONLY',fieldX+fieldW*.52,fieldY+26,'#ffd06e')}
const bars=[['DRAW',Math.min(1,v.draw/6000),v.draw.toLocaleString()],['BONES',Math.min(1,v.bones/360000),v.bones>=1000?Math.round(v.bones/1000)+'k':String(v.bones)],['TICKS',Math.min(1,v.ticks/6000),v.ticks.toLocaleString()],['FRAME',Math.min(1,v.frame/100),v.frame+'ms']];label('COST AXES',panelX+w*.11,h*.16,'#70ceff');bars.forEach((b,i)=>{const y=h*(.25+i*.14),bw=w*.20;x.fillStyle='#203748';x.fillRect(panelX,y,bw,13);x.fillStyle=b[1]>.65?'#ff7f78':b[1]>.25?'#ffd06e':'#8ce3ae';x.fillRect(panelX,y,bw*b[1],13);label(`${b[0]} ${b[2]}`,panelX,y-8,x.fillStyle,'left')});if(v.lod)label(S.distance<24?'NEAR: SKEL + VAT':'MID/FAR: VAT + IMPOSTER',panelX+w*.1,h*.82,'#8ce3ae')
$('mDraw').textContent=v.draw.toLocaleString();$('mBones').textContent=v.bones>=1000?Math.round(v.bones/1000)+'k':String(v.bones);$('mTicks').textContent=v.ticks.toLocaleString();$('mFrame').textContent=v.frame+' ms';c.dataset.draw=v.draw;c.dataset.frame=v.frame}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('variation').setAttribute('aria-pressed',String(S.variation));$('dither').setAttribute('aria-pressed',String(S.dither));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.variation=S.step>=3;S.dither=S.step>=5;S.t=0;update()});$('count').oninput=e=>{S.count=+e.target.value;$('countOut').textContent=S.count.toLocaleString()+'명';update()};$('distance').oninput=e=>{S.distance=+e.target.value;$('distanceOut').textContent=S.distance+' m';update()};$('variation').onclick=()=>{S.variation=!S.variation;update()};$('dither').onclick=()=>{S.dither=!S.dither;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
