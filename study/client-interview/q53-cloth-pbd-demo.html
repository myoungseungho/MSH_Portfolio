<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q53 PBD 천 시뮬레이션 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="늘어나는 매스 스프링 망토를 PBD 거리 제약, 몸 캡슐 충돌, 바람과 앵커 관성, 고정 틱과 LOD로 개선하는 과정"></canvas><div class="hud"><span>Q53 · <b id="stage">매스-스프링 망토</b></span><span id="status">강하면 폭주하고 약하면 고무처럼 늘어남</span></div></div>
<div class="steps" role="group" aria-label="천 시뮬레이션 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>매스-스프링</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>PBD 제약</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>몸 충돌</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>바람 필드</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>앵커 관성</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>고정 틱·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="wind">바람 세기</label><output id="windOut">58%</output></div><input id="wind" type="range" min="0" max="100" value="58"></div><div><div class="ct"><label for="iterations">제약 반복</label><output id="iterationsOut">7회</output></div><input id="iterations" type="range" min="1" max="12" value="7"></div><div class="toggles" role="group" aria-label="충돌과 고정 틱 LOD 설정"><button id="collision" aria-pressed="false">몸·벽 충돌</button><button id="fixed" aria-pressed="false">고정 틱+LOD</button></div></div>
<div class="metrics"><div class="m"><small>최대 신장률</small><strong id="mStretch">46%</strong></div><div class="m"><small>몸 관통 파티클</small><strong id="mPen">18</strong></div><div class="m"><small>활성 파티클</small><strong id="mParticles">80</strong></div><div class="m"><small>프레임 안정성</small><strong id="mStable">폭주 위험</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,wind:58,iterations:7,collision:false,fixed:false,t:0};
const names=['매스-스프링 망토','위치로 거리 제약 투영','캡슐 밖으로 파티클 밀어내기','공유 바람·돌풍 필드','어깨 앵커가 애님을 따라 이동','고정 서브스텝과 거리별 해상도'],status=['강하면 폭주하고 약하면 고무처럼 늘어남','반복할수록 원래 길이에 수렴','몸과 벽에 눌리고 다리를 뚫지 않음','방향성 바람과 거스트가 면을 밀어냄','뿌리는 즉시, 끝은 한 박자 늦게 추종','근접만 풀 PBD, 원거리는 본·셰이더 폴백'];
const desc=['<b>실패 재현:</b> 힘 기반 스프링은 강성을 올리면 가변 프레임에서 폭주하고 낮추면 망토가 고무처럼 늘어납니다. 바람을 올려 신장률을 확인하세요.','<b>위치 기반 해법:</b> 이웃 파티클 사이 목표 길이를 매 반복마다 직접 복원합니다. 반복 수를 올릴수록 격자 간격과 신장률이 안정됩니다.','<b>몸과 상호작용:</b> 몸통·다리를 캡슐로 근사하고 안으로 들어간 파티클을 표면 밖으로 투영합니다. 충돌 토글을 꺼 관통을 비교하세요.','<b>세계와 같은 바람:</b> 방향성 바람에 저주파 돌풍과 행별 위상차를 더해 천 면을 밉니다. 세기를 올리면 아래 자유 파티클부터 크게 날립니다.','<b>움직임 구동:</b> 맨 윗줄 앵커는 어깨 애니메이션을 즉시 따르고 아래 행은 관성으로 늦게 따라옵니다. 급회전 때 감겼다가 풀리는 시간차가 생깁니다.','<b>실전 예산:</b> 고정 틱이 큰 Δt 폭주를 막고, 거리 LOD는 80개 풀 격자를 20개 근사로 줄입니다. 토글을 꺼 비용과 불안정성을 비교하세요.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const pbd=S.step>=1,coll=S.step>=2&&S.collision,fixed=S.step>=5&&S.fixed,stretch=pbd?Math.max(.8,22/S.iterations+(fixed?0:Math.sin(S.t*.23)*1.8)):28+S.wind*.31,pen=S.step<2?18:coll?0:18,particles=fixed?20:80,stable=S.step<1?'폭주 위험':fixed?'고정 120Hz':S.iterations>=6?'대체로 안정':'제약 부족';return{pbd,coll,fixed,stretch,pen,particles,stable}}
function diagram(w,h,v){const ox=w*.035,oy=h*.19,gw=w*.31,gh=h*.64;label(S.step<1?'FORCE INTEGRATION':'POSITION PROJECTION',ox,oy-17,S.step<1?'#ff8179':'#8ce4b4');const n=5,rest=gh*.13,stretch=rest*(1+v.stretch/100);for(let i=0;i<n;i++){const y=oy+i*(v.pbd?rest:stretch);if(i){line(ox+gw*.34,oy+(i-1)*(v.pbd?rest:stretch),ox+gw*.34,y,S.step<1?'#ff8179':'#8ce4b4',3);if(S.step<1){for(let k=0;k<3;k++)line(ox+gw*.30+(k%2)*gw*.08,y-rest*.75+k*rest*.20,ox+gw*.38-((k+1)%2)*gw*.08,y-rest*.55+k*rest*.20,'#ff8179',1.5)}}x.fillStyle=i===0?'#ffd17f':S.step<1?'#ff8179':'#8ce4b4';x.beginPath();x.arc(ox+gw*.34,y,7,0,7);x.fill();label(i===0?'PINNED ANCHOR':v.pbd?`C${i}: |xᵢ-xⱼ| = REST`:`F = kΔx · ${v.stretch.toFixed(0)}% STRETCH`,ox+gw*.45,y+4,i===0?'#ffd17f':S.step<1?'#ff8179':'#8ce4b4')}if(S.step>=1){for(let i=0;i<S.iterations;i++){const yy=oy+gh*.73+i*5;x.fillStyle=i<S.iterations?'#8ce4b4':'#263b47';x.fillRect(ox,yy,gw*.55/S.iterations,3)}label(`PROJECT × ${S.iterations} ITERATIONS`,ox,oy+gh*.93,'#8ce4b4')}}
function cloth(w,h,v){const cx=w*.72,anchorY=h*.22,ground=h*.84,rows=v.fixed?5:10,cols=v.fixed?4:8,anchorMove=S.step>=4?Math.sin(S.t*.035)*26:0,wind=S.step>=3?(S.wind/100)*(64+Math.sin(S.t*.065)*22):0;label('CLOTH GRID · BODY PROXIES',w*.43,h*.14,'#72c9ff');line(w*.43,ground,w*.96,ground,'#526b79',3);x.globalAlpha=.38;x.fillStyle='#72c9ff';x.beginPath();x.roundRect(cx-35,anchorY+32,70,110,30);x.fill();x.beginPath();x.roundRect(cx-32,anchorY+132,25,112,13);x.fill();x.beginPath();x.roundRect(cx+7,anchorY+132,25,112,13);x.fill();x.globalAlpha=1;if(S.step>=2){label(v.coll?'CAPSULE COLLISION ON':'COLLISION OFF · CLOTH PENETRATES',cx,ground-17,v.coll?'#8ce4b4':'#ff8179','center')}
const pts=[];for(let r=0;r<rows;r++){const row=[];for(let col=0;col<cols;col++){const u=cols===1?0:col/(cols-1),lag=r/(rows-1),baseX=cx-88+u*176+anchorMove*(1-lag),baseY=anchorY+r*(h*.50/(rows-1))*(1+(v.pbd?v.stretch/400:v.stretch/100)),gust=-wind*lag+Math.sin(S.t*.055+r*.7+u*2)*wind*.16*lag;let px=baseX+gust,py=baseY;if(v.coll&&r>3){const dx=px-cx,dy=py-(anchorY+118);if(Math.abs(dx)<56&&Math.abs(dy)<78)px=cx+(dx<0?-58:58);if(r>rows*.62&&Math.abs(px-cx)<38)px=cx+(px<cx?-40:40)}row.push({x:px,y:py});}pts.push(row)}
x.fillStyle='#72c9ff18';x.beginPath();pts[0].forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));for(let r=1;r<rows;r++)x.lineTo(pts[r][cols-1].x,pts[r][cols-1].y);for(let i=cols-1;i>=0;i--)x.lineTo(pts[rows-1][i].x,pts[rows-1][i].y);for(let r=rows-2;r>0;r--)x.lineTo(pts[r][0].x,pts[r][0].y);x.closePath();x.fill();for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const p=pts[r][col];if(col)line(pts[r][col-1].x,pts[r][col-1].y,p.x,p.y,'#72c9ff',1);if(r)line(pts[r-1][col].x,pts[r-1][col].y,p.x,p.y,'#72c9ff',1);x.fillStyle=r===0?'#ffd17f':v.coll?'#8ce4b4':'#72c9ff';x.beginPath();x.arc(p.x,p.y,v.fixed?3.5:2.4,0,7);x.fill()}if(S.step>=3){for(let i=0;i<3;i++){const yy=anchorY+50+i*45;line(w*.92,yy,w*.84,yy,'#ffd17f',2,[5,4])}label(`WIND + GUST ${S.wind}%`,w*.90,anchorY+27,'#ffd17f','center')}if(S.step>=4)label('SKINNED ANCHOR → INERTIAL LAG',cx,anchorY-10,'#8ce4b4','center');if(S.step>=5)label(v.fixed?'DISTANT LOD · 20 PARTICLES · FIXED Δt':'FULL 80 PARTICLES · VARIABLE Δt',cx,h*.69,v.fixed?'#8ce4b4':'#ff8179','center')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);diagram(w,h,v);cloth(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('collision').setAttribute('aria-pressed',String(S.collision));$('fixed').setAttribute('aria-pressed',String(S.fixed));const v=vals();$('mStretch').textContent=Math.abs(v.stretch).toFixed(1)+'%';$('mPen').textContent=String(v.pen);$('mParticles').textContent=String(v.particles);$('mStable').textContent=v.stable;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.collision=S.step>=2;S.fixed=S.step>=5;update()});$('wind').oninput=e=>{S.wind=+e.target.value;$('windOut').textContent=S.wind+'%';update()};$('iterations').oninput=e=>{S.iterations=+e.target.value;$('iterationsOut').textContent=S.iterations+'회';update()};$('collision').onclick=()=>{S.collision=!S.collision;update()};$('fixed').onclick=()=>{S.fixed=!S.fixed;update()};function tick(){S.t++;draw();if(S.t%8===0)update();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
