<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q14 유리 굴절 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="유리병 뒤 배경이 굴절되고 두께에 따라 색이 짙어지며 러프니스에 따라 흐려지는 단계"></canvas><div class="hud"><span>Q14 · <b id="stage">알파 셀로판</b></span><span id="status">뒤 색을 섞기만 함</span></div></div>
<div class="steps" role="group" aria-label="유리 굴절 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>알파</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>씬 컬러 굴절</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>프레넬</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>두께 흡수</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>러프 굴절</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>한계 폴백</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="ior">굴절률 IOR</label><output id="iorOut">1.50</output></div><input id="ior" type="range" min="100" max="240" value="150"></div><div><div class="ct"><label for="rough">표면 러프니스</label><output id="roughOut">15%</output></div><input id="rough" type="range" min="0" max="100" value="15"></div><div class="toggles" role="group" aria-label="굴절 상황"><button data-case="0" aria-pressed="true">▣ 중앙 병</button><button data-case="1" aria-pressed="false">◩ 화면 경계</button><button data-case="2" aria-pressed="false">◫ 유리 겹침</button></div></div>
<div class="metrics"><div class="m"><small>씬 컬러 UV 오프셋</small><strong id="mOffset">0 px</strong></div><div class="m"><small>두꺼운 가장자리 투과</small><strong id="mTrans">100%</strong></div><div class="m"><small>굴절 밉</small><strong id="mMip">0.0</strong></div><div class="m"><small>화면 밖 폴백</small><strong id="mFallback">없음</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,ior:1.5,rough:.15,case:0,t:0},names=['알파 셀로판','씬 컬러 굴절','프레넬 반사','두께 흡수','러프 굴절','한계 폴백'];
const desc=['<b>문제 재현:</b> 뒤 배경과 초록색을 알파로 섞었을 뿐입니다. 글자와 선이 전혀 꺾이지 않아 유리가 아니라 색 셀로판처럼 보입니다.','<b>화면공간 굴절:</b> 불투명 씬 컬러를 복사하고 유리 노멀·IOR 방향으로 UV를 밀어 다시 샘플합니다. 병 안에서 뒤 글자와 격자가 어긋납니다.','<b>각도별 반사:</b> 정면은 투과하고 가장자리처럼 시선이 스치는 곳은 프레넬로 하늘·환경 반사를 늘립니다. 테두리가 밝아져 두께와 곡률이 읽힙니다.','<b>매질 길이:</b> 백페이스−프론트페이스 깊이로 두께를 얻고 Beer–Lambert 흡수를 적용합니다. 중심은 맑고 두꺼운 병 가장자리는 짙은 초록입니다.','<b>거친 유리:</b> 러프니스에 따라 더 흐린 씬 컬러 밉을 샘플합니다. 러프니스 슬라이더를 올리면 뒤 글자가 넓게 번집니다.','<b>최종 한계 관리:</b> 화면 경계 UV는 클램프·페이드 후 큐브맵으로 채우고, 투명 겹침은 씬 컬러 스냅샷에 없으므로 히어로만 순차/OIT·RT로 승격합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function bg(buf,w,h){const q=buf.getContext('2d');const g=q.createLinearGradient(0,0,0,h);g.addColorStop(0,'#355676');g.addColorStop(1,'#d29d63');q.fillStyle=g;q.fillRect(0,0,w,h);for(let i=0;i<12;i++){q.fillStyle=i%2?'rgba(255,255,255,.18)':'rgba(20,35,50,.18)';q.fillRect(i*w/12,0,w/24,h)}q.fillStyle='#1b2632';q.fillRect(0,h*.72,w,h*.28);q.fillStyle='#fff5cf';q.font='700 42px system-ui';q.textAlign='center';q.fillText('CASTLE  ·  GLASS  ·  LIGHT',w*.5,h*.46);q.fillStyle='#6c2d32';q.fillRect(w*.18,h*.18,w*.08,h*.46);q.fillStyle='#d8c591';q.beginPath();q.arc(w*.79,h*.30,h*.10,0,7);q.fill()}
function bottlePath(cx,cy,r){x.beginPath();x.moveTo(cx-r*.27,cy-r*.92);x.lineTo(cx+r*.27,cy-r*.92);x.lineTo(cx+r*.30,cy-r*.62);x.bezierCurveTo(cx+r*.62,cy-r*.45,cx+r*.72,cy-r*.08,cx+r*.66,cy+r*.68);x.quadraticCurveTo(cx,cy+r*.87,cx-r*.66,cy+r*.68);x.bezierCurveTo(cx-r*.72,cy-r*.08,cx-r*.62,cy-r*.45,cx-r*.30,cy-r*.62);x.closePath()}
function renderBottle(buf,w,h,cx,cy,r,second=false){const refr=S.step>=1,fres=S.step>=2,absorb=S.step>=3,rough=S.step>=4,offset=(S.ior-1)*24*(second?-1:1),blur=rough?S.rough*16:0;x.save();bottlePath(cx,cy,r);x.clip();if(refr){x.filter=blur?`blur(${blur}px)`:'none';x.drawImage(buf,offset,0,w,h);x.filter='none'}else{x.drawImage(buf,0,0,w,h)}const grad=x.createRadialGradient(cx,cy-r*.08,r*.12,cx,cy,r*.72);grad.addColorStop(0,`rgba(45,150,105,${absorb?.04:.13})`);grad.addColorStop(.62,`rgba(23,105,72,${absorb?.18:.13})`);grad.addColorStop(1,`rgba(7,61,42,${absorb?.58:.13})`);x.fillStyle=grad;x.fillRect(cx-r,cy-r,r*2,r*2);x.restore();bottlePath(cx,cy,r);x.strokeStyle=fres?'rgba(205,245,235,.82)':'rgba(158,215,194,.45)';x.lineWidth=fres?7:3;x.stroke();if(fres){x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=2;x.beginPath();x.moveTo(cx-r*.28,cy-r*.88);x.lineTo(cx-r*.28,cy+r*.58);x.stroke()}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,buf=document.createElement('canvas');buf.width=w;buf.height=h;bg(buf,w,h);x.clearRect(0,0,w,h);x.drawImage(buf,0,0);let cx=S.case===1?w*.90:w*.50,cy=h*.49,r=Math.min(w*.18,h*.40);renderBottle(buf,w,h,cx,cy,r);if(S.case===2)renderBottle(buf,w,h,w*.66,h*.51,r*.77,true);
if(S.step===0){x.fillStyle='rgba(7,10,15,.84)';x.fillRect(w*.06,h*.10,w*.31,h*.11);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.textAlign='left';x.fillText('배경이 보이지만 전혀 꺾이지 않음',w*.08,h*.15);x.fillStyle='#96a2b2';x.font='10px system-ui';x.fillText('알파 블렌드 = 색 셀로판',w*.08,h*.185)}
if(S.step>=5&&S.case===1){x.fillStyle='rgba(7,10,15,.82)';x.fillRect(w*.04,h*.78,w*.42,h*.10);x.fillStyle='#6ed7e5';x.font='600 10px ui-monospace,monospace';x.textAlign='left';x.fillText('OFFSCREEN UV → CLAMP + FADE + CUBEMAP',w*.06,h*.835)}
if(S.step>=5&&S.case===2){x.fillStyle='rgba(7,10,15,.82)';x.fillRect(w*.04,h*.78,w*.46,h*.10);x.fillStyle='#ffb347';x.font='600 10px ui-monospace,monospace';x.textAlign='left';x.fillText('TRANSPARENT SNAPSHOT MISSING → OIT / RT HERO',w*.06,h*.835)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.case===S.case)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('mOffset').textContent=(S.step>=1?Math.round((S.ior-1)*24):0)+' px';$('mTrans').textContent=(S.step>=3?Math.round(Math.exp(-S.ior*.55)*100):100)+'%';$('mMip').textContent=(S.step>=4?(S.rough*6).toFixed(1):'0.0');$('mFallback').textContent=S.step>=5?(S.case===1?'큐브맵':S.case===2?'OIT·RT':'대기'):'없음';$('status').textContent=['뒤 색을 섞기만 함','배경 UV가 꺾임','가장자리 반사 증가','두꺼운 가장자리 짙음','뒤 배경 밉 블러',S.case===1?'화면 밖 환경 폴백':S.case===2?'겹침은 히어로 승격':'한계 상황을 선택'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{S.case=+b.dataset.case;ui()});$('ior').oninput=e=>{S.ior=+e.target.value/100;$('iorOut').textContent=S.ior.toFixed(2);ui()};$('rough').oninput=e=>{S.rough=+e.target.value/100;$('roughOut').textContent=e.target.value+'%';ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
