<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q8 PBR 재질 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="금속, 가죽, 천이 PBR 단계에 따라 서로 다른 빛 반응을 얻는 비교"></canvas><div class="hud"><span>Q8 · <b id="stage">색만 다름</b></span><span id="status">모두 같은 플라스틱</span></div></div>
<div class="steps" role="group" aria-label="PBR 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>색만</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>수동 광택</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>PBR 입력</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>IBL</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>표면 맵</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>전용 모델</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="rough">공통 러프니스 시험</label><output id="roughOut">45%</output></div><input id="rough" type="range" min="2" max="98" value="45"></div><div class="toggles" role="group" aria-label="조명 환경"><button data-env="0" aria-pressed="true">☀ 한낮</button><button data-env="1" aria-pressed="false">🌇 노을</button><button data-env="2" aria-pressed="false">◐ 동굴</button></div></div>
<div class="metrics"><div class="m"><small>에너지 보존</small><strong id="mEnergy">OFF</strong></div><div class="m"><small>환경 반사</small><strong id="mIbl">없음</strong></div><div class="m"><small>공간 변조 맵</small><strong id="mMaps">0</strong></div><div class="m"><small>구분되는 재질</small><strong id="mKinds">0 / 3</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,rough:.45,env:0,t:0},names=['색만 다름','수동 광택','PBR 입력','IBL 환경 반사','표면 맵','전용 셰이딩'];
const desc=['<b>문제 재현:</b> 색만 칠하면 금속·가죽·천 모두 같은 플라스틱 표면입니다. 재질은 색이 아니라 빛이 튀는 방식에서 갈립니다.','<b>애드혹 실패:</b> 한낮에 눈으로 맞춘 같은 광택을 모두에게 얹었습니다. 노을·동굴을 눌러 보면 밝기와 색이 쉽게 무너집니다.','<b>물리 입력:</b> 금속은 색 있는 반사와 거의 0인 디퓨즈, 비금속은 흰 반사와 색 있는 디퓨즈를 갖습니다. 러프니스가 하이라이트 폭을 정하고 에너지를 보존합니다.','<b>반사할 세계:</b> 금속은 주변 환경을 보여 주는 재질입니다. IBL이 들어오면 동굴에서도 환경의 밝은 입구와 색을 반사해 회색 플라스틱에서 벗어납니다.','<b>균일함 깨기:</b> 러프니스·노멀·캐비티 맵이 위치마다 하이라이트를 흔듭니다. 금속의 긁힘, 가죽의 주름, 천의 짜임이 빛에서 읽힙니다.','<b>최종:</b> 표준 BRDF 위에 천의 시트 하이라이트와 이방성을 분리합니다. 같은 조명에서도 금속은 날카롭게, 가죽은 뭉툭하게, 천은 결을 따라 보송하게 반응합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function env(){return S.env===0?{top:'#78a9cf',bot:'#d8c18c',light:[255,244,210],a:.9}:S.env===1?{top:'#421f38',bot:'#d86b37',light:[255,132,72],a:.82}:{top:'#07101a',bot:'#111b25',light:[92,145,180],a:.34}}
function sphere(cx,cy,r,type){const E=env(),pbr=S.step>=2,ibl=S.step>=3,maps=S.step>=4,special=S.step>=5,rough=S.rough,base=type===0?[135,92,46]:type===1?[104,55,31]:[88,73,70],metal=type===0,localR=type===0?rough*.55:type===1?Math.min(1,rough+.22):Math.min(1,rough+.42);x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();
 const shade=x.createRadialGradient(cx-r*.35,cy-r*.4,r*.05,cx,cy,r*1.2),dif=pbr&&metal?.12:1,envA=ibl?(metal?.80:.18):0;shade.addColorStop(0,`rgb(${base.map((v,i)=>Math.round(v*dif+E.light[i]*(1-localR)*.42)).join(',')})`);shade.addColorStop(.55,`rgb(${base.map(v=>Math.round(v*(.55+dif*.25))).join(',')})`);shade.addColorStop(1,`rgb(${base.map(v=>Math.round(v*.20)).join(',')})`);x.fillStyle=shade;x.fillRect(cx-r,cy-r,r*2,r*2);
 if(S.step===1||pbr){const hw=r*(.12+localR*.55),ha=(S.step===1?.55:(1-localR)*.85+.1)*E.a;const g=x.createRadialGradient(cx-r*.3,cy-r*.38,0,cx-r*.3,cy-r*.38,hw);g.addColorStop(0,`rgba(${(pbr&&metal?base:E.light).join(',')},${ha})`);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
 if(ibl){x.globalAlpha=envA;x.fillStyle=S.env===1?'#ff9c5f':S.env===2?'#7ab1cf':'#d9ecf4';x.fillRect(cx-r,cy-r*.15,r*2,r*.12+localR*r*.18);x.globalAlpha=1}
 if(maps){for(let i=0;i<25;i++){const a=i*.91,rr=(i*37%100)/100*r;x.strokeStyle=`rgba(240,230,215,${type===0?.24:type===1?.12:.09})`;x.lineWidth=type===2?1:1.5;x.beginPath();x.moveTo(cx+Math.cos(a)*rr-r*.13,cy+Math.sin(a)*rr);x.lineTo(cx+Math.cos(a)*rr+r*.13,cy+Math.sin(a)*rr+(type===1?Math.sin(a*4)*7:0));x.stroke()}}
 if(special&&type===2){x.strokeStyle='rgba(255,244,231,.32)';x.lineWidth=8;x.beginPath();x.ellipse(cx-r*.18,cy-r*.25,r*.52,r*.15,-.35,0,7);x.stroke()}x.restore();x.strokeStyle='rgba(255,255,255,.13)';x.lineWidth=2;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,E=env(),g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,E.top);g.addColorStop(1,E.bot);x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(4,7,11,.62)';x.fillRect(0,h*.76,w,h*.24);const r=Math.min(w*.115,h*.25),cy=h*.48;[.22,.5,.78].forEach((v,i)=>sphere(w*v,cy,r,i));x.fillStyle='#e8edf5';x.textAlign='center';x.font='600 12px system-ui';x.fillText('금속',w*.22,h*.80);x.fillText('가죽',w*.5,h*.80);x.fillText('천',w*.78,h*.80);x.font='10px ui-monospace,monospace';x.fillStyle='#aab6c6';x.fillText(S.step>=2?'METAL 1 · DIFFUSE 0':'색 #875c2e',w*.22,h*.85);x.fillText(S.step>=2?'METAL 0 · ROUGH +22%':'색 #68371f',w*.5,h*.85);x.fillText(S.step>=5?'FABRIC · SHEEN · ANISO':'색 #584946',w*.78,h*.85);if(S.step===1&&S.env!==0){x.fillStyle='rgba(7,10,15,.83)';x.fillRect(w*.31,h*.10,w*.38,h*.10);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('한낮에 맞춘 광택이 이 조명에서 깨짐',w*.5,h*.155)}}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-env]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.env===S.env)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('mEnergy').textContent=S.step>=2?'ON':'OFF';$('mIbl').textContent=S.step>=3?['하늘','노을','동굴 입구'][S.env]:'없음';$('mMaps').textContent=S.step>=4?'3종':'0';$('mKinds').textContent=(S.step<1?0:S.step<2?1:S.step<5?2:3)+' / 3';$('status').textContent=['모두 같은 플라스틱',S.env===0?'한낮에만 맞음':'조명 변경으로 붕괴','물리 입력 일관','환경을 반사','긁힘·주름·짜임','금속·가죽·천 분리'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{S.env=+b.dataset.env;ui()});$('rough').oninput=e=>{S.rough=+e.target.value/100;$('roughOut').textContent=e.target.value+'%';ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
