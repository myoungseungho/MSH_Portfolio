<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q42 파노라마 LOD·HLOD 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179;--fog:#9ab7c7}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="근거리 실제 메시, 중거리 HLOD 마을, 원거리 임포스터 숲과 안개 속 지평선 프록시로 나뉘는 파노라마"></canvas><div class="hud"><span>Q42 · <b id="stage">프러스텀 전체 풀 디테일</b></span><span id="status">높은 곳에서 예산 붕괴</span></div></div>
<div class="steps" role="group" aria-label="파노라마 최적화 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>풀 디테일 전부</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>거리별 LOD</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>드로우콜 병목</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>마을 HLOD</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>숲 임포스터</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>원경 프록시·안개</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="altitude">카메라 고도</label><output id="altitudeOut">600 m</output></div><input id="altitude" type="range" min="0" max="1500" step="50" value="600"></div><div><div class="ct"><label for="range">가시 거리</label><output id="rangeOut">12 km</output></div><input id="range" type="range" min="2" max="30" value="12"></div><div class="toggles" role="group" aria-label="LOD 크로스페이드와 대기 원근"><button id="crossfade" aria-pressed="false">디더·히스테리시스</button><button id="atmosphere" aria-pressed="false">대기 원근</button></div></div>
<div class="metrics"><div class="m"><small>가시 삼각형</small><strong id="mTriangles">1.8 B</strong></div><div class="m"><small>드로우콜</small><strong id="mDraws">48,000</strong></div><div class="m"><small>LOD 경계 팝</small><strong id="mPop">심함</strong></div><div class="m"><small>지평선 비용</small><strong id="mHorizon">과다</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,altitude:600,range:12,crossfade:false,atmosphere:false,t:0},names=['full-detail frustum','screen-size LOD hierarchy','low triangles · too many submissions','clustered village HLOD','multi-view forest imposters','horizon proxy + aerial perspective'],desc=['<b>문제 재현:</b> 정상에서는 가림이 사라져 프러스텀 안의 수십만 오브젝트와 풀 디테일 메시가 한꺼번에 노출됩니다. 고도를 올려 비용 증가를 보세요.','<b>삼각형부터 줄이기:</b> 화면 크기에 따라 가까운 것은 LOD0, 먼 것은 단순 메시로 바꿉니다.','<b>남은 병목:</b> 먼 집이 삼각형 몇 개여도 수백 채가 각각 제출되면 CPU 드로우콜은 그대로입니다.','<b>개수까지 뭉치기:</b> 중거리 마을을 하나의 병합 HLOD 프록시로 바꿔 수백 번의 제출을 한 번으로 줄입니다.','<b>몇 픽셀엔 여러 각도의 판:</b> 원거리 나무는 시점에 맞는 임포스터 뷰를 골라 두 삼각형으로 그리고 근거리 메시와 섞어 넘깁니다.','<b>지평선은 실루엣만:</b> 통짜 원경 프록시를 대기 원근 속에 녹여 디테일 부족과 전환을 숨깁니다. 크로스페이드와 안개를 껐다 켜 보세요.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let exposure=(1+S.altitude/500)*(S.range/12),tri=S.step===0?1.8*exposure:S.step<4 ? .18*exposure : S.step<5 ? .08*exposure : .025*exposure,draw=S.step<3?48000*exposure:S.step===3?4200*exposure:S.step===4?980*exposure:180*exposure,pop=S.crossfade&&S.step>=1?'낮음':S.step===0?'없음':'심함',horizon=S.step>=5&&S.atmosphere?'낮음':S.step>=5?'보통':'과다';return{tri,draw,pop,horizon,exposure}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#172f43');sky.addColorStop(1,S.atmosphere?'#7897a8':'#304d5d');x.fillStyle=sky;x.fillRect(0,0,w,h);function ridge(base,amp,color,phase){x.fillStyle=color;x.beginPath();x.moveTo(0,h);for(let i=0;i<=16;i++){let px=i*w/16,py=base-Math.sin(i*1.23+phase)*amp-Math.sin(i*.47)*amp*.7;x.lineTo(px,py)}x.lineTo(w,h);x.fill()}ridge(h*.43,h*.09,S.atmosphere?'#7893a0':'#3e6376',1.8);ridge(h*.58,h*.08,S.atmosphere?'#526f7e':'#294c5e',.3);ridge(h*.73,h*.055,'#1b3543',2.1);const townY=h*.66,count=S.step>=3?5:24;for(let i=0;i<count;i++){let px=w*.25+i*w*.5/count,bw=S.step>=3?w*.085:12+(i%3)*5,bh=S.step>=3?42:18+(i%4)*7;x.fillStyle=S.step>=3?'#72c9ff':'#6e9db4';x.globalAlpha=S.step>=3?.62:.8;x.fillRect(px,townY-bh,bw,bh);x.beginPath();x.moveTo(px-3,townY-bh);x.lineTo(px+bw/2,townY-bh-10);x.lineTo(px+bw+3,townY-bh);x.fill()}x.globalAlpha=1;const trees=S.step>=4?14:32;for(let i=0;i<trees;i++){let px=(i*83%Math.floor(w*.92))+w*.04,py=h*.79+(i%3)*7,sz=8+(i%5)*2;x.fillStyle=S.step>=4?'#ffd17f':'#4d8194';if(S.step>=4){x.fillRect(px-1,py-sz*2,2,sz*2);x.beginPath();x.moveTo(px,py-sz*2.7);x.lineTo(px-sz,py-sz*.4);x.lineTo(px+sz,py-sz*.4);x.fill()}else{for(let b=0;b<4;b++){x.fillRect(px+b*2,py-sz*2-b,2,sz*2);x.beginPath();x.arc(px+b*2,py-sz*2,sz*.75,0,7);x.fill()}}}if(S.step===0){for(let i=0;i<260;i++){x.fillStyle=i%3?'#42677a':'#557f90';x.fillRect((i*47)%w,h*.84-(i%5)*3,3,3)}tag('FULL DETAIL OBJECTS · NO OCCLUSION AT ALTITUDE',w*.28,h*.90,'#ff8179')}if(S.step>=1&&S.step<=2){['LOD0','LOD1','LOD3','LOD4'].forEach((t,i)=>tag(t,w*(.08+i*.24),h*(.91-i*.05),i<2?'#72c9ff':'#97aab8'))}if(S.step===2)tag(`${Math.round(v.draw).toLocaleString()} SMALL DRAWS STILL SUBMITTED`,w*.33,h*.18,'#ff8179');if(S.step>=3)tag('VILLAGE CLUSTERS → MERGED HLOD PROXIES',w*.31,h*.60,'#8ce4b4');if(S.step>=4)tag('FOREST → VIEW-DEPENDENT IMPOSTER CARDS',w*.32,h*.86,'#ffd17f');if(S.step>=5){tag('DISTANT HEIGHTFIELD PROXY',w*.07,h*.30,'#97aab8');if(S.atmosphere){let fog=x.createLinearGradient(0,h*.18,0,h*.72);fog.addColorStop(0,'rgba(154,183,199,.56)');fog.addColorStop(1,'rgba(154,183,199,0)');x.fillStyle=fog;x.fillRect(0,h*.12,w,h*.64);tag('AERIAL PERSPECTIVE HIDES LOW DETAIL',w*.34,h*.28,'#f2f8fc')}}if(S.step>=1&&!S.crossfade){let bx=w*(.68+Math.sin(S.t*.03)*.015);x.strokeStyle='#ff8179';x.lineWidth=3;x.beginPath();x.moveTo(bx,h*.52);x.lineTo(bx,h*.86);x.stroke();tag('HARD LOD SWITCH',bx-50,h*.50,'#ff8179')}if(S.step>=1&&S.crossfade)tag('DITHER CROSSFADE + HYSTERESIS',w*.68,h*.50,'#8ce4b4')}
function metrics(){const v=vals();$('mTriangles').textContent=(v.tri>=1?v.tri.toFixed(1)+' B':Math.round(v.tri*1000)+' M');$('mDraws').textContent=Math.round(v.draw).toLocaleString();$('mPop').textContent=v.pop;$('mHorizon').textContent=v.horizon}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['높은 곳에서 예산 붕괴','픽셀 크기만큼 디테일','CPU 제출 병목 잔존','수백 채를 한 번에','시점별 판으로 입체감','안개 속 싼 실루엣'][S.step];$('explain').innerHTML=desc[S.step];$('crossfade').setAttribute('aria-pressed',String(S.crossfade));$('atmosphere').setAttribute('aria-pressed',String(S.atmosphere));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.crossfade=S.step>=4;S.atmosphere=S.step===5;ui()});$('altitude').oninput=e=>{S.altitude=+e.target.value;$('altitudeOut').textContent=e.target.value+' m';ui()};$('range').oninput=e=>{S.range=+e.target.value;$('rangeOut').textContent=e.target.value+' km';ui()};$('crossfade').onclick=()=>{S.crossfade=!S.crossfade;ui()};$('atmosphere').onclick=()=>{S.atmosphere=!S.atmosphere;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
