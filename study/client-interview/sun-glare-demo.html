<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태양 눈부심 · 블룸 데모</title>
<style>
:root{--bg:#0a0c11;--panel:#12161f;--line:#2a3444;--ink:#edf1f8;--muted:#93a0b4;--amber:#ffb448;--cyan:#65d8e9;--sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;--mono:ui-monospace,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}#root{padding:14px}.vp{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#02050b;box-shadow:0 20px 50px -24px #000}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px var(--mono);text-shadow:0 1px 3px #000}.hud span{padding:4px 9px;border:1px solid #ffffff25;border-radius:999px;background:#07101aaa}.hud b{color:#ffd187}.bar{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px}.grp{display:flex;flex-direction:column;gap:6px}.l{font:10px var(--mono);letter-spacing:.12em;color:#647084}.seg{display:flex;gap:5px;flex-wrap:wrap}button{font:600 12px var(--sans);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{color:var(--ink);border-color:#536077}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#161008}.legend{margin:13px 0 0;border-left:2px solid #315a65;padding-left:11px;color:var(--muted);font-size:12.5px;line-height:1.6}.legend b{color:#b5eff6}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}.m{background:var(--panel);padding:8px 10px}.k{font:9px var(--mono);letter-spacing:.05em;color:#667287}.v{margin-top:2px;font:600 15px var(--mono);font-variant-numeric:tabular-nums}.m.hot .v{color:#ffd187}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:13px}.slider label{display:flex;justify-content:space-between;margin-bottom:5px;color:var(--muted);font-size:11px}.slider output{font-family:var(--mono);color:var(--ink)}input{width:100%;accent-color:var(--amber)}.foot{margin-top:12px;color:#68748a;font:10px var(--mono)}@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}.sliders{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root">
<div class="vp"><canvas id="scene"></canvas><div class="hud"><span>☀️ <b id="stage">HDR 없음</b></span><span id="status">태양이 보임</span></div></div>
<div class="bar"><div class="grp"><span class="l">구현 단계</span><div class="seg" role="group" aria-label="구현 단계"><button data-step="0" aria-pressed="true">0 · 흰 원</button><button data-step="1" aria-pressed="false">1 · HDR</button><button data-step="2" aria-pressed="false">2 · 블룸</button><button data-step="3" aria-pressed="false">3 · 최종</button></div></div><div class="grp"><span class="l">태양 가림</span><div class="seg" role="group" aria-label="태양 가림"><button data-occ="0" aria-pressed="true">보임</button><button data-occ="1" aria-pressed="false">나뭇가지 사이</button><button data-occ="2" aria-pressed="false">완전 가림</button></div></div></div>
<p class="legend" id="legend"></p>
<div class="metrics"><div class="m"><div class="k">HDR 휘도</div><div class="v" id="lum">1</div></div><div class="m hot"><div class="k">블룸 에너지</div><div class="v" id="bloom">0%</div></div><div class="m"><div class="k">플레어 세기</div><div class="v" id="flare">0%</div></div><div class="m"><div class="k">노출</div><div class="v" id="exp">1.00</div></div></div>
<div class="sliders"><div class="slider"><label>블룸 강도 <output id="bv">70%</output></label><input id="bs" type="range" min="0" max="100" value="70"></div><div class="slider"><label>블룸 임계값 <output id="tv">10</output></label><input id="ts" type="range" min="2" max="40" value="10"></div><div class="slider"><label>플레어 강도 <output id="fv">70%</output></label><input id="fs" type="range" min="0" max="100" value="70"></div></div>
<div class="foot">가림 상태와 단계를 바꿔 보세요. 최종 단계에서만 가림 비율에 맞춰 블룸·플레어가 사라지고, 태양을 볼 때 노출이 내려갑니다.</div>
</div><script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id);const S={step:0,occ:0,b:70,t:10,f:70};const labels=['<b>0 · LDR 흰 원.</b> 밝기 값이 1에서 멈춰 태양도 흰 벽도 같습니다. 주변으로 넘칠 에너지가 없어 눈부심이 생기지 않습니다.','<b>1 · HDR.</b> 태양에 50,000 같은 초고휘도를 보관합니다. 화면에는 여전히 작은 원이지만, 후처리가 “정상 표면보다 훨씬 밝다”를 구분할 근거가 생겼습니다.','<b>2 · 블룸.</b> 임계값을 넘은 HDR 에너지를 넓게 블러해 원본에 더합니다. 번짐은 생기지만 가림·렌즈·노출과 아직 연결되지 않았습니다.','<b>3 · 최종.</b> 가림 비율로 블룸/플레어를 페이드하고, 태양을 정면으로 볼수록 자동 노출을 낮춥니다. 나뭇가지 사이의 깜빡임도 이 조합에서 나옵니다.'];
function vis(){return S.occ===0?1:S.occ===1?.38:0}function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}function draw(){resize();let w=c.clientWidth,h=c.clientHeight,sx=w*.72,sy=h*.28,v=vis(),hdr=S.step>0?50000:1,bloom=S.step>1?(S.b/100)*v*Math.max(0,1-S.t/45):0,flare=S.step>2?(S.f/100)*v:0,ex=S.step>2?1-.38*v:1;x.clearRect(0,0,w,h);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#2768b5');sky.addColorStop(.58,'#9fc4dd');sky.addColorStop(.59,'#506a58');sky.addColorStop(1,'#17241c');x.fillStyle=sky;x.fillRect(0,0,w,h);x.globalAlpha=ex; if(bloom){let g=x.createRadialGradient(sx,sy,0,sx,sy,Math.min(w,h)*(.10+.30*bloom));g.addColorStop(0,`rgba(255,224,150,${.65*bloom})`);g.addColorStop(.35,`rgba(255,181,77,${.22*bloom})`);g.addColorStop(1,'rgba(255,170,50,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}x.fillStyle='#fff6c9';x.beginPath();x.arc(sx,sy,11,0,Math.PI*2);x.fill();if(flare){x.save();x.globalAlpha=.55*flare;for(let i=1;i<5;i++){let px=sx+(w/2-sx)*i/5,py=sy+(h/2-sy)*i/5,r=4+i*2;x.fillStyle=i%2?'#f8c36b':'#a8dfff';x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}x.strokeStyle='#ffe9a8';x.lineWidth=1.5;x.beginPath();x.moveTo(sx-58,sy);x.lineTo(sx+58,sy);x.moveTo(sx,sy-58);x.lineTo(sx,sy+58);x.stroke();x.restore()}x.globalAlpha=1;if(S.occ>0){x.strokeStyle='#18291b';x.lineWidth=18;x.lineCap='round';x.beginPath();x.moveTo(sx-80,sy-75);x.quadraticCurveTo(sx-20,sy-15,sx+55,sy+45);if(S.occ===2)x.lineTo(sx+90,sy+80);x.stroke();x.lineWidth=11;x.beginPath();x.moveTo(sx-20,sy-55);x.lineTo(sx+45,sy+20);x.stroke()}x.fillStyle='rgba(0,0,0,.38)';x.fillRect(0,h-29,w,29);x.fillStyle='#dbe7ef';x.font='11px ui-monospace,monospace';x.fillText(S.occ===1?'나뭇잎 가림 비율 62%':'가림 비율 '+Math.round((1-v)*100)+'%',12,h-11);$('lum').textContent=hdr.toLocaleString();$('bloom').textContent=Math.round(bloom*100)+'%';$('flare').textContent=Math.round(flare*100)+'%';$('exp').textContent=ex.toFixed(2);$('status').textContent=v?'태양이 보임':'태양이 가려짐'}function setStep(n){S.step=n;document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.step===n));$('stage').textContent=['HDR 없음','HDR 50,000','HDR + 블룸','가림 + 노출 연동'][n];$('legend').innerHTML=labels[n];draw();postH()}function setOcc(n){S.occ=n;document.querySelectorAll('[data-occ]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.occ===n));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setStep(+b.dataset.step));document.querySelectorAll('[data-occ]').forEach(b=>b.onclick=()=>setOcc(+b.dataset.occ));[['bs','b','bv','%'],['ts','t','tv',''],['fs','f','fv','%']].forEach(([id,key,out,suf])=>$(id).oninput=e=>{S[key]=+e.target.value;$(out).textContent=S[key]+suf;draw()});function postH(){try{parent.postMessage({type:'sg-h',h:Math.ceil($('root').getBoundingClientRect().height)+4},'*')}catch(e){}}addEventListener('resize',()=>{draw();postH()});setStep(0);setOcc(0);postH()})();
</script></body></html>
