<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태양 눈부심 · 블룸 데모</title>
<style>
:root{--bg:#0a0c11;--panel:#12161f;--line:#2a3444;--ink:#edf1f8;--muted:#93a0b4;--amber:#ffb448;--cyan:#65d8e9;--sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;--mono:ui-monospace,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}#root{padding:14px}.vp{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#02050b;box-shadow:0 20px 50px -24px #000}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px var(--mono);text-shadow:0 1px 3px #000}.hud span{padding:4px 9px;border:1px solid #ffffff25;border-radius:999px;background:#07101aaa}.hud b{color:#ffd187}.bar{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px}.grp{display:flex;flex-direction:column;gap:6px}.l{font:10px var(--mono);letter-spacing:.12em;color:#647084}.seg{display:flex;gap:5px;flex-wrap:wrap}button{font:600 12px var(--sans);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{color:var(--ink);border-color:#536077}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#161008}.legend{margin:13px 0 0;border-left:2px solid #315a65;padding-left:11px;color:var(--muted);font-size:12.5px;line-height:1.6}.legend b{color:#b5eff6}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}.m{background:var(--panel);padding:8px 10px}.k{font:9px var(--mono);letter-spacing:.05em;color:#667287}.v{margin-top:2px;font:600 15px var(--mono);font-variant-numeric:tabular-nums}.m.hot .v{color:#ffd187}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:13px}.slider label{display:flex;justify-content:space-between;margin-bottom:5px;color:var(--muted);font-size:11px}.slider output{font-family:var(--mono);color:var(--ink)}input{width:100%;accent-color:var(--amber)}.foot{margin-top:12px;color:#68748a;font:10px var(--mono)}@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}.sliders{grid-template-columns:1fr}}
</style></head><body><div id="root">
<div class="vp"><canvas id="scene"></canvas><div class="hud"><span>☀️ <b id="stage">LDR · 흰 원</b></span><span id="status">태양이 보임</span></div></div>
<div class="bar"><div class="grp"><span class="l">구현 단계</span><div class="seg" role="group" aria-label="구현 단계"><button data-step="0" aria-pressed="true">0 · 흰 원</button><button data-step="1" aria-pressed="false">1 · HDR</button><button data-step="2" aria-pressed="false">2 · 블룸</button><button data-step="3" aria-pressed="false">3 · 최종</button></div></div><div class="grp"><span class="l">태양 가림</span><div class="seg" role="group" aria-label="태양 가림"><button data-occ="0" aria-pressed="true">보임</button><button data-occ="1" aria-pressed="false">나뭇가지 사이</button><button data-occ="2" aria-pressed="false">완전 가림</button></div></div></div>
<p class="legend" id="legend"></p><div class="metrics"><div class="m"><div class="k">HDR 휘도</div><div class="v" id="lum">1</div></div><div class="m hot"><div class="k">블룸 에너지</div><div class="v" id="bloom">0%</div></div><div class="m"><div class="k">플레어 세기</div><div class="v" id="flare">0%</div></div><div class="m"><div class="k">자동 노출</div><div class="v" id="exp">1.00</div></div></div>
<div class="sliders"><div class="slider"><label>블룸 강도 <output id="bv">85%</output></label><input id="bs" type="range" min="0" max="100" value="85"></div><div class="slider"><label>블룸 임계값 <output id="tv">10</output></label><input id="ts" type="range" min="2" max="40" value="10"></div><div class="slider"><label>플레어 강도 <output id="fv">85%</output></label><input id="fs" type="range" min="0" max="100" value="85"></div></div><div class="foot">단계별로 화면 출력이 달라집니다. 마지막 단계에서만 나뭇가지 가림이 블룸·플레어와 자동 노출에 함께 반영됩니다.</div>
</div><script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const S={step:0,occ:0,b:85,t:10,f:85};
const L=[
'<b>0 · LDR 흰 원.</b> 태양은 흰 벽과 같은 값 1입니다. 화면에 단단한 원 하나만 있고, 주변으로 흘러갈 빛 에너지가 없습니다.',
'<b>1 · HDR 버퍼.</b> 태양을 50,000으로 저장합니다. 톤매핑 뒤의 화면은 여전히 제한되지만, 중앙의 진한 코어와 HDR 계측값처럼 후처리가 구분할 “에너지 차이”가 생겼습니다.',
'<b>2 · 블룸.</b> 초과 에너지를 큰 반경과 작은 반경으로 나눠 퍼뜨립니다. 태양 주변이 확실하게 부풀고, 임계값·강도를 조절하면 번짐 범위가 즉시 달라집니다.',
'<b>3 · 최종 합성.</b> 블룸에 스타버스트·렌즈 고스트를 더하고 자동 노출을 내립니다. 가림 상태를 바꾸면 태양 자체뿐 아니라 모든 부수 효과가 함께 사라집니다.'
];
function visible(){return S.occ===0?1:S.occ===1?.32:0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}
function circle(cx,cy,r,color){x.fillStyle=color;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill()}
function glow(cx,cy,r,a,color){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,color.replace('A',a));g.addColorStop(.2,color.replace('A',a*.55));g.addColorStop(1,color.replace('A',0));x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function tree(cx,cy,hard){x.strokeStyle='#15291a';x.lineCap='round';x.lineWidth=hard?35:19;x.beginPath();x.moveTo(cx-120,cy-100);x.quadraticCurveTo(cx-35,cy-10,cx+105,cy+100);x.stroke();x.lineWidth=hard?21:11;x.beginPath();x.moveTo(cx-30,cy-85);x.lineTo(cx+70,cy+18);x.moveTo(cx-75,cy-24);x.lineTo(cx+28,cy+80);x.stroke()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,sx=w*.71,sy=h*.29,v=visible();const hdr=S.step?50000:1,b=S.step>=2?(S.b/100)*v*Math.max(0,1-S.t/44):0,f=S.step>=3?(S.f/100)*v:0,ex=S.step>=3?1-.48*v:1;
const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#174477');sky.addColorStop(.56,'#7ea9c6');sky.addColorStop(.57,'#405c47');sky.addColorStop(1,'#152117');x.fillStyle=sky;x.fillRect(0,0,w,h);x.save();x.globalAlpha=ex;
if(S.step===0){circle(sx,sy,13,'#fffce5')}else{glow(sx,sy,62,1,'rgba(255,181,50,A)');circle(sx,sy,16,'#fff7ca');circle(sx,sy,8,'#fff')}
if(b){glow(sx,sy,Math.min(w,h)*(.54*b+.12),.82*b,'rgba(255,142,37,A)');glow(sx,sy,Math.min(w,h)*(.25*b+.06),.95*b,'rgba(255,246,190,A)')}
if(f){x.save();x.globalAlpha=.9*f;x.strokeStyle='#ffe5a0';x.lineWidth=2.3;x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;x.moveTo(sx+Math.cos(a)*11,sy+Math.sin(a)*11);x.lineTo(sx+Math.cos(a)*82,sy+Math.sin(a)*82)}x.stroke();for(let i=1;i<5;i++){const px=sx+(w*.5-sx)*i/5,py=sy+(h*.5-sy)*i/5;circle(px,py,4+i*2,i%2?'rgba(255,179,80,.85)':'rgba(155,220,255,.75)')}x.restore()}
x.restore();if(S.occ)tree(sx,sy,S.occ===2);x.fillStyle='rgba(1,8,12,.56)';x.fillRect(0,h-35,w,35);x.fillStyle='#e5edf6';x.font='11px ui-monospace,monospace';x.fillText(S.occ===1?'가림 68% · 나뭇가지 사이':'가림 '+Math.round((1-v)*100)+'%',12,h-13);
if(S.step===1){x.fillStyle='rgba(9,18,28,.72)';x.fillRect(12,46,138,45);x.fillStyle='#f9c66c';x.font='10px ui-monospace,monospace';x.fillText('HDR BUFFER',22,64);x.fillStyle='#e8eef6';x.font='16px ui-monospace,monospace';x.fillText('50,000 cd/m²',22,83)}
$('lum').textContent=hdr.toLocaleString();$('bloom').textContent=Math.round(b*100)+'%';$('flare').textContent=Math.round(f*100)+'%';$('exp').textContent=ex.toFixed(2);$('status').textContent=v?'태양이 보임':'태양이 가려짐'}
function step(n){S.step=n;document.querySelectorAll('[data-step]').forEach(e=>e.setAttribute('aria-pressed',+e.dataset.step===n));$('stage').textContent=['LDR · 흰 원','HDR · 50,000','HDR + 블룸','최종 · 합성'][n];$('legend').innerHTML=L[n];draw();postH()}
function occ(n){S.occ=n;document.querySelectorAll('[data-occ]').forEach(e=>e.setAttribute('aria-pressed',+e.dataset.occ===n));draw()}
document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>step(+e.dataset.step));document.querySelectorAll('[data-occ]').forEach(e=>e.onclick=()=>occ(+e.dataset.occ));[['bs','b','bv','%'],['ts','t','tv',''],['fs','f','fv','%']].forEach(([id,key,out,unit])=>$(id).oninput=e=>{S[key]=+e.target.value;$(out).textContent=S[key]+unit;draw()});function postH(){try{parent.postMessage({type:'sg-h',h:Math.ceil($('root').getBoundingClientRect().height)+4},'*')}catch(e){}}addEventListener('resize',()=>{draw();postH()});step(0);occ(0);postH();
})();
</script></body></html>
