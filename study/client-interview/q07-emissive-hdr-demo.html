<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q7 이미시브 HDR 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5;--red:#ff7469}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root">
<div class="viewport"><canvas id="scene" role="img" aria-label="밝은 알베도에서 HDR 이미시브와 주변 조명까지 단계별로 쌓는 대장간"></canvas><div class="hud"><span>Q7 · <b id="stage">밝은 알베도</b></span><span id="status">조명이 없으면 어두움</span></div></div>
<div class="steps" role="group" aria-label="이미시브 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>밝은 알베도</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>LDR 이미시브</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>HDR·온도</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>블룸</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>주변 조명</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>선별·후합성</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="temp">쇳물 온도</label><output id="tempOut">2200K</output></div><input id="temp" type="range" min="900" max="6500" step="100" value="2200"></div><div><div class="ct"><label for="energy">이미시브 HDR</label><output id="energyOut">18.0</output></div><input id="energy" type="range" min="1" max="30" step=".5" value="18"></div><div><div class="ct"><label for="threshold">블룸 임계값</label><output id="thresholdOut">1.5</output></div><input id="threshold" type="range" min=".2" max="6" step=".1" value="1.5"></div></div>
<div class="metrics"><div class="m"><small>머티리얼 출력</small><strong id="mOutput">알베도</strong></div><div class="m"><small>HDR 넘침</small><strong id="mHdr">0.0</strong></div><div class="m"><small>주변광 기여</small><strong id="mLight">0%</strong></div><div class="m"><small>잘못 번지는 흰색/UI</small><strong id="mFalse">0</strong></div></div>
</div><script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,temp:2200,energy:18,threshold:1.5,t:0};
const names=['밝은 알베도','LDR 이미시브','HDR·온도','블룸','주변 조명','선별·후합성'],desc=['<b>문제 재현:</b> 노란 알베도는 조명을 반사하는 색일 뿐입니다. 어두운 대장간에서는 쇳물도 함께 어두워져 “스스로 빛남”이 없습니다.','<b>자발광 분리:</b> 조명 계산 뒤에 이미시브를 더하면 어둠 속에서도 살아남습니다. 하지만 LDR 1.0에 갇혀 흰 표면보다 더 밝아 보일 단서가 없습니다.','<b>밝기와 온도:</b> 값을 1보다 크게 HDR에 기록하고 블랙바디 곡선으로 온도를 색에 연결합니다. 아직 모니터에선 톤매핑되어 하얗게 눌립니다.','<b>넘침을 시각화:</b> 톤매핑 전 HDR에서 임계값을 넘긴 픽셀만 추출해 블룸을 만듭니다. 임계값을 너무 낮추면 흰 천까지 번지는 실패도 직접 확인할 수 있습니다.','<b>실제 광원 추가:</b> 이미시브와 같은 위치의 라이트/GI가 벽과 모루를 붉게 물들입니다. 물체가 빛나 보이는 층과 주변을 밝히는 층은 별도입니다.','<b>최종:</b> HDR 1.0보다 높은 씬 발광만 블룸에 넣고 UI는 톤매핑·블룸 뒤에 합성합니다. 흰 천은 희지만 발광하지 않고, 쇳물만 넘칩니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function blackbody(k){let t=k/100,r,g,b;if(t<=66){r=255;g=99.4708*Math.log(t)-161.1196;b=t<=19?0:138.5177*Math.log(t-10)-305.0448}else{r=329.6987*Math.pow(t-60,-.1332);g=288.1222*Math.pow(t-60,-.0755);b=255}return [Math.max(0,Math.min(255,r)),Math.max(0,Math.min(255,g)),Math.max(0,Math.min(255,b))].map(Math.round)}
function glow(cx,cy,r,col,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${col.join(',')},${a})`);g.addColorStop(.35,`rgba(${col.join(',')},${a*.4})`);g.addColorStop(1,`rgba(${col.join(',')},0)`);x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,col=blackbody(S.temp),em=S.step>=1?(S.step===1?1:S.energy):0,hdr=Math.max(0,em-1),bloom=S.step>=3?Math.max(0,em-S.threshold)/30:0,light=S.step>=4?Math.min(1,em/22):0,select=S.step>=5;x.clearRect(0,0,w,h);x.fillStyle='#080b10';x.fillRect(0,0,w,h);
// workshop wall and GI
if(light){glow(w*.48,h*.57,w*.45,col,light*.34);x.fillStyle=`rgba(${col.join(',')},${light*.08})`;x.fillRect(0,0,w,h)}
x.fillStyle='#171b21';x.fillRect(0,h*.76,w,h*.24);x.fillStyle='#23272c';x.fillRect(w*.08,h*.23,w*.16,h*.42);x.fillStyle='#0b0d11';x.fillRect(w*.105,h*.28,w*.11,h*.30); // furnace
// white cloth is a comparison target
x.fillStyle='#d7d8d4';x.beginPath();x.moveTo(w*.76,h*.27);x.lineTo(w*.90,h*.31);x.lineTo(w*.87,h*.63);x.lineTo(w*.73,h*.59);x.closePath();x.fill();x.fillStyle='#92999f';x.font='10px system-ui';x.fillText('흰 천 · 0.9',w*.77,h*.68);
// anvil
x.fillStyle=light?`rgb(${55+light*95},${49+light*38},${45+light*18})`:'#30343a';x.fillRect(w*.57,h*.60,w*.18,h*.10);x.fillRect(w*.63,h*.70,w*.07,h*.08);x.fillRect(w*.54,h*.57,w*.25,h*.04);
// molten channel
const y=h*.62;if(S.step===0){x.fillStyle='#5b321b'}else{x.fillStyle=`rgb(${col.join(',')})`};x.beginPath();x.moveTo(w*.13,y-h*.05);x.bezierCurveTo(w*.32,y-h*.10,w*.43,y+h*.04,w*.57,y);x.lineTo(w*.58,y+h*.10);x.bezierCurveTo(w*.40,y+h*.15,w*.26,y+h*.01,w*.12,y+h*.08);x.closePath();x.fill();
if(bloom){glow(w*.34,y,w*(.12+bloom*.20),col,.28+bloom*.5);glow(w*.50,y,w*(.08+bloom*.11),col,.22+bloom*.4)}
// wrong post-tonemap bloom makes white cloth/UI glow when threshold <= 1
const falseBloom=S.step===3&&S.threshold<=1;if(falseBloom)glow(w*.82,h*.45,w*.14,[240,240,240],.55);
// UI sample: deliberately drawn before bloom until final
if(falseBloom)glow(w*.89,h*.12,w*.10,[100,205,255],.45);x.fillStyle='#2c8fc7';x.fillRect(w*.83,h*.08,w*.13,h*.08);x.fillStyle='#fff';x.font='600 10px system-ui';x.fillText(select?'UI · 후합성':'UI · 씬에 섞임',w*.845,h*.13);
if(S.step===0){x.fillStyle='rgba(7,10,15,.83)';x.fillRect(w*.30,h*.20,w*.35,h*.11);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('노란색 ≠ 스스로 빛나는 값',w*.32,h*.25);x.fillStyle='#8d99a9';x.font='10px system-ui';x.fillText('조명이 0이면 밝은 알베도도 어두움',w*.32,h*.285)}
if(S.step===2){x.fillStyle='rgba(7,10,15,.83)';x.fillRect(w*.31,h*.19,w*.34,h*.10);x.fillStyle='#ffd27d';x.font='600 11px ui-monospace,monospace';x.fillText(`HDR ${S.energy.toFixed(1)} → TONEMAP 1.0`,w*.34,h*.245)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];const em=S.step>=1?(S.step===1?1:S.energy):0,hdr=Math.max(0,em-1),falseCount=S.step===3&&S.threshold<=1?2:0;$('mOutput').textContent=['알베도','LDR 1.0',`HDR ${S.energy.toFixed(1)}`,`HDR ${S.energy.toFixed(1)}`,`HDR+Light`,`HDR 선별`][S.step];$('mHdr').textContent=hdr.toFixed(1);$('mLight').textContent=(S.step>=4?Math.round(Math.min(1,S.energy/22)*100):0)+'%';$('mFalse').textContent=falseCount;$('status').textContent=['조명이 없으면 어두움','상한 1.0','톤매핑에 눌림','HDR가 화면 밖으로 번짐','벽·모루가 붉어짐','흰색·UI는 발광 제외'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});$('temp').oninput=e=>{S.temp=+e.target.value;$('tempOut').textContent=e.target.value+'K';ui()};$('energy').oninput=e=>{S.energy=+e.target.value;$('energyOut').textContent=(+e.target.value).toFixed(1);ui()};$('threshold').oninput=e=>{S.threshold=+e.target.value;$('thresholdOut').textContent=(+e.target.value).toFixed(1);ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
