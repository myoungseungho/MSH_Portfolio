<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q77 검기 리본 트레일 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--violet:#b89cff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="검의 밑동과 칼끝 위치를 시간 히스토리로 기록해 끊긴 스프라이트에서 매끈하고 가늘어지는 리본 검기로 발전시키는 실험"></canvas><div class="hud"><span>Q77 · <b id="stage">프레임마다 스프라이트 찍기</b></span><span id="status">낮은 FPS에서는 위치 사이가 벌어져 점선이 된다</span></div></div>
<div class="steps" role="group" aria-label="검기 트레일 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>점 잔상</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>소켓 기록</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>리본 메시</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>시간독립 샘플</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스플라인·테이퍼</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>전장 예산</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="fps">렌더 프레임</label><output id="fpsOut">30 FPS</output></div><input id="fps" type="range" min="30" max="120" step="30" value="30"></div><div><div class="ct"><label for="speed">스윙 속도</label><output id="speedOut">1.4×</output></div><input id="speed" type="range" min="5" max="22" value="14"></div><div class="toggles"><button id="spline" aria-pressed="false">스플라인 보간</button><button id="budget" aria-pressed="false">트레일 예산</button></div></div>
<div class="metrics"><div class="m"><small>히스토리 샘플</small><strong id="mSamples">0개</strong></div><div class="m"><small>최대 샘플 간격</small><strong id="mGap">0 px</strong></div><div class="m"><small>리본 정점</small><strong id="mVerts">0개</strong></div><div class="m"><small>동시 표시 / 오버드로</small><strong id="mCost">1 / 1.0×</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,S={step:0,fps:30,speed:1.4,spline:false,budget:false,t:0,acc:0,history:[]};
const names=['프레임마다 칼끝에 낱개 스프라이트','밑동·칼끝 월드 위치를 히스토리에 기록','두 시점의 네 점을 삼각형 스트립으로 연결','렌더 FPS와 무관하게 8ms마다 위치 기록','캣멀롬 보간 + 나이 기반 폭·알파 성형','거리·중요도로 동시 트레일 수와 면적 제한'];
const status=['30 FPS 고속 스윙에서 점들이 뚝뚝 끊긴다','시간이 공간 좌표의 연속 기록으로 바뀐다','점이 아니라 카메라와 무관한 하나의 면','30·60·120 FPS 모두 같은 공간 밀도','꼬리가 가늘고 투명해지는 매끈한 초승달','화면 기여도가 낮은 궤적부터 짧고 얇게'];
const desc=['<b>가짜 재현:</b> 매 렌더 프레임 칼끝에 빌보드를 하나씩 찍습니다. FPS를 바꾸면 점의 간격도 함께 바뀌어 30 FPS 고속 스윙에서 끊깁니다.','<b>시간을 기록:</b> 칼의 밑동과 칼끝 소켓 두 위치를 히스토리에 남깁니다. 두 점이 리본의 실제 폭을 정의하지만 아직 낱개 샘플이라 간격은 보입니다.','<b>연속 면으로 연결:</b> 이전·현재 밑동/끝 네 점을 사각형으로 잇고 삼각형 스트립으로 꿰맵니다. 이제 점선은 면이 되지만 저프레임에서는 외곽선이 각집니다.','<b>프레임 의존 제거:</b> 렌더 프레임이 아니라 고정 8ms 간격으로 애니메이션 위치를 재평가해 기록합니다. FPS를 바꿔도 샘플 밀도와 최대 간격이 유지됩니다.','<b>곡선과 수명 성형:</b> 캣멀롬 보간으로 사이 정점을 만들고, 오래된 꼬리일수록 폭과 알파를 줄입니다. 스플라인 버튼으로 각진 원본과 매끈한 결과를 비교할 수 있습니다.','<b>값이 큰 궤적에만 예산:</b> 여러 전투원이 휘두르는 상황을 복제합니다. 예산 버튼은 주인공 리본은 유지하고 먼 궤적의 길이·폭·개수를 줄여 오버드로를 회수합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function pose(t,w,h,off=0,scale=1){const cx=w*(.38+off),cy=h*.58,r=w*.19*scale,a=-2.15+((Math.sin(t*S.speed)+1)/2)*2.65,base={x:cx+Math.cos(a)*r*.28,y:cy+Math.sin(a)*r*.28},tip={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};return{base,tip,cx,cy,a}}
function sample(w,h){S.history.push({...pose(S.t,w,h),age:0});const limit=S.step>=3?100:34;if(S.history.length>limit)S.history.shift()}
function cat(p0,p1,p2,p3,t,k){const t2=t*t,t3=t2*t;return .5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)}
function points(key){if(!(S.step>=4&&S.spline)||S.history.length<4)return S.history.map(h=>h[key]);const a=[];for(let i=0;i<S.history.length-3;i++)for(let q=0;q<4;q++){const t=q/4;a.push({x:cat(S.history[i][key],S.history[i+1][key],S.history[i+2][key],S.history[i+3][key],t,'x'),y:cat(S.history[i][key],S.history[i+1][key],S.history[i+2][key],S.history[i+3][key],t,'y')})}return a}
function ribbon(base,tip,alpha=1,width=1){if(base.length<2)return;for(let i=1;i<base.length;i++){const a0=(i-1)/(base.length-1),a1=i/(base.length-1),t0=(S.step>=4?.12+.88*a0:1)*width,t1=(S.step>=4?.12+.88*a1:1)*width,o0={x:base[i-1].x+(tip[i-1].x-base[i-1].x)*t0,y:base[i-1].y+(tip[i-1].y-base[i-1].y)*t0},o1={x:base[i].x+(tip[i].x-base[i].x)*t1,y:base[i].y+(tip[i].y-base[i].y)*t1};x.fillStyle=`rgba(112,206,255,${(.06+.34*a1)*alpha})`;x.beginPath();x.moveTo(base[i-1].x,base[i-1].y);x.lineTo(o0.x,o0.y);x.lineTo(o1.x,o1.y);x.lineTo(base[i].x,base[i].y);x.closePath();x.fill();if(S.step===2||!S.spline){x.strokeStyle=`rgba(184,156,255,${(.08+.5*a1)*alpha})`;x.lineWidth=1;x.stroke()}}}
function values(){let gap=0;for(let i=1;i<S.history.length;i++)gap=Math.max(gap,Math.hypot(S.history[i].tip.x-S.history[i-1].tip.x,S.history[i].tip.y-S.history[i-1].tip.y));const mult=S.step>=4&&S.spline?4:1,trails=S.step>=5?(S.budget?3:7):1,cost=trails*(S.budget?1.15:2.35);return{gap,samples:S.history.length,verts:S.step>=2?S.history.length*2*mult:0,trails,cost}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values();x.fillStyle='#0d1424';x.fillRect(0,0,w,h);x.strokeStyle='#24334a';x.beginPath();x.moveTo(0,h*.82);x.lineTo(w,h*.82);x.stroke();const copies=S.step>=5?v.trails:1;for(let q=copies-1;q>=0;q--){const off=q?(.24+q*.055):0,alpha=q?(S.budget?.18:.28):1,sc=q?(S.budget?.55:.72):1;if(q){const fake=S.history.map((_,i)=>pose(S.t-(S.history.length-i)*.022,w,h,off,sc));ribbon(fake.map(p=>p.base),fake.map(p=>p.tip),alpha,S.budget?.55:1)}else if(S.step===0){for(let i=0;i<S.history.length;i+=2){const p=S.history[i].tip;x.fillStyle='rgba(184,156,255,.72)';x.beginPath();x.arc(p.x,p.y,5,0,TAU);x.fill()}}else if(S.step===1){for(const h0 of S.history){x.strokeStyle='rgba(112,206,255,.55)';x.beginPath();x.moveTo(h0.base.x,h0.base.y);x.lineTo(h0.tip.x,h0.tip.y);x.stroke();x.fillStyle='#ffd06e';x.fillRect(h0.base.x-2,h0.base.y-2,4,4);x.fillStyle='#b89cff';x.fillRect(h0.tip.x-2,h0.tip.y-2,4,4)}}else ribbon(points('base'),points('tip'))}
const p=pose(S.t,w,h);x.fillStyle='#28364e';x.beginPath();x.arc(p.cx,p.cy,21,0,TAU);x.fill();x.strokeStyle='#edf5ff';x.lineWidth=7;x.beginPath();x.moveTo(p.base.x,p.base.y);x.lineTo(p.tip.x,p.tip.y);x.stroke();x.fillStyle='#ffd06e';x.beginPath();x.arc(p.base.x,p.base.y,5,0,TAU);x.fill();x.fillStyle='#b89cff';x.beginPath();x.arc(p.tip.x,p.tip.y,5,0,TAU);x.fill();x.font='600 10px ui-monospace,Consolas,monospace';x.fillStyle='#8ce3ae';x.fillText(S.step>=3?'FIXED 8ms HISTORY':'RENDER-FRAME HISTORY',w*.42,h*.18);$('mSamples').textContent=v.samples+'개';$('mGap').textContent=v.gap.toFixed(0)+' px';$('mVerts').textContent=v.verts+'개';$('mCost').textContent=v.trails+' / '+v.cost.toFixed(1)+'×';c.dataset.samples=v.samples;c.dataset.gap=v.gap.toFixed(2);c.dataset.verts=v.verts;c.dataset.trails=v.trails;c.dataset.cost=v.cost.toFixed(2)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('spline').setAttribute('aria-pressed',String(S.spline));$('budget').setAttribute('aria-pressed',String(S.budget));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.spline=S.step>=4;S.budget=S.step>=5;S.history=[];S.acc=0;update()});$('fps').oninput=e=>{S.fps=+e.target.value;$('fpsOut').textContent=S.fps+' FPS';S.history=[];update()};$('speed').oninput=e=>{S.speed=+e.target.value/10;$('speedOut').textContent=S.speed.toFixed(1)+'×';S.history=[];update()};$('spline').onclick=()=>{S.spline=!S.spline;update()};$('budget').onclick=()=>{S.budget=!S.budget;update()};let last=performance.now(),renderAcc=0;function tick(now){const dt=Math.min(.035,(now-last)/1000);last=now;S.t+=dt;S.acc+=dt;renderAcc+=dt;const interval=S.step>=3?.008:1/S.fps;while(S.acc>=interval){sample(c.clientWidth,c.clientHeight);S.acc-=interval}if(renderAcc>=1/S.fps){draw();renderAcc=0}requestAnimationFrame(tick)}update();requestAnimationFrame(tick);addEventListener('resize',draw);
})();
</script></body></html>
