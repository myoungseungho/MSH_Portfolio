<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q22 물 굴절·깊이 흡수 단계형 실험실</title>
<style>
:root{--bg:#080d13;--panel:#111a25;--line:#2a3a4c;--ink:#edf4fa;--muted:#93a6ba;--cyan:#62d7e7;--blue:#58aeea;--amber:#ffd06b;--red:#ff7178}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#07101a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#061316}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6d8197;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="파란 반투명 평면에서 화면공간 굴절, 깊이 차 기반 흡수·물가 페이드와 프레넬 반사까지 쌓는 물 셰이더 단계"></canvas><div class="hud"><span>Q22 · <b id="stage">파란 알파 평면</b></span><span id="status">색 필터일 뿐</span></div></div>
<div class="steps" role="group" aria-label="물 굴절 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>파란 투명막</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>장면색·깊이</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>노멀 UV 굴절</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>깊이·경계 실패</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>흡수·마스크</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>프레넬 표면</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="depth">관찰 지점 물 깊이</label><output id="depthOut">1.8 m</output></div><input id="depth" type="range" min="0" max="50" value="18"></div><div><div class="ct"><label for="wave">파도·UV 왜곡</label><output id="waveOut">35%</output></div><input id="wave" type="range" min="0" max="100" value="35"></div><div class="toggles" role="group" aria-label="굴절 경계와 표면 반사 옵션"><button id="mask" aria-pressed="false">깊이 마스크·페이드</button><button id="fresnel" aria-pressed="false">프레넬 반사</button></div></div>
<div class="metrics"><div class="m"><small>잠긴 다리 굴절</small><strong id="mBend">0 px</strong></div><div class="m"><small>바닥 빛 투과</small><strong id="mTransmit">72%</strong></div><div class="m"><small>물 밖 픽셀 누출</small><strong id="mLeak">0%</strong></div><div class="m"><small>수평선 반사</small><strong id="mReflect">0%</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,depth:1.8,wave:.35,mask:false,fresnel:false},names=['파란 알파 평면','scene color + depth','normal UV offset','통과 거리 없음·경계 누출','Beer–Lambert + depth fade','굴절 ↔ 반사 프레넬'];
const desc=['<b>문제 재현:</b> 반투명 파란 평면은 다리와 자갈을 그대로 보여 주고, 발목 물과 깊은 강도 같은 색입니다. 물의 표면·부피 어느 쪽도 계산하지 않은 색 필터입니다.','<b>재활용할 재료:</b> 물을 그리기 직전의 scene color와 scene depth를 확보합니다. 색은 굴절 샘플, 수면·바닥 깊이 차는 빛이 물을 통과한 거리로 사용합니다.','<b>화면공간 굴절:</b> 잔물결 노멀 방향만큼 scene color UV를 밀어 읽습니다. 잠긴 다리와 자갈이 수면에서 꺾이고 흔들리지만 실제 광선 대신 이미 그린 화면을 왜곡한 근사입니다.','<b>두 실패:</b> 통과 거리를 아직 쓰지 않아 얕고 깊은 물이 똑같고, 밀린 UV가 수면보다 앞의 캐릭터 픽셀을 집으면 물 밖 발이 물속으로 끌려 들어옵니다.','<b>부피와 경계:</b> 두 깊이 차에 파장별 Beer–Lambert 흡수와 수중 안개를 적용합니다. 굴절 샘플이 수면보다 앞이면 원래 UV로 되돌리고, 얕은 물가는 depth fade로 색·왜곡을 0까지 낮춥니다.','<b>표면 완성:</b> 위에서 보면 굴절이 우세하고 낮은 시선에서는 하늘 반사가 강해지도록 프레넬로 섞습니다. 물은 노멀 굴절의 표면과 깊이 흡수의 부피가 함께 작동합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#edf4fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function rock(px,py,rx,ry,off=0){x.fillStyle='#756f66';x.beginPath();x.ellipse(px+off,py,rx,ry,-.15,0,7);x.fill();x.strokeStyle='rgba(225,220,200,.22)';x.lineWidth=2;x.stroke()}
function buffers(w,h){const ix=w*.72,iy=h*.08,iw=w*.23,ih=h*.27;x.fillStyle='#071019';x.fillRect(ix,iy,iw,ih);x.strokeStyle='#62d7e7';x.strokeRect(ix,iy,iw,ih);x.fillStyle='#bd9370';x.fillRect(ix+8,iy+22,iw*.44,ih-30);const g=x.createLinearGradient(ix+iw*.54,0,ix+iw-8,0);g.addColorStop(0,'#eee');g.addColorStop(1,'#181818');x.fillStyle=g;x.fillRect(ix+iw*.54,iy+22,iw*.42,ih-30);tag('SCENE COLOR',ix+10,iy+16,'#ffd06b');tag('DEPTH',ix+iw*.58,iy+16,'#62d7e7')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,water=h*.43,bedNear=h*.66,bedFar=h*.91,bend=S.step>=2?S.wave*32:0;x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,water);sky.addColorStop(0,'#16334b');sky.addColorStop(1,'#a7c5ce');x.fillStyle=sky;x.fillRect(0,0,w,water);x.fillStyle='#7f776a';x.beginPath();x.moveTo(0,bedNear);x.lineTo(w,bedFar);x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fill();
// shoreline terrain above the water on the left
x.fillStyle='#605b50';x.beginPath();x.moveTo(0,water-h*.02);x.lineTo(w*.18,water+h*.09);x.lineTo(w*.31,bedNear+h*.02);x.lineTo(0,bedNear);x.closePath();x.fill();
// person above and below water, with separate refracted underwater segment
const lx=w*.40;x.strokeStyle='#edf4fa';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(lx-14,h*.17);x.lineTo(lx-10,water);x.moveTo(lx+16,h*.17);x.lineTo(lx+12,water);x.stroke();x.save();x.beginPath();x.rect(0,water,w,h-water);x.clip();x.strokeStyle='#d5d9d5';x.beginPath();x.moveTo(lx-10+bend,water);x.lineTo(lx-18+bend*.45,h*.74);x.moveTo(lx+12-bend*.3,water);x.lineTo(lx+22+bend*.30,h*.74);x.stroke();x.restore();
const offs=S.step>=2?bend*.45:0;rock(w*.18,bedNear+20,30,12,-offs*.2);rock(w*.53,h*.78,38,14,offs);rock(w*.78,h*.86,30,12,-offs*.7);
// water volume tint
let deepAlpha=S.step>=4?Math.min(.82,.18+S.depth*.17):.34;x.fillStyle=`rgba(15,104,137,${deepAlpha})`;x.fillRect(0,water,w,h-water);if(S.step>=4){const g=x.createLinearGradient(0,water,0,h);g.addColorStop(0,'rgba(87,190,198,.03)');g.addColorStop(1,`rgba(3,34,55,${Math.min(.82,S.depth*.16)})`);x.fillStyle=g;x.fillRect(0,water,w,h-water)}
if(S.step===0)tag('ALPHA BLUE · 깊이와 무관',w*.62,h*.60,'#ff7178');
if(S.step>=1)buffers(w,h);
if(S.step>=2){for(let i=0;i<12;i++){x.strokeStyle=`rgba(150,230,238,${.10+S.wave*.18})`;x.beginPath();const yy=water+10+i*16;x.moveTo(0,yy);for(let xx=0;xx<w;xx+=18)x.lineTo(xx,yy+Math.sin(xx*.032+i)*S.wave*5);x.stroke()}tag(`NORMAL → UV ${bend.toFixed(1)}px`,w*.08,h*.54,'#62d7e7')}
if(S.step===3&&!S.mask){x.fillStyle='rgba(255,113,120,.28)';x.beginPath();x.moveTo(lx-45,water);x.lineTo(lx+5,water);x.lineTo(lx+35,h*.66);x.lineTo(lx-22,h*.66);x.closePath();x.fill();tag('ABOVE-WATER PIXEL LEAK',w*.28,h*.60,'#ff7178');x.strokeStyle='#ff7178';x.lineWidth=3;x.beginPath();x.moveTo(w*.17,water);x.lineTo(w*.31,water);x.stroke();tag('HARD SHORE EDGE',w*.08,water-8,'#ff7178')}
if(S.step>=4){tag(`ΔDEPTH ${S.depth.toFixed(1)}m → EXP ABSORPTION`,w*.55,h*.73,'#62d7e7');if(S.mask){const fade=x.createLinearGradient(w*.10,0,w*.34,0);fade.addColorStop(0,'rgba(127,119,106,.75)');fade.addColorStop(1,'rgba(127,119,106,0)');x.fillStyle=fade;x.fillRect(w*.10,water,w*.24,h*.20);tag('DEPTH FADE · SHALLOW DISTORTION 0',w*.06,water+24,'#ffd06b')}}
if(S.step>=5&&S.fresnel){const rg=x.createLinearGradient(0,water,0,water+h*.18);rg.addColorStop(0,'rgba(190,220,235,.66)');rg.addColorStop(1,'rgba(190,220,235,0)');x.fillStyle=rg;x.fillRect(0,water,w,h*.18);tag('GRAZING VIEW · REFLECTION ↑',w*.60,water+25,'#ffd06b')}x.strokeStyle='rgba(190,237,243,.80)';x.lineWidth=2;x.beginPath();x.moveTo(0,water);for(let xx=0;xx<w;xx+=14)x.lineTo(xx,water+Math.sin(xx*.04)*S.wave*3);x.stroke()}
function transmission(){return S.step>=4?Math.round(100*Math.exp(-S.depth*.72)):72}
function metrics(){const bend=S.step>=2?S.wave*32:0,leak=S.step===3&&!S.mask?19:0,reflect=S.step>=5&&S.fresnel?68:0;$('mBend').textContent=bend.toFixed(1)+' px';$('mTransmit').textContent=transmission()+'%';$('mLeak').textContent=leak+'%';$('mReflect').textContent=reflect+'%'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['색 필터일 뿐','재활용 버퍼 준비','잠긴 다리·자갈 왜곡','얕고 깊음 동일·발 누출','깊이에 따라 청록→암부','표면과 부피 결합'][S.step];$('mask').setAttribute('aria-pressed',String(S.mask));$('fresnel').setAttribute('aria-pressed',String(S.fresnel));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===3)S.mask=false;if(S.step>=4)S.mask=true;S.fresnel=S.step===5;ui()});$('depth').oninput=e=>{S.depth=+e.target.value/10;$('depthOut').textContent=S.depth.toFixed(1)+' m';ui()};$('wave').oninput=e=>{S.wave=+e.target.value/100;$('waveOut').textContent=e.target.value+'%';ui()};$('mask').onclick=()=>{S.mask=!S.mask;ui()};$('fresnel').onclick=()=>{S.fresnel=!S.fresnel;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
