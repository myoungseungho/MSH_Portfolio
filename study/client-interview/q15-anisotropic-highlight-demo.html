<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q15 이방성 광택 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="표면 결 방향과 두 축 러프니스에 따라 둥근 하이라이트가 띠와 이중 헤어 광택으로 변하는 단계"></canvas><div class="hud"><span>Q15 · <b id="stage">등방 하이라이트</b></span><span id="status">둥근 점 광택</span></div></div>
<div class="steps" role="group" aria-label="이방성 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>등방</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>두 축 러프니스</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>UV 탄젠트</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>플로우맵</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>헤어 이중광</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>압축·AA·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="aniso">이방성 세기</label><output id="anisoOut">70%</output></div><input id="aniso" type="range" min="0" max="100" value="70"></div><div><div class="ct"><label for="angle">결 방향</label><output id="angleOut">25°</output></div><input id="angle" type="range" min="0" max="180" value="25"></div><div class="toggles" role="group" aria-label="표면 종류"><button data-mat="0" aria-pressed="true">▧ 브러시 금속</button><button data-mat="1" aria-pressed="false">≈ 비단</button><button data-mat="2" aria-pressed="false">≋ 머리카락</button></div></div>
<div class="metrics"><div class="m"><small>roughness T / B</small><strong id="mRough">0.30 / 0.30</strong></div><div class="m"><small>탄젠트 소스</small><strong id="mTangent">없음</strong></div><div class="m"><small>하이라이트 로브</small><strong id="mLobes">1</strong></div><div class="m"><small>원거리 지글거림</small><strong id="mShimmer">높음</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,aniso:.70,angle:25,mat:0,t:0},names=['등방 하이라이트','두 축 러프니스','UV 탄젠트','플로우맵 탄젠트','헤어 이중 하이라이트','압축·AA·LOD'];
const desc=['<b>문제 재현:</b> 러프니스 하나만 쓰는 표준 BRDF는 결 방향을 모릅니다. 금속·비단·머리카락 모두 둥근 점으로 반짝입니다.','<b>모양 분리:</b> 접선 T와 종법선 B의 러프니스를 다르게 해 한 축으로 넓고 다른 축으로 좁은 하이라이트 띠를 만듭니다.','<b>방향 부여:</b> 메시 UV 접선을 결 방향으로 사용합니다. 결 방향 슬라이더를 돌리면 광택 띠도 그 수직 방향으로 회전합니다.','<b>픽셀별 흐름:</b> 플로우맵이 위치마다 탄젠트를 회전시켜 브러시드 금속의 소용돌이나 비단 주름을 따라 광택이 휘어집니다.','<b>헤어 모델:</b> 머리카락은 흰 1차 로브와 색이 밴 2차 로브를 어긋나게 배치해 스트랜드 다발의 윤기를 만듭니다.','<b>최종:</b> 이방성 픽셀만 머티리얼 ID로 분기하고 탄젠트는 압축 저장합니다. 원거리는 스페큘러 AA로 러프니스를 올리고 등방 LOD로 전환해 지글거림을 막습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function ellipseGlow(cx,cy,rx,ry,a,col,alpha){x.save();x.translate(cx,cy);x.rotate(a);x.scale(rx,ry);const g=x.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,`rgba(${col},${alpha})`);g.addColorStop(.35,`rgba(${col},${alpha*.75})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(-1,-1,2,2);x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.5,cy=h*.47,r=Math.min(w*.25,h*.39),anis=S.step>=1?S.aniso:0,theta=S.angle*Math.PI/180,flow=S.step>=3,hair=S.step>=4,final=S.step>=5;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#172334');bg.addColorStop(1,'#090e17');x.fillStyle=bg;x.fillRect(0,0,w,h);
// material disk
const base=S.mat===0?['#756754','#2e3033']:S.mat===1?['#74475e','#2c1d31']:['#5b3c2c','#171318'],g=x.createRadialGradient(cx-r*.35,cy-r*.35,0,cx,cy,r*1.2);g.addColorStop(0,base[0]);g.addColorStop(1,base[1]);x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();
// visible fibers / grooves
for(let i=-20;i<=20;i++){x.strokeStyle=S.mat===1?'rgba(230,170,205,.15)':S.mat===2?'rgba(220,155,100,.20)':'rgba(225,220,205,.12)';x.lineWidth=S.mat===2?2:1;x.beginPath();if(flow){const yy=cy+i*r/20;x.moveTo(cx-r,yy);x.bezierCurveTo(cx-r*.3,yy+Math.sin(i*.7)*30,cx+r*.3,yy-Math.sin(i*.5)*35,cx+r,yy);x.stroke()}else{x.save();x.translate(cx,cy);x.rotate(theta);x.moveTo(-r,i*r/20);x.lineTo(r,i*r/20);x.stroke();x.restore()}}
if(!flow){const long=r*(.28+anis*1.25),short=r*(.28-anis*.18);ellipseGlow(cx-r*.18,cy-r*.18,anis?long:r*.35,anis?short:r*.35,theta+Math.PI/2,'255,247,226',.90)}else{for(let i=-4;i<=4;i++){const yy=cy+i*r*.12,ang=theta+Math.sin(i*.8)*.75;ellipseGlow(cx+i*r*.07,yy,r*(.75+anis*.35),r*.07,ang,'255,245,220',.34)}}
if(hair){ellipseGlow(cx+r*.10,cy+r*.03,r*(.72+anis*.30),r*.065,theta+Math.PI/2,'255,244,225',.70);ellipseGlow(cx-r*.08,cy-r*.08,r*(.65+anis*.25),r*.075,theta+Math.PI/2+.18,'255,132,72',.55)}
if(final){x.fillStyle='rgba(8,13,20,.38)';for(let i=0;i<9;i++)x.fillRect(cx-r+(i*2)*r/9,cy-r,(i%2?1:2),r*2)}
x.restore();x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
if(S.step===0){x.fillStyle='rgba(7,10,15,.84)';x.fillRect(w*.06,h*.10,w*.31,h*.11);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('결이 있어도 하이라이트는 원형',w*.08,h*.15);x.fillStyle='#96a2b2';x.font='10px system-ui';x.fillText('러프니스 한 값은 방향을 모름',w*.08,h*.185)}
if(S.step>=2){x.save();x.translate(w*.18,h*.72);x.rotate(theta);x.strokeStyle='#6ed7e5';x.lineWidth=2;x.beginPath();x.moveTo(-50,0);x.lineTo(50,0);x.stroke();x.beginPath();x.moveTo(40,-6);x.lineTo(50,0);x.lineTo(40,6);x.stroke();x.restore();x.fillStyle='#6ed7e5';x.font='600 10px ui-monospace,monospace';x.fillText(flow?'FLOW MAP TANGENT':'UV TANGENT',w*.12,h*.81)}
if(final){x.fillStyle='rgba(7,10,15,.80)';x.fillRect(w*.68,h*.72,w*.27,h*.12);x.fillStyle='#6ed7e5';x.font='600 10px ui-monospace,monospace';x.fillText('MATERIAL ID → ANISO ONLY',w*.70,h*.77);x.fillText('DISTANCE → ROUGHNESS ↑',w*.70,h*.81)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-mat]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.mat===S.mat)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];const t=S.step>=1?(.30+S.aniso*.52).toFixed(2):'0.30',bb=S.step>=1?Math.max(.05,.30-S.aniso*.25).toFixed(2):'0.30';$('mRough').textContent=t+' / '+bb;$('mTangent').textContent=['없음','축 미정','UV','플로우맵','플로우맵','옥타 압축'][S.step];$('mLobes').textContent=S.step>=4?'2':'1';$('mShimmer').textContent=S.step>=5?'낮음 (AA·LOD)':'높음';$('status').textContent=['둥근 점 광택','길쭉한 띠 생성','결 방향으로 회전','위치마다 띠가 휨','흰·색조 이중 로브','소수 픽셀만 이방성'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>{S.mat=+b.dataset.mat;if(S.mat===2&&S.step<4)S.step=4;ui()});$('aniso').oninput=e=>{S.aniso=+e.target.value/100;$('anisoOut').textContent=e.target.value+'%';ui()};$('angle').oninput=e=>{S.angle=+e.target.value;$('angleOut').textContent=e.target.value+'°';ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
