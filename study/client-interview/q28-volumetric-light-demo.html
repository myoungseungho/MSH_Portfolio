<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q28 볼류메트릭 라이트 단계형 실험실</title>
<style>
:root{--bg:#07110e;--panel:#10201b;--line:#29483d;--ink:#f1fff9;--muted:#94b3a7;--green:#5dd6a6;--sun:#ffe39a;--red:#ff7c78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#07150f}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07110edd}.hud b{color:var(--green)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#4f7969}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#06140f}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--green);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--green)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#719387;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="화면 방사형 블러에서 섀도우 레이마칭, 지터·템포럴, froxel과 HG 위상함수까지 쌓는 숲속 빛줄기"></canvas><div class="hud"><span>Q28 · <b id="stage">화면 방사형 블러</b></span><span id="status">화면 밖 태양에서 소멸</span></div></div>
<div class="steps" role="group" aria-label="볼류메트릭 라이트 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>화면 블러</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>시선 레이마칭</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>저스텝 밴딩</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>블루노이즈 지터</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>템포럴 누적</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>froxel·HG</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="fog">안개 밀도</label><output id="fogOut">58%</output></div><input id="fog" type="range" min="0" max="100" value="58"></div><div><div class="ct"><label for="view">태양 시선각</label><output id="viewOut">20°</output></div><input id="view" type="range" min="-80" max="80" value="20"></div><div class="toggles" role="group" aria-label="지터와 히스토리 옵션"><button id="jitter" aria-pressed="false">블루노이즈 지터</button><button id="history" aria-pressed="false">템포럴 히스토리</button></div></div>
<div class="metrics"><div class="m"><small>화면 밖 태양</small><strong id="mOff">실패</strong></div><div class="m"><small>밴딩 오차</small><strong id="mBand">42%</strong></div><div class="m"><small>픽셀당 광원 조회</small><strong id="mCost">1</strong></div><div class="m"><small>회전 고스팅</small><strong id="mGhost">0%</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,fog:.58,view:20,jitter:false,history:false},names=['screen-space radial blur','view ray + shadow test','8-step raymarch','blue-noise jitter','temporal accumulation','froxel volume + HG phase'],desc=['<b>문제 재현:</b> 화면의 태양 픽셀을 방사형으로 번지게 하면 싸지만, 태양이 화면 밖이거나 옆에서 비추면 빛줄기가 사라지고 안개 밀도와도 무관합니다.','<b>공간에서 적분:</b> 시선 광선을 따라 걸으며 각 지점의 안개 밀도와 섀도우맵 가시성을 곱해 밝은 구간만 누적합니다. 나무 뒤는 저절로 그늘 기둥이 됩니다.','<b>비용을 줄인 실패:</b> 샘플을 8개로 줄이면 빛기둥이 층층이 끊기는 밴딩이 드러납니다. 각 띠는 고정된 레이마치 샘플 간격입니다.','<b>샘플 위치를 흩뜨림:</b> 블루노이즈로 픽셀마다 시작점을 바꾸면 규칙적 띠가 미세 노이즈로 바뀝니다. 한 프레임만 보면 거칠지만 구조적 밴딩은 사라집니다.','<b>프레임에 걸쳐 수렴:</b> 지터 패턴을 바꾸며 히스토리를 누적해 적은 샘플을 매끈하게 만듭니다. 급회전 때는 히스토리 가중치를 낮춰 잔상을 버리고 노이즈를 택합니다.','<b>재사용 가능한 볼륨:</b> 반해상도 froxel에 산란을 한 번 누적하고 픽셀은 깊이로 샘플합니다. HG 위상함수는 해를 마주볼수록 빛줄기를 강하게 만듭니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,col='#f1fff9'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(3,12,8,.85)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=col;x.fillText(t,px,py)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,spatial=S.step>=1,band=S.step===2,jit=S.jitter&&S.step>=3,hist=S.history&&S.step>=4,hg=S.step>=5,phase=hg*Math.max(.15,1-Math.abs(S.view)/95),alpha=S.fog*(.12+.38*phase);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#547b78');sky.addColorStop(1,'#132d20');x.fillStyle=sky;x.fillRect(0,0,w,h);const sx=w*(.48+S.view/170),sy=-25;x.fillStyle='rgba(255,240,174,.75)';x.beginPath();x.arc(sx,12,22,0,7);x.fill();if(spatial||Math.abs(S.view)<58){x.save();for(let i=0;i<7;i++){const gap=i===2||i===5;x.beginPath();x.moveTo(sx+(i-3)*24,0);x.lineTo(w*(.13+i*.14),h);x.lineTo(w*(.23+i*.14),h);x.closePath();if(gap)x.fillStyle='rgba(2,12,7,.35)';else{x.fillStyle=`rgba(255,231,151,${alpha*(band?(i%2?.45:1):1)})`}x.fill()}if(band){for(let y=70;y<h;y+=42){x.fillStyle='rgba(5,18,12,.22)';x.fillRect(0,y,w,14)}}if(jit&&!hist){for(let i=0;i<350;i++){x.fillStyle=`rgba(255,244,190,${(i%7)/90})`;x.fillRect((i*83)%w,(i*47)%h,2,2)}}x.restore()}for(let i=0;i<11;i++){let px=(i*137)%w,th=70+(i%5)*22;x.fillStyle='#10281a';x.fillRect(px,h-th,18,th);x.fillStyle='#173b25';x.beginPath();x.arc(px+9,h-th,38+(i%3)*12,0,7);x.fill()}if(S.step===0)tag(Math.abs(S.view)>58?'SUN OFFSCREEN → NO SHAFT':'RADIAL BLUR OF BRIGHT PIXELS',w*.05,h*.88,'#ff7c78');if(S.step>=1)tag('VIEW RAY × FOG × SHADOW MAP',w*.05,h*.86,'#5dd6a6');if(band)tag('8 FIXED SAMPLES → BANDS',w*.60,h*.77,'#ff7c78');if(jit)tag(hist?'JITTER + HISTORY → CONVERGED':'BANDS → BLUE-NOISE',w*.55,h*.77,hist?'#5dd6a6':'#ffe39a');if(hg)tag('HG FORWARD SCATTER '+Math.round(phase*100)+'%',w*.55,h*.18,'#ffe39a')}
function metrics(){const spatial=S.step>=1,band=S.step===2,jit=S.jitter&&S.step>=3,hist=S.history&&S.step>=4,bandErr=band?42:jit?(hist?4:14):S.step>=1?9:42,ghost=hist?Math.round(Math.abs(S.view)/4):0;$('mOff').textContent=spatial?'지원':'실패';$('mBand').textContent=bandErr+'%';$('mCost').textContent=S.step>=5?'froxel 1회':S.step>=1?(S.step===2?'8':'32'):'1';$('mGhost').textContent=ghost+'%'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['화면 밖 태양에서 소멸','공간 그늘 기둥','규칙적 띠 노출','띠가 노이즈로','프레임 누적 수렴','저비용·방향성'][S.step];$('explain').innerHTML=desc[S.step];$('jitter').setAttribute('aria-pressed',String(S.jitter));$('history').setAttribute('aria-pressed',String(S.history));metrics();draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.jitter=S.step>=3;S.history=S.step>=4;ui()});$('fog').oninput=e=>{S.fog=+e.target.value/100;$('fogOut').textContent=e.target.value+'%';ui()};$('view').oninput=e=>{S.view=+e.target.value;$('viewOut').textContent=e.target.value+'°';ui()};$('jitter').onclick=()=>{S.jitter=!S.jitter;ui()};$('history').onclick=()=>{S.history=!S.history;ui()};ui();addEventListener('resize',draw)})();
</script></body></html>
