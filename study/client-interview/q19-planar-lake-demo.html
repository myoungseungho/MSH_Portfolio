<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q19 평면 호수 반사 단계형 실험실</title>
<style>
:root{--bg:#080c12;--panel:#111925;--line:#2a394b;--ink:#eef3fa;--muted:#93a4b8;--sun:#ffb766;--cyan:#65d9e9;--red:#ff737a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#070a10}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--sun)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#181006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--sun)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6d8097;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="SSR이 놓치는 하늘과 산을 수면 대칭 카메라로 담고 클립 평면, 경량 반사 패스, 노멀 왜곡과 물별 예산을 적용하는 단계"></canvas><div class="hud"><span>Q19 · <b id="stage">SSR로 호수 비추기</b></span><span id="status">하늘·산 데이터 없음</span></div></div>
<div class="steps" role="group" aria-label="호수 평면 반사 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>SSR 실패</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>거울 카메라</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>반사 텍스처</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>수중 누출</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>클립·경량화</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>물결·예산 계층</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="wind">바람·노멀 왜곡</label><output id="windOut">18%</output></div><input id="wind" type="range" min="0" max="100" value="18"></div><div><div class="ct"><label for="waters">보이는 수면 평면</label><output id="watersOut">1개</output></div><input id="waters" type="range" min="1" max="5" value="1" step="1"></div><div class="toggles" role="group" aria-label="평면 반사 정리와 예산 옵션"><button id="clip" aria-pressed="false">수면 클립</button><button id="budget" aria-pressed="false">주력만 planar</button></div></div>
<div class="metrics"><div class="m"><small>화면 밖 반사 커버</small><strong id="mCover">38%</strong></div><div class="m"><small>추가 씬 패스</small><strong id="mPass">0</strong></div><div class="m"><small>수중 지오 누출</small><strong id="mLeak">—</strong></div><div class="m"><small>반사 GPU 추정</small><strong id="mGpu">0.8 ms</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,wind:.18,waters:1,clip:false,budget:false},names=['SSR로 호수 비추기','수면 대칭 카메라','planar 반사 텍스처','수면 아래까지 렌더','oblique clip + 반해상도','노멀 왜곡 + 반사 등급'];
const desc=['<b>문제 재현:</b> SSR은 현재 화면에 있는 색만 되짚습니다. 호수가 비춰야 할 머리 위 하늘과 화면 밖 산이 없어서 거울상의 대부분이 검은 공백으로 끊깁니다.','<b>평면 제약 활용:</b> 실제 카메라의 위치와 시선 벡터를 평균 수면에 대해 대칭시킵니다. 평면 하나라서 이 카메라 한 대가 모든 픽셀의 정확한 거울 시야를 만듭니다.','<b>화면 밖까지 한 번에:</b> 대칭 카메라로 씬을 반사 텍스처에 한 번 더 그려 수면에 투영합니다. 하늘·산·구름까지 또렷하지만 추가 씬 패스 한 번을 지불합니다.','<b>새 실패:</b> 반사 카메라가 수면 아래 호수 바닥과 물고기까지 함께 그립니다. 거울상 위에 수중 물체가 거꾸로 떠오르는 누출을 직접 확인하세요.','<b>정리와 비용 회수:</b> oblique near-plane으로 수면 아래를 잘라내고, 반사 패스는 반해상도·강한 LOD·소품/그림자/후처리 제외로 가볍게 만듭니다.','<b>최종 분업:</b> 지오는 평균 평면으로 두되 스크롤 노멀만 UV를 흔들어 잔물결을 만듭니다. 중요한 큰 물만 planar, 나머지는 프로브·SSR로 내려 평면 수만큼 늘어나는 비용을 막습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#eef3fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,8,14,.85)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function mountain(w,h,y,flip=false,distort=0){x.save();x.translate(0,y);if(flip)x.scale(1,-1);x.beginPath();x.moveTo(0,0);const pts=[[.08,-.15],[.18,-.05],[.31,-.28],[.44,-.08],[.56,-.36],[.66,-.13],[.78,-.27],[.91,-.09],[1,0]];for(let i=0;i<pts.length;i++){const px=w*pts[i][0]+(flip?Math.sin(i*2.4)*distort:0),py=h*pts[i][1];x.lineTo(px,py)}x.lineTo(w,0);x.closePath();x.fillStyle=flip?'rgba(46,63,72,.72)':'#263b43';x.fill();x.restore()}
function clouds(w,h,y,flip=false,distort=0){x.save();x.translate(0,y);if(flip)x.scale(1,-1);x.fillStyle=flip?'rgba(255,170,135,.20)':'rgba(255,190,150,.58)';for(let i=0;i<6;i++){x.beginPath();x.ellipse(w*(.12+i*.16)+(flip?Math.sin(i*1.7)*distort:0),-h*(.08+(i%2)*.035),w*.055,h*.025,0,0,7);x.fill()}x.restore()}
function cameraDiagram(w,h){const px=w*.08,water=h*.50;x.strokeStyle='#65d9e9';x.lineWidth=2;x.beginPath();x.moveTo(px,water-60);x.lineTo(px,water+60);x.stroke();x.fillStyle='#eef3fa';x.beginPath();x.arc(px,water-60,7,0,7);x.fill();x.fillStyle='#ffb766';x.beginPath();x.arc(px,water+60,7,0,7);x.fill();x.setLineDash([4,4]);x.strokeStyle='#ffb766';x.beginPath();x.moveTo(px,water+60);x.lineTo(px+w*.18,water);x.stroke();x.setLineDash([]);tag('MAIN CAMERA',px+14,water-57,'#eef3fa');tag('MIRROR CAMERA',px+14,water+64,'#ffb766')}
function fish(w,h,water,reflected=false){x.save();x.translate(w*.58,water+(reflected?-36:58));if(reflected)x.scale(1,-1);x.fillStyle='#ff737a';x.beginPath();x.ellipse(0,0,22,8,0,0,7);x.fill();x.beginPath();x.moveTo(18,0);x.lineTo(35,-10);x.lineTo(35,10);x.closePath();x.fill();x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,water=h*.50,dist=S.step>=5?S.wind*25:0;x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,water);sky.addColorStop(0,'#25264c');sky.addColorStop(.72,'#dc765c');sky.addColorStop(1,'#ffb069');x.fillStyle=sky;x.fillRect(0,0,w,water);clouds(w,h,water,false,0);mountain(w,h,water,false,0);x.fillStyle='#0a2634';x.fillRect(0,water,w,h-water);
if(S.step===0){x.fillStyle='#06121a';for(let i=0;i<9;i++)x.fillRect(w*(.03+i*.115),water+h*.04,w*.075,h*.22);tag('SSR MISS · SKY OFF-SCREEN',w*.34,h*.72,'#ff737a');x.strokeStyle='#ff737a';x.setLineDash([5,4]);x.strokeRect(w*.04,water+h*.03,w*.92,h*.29);x.setLineDash([])}
if(S.step===1)cameraDiagram(w,h);
if(S.step>=2){x.save();x.beginPath();x.rect(0,water,w,h-water);x.clip();const rg=x.createLinearGradient(0,water,0,h);rg.addColorStop(0,'rgba(250,151,104,.48)');rg.addColorStop(1,'rgba(28,52,70,.24)');x.fillStyle=rg;x.fillRect(0,water,w,h-water);clouds(w,h,water,true,dist);mountain(w,h,water,true,dist);for(let i=0;i<12;i++){x.strokeStyle=`rgba(150,210,220,${.05+S.wind*.12})`;x.beginPath();const yy=water+18+i*(h-water)/13;x.moveTo(0,yy);for(let xx=0;xx<w;xx+=20)x.lineTo(xx,yy+Math.sin(xx*.035+i)*S.wind*5);x.stroke()}x.restore();tag('PLANAR REFLECTION TEXTURE',w*.68,h*.86,'#65d9e9')}
fish(w,h,water,false);if(S.step===3&&!S.clip){fish(w,h,water,true);x.fillStyle='rgba(255,115,122,.13)';x.fillRect(0,water,w,h-water);tag('UNDERWATER GEOMETRY LEAK',w*.48,h*.60,'#ff737a')}
if(S.step>=4){x.strokeStyle=S.clip?'#65d9e9':'#ff737a';x.lineWidth=2;x.setLineDash([5,4]);x.beginPath();x.moveTo(0,water);x.lineTo(w,water);x.stroke();x.setLineDash([]);tag(S.clip?'OBLIQUE CLIP · BELOW REJECT':'CLIP PLANE OFF',w*.05,water-10,S.clip?'#65d9e9':'#ff737a');tag('½ RES · SHADOW OFF · REFLECTION LOD',w*.62,h*.18,'#ffb766')}
if(S.step>=5){tag(`NORMAL UV OFFSET · WIND ${Math.round(S.wind*100)}%`,w*.05,h*.90,'#65d9e9');const active=S.budget?1:S.waters;for(let i=0;i<S.waters;i++){x.fillStyle=i<active?'#ffb766':'#506579';x.fillRect(w*.70+i*24,h*.30,18,7)}tag(S.budget?'1 PLANAR + PROBE/SSR FALLBACK':S.waters+' PLANAR PASSES',w*.67,h*.27,S.budget?'#65d9e9':'#ff737a')}}
function metrics(){const planar=S.step>=2?(S.budget?1:S.waters):0;$('mCover').textContent=S.step<2?'38%':'100%';$('mPass').textContent=String(planar);$('mLeak').textContent=S.step<3?'—':S.step>=4&&S.clip?'0%':S.step===3?'17%':'17%';const per=S.step>=4?.72:1.85;$('mGpu').textContent=(S.step===0?.8:planar*per).toFixed(1)+' ms'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['하늘·산 데이터 없음','카메라를 수면 대칭','화면 밖까지 100%','물고기·바닥 반사됨','아래 제거·패스 축소','주력 수면에만 예산'][S.step];$('clip').setAttribute('aria-pressed',String(S.clip));$('budget').setAttribute('aria-pressed',String(S.budget));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===3)S.clip=false;if(S.step>=4)S.clip=true;if(S.step===5)S.budget=true;ui()});$('wind').oninput=e=>{S.wind=+e.target.value/100;$('windOut').textContent=e.target.value+'%';ui()};$('waters').oninput=e=>{S.waters=+e.target.value;$('watersOut').textContent=e.target.value+'개';ui()};$('clip').onclick=()=>{S.clip=!S.clip;ui()};$('budget').onclick=()=>{S.budget=!S.budget;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
