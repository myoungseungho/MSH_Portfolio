<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동적 시간대 데모</title><style>
:root{--bg:#0a0c11;--p:#12161f;--l:#2a3444;--i:#edf1f8;--m:#93a0b4;--a:#ffb448;--s:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;--o:ui-monospace,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--i);font-family:var(--s);overflow:hidden}#root{padding:14px}.vp{position:relative;aspect-ratio:16/9;border:1px solid var(--l);border-radius:12px;overflow:hidden}.vp canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font:11px var(--o)}.hud span{background:#07101acc;border:1px solid #ffffff25;border-radius:99px;padding:4px 9px}.hud b,.hot{color:#ffd187}.bar{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px}.grp{display:flex;flex-direction:column;gap:6px}.l,.k{font:10px var(--o);letter-spacing:.1em;color:#68758a}.seg{display:flex;flex-wrap:wrap;gap:5px}button{padding:8px 11px;border:1px solid var(--l);border-radius:8px;background:var(--p);color:var(--m);font:600 12px var(--s);cursor:pointer}button[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#191107}.legend{margin:13px 0;border-left:2px solid #315a65;padding-left:11px;color:var(--m);font-size:12.5px;line-height:1.6}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:10px;overflow:hidden}.m{background:var(--p);padding:8px 10px}.v{font:600 15px var(--o);margin-top:2px}.slider{margin-top:13px;font-size:11px;color:var(--m)}.slider label{display:flex;justify-content:space-between}.slider output{font-family:var(--o);color:var(--i)}input{width:100%;accent-color:var(--a)}.foot{margin-top:12px;color:#68758a;font:10px var(--o)}@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"><div class="vp"><canvas id="c"></canvas><div class="hud"><span>🌇 <b id="stage">스카이박스 교체</b></span><span id="status">12:00 · 낮</span></div></div><div class="bar"><div class="grp"><span class="l">구현 단계</span><div class="seg" role="group" aria-label="구현 단계"><button data-s="0" aria-pressed="true">0 · 스카이박스</button><button data-s="1">1 · 태양 벡터</button><button data-s="2">2 · 대기·색온도</button><button data-s="3">3 · CSM</button></div></div><div class="grp"><span class="l">프리셋</span><div class="seg" role="group" aria-label="시간대 프리셋"><button data-t="12" aria-pressed="true">☀️ 한낮</button><button data-t="18">🌇 노을</button><button data-t="20">🌙 어스름</button></div></div></div><p class="legend" id="legend"></p><div class="metrics"><div class="m"><div class="k">태양 고도</div><div class="v" id="alt"></div></div><div class="m"><div class="k">광원 색온도</div><div class="v hot" id="temp"></div></div><div class="m"><div class="k">그림자 길이</div><div class="v" id="shadow"></div></div><div class="m"><div class="k">캐스케이드</div><div class="v" id="csm"></div></div></div><div class="slider"><label>게임 시간 <output id="clock"></output></label><input id="time" type="range" min="6" max="21" step="0.1" value="12"></div><div class="foot">시간을 움직여 보세요. 0단계는 하늘만 바뀌고, 1단계부터 태양 방향이 그림자를 구동합니다. 2·3단계는 대기·색온도·CSM까지 같은 시간 값에 묶입니다.</div></div><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),$=i=>document.getElementById(i),S={s:0,t:12};const L=['<b>0 · 스카이박스 교체.</b> 시간에 따라 하늘만 바뀝니다. 노을이어도 인물 그림자는 한낮 방향·길이에 고정되어 있어 시스템이 따로 놉니다.','<b>1 · 태양 벡터.</b> 단일 시간 값에서 태양 방향을 계산합니다. 태양 위치와 그림자 방향·길이는 함께 움직이지만, 하늘·안개·월드 조명은 아직 따로입니다.','<b>2 · 대기 산란과 색온도.</b> 태양 고도가 낮아질수록 하늘·먼 산·캐릭터가 함께 주황빛으로 물듭니다. 하늘만 칠한 것이 아니라 한 원인이 세계 전체를 구동합니다.','<b>3 · CSM 그림자.</b> 저각 태양의 긴 그림자에 가까운 캐스케이드를 더 배분합니다. 발밑은 선명하게, 먼 그림자는 부드럽게 유지합니다.'];const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,rgb=(a,b,t)=>`rgb(${mix(a[0],b[0],t)|0},${mix(a[1],b[1],t)|0},${mix(a[2],b[2],t)|0})`;function rs(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}function draw(){rs();const w=c.clientWidth,h=c.clientHeight,dyn=S.s>0,world=S.s>1,sunset=1-Math.min(1,Math.abs(S.t-18)/4),night=cl((S.t-18)/3,0,1),e=dyn?cl(65-(S.t-12)*10.83,-12,65):65,sy=dyn?h*.62-(e/65)*h*.46:h*.18,sx=dyn?w*.5+(S.t-12)*w*.032:w*.72;let g=x.createLinearGradient(0,0,0,h*.64);g.addColorStop(0,world?rgb([36,112,190],[29,24,73],cl((S.t-14)/6,0,1)):'#2c6fb1');g.addColorStop(1,world?rgb([174,211,224],[216,79,92],sunset*.72+night*.25):'#9fc9dc');x.fillStyle=g;x.fillRect(0,0,w,h);if(world){x.fillStyle=`rgba(255,122,82,${sunset*.25})`;x.fillRect(0,h*.43,w,h*.21)}x.fillStyle=world?rgb([65,105,79],[44,41,65],night):'#46634d';x.fillRect(0,h*.62,w,h*.38);let gl=x.createRadialGradient(sx,sy,0,sx,sy,48);gl.addColorStop(0,'#fffce0');gl.addColorStop(.25,world?'#ffc06b':'#fff5bd');gl.addColorStop(1,'rgba(255,170,55,0)');x.fillStyle=gl;x.fillRect(sx-48,sy-48,96,96);x.fillStyle='#fff7cf';x.beginPath();x.arc(sx,sy,10,0,7);x.fill();const bx=w*.5,by=h*.66,len=dyn?cl(260/(Math.max(7,e+10)),5,30)*11:75,dir=dyn?(sx<bx?-1:1):1;x.save();x.globalAlpha=.38;x.fillStyle='#11231d';if(S.s===3)x.filter='blur(2px)';x.beginPath();x.ellipse(bx+dir*len*.5,by+24,len,9,0,0,7);x.fill();x.restore();x.fillStyle=world?rgb([224,188,142],[246,131,92],sunset*.8):'#dde0e4';x.fillRect(bx-10,by-44,20,44);x.beginPath();x.arc(bx,by-56,12,0,7);x.fill();if(S.s===0){x.fillStyle='rgba(8,17,28,.72)';x.fillRect(12,46,165,46);x.fillStyle='#f5c567';x.font='10px monospace';x.fillText('SKYBOX CROSSFADE',22,64);x.fillStyle='#e8eef6';x.font='13px monospace';x.fillText('SHADOW: FIXED',22,84)}if(S.s===3){x.strokeStyle='rgba(255,214,130,.32)';x.setLineDash([4,4]);for(let i=1;i<4;i++){x.beginPath();x.moveTo(w*i/4,0);x.lineTo(w*i/4,h*.62);x.stroke()}x.setLineDash([])}const hh=Math.floor(S.t).toString().padStart(2,'0'),mm=Math.round(S.t%1*60).toString().padStart(2,'0');$('alt').textContent=Math.round(e)+'°';$('temp').textContent=(world?Math.round(mix(6500,2800,sunset*.9+night*.7)):6500)+'K';$('shadow').textContent=(len/35).toFixed(1)+'m';$('csm').textContent=S.s===3?'4 분할':'—';$('clock').textContent=hh+':'+mm;$('status').textContent=hh+':'+mm+' · '+(S.t<17?'낮':S.t<19?'노을':'어스름')}function stage(n){S.s=n;document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===n));$('stage').textContent=['스카이박스 교체','태양 벡터','대기·색온도','CSM 그림자'][n];$('legend').innerHTML=L[n];draw();ph()}function time(v){S.t=+v;$('time').value=S.t;document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',Math.abs(+b.dataset.t-S.t)<.05));draw()}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>stage(+b.dataset.s));document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>time(b.dataset.t));$('time').oninput=e=>time(e.target.value);function ph(){try{parent.postMessage({type:'tod-h',h:Math.ceil($('root').getBoundingClientRect().height)+4},'*')}catch(e){}}addEventListener('resize',()=>{draw();ph()});stage(0);time(12);ph()})();
</script><script>
/* Make the intentionally naive skybox stage visibly crossfade while keeping its shadow fixed. */
(()=>{const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');function tint(){const active=document.querySelector('[data-s][aria-pressed="true"]');if(!active||active.dataset.s!=='0')return;const t=+document.querySelector('#time').value;const a=Math.max(0,Math.min(.42,(t-14)/7));ctx.save();ctx.fillStyle=`rgba(170,40,72,${a})`;ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight*.62);ctx.restore()}document.querySelectorAll('[data-t],#time,[data-s]').forEach(e=>e.addEventListener('click',()=>requestAnimationFrame(tint)));document.querySelector('#time').addEventListener('input',()=>requestAnimationFrame(tint));})();
</script></body></html>
