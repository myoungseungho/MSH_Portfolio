<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q84 심리스 지형 스트리밍 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="거대 단일 지형 메시에서 하이트맵, 쿼드트리 LOD, 경계 크랙, 스티칭·지오모핑과 버추얼 텍스처 페이지 스트리밍으로 발전하는 실험"></canvas><div class="hud"><span>Q84 · <b id="stage">8km 지형을 한 장의 초고밀도 메시로</b></span><span id="status">가까운 땅과 지평선에 같은 밀도를 써 수천만 버텍스</span></div></div>
<div class="steps" role="group" aria-label="광대 지형 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>거대 단일 메시</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>하이트맵 압축</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>쿼드트리 LOD</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>경계 크랙·팝</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스티칭·지오모핑</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>버추얼 텍스처</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">카메라 이동 거리</label><output id="distanceOut">35%</output></div><input id="distance" type="range" min="5" max="100" value="35"></div><div><div class="ct"><label for="bias">LOD 품질 바이어스</label><output id="biasOut">55%</output></div><input id="bias" type="range" min="10" max="100" value="55"></div><div class="toggles"><button id="stitch" aria-pressed="false">경계 스티칭</button><button id="vt" aria-pressed="false">VT 페이지 캐시</button></div></div>
<div class="metrics"><div class="m"><small>가시 삼각형</small><strong id="mTris">64.0M</strong></div><div class="m"><small>LOD 경계 크랙</small><strong id="mCracks">0개</strong></div><div class="m"><small>능선 최대 팝</small><strong id="mPop">0.0 m</strong></div><div class="m"><small>VT 상주 / 전체 페이지</small><strong id="mPages">—</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,target:.35,current:.35,bias:.55,stitch:false,vt:false,t:0,lastLods:[0,0,0,0],pop:0};
const names=['8km 지형을 한 장의 초고밀도 메시로','규칙 격자가 하이트맵 텍스처에서 높이 샘플','카메라 거리별 쿼드트리 타일 밀도 배분','이웃 LOD 불일치로 T-정션·능선 팝 발생','스커트·경계 스티칭 + 두 LOD 높이 지오모핑','가시 표면 페이지만 피드백·로드·RVT 캐시'];
const status=['가까운 땅과 지평선에 같은 밀도를 써 수천만 버텍스','좌표 대신 높이 한 채널로 지오메트리 압축','화면 크기에 비례해 가까운 타일만 촘촘','검은 틈과 카메라 이동 순간 실루엣 점프','경계가 닫히고 능선이 전환 구간에서 미끄러짐','이론상 거대 텍스처 중 지금 보이는 페이지만 메모리 상주'];
const desc=['<b>균일 밀도의 낭비:</b> 8km 전체를 1m 격자로 한 번에 올립니다. 거리 슬라이더를 움직여도 지평선까지 같은 선 수라 가시 삼각형과 메모리가 줄지 않습니다.','<b>높이 함수로 압축:</b> 규칙적인 x·z 격자는 공유하고 y만 하이트맵에서 샘플합니다. 회색 높이 필드와 실제 능선이 같은 함수에서 만들어지는 것을 확인하세요.','<b>거리별 공간 예산:</b> 네 타일이 카메라와의 거리에 따라 LOD0~3을 고릅니다. 가까운 타일은 촘촘하고 먼 타일은 성겨져 카메라를 이동해도 총 삼각형 예산이 제한됩니다.','<b>두 가지 이음매:</b> 이웃 타일의 버텍스 간격이 다르면 경계에 검은 크랙이 생기고, 임계 거리를 넘는 순간 능선 높이가 한 프레임에 크게 바뀝니다.','<b>심리스 전환:</b> 스티칭은 높은 쪽 경계를 낮은 LOD 버텍스에 맞춰 꿰매고, 지오모핑은 목표 거리에 천천히 수렴해 능선 팝을 연속 이동으로 바꿉니다.','<b>표면도 필요한 만큼:</b> VT는 카메라 주변 고해상도 페이지와 원경 저해상도 밉만 상주시킵니다. 캐시 버튼을 끄면 전체 페이지 메모리를 가정한 값으로 되돌아갑니다.'];
function height(u,lod=0){const detail=Math.pow(.55,lod);return .25+Math.sin(u*7.2)*.09+Math.sin(u*18.5)*.035*detail+Math.max(0,Math.sin((u-.58)*12))*.14*detail}
function lods(){if(S.step<2)return[0,0,0,0];return[0,1,2,3].map(i=>Math.max(0,Math.min(3,Math.floor((i+S.current*2.5)*(1.25-S.bias)))))}
function values(){const ls=lods(),seg=ls.map(l=>32>>l),tris=S.step===0?64000000:seg.reduce((n,s)=>n+s*s*2,0)*256,cracks=S.step===3&&!S.stitch?ls.slice(1).filter((l,i)=>l!==ls[i]).length:0,pages=S.vt&&S.step>=5?Math.round(64+S.bias*92+S.current*34):4096;return{ls,seg,tris,cracks,pages}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function drawTile(i,lod,w,h,crack){const x0=w*.06+i*w*.22,tw=w*.22,base=h*.72,amp=h*.53,seg=S.step===0?32:32>>lod;x.fillStyle=['#29485d','#315567','#3a6170','#466f79'][lod];x.beginPath();x.moveTo(x0,base);for(let j=0;j<=seg;j++){const u=(i+j/seg)/4,y=base-height(u,lod)*amp;x.lineTo(x0+j/seg*tw,y)}x.lineTo(x0+tw,base);x.closePath();x.fill();x.strokeStyle='#70ceff';x.lineWidth=1;x.stroke();for(let j=0;j<=seg;j++){const u=(i+j/seg)/4,y=base-height(u,lod)*amp;x.strokeStyle='rgba(185,220,231,.22)';x.beginPath();x.moveTo(x0+j/seg*tw,base);x.lineTo(x0+j/seg*tw,y);x.stroke()}if(crack){x.fillStyle='#05090e';x.fillRect(x0-4,base-h*.34,8,h*.36);x.fillStyle='#ff7f78';x.font='600 9px ui-monospace,Consolas,monospace';x.fillText('T-JUNCTION',x0-34,base-h*.37)}x.fillStyle='#f5f8fc';x.font='600 9px ui-monospace,Consolas,monospace';x.fillText(`LOD${lod} · ${seg}×${seg}`,x0+8,base+17)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values();x.fillStyle='#0c1722';x.fillRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#15283b');sky.addColorStop(1,'#0a121b');x.fillStyle=sky;x.fillRect(0,0,w,h);for(let i=0;i<4;i++)drawTile(i,v.ls[i],w,h,S.step===3&&!S.stitch&&i>0&&v.ls[i]!==v.ls[i-1]);if(S.step===1){for(let i=0;i<48;i++){const q=height(i/48,0);x.fillStyle=`rgb(${Math.round(q*255)},${Math.round(q*255)},${Math.round(q*255)})`;x.fillRect(w*.06+i*w*.88/48,h*.79,w*.88/48,h*.08)}}if(S.step>=2){x.fillStyle='#ffd06e';x.beginPath();x.moveTo(w*(.12+S.current*.72),h*.76);x.lineTo(w*(.12+S.current*.72)-8,h*.79);x.lineTo(w*(.12+S.current*.72)+8,h*.79);x.fill()}if(S.step>=4){x.fillStyle='#8ce3ae';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`GEOMORPH ${(S.current*100).toFixed(1)}% → TARGET ${(S.target*100).toFixed(0)}%`,w*.38,h*.14)}if(S.step>=5){const cols=18,rows=3;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const hot=Math.abs(i/cols-S.current)<.18; x.fillStyle=hot&&S.vt?'#70ceff':S.vt?'#263b4b':'#ff7f78';x.fillRect(w*.22+i*18,h*.84+j*14,15,10)}x.fillStyle='#f5f8fc';x.fillText(S.vt?'FEEDBACK → RESIDENT HIGH-MIP PAGES':'FULL 8K SURFACE SET RESIDENT',w*.43,h*.94)}$('mTris').textContent=v.tris>=1e6?(v.tris/1e6).toFixed(1)+'M':Math.round(v.tris/1000)+'k';$('mCracks').textContent=v.cracks+'개';$('mPop').textContent=S.pop.toFixed(1)+' m';$('mPages').textContent=S.step>=5?v.pages+' / 4,096':'—';c.dataset.tris=v.tris;c.dataset.cracks=v.cracks;c.dataset.pop=S.pop.toFixed(2);c.dataset.pages=S.step>=5?v.pages:'';c.dataset.lods=v.ls.join(',');c.dataset.current=S.current.toFixed(3)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('stitch').setAttribute('aria-pressed',String(S.stitch));$('vt').setAttribute('aria-pressed',String(S.vt));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.stitch=S.step>=4;S.vt=S.step>=5;S.current=S.target;S.pop=0;S.lastLods=lods();update()});$('distance').oninput=e=>{const old=lods();S.target=+e.target.value/100;$('distanceOut').textContent=e.target.value+'%';if(S.step<4){S.current=S.target;const now=lods();S.pop=now.some((l,i)=>l!==old[i])?6.5:0}else S.pop=Math.abs(S.target-S.current)*.7;update()};$('bias').oninput=e=>{S.bias=+e.target.value/100;$('biasOut').textContent=e.target.value+'%';update()};$('stitch').onclick=()=>{S.stitch=!S.stitch;update()};$('vt').onclick=()=>{S.vt=!S.vt;update()};function tick(){S.t++;if(S.step>=4){S.current+=(S.target-S.current)*.055;S.pop*=.94}draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
