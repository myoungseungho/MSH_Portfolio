<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q11 눈 변형 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block;cursor:crosshair}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="눈 위 발자국이 데칼에서 실제 변위와 누적·회복으로 발전하는 단계별 시뮬레이션"></canvas><div class="hud"><span>Q11 · <b id="stage">발자국 데칼</b></span><span id="status">위에서만 그럴듯함</span></div></div>
<div class="steps" role="group" aria-label="눈 변형 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>데칼</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>높이 변위</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>테셀레이션</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>RT 누적</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>회복</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>반경·폴백</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="depth">발자국 깊이</label><output id="depthOut">65%</output></div><input id="depth" type="range" min="10" max="100" value="65"></div><div><div class="ct"><label for="recovery">눈보라 회복</label><output id="recoveryOut">20%</output></div><input id="recovery" type="range" min="0" max="100" value="20"></div><div class="toggles" role="group" aria-label="관찰 시점과 발자국"><button data-view="0" aria-pressed="true">⌗ 위에서</button><button data-view="1" aria-pressed="false">▱ 옆에서</button><button id="stamp">＋ 발자국</button><button id="reset">↺ 평탄화</button></div></div>
<div class="metrics"><div class="m"><small>누적 발자국</small><strong id="mPrints">1</strong></div><div class="m"><small>실제 지오메트리 깊이</small><strong id="mDepth">0 cm</strong></div><div class="m"><small>기억 방식</small><strong id="mMemory">데칼 N장</strong></div><div class="m"><small>근거리 삼각형</small><strong id="mTris">1×</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,depth:.65,recovery:.20,view:0,t:0,prints:[{x:.42,y:.54,a:-.18,d:1}]},names=['발자국 데칼','높이 변위','테셀레이션','렌더타겟 누적','시간 회복','반경·폴백'];
const desc=['<b>문제 재현:</b> 발자국 그림을 바닥에 붙였습니다. “옆에서”를 누르면 표면 실루엣이 전혀 내려가지 않는 납작한 한계가 드러납니다.','<b>지오메트리 변위:</b> 높이맵을 아래로 밀어 실제 깊이와 그림자를 만듭니다. 하지만 성긴 메시라 발자국 곡선이 각지고 계단처럼 보입니다.','<b>근거리 세분화:</b> 카메라 주변 눈만 촘촘히 나눠 부드러운 바닥·파인 중심·밀려 오른 가장자리 림을 만듭니다.','<b>상태 누적:</b> 발이 닿을 때마다 플레이어 주변 렌더타겟에 눌림을 최댓값으로 기록합니다. “발자국”을 여러 번 눌러 하나의 맵에 쌓아 보세요.','<b>회복:</b> 저장된 눌림을 시간에 따라 0으로 되돌립니다. 눈보라 회복을 높이면 기존 자국이 빠르게 얕아져 다시 평평해집니다.','<b>최종:</b> 고품질 변위는 플레이어 주변 원 안에서만 유지하고, 먼 자국은 노멀·AO 착시로 낮춥니다. 전역 영구 변형 대신 중요한 흔적만 별도 저장합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function top(w,h){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#b9d4df');g.addColorStop(1,'#e8f1f2');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<55;i++){x.fillStyle='rgba(90,130,150,.12)';x.beginPath();x.arc((i*83)%w,(i*47)%h,1+(i%3),0,7);x.fill()}if(S.step>=5){x.strokeStyle='rgba(110,215,229,.7)';x.lineWidth=2;x.setLineDash([8,6]);x.beginPath();x.arc(w*.5,h*.5,Math.min(w,h)*.38,0,7);x.stroke();x.setLineDash([]);x.fillStyle='#2f7080';x.font='600 10px ui-monospace,monospace';x.fillText('HIGH DETAIL RT RADIUS',w*.38,h*.13)}
for(const p of S.prints){const px=p.x*w,py=p.y*h,a=p.a,dep=p.d*S.depth;if(S.step===0){x.fillStyle='rgba(45,72,85,.45)'}else{x.fillStyle=`rgba(49,91,110,${.25+dep*.38})`};x.save();x.translate(px,py);x.rotate(a);x.beginPath();x.ellipse(0,0,w*.027,h*.075,0,0,7);x.fill();if(S.step>=2){x.strokeStyle=`rgba(240,250,250,${.45*dep})`;x.lineWidth=3+dep*4;x.beginPath();x.ellipse(0,0,w*.034,h*.085,0,0,7);x.stroke()}x.restore()}if(S.step===1){x.strokeStyle='rgba(75,105,120,.42)';for(let i=0;i<12;i++){x.beginPath();x.moveTo(i*w/11,0);x.lineTo(i*w/11,h);x.stroke()}for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,i*h/6);x.lineTo(w,i*h/6);x.stroke()}}
}
function side(w,h){x.fillStyle='#8eb7c8';x.fillRect(0,0,w,h*.42);x.fillStyle='#e7f0f1';x.fillRect(0,h*.42,w,h*.58);x.strokeStyle='#b2cbd3';x.lineWidth=2;const res=S.step>=2?90:12;x.beginPath();for(let i=0;i<=res;i++){const nx=i/res,px=nx*w;let y=h*.47;if(S.step>=1)for(const p of S.prints){const dx=(nx-p.x)/.045,dep=Math.exp(-dx*dx)*p.d*S.depth;y+=dep*h*.15;if(S.step>=2)y-=Math.exp(-Math.pow((Math.abs(dx)-1.15)/.34,2))*p.d*S.depth*h*.035}if(i===0)x.moveTo(px,y);else x.lineTo(px,y)}x.stroke();x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fillStyle='#f1f6f6';x.fill();if(S.step===0){x.strokeStyle='#ff7469';x.setLineDash([6,5]);x.beginPath();x.moveTo(0,h*.47);x.lineTo(w,h*.47);x.stroke();x.setLineDash([]);x.fillStyle='#c54845';x.font='600 11px system-ui';x.fillText('데칼은 옆에서 봐도 실루엣이 평평함',w*.29,h*.57)}if(S.step===1){x.fillStyle='#c54845';x.font='600 10px system-ui';x.fillText('성긴 버텍스 → 각진 홈',w*.40,h*.68)}if(S.step>=2){x.fillStyle='#35788a';x.font='600 10px system-ui';x.fillText('파인 중심 + 밀려 오른 rim',w*.40,h*.73)}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);S.view?side(w,h):top(w,h)}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.view===S.view)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];const avg=S.prints.length?S.prints.reduce((a,p)=>a+p.d,0)/S.prints.length:0;$('mPrints').textContent=S.prints.length;$('mDepth').textContent=(S.step>=1?Math.round(avg*S.depth*18):0)+' cm';$('mMemory').textContent=['데칼 N장','높이맵','높이맵','RT 1장','RT 감쇠','근거리 RT'][S.step];$('mTris').textContent=['1×','1×','12×','12×','12×','4× 평균'][S.step];$('status').textContent=['위에서만 그럴듯함','깊이는 있지만 각짐','부드러운 홈·림','발자국 '+S.prints.length+'개 누적','눈보라로 덮이는 중','반경 밖은 착시 폴백'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=+b.dataset.view;ui()});$('depth').oninput=e=>{S.depth=+e.target.value/100;$('depthOut').textContent=e.target.value+'%';ui()};$('recovery').oninput=e=>{S.recovery=+e.target.value/100;$('recoveryOut').textContent=e.target.value+'%'};$('stamp').onclick=()=>{const n=S.prints.length;S.prints.push({x:.25+(n*.17)% .58,y:.31+(n*.23)% .42,a:n%2?.2:-.2,d:1});if(S.prints.length>12)S.prints.shift();ui()};$('reset').onclick=()=>{S.prints=[];ui()};let last=0;function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;S.t=t/1000;if(S.step>=4&&S.recovery>0){for(const p of S.prints)p.d=Math.max(0,p.d-S.recovery*.10*dt);S.prints=S.prints.filter(p=>p.d>.015);ui()}draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
