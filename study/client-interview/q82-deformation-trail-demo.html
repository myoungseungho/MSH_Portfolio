<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q82 지형 자국 누적 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="개별 발자국 데칼에서 누적 높이 렌더타겟, 지형 디스플레이스먼트, 연속 캡슐 트레일, 토로이달 회복과 영속 타일로 발전하는 실험"></canvas><div class="hud"><span>Q82 · <b id="stage">접지할 때마다 평평한 데칼 생성</b></span><span id="status">스티커 수가 늘고 표면은 실제로 파이지 않는다</span></div></div>
<div class="steps" role="group" aria-label="지형 자국 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>개별 데칼</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>높이 RT 누적</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>실제 변위</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>캡슐 트레일</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스크롤·회복</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>영속 타일 백킹</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="recovery">바람 회복</label><output id="recoveryOut">35%</output></div><input id="recovery" type="range" min="0" max="100" value="35"></div><div><div class="ct"><label for="speed">이동 속도</label><output id="speedOut">55%</output></div><input id="speed" type="range" min="10" max="100" value="55"></div><div class="toggles"><button id="vehicle" aria-pressed="false">보행 자국</button><button id="backing" aria-pressed="false">타일 백킹</button></div></div>
<div class="metrics"><div class="m"><small>개별 데칼 / 눌린 텍셀</small><strong id="mMarks">0 / 0</strong></div><div class="m"><small>최대 실제 깊이</small><strong id="mDepth">0.0 cm</strong></div><div class="m"><small>트레일 빈 구간</small><strong id="mGaps">0개</strong></div><div class="m"><small>저장된 월드 타일</small><strong id="mTiles">0개</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),GW=48,GH=18,S={step:0,recovery:.35,speed:.55,vehicle:false,backing:false,t:0,px:.12,prev:.12,field:[],decals:[],gaps:0,tiles:0,wraps:0};
const names=['접지 위치마다 평평한 데칼 한 장','발·바퀴 깊이를 한 높이 텍스처에 가산','높이값으로 테셀레이션 정점을 아래로 변위','이전→현재 위치를 캡슐·서브스텝으로 연결','플레이어 중심 토로이달 스크롤 + 바람 감쇠','스크롤 밖 월드 타일을 저장하고 재방문 시 복원'];
const status=['스티커 수가 늘고 표면은 실제로 파이지 않는다','같은 길을 반복하면 상한까지 점점 깊어진다','단면 프로필에 홈·테두리 깊이가 생긴다','고속에서도 점선이 아니라 연속 궤적','오래된 자국은 얕아지고 가장자리는 새 영역으로 재사용','추적 게임플레이를 위해 휘발 맵 밖 상태도 보존'];
const desc=['<b>데칼의 한계:</b> 발이 닿을 때마다 평평한 스티커를 만듭니다. 속도를 올리면 자국 사이가 벌어지고, 개수는 계속 늘지만 아래 단면은 완전히 평평합니다.','<b>상태를 한 장에:</b> 발·바퀴가 지나간 깊이를 위에서 본 높이 렌더타겟에 가산합니다. 같은 길을 다시 지나면 깊이가 더해져 자주 다닌 길이 자연히 다져집니다.','<b>스티커가 아닌 지형:</b> 누적 높이를 테셀레이션·버텍스 변위에 연결해 표면을 실제로 아래로 누릅니다. 아래 단면 프로필에서 홈 깊이와 양옆의 밀려난 테두리를 확인하세요.','<b>프레임 독립 기록:</b> 현재 점만 찍지 않고 이전 위치→현재 위치 선분을 여러 캡슐로 채웁니다. 이동 속도를 최대로 올려도 트레일 빈 구간이 0으로 유지됩니다.','<b>유한 맵을 이동 창으로:</b> 플레이어가 경계에 닿으면 열을 감아 새 영역으로 재사용하고, 매 프레임 깊이를 감쇠해 눈·모래가 바람에 덮이듯 회복시킵니다.','<b>비싼 영속성은 선택:</b> 추적 게임플레이가 필요하면 스크롤 밖 타일을 CPU·디스크 백킹에 저장합니다. 백킹 버튼을 끄면 같은 이동에서도 타일 수가 늘지 않습니다.'];
function reset(){S.field=Array(GW*GH).fill(0);S.decals=[];S.px=.12;S.prev=.12;S.gaps=0;S.tiles=0;S.wraps=0;S.t=0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function stamp(cx,cy,rad,amount){for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const dx=(gx+.5)/GW-cx,dy=(gy+.5)/GH-cy,d=Math.hypot(dx,dy);if(d<rad){const i=gx+gy*GW;S.field[i]=Math.min(1,S.field[i]+(1-d/rad)*amount)}}}
function trail(a,b){const dist=Math.abs(b-a),steps=S.step>=3?Math.max(1,Math.ceil(dist*GW*2)):1;if(S.step<3&&dist>2/GW)S.gaps++;for(let i=1;i<=steps;i++){const q=i/steps,p=a+(b-a)*q;if(S.vehicle){stamp(p,.51,.045,.008);stamp(p,.61,.045,.008)}else stamp(p,.56,.045,.012)}}
function wrap(){if(S.step>=5&&S.backing)S.tiles++;for(let gy=0;gy<GH;gy++){const row=S.field.splice(gy*GW,8);S.field.splice(gy*GW+GW-8,0,...row.map(()=>0))}S.wraps++;S.px=.26;S.prev=.25}
function simulate(){S.t++;S.prev=S.px;S.px+=.00105*S.speed;if(S.step>=4&&S.px>.84)wrap();else if(S.px>1.05){S.px=.08;S.prev=.07}if(S.step===0){if(S.t%15===0){const last=S.decals[S.decals.length-1];if(last&&S.px-last.x>.012)S.gaps++;S.decals.push({x:S.px,y:.56});if(S.decals.length>80)S.decals.shift()}}else trail(S.prev,S.px);if(S.step>=4){const fade=.0005+.0045*S.recovery;for(let i=0;i<S.field.length;i++)S.field[i]=Math.max(0,S.field[i]-fade)}}
function values(){const texels=S.field.filter(v=>v>.02).length,peak=S.field.reduce((n,v)=>Math.max(n,v),0);return{texels,peak}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values(),ox=w*.04,oy=h*.15,fw=w*.92,fh=h*.51,cw=fw/GW,ch=fh/GH;x.fillStyle='#101a25';x.fillRect(0,0,w,h);x.fillStyle='#dce8ee';x.fillRect(ox,oy,fw,fh);x.strokeStyle='#bfd0da';for(let gx=0;gx<=GW;gx+=4){x.beginPath();x.moveTo(ox+gx*cw,oy);x.lineTo(ox+gx*cw,oy+fh);x.stroke()}if(S.step===0){for(const d of S.decals){x.fillStyle='rgba(55,82,98,.72)';x.beginPath();x.ellipse(ox+d.x*fw,oy+d.y*fh,8,4,0,0,Math.PI*2);x.fill()}}else for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const q=S.field[gx+gy*GW];if(q>.01){x.fillStyle=`rgba(47,87,110,${.12+q*.78})`;x.fillRect(ox+gx*cw,oy+gy*ch,cw+1,ch+1)}}x.fillStyle='#ffd06e';x.beginPath();x.arc(ox+S.px*fw,oy+.56*fh,8,0,Math.PI*2);x.fill();if(S.vehicle){x.strokeStyle='#ffd06e';x.lineWidth=3;x.beginPath();x.moveTo(ox+S.px*fw,oy+.48*fh);x.lineTo(ox+S.px*fw,oy+.64*fh);x.stroke()}x.strokeStyle='#70ceff';x.setLineDash(S.step>=4?[5,5]:[]);x.strokeRect(ox,oy,fw,fh);x.setLineDash([]);const base=h*.78,amp=h*.1;x.fillStyle='#c9dbe3';x.beginPath();x.moveTo(ox,base);for(let gx=0;gx<GW;gx++){let q=0;for(let gy=0;gy<GH;gy++)q=Math.max(q,S.field[gx+gy*GW]);const yy=S.step>=2?base+q*amp:base;x.lineTo(ox+(gx+.5)*cw,yy)}x.lineTo(ox+fw,base);x.lineTo(ox+fw,h);x.lineTo(ox,h);x.closePath();x.fill();x.strokeStyle='#70ceff';x.stroke();x.fillStyle='#8ce3ae';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(S.step>=2?'HEIGHT RT → TESSELLATION / DISPLACEMENT':'FLAT SURFACE · NO REAL DEPTH',w*.36,h*.73);if(S.step>=4)x.fillText(`TOROIDAL WRAP ${S.wraps} · RECOVERY ${(S.recovery*100).toFixed(0)}%`,w*.4,h*.91);$('mMarks').textContent=S.decals.length+' / '+v.texels;$('mDepth').textContent=(v.peak*8).toFixed(1)+' cm';$('mGaps').textContent=S.gaps+'개';$('mTiles').textContent=S.tiles+'개';c.dataset.decals=S.decals.length;c.dataset.texels=v.texels;c.dataset.depth=(v.peak*8).toFixed(2);c.dataset.gaps=S.gaps;c.dataset.tiles=S.tiles;c.dataset.wraps=S.wraps;c.dataset.player=S.px.toFixed(3)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('vehicle').textContent=S.vehicle?'바퀴 자국':'보행 자국';$('vehicle').setAttribute('aria-pressed',String(S.vehicle));$('backing').setAttribute('aria-pressed',String(S.backing));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.backing=S.step>=5;reset();update()});$('recovery').oninput=e=>{S.recovery=+e.target.value/100;$('recoveryOut').textContent=e.target.value+'%';update()};$('speed').oninput=e=>{S.speed=+e.target.value/100;$('speedOut').textContent=e.target.value+'%';update()};$('vehicle').onclick=()=>{S.vehicle=!S.vehicle;reset();update()};$('backing').onclick=()=>{S.backing=!S.backing;update()};function tick(){simulate();draw();requestAnimationFrame(tick)}reset();update();tick();addEventListener('resize',draw);
})();
</script></body></html>
