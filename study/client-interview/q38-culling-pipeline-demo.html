<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q38 프러스텀·HZB 컬링 단계형 실험실</title>
<style>
:root{--bg:#080d12;--panel:#121a23;--line:#304253;--ink:#f2f8fc;--muted:#98a9b7;--visible:#75c9ff;--culled:#52616e;--occluded:#ff9d78;--phase:#8ce3b2}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13212b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#080d12dd}.hud b{color:var(--visible)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#587083}button:focus-visible,input:focus-visible{outline:2px solid var(--visible);outline-offset:2px}button[aria-pressed=true]{background:var(--visible);border-color:var(--visible);color:#06131c}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--visible);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--visible)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#778b9a;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="전부 제출에서 프러스텀, HZB 오클루전, GPU indirect와 디오클루전 2단계 컬링까지 쌓는 도시 평면도"></canvas><div class="hud"><span>Q38 · <b id="stage">모든 오브젝트 제출</b></span><span id="status">Z-test 전에 비용 지불</span></div></div>
<div class="steps" role="group" aria-label="가시성 컬링 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전부 제출</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>프러스텀·BVH</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>벽 뒤 낭비</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>HZB·GPU indirect</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>이전 HZB 팝</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>2단계·기여도</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="yaw">카메라 회전</label><output id="yawOut">0°</output></div><input id="yaw" type="range" min="-90" max="90" value="0"></div><div><div class="ct"><label for="minPixels">기여도 최소 크기</label><output id="minPixelsOut">3 px</output></div><input id="minPixels" type="range" min="0" max="12" value="3"></div><div class="toggles" role="group" aria-label="HZB 및 2단계 디오클루전 옵션"><button id="hzb" aria-pressed="false">HZB 오클루전</button><button id="phase2" aria-pressed="false">2단계 디오클루전</button></div></div>
<div class="metrics"><div class="m"><small>전체 인스턴스</small><strong id="mTotal">54</strong></div><div class="m"><small>프러스텀 통과</small><strong id="mFrustum">54</strong></div><div class="m"><small>HZB 가림 제거</small><strong id="mOccluded">0</strong></div><div class="m"><small>최종 indirect draws</small><strong id="mDraws">54</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,yaw:0,minPixels:3,hzb:false,phase2:false},names=['submit everything / late Z','CPU frustum + BVH','frustum-visible wall waste','GPU HZB + indirect list','previous-frame HZB lag','two-phase disocclusion + contribution'],desc=['<b>문제 재현:</b> 세상 54개를 모두 제출하고 Z-test가 가린 픽셀을 버리게 하면 벽 뒤 건물도 드로우콜·정점 비용을 이미 다 낸 뒤입니다.','<b>절두체 밖부터 큰 덩어리로:</b> AABB를 카메라 6평면에 검사하고 BVH 노드째 제외합니다. 회전 슬라이더를 돌리면 시야 밖 블록이 제출 목록에서 빠집니다.','<b>남은 낭비:</b> 프러스텀 안이지만 중앙 벽 뒤에 완전히 숨은 주황 건물은 여전히 제출됩니다. Z-test는 늦습니다.','<b>계층 깊이로 제출 전 제거:</b> 이전 깊이의 HZB 밉에 경계 상자를 테스트하고 GPU가 visible list·indirect draw를 직접 작성해 CPU 왕복을 없앱니다.','<b>어제 깊이의 함정:</b> 카메라를 홱 돌려 새로 드러난 초록 건물도 이전 HZB가 아직 가렸다고 오판해 한 프레임 늦게 팝합니다.','<b>같은 프레임에 회복:</b> 지난 가시 집합으로 현재 HZB를 만든 뒤 전체를 재테스트해 새로 드러난 물체를 즉시 추가합니다. 화면 몇 픽셀 미만은 기여도로 더 줄입니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}const objs=[];for(let j=0;j<6;j++)for(let i=0;i<9;i++)objs.push({x:.36+i*.065,y:.16+j*.13,size:4+(i+j)%9});function norm(a){while(a>180)a-=360;while(a<-180)a+=360;return a}function state(o){const cam={x:.18,y:.5},dx=o.x-cam.x,dy=o.y-cam.y,ang=Math.atan2(dy,dx)*180/Math.PI,delta=Math.abs(norm(ang-S.yaw)),fr=S.step<1||delta<36,wallX=.57,t=(wallX-cam.x)/dx,hitY=cam.y+dy*t,occ=fr&&o.x>wallX&&t>0&&t<1&&hitY>.24&&hitY<.76,small=o.size<S.minPixels;return{fr,occ,small}}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,10,15,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,camX=w*.18,camY=h*.5,a=S.yaw*Math.PI/180;x.fillStyle='#172630';x.fillRect(0,0,w,h);x.fillStyle='rgba(117,201,255,.08)';x.beginPath();x.moveTo(camX,camY);x.lineTo(camX+Math.cos(a-.63)*w*.85,camY+Math.sin(a-.63)*w*.85);x.lineTo(camX+Math.cos(a+.63)*w*.85,camY+Math.sin(a+.63)*w*.85);x.closePath();x.fill();x.strokeStyle='#75c9ff';x.lineWidth=2;x.stroke();x.fillStyle='#d8e4ea';x.beginPath();x.arc(camX,camY,9,0,7);x.fill();x.strokeStyle='#d8e4ea';x.beginPath();x.moveTo(camX,camY);x.lineTo(camX+Math.cos(a)*34,camY+Math.sin(a)*34);x.stroke();x.fillStyle='#6f5c4a';x.fillRect(w*.565,h*.24,w*.018,h*.52);for(let i=0;i<objs.length;i++){const o=objs[i],st=state(o),px=o.x*w,py=o.y*h,removedFr=S.step>=1&&!st.fr,removedOcc=S.hzb&&S.step>=3&&st.occ,removedSmall=S.step>=5&&st.small;let color=removedFr?'#52616e':removedOcc?'#3c484f':removedSmall?'#29343c':st.occ&&S.step>=2?'#ff9d78':'#75c9ff';if(S.step===4&&S.hzb&&st.occ&&!S.phase2&&i%3===0)color='#ff8179';if(S.step>=5&&S.phase2&&st.occ&&i%4===0)color='#8ce3b2';x.fillStyle=color;x.fillRect(px-o.size,py-o.size,o.size*2,o.size*2);if(!removedFr&&!removedOcc&&!removedSmall){x.strokeStyle='rgba(255,255,255,.25)';x.strokeRect(px-o.size,py-o.size,o.size*2,o.size*2)}}tag('CAMERA FRUSTUM',w*.08,h*.16,'#75c9ff');tag('OCCLUDER WALL',w*.53,h*.22,'#f2f8fc');if(S.step===0)tag('54 SUBMITS · Z-TEST IS TOO LATE',w*.54,h*.89,'#ff8179');if(S.step>=1)tag('BVH NODE / FRUSTUM REJECT',w*.08,h*.87,'#52616e');if(S.step===2)tag('ORANGE = IN FRUSTUM BUT HIDDEN',w*.60,h*.83,'#ff9d78');if(S.hzb&&S.step>=3)tag('HZB MIPS → GPU VISIBLE LIST',w*.59,h*.15,'#75c9ff');if(S.step===4)tag('RED = OLD HZB FALSE OCCLUSION',w*.60,h*.82,'#ff8179');if(S.step>=5&&S.phase2){tag('GREEN = PHASE 2 RECOVERED NOW',w*.58,h*.82,'#8ce3b2');tag(`< ${S.minPixels}px CONTRIBUTION CULL`,w*.09,h*.78,'#f2f8fc')}}
function counts(){let fr=0,occ=0,small=0;for(const o of objs){const st=state(o);if(st.fr)fr++;if(st.fr&&st.occ)occ++;if(st.fr&&!st.occ&&st.small)small++}const hzb=S.hzb&&S.step>=3,phase=S.phase2&&S.step>=5,occRemoved=hzb?Math.max(0,occ-(phase?Math.ceil(occ/4):0)):0,draw=S.step===0?objs.length:Math.max(0,fr-occRemoved-(S.step>=5?small:0));return{fr,occRemoved,draw}}function metrics(){const r=counts();$('mFrustum').textContent=r.fr;$('mOccluded').textContent=r.occRemoved;$('mDraws').textContent=r.draw}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['Z-test 전에 비용 지불','시야 밖 제출 제거','벽 뒤 블록 남음','GPU에서 가림 제거','새 노출 한 프레임 지연','현재 프레임 즉시 복구'][S.step];$('explain').innerHTML=desc[S.step];$('hzb').setAttribute('aria-pressed',String(S.hzb));$('phase2').setAttribute('aria-pressed',String(S.phase2));metrics();draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.hzb=S.step>=3;S.phase2=S.step===5;ui()});$('yaw').oninput=e=>{S.yaw=+e.target.value;$('yawOut').textContent=e.target.value+'°';ui()};$('minPixels').oninput=e=>{S.minPixels=+e.target.value;$('minPixelsOut').textContent=e.target.value+' px';ui()};$('hzb').onclick=()=>{S.hzb=!S.hzb;ui()};$('phase2').onclick=()=>{S.phase2=!S.phase2;ui()};ui();addEventListener('resize',draw)})();
</script></body></html>
