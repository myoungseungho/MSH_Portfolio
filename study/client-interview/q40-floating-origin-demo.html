<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q40 대형 월드 좌표 정밀도 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="먼 절대 좌표의 굵은 float 격자를 오리진 리베이싱과 카메라 상대 로컬 좌표로 바꾸는 과정"></canvas><div class="hud"><span>Q40 · <b id="stage">단일 float 월드</b></span><span id="status">멀수록 좌표 스냅</span></div></div>
<div class="steps" role="group" aria-label="대형 월드 좌표 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>원점 근처</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>먼 float 좌표</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>오리진 리베이스</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>누락 시스템 점프</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>카메라 상대·LWC</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>권위·물리·모션</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">원점에서 거리</label><output id="distanceOut">40 km</output></div><input id="distance" type="range" min="0" max="500" value="40"></div><div><div class="ct"><label for="threshold">리베이스 임계값</label><output id="thresholdOut">10 km</output></div><input id="threshold" type="range" min="1" max="100" value="10"></div><div class="toggles" role="group" aria-label="원자적 리베이스와 모션 벡터 보정"><button id="atomic" aria-pressed="false">모든 시스템 원자 이동</button><button id="motion" aria-pressed="false">모션 벡터 보정</button></div></div>
<div class="metrics"><div class="m"><small>FLOAT 표현 간격</small><strong id="mUlp">0.004 m</strong></div><div class="m"><small>연산용 로컬 좌표</small><strong id="mLocal">40.0 km</strong></div><div class="m"><small>화면 지터</small><strong id="mJitter">1.6 px</strong></div><div class="m"><small>리베이스 스미어</small><strong id="mSmear">없음</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,distance:40,threshold:10,atomic:false,motion:false,t:0},names=['near-origin float coordinates','far float quantization','floating-origin rebase','missed world-space cache','double authority → camera-relative float','absolute network truth + local physics'],desc=['<b>기준 확인:</b> 원점 근처에서는 float 격자가 촘촘해 작은 이동도 매 프레임 정확히 표현됩니다.','<b>문제 재현:</b> 거리를 올리면 표현 가능한 좌표 간격이 굵어져 실제 이동이 계단처럼 스냅되고 캐릭터·카메라가 떱니다.','<b>원점을 데려오기:</b> 임계 거리를 넘을 때 월드 오프셋을 빼 플레이어를 다시 작은 로컬 좌표로 옮깁니다.','<b>하나라도 빠지면:</b> 파티클·데칼 같은 월드 좌표 캐시가 오프셋을 못 받으면 본체와 분리되어 크게 튑니다. 원자 이동을 켜 비교하세요.','<b>큰 수는 저장에만:</b> 권위 위치는 double로 보존하고 CPU에서 카메라를 뺀 작은 float만 GPU에 전달합니다.','<b>경계 완성:</b> 네트워크는 절대 좌표, 각 클라 렌더와 float 물리는 로컬 좌표를 씁니다. 리베이스 프레임의 모션 벡터도 보정해야 화면 번짐이 사라집니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function values(){let abs=S.distance*1000,ulp=Math.max(.00001,Math.pow(2,Math.floor(Math.log2(Math.max(abs,1)))-23)),rebased=S.step>=2&&S.distance>S.threshold,local=S.step>=4?Math.min(320,S.distance*3):rebased?(S.distance%S.threshold)*1000:abs,jitter=S.step===0?.03:S.step===1?Math.min(12,ulp*420):S.step===3&&!S.atomic?8.4:S.step>=4?.02:.08,smear=S.step>=5&&!S.motion&&rebased?'강함':'없음';return{abs,ulp,rebased,local,jitter,smear}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values(),base=h*.70,span=w*.82,left=w*.09;x.fillStyle='#142430';x.fillRect(0,0,w,h);x.strokeStyle='#304657';x.lineWidth=1;for(let i=0;i<=12;i++){let px=left+i*span/12;x.beginPath();x.moveTo(px,h*.18);x.lineTo(px,base);x.stroke()}x.strokeStyle='#728999';x.lineWidth=2;x.beginPath();x.moveTo(left,base);x.lineTo(left+span,base);x.stroke();const rough=S.step===1?Math.max(10,Math.min(62,v.ulp*2800)):4,real=left+span*.62+Math.sin(S.t*.035)*26,snap=Math.round(real/rough)*rough,player=S.step===1?snap:left+span*.62;x.fillStyle='#72c9ff';x.beginPath();x.arc(player,base-34,15,0,7);x.fill();x.fillRect(player-9,base-20,18,35);x.strokeStyle='#72c9ff';x.lineWidth=4;x.beginPath();x.moveTo(player-9,base+15);x.lineTo(player-18,base+38);x.moveTo(player+9,base+15);x.lineTo(player+18,base+38);x.stroke();if(S.step===1){x.strokeStyle='#ff8179';x.lineWidth=2;for(let px=left;px<left+span;px+=rough){x.beginPath();x.moveTo(px,base+48);x.lineTo(px,base+62);x.stroke()}tag(`FLOAT GRID ${v.ulp.toFixed(3)} m`,w*.38,h*.90,'#ff8179');x.strokeStyle='#ffd17f';x.beginPath();x.moveTo(real,base-62);x.lineTo(snap,base-62);x.stroke();tag('REAL MOTION → NEAREST REPRESENTABLE VALUE',w*.30,h*.20,'#ffd17f')}if(S.step>=2){x.strokeStyle='#8ce4b4';x.lineWidth=3;x.beginPath();x.moveTo(w*.12,h*.29);x.lineTo(w*.48,h*.29);x.stroke();x.beginPath();x.moveTo(w*.48,h*.29);x.lineTo(w*.46,h*.27);x.moveTo(w*.48,h*.29);x.lineTo(w*.46,h*.31);x.stroke();tag(`WORLD OFFSET −${S.distance.toFixed(0)} km`,w*.18,h*.25,'#8ce4b4');tag('NEW LOCAL ORIGIN',w*.50,base+58,'#8ce4b4');x.fillStyle='#8ce4b4';x.fillRect(w*.50-2,base-12,4,68)}if(S.step===3){let miss=S.atomic?player:player+w*.18;x.fillStyle='#ffd17f';x.beginPath();x.arc(miss,base-90,8,0,7);x.fill();tag(S.atomic?'PARTICLE RECEIVED SAME OFFSET':'STALE PARTICLE CACHE',miss-55,base-112,S.atomic?'#8ce4b4':'#ff8179');if(!S.atomic){x.strokeStyle='#ff8179';x.setLineDash([5,5]);x.beginPath();x.moveTo(player,base-70);x.lineTo(miss,base-90);x.stroke();x.setLineDash([])}}if(S.step>=4){tag('DOUBLE / INT64 ABSOLUTE POSITION',w*.08,h*.13,'#ffd17f');tag('CPU: ABSOLUTE − CAMERA',w*.42,h*.13,'#8ce4b4');tag('GPU: SMALL FLOAT',w*.75,h*.13,'#72c9ff');x.strokeStyle='#8ce4b4';x.beginPath();x.moveTo(w*.31,h*.11);x.lineTo(w*.40,h*.11);x.moveTo(w*.68,h*.11);x.lineTo(w*.73,h*.11);x.stroke()}if(S.step>=5&&!S.motion&&v.rebased){x.globalAlpha=.22;x.fillStyle='#ff8179';for(let i=1;i<7;i++)x.fillRect(player-i*18,base-54,18,72);x.globalAlpha=1;tag('FALSE VELOCITY → TAA / MOTION BLUR SMEAR',w*.54,h*.90,'#ff8179')}if(S.step>=5&&S.motion)tag('REBASE OFFSET SUBTRACTED FROM MOTION VECTOR',w*.54,h*.90,'#8ce4b4')}
function metrics(){const v=values();$('mUlp').textContent=(v.ulp<.001?(v.ulp*1000).toFixed(2)+' mm':v.ulp.toFixed(3)+' m');$('mLocal').textContent=v.local>=1000?(v.local/1000).toFixed(1)+' km':v.local.toFixed(0)+' m';$('mJitter').textContent=v.jitter.toFixed(2)+' px';$('mSmear').textContent=v.smear}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['촘촘한 좌표','멀수록 좌표 스냅','플레이어 곁의 새 원점','옛 원점에 남은 캐시','GPU는 작은 수만 계산','통신은 절대 · 표시는 로컬'][S.step];$('explain').innerHTML=desc[S.step];$('atomic').setAttribute('aria-pressed',String(S.atomic));$('motion').setAttribute('aria-pressed',String(S.motion));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.atomic=S.step>=4;S.motion=S.step===5;ui()});$('distance').oninput=e=>{S.distance=+e.target.value;$('distanceOut').textContent=e.target.value+' km';ui()};$('threshold').oninput=e=>{S.threshold=+e.target.value;$('thresholdOut').textContent=e.target.value+' km';ui()};$('atomic').onclick=()=>{S.atomic=!S.atomic;ui()};$('motion').onclick=()=>{S.motion=!S.motion;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
