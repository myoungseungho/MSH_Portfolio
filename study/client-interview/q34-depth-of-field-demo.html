<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q34 피사계심도 단계형 실험실</title>
<style>
:root{--bg:#080b13;--panel:#131925;--line:#303b50;--ink:#f5f7ff;--muted:#9ba6bb;--focus:#8ab8ff;--near:#ff9b84;--far:#8ddad0}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#151827}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#080b13dd}.hud b{color:var(--focus)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#5c6a85}button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}button[aria-pressed=true]{background:var(--focus);border-color:var(--focus);color:#07101d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--focus);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--focus)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#78849b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="거리 가우시안 블러에서 signed CoC, 전경·후경 분리, 전경 확장, 보케와 half-res 타일까지 쌓는 야간 조준 장면"></canvas><div class="hud"><span>Q34 · <b id="stage">거리 가우시안 블러</b></span><span id="status">경계 컷·빛 번짐</span></div></div>
<div class="steps" role="group" aria-label="피사계심도 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>단순 거리 블러</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>signed CoC</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>near/far 분리</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>near 확장·깊이 거부</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>조리개 보케</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>half-res 타일·안정화</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="focus">초점 거리</label><output id="focusOut">8.0 m</output></div><input id="focus" type="range" min="20" max="200" value="80"></div><div><div class="ct"><label for="aperture">조리개</label><output id="apertureOut">f/2.0</output></div><input id="aperture" type="range" min="12" max="80" value="20"></div><div class="toggles" role="group" aria-label="전경 확장과 깊이 샘플 거부 옵션"><button id="dilate" aria-pressed="false">near CoC 확장</button><button id="reject" aria-pressed="false">깊이·CoC 샘플 거부</button></div></div>
<div class="metrics"><div class="m"><small>전경 CoC (2m)</small><strong id="mNear">-12 px</strong></div><div class="m"><small>표적 CoC (8m)</small><strong id="mTarget">0 px</strong></div><div class="m"><small>후경 CoC (20m)</small><strong id="mFar">8 px</strong></div><div class="m"><small>큰 커널 비용</small><strong id="mCost">64 taps</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,focus:8,aperture:2,dilate:false,reject:false},names=['depth-scaled Gaussian blur','physical signed circle of confusion','separate near / far layers','near dilation + depth-aware gather','aperture-shaped bokeh','full/half-res CoC tile pipeline'],desc=['<b>문제 재현:</b> 초점 거리 차이만으로 한 번에 가우시안 블러하면 선명한 표적 경계가 칼로 잘리고, 배경색이 외곽으로 새며 밝은 가로등도 빛망울 대신 얼룩이 됩니다.','<b>흐림 반경의 물리값:</b> 초점거리·조리개·깊이로 signed CoC를 계산합니다. 음수는 전경, 0은 초점면, 양수는 후경이며 슬라이더를 옮기면 세 깊이의 부호가 바뀝니다.','<b>방향이 다른 두 층:</b> 후경은 자기 깊이 이웃을 gather하고 전경은 별도 레이어로 분리해, 초점 표적 픽셀이 후경 블러를 오염시키지 않게 합니다.','<b>경계를 렌즈처럼:</b> near CoC를 실루엣 밖으로 확장해 흐린 전경이 표적 위로 덮이게 하고, 뎁스·CoC가 다른 샘플은 gather에서 거부해 후광 번짐을 막습니다.','<b>밝은 점을 조리개 모양으로:</b> 후경 하이라이트를 CoC 크기의 원형 보케로 모아 가로등이 실제 렌즈의 빛망울처럼 커집니다. 조리개를 열어 크기 변화를 확인하세요.','<b>큰 반경만 싸게:</b> 작은 CoC는 풀해상도, 큰 CoC 타일은 half-res gather 후 깊이 인지 업샘플합니다. CoC를 시간 안정화해 TAA 지글거림도 줄입니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function coc(z){return Math.max(-18,Math.min(18,(z-S.focus)/z*(8/S.aperture)*10))}function tag(t,px,py,co='#f5f7ff'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,8,15,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function layer(blur,fn){x.save();x.filter=`blur(${Math.max(0,blur)}px)`;fn();x.restore()}function lamp(px,py,r,blur,bokeh){if(bokeh&&blur>2){x.fillStyle='rgba(255,220,126,.68)';x.beginPath();x.arc(px,py,Math.max(r,blur*1.7),0,7);x.fill();x.strokeStyle='rgba(255,245,205,.55)';x.stroke()}else layer(blur,()=>{x.fillStyle='#ffe09a';x.beginPath();x.arc(px,py,r,0,7);x.fill()})}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,physical=S.step>=1,separate=S.step>=2,dilate=S.dilate&&S.step>=3,reject=S.reject&&S.step>=3,bokeh=S.step>=4,near=Math.abs(physical?coc(2):12),mid=Math.abs(physical?coc(8):0),far=Math.abs(physical?coc(20):8);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#11152a');g.addColorStop(1,'#392335');x.fillStyle=g;x.fillRect(0,0,w,h);layer(far,()=>{x.fillStyle='#283047';for(let i=0;i<8;i++)x.fillRect(i*w/8,h*.28+(i%3)*18,w/9,h*.48);x.fillStyle='#4a5369';x.fillRect(0,h*.73,w,h*.27)});for(let i=0;i<7;i++)lamp(w*(.10+i*.14),h*(.24+(i%2)*.12),5,far,bokeh);layer(mid,()=>{const cx=w*.53;x.fillStyle='#d5a16f';x.beginPath();x.arc(cx,h*.40,18,0,7);x.fill();x.fillStyle='#465a76';x.fillRect(cx-15,h*.44,30,h*.22);x.fillStyle='#8fb4d7';x.fillRect(cx-25,h*.47,50,6)});layer(near*(dilate?1.15:1),()=>{x.fillStyle='#17161d';x.fillRect(w*.12,h*.18,26,h*.70);x.fillRect(w*.24,h*.25,22,h*.64);x.strokeStyle='#413d48';x.lineWidth=13;x.beginPath();x.moveTo(w*.04,h);x.lineTo(w*.32,h*.36);x.stroke()});if(S.step===0){x.strokeStyle='#ff8179';x.lineWidth=3;x.strokeRect(w*.49,h*.35,w*.08,h*.36);tag('HARD FOCUS CUT + COLOR BLEED',w*.43,h*.82,'#ff8179')}if(physical){tag(`NEAR ${coc(2).toFixed(1)} px`,w*.10,h*.14,'#ff9b84');tag(`FOCUS ${coc(8).toFixed(1)} px`,w*.45,h*.30,'#8ab8ff');tag(`FAR +${Math.abs(coc(20)).toFixed(1)} px`,w*.76,h*.18,'#8ddad0')}if(separate)tag('SIGNED COC → NEAR / FAR LAYERS',w*.34,h*.88,'#f5f7ff');if(dilate)tag('NEAR DILATE OVER FOCUS EDGE',w*.05,h*.63,'#ff9b84');if(reject)tag('DEPTH+COC REJECT · NO HALO',w*.58,h*.72,'#8ddad0');if(bokeh)tag('APERTURE BOKEH HIGHLIGHTS',w*.68,h*.43,'#ffe09a');if(S.step>=5)tag('LARGE COC → HALF RES TILE · TAA STABLE',w*.34,h*.10,'#8ab8ff')}
function metrics(){const a=coc(2),b=coc(8),d=coc(20);$('mNear').textContent=(a>=0?'+':'')+a.toFixed(1)+' px';$('mTarget').textContent=(b>=0?'+':'')+b.toFixed(1)+' px';$('mFar').textContent=(d>=0?'+':'')+d.toFixed(1)+' px';$('mCost').textContent=S.step>=5?'16 taps · half':'64 taps'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['경계 컷·빛 번짐','부호 있는 반경','초점면 오염 방지','전경 번짐·후광 제거','원형 빛망울','큰 흐림 비용 절감'][S.step];$('explain').innerHTML=desc[S.step];$('dilate').setAttribute('aria-pressed',String(S.dilate));$('reject').setAttribute('aria-pressed',String(S.reject));metrics();draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.dilate=S.step>=3;S.reject=S.step>=3;ui()});$('focus').oninput=e=>{S.focus=+e.target.value/10;$('focusOut').textContent=S.focus.toFixed(1)+' m';ui()};$('aperture').oninput=e=>{S.aperture=+e.target.value/10;$('apertureOut').textContent='f/'+S.aperture.toFixed(1);ui()};$('dilate').onclick=()=>{S.dilate=!S.dilate;ui()};$('reject').onclick=()=>{S.reject=!S.reject;ui()};ui();addEventListener('resize',draw)})();
</script></body></html>
