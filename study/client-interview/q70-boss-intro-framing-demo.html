<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q70 보스 등장 프레이밍 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="하드코딩 팬업에서 로우앵글 구도, 소켓 스캔, 바운딩 프레이밍, 레터박스와 재도전 인계까지 발전하는 보스 등장 실험"></canvas><div class="hud"><span>Q70 · <b id="stage">고정 좌표 팬업</b></span><span id="status">보스 크기가 바뀌면 머리나 발이 잘림</span></div></div>
<div class="steps" role="group" aria-label="보스 등장 카메라 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 팬업</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>위압 구도</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>소켓 스캔</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>바운딩 Fit</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>레터박스·인계</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>재도전 축약</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="height">보스 실제 높이</label><output id="heightOut">12 m</output></div><input id="height" type="range" min="2" max="24" value="12"></div><div><div class="ct"><label for="attempt">조우 횟수</label><output id="attemptOut">1회</output></div><input id="attempt" type="range" min="1" max="20" value="1"></div><div class="toggles"><button id="skip" aria-pressed="false">즉시 스킵</button><button id="live" aria-pressed="false">이동 조작 유지</button></div></div>
<div class="metrics"><div class="m"><small>머리/발 프레임 안</small><strong id="mFit">1 / 2</strong></div><div class="m"><small>보스 화면 점유율</small><strong id="mOccupancy">54%</strong></div><div class="m"><small>룩업 앵글</small><strong id="mAngle">4°</strong></div><div class="m"><small>플레이어 조작 권한</small><strong id="mControl">0%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,height:12,attempt:1,skip:false,live:false,t:0};
const names=['고정 좌표 팬업','로우앵글·크기 대비 구도','발·머리 소켓 상대 스캔','보스 바운딩을 화면에 Fit','레터박스 뒤 전투 카메라로 인계','첫 조우만 풀 연출·재도전 축약'],status=['보스 크기가 바뀌면 머리나 발이 잘림','정적인 구도만으로 위압감 생성','절대 좌표 대신 실제 본 사이를 훑음','크기에 맞춰 거리와 앵글 자동 조절','연출 신호를 주고 조작을 부드럽게 반환','반복할수록 짧아지고 언제든 블렌드 스킵'];
const desc=['<b>실패 재현:</b> 모든 보스를 같은 6m 카메라 범위로 팬업합니다. 높이 슬라이더를 바꾸면 작은 보스는 과장되고 거대 보스는 머리가 잘립니다.','<b>무빙보다 구도:</b> 낮은 플레이어 시점, 큰 화면 점유율과 내려다보는 실루엣으로 크기 대비를 만듭니다. 카메라 이동 없이도 압박이 생깁니다.','<b>좌표를 규칙으로:</b> 보스의 FOOT·HEAD 소켓을 읽고 그 사이를 훑습니다. 크기가 바뀌어도 시작과 끝이 실제 몸에 붙습니다.','<b>프레임 전체를 자동 맞춤:</b> 바운딩 반경과 FOV로 거리를 역산해 머리와 발을 안전 영역 안에 넣고, 키가 클수록 로우앵글을 강화합니다.','<b>연출 모드와 반환:</b> 레터박스로 상태를 알리고 마지막 구도에서 전투 카메라로 블렌드합니다. 보스는 멈추지 않고 idle·포효를 계속합니다.','<b>반복 예산:</b> 첫 조우만 전체 스캔을 보여주고 재도전은 포효 한 컷으로 축약합니다. 스킵과 이동 유지가 통제 뺏기를 최소화합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const comp=S.step>=1,sockets=S.step>=2,fit=S.step>=3,letter=S.step>=4,retry=S.step>=5,short=retry&&S.attempt>1,phase=S.skip?1:short?.86:(Math.sin(S.t*.017-Math.PI/2)+1)/2,visible=fit?2:S.height<=7?2:S.height<=14?1:0,occupancy=fit?Math.min(78,48+S.height*1.15):Math.min(118,30+S.height*4),angle=comp?Math.min(28,8+S.height*.75):4,control=S.live?100:letter?Math.round(phase*100):0;return{comp,sockets,fit,letter,retry,short,phase,visible,occupancy,angle,control}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.82,bx=w*.62,bodyH=v.fit?Math.min(h*.58,150+S.height*8):S.height*22,headY=ground-bodyH,scanY=v.sockets?ground-(bodyH*v.phase):ground-132*v.phase;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#182735';x.fillRect(0,ground,w,h-ground);line(w*.05,ground,w*.95,ground,'#60768a',3);const pw=18;x.fillStyle='#70ceff';x.beginPath();x.arc(w*.25,ground-59,12,0,7);x.fill();line(w*.25,ground-47,w*.25,ground-10,'#70ceff',8);label('PLAYER',w*.25,ground-80,'#70ceff');x.fillStyle='#354757';x.fillRect(bx-34,headY+32,68,bodyH-32);x.fillStyle='#ff7f78';x.beginPath();x.arc(bx,headY+21,26,0,7);x.fill();line(bx-34,headY+78,bx-95,headY+120,'#ff7f78',18);line(bx+34,headY+78,bx+95,headY+120,'#ff7f78',18);label(`BOSS ${S.height}m`,bx,Math.max(75,headY-12),'#ff7f78');
const frameX=w*.47,frameY=h*.13,frameW=w*.41,frameH=h*.63;x.strokeStyle=v.fit?'#8ce3ae':'#52677b';x.lineWidth=2;x.strokeRect(frameX,frameY,frameW,frameH);line(frameX,frameY+frameH*.12,frameX+frameW,frameY+frameH*.12,'#52677b',1,[4,4]);line(frameX,frameY+frameH*.88,frameX+frameW,frameY+frameH*.88,'#52677b',1,[4,4]);if(v.sockets){x.fillStyle='#8ce3ae';x.beginPath();x.arc(bx,ground,6,0,7);x.fill();x.beginPath();x.arc(bx,headY+21,6,0,7);x.fill();label('FOOT SOCKET',bx,ground+25,'#8ce3ae');label('HEAD SOCKET',bx,headY+50,'#8ce3ae');line(bx-120,scanY,bx+120,scanY,'#ffd06e',3);label(`SOCKET SCAN ${Math.round(v.phase*100)}%`,bx-132,scanY+4,'#ffd06e','right')}else{line(bx-120,ground-132*v.phase,bx+120,ground-132*v.phase,'#ffd06e',3);label('HARDCODED 6m PAN',bx-130,ground-132*v.phase+4,'#ff7f78','right')}
if(v.comp){const camX=w*.15,camY=ground-25;line(camX,camY,bx,headY+bodyH*.34,'#8ce3ae',2,[7,4]);x.save();x.translate(camX,camY);x.rotate(-v.angle*Math.PI/180);x.fillStyle='#8ce3ae';x.fillRect(-16,-9,25,18);x.restore();label(`LOW ANGLE ${v.angle.toFixed(0)}°`,camX,camY-28,'#8ce3ae')}if(v.fit)label(`BOUND FIT · OCCUPANCY ${v.occupancy.toFixed(0)}%`,frameX+frameW*.5,frameY+20,'#8ce3ae');if(v.short)label(`RETRY ${S.attempt} · SHORT ROAR ONLY`,w*.5,h*.11,'#ffd06e');else if(v.retry)label('FIRST ENCOUNTER FLAG · FULL INTRO',w*.5,h*.11,'#70ceff');if(v.letter){x.fillStyle='rgba(0,0,0,.88)';x.fillRect(0,0,w,h*.075);x.fillRect(0,h*.925,w,h*.075);label(v.control===100?'GAMEPLAY CAMERA / INPUT RESTORED':`HANDOFF ${v.control}%`,w*.5,h*.91,v.control===100?'#8ce3ae':'#ffd06e')}
$('mFit').textContent=v.visible+' / 2';$('mOccupancy').textContent=v.occupancy.toFixed(0)+'%';$('mAngle').textContent=v.angle.toFixed(0)+'°';$('mControl').textContent=v.control+'%';c.dataset.fit=v.visible;c.dataset.control=v.control}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('skip').setAttribute('aria-pressed',String(S.skip));$('live').setAttribute('aria-pressed',String(S.live));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.skip=false;S.live=S.step>=5&&S.attempt>1;S.t=0;update()});$('height').oninput=e=>{S.height=+e.target.value;$('heightOut').textContent=S.height+' m';update()};$('attempt').oninput=e=>{S.attempt=+e.target.value;$('attemptOut').textContent=S.attempt+'회';if(S.step>=5)S.live=S.attempt>1;update()};$('skip').onclick=()=>{S.skip=!S.skip;update()};$('live').onclick=()=>{S.live=!S.live;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
