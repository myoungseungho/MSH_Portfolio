<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q21 리플렉션 프로브 단계형 실험실</title>
<style>
:root{--bg:#090d13;--panel:#121a25;--line:#2b394b;--ink:#edf3fa;--muted:#94a5b9;--amber:#ffca68;--cyan:#65d7e6;--red:#ff7077}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#080c12}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--amber)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171106}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6e8096;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="곡면 반사의 화면·평면 한계를 지나 6면 큐브맵 프로브, 파랄랙스 보정, 러프니스 밉과 SSR 동적 계층을 쌓는 단계"></canvas><div class="hud"><span>Q21 · <b id="stage">SSR·planar의 벽</b></span><span id="status">곡면 사방을 못 채움</span></div></div>
<div class="steps" role="group" aria-label="리플렉션 프로브 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>두 기법의 한계</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>사방 6면 캡처</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>반사 벡터 조회</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>파랄랙스 오류</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>박스 보정·MIP</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>SSR·RT 계층</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="rough">방패 러프니스</label><output id="roughOut">18%</output></div><input id="rough" type="range" min="0" max="100" value="18"></div><div><div class="ct"><label for="offset">프로브에서 거리</label><output id="offsetOut">3.0 m</output></div><input id="offset" type="range" min="0" max="100" value="60"></div><div class="toggles" role="group" aria-label="프로브 위치 및 동적 반사 옵션"><button id="parallax" aria-pressed="false">박스 파랄랙스</button><button id="dynamic" aria-pressed="false">동적 SSR·RT</button></div></div>
<div class="metrics"><div class="m"><small>전방위 커버</small><strong id="mCover">41%</strong></div><div class="m"><small>벽 정렬 오차</small><strong id="mError">—</strong></div><div class="m"><small>움직이는 캐릭터</small><strong id="mActor">없음</strong></div><div class="m"><small>프로브 캡처</small><strong id="mCapture">0 faces</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,rough:.18,offset:.60,parallax:false,dynamic:false},names=['SSR·planar의 벽','큐브맵 프로브','reflect(V,N) 샘플','한 점 기준 위치 오류','박스 교차 재투영 + MIP','프로브 + SSR + RT'];
const desc=['<b>문제 재현:</b> SSR은 화면 밖·뒤쪽을 못 담고 planar는 평면 한 방향만 맞습니다. 곡면 방패의 픽셀마다 다른 반사 방향을 사방으로 채울 재료가 없습니다.','<b>환경을 미리 저장:</b> 방 한가운데 프로브를 두고 +X·−X·+Y·−Y·+Z·−Z 여섯 방향을 렌더해 큐브맵으로 굽습니다. 화면 밖 벽과 천장까지 모두 들어갑니다.','<b>방향으로 조회:</b> 방패 픽셀마다 시선과 노멀로 반사 벡터를 구하고 큐브맵의 해당 방향을 읽습니다. 곡면을 따라 환경이 휘어 흐르지만 런타임에는 텍스처 조회뿐입니다.','<b>한 점의 한계:</b> 큐브맵은 프로브 위치에서 찍힌 스냅샷입니다. 방패가 멀어질수록 벽·기둥 반사가 실제 위치와 미끄러지고, 움직이는 캐릭터도 구운 맵에는 없습니다. 거리 슬라이더로 오차를 키워 보세요.','<b>실내에 붙이기:</b> 반사 벡터를 방의 박스 볼륨과 교차시켜 실제 벽 지점으로 재투영합니다. 러프니스는 미리 필터한 큐브맵 MIP를 골라 선명한 금속부터 흐린 광택까지 값싸게 만듭니다.','<b>최종 계층:</b> 정적 사방 배경은 로컬 프로브, 화면 안 움직이는 캐릭터는 SSR, 화면 밖 고정밀 동적 반사는 RT가 채웁니다. 방별 프로브 볼륨과 블렌드가 실내·실외 누출을 막습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#eef3fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function cubeCross(w,h){const s=27,ox=w*.72,oy=h*.11,cols=['#ad6a57','#527d91','#8170a0','#5f8a6b','#aa8a53','#5c6577'],labs=['+X','-X','+Y','-Y','+Z','-Z'],pos=[[2,1],[0,1],[1,0],[1,2],[1,1],[3,1]];for(let i=0;i<6;i++){const px=ox+pos[i][0]*s,py=oy+pos[i][1]*s;x.fillStyle=cols[i];x.fillRect(px,py,s-2,s-2);x.fillStyle='#eef3fa';x.font='600 8px ui-monospace,monospace';x.fillText(labs[i],px+6,py+16)}tag('CUBEMAP · 6 FACES',ox,oy-6,'#65d7e6')}
function actor(px,py,ref=false){x.strokeStyle=ref?'#65d7e6':'#eef3fa';x.lineWidth=4;x.beginPath();x.arc(px,py-24,6,0,7);x.stroke();x.beginPath();x.moveTo(px,py-17);x.lineTo(px,py);x.moveTo(px,py-10);x.lineTo(px-10,py-3);x.moveTo(px,py-10);x.lineTo(px+10,py-3);x.stroke()}
function shield(w,h){const cx=w*.48,cy=h*.52,r=Math.min(w*.19,h*.34),shift=S.step===3&&!S.parallax?S.offset*r*.72:S.offset*r*.08;x.save();x.beginPath();x.ellipse(cx,cy,r*.82,r,0,0,7);x.clip();const g=x.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,'#26384b');g.addColorStop(.32,'#bd7658');g.addColorStop(.58,'#506d82');g.addColorStop(1,'#202835');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);x.filter=`blur(${S.step>=4?S.rough*7:0}px)`;x.strokeStyle='rgba(245,231,198,.72)';x.lineWidth=9;for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(cx-r+shift+i*r*.34,cy-r);x.quadraticCurveTo(cx+shift+i*r*.14,cy,cx-r*.4+shift+i*r*.34,cy+r);x.stroke()}x.fillStyle='rgba(101,215,230,.40)';x.fillRect(cx-r,cy-r*.18+shift*.15,r*2,r*.17);if(S.step===0){x.fillStyle='rgba(5,8,13,.72)';x.fillRect(cx,cy-r,r,2*r);x.fillStyle='rgba(255,112,119,.34)';x.fillRect(cx-r,cy+r*.25,2*r,r*.75)}if(S.dynamic&&S.step>=5)actor(cx+r*.18,cy+r*.30,true);x.restore();x.filter='none';x.strokeStyle='#c8d0d8';x.lineWidth=6;x.beginPath();x.ellipse(cx,cy,r*.82,r,0,0,7);x.stroke();x.strokeStyle='#66798a';x.lineWidth=2;x.beginPath();x.ellipse(cx,cy,r*.70,r*.86,0,0,7);x.stroke();return[cx,cy,r]}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#2a3441');bg.addColorStop(.48,'#171f29');bg.addColorStop(1,'#342921');x.fillStyle=bg;x.fillRect(0,0,w,h);x.strokeStyle='#516272';x.lineWidth=2;x.strokeRect(w*.07,h*.13,w*.84,h*.72);x.strokeStyle='#81634d';for(const px of [w*.18,w*.79])x.strokeRect(px,h*.18,w*.05,h*.62);x.fillStyle='#ffb04f';x.beginPath();x.arc(w*.83,h*.33,12,0,7);x.fill();actor(w*.28,h*.73,false);
if(S.step===0){tag('SSR: 뒤·화면 밖 MISS',w*.08,h*.20,'#ff7077');tag('PLANAR: 곡면 방향 불일치',w*.62,h*.79,'#ff7077')}
if(S.step>=1)cubeCross(w,h);const [cx,cy,r]=shield(w,h);
if(S.step>=2){x.strokeStyle='#65d7e6';x.lineWidth=2;for(const a of [-.8,-.2,.45]){x.beginPath();x.moveTo(cx+Math.cos(a)*r*.7,cy+Math.sin(a)*r*.7);x.lineTo(cx+Math.cos(a)*r*1.45,cy+Math.sin(a)*r*1.45);x.stroke()}tag('R = reflect(V,N) → CUBEMAP',w*.07,h*.88,'#65d7e6')}
if(S.step===3){x.strokeStyle='#ff7077';x.lineWidth=3;x.setLineDash([5,4]);x.beginPath();x.moveTo(w*.20+S.offset*80,h*.15);x.lineTo(w*.20+S.offset*80,h*.84);x.stroke();x.setLineDash([]);tag('벽 반사가 물체와 함께 미끄러짐',w*.58,h*.69,'#ff7077')}
if(S.step>=4){x.strokeStyle=S.parallax?'#65d7e6':'#ff7077';x.lineWidth=2;x.strokeRect(w*.07,h*.13,w*.84,h*.72);tag(S.parallax?'BOX HIT → REPROJECT':'PARALLAX OFF',w*.08,h*.29,S.parallax?'#65d7e6':'#ff7077');tag(`PREFILTERED MIP ${Math.round(S.rough*5)}`,w*.67,h*.58,'#ffca68')}
if(S.step>=5){tag('STATIC · LOCAL PROBE',w*.08,h*.38,'#ffca68');tag(S.dynamic?'DYNAMIC · SSR / RT':'DYNAMIC ACTOR MISSING',w*.68,h*.43,S.dynamic?'#65d7e6':'#ff7077');x.fillStyle='#65d7e6';x.fillRect(w*.08,h*.42,w*.19,5);x.fillStyle='#ffca68';x.fillRect(w*.08,h*.45,w*.32,5)}}
function metrics(){const hasProbe=S.step>=1,err=S.step<3?0:S.parallax?Math.max(.5,S.offset*1.2):S.offset*18;$('mCover').textContent=S.step===0?'41%':hasProbe?'100%':'41%';$('mError').textContent=S.step<3?'—':err.toFixed(1)+' cm';$('mActor').textContent=S.step>=5&&S.dynamic?'SSR / RT':'없음';$('mCapture').textContent=hasProbe?'6 faces':'0 faces'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['곡면 사방을 못 채움','상하좌우앞뒤 저장','픽셀마다 방향 조회','위치가 멀수록 미끄러짐','방 형상에 반사 고정','정적·동적 역할 분담'][S.step];$('parallax').setAttribute('aria-pressed',String(S.parallax));$('dynamic').setAttribute('aria-pressed',String(S.dynamic));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===3)S.parallax=false;if(S.step>=4)S.parallax=true;S.dynamic=S.step===5;ui()});$('rough').oninput=e=>{S.rough=+e.target.value/100;$('roughOut').textContent=e.target.value+'%';ui()};$('offset').oninput=e=>{S.offset=+e.target.value/100;$('offsetOut').textContent=(S.offset*5).toFixed(1)+' m';ui()};$('parallax').onclick=()=>{S.parallax=!S.parallax;ui()};$('dynamic').onclick=()=>{S.dynamic=!S.dynamic;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
