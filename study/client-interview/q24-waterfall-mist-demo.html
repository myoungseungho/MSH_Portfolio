<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q24 폭포 물보라·미스트 단계형 실험실</title>
<style>
:root{--bg:#080d13;--panel:#111a25;--line:#2a3a4c;--ink:#edf4fa;--muted:#93a6ba;--cyan:#62d7e7;--foam:#eef8ef;--amber:#ffd06b;--red:#ff7178}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#07101a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#061316}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6d8197;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="폭포의 빌보드 물보라를 GPU 물방울, 소프트 접점, 볼류메트릭 미스트와 조명·반해상도 예산으로 분리하는 단계"></canvas><div class="hud"><span>Q24 · <b id="stage">물보라 카드 몇 장</b></span><span id="status">판때기·하드 접점</span></div></div>
<div class="steps" role="group" aria-label="폭포 물보라 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>빌보드 한 겹</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>GPU 물방울</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>오버드로우 벽</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>소프트 접점</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>볼류메트릭 미스트</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>조명·반해상도</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="particles">물방울 파티클</label><output id="particlesOut">6K</output></div><input id="particles" type="range" min="2" max="40" value="6"></div><div><div class="ct"><label for="mist">미스트 밀도</label><output id="mistOut">35%</output></div><input id="mist" type="range" min="0" max="100" value="35"></div><div class="toggles" role="group" aria-label="파티클 접점과 볼류메트릭 옵션"><button id="soft" aria-pressed="false">깊이 소프트</button><button id="volume" aria-pressed="false">볼륨·씬 조명</button></div></div>
<div class="metrics"><div class="m"><small>중심 오버드로우</small><strong id="mOverdraw">3×</strong></div><div class="m"><small>바위 교차 절단</small><strong id="mCut">12 px</strong></div><div class="m"><small>부피 미스트</small><strong id="mVolume">0%</strong></div><div class="m"><small>폭포 효과 GPU</small><strong id="mGpu">0.8 ms</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,particles:6,mist:.35,soft:false,volume:false},names=['물보라 카드 몇 장','GPU 중력·난류 입자','반투명 오버드로우','scene depth 소프트 파티클','프록셀 볼류메트릭 미스트','씬 조명 + ½ res + LOD'];
const desc=['<b>문제 재현:</b> 하얀 빌보드 몇 장은 카메라를 따라 돌고 바위와 칼같이 교차합니다. 굵은 물방울과 뿌연 안개를 한 텍스처에 뭉쳐 부피도 스케일도 없습니다.','<b>근거리 물방울:</b> 충돌 지점에서 수천 입자를 GPU로 스폰해 중력·난류·수명과 바위 반사를 계산합니다. 각 방울이 다른 포물선을 그려 가까이서도 개별 비산이 살아납니다.','<b>새 병목:</b> 안개까지 작은 반투명 입자로 채우면 같은 픽셀을 수십 번 블렌딩합니다. 파티클 수를 올려 중심 오버드로우와 GPU 비용이 얼마나 뛰는지 보세요.','<b>접점 녹이기:</b> 파티클 깊이와 뒤 씬 깊이가 가까울수록 알파를 0으로 낮춥니다. 바위·바닥과의 하드 절단과 카메라 관통이 스르륵 사라집니다.','<b>부피는 다른 도구:</b> 굵은 방울은 그대로 두고 뿌연 공기는 국소 프록셀 밀도에 넣어 레이마칭합니다. 많은 카드 없이도 공간을 채우고 빛줄기가 통과할 3D 매질이 생깁니다.','<b>장면과 예산에 통합:</b> 물방울·미스트가 태양·환경광을 받아 석양색과 음영을 얻습니다. 파티클은 반해상도, 거리 LOD·컬링으로 그리고 큰 안개는 볼륨이 맡아 필레이트를 회수합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#edf4fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function droplet(px,py,r,a,lit){x.fillStyle=lit?`rgba(255,216,170,${a})`:`rgba(220,245,248,${a})`;x.beginPath();x.ellipse(px,py,r*.6,r*1.5,-.25,0,7);x.fill()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,fallX=w*.46,impactY=h*.75;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#263d43');bg.addColorStop(1,'#111c25');x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle='#313934';x.beginPath();x.moveTo(0,h*.18);x.lineTo(w*.32,h*.26);x.lineTo(w*.37,h);x.lineTo(0,h);x.closePath();x.fill();x.beginPath();x.moveTo(w*.64,h*.20);x.lineTo(w,h*.12);x.lineTo(w,h);x.lineTo(w*.58,h);x.closePath();x.fill();x.fillStyle='#19465a';x.fillRect(0,h*.81,w,h*.19);
// waterfall sheet
const wg=x.createLinearGradient(fallX-60,0,fallX+80,0);wg.addColorStop(0,'rgba(170,225,235,.15)');wg.addColorStop(.5,'rgba(225,249,250,.72)');wg.addColorStop(1,'rgba(130,207,224,.18)');x.fillStyle=wg;x.beginPath();x.moveTo(fallX-45,0);x.lineTo(fallX+55,0);x.lineTo(fallX+78,impactY);x.lineTo(fallX-68,impactY);x.closePath();x.fill();x.strokeStyle='rgba(220,248,250,.35)';for(let i=0;i<8;i++){x.beginPath();x.moveTo(fallX-38+i*13,0);x.bezierCurveTo(fallX-55+i*14,h*.25,fallX-30+i*12,h*.55,fallX-55+i*18,impactY);x.stroke()}
if(S.step===0){for(let i=0;i<3;i++){x.fillStyle='rgba(235,247,245,.26)';x.fillRect(fallX-130+i*75,impactY-95+i*14,170,95)}x.strokeStyle='#ff7178';x.lineWidth=3;x.beginPath();x.moveTo(fallX-130,impactY);x.lineTo(fallX+150,impactY);x.stroke();tag('BILLBOARD PLANES',fallX-120,impactY-110,'#ff7178');tag('HARD ROCK CUT',fallX+75,impactY+18,'#ff7178')}
if(S.step>=1){const count=Math.round(70+S.particles*7);for(let i=0;i<count;i++){const t=(i%37)/36,side=i%2?-1:1,seed=(i*47)%101/101,px=fallX+side*(18+t*(48+S.particles*2.3))+Math.sin(i*2.7)*15,py=impactY-t*(78+seed*95)+t*t*68,nearRock=py>impactY-12,a=S.soft&&nearRock?Math.max(0,(impactY-py)/12):.20+seed*.44;droplet(px,py,1.2+seed*2.8,a,S.step>=5&&S.volume)}tag('GPU: GRAVITY · TURBULENCE · LIFE',w*.06,h*.24,'#62d7e7')}
if(S.step===2&&!S.soft){x.fillStyle='rgba(255,113,120,.16)';x.fillRect(fallX-120,impactY-145,240,155);tag(`${Math.round(2+S.particles*.55)}× TRANSPARENT OVERDRAW`,fallX-92,impactY-125,'#ff7178');x.strokeStyle='#ff7178';x.lineWidth=4;x.beginPath();x.moveTo(fallX-110,impactY);x.lineTo(fallX+120,impactY);x.stroke()}
if(S.step>=3){tag(S.soft?'DEPTH Δ → ALPHA FADE':'SOFT PARTICLE OFF',fallX-90,impactY+26,S.soft?'#62d7e7':'#ff7178')}
if(S.step>=4&&S.volume){const a=.12+S.mist*.34;for(let i=5;i>=0;i--){const g=x.createRadialGradient(fallX+(i-2)*18,impactY-50-i*12,0,fallX+(i-2)*18,impactY-50-i*12,85+i*18);g.addColorStop(0,`rgba(210,232,230,${a/(i+1)*2.1})`);g.addColorStop(1,'rgba(210,232,230,0)');x.fillStyle=g;x.fillRect(fallX-190,impactY-230,380,240)}tag('LOCAL FROXEL DENSITY · RAYMARCH',w*.63,h*.47,'#62d7e7')}
if(S.step>=5&&S.volume){x.save();x.globalCompositeOperation='screen';for(let i=0;i<4;i++){const g=x.createLinearGradient(w*.78,h*.03,w*.35,h*.82);g.addColorStop(0,'rgba(255,203,130,.20)');g.addColorStop(1,'rgba(255,203,130,0)');x.fillStyle=g;x.beginPath();x.moveTo(w*.72+i*24,0);x.lineTo(fallX-80+i*30,impactY);x.lineTo(fallX-30+i*30,impactY);x.lineTo(w*.76+i*24,0);x.fill()}x.restore();tag('SUN LIGHTING · 6-DIR APPROX',w*.68,h*.18,'#ffd06b');tag('½ RES PARTICLES · DISTANCE LOD',w*.06,h*.90,'#ffd06b')}}
function metrics(){const over=S.step===0?3:S.step>=5?Math.max(2,Math.round(1+S.particles*.18)):Math.round(2+S.particles*.55),cut=S.step>=3&&S.soft?0:12,vol=S.step>=4&&S.volume?Math.round(S.mist*100):0;let gpu=S.step===0?.8:.55+S.particles*.095;if(S.step>=4&&S.volume)gpu+=.75+S.mist*1.2;if(S.step>=5)gpu*=.48;$('mOverdraw').textContent=over+'×';$('mCut').textContent=cut+' px';$('mVolume').textContent=vol+'%';$('mGpu').textContent=gpu.toFixed(1)+' ms'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['판때기·하드 접점','개별 비산','필레이트 포화','바위에 스며듦','공간을 채우는 안개','축축하고 빛나는 공기'][S.step];$('soft').setAttribute('aria-pressed',String(S.soft));$('volume').setAttribute('aria-pressed',String(S.volume));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===2){S.particles=28;$('particles').value=28;$('particlesOut').textContent='28K'}S.soft=S.step>=3;S.volume=S.step>=4;ui()});$('particles').oninput=e=>{S.particles=+e.target.value;$('particlesOut').textContent=e.target.value+'K';ui()};$('mist').oninput=e=>{S.mist=+e.target.value/100;$('mistOut').textContent=e.target.value+'%';ui()};$('soft').onclick=()=>{S.soft=!S.soft;ui()};$('volume').onclick=()=>{S.volume=!S.volume;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
