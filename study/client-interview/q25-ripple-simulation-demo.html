<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q25 웅덩이 파문 시뮬레이션 단계형 실험실</title>
<style>
:root{--bg:#080d13;--panel:#111a25;--line:#2a3a4c;--ink:#edf4fa;--muted:#93a6ba;--cyan:#62d7e7;--pink:#ff6eb4;--amber:#ffd06b;--red:#ff7178}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#07101a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#061316}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6d8197;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="독립 동심원 텍스처에서 핑퐁 높이장 파동, 간섭·경계 반사, 높이 기울기 노멀과 통합 임펄스까지 쌓는 웅덩이 파문 단계"></canvas><div class="hud"><span>Q25 · <b id="stage">독립 동심원 텍스처</b></span><span id="status">겹쳐도 상호작용 없음</span></div></div>
<div class="steps" role="group" aria-label="웅덩이 파문 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>링 텍스처</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>핑퐁 높이장</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>파동·간섭</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>높이만 존재</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>기울기 노멀</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>통합 소스·거리</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="damping">파동 감쇠</label><output id="dampingOut">96%</output></div><input id="damping" type="range" min="75" max="99" value="96"></div><div><div class="ct"><label for="rain">초당 빗방울 임펄스</label><output id="rainOut">12개</output></div><input id="rain" type="range" min="2" max="30" value="12"></div><div class="toggles" role="group" aria-label="경계 반사와 노멀 출력 옵션"><button id="reflect" aria-pressed="false">웅덩이 경계 반사</button><button id="normal" aria-pressed="false">높이→노멀</button></div></div>
<div class="metrics"><div class="m"><small>활성 임펄스</small><strong id="mImpulse">3</strong></div><div class="m"><small>잔존 파동 에너지</small><strong id="mEnergy">0%</strong></div><div class="m"><small>간섭 교차점</small><strong id="mInterference">0</strong></div><div class="m"><small>네온 왜곡</small><strong id="mNeon">0 px</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,damping:.96,rain:12,reflect:false,normal:false},names=['독립 동심원 텍스처','Height A ↔ Height B','2D wave equation','높이 숫자만 있는 물','∇height → normal','비·발·검 임펄스 + 거리 LOD'];
const desc=['<b>문제 재현:</b> 미리 그린 링이 각각 커지고 사라질 뿐 두 파문이 만나도 알파로 겹칩니다. 간섭 무늬도 벽 반사도 없고 폭우에서는 동시 재생 수가 모자랍니다.','<b>상태를 기억하기:</b> 웅덩이 위에 현재·이전 높이 텍스처 두 장을 두고 매 프레임 역할을 교환합니다. 빗방울은 해당 UV에 높이 임펄스 하나만 찍습니다.','<b>이웃으로 전파:</b> 상하좌우 높이의 라플라시안과 이전 높이로 다음 프레임을 계산합니다. 파동끼리 더하고 상쇄되는 간섭이 생기며, 마스크 경계에서는 자연히 되돌아옵니다.','<b>새 문제:</b> 높이장은 GPU 안의 숫자라 그대로는 젖은 표면의 빛을 바꾸지 않습니다. 파동 계산은 돌지만 네온 반사와 굴절은 여전히 곧은 선입니다.','<b>빛으로 번역:</b> 좌우·상하 높이 차로 표면 기울기와 노멀을 만들고 수면 머티리얼에 합칩니다. 파문마다 네온 하이라이트가 잘게 꺾여 높이장이 보이는 물결이 됩니다.','<b>하나의 입력 인터페이스:</b> 작은 랜덤 비, 큰 발 접지, 긴 검·투사체가 모두 같은 버퍼에 반경·세기만 다른 임펄스를 찍습니다. 근거리만 정밀 시뮬하고 원거리는 통계 노멀로 블렌드합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#edf4fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
const sources=[[-.22,-.10,.29],[.13,.06,.24],[.29,-.18,.19],[-.05,.24,.15]];
function rings(cx,cy,rx,ry,sim){const count=Math.min(6,2+Math.round(S.rain/7));for(let s=0;s<count;s++){const src=sources[s%sources.length],sx=cx+src[0]*rx*2,sy=cy+src[1]*ry*2;for(let i=1;i<=4;i++){const r=(src[2]*i+.10)*Math.min(rx,ry)*(sim?1.15:1);x.strokeStyle=sim?`rgba(${s%2?'98,215,231':'255,110,180'},${.46/i*S.damping})`:`rgba(180,225,235,${.52/i})`;x.lineWidth=sim?1.7:2.5;x.beginPath();x.ellipse(sx,sy,r,r*.58,0,0,7);x.stroke()}}}
function buffers(w,h){const ix=w*.72,iy=h*.08,iw=w*.23,ih=h*.27;x.fillStyle='#071019';x.fillRect(ix,iy,iw,ih);x.strokeStyle='#62d7e7';x.strokeRect(ix,iy,iw,ih);x.fillStyle='#173b55';x.fillRect(ix+10,iy+25,iw*.39,ih-36);x.fillStyle='#254e67';x.fillRect(ix+iw*.53,iy+25,iw*.39,ih-36);for(let i=0;i<5;i++){x.strokeStyle=i%2?'#ff6eb4':'#62d7e7';x.beginPath();x.arc(ix+iw*(i%2?.72:.28),iy+ih*.60,7+i*6,0,7);x.stroke()}tag('HEIGHT PREV',ix+12,iy+17,'#ff6eb4');tag('HEIGHT CURR',ix+iw*.55,iy+17,'#62d7e7')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.48,cy=h*.51,rx=w*.40,ry=h*.35;x.clearRect(0,0,w,h);x.fillStyle='#2b2d35';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){x.fillStyle=`rgba(90,94,105,${.10+(i%4)*.03})`;x.fillRect((i*83)%w,(i*47)%h,3+(i%5),2)}x.fillStyle='#082c40';x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill();x.strokeStyle='#506a73';x.lineWidth=5;x.stroke();
if(S.step===0){rings(cx,cy,rx,ry,false);tag('INDEPENDENT ALPHA RINGS',w*.08,h*.27,'#ff7178');x.strokeStyle='#ff7178';x.beginPath();x.moveTo(cx-30,cy);x.lineTo(cx+45,cy);x.stroke();tag('NO INTERFERENCE',cx-40,cy+32,'#ff7178')}
if(S.step>=1)buffers(w,h);
if(S.step===1){for(let i=0;i<Math.min(12,S.rain);i++){x.fillStyle='#ffd06b';x.beginPath();x.arc(cx+(i%4-1.5)*55,cy+(Math.floor(i/4)-1)*45,3,0,7);x.fill()}tag('IMPULSE → CURRENT HEIGHT',w*.08,h*.80,'#ffd06b')}
if(S.step===2){rings(cx,cy,rx,ry,true);for(let i=0;i<12;i++){x.fillStyle=i%2?'rgba(255,110,180,.30)':'rgba(98,215,231,.30)';x.beginPath();x.arc(cx-80+(i%4)*55,cy-50+Math.floor(i/4)*50,8,0,7);x.fill()}tag('ADD / CANCEL · INTERFERENCE',w*.32,h*.78,'#62d7e7');if(S.reflect){x.strokeStyle='#ffd06b';x.lineWidth=2;for(let i=0;i<5;i++){x.beginPath();x.arc(cx-rx*.72,cy+(i-2)*34,10+i*7,-1.2,1.2);x.stroke()}tag('MASK BOUNDARY REFLECTION',w*.08,h*.50,'#ffd06b')}}
if(S.step===3){x.fillStyle='rgba(10,35,50,.80)';x.beginPath();x.ellipse(cx,cy,rx*.72,ry*.62,0,0,7);x.fill();x.strokeStyle='#ff6eb4';x.lineWidth=2;x.beginPath();x.moveTo(w*.13,h*.72);for(let i=0;i<150;i++)x.lineTo(w*.13+i*2.5,h*.72-Math.sin(i*.33)*Math.exp(-i/95)*22);x.stroke();tag('HEIGHT VALUES CHANGE · MATERIAL NORMAL 0',w*.16,h*.68,'#ff7178');x.strokeStyle='#ff6eb4';x.lineWidth=6;x.beginPath();x.moveTo(w*.24,h*.28);x.lineTo(w*.70,h*.28);x.stroke();tag('NEON REFLECTION STAYS STRAIGHT',w*.30,h*.24,'#ff6eb4')}
if(S.step>=4){rings(cx,cy,rx,ry,true);if(S.normal){x.strokeStyle='#ff6eb4';x.lineWidth=6;x.beginPath();for(let i=0;i<150;i++){const px=w*.20+i*3.2,py=h*.27+Math.sin(i*.31)*8*S.damping+Math.sin(i*.13)*5;x.lineTo(px,py)}x.stroke();tag('NEON × RIPPLE NORMAL',w*.32,h*.22,'#ff6eb4');for(let i=0;i<13;i++){const px=cx-rx*.55+i*rx*.09,py=cy+Math.sin(i*.9)*35;x.strokeStyle='#62d7e7';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.sin(i)*10,py-16);x.stroke()}}}
if(S.step>=5){x.fillStyle='#ffd06b';x.beginPath();x.ellipse(cx-rx*.30,cy+ry*.15,24,11,0,0,7);x.fill();tag('FOOT · LARGE IMPULSE',cx-rx*.42,cy+ry*.30,'#ffd06b');x.strokeStyle='#eef4fa';x.lineWidth=4;x.beginPath();x.moveTo(cx+rx*.12,cy-ry*.35);x.lineTo(cx+rx*.37,cy-ry*.06);x.stroke();tag('BLADE · LINE IMPULSE',cx+rx*.12,cy-ry*.43,'#eef4fa');x.setLineDash([5,4]);x.strokeStyle='#62d7e7';x.strokeRect(w*.08,h*.12,w*.62,h*.76);x.setLineDash([]);tag('NEAR SIM · WORLD SNAP',w*.09,h*.87,'#62d7e7');tag('FAR · STATISTICAL NORMAL',w*.73,h*.78,'#ffd06b')}}
function metrics(){const active=S.step>=1?Math.min(30,S.rain+(S.step>=5?2:0)):3,energy=S.step>=2?Math.round((S.damping-.75)/.24*88):0,cross=S.step>=2?Math.round(S.rain*.75):0,neon=S.step>=4&&S.normal?Math.round(4+S.damping*12):0;$('mImpulse').textContent=String(active);$('mEnergy').textContent=energy+'%';$('mInterference').textContent=String(cross);$('mNeon').textContent=neon+' px'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['겹쳐도 상호작용 없음','이전·현재 상태 저장','겹침·상쇄·되돌아옴','계산돼도 빛은 평평','네온이 잘게 꺾임','모든 충격을 한 버퍼로'][S.step];$('reflect').setAttribute('aria-pressed',String(S.reflect));$('normal').setAttribute('aria-pressed',String(S.normal));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.reflect=S.step>=2;S.normal=S.step>=4;ui()});$('damping').oninput=e=>{S.damping=+e.target.value/100;$('dampingOut').textContent=e.target.value+'%';ui()};$('rain').oninput=e=>{S.rain=+e.target.value;$('rainOut').textContent=e.target.value+'개';ui()};$('reflect').onclick=()=>{S.reflect=!S.reflect;ui()};$('normal').onclick=()=>{S.normal=!S.normal;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
