<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q63 콤보 입력 버퍼 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="애니메이션 끝 한 프레임 입력 확인 실패에서 타임스탬프 버퍼, 캔슬 윈도, 콤보 상태 머신, 블렌드와 1회 소비, 클라이언트 예측까지 발전하는 콤보 입력 실험"></canvas><div class="hud"><span>Q63 · <b id="stage">끝 프레임에서만 버튼 확인</b></span><span id="status">조금 일찍 누른 입력이 흔적 없이 사라짐</span></div></div>
<div class="steps" role="group" aria-label="콤보 입력 처리 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>끝 프레임 폴링</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>타임스탬프 버퍼</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>캔슬 윈도</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>콤보 상태</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>블렌드·1회 소비</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>클라 예측</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="press">버튼을 누른 시점</label><output id="pressOut">72%</output></div><input id="press" type="range" min="5" max="100" value="72"></div><div><div class="ct"><label for="lifetime">버퍼 유효 시간</label><output id="lifetimeOut">300 ms</output></div><input id="lifetime" type="range" min="80" max="500" value="300"></div><div class="toggles" role="group" aria-label="캔슬 윈도와 클라이언트 예측 설정"><button id="cancel" aria-pressed="false">캔슬 윈도</button><button id="predict" aria-pressed="false">클라이언트 예측</button></div></div>
<div class="metrics"><div class="m"><small>입력 판정</small><strong id="mResult">유실</strong></div><div class="m"><small>소비 시점의 나이</small><strong id="mAge">—</strong></div><div class="m"><small>다음 콤보 상태</small><strong id="mState">IDLE</strong></div><div class="m"><small>화면 반응 지연</small><strong id="mLatency">280 ms</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,press:72,lifetime:300,cancel:false,predict:false,t:0};
const names=['끝 프레임에서만 버튼 확인','입력과 시간을 큐에 저장','애니메이션 노티파이로 캔슬 개방','상태별 유효 전이만 허용','포즈 블렌드와 입력 1회 소비','즉시 예측·서버 권위 확정'],status=['조금 일찍 누른 입력이 흔적 없이 사라짐','받을 수 있는 순간까지 입력 의도를 보존','회복 전부를 기다리지 않고 자연스럽게 연결','약→강은 허용, 회피→강은 규칙에 따라 차단','중복 발동 없이 다음 자세로 이어짐','화면은 즉시 반응하고 결과는 서버가 판정'];
const desc=['<b>실패 재현:</b> 공격 애니메이션이 완전히 끝나는 한 프레임에서만 버튼 상태를 읽습니다. 슬라이더를 100%보다 조금 앞에 두면 입력은 사라집니다.','<b>의도를 시간과 함께 저장:</b> 버튼이 눌린 순간 action과 timestamp를 큐에 넣고, 다음 동작을 받을 수 있을 때 유효 시간 안의 입력을 꺼냅니다.','<b>언제 이어질지도 데이터입니다:</b> 애니메이션 타임라인의 노티파이가 캔슬 윈도를 열고 닫습니다. 버퍼 입력이 윈도 안에 존재하면 남은 회복을 건너뛰고 전이합니다.','<b>모든 입력을 받지는 않습니다:</b> 콤보 상태 머신이 현재 공격에서 허용된 다음 동작만 선택합니다. 입력 버퍼는 의도를 보관하고 상태 그래프는 규칙을 지킵니다.','<b>보이게 이어지고 한 번만 발동:</b> 전이 시 짧은 포즈 블렌드로 자세가 튀지 않게 하고, 큐에서 소비한 입력은 즉시 제거해 연속 중복 발동을 막습니다.','<b>온라인도 손맛은 먼저:</b> 클라이언트가 버퍼와 캔슬을 즉시 예측해 콤보를 재생하고 서버는 결과만 확정합니다. 토글을 끄면 왕복 지연만큼 화면 반응이 늦어집니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const buffered=S.step>=1,windowed=S.step>=2&&S.cancel,stateful=S.step>=3,consumed=S.step>=4,predicted=S.step>=5&&S.predict,windowStart=windowed?64:100,consumeAt=windowed?Math.max(windowStart,S.press):100,age=Math.max(0,(consumeAt-S.press)*10),within=S.press<=100&&age<=S.lifetime,accepted=buffered?within:S.press>=99,result=accepted?'수락':'유실',state=accepted?(stateful?'LIGHT_2':'ATTACK_2'):'IDLE',latency=S.step>=5?(predicted?16:280):accepted?Math.max(16,(consumeAt-S.press)*10):280;return{buffered,windowed,stateful,consumed,predicted,windowStart,consumeAt,age,accepted,result,state,latency}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),x0=w*.07,x1=w*.93,tw=x1-x0,y=h*.37;x.fillStyle='#102331';x.fillRect(0,0,w,h);label('ATTACK 1 ANIMATION TIMELINE',x0,h*.14,'#70ceff');const phases=[['STARTUP',0,.22,'#465b70'],['ACTIVE',.22,.48,'#ff7f78'],['RECOVERY',.48,1,'#ffd06e']];phases.forEach(p=>{x.fillStyle=p[3];x.fillRect(x0+tw*p[1],y-18,tw*(p[2]-p[1]),36);label(p[0],x0+tw*(p[1]+p[2])/2,y+4,'#f5f8fc','center')});for(let i=0;i<=10;i++){const px=x0+tw*i/10;line(px,y+25,px,y+34,'#52677b',1);label(i*10+'%',px,y+50,'#788ba1','center')}
const pressX=x0+tw*S.press/100;line(pressX,y-67,pressX,y+31,'#70ceff',4);label('BUTTON DOWN',pressX,y-77,'#70ceff','center');if(v.windowed){const ws=x0+tw*v.windowStart/100;x.fillStyle='#8ce3ae44';x.fillRect(ws,y-25,x1-ws,50);line(ws,y-42,ws,y+31,'#8ce3ae',3);label('CANCEL OPEN · NOTIFY',ws,y-52,'#8ce3ae','center')}else{line(x1,y-42,x1,y+31,'#ff7f78',3);label('POLL ONLY HERE',x1,y-52,'#ff7f78','right')}
if(v.buffered){const qx=w*.08,qy=h*.66,qw=w*.33;label('INPUT QUEUE',qx,qy-22,'#70ceff');x.fillStyle=v.accepted?'#8ce3ae':'#ff7f78';x.fillRect(qx,qy,qw,31);label(`ATTACK · t=${S.press}% · age=${v.age}ms`,qx+qw*.5,qy+20,'#f5f8fc','center');line(pressX,y+37,qx+qw*.55,qy-5,v.accepted?'#8ce3ae':'#ff7f78',2,[5,4]);label(v.accepted?'CONSUME ONCE':'EXPIRED / TOO LATE',qx+qw*.5,qy+55,v.accepted?'#8ce3ae':'#ff7f78','center')}
if(v.stateful){const sx=w*.57,sy=h*.61,nodes=[['LIGHT_1',sx,sy],['LIGHT_2',sx+w*.16,sy],['HEAVY',sx+w*.16,sy+h*.13],['DODGE',sx,sy+h*.13]];nodes.forEach(n=>{x.fillStyle=n[0]===v.state?'#ffd06e':'#2d4256';x.beginPath();x.arc(n[1],n[2],27,0,7);x.fill();label(n[0],n[1],n[2]+4,'#f5f8fc','center')});line(sx+29,sy,sx+w*.16-29,sy,v.accepted?'#8ce3ae':'#52677b',3);line(sx+18,sy+22,sx+w*.16-18,sy+h*.13-22,'#52677b',2,[5,4]);if(v.consumed)label('POSE BLEND 80ms · QUEUE POP',sx+w*.08,sy-42,'#8ce3ae','center')}
if(S.step>=5){const ny=h*.87;line(w*.55,ny,w*.91,ny,'#52677b',2);const client=w*.59,server=w*.86;label('CLIENT PREDICT',client,ny-17,v.predicted?'#8ce3ae':'#ff7f78','center');label('SERVER AUTH',server,ny-17,'#ffd06e','center');line(client,ny,server,ny,'#70ceff',3,[6,4]);x.fillStyle=v.predicted?'#8ce3ae':'#ff7f78';x.beginPath();x.arc(v.predicted?client:server,ny,7,0,7);x.fill();label(v.predicted?'16ms RESPONSE · CONFIRM LATER':'WAIT 280ms RTT',w*.725,ny+28,v.predicted?'#8ce3ae':'#ff7f78','center')}c.dataset.result=v.result;c.dataset.state=v.state}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('cancel').setAttribute('aria-pressed',String(S.cancel));$('predict').setAttribute('aria-pressed',String(S.predict));const v=vals();$('mResult').textContent=v.result;$('mAge').textContent=v.accepted?v.age+' ms':'—';$('mState').textContent=v.state;$('mLatency').textContent=v.latency+' ms';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.cancel=S.step>=2;S.predict=S.step>=5;S.t=0;update()});$('press').oninput=e=>{S.press=+e.target.value;$('pressOut').textContent=S.press+'%';update()};$('lifetime').oninput=e=>{S.lifetime=+e.target.value;$('lifetimeOut').textContent=S.lifetime+' ms';update()};$('cancel').onclick=()=>{S.cancel=!S.cancel;update()};$('predict').onclick=()=>{S.predict=!S.predict;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
