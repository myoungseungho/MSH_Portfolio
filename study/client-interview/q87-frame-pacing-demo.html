<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q87 프레임 동기화 실험실</title><style>
:root{--bg:#090d16;--panel:#111827;--line:#33435a;--ink:#f5f7fb;--muted:#9aa9bc;--cyan:#72d8ff;--gold:#ffd16f;--red:#ff7f79;--green:#83e0a8;--violet:#bd9cff}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d1523}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#060910df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8292a6;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="모니터 스캔아웃과 GPU 프레임 제출이 V-Sync, 트리플 버퍼, 프레임 페이싱, VRR로 동기화되는 실험"></canvas><div class="hud"><span>Q87 · <b id="stage">즉시 스왑</b></span><span id="status">스캔아웃 도중 버퍼가 교체되어 화면이 갈라짐</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>즉시 스왑</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>V-Sync</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>60→30 함정</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>트리플 버퍼</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>프레임 페이싱</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>VRR</button></div><p id="explain" class="explain"></p>
<div class="controls"><div><div class="ct"><label for="gpu">GPU 프레임 시간</label><output id="gpuOut">14.0 ms</output></div><input id="gpu" type="range" min="7" max="28" step=".5" value="14"></div><div><div class="ct"><label for="pan">카메라 팬 속도</label><output id="panOut">65%</output></div><input id="pan" type="range" min="10" max="100" value="65"></div><div class="toggles"><button id="spike" aria-pressed="false">40ms 스파이크</button><button id="latency" aria-pressed="false">큐 1장 제한</button></div></div>
<div class="metrics"><div class="m"><small>표시 간격</small><strong id="mPresent">14.0 ms</strong></div><div class="m"><small>티어링 선</small><strong id="mTear">1개</strong></div><div class="m"><small>입력→화면 지연</small><strong id="mLatency">14 ms</strong></div><div class="m"><small>1% low</small><strong id="mLow">36 fps</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,gpu:14,pan:.65,spike:false,limit:false};const names=['즉시 스왑','VBlank에서만 교체','16.6ms를 놓친 더블 버퍼','트리플 버퍼로 GPU 대기 제거','일정한 시각에 프레임 내보내기','모니터가 GPU 도착에 맞춰 스캔'];const stats=['스캔아웃 도중 버퍼가 교체되어 화면이 갈라짐','완성된 한 장만 보여 티어링 제거','17ms 한 번이 다음 VBlank까지 33.3ms 대기','대기 중에도 다음 백버퍼를 계속 그림','평균 FPS보다 프레임 간격의 일관성을 제어','47~60fps 사이에서도 반토막 없이 즉시 표시'];const desc=['<b>서로 다른 두 시계:</b> 모니터는 위에서 아래로 훑고 GPU는 준비되는 즉시 스왑합니다. 팬 속도를 높이면 이전·새 프레임의 위치 차이가 커져 찢긴 선이 선명해집니다.','<b>V-Sync:</b> 스캔아웃이 끝나는 VBlank에만 버퍼를 교체합니다. 한 화면에 두 프레임이 섞이지 않지만 완성된 프레임이 기다리므로 지연이 붙습니다.','<b>더블 버퍼의 절벽:</b> 60Hz 예산 16.6ms를 조금만 넘겨도 다음 VBlank까지 기다려 표시 간격이 33.3ms가 됩니다. GPU 시간을 경계 앞뒤로 움직여 보세요.','<b>트리플 버퍼:</b> 표시 대기 중 다른 백버퍼에 다음 장을 그려 30fps 반토막을 완화합니다. 대신 큐가 길면 오래된 입력이 화면에 나옵니다.','<b>프레임 페이싱:</b> 10ms·22ms처럼 들쭉날쭉한 완료 시간을 16.6ms 표시 간격으로 고릅니다. 스파이크를 켜면 평균 FPS가 숨기는 1% low를 볼 수 있습니다.','<b>VRR:</b> 고정 VBlank를 기다리지 않고 프레임이 도착할 때 모니터가 새 스캔을 시작합니다. GPU 시간을 바꿔도 찢김이나 60→30 계단 없이 표시 간격이 따라옵니다.'];
function calc(){let present=S.gpu,tear=S.step===0?1:0,lat=S.gpu,low=Math.round(1000/(S.spike?40:Math.max(S.gpu,16.6)));if(S.step===1||S.step===2){present=S.gpu>16.6?33.3:16.6;lat=present+S.gpu}if(S.step===3){present=S.gpu>16.6?Math.max(16.6,S.gpu):16.6;lat=S.gpu+(S.limit?16.6:33.3)}if(S.step===4){present=16.6;lat=16.6+(S.limit?8:20)}if(S.step===5){present=Math.max(8.3,Math.min(25,S.gpu));lat=present+(S.limit?4:10)}if(S.spike)low=25;return{present,tear,lat,low}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),top=h*.09,bottom=h*.61,split=top+(bottom-top)*.52;x.fillStyle='#101b2d';x.fillRect(0,0,w,h);x.save();x.beginPath();x.rect(w*.04,top,w*.92,bottom-top);x.clip();let shift=S.pan*w*.23;x.fillStyle='#182a3d';x.fillRect(w*.04,top,w*.92,bottom-top);for(let i=-2;i<8;i++){let bx=i*w*.19-shift%(w*.19);x.fillStyle=i%2?'#49789c':'#355e80';x.fillRect(bx,top+45,w*.12,bottom-top-45);x.fillStyle='#72d8ff';x.fillRect(bx+18,top+18,w*.06,28)}if(V.tear){x.fillStyle='#101b2d';x.fillRect(w*.04,split,w*.92,bottom-split);for(let i=-2;i<8;i++){let bx=i*w*.19-(shift+w*.08)%(w*.19);x.fillStyle=i%2?'#49789c':'#355e80';x.fillRect(bx,split,w*.12,bottom-split);x.fillStyle='#72d8ff';x.fillRect(bx+18,split,w*.06,28)}x.fillStyle='#ff7f79';x.fillRect(w*.04,split-2,w*.92,4);x.fillText('SWAP DURING SCANOUT',w*.68,split-8)}x.restore();x.strokeStyle='#607690';x.strokeRect(w*.04,top,w*.92,bottom-top);let chartY=h*.72,chartH=h*.18;x.strokeStyle='#33435a';for(let i=0;i<7;i++){let px=w*.08+i*w*.135;x.beginPath();x.moveTo(px,chartY-14);x.lineTo(px,chartY+chartH);x.stroke();x.fillStyle='#9aa9bc';x.font='9px ui-monospace,Consolas,monospace';x.fillText((i*16.6).toFixed(0)+'ms',px-10,chartY+chartH+13)}for(let i=0;i<6;i++){let jitter=S.step===4?0:(i%2?5:-4),gap=S.step===5?V.present:S.step>=3?V.present:V.present+(i%2?jitter:0),px=w*.08+i*w*.135+gap/33*w*.04;x.fillStyle=S.spike&&i===3?'#ff7f79':S.step===5?'#83e0a8':'#ffd16f';x.fillRect(px,chartY,5,chartH*.72);x.fillText('P'+i,px-5,chartY-5)}$('mPresent').textContent=V.present.toFixed(1)+' ms';$('mTear').textContent=V.tear+'개';$('mLatency').textContent=Math.round(V.lat)+' ms';$('mLow').textContent=V.low+' fps';c.dataset.present=V.present.toFixed(1);c.dataset.tear=V.tear;c.dataset.latency=Math.round(V.lat);c.dataset.low=V.low}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('spike').setAttribute('aria-pressed',String(S.spike));$('latency').setAttribute('aria-pressed',String(S.limit));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.limit=S.step>=5;update()});$('gpu').oninput=e=>{S.gpu=+e.target.value;$('gpuOut').textContent=S.gpu.toFixed(1)+' ms';draw()};$('pan').oninput=e=>{S.pan=+e.target.value/100;$('panOut').textContent=e.target.value+'%';draw()};$('spike').onclick=()=>{S.spike=!S.spike;update()};$('latency').onclick=()=>{S.limit=!S.limit;update()};update();addEventListener('resize',draw)})();
</script></body></html>
