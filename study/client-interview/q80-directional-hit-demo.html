<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q80 방향·재질 피격 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="히트 위치만 쓰는 고정 피 이펙트에서 표면 노멀, 입사·스윙 벡터, 피지컬 머티리얼, 데칼 프로젝션과 반응 동기화로 발전하는 실험"></canvas><div class="hud"><span>Q80 · <b id="stage">히트 위치에 고정 피 스프라이트</b></span><span id="status">방향과 재질을 버려 무엇을 맞아도 같은 그림</span></div></div>
<div class="steps" role="group" aria-label="방향성 피격 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>위치만 사용</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>히트 정보</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>방향 정렬</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>재질 디스패치</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>데칼 프로젝션</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>반응 동기화</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="normal">표면 노멀 각도</label><output id="normalOut">0°</output></div><input id="normal" type="range" min="-60" max="60" value="0"></div><div><div class="ct"><label for="attack">입사·스윙 각도</label><output id="attackOut">25°</output></div><input id="attack" type="range" min="-70" max="70" value="25"></div><div class="toggles"><button id="material" aria-pressed="false">재질: 금속</button><button id="mode" aria-pressed="false">공격: 총알</button></div></div>
<div class="metrics"><div class="m"><small>소비한 방향 벡터</small><strong id="mVector">고정 카메라</strong></div><div class="m"><small>서피스 디스패치</small><strong id="mEffect">피(오류)</strong></div><div class="m"><small>데칼 정렬 오차</small><strong id="mError">90°</strong></div><div class="m"><small>이펙트·반응 방향차</small><strong id="mSync">불일치</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,S={step:0,normal:0,attack:25,mat:1,melee:false,t:0};
const mats=[{n:'돌',effect:'먼지+파편',col:'#b8ad9d'},{n:'금속',effect:'스파크+탄흔',col:'#70ceff'},{n:'살',effect:'피+상처',col:'#ff7f78'},{n:'목재',effect:'나무 파편',col:'#ffd06e'}];
const names=['히트 위치에 고정 피 스프라이트','위치·노멀·입사·재질을 Hit Result로 전달','입사는 반사 방향, 근접은 스윙 방향으로 방출','Physical Material로 파티클·데칼·사운드 선택','표면 노멀 축으로 데칼 박스 프로젝션','같은 벡터를 VFX·넉백·애님·셰이크가 공유'];
const status=['방향과 재질을 버려 무엇을 맞아도 같은 그림','서로 다른 세 벡터가 화면에 분리되어 보인다','각도 슬라이더가 실제 방출 콘을 회전시킨다','재질 버튼이 반응 세트 전체를 바꾼다','벽이 기울어도 탄흔이 표면에 눕는다','피격의 시각·물리 인과가 한 방향으로 읽힌다'];
const desc=['<b>정보 손실:</b> 히트 위치만 넘겨 카메라를 보는 피 스프라이트를 재생합니다. 금속을 맞혀도 피가 나고 표면을 기울여도 데칼은 공중에 선 채입니다.','<b>세 벡터를 분리:</b> 표면 노멀은 데칼 축, 입사 방향은 총알 반사, 무기 속도는 근접 분사의 기준입니다. 위치와 피지컬 머티리얼까지 하나의 Hit Result로 전달합니다.','<b>방향을 소비:</b> 총알은 입사 벡터를 노멀에 반사한 방향으로 스파크를, 칼은 스윙 벡터 방향으로 피를 방출합니다. 두 각도와 공격 모드를 바꿔 보세요.','<b>무엇을 맞았는가:</b> 피지컬 머티리얼을 데이터 테이블 키로 써 파티클·데칼·사운드 세트를 함께 선택합니다. 재질 버튼으로 금속·살·목재·돌 반응이 실제 바뀝니다.','<b>표면에 귀속:</b> 데칼 프로젝터 축을 노멀에 맞추고 접선 방향으로 눕힙니다. 이제 표면 각도를 움직여도 탄흔·상처가 같은 각도로 따라갑니다.','<b>한 원인의 여러 결과:</b> 같은 히트 방향을 파티클, 넉백 화살표, 히트 리액션과 카메라 킥이 공유합니다. 근접 모드에서는 스윙 벡터가 이 모든 반응의 기준입니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function vec(deg){const a=deg*Math.PI/180;return{x:Math.cos(a),y:-Math.sin(a)}}
function arrow(cx,cy,v,len,col,label){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+v.x*len,cy+v.y*len);x.stroke();const a=Math.atan2(v.y,v.x);x.beginPath();x.moveTo(cx+v.x*len,cy+v.y*len);x.lineTo(cx+v.x*len-Math.cos(a-.55)*9,cy+v.y*len-Math.sin(a-.55)*9);x.lineTo(cx+v.x*len-Math.cos(a+.55)*9,cy+v.y*len-Math.sin(a+.55)*9);x.fill();x.font='600 9px ui-monospace,Consolas,monospace';x.fillText(label,cx+v.x*len+7,cy+v.y*len-5)}
function directions(){const n=vec(S.normal),incoming=vec(S.attack),dot=incoming.x*n.x+incoming.y*n.y,reflect={x:incoming.x-2*dot*n.x,y:incoming.y-2*dot*n.y},swing=vec(S.attack),emit=S.step<2?{x:1,y:0}:S.melee?swing:reflect;return{n,incoming,reflect,swing,emit}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.53,cy=h*.54,D=directions(),m=mats[S.mat],t=S.normal*Math.PI/180,tan={x:-D.n.y,y:D.n.x};x.fillStyle='#0d1726';x.fillRect(0,0,w,h);x.strokeStyle=m.col;x.lineWidth=18;x.beginPath();x.moveTo(cx-tan.x*w*.28,cy-tan.y*w*.28);x.lineTo(cx+tan.x*w*.28,cy+tan.y*w*.28);x.stroke();x.strokeStyle='#ffffff20';x.lineWidth=2;for(let i=-4;i<=4;i++){const q=i*w*.055;x.beginPath();x.moveTo(cx+tan.x*q-D.n.x*9,cy+tan.y*q-D.n.y*9);x.lineTo(cx+tan.x*q+D.n.x*9,cy+tan.y*q+D.n.y*9);x.stroke()}if(S.step>=1){arrow(cx,cy,D.n,85,'#70ceff','NORMAL');arrow(cx,cy,{x:-D.incoming.x,y:-D.incoming.y},105,'#ffd06e','INCIDENT');if(S.melee&&S.step===1)arrow(cx,cy,D.swing,95,'#b89cff','SWING')}else{x.fillStyle='#ff7f78';x.beginPath();x.arc(cx+30,cy-15,28,0,TAU);x.fill()}
if(S.step>=2){const life=(S.t%80)/80;for(let i=0;i<22;i++){const spread=(i-10.5)*.035,base=Math.atan2(D.emit.y,D.emit.x)+spread,dist=18+((i*37+S.t*2)%90);x.fillStyle=S.step>=3?m.col:'#ffd06e';x.globalAlpha=.25+.7*(1-life);x.beginPath();x.arc(cx+Math.cos(base)*dist,cy+Math.sin(base)*dist,1.7+(i%3),0,TAU);x.fill()}x.globalAlpha=1;arrow(cx,cy,D.emit,112,m.col,S.melee?'SWING EMIT':'REFLECT EMIT')}if(S.step>=4){x.save();x.translate(cx,cy);x.rotate(t+Math.PI/2);x.fillStyle=m.n==='금속'?'rgba(20,24,30,.9)':m.n==='살'?'rgba(120,10,20,.75)':'rgba(45,35,25,.75)';x.beginPath();x.ellipse(0,0,20,7,0,0,TAU);x.fill();x.restore()}if(S.step>=5){arrow(cx,cy,{x:-D.emit.x,y:-D.emit.y},72,'#8ce3ae','KNOCKBACK');x.fillStyle='rgba(112,206,255,.12)';x.fillRect(D.emit.x>0?w*.74:w*.08,h*.2,w*.17,h*.58)}x.fillStyle='#f5f8fc';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`${S.melee?'MELEE':'BULLET'} HIT · SURFACE ${m.n}`,w*.39,h*.14);const error=S.step>=4?0:Math.abs(90-S.normal),sync=S.step>=5?'0° 일치':'불일치';$('mVector').textContent=S.step<1?'고정 카메라':S.melee?'스윙':'노멀·입사';$('mEffect').textContent=S.step>=3?m.effect:'피(오류)';$('mError').textContent=error.toFixed(0)+'°';$('mSync').textContent=sync;c.dataset.normal=S.normal;c.dataset.attack=S.attack;c.dataset.emitX=D.emit.x.toFixed(3);c.dataset.emitY=D.emit.y.toFixed(3);c.dataset.material=m.n;c.dataset.effect=S.step>=3?m.effect:'피(오류)';c.dataset.decalError=error.toFixed(1);c.dataset.sync=S.step>=5?'1':'0'}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('material').textContent='재질: '+mats[S.mat].n;$('mode').textContent='공격: '+(S.melee?'칼':'총알');$('material').setAttribute('aria-pressed',String(S.step>=3));$('mode').setAttribute('aria-pressed',String(S.melee));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.t=0;update()});$('normal').oninput=e=>{S.normal=+e.target.value;$('normalOut').textContent=S.normal+'°';S.t=0;update()};$('attack').oninput=e=>{S.attack=+e.target.value;$('attackOut').textContent=S.attack+'°';S.t=0;update()};$('material').onclick=()=>{S.mat=(S.mat+1)%mats.length;S.t=0;update()};$('mode').onclick=()=>{S.melee=!S.melee;S.t=0;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
