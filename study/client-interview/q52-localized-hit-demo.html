<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q52 부위별 파워드 래그돌 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="캐릭터 중심에 같은 힘을 주는 반응에서 본별 히트박스, 방향 리액션, 파워드 래그돌, 부위 임펄스 전파와 고정 물리 틱으로 발전하는 과정"></canvas><div class="hud"><span>Q52 · <b id="stage">중심 임펄스 한 방</b></span><span id="status">어깨를 맞아도 무릎을 맞아도 같은 반응</span></div></div>
<div class="steps" role="group" aria-label="부위별 피격 반응 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>중심 임펄스</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>본 히트박스</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>방향 리액션</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>파워드 래그돌</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>질량 전파</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>고정 틱·예산</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="hit">타격 높이</label><output id="hitOut">82%</output></div><input id="hit" type="range" min="5" max="100" value="82"></div><div><div class="ct"><label for="force">임펄스 세기</label><output id="forceOut">64%</output></div><input id="force" type="range" min="10" max="100" value="64"></div><div class="toggles" role="group" aria-label="부위 물리와 고정 틱 설정"><button id="local" aria-pressed="false">부위별 물리</button><button id="fixed" aria-pressed="false">고정 120Hz+예산</button></div></div>
<div class="metrics"><div class="m"><small>선택된 본</small><strong id="mBone">중심</strong></div><div class="m"><small>맞은 본 꺾임</small><strong id="mDeflect">0°</strong></div><div class="m"><small>애님 포즈 복귀</small><strong id="mRecover">복귀 없음</strong></div><div class="m"><small>솔버 안정성</small><strong id="mStable">가변 틱</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,hit:82,force:64,local:false,fixed:false,t:0};
const names=['중심 임펄스 한 방','본에 붙인 부위별 캡슐','앞·뒤·좌·우 리액션 선택','애님 목표를 좇는 물리 관절','맞은 본에서 관절 체인으로 힘 전파','고정 서브스텝과 활성 예산'],status=['어깨를 맞아도 무릎을 맞아도 같은 반응','어디를 맞았는지 게임이 앎','살아 있는 동안 이동 위에 반응을 얹음','밀렸다가 근육처럼 목표 포즈로 복귀','가벼운 팔과 무거운 몸통이 다르게 반응','프레임 변동에도 PD 힘이 폭주하지 않음'];
const desc=['<b>문제 재현:</b> 모든 타격을 COM에 넣고 애님을 꺼버리면 어느 부위를 맞아도 똑같이 뒤로 넘어지는 관절 풀린 인형이 됩니다.','<b>공간을 의미로 바꾸기:</b> 머리·몸통·팔·다리 캡슐이 맞은 좌표를 본 이름으로 바꿉니다. 타격 높이를 움직여 선택 본이 실제로 바뀌는지 확인하세요.','<b>살아 있는 반응:</b> 맞은 본과 방향으로 짧은 리액션 클립을 고르고 상체 레이어에 얹어 이동은 유지합니다. 아직 각도는 미리 만든 몇 개뿐입니다.','<b>파워드 래그돌:</b> 관절 모터가 애니메이션을 목표로 잡습니다. 충격에는 밀리지만 Kp·Kd가 다시 끌어와 “맞고도 버티는” 출렁임이 생깁니다.','<b>국소 힘 전파:</b> 임펄스를 선택 본에 넣으면 그 본이 먼저 꺾이고 힘이 부모 관절로 감쇠 전파됩니다. 부위별 물리를 꺼 중심 임펄스와 비교하세요.','<b>안정성과 예산:</b> PD는 고정 120Hz 서브스텝에서 계산하고 근접 중요 적만 파워드로 둡니다. 토글을 끄면 가변 틱에서 과보정 진동이 다시 나타납니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function bone(){return S.hit>88?'HEAD':S.hit>70?'R_SHOULDER':S.hit>45?'TORSO':S.hit>24?'R_KNEE':'R_SHIN'}
function vals(){const b=bone(),localized=S.step>=4&&S.local,powered=S.step>=3,stable=S.step>=5&&S.fixed,def=S.step<1?0:S.step<3?18:localized?Math.round(S.force*(b.includes('SHOULDER')?0.68:b.includes('KNEE')||b.includes('SHIN')?0.52:.34)):Math.round(S.force*.18),recover=powered?(stable?'0.38 s':S.local?'0.62 s':'0.85 s'):'복귀 없음';return{b,localized,powered,stable,def,recover}}
function capsules(w,h,v){const ox=w*.035,oy=h*.18,gw=w*.38,gh=h*.68,cx=ox+gw*.50,head=oy+gh*.13,hip=oy+gh*.62,knee=oy+gh*.80;x.fillStyle='#0b151d';x.fillRect(ox,oy,gw,gh);label(S.step<1?'ONE CENTER COLLIDER':'BONE-ATTACHED HIT CAPSULES',ox,oy-15,S.step<1?'#ff8179':'#8ce4b4');const zones=[['HEAD',cx,head,22,22],['TORSO',cx,head+52,58,78],['L_ARM',cx-63,head+54,26,86],['R_SHOULDER',cx+63,head+54,26,86],['L_LEG',cx-24,hip+46,28,108],['R_KNEE',cx+24,hip+46,28,108]];if(S.step===0){x.strokeStyle='#ff8179';x.lineWidth=2;x.beginPath();x.ellipse(cx,oy+gh*.47,gw*.24,gh*.38,0,0,7);x.stroke()}else zones.forEach(z=>{const on=z[0]===v.b||(v.b==='R_SHIN'&&z[0]==='R_KNEE');x.beginPath();x.roundRect(z[1]-z[3]/2,z[2]-z[4]/2,z[3],z[4],z[3]/2);x.fillStyle=on?'#ff817944':'#72c9ff18';x.fill();x.strokeStyle=on?'#ff8179':'#526b79';x.lineWidth=on?3:1.5;x.stroke();if(on)label(v.b,z[1],z[2]-z[4]/2-9,'#ff8179','center')});const hy=oy+gh*(1-S.hit/120);line(ox+gw*.05,hy,ox+gw*.95,hy,'#ffd17f',1,[5,4]);x.fillStyle='#ffd17f';x.beginPath();x.arc(cx+gw*.28,hy,6,0,7);x.fill()}
function skeleton(w,h,v){const cx=w*.70,ground=h*.82,hitPhase=.45+.55*Math.abs(Math.sin(S.t*.045)),localAmp=v.localized?v.def:Math.round(S.force*.18),targetAlpha=S.step>=3?.28:0,reactBone=S.step<1?'TORSO':v.b,pv={...v,b:reactBone};label('LIVE POSE · TARGET vs PHYSICS',w*.51,h*.15,S.step>=3?'#8ce4b4':'#72c9ff');line(w*.48,ground,w*.95,ground,'#526b79',3);if(targetAlpha){x.globalAlpha=targetAlpha;drawRig(cx,ground,0,0,'#97aab8',pv,'TARGET');x.globalAlpha=1}const wobble=v.stable?Math.sin(S.t*.05)*1.2:Math.sin(S.t*.31)*(S.step>=5?8:2),shift=(reactBone.includes('SHOULDER')?localAmp*.55:reactBone.includes('KNEE')||reactBone.includes('SHIN')?localAmp*.65:localAmp*.35)*hitPhase;drawRig(cx,ground,shift+wobble,localAmp*hitPhase,'#72c9ff',pv,'PHYSICS');if(S.step>=1){const y=v.b==='HEAD'?ground-218:v.b==='R_SHOULDER'?ground-164:v.b==='TORSO'?ground-126:v.b==='R_KNEE'?ground-55:ground-24,tx=cx+55;line(tx+95,y,tx,y,'#ffd17f',4);x.fillStyle='#ffd17f';x.beginPath();x.moveTo(tx,y);x.lineTo(tx+13,y-8);x.lineTo(tx+13,y+8);x.fill();label(`${v.b} · ${S.force}%`,tx+48,y-14,'#ffd17f','center')}if(S.step>=3)label(v.powered?'PD: Kp(error) − Kd(velocity)':'ANIMATION CLIP ONLY',w*.70,h*.24,v.powered?'#8ce4b4':'#ff8179','center');if(S.step>=4)label(v.localized?'LOCAL IMPULSE → PARENT CHAIN':'CENTER IMPULSE → WHOLE BODY',w*.70,h*.68,v.localized?'#8ce4b4':'#ff8179','center');if(S.step>=5)label(v.stable?'FIXED 120 Hz · POWERED BUDGET 4':'VARIABLE Δt · OVER-CORRECTION',w*.70,h*.74,v.stable?'#8ce4b4':'#ff8179','center')}
function drawRig(cx,g,shift,amp,co,v,tag){const shoulderY=g-160,hipY=g-92,torsoShift=v.b==='TORSO'?shift:shift*.38,shShift=v.b.includes('SHOULDER')||v.b==='HEAD'?shift:torsoShift,legShift=v.b.includes('KNEE')||v.b.includes('SHIN')?shift:torsoShift*.2;x.lineCap='round';line(cx+torsoShift,g-92,cx+shShift,shoulderY,co,14);x.fillStyle=co;x.beginPath();x.arc(cx+shShift,g-184,15,0,7);x.fill();line(cx+shShift,shoulderY,cx-58+torsoShift,g-132,co,10);line(cx+shShift,shoulderY,cx+60+shShift,g-132+amp*.22,co,10);line(cx+torsoShift,hipY,cx-25+torsoShift,g-45,co,12);line(cx-25+torsoShift,g-45,cx-30+torsoShift,g-4,co,11);line(cx+torsoShift,hipY,cx+24+legShift,g-47+amp*.15,co,12);line(cx+24+legShift,g-47+amp*.15,cx+37+legShift,g-4,co,11)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);capsules(w,h,v);skeleton(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('local').setAttribute('aria-pressed',String(S.local));$('fixed').setAttribute('aria-pressed',String(S.fixed));const v=vals();$('mBone').textContent=S.step<1?'중심':v.b;$('mDeflect').textContent=v.def+'°';$('mRecover').textContent=v.recover;$('mStable').textContent=v.stable?'고정 120Hz':S.step>=5?'진동 위험':'가변 틱';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.local=S.step>=4;S.fixed=S.step>=5;update()});$('hit').oninput=e=>{S.hit=+e.target.value;$('hitOut').textContent=S.hit+'%';update()};$('force').oninput=e=>{S.force=+e.target.value;$('forceOut').textContent=S.force+'%';update()};$('local').onclick=()=>{S.local=!S.local;update()};$('fixed').onclick=()=>{S.fixed=!S.fixed;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
