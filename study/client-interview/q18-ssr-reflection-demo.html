<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q18 SSR 반사 단계형 실험실</title>
<style>
:root{--bg:#080c12;--panel:#111925;--line:#2a394b;--ink:#eef3fa;--muted:#93a4b8;--pink:#ff78bd;--cyan:#64d8e8;--amber:#ffd06b}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#070a10}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--pink)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#190a12}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--pink)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6d8097;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="평면 반사의 이중 렌더에서 컬러·깊이 버퍼를 재활용하는 SSR, 화면 밖 실패, 러프니스와 프로브 폴백까지 쌓는 단계"></canvas><div class="hud"><span>Q18 · <b id="stage">바닥마다 거울 카메라</b></span><span id="status">씬을 통째로 두 번</span></div></div>
<div class="steps" role="group" aria-label="SSR 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>평면 반사</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>버퍼 재활용</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>레이마칭</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>화면 밖 실패</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>러프니스·프레넬</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>폴백·시간 안정</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="rough">바닥 러프니스</label><output id="roughOut">42%</output></div><input id="rough" type="range" min="0" max="100" value="42"></div><div><div class="ct"><label for="steps">레이마칭 스텝</label><output id="stepsOut">16회</output></div><input id="steps" type="range" min="4" max="40" value="16" step="4"></div><div class="toggles" role="group" aria-label="SSR 실패와 시간 누적 옵션"><button id="probe" aria-pressed="false">프로브 폴백</button><button id="reject" aria-pressed="false">모션 리젝션</button></div></div>
<div class="metrics"><div class="m"><small>지오메트리 렌더</small><strong id="mPass">2.0×</strong></div><div class="m"><small>SSR 히트율</small><strong id="mHit">—</strong></div><div class="m"><small>화면 경계 공백</small><strong id="mHole">—</strong></div><div class="m"><small>움직임 잔상</small><strong id="mGhost">—</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,rough:.42,steps:16,probe:false,reject:false},names=['바닥마다 거울 카메라','컬러·깊이 버퍼','화면공간 레이마칭','화면 밖·가림 미스','러프니스 MIP + 프레넬','SSR → 프로브 → 스카이'];
const desc=['<b>정확하지만 비싼 시작:</b> 바닥을 기준으로 카메라를 뒤집어 씬 전체를 한 번 더 그리면 거울 반사는 정확합니다. 하지만 바닥 하나마다 드로우콜과 삼각형이 사실상 2배가 됩니다.','<b>이미 있는 정보:</b> 이번 프레임에는 장면 색과 픽셀 깊이가 이미 있습니다. 반사 전용 지오메트리를 다시 그리지 않고 이 두 버퍼를 재활용할 준비를 합니다.','<b>방향만 되짚기:</b> 바닥 픽셀의 반사 벡터를 화면 위로 전진시키며 레이 깊이가 장면 깊이를 넘는 지점을 찾고, 그 화면 색을 아래 반사로 복사합니다. 스텝 수를 줄이면 빠르지만 얇은 물체를 놓칩니다.','<b>원리적 한계:</b> 현재 화면 밖 간판과 다른 물체 뒤에 가려진 대상은 컬러·깊이 버퍼에 없으므로 찾을 수 없습니다. 가장자리 반사가 뚝 잘리고 미스 픽셀이 검게 남습니다.','<b>젖은 재질답게:</b> 러프니스에 비례해 흐린 컬러 MIP를 고르고, 시선이 바닥을 스치는 원거리에는 프레넬로 반사를 강하게 합니다. 슬라이더를 움직여 대리석과 아스팔트의 번짐 차이를 보세요.','<b>실패를 넘기는 계층:</b> SSR 성공 픽셀은 동적 반사를 쓰고 경계·미스는 프로브로 페이드합니다. 반해상도 노이즈는 시간 누적하되, 움직인 픽셀은 모션 벡터로 과거를 버려 잔상을 자릅니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#eef3fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,8,14,.85)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
const signs=[{x:.14,w:.15,c:'#ff65b5',t:'NEON'},{x:.43,w:.13,c:'#66d8e8',t:'24H'},{x:.71,w:.16,c:'#ffd06b',t:'LOBBY'}];
function sign(w,h,s){const px=w*s.x,py=h*.22,sw=w*s.w,sh=h*.16;x.shadowColor=s.c;x.shadowBlur=18;x.fillStyle=s.c;x.fillRect(px,py,sw,sh);x.shadowBlur=0;x.fillStyle='#0a0d13';x.font='700 17px ui-monospace,monospace';x.textAlign='center';x.fillText(s.t,px+sw/2,py+sh*.62);x.textAlign='left'}
function reflection(w,h,s,ground,missing=false){const px=w*s.x,sw=w*s.w,top=ground+4,maxH=h*.35*(1-S.rough*.48),bands=Math.max(2,Math.round(12-S.rough*8)),alpha=.62-S.rough*.20;x.save();x.beginPath();x.rect(0,ground,w,h-ground);x.clip();for(let i=0;i<bands;i++){const yy=top+i*maxH/bands,ww=sw*(1+i*.022),j=(i%3-1)*S.rough*9;if(missing&&i>bands*.40)continue;x.fillStyle=s.c;x.globalAlpha=alpha*(1-i/bands)*(.7+Math.sin(i*2.1)*.18);x.filter=`blur(${S.step>=4?S.rough*8:0}px)`;x.fillRect(px+j,yy,ww,maxH/bands+2)}x.restore();x.globalAlpha=1;x.filter='none'}
function buffers(w,h){const ix=w*.70,iy=h*.08,iw=w*.25,ih=h*.27;x.fillStyle='rgba(5,9,15,.88)';x.fillRect(ix,iy,iw,ih);x.strokeStyle='#64d8e8';x.strokeRect(ix,iy,iw,ih);x.fillStyle='#ff65b5';x.fillRect(ix+9,iy+24,iw*.38,ih-34);const g=x.createLinearGradient(ix+iw*.52,0,ix+iw-9,0);g.addColorStop(0,'#222');g.addColorStop(1,'#eee');x.fillStyle=g;x.fillRect(ix+iw*.52,iy+24,iw*.42,ih-34);tag('COLOR',ix+13,iy+17,'#ff65b5');tag('DEPTH',ix+iw*.56,iy+17,'#64d8e8')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,ground=h*.54;x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#090c18');sky.addColorStop(1,'#16273a');x.fillStyle=sky;x.fillRect(0,0,w,ground);x.fillStyle='#080a0e';x.fillRect(0,ground,w,h-ground);for(let i=0;i<24;i++){x.strokeStyle=`rgba(70,106,130,${.08+(i%4)*.02})`;x.beginPath();x.moveTo(i*w/24,ground);x.lineTo(w*.5+(i-12)*w*.052,h);x.stroke()}for(const s of signs)sign(w,h,s);
if(S.step===0){for(const s of signs)reflection(w,h,s,ground,false);x.strokeStyle='#ff7077';x.setLineDash([5,4]);x.strokeRect(w*.05,h*.09,w*.53,h*.34);x.setLineDash([]);tag('CAMERA A · MAIN SCENE',w*.07,h*.13,'#64d8e8');tag('CAMERA B · MIRROR PASS',w*.07,h*.48,'#ff7077');x.strokeStyle='#ff7077';x.lineWidth=2;x.beginPath();x.moveTo(w*.62,h*.19);x.lineTo(w*.66,h*.25);x.lineTo(w*.62,h*.31);x.stroke()}
if(S.step>=1)buffers(w,h);
if(S.step>=2){for(let n=0;n<signs.length;n++)reflection(w,h,signs[n],ground,S.step===3&&n!==1);const ox=w*.46,oy=ground+h*.27;x.strokeStyle='#64d8e8';x.lineWidth=2;x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+w*.05,ground-h*.03);x.stroke();for(let i=0;i<Math.min(10,S.steps/4);i++){x.fillStyle=i===Math.min(9,S.steps/4-1)?'#ffd06b':'#64d8e8';x.beginPath();x.arc(ox+i*w*.005,oy-i*h*.025,2.5,0,7);x.fill()}tag('REFLECT(V,N) → DEPTH HIT',w*.39,h*.88,'#64d8e8')}
if(S.step===3){x.fillStyle='rgba(255,112,119,.20)';x.fillRect(0,ground,w*.12,h-ground);x.fillRect(w*.84,ground,w*.16,h-ground);x.strokeStyle='#ff7077';x.lineWidth=2;x.setLineDash([4,4]);x.beginPath();x.moveTo(w*.12,ground);x.lineTo(w*.12,h);x.moveTo(w*.84,ground);x.lineTo(w*.84,h);x.stroke();x.setLineDash([]);tag('OFF-SCREEN · NO DATA',w*.03,h*.74,'#ff7077');tag('OCCLUDED MISS',w*.72,h*.72,'#ff7077')}
if(S.step>=4){const g=x.createLinearGradient(0,ground,w,ground);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.5,'rgba(255,255,255,.02)');g.addColorStop(1,'rgba(255,255,255,.18)');x.fillStyle=g;x.fillRect(0,ground,w,h-ground);tag(`ROUGHNESS MIP ${Math.round(S.rough*5)}`,w*.05,h*.66,'#ff78bd');tag('GRAZING ANGLE · FRESNEL ↑',w*.63,h*.48,'#ffd06b')}
if(S.step>=5){const edge=70;if(S.probe){const lg=x.createLinearGradient(0,0,edge,0);lg.addColorStop(0,'rgba(50,105,140,.58)');lg.addColorStop(1,'rgba(50,105,140,0)');x.fillStyle=lg;x.fillRect(0,ground,edge,h-ground);const rg=x.createLinearGradient(w-edge,0,w,0);rg.addColorStop(0,'rgba(50,105,140,0)');rg.addColorStop(1,'rgba(50,105,140,.58)');x.fillStyle=rg;x.fillRect(w-edge,ground,edge,h-ground);tag('SSR',w*.40,h*.70,'#ff78bd');tag('EDGE FADE → PROBE',w*.73,h*.78,'#64d8e8')}else{tag('MISS = BLACK HOLE',w*.76,h*.78,'#ff7077')}if(S.reject)tag('MOTION VECTOR · HISTORY REJECT',w*.05,h*.91,'#64d8e8');else tag('TEMPORAL HISTORY · GHOST',w*.05,h*.91,'#ff7077')}}
function hit(){return Math.min(96,38+S.steps*1.45)}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['씬을 통째로 두 번','새 지오메트리 0','화면 색을 아래로','데이터 없음','젖음에 맞춰 번짐','실패를 다음 기법으로'][S.step];$('probe').setAttribute('aria-pressed',String(S.probe));$('reject').setAttribute('aria-pressed',String(S.reject));$('mPass').textContent=S.step===0?'2.0×':'1.0×';$('mHit').textContent=S.step<2?'—':hit().toFixed(0)+'%';$('mHole').textContent=S.step<3?'—':S.step>=5&&S.probe?'0% (폴백)':'23%';$('mGhost').textContent=S.step<5?'—':S.reject?'4 ms':'42 ms';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});$('rough').oninput=e=>{S.rough=+e.target.value/100;$('roughOut').textContent=e.target.value+'%';ui()};$('steps').oninput=e=>{S.steps=+e.target.value;$('stepsOut').textContent=e.target.value+'회';ui()};$('probe').onclick=()=>{S.probe=!S.probe;ui()};$('reject').onclick=()=>{S.reject=!S.reject;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
