<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q78 폭발 충격파 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="폭발 링이 배경을 왜곡하고 반경 쿼리, 가림 트레이스, 질량별 임펄스와 카메라 셰이크를 동기화하는 단계형 실험"></canvas><div class="hud"><span>Q78 · <b id="stage">불덩이 스프라이트 + 같은 반경 힘</b></span><span id="status">벽과 질량을 무시해 모든 물체가 똑같이 밀린다</span></div></div>
<div class="steps" role="group" aria-label="폭발 충격파 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>그림 폭발</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>굴절 링</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>반경 쿼리</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>가림 판정</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>질량 임펄스</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>체감 동기화</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="radius">폭발 반경</label><output id="radiusOut">68%</output></div><input id="radius" type="range" min="35" max="100" value="68"></div><div><div class="ct"><label for="force">임펄스 세기</label><output id="forceOut">70%</output></div><input id="force" type="range" min="20" max="100" value="70"></div><div class="toggles"><button id="blast" aria-pressed="false">폭발 다시 재생</button><button id="trace" aria-pressed="false">가림 트레이스</button></div></div>
<div class="metrics"><div class="m"><small>굴절 링 반경</small><strong id="mRing">0%</strong></div><div class="m"><small>쿼리 / 힘 적용</small><strong id="mHits">0 / 0</strong></div><div class="m"><small>벽에 막힘</small><strong id="mBlocked">0개</strong></div><div class="m"><small>카메라 셰이크</small><strong id="mShake">0%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,S={step:0,radius:.68,force:.7,trace:false,t:0,shake:0,objects:[]};
const names=['스프라이트와 동일한 반경 힘만 재생','장면 컬러 UV를 미는 팽창 굴절 링','반경 안 대상만 공간 쿼리로 수집','폭발점→대상 라인트레이스로 벽 가림','거리 감쇠·질량을 반영한 방사형 임펄스','왜곡·임펄스·셰이크·러블을 한 이벤트로'];
const status=['벽 뒤 무거운 통도 앞의 가벼운 상자와 같은 속도','투명 링 뒤의 격자와 배경이 실제로 휘어진다','링이 닿은 후보만 하이라이트된다','벽을 교차한 트레이스는 물리 힘을 차단한다','가벼운 물체는 멀리, 무거운 물체는 조금','거리 기반 체감 세기를 클램프해 동시에 시작'];
const desc=['<b>가짜 재현:</b> 불덩이 그림과 동일한 반경 힘만 씁니다. 벽 뒤 물체도, 질량이 다른 물체도 같은 속도로 날아가 충격의 논리가 없습니다.','<b>눈으로 보는 충격:</b> 장면 컬러를 팽창하는 링 마스크로 재샘플해 배경 격자를 휘게 합니다. 단순 투명 원이 아니라 뒤에 있는 화면 좌표가 실제로 밀립니다.','<b>게임플레이 후보 수집:</b> 폭발 반경 안 물체만 공간 쿼리로 가져옵니다. 반경 슬라이더를 바꾸면 링과 쿼리 대상이 같은 범위로 함께 변합니다.','<b>엄폐물 존중:</b> 폭발 중심에서 대상까지 선을 그어 벽과 먼저 만난 물체는 힘을 차단합니다. 가림 버튼으로 잘못된 반경 힘과 올바른 결과를 비교하세요.','<b>무게와 거리:</b> 남은 대상에는 중심→대상 방향, 거리 감쇠, 역질량을 곱한 임펄스를 적용합니다. 같은 거리에서도 가벼운 상자가 더 빠르게 움직입니다.','<b>하나의 폭발 비트:</b> 굴절 링·물리 임펄스·카메라 셰이크가 같은 이벤트 시간 0에서 출발합니다. 화면 흔들림은 거리 기반으로 감쇠·클램프해 체감은 살리고 멀미는 제한합니다.'];
function make(){S.objects=[{x:.27,y:.63,m:1,n:'상자 1kg'},{x:.38,y:.42,m:4,n:'통 4kg'},{x:.66,y:.42,m:1,n:'벽 뒤 상자'},{x:.82,y:.67,m:2,n:'먼 통 2kg'}].map(o=>({...o,bx:o.x,by:o.y,vx:0,vy:0,hit:false,blocked:false}));S.t=0;S.shake=0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function intersectsWall(cx,cy,tx,ty,w,h){const wx=w*.57,top=h*.28,bottom=h*.72;for(let i=1;i<20;i++){const q=i/20,px=cx+(tx-cx)*q,py=cy+(ty-cy)*q;if(px>wx-8&&px<wx+8&&py>top&&py<bottom)return true}return false}
function evaluate(w,h,apply=false){const cx=w*.48,cy=h*.58,maxR=w*.38*S.radius;let hits=0,affected=0,blocked=0;for(const o of S.objects){const ox=o.x*w,oy=o.y*h,dist=Math.hypot(ox-cx,oy-cy);o.hit=(S.step===0||S.step>=2)&&dist<maxR;o.blocked=o.hit&&S.step>=3&&S.trace&&intersectsWall(cx,cy,ox,oy,w,h);if(o.hit)hits++;if(o.blocked)blocked++;if(o.hit&&!o.blocked){affected++;if(apply&&(S.step===0||S.step>=2)){const dx=(ox-cx)/(dist||1),dy=(oy-cy)/(dist||1),fall=Math.max(0,1-dist/maxR),mass=S.step>=4?o.m:1;o.vx+=dx*S.force*fall*.007/mass;o.vy+=dy*S.force*fall*.005/mass}}}return{hits,affected,blocked,maxR}}
function simulate(dt,w,h){S.t=Math.min(1.25,S.t+dt);const v=evaluate(w,h,S.t<.08);if(S.step>=5)S.shake=Math.max(0,Math.sin(Math.min(1,S.t)*Math.PI*7)*(1-S.t)*S.force);for(const o of S.objects){o.x+=o.vx*dt*60;o.y+=o.vy*dt*60;o.vx*=.96;o.vy*=.96}return v}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.48,cy=h*.58,v=evaluate(w,h,false),ring=Math.min(1,S.t/.72),cam=S.step>=5?S.shake*6:0;x.save();x.translate(Math.sin(S.t*71)*cam,Math.cos(S.t*53)*cam);x.fillStyle='#0d1726';x.fillRect(-10,-10,w+20,h+20);x.strokeStyle='#273850';x.lineWidth=1;for(let gx=0;gx<w;gx+=42){x.beginPath();for(let yy=0;yy<h;yy+=8){let px=gx;if(S.step>=1){const d=Math.hypot(gx-cx,yy-cy),rr=v.maxR*ring;if(Math.abs(d-rr)<22)px+=(1-Math.abs(d-rr)/22)*12*Math.sin((yy+S.t*250)*.06)}yy?x.lineTo(px,yy):x.moveTo(px,yy)}x.stroke()}for(let gy=70;gy<h;gy+=42){x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy);x.stroke()}x.fillStyle='#4c5360';x.fillRect(w*.57-8,h*.28,16,h*.44);x.fillStyle='#778397';x.fillText('WALL',w*.57-17,h*.25);
if(S.step>=1){x.strokeStyle=`rgba(112,206,255,${.8*(1-ring)+.15})`;x.lineWidth=5;x.beginPath();x.arc(cx,cy,v.maxR*ring,0,TAU);x.stroke()}const fire=x.createRadialGradient(cx,cy,2,cx,cy,36*(1-S.t*.5));fire.addColorStop(0,'rgba(255,240,190,.95)');fire.addColorStop(.35,'rgba(255,140,70,.8)');fire.addColorStop(1,'rgba(255,80,50,0)');x.fillStyle=fire;x.beginPath();x.arc(cx,cy,45,0,TAU);x.fill();for(const o of S.objects){const ox=o.x*w,oy=o.y*h;if(S.step>=3&&o.hit){x.strokeStyle=o.blocked?'#ff7f78':'#8ce3ae';x.lineWidth=1;x.beginPath();x.moveTo(cx,cy);x.lineTo(ox,oy);x.stroke()}x.fillStyle=o.blocked?'#ff7f78':o.hit?'#8ce3ae':'#71829a';const sz=10+o.m*2;x.fillRect(ox-sz/2,oy-sz/2,sz,sz);x.fillStyle='#f5f8fc';x.font='600 9px ui-monospace,Consolas,monospace';x.fillText(o.n,ox-sz/2,oy-sz/2-6)}x.restore();const lightTravel=Math.hypot(S.objects[0].x-S.objects[0].bx,S.objects[0].y-S.objects[0].by)*w,heavyTravel=Math.hypot(S.objects[1].x-S.objects[1].bx,S.objects[1].y-S.objects[1].by)*w;$('mRing').textContent=(ring*100).toFixed(0)+'%';$('mHits').textContent=v.hits+' / '+v.affected;$('mBlocked').textContent=v.blocked+'개';$('mShake').textContent=(Math.abs(S.shake)*100).toFixed(0)+'%';c.dataset.ring=ring.toFixed(2);c.dataset.hits=v.hits;c.dataset.affected=v.affected;c.dataset.blocked=v.blocked;c.dataset.shake=Math.abs(S.shake).toFixed(2);c.dataset.lightTravel=lightTravel.toFixed(1);c.dataset.heavyTravel=heavyTravel.toFixed(1)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('trace').setAttribute('aria-pressed',String(S.trace));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.trace=S.step>=3;make();update()});$('radius').oninput=e=>{S.radius=+e.target.value/100;$('radiusOut').textContent=e.target.value+'%';make();update()};$('force').oninput=e=>{S.force=+e.target.value/100;$('forceOut').textContent=e.target.value+'%';make();update()};$('blast').onclick=()=>{make();update()};$('trace').onclick=()=>{S.trace=!S.trace;make();update()};let last=performance.now();function tick(now){const dt=Math.min(.033,(now-last)/1000);last=now;simulate(dt,c.clientWidth,c.clientHeight);draw();requestAnimationFrame(tick)}make();update();requestAnimationFrame(tick);addEventListener('resize',draw);
})();
</script></body></html>
