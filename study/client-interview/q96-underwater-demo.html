<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q96 수중 포스트 실험실</title><style>
:root{--bg:#071015;--panel:#0f1d25;--line:#315064;--ink:#f1f8fb;--muted:#96adb8;--cyan:#67d7ea;--blue:#4aaee7;--gold:#ffd06c;--red:#ff8178}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0c1b24}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#040b10df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#05151b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#7f9ba8;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="카메라가 수면을 통과하며 균일 파란 틴트에서 깊이별 파장 흡수, 디스토션, 코스틱, 픽셀 수면선과 가독성 레이어로 발전하는 실험"></canvas><div class="hud"><span>Q96 · <b id="stage">화면 전체 파란 틴트</b></span><span id="status">코앞과 먼 바닥이 같은 색이라 물의 깊이가 없음</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>파랑+블러</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>거리 흡수</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>파장별 감쇠</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>굴절·코스틱</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>수면선 마스크</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>가독성 분리</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="depth">카메라 수심</label><output id="depthOut">1.5 m</output></div><input id="depth" type="range" min="-20" max="100" value="15"></div><div><div class="ct"><label for="fog">흡수 강도</label><output id="fogOut">55%</output></div><input id="fog" type="range" min="10" max="100" value="55"></div><div class="toggles"><button id="distort" aria-pressed="false">수면 굴절</button><button id="readable" aria-pressed="false">적 림라이트</button></div></div>
<div class="metrics"><div class="m"><small>붉은빛 투과율</small><strong id="mRed">72%</strong></div><div class="m"><small>원경 가시거리</small><strong id="mVis">42 m</strong></div><div class="m"><small>화면 굴절</small><strong id="mDistort">0.0 px</strong></div><div class="m"><small>수면선 전환 폭</small><strong id="mEdge">전체 스위치</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,depth:1.5,fog:.55,distort:false,readable:false,t:0};const names=['화면 전체 파란 틴트','픽셀까지 물 통과 거리로 안개','붉은 파장부터 지수 흡수','노멀 흐름으로 스크린 굴절 + 바닥 코스틱','픽셀별 공기·물 waterline 마스크','분위기 포스트 뒤에 적 실루엣을 별도 합성'];const stats=['코앞과 먼 바닥이 같은 색이라 물의 깊이가 없음','가까운 손은 선명하고 먼 지형은 물색으로 수렴','깊을수록 빨강이 먼저 사라져 짙은 청록으로 변화','화면과 빛무늬가 서로 다른 속도로 일렁임','카메라가 걸쳐도 화면 전체가 깜빡이지 않음','짙은 물은 유지하면서 교전 대상만 읽히게 보존'];const desc=['<b>균일 필터의 한계:</b> 파란색과 블러만 곱하면 얕은 웅덩이와 심해, 코앞 손과 먼 바닥이 모두 같습니다. 물은 색 필터가 아니라 빛을 통과시키는 매질입니다.','<b>깊이 기반 수중 안개:</b> 뎁스로 픽셀까지 물을 통과한 거리를 구해 지수 감쇠합니다. 흡수 강도를 올려 원경만 먼저 사라지는지 확인하세요.','<b>파장별 흡수:</b> 같은 거리에서도 빨강이 가장 빨리, 파랑이 가장 늦게 감쇠합니다. 카메라 수심을 내려 화면이 청록으로 수렴하는 과정을 보세요.','<b>움직이는 물:</b> 흐르는 노멀로 화면 UV를 약하게 흔들고, 얕은 바닥에는 다른 속도의 코스틱 무늬를 투영합니다. 강한 왜곡은 멀미와 조준 방해로 이어집니다.','<b>수면 경계:</b> 카메라 inside/outside 한 값으로 화면 전체를 뒤집지 않고 픽셀별 수면선 아래만 처리합니다. -2m↔10m 사이를 움직여 소프트 경계를 보세요.','<b>분위기와 게임 정보 분리:</b> 물리적 안개는 그대로 두고 적·상호작용 대상의 림라이트를 포스트 뒤에 합성해 전투 가독성을 확보합니다.'];
function calc(){let water=Math.max(0,S.depth),red=S.step<2?72:Math.round(100*Math.exp(-water*S.fog*.16)),vis=S.step<1?42:Math.round(85/(S.fog+.35)),dist=S.step>=3&&S.distort?2.2+S.fog*3:0,edge=S.step>=4?'6 px soft':'전체 스위치';return{red,vis,dist,edge}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),line=h*(.26+Math.max(-.2,Math.min(1,S.depth/10))*.5),wave=V.dist*Math.sin(S.t*.06);x.fillStyle='#5e8492';x.fillRect(0,0,w,h);x.fillStyle='#7b8e72';x.fillRect(0,h*.45,w,h*.55);for(let i=0;i<9;i++){let z=i/8,px=w*(.08+i*.105)+wave*z,y=h*(.5+z*.35),size=12+z*28;x.fillStyle='#544b3d';x.fillRect(px,y-size,Math.max(3,size*.15),size);x.fillStyle='#87996f';x.beginPath();x.arc(px,y-size*1.1,size*.45,0,Math.PI*2);x.fill()}if(S.step>=4){let g=x.createLinearGradient(0,line-8,0,line+8);g.addColorStop(0,'rgba(12,91,118,0)');g.addColorStop(1,`rgba(4,55,78,${.55+S.fog*.3})`);x.fillStyle=g;x.fillRect(0,line-8,w,h-line+8);x.strokeStyle='#9ce9f4';x.lineWidth=3;x.beginPath();for(let px=0;px<=w;px+=8)x.lineTo(px,line+Math.sin(px*.035+S.t*.05)*4);x.stroke()}else{x.fillStyle=`rgba(4,66,94,${.35+S.fog*.35})`;x.fillRect(0,0,w,h)}if(S.step>=3&&S.distort){x.strokeStyle='#d8f8ff45';for(let i=0;i<9;i++){x.beginPath();x.arc(w*(.12+i*.1),h*.68+Math.sin(S.t*.04+i)*18,25+i*2,0,Math.PI*2);x.stroke()}}if(S.step>=5&&S.readable){x.strokeStyle='#ffd06b';x.lineWidth=5;x.beginPath();x.arc(w*.72,h*.6,34,0,Math.PI*2);x.stroke();x.fillStyle='#0b1720';x.fillRect(w*.7,h*.62,w*.04,h*.15)}$('mRed').textContent=V.red+'%';$('mVis').textContent=V.vis+' m';$('mDistort').textContent=V.dist.toFixed(1)+' px';$('mEdge').textContent=V.edge;c.dataset.red=V.red;c.dataset.visibility=V.vis;c.dataset.distort=V.dist.toFixed(1);c.dataset.edge=V.edge;c.dataset.line=Math.round(line)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('distort').setAttribute('aria-pressed',String(S.distort));$('readable').setAttribute('aria-pressed',String(S.readable));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.distort=S.step>=3;S.readable=S.step>=5;update()});$('depth').oninput=e=>{S.depth=+e.target.value/10;$('depthOut').textContent=S.depth.toFixed(1)+' m';draw()};$('fog').oninput=e=>{S.fog=+e.target.value/100;$('fogOut').textContent=e.target.value+'%';draw()};$('distort').onclick=()=>{S.distort=!S.distort;update()};$('readable').onclick=()=>{S.readable=!S.readable;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw)})();
</script></body></html>
