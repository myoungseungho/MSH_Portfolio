<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q41 패스트 트래블 로딩 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.25;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="패스트 트래블 목적지의 지형, 랜드마크, 저해상 밉과 세부 소품이 로딩 전략에 따라 채워지는 과정"></canvas><div class="hud"><span>Q41 · <b id="stage">도착 후 캐시 미스</b></span><span id="status">빈 세계부터 노출</span></div></div>
<div class="steps" role="group" aria-label="패스트 트래블 로딩 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>평소 스트리밍</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>도착 후 로드</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>선택 즉시 프리페치</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>동일 우선순위</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>시선·밉 우선순위</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>상주 프록시·블링크</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="transition">전환 연출 시간</label><output id="transitionOut">1200 ms</output></div><input id="transition" type="range" min="0" max="4000" step="100" value="1200"></div><div><div class="ct"><label for="bandwidth">저장매체 대역폭</label><output id="bandwidthOut">500 MB/s</output></div><input id="bandwidth" type="range" min="50" max="1500" step="50" value="500"></div><div class="toggles" role="group" aria-label="화면 기여도 우선순위와 상주 저해상 프록시"><button id="priority" aria-pressed="false">화면 기여도 우선</button><button id="proxy" aria-pressed="false">저LOD·바닥 상주</button></div></div>
<div class="metrics"><div class="m"><small>페이드 종료 시 준비도</small><strong id="mReady">0%</strong></div><div class="m"><small>빈 화면 노출</small><strong id="mBlank">18 frames</strong></div><div class="m"><small>눈에 띄는 밉 팝</small><strong id="mMip">높음</strong></div><div class="m"><small>도착 바닥</small><strong id="mFloor">위험</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,transition:1200,bandwidth:500,priority:false,proxy:false,t:0},names=['normal gradual streaming','teleport then load','prefetch behind transition','equal-priority asset queue','screen-contribution + mip priority','resident proxy + blink candidate cone'],desc=['<b>기준:</b> 걸어갈 때는 주변 셀이 조금씩 들어와 평소 스트리밍이 따라갈 시간이 있습니다.','<b>문제 재현:</b> 텔레포트부터 하고 로딩하면 목적지 전체가 캐시 미스라 빈 바닥→뿌연 텍스처→나무·소품 순으로 팝인이 그대로 보입니다.','<b>시간을 앞으로 당기기:</b> 목적지를 확정한 순간 프리페치를 시작하고 실제 이동은 전환 연출 뒤로 미룹니다. 연출 시간을 늘려 준비도를 확인하세요.','<b>또 막히는 이유:</b> 뒷골목 소품까지 동일 우선순위면 화면을 채울 지형·랜드마크가 큐에서 기다립니다.','<b>보이는 순서대로:</b> 지형·스카이·큰 실루엣과 화면을 넓게 차지하는 표면의 밉부터 올립니다. 기여도 우선 토글로 같은 대역폭의 차이를 보세요.','<b>목적지를 몰라도 바닥은 존재:</b> 블링크 후보 영역을 좁혀 당기고 저LOD 지형·콜리전은 상주시켜, 늦어도 빈 화면이나 추락이 없게 합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let pre=S.step>=2,prio=S.priority&&S.step>=4,proxy=S.proxy&&S.step>=5,work=S.bandwidth*(pre?S.transition/1000:.18),ready=Math.min(100,Math.round(work/(prio?7:10))),blank=proxy?0:Math.max(0,Math.ceil((100-ready)/5.5)),mip=ready>88||prio&&ready>50?'낮음':ready>40?'중간':'높음',floor=proxy||ready>65?'안전':'위험';return{ready,blank,mip,floor,pre,prio,proxy}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.72,ready=v.ready/100;x.fillStyle='#12212c';x.fillRect(0,0,w,h);let horizon=v.proxy ? .42 : Math.min(.64,.20+ready*.44);x.fillStyle=v.proxy?'#3a5361':'#263945';x.beginPath();x.moveTo(0,ground);for(let i=0;i<=12;i++){let px=i*w/12,py=ground-horizon*h*(.16+Math.sin(i*1.7)*.05);x.lineTo(px,py)}x.lineTo(w,ground);x.fill();if(ready>.08||v.proxy){x.fillStyle=v.prio?'#648fa6':'#527282';x.fillRect(w*.43,ground-h*(.16+.22*ready),w*.14,h*(.16+.22*ready));x.fillStyle='#314957';x.beginPath();x.moveTo(w*.40,ground-h*(.16+.22*ready));x.lineTo(w*.50,ground-h*(.31+.24*ready));x.lineTo(w*.60,ground-h*(.16+.22*ready));x.fill()}x.fillStyle=v.proxy?'#445f6d':'#20313d';x.fillRect(0,ground,w,h-ground);let objects=Math.floor((v.prio?ready*18:ready*10));for(let i=0;i<objects;i++){let px=(i*197%Math.floor(w*.9))+w*.05,sz=8+(i%4)*4,front=i%3!==0;if(v.prio&&!front&&ready<.85)continue;x.fillStyle=front?'#72c9ff':'#577786';x.fillRect(px,ground-sz*2,sz*.35,sz*2);x.beginPath();x.arc(px+sz*.18,ground-sz*2.2,sz,0,7);x.fill()}if(S.step===1){x.fillStyle=`rgba(2,6,10,${Math.max(.08,1-ready)})`;x.fillRect(0,0,w,h);tag('TELEPORT COMPLETE · DESTINATION CACHE MISS',w*.31,h*.20,'#ff8179')}if(S.step>=2){let fade=Math.max(0,1-S.transition/4000);x.fillStyle=`rgba(2,5,9,${fade*.78})`;x.fillRect(0,0,w,h);tag(`PREFETCH DURING ${S.transition} ms TRANSITION`,w*.33,h*.18,'#8ce4b4')}if(S.step===3){for(let i=0;i<8;i++){x.fillStyle=i<Math.round(ready*8)?'#ffd17f':'#253846';x.fillRect(w*.16+i*w*.085,h*.82,w*.064,16)}tag('LANDMARK WAITS BEHIND INVISIBLE PROPS',w*.32,h*.89,'#ff8179')}if(S.step>=4){const items=[['TERRAIN',.92],['SKY',.84],['LANDMARK',.74],['VISIBLE MIPS',.62],['PROPS',.30]];items.forEach((it,i)=>{let bw=w*.15,px=w*.08+i*w*.18,fill=Math.min(1,ready*(v.prio?1.45-i*.08:.72));x.fillStyle='#253846';x.fillRect(px,h*.84,bw,13);x.fillStyle=i<4?'#72c9ff':'#6f8795';x.fillRect(px,h*.84,bw*fill,13);tag(it[0],px,h*.82,i<4?'#72c9ff':'#97aab8')})}if(S.step>=5){x.strokeStyle='#ffd17f';x.setLineDash([6,4]);x.beginPath();x.moveTo(w*.50,ground);x.lineTo(w*.20,h*.26);x.lineTo(w*.80,h*.26);x.closePath();x.stroke();x.setLineDash([]);tag('BLINK LANDING CANDIDATES PREFETCH',w*.35,h*.24,'#ffd17f');if(v.proxy)tag('RESIDENT LOW-LOD TERRAIN + COLLISION',w*.35,h*.94,'#8ce4b4')}
}function metrics(){const v=vals();$('mReady').textContent=v.ready+'%';$('mBlank').textContent=v.blank+' frames';$('mMip').textContent=v.mip;$('mFloor').textContent=v.floor}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['걸어서 접근','빈 세계부터 노출','연출 뒤에서 선행 로드','안 보이는 자산도 경쟁','실루엣→고밉→소품','후보를 당기고 바닥 보장'][S.step];$('explain').innerHTML=desc[S.step];$('priority').setAttribute('aria-pressed',String(S.priority));$('proxy').setAttribute('aria-pressed',String(S.proxy));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.priority=S.step>=4;S.proxy=S.step===5;ui()});$('transition').oninput=e=>{S.transition=+e.target.value;$('transitionOut').textContent=e.target.value+' ms';ui()};$('bandwidth').oninput=e=>{S.bandwidth=+e.target.value;$('bandwidthOut').textContent=e.target.value+' MB/s';ui()};$('priority').onclick=()=>{S.priority=!S.priority;ui()};$('proxy').onclick=()=>{S.proxy=!S.proxy;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
