<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q30 눈보라 단계형 실험실</title>
<style>
:root{--bg:#071019;--panel:#101d28;--line:#2b4354;--ink:#f3f9ff;--muted:#96aaba;--ice:#8ed7ff;--snow:#f5fbff;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#182a37}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#071019dd}.hud b{color:var(--ice)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#547589}button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}button[aria-pressed=true]{background:var(--ice);border-color:var(--ice);color:#06141d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--ice);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--ice)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#73899a;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="평면 눈 오버레이에서 깊이별 GPU 파티클, 화이트아웃, 반해상도 최적화와 가장자리 눈 누적까지 쌓는 설산 눈보라"></canvas><div class="hud"><span>Q30 · <b id="stage">화면 눈 텍스처</b></span><span id="status">깊이·시차 없음</span></div></div>
<div class="steps" role="group" aria-label="눈보라 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>평면 오버레이</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>3D GPU 눈발</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>오버드로우 실패</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>대기 화이트아웃</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>반해상도·글로벌</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>가장자리 누적</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="storm">눈보라 강도</label><output id="stormOut">65%</output></div><input id="storm" type="range" min="0" max="100" value="65"></div><div><div class="ct"><label for="yaw">카메라 회전</label><output id="yawOut">0°</output></div><input id="yaw" type="range" min="-90" max="90" value="0"></div><div class="toggles" role="group" aria-label="바람과 화면 눈 옵션"><button id="wind" aria-pressed="false">월드 바람</button><button id="lens" aria-pressed="false">가장자리 눈</button></div></div>
<div class="metrics"><div class="m"><small>가시거리</small><strong id="mVis">100 m</strong></div><div class="m"><small>깊이 레이어</small><strong id="mLayers">1</strong></div><div class="m"><small>추정 오버드로우</small><strong id="mOver">2×</strong></div><div class="m"><small>화면 눈 누적</small><strong id="mEdge">0%</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,storm:.65,yaw:0,wind:false,lens:false,t:0},names=['screen-space snow overlay','camera-local GPU particles','transparent overdraw wall','fog + whiteout post','half-res particles + weather bus','wind-biased edge accumulation'],desc=['<b>문제 재현:</b> 반투명 눈 텍스처 한 장을 화면에서 스크롤하면 모든 눈이 같은 거리·속도이고, 카메라를 돌려도 화면에 붙어 미끄러집니다.','<b>공간 시차:</b> 카메라 주변 3D 박스에 GPU 파티클을 두고 깊이에 따라 크기·속도를 달리합니다. 회전 슬라이더에서 가까운 눈이 더 크게 움직입니다.','<b>밀도로 해결한 실패:</b> 화이트아웃을 만들겠다고 투명 눈송이를 과도하게 늘리면 같은 픽셀을 수십 번 덧칠해 오버드로우가 폭발합니다.','<b>공기 자체를 희게:</b> 개별 눈 대신 높이 안개와 노출·컬러 포스트로 거리에 따른 소멸을 만듭니다. 파티클은 시차, 대기는 실제 시야 제한을 담당합니다.','<b>하나의 강도, 세 시스템:</b> 글로벌 날씨 값이 방출량·바람·안개를 함께 올리고 파티클은 반해상도로 렌더해 비용을 줄입니다. 강도 슬라이더로 모두 함께 변합니다.','<b>렌즈/바이저 층:</b> 가장자리부터 눈 마스크를 누적하고 바람 쪽에 더 쌓습니다. 3인칭에서는 이 토글을 끄고 월드 눈만 쓰는 선택도 가능합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f3f9ff'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,13,20,.84)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,spatial=S.step>=1,over=S.step===2,white=S.step>=3,optimized=S.step>=4,edge=S.lens&&S.step>=5,fog=white*S.storm*.78;x.fillStyle=`rgb(${58+fog*110|0},${79+fog*110|0},${94+fog*110|0})`;x.fillRect(0,0,w,h);x.fillStyle=`rgba(31,50,63,${1-fog*.7})`;x.beginPath();x.moveTo(0,h);for(let i=0;i<=12;i++){let px=i*w/12,py=h*(.43+.18*Math.sin(i*.9+S.yaw*.003));x.lineTo(px,py)}x.lineTo(w,h);x.fill();const count=Math.round((over?240:spatial?110:65)*(.3+S.storm));for(let i=0;i<count;i++){let depth=spatial?(i%3):1,parallax=spatial?S.yaw*(3-depth)*1.5:0,px=(i*89+S.t*(spatial?(4-depth)*2.2:2)+parallax)%(w+80)-40,py=(i*47+S.t*(S.wind?2.8:1.2))%(h+40)-20,size=spatial?[6,3,1.5][depth]:2;x.strokeStyle=`rgba(245,251,255,${over?.42:.35+size*.09})`;x.lineWidth=size;x.beginPath();x.moveTo(px,py);x.lineTo(px-(S.wind?18:7)*size,py+9*size);x.stroke()}if(S.step===0)tag('ONE SCREEN PLANE · CAMERA-STUCK',w*.06,h*.86,'#ff7f78');if(spatial)tag('NEAR / MID / FAR PARALLAX',w*.06,h*.86,'#8ed7ff');if(over)tag('TRANSPARENT OVERDRAW × 18',w*.62,h*.78,'#ff7f78');if(white)tag('FOG TRANSMITTANCE · '+Math.round((1-fog)*100)+'%',w*.64,h*.22,'#f5fbff');if(optimized)tag('HALF-RES PARTICLES · ONE WEATHER BUS',w*.50,h*.82,'#8ed7ff');if(edge){const e=.08+S.storm*.20,g1=x.createLinearGradient(0,0,w*.22,0);g1.addColorStop(0,`rgba(244,250,255,${e*(S.wind?1.6:1)})`);g1.addColorStop(1,'rgba(244,250,255,0)');x.fillStyle=g1;x.fillRect(0,0,w*.25,h);const g2=x.createLinearGradient(w,0,w*.78,0);g2.addColorStop(0,`rgba(244,250,255,${e*.72})`);g2.addColorStop(1,'rgba(244,250,255,0)');x.fillStyle=g2;x.fillRect(w*.75,0,w*.25,h);x.fillStyle=`rgba(247,252,255,${.38+S.storm*.45})`;for(let i=0;i<12;i++){let yy=i*h/11,r=7+S.storm*(8+i%3*4);x.beginPath();x.arc(i%2?3:r*.25,yy,r,0,7);x.fill();if(i%3===0){x.beginPath();x.arc(w-2,yy+16,r*.66,0,7);x.fill()}}tag('WIND-BIASED SCREEN ACCUMULATION',w*.04,h*.18,'#f5fbff')}}
function metrics(){const white=S.step>=3,vis=white?Math.max(8,100-S.storm*125):100,layers=S.step>=1?3:1,over=S.step===2?18:S.step>=4?3:S.step>=1?7:2,edge=S.lens&&S.step>=5?Math.round(S.storm*82):0;$('mVis').textContent=Math.round(vis)+' m';$('mLayers').textContent=layers;$('mOver').textContent=over+'×';$('mEdge').textContent=edge+'%'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['깊이·시차 없음','회전에 시차 반응','GPU 대역폭 폭발','시야거리 물리 감소','비용·연출 동시 제어','바람 쪽부터 쌓임'][S.step];$('explain').innerHTML=desc[S.step];$('wind').setAttribute('aria-pressed',String(S.wind));$('lens').setAttribute('aria-pressed',String(S.lens));metrics();draw()}function tick(){S.t+=1;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.wind=S.step>=1;S.lens=S.step===5;ui()});$('storm').oninput=e=>{S.storm=+e.target.value/100;$('stormOut').textContent=e.target.value+'%';ui()};$('yaw').oninput=e=>{S.yaw=+e.target.value;$('yawOut').textContent=e.target.value+'°';ui()};$('wind').onclick=()=>{S.wind=!S.wind;ui()};$('lens').onclick=()=>{S.lens=!S.lens;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
