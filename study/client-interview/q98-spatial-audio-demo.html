<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q98 공간 오디오 실험실</title><style>
:root{--bg:#090d12;--panel:#121a22;--line:#354755;--ink:#f4f7f9;--muted:#9caab3;--cyan:#70d5ef;--gold:#ffd06c;--green:#7fe0a5;--red:#ff7b74}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#121c25}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#06090ddf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#82939d;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="리스너가 야외, 동굴, 성당 존을 이동하고 리버브 버스 send, 경계 크로스페이드, 다중 레이 오클루전과 문 포탈이 반응하는 실험"></canvas><div class="hud"><span>Q98 · <b id="stage">보이스마다 리버브</b></span><span id="status">야외도 울리고 동시 보이스 수만큼 DSP 인스턴스가 증가</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>개별 리버브</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>공유 버스</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>공간 프리셋</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>리버브 존</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>tail 크로스페이드</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>오클루전·포탈</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="listener">리스너 위치</label><output id="listenerOut">경계 50%</output></div><input id="listener" type="range" min="0" max="100" value="50"></div><div><div class="ct"><label for="door">문 열림</label><output id="doorOut">30%</output></div><input id="door" type="range" min="0" max="100" value="30"></div><div class="toggles"><button id="bus" aria-pressed="false">공유 리버브 버스</button><button id="portal" aria-pressed="false">문 오디오 포탈</button></div></div>
<div class="metrics"><div class="m"><small>리버브 DSP</small><strong id="mDsp">24개</strong></div><div class="m"><small>동굴 / 성당 send</small><strong id="mSend">100 / 0%</strong></div><div class="m"><small>잔향 시간</small><strong id="mTail">2.8 s</strong></div><div class="m"><small>오클루전 LPF</small><strong id="mLpf">20 kHz</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,pos:.50,door:.30,bus:false,portal:false,t:0};const names=['보이스마다 리버브','모든 소리가 한 리버브 버스로 send','동굴·성당·야외 프리셋','리스너가 있는 오디오 볼륨 선택','이전 tail 유지 + 새 리버브 병렬 페이드','다중 레이 차폐 비율 + 문 포탈 우회'];const stats=['야외도 울리고 동시 보이스 수만큼 DSP 인스턴스가 증가','보이스 수와 무관하게 비싼 잔향 계산은 한 번','공간 크기·재질을 잔향 시간과 초기 반사로 근사','공간의 음향 성질이 리스너 위치를 따라 바뀜','경계를 넘어도 이미 울리던 여운이 끊기지 않음','문틈 크기에 따라 고역과 볼륨이 연속적으로 회복'];const desc=['<b>소리가 아니라 공간이 울립니다:</b> 보이스마다 리버브를 붙이면 야외도 울리고 24개 보이스면 무거운 DSP도 24개가 됩니다.','<b>send/bus 라우팅:</b> 원음은 마스터로, 잔향 성분만 공유 리버브 버스로 보냅니다. 발소리·목소리가 늘어도 DSP는 한 개입니다.','<b>예술적 공간 근사:</b> 동굴·성당·좁은 방·야외를 잔향 시간, 초기 반사, 저역 감쇠 프리셋으로 정의합니다. 물리 파동 추적 없이도 장소가 읽힙니다.','<b>리버브 존:</b> 리스너가 어느 볼륨에 있는지로 프리셋과 send를 정합니다. 위치 슬라이더로 동굴에서 성당까지 걸어가 보세요.','<b>꼬리를 자르지 않기:</b> 경계에서는 이전 리버브의 tail을 자연 감쇠시키며 새 버스를 페이드인합니다. 잠깐 두 인스턴스가 병렬로 돌아갑니다.','<b>벽 너머는 먹먹하게:</b> 여러 레이의 차폐 비율로 로우패스와 감쇠를 연속 조절하고, 열린 문 포탈을 우회 경로로 사용합니다. 문을 열어 20kHz까지 회복되는지 보세요.'];
function calc(){let cave=Math.max(0,Math.min(1,(.62-S.pos)/.24)),church=Math.max(0,Math.min(1,(S.pos-.38)/.24)),sum=cave+church||1;cave/=sum;church/=sum;let dsp=S.step===0?24:S.bus||S.step>=1?1:24;if(S.step===4&&cave>0&&church>0)dsp=2;let tail=.2+cave*2.6+church*4.6,lpf=20;if(S.step>=5){let blocked=1-S.door*(S.portal?.92:.45);lpf=Math.round(1.2+(1-blocked)*18.8)}return{cave,church,dsp,tail,lpf}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),lx=w*(.08+S.pos*.84),sy=h*.65;x.fillStyle='#121c25';x.fillRect(0,0,w,h);x.fillStyle='#2a3944';x.fillRect(w*.04,h*.18,w*.43,h*.64);x.fillStyle='#3c3540';x.fillRect(w*.53,h*.18,w*.43,h*.64);x.fillStyle='#9aa5aa';x.fillRect(w*.48,h*.18,w*.04,h*.64);x.fillStyle='#121c25';x.fillRect(w*.485,h*(.62-S.door*.35),w*.03,h*(.2+S.door*.35));x.fillStyle='#ffd06c';x.beginPath();x.arc(w*.78,h*.54,12,0,Math.PI*2);x.fill();x.fillText('SOURCE',w*.75,h*.47);x.fillStyle='#70d5ef';x.beginPath();x.arc(lx,sy,10,0,Math.PI*2);x.fill();x.fillText('LISTENER',lx-26,sy+28);for(let i=0;i<6;i++){let r=(S.t*1.4+i*34)%210;x.strokeStyle=`rgba(112,213,239,${Math.max(0,1-r/210)*.55})`;x.beginPath();x.arc(lx,sy,r,0,Math.PI*2);x.stroke()}if(S.step>=5){for(let i=-2;i<=2;i++){x.strokeStyle=i===0&&S.portal?'#7fe0a5':'#ff7b74';x.setLineDash(i===0&&S.portal?[6,4]:[]);x.beginPath();x.moveTo(lx,sy+i*5);x.lineTo(w*.78,h*.54+i*4);x.stroke()}x.setLineDash([])}$('mDsp').textContent=V.dsp+'개';$('mSend').textContent=Math.round(V.cave*100)+' / '+Math.round(V.church*100)+'%';$('mTail').textContent=V.tail.toFixed(1)+' s';$('mLpf').textContent=V.lpf+' kHz';c.dataset.dsp=V.dsp;c.dataset.send=Math.round(V.cave*100)+','+Math.round(V.church*100);c.dataset.tail=V.tail.toFixed(1);c.dataset.lpf=V.lpf}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('bus').setAttribute('aria-pressed',String(S.bus));$('portal').setAttribute('aria-pressed',String(S.portal));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.bus=S.step>=1;S.portal=S.step>=5;update()});$('listener').oninput=e=>{S.pos=+e.target.value/100;$('listenerOut').textContent=(S.pos<.5?'동굴 ':'성당 ')+e.target.value+'%';draw()};$('door').oninput=e=>{S.door=+e.target.value/100;$('doorOut').textContent=e.target.value+'%';draw()};$('bus').onclick=()=>{S.bus=!S.bus;update()};$('portal').onclick=()=>{S.portal=!S.portal;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw)})();
</script></body></html>
