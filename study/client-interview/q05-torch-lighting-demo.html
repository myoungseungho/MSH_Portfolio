<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q5 살아있는 횃불빛 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5;--red:#ff7469}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}
.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#030507}canvas{width:100%;height:100%;display:block}
.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b11dc}.hud b{color:#ffd27b}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}
.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}
.controls{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}
.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}.bad{color:var(--red)}
.budget{height:7px;margin-top:10px;border-radius:9px;background:#1a2230;overflow:hidden}.budget i{display:block;height:100%;width:10%;background:var(--cyan);transition:width .2s,background .2s}
@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style>
</head>
<body><div id="root">
<div class="viewport"><canvas id="scene" role="img" aria-label="동굴 횃불의 감쇠, 그림자, 플리커와 다중 광원 비용을 단계별로 보여주는 시뮬레이션"></canvas><div class="hud"><span>Q5 · <b id="stage">순수 점광원</b></span><span id="status">빛이 벽을 통과함</span></div></div>
<div class="steps" role="group" aria-label="횃불 구현 단계">
 <button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>순수 1/d²</button>
 <button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>부드러운 반경</button>
 <button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>동적 그림자</button>
 <button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>시간 플리커</button>
 <button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>다중 광원</button>
 <button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>예산 최적화</button>
</div>
<p class="explain" id="explain"></p>
<div class="controls">
 <div><div class="ct"><label for="radius">영향 반경</label><output id="radiusOut">44m</output></div><input id="radius" type="range" min="18" max="80" value="44"></div>
 <div><div class="ct"><label for="flicker">플리커 강도</label><output id="flickerOut">35%</output></div><input id="flicker" type="range" min="0" max="100" value="35"></div>
 <div class="toggles" role="group" aria-label="동시 횃불 개수"><button data-count="1" aria-pressed="true">1개</button><button data-count="5" aria-pressed="false">5개</button><button data-count="18" aria-pressed="false">18개</button></div>
</div>
<div class="metrics">
 <div class="m"><small>계산 대상 광원</small><strong id="mLights">1</strong></div>
 <div class="m"><small>그림자 큐브맵 면</small><strong id="mFaces">0</strong></div>
 <div class="m"><small>벽 뒤 누수</small><strong id="mLeak" class="bad">높음</strong></div>
 <div class="m"><small>예상 조명 비용</small><strong id="mCost">1.0 ms</strong></div>
</div>
<div class="budget" aria-label="조명 프레임 예산 사용량"><i id="budget"></i></div>
</div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const S={step:0,radius:.44,flicker:.35,count:1,t:0};
const names=['순수 점광원','부드러운 반경','동적 그림자','시간 플리커','다중 광원','예산 최적화'];
const desc=[
'<b>문제 재현:</b> 순수 1/d²는 불꽃 바로 옆에서 값이 폭발하고 멀리서도 0이 되지 않습니다. 그림자가 없어 오른쪽 방까지 빛이 샙니다.',
'<b>감쇠 정리:</b> 물리 감쇠에 부드러운 반경을 곱해 계산 범위를 끝냅니다. 주변만 둥글게 밝아지지만 벽 가림은 아직 모릅니다.',
'<b>가림 추가:</b> 포인트라이트의 6방향 깊이를 그려 벽 뒤를 어둡힙니다. 이제 동굴 형태가 살아나지만 광원 하나마다 최대 6패스가 듭니다.',
'<b>생명 추가:</b> 실제 경과 시간을 넣은 연속 노이즈로 밝기·색·위치를 조금씩 흔듭니다. 프레임 수가 달라도 같은 시간에는 같은 불빛입니다.',
'<b>비용 문제:</b> 횃불을 늘리면 모든 픽셀이 모든 빛을 계산하고, 그림자는 6면 × N으로 폭증합니다. 5개·18개를 눌러 비용을 확인하세요.',
'<b>최종:</b> 화면 타일마다 닿는 빛만 추리고, 가까운 주광 2개에만 그림자 예산을 줍니다. 장식광은 밝기만 기여해 개수가 늘어도 비용을 억제합니다.'
];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function noise(t,seed=0){return Math.sin(t*2.1+seed)*.54+Math.sin(t*5.7+seed*2.3)*.28+Math.sin(t*11.2+seed*.7)*.18}
function glow(cx,cy,r,col,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.45,`rgba(${col},${a*.32})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function poly(p,fill){x.fillStyle=fill;x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fill()}
function flame(px,py,scale,seed,shadow){
 const f=S.step>=3?noise(S.t,seed)*S.flicker:0,dx=S.step>=3?noise(S.t*.7,seed+4)*3*S.flicker:0;
 const intensity=Math.max(.25,1+f*.42),r=(S.step===0?c.clientWidth*.65:c.clientWidth*(.12+S.radius*.27))*intensity;
 glow(px+dx,py,r,'255,132,36',.66*intensity);
 if(S.step>=2&&shadow){
   // A hard occluder wedge shows why visibility is separate from attenuation.
   poly([[px+5,py],[c.clientWidth*.60,c.clientHeight*.33],[c.clientWidth*.60,c.clientHeight*.73],[px+5,py+5]],'rgba(3,5,8,.93)');
 }
 x.fillStyle='#6e4325';x.fillRect(px-3,py+5,6,22*scale);
 x.fillStyle=`rgb(255,${Math.round(158+f*35)},55)`;x.beginPath();x.moveTo(px-7*scale+dx,py+5);x.quadraticCurveTo(px+dx,py-25*scale-f*7,px+7*scale+dx,py+5);x.quadraticCurveTo(px+dx,py-3,px-7*scale+dx,py+5);x.fill();
}
function draw(){
 resize();const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);x.fillStyle='#05070a';x.fillRect(0,0,w,h);
 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#202329');g.addColorStop(1,'#0a0c10');x.fillStyle=g;x.fillRect(0,0,w,h);
 // cave silhouette and dividing wall
 x.fillStyle='#11161c';for(let i=0;i<12;i++){x.beginPath();x.arc(i*w/11,h*.08+(i%3)*8,w*.09,0,Math.PI*2);x.fill()}
 x.fillStyle='#15191e';x.fillRect(0,h*.74,w,h*.26);x.fillStyle='#303238';x.fillRect(w*.54,h*.17,w*.075,h*.57);
 x.fillStyle='#080a0d';x.fillRect(w*.615,h*.17,w*.385,h*.57);
 const positions=[[w*.27,h*.59],[w*.15,h*.43],[w*.42,h*.35],[w*.74,h*.54],[w*.87,h*.37],[w*.68,h*.29],[w*.93,h*.61],[w*.34,h*.53],[w*.48,h*.62],[w*.08,h*.58],[w*.79,h*.24],[w*.57,h*.47],[w*.23,h*.29],[w*.71,h*.67],[w*.39,h*.22],[w*.91,h*.25],[w*.12,h*.67],[w*.82,h*.63]];
 const n=S.step>=4?S.count:1,optimized=S.step>=5;
 for(let i=n-1;i>=0;i--){const sh=S.step>=2&&(!optimized||i<2);flame(positions[i][0],positions[i][1],i?0.65:1,i+1,sh)}
 if(S.step<2){
   x.fillStyle='rgba(255,130,35,.18)';x.fillRect(w*.615,h*.17,w*.385,h*.57);
   x.fillStyle='#ff7469';x.font='600 11px system-ui';x.fillText('벽 뒤인데도 밝음 = light leak',w*.69,h*.48);
 }else{x.fillStyle='#788698';x.font='10px system-ui';x.fillText('벽이 광원 가시성을 차단',w*.70,h*.48)}
 // player and projected shadow
 const px=w*.39,py=h*.61;x.fillStyle='#798493';x.beginPath();x.arc(px,py-42,10,0,7);x.fill();x.fillRect(px-7,py-32,14,37);
 if(S.step>=2){x.fillStyle='rgba(0,0,0,.7)';poly([[px+7,py-20],[w*.54,h*.37],[w*.54,h*.66],[px+7,py+5]],'rgba(0,0,0,.72)')}
 if(S.step===0){x.fillStyle='rgba(8,10,14,.82)';x.fillRect(w*.08,h*.16,w*.29,h*.11);x.fillStyle='#ffca75';x.font='600 11px system-ui';x.fillText('가까운 곳 값 폭발 · 범위 무한',w*.10,h*.205);x.fillStyle='#8996a8';x.font='10px system-ui';x.fillText('어디서 계산을 멈출지 알 수 없음',w*.10,h*.24)}
 if(S.step>=4){
  const tiles=8;for(let i=0;i<tiles;i++){x.strokeStyle=optimized?'rgba(110,215,229,.22)':'rgba(255,116,105,.13)';x.strokeRect(i*w/tiles,h*.17,w/tiles,h*.57)}
  x.fillStyle=optimized?'#6ed7e5':'#ff7469';x.font='600 10px ui-monospace,monospace';x.fillText(optimized?'TILE: 닿는 광원 목록만 계산':'NAIVE: 모든 픽셀 × 모든 광원',w*.66,h*.20);
 }
}
function calc(){
 const visible=S.step>=4?S.count:1,optimized=S.step>=5;
 const calcLights=optimized?Math.max(1,Math.ceil(visible*.38)):visible;
 const shadowLights=S.step<2?0:(optimized?Math.min(2,visible):visible);
 const faces=shadowLights*6,cost=.25+calcLights*.34+faces*.24;
 $('mLights').textContent=calcLights+(optimized&&visible>calcLights?` / ${visible}`:'');$('mFaces').textContent=faces;
 $('mLeak').textContent=S.step>=2?'차단':'높음';$('mLeak').classList.toggle('bad',S.step<2);$('mCost').textContent=cost.toFixed(1)+' ms';
 const pct=Math.min(100,cost/8*100);$('budget').style.width=pct+'%';$('budget').style.background=pct>80?'var(--red)':pct>50?'var(--amber)':'var(--cyan)';
 $('status').textContent=S.step<2?'빛이 벽을 통과함':optimized?`그림자 ${shadowLights}개만 선별`:S.step>=4?`그림자 ${shadowLights}개 × 6면`:'벽 뒤 가림 정상';
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-count]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.count===S.count)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];calc()}
function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{S.count=+b.dataset.count;ui()});
$('radius').oninput=e=>{S.radius=+e.target.value/100;$('radiusOut').textContent=e.target.value+'m'};
$('flicker').oninput=e=>{S.flicker=+e.target.value/100;$('flickerOut').textContent=e.target.value+'%'};
ui();requestAnimationFrame(frame);
})();
</script></body></html>
