<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q58 무게감 설계 실험실</title>
<style>
:root{--bg:#090e18;--panel:#121b29;--line:#304159;--ink:#f5f8fc;--muted:#9bacc1;--cyan:#67d6e8;--gold:#ffd06d;--green:#8ee3aa;--red:#ff807a}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.15;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#101e2b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070c14dd}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#607490}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#06151a}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#778ba3;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="같은 힘을 받은 가벼운 상자와 무거운 바위에 질량, 마찰과 반발, 관성 텐서, 감각 피드백을 차례로 더해 무게감을 설계하는 실험"></canvas><div class="hud"><span>Q58 · <b id="stage">질량만 바꾼 첫 시도</b></span><span id="status">움직임은 달라도 아직 장난감처럼 느껴짐</span></div></div>
<div class="steps" role="group" aria-label="무게감 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>같은 힘</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>질량</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>재질</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>관성 텐서</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>질량비 안정화</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>감각 피드백</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="mass">무거운 물체 질량</label><output id="massOut">180 kg</output></div><input id="mass" type="range" min="20" max="400" value="180"></div><div><div class="ct"><label for="friction">바닥 마찰</label><output id="frictionOut">0.68</output></div><input id="friction" type="range" min="5" max="95" value="68"></div><div class="toggles" role="group" aria-label="관성 텐서와 감각 피드백 설정"><button id="tensor" aria-pressed="false">관성 텐서</button><button id="feedback" aria-pressed="false">히트스톱+진동</button></div></div>
<div class="metrics"><div class="m"><small>같은 충격 뒤 이동</small><strong id="mMove">3.8 m</strong></div><div class="m"><small>회전 안정성</small><strong id="mSpin">낮음</strong></div><div class="m"><small>접촉 정착 시간</small><strong id="mSettle">2.4 s</strong></div><div class="m"><small>지각 무게감</small><strong id="mFeel">32 / 100</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,mass:180,friction:.68,tensor:false,feedback:false,t:0};
const names=['질량만 바꾼 첫 시도','F = ma가 이동 차이를 만듦','마찰·반발로 접촉 성격 분리','형상에 맞는 관성 텐서','극단 질량비의 솔버 안정화','물리 위에 지각 피드백 합성'],status=['움직임은 달라도 아직 장난감처럼 느껴짐','무거울수록 같은 충격에 덜 가속','바위는 버티고 상자는 튕김','긴 물체는 축마다 다르게 회전','무거운 바닥이 가벼운 상자에 끌려가지 않음','히트스톱·저주파 흔들림·진동이 무게를 완성'];
const desc=['<b>문제 재현:</b> 두 물체에 같은 속도를 직접 넣으면 질량을 바꿔도 거의 같은 궤적입니다. 숫자만 무겁고 눈에는 같은 장난감입니다.','<b>힘으로 밀기:</b> 같은 충격량을 주면 Δv = J/m이라 무거운 물체가 덜 움직입니다. 질량 슬라이더로 실제 이동 차이를 확인하세요.','<b>접촉의 성격:</b> 질량에 마찰·반발을 결합합니다. 무거운 물체는 잘 미끄러지지 않고 빨리 정착하며, 가벼운 물체는 튕겨 반응합니다.','<b>회전도 무게입니다:</b> 형상에 맞는 관성 텐서를 켜면 긴 물체가 막대처럼 축별로 다르게 돌고, 무거운 물체의 가벼운 팽이 회전이 사라집니다.','<b>정확성보다 안정성:</b> 극단 질량비는 반복 충돌을 떨리게 합니다. 질량비 클램프·반복 증가·슬리핑으로 무거운 기반을 안정시킵니다.','<b>마지막 절반은 지각:</b> 물리 결과는 유지한 채 접촉 순간의 짧은 히트스톱, 저주파 카메라 흔들림, 긴 진동과 둔한 저음을 합성합니다. 토글로 체감 차이를 비교하세요.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#50657a',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const massEffect=S.step>=1,material=S.step>=2,tensor=S.step>=3&&S.tensor,stable=S.step>=4,feedback=S.step>=5&&S.feedback,move=massEffect?Math.max(.35,690/S.mass)*(1.25-S.friction*.45):3.8,spin=tensor?'축별 관성':'팽이 회전',settle=material?Math.max(.5,3.1-S.friction*2.4)+(stable?-.25:.2):2.4,feel=Math.min(100,26+(massEffect?14:0)+(material?16:0)+(tensor?12:0)+(stable?8:0)+(feedback?22:0));return{massEffect,material,tensor,stable,feedback,move,spin,settle,feel}}
function body(px,py,size,color,angle,rock=false){x.save();x.translate(px,py);x.rotate(angle);x.fillStyle=color;if(rock){x.beginPath();for(let i=0;i<9;i++){const a=i/9*Math.PI*2,r=size*(.82+.16*Math.sin(i*7.3));x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()}else{x.fillRect(-size,-size,size*2,size*2);x.strokeStyle='#ffffff55';x.lineWidth=2;x.strokeRect(-size,-size,size*2,size*2)}x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),floor=h*.78,impact=(S.t%160)/160,jolt=v.feedback&&impact<.08?(1-impact/.08)*7:0,shake=jolt*Math.sin(S.t*1.8);x.save();x.translate(shake,shake*.35);x.fillStyle='#112331';x.fillRect(-10,-10,w+20,h+20);line(w*.04,floor,w*.96,floor,'#5f7487',3);for(let i=0;i<14;i++)line(w*(.05+i*.07),floor,w*(.08+i*.07),floor+12,'#26394b',2);
const left=w*.08,right=w*.54,travel=w*.28,lightX=left+travel*Math.min(1,impact*1.35),heavyX=right+travel*Math.min(1,impact*v.move/3.8),bounce=v.material?Math.abs(Math.sin(impact*Math.PI*3))*h*.08*(1-impact):0,heavyBob=v.material?Math.abs(Math.sin(impact*Math.PI*2))*h*.018*(1-impact):0,spinBase=impact*8,heavySpin=v.tensor?impact*.65:spinBase;
label('LIGHT CRATE · 20 kg',left,h*.19,'#67d6e8');label('HEAVY BODY · '+S.mass+' kg',right,h*.19,'#ffd06d');line(left,h*.27,left+travel,h*.27,'#67d6e8',2,[6,4]);line(right,h*.27,right+travel,h*.27,'#ffd06d',2,[6,4]);
body(lightX,floor-34-bounce,31,'#67d6e8',spinBase,false);body(heavyX,floor-45-heavyBob,43,'#ffd06d',heavySpin,true);
if(impact<.18){const a=1-impact/.18;line(left-58,floor-34,left-8,floor-34,'#ff807a',7);line(right-58,floor-45,right-8,floor-45,'#ff807a',7);label('SAME IMPULSE J',w*.48,h*.38,'#ff807a','center')}
if(S.step>=1&&S.step<3){label(`Δv LIGHT ${(18).toFixed(1)} m/s`,left+travel*.52,h*.48,'#67d6e8','center');label(`Δv HEAVY ${(360/S.mass).toFixed(1)} m/s`,right+travel*.45,h*.48,'#ffd06d','center')}
if(S.step>=2){for(let i=0;i<6;i++)line(right+i*17,floor+19,right+i*17+9,floor+9,'#ffd06d',3);label(`μ ${S.friction.toFixed(2)} · LOW RESTITUTION`,right+travel*.38,floor+38,'#ffd06d','center')}
if(S.step>=3){const cx=right+travel*.42,cy=h*.57;line(cx-55,cy,cx+55,cy,'#8ee3aa',2);line(cx,cy-38,cx,cy+38,'#8ee3aa',2);label(v.tensor?'Ix ≠ Iy ≠ Iz · SHAPE AWARE':'I = SCALAR · WRONG SPIN',cx,cy-47,v.tensor?'#8ee3aa':'#ff807a','center')}
if(S.step>=4){const sx=w*.48,sy=h*.68;for(let i=0;i<8;i++){x.fillStyle=v.stable?'#8ee3aa':'#ff807a';x.fillRect(sx+i*15,sy-(v.stable?0:Math.sin(S.t*.35+i)*6),9,5)}label(v.stable?'MASS RATIO CLAMP + SLEEPING':'CONTACT JITTER',sx+55,sy-13,v.stable?'#8ee3aa':'#ff807a','center')}
if(S.step>=5){const ix=heavyX,iy=floor-45-heavyBob;x.globalAlpha=v.feedback?.9:.18;x.strokeStyle='#8ee3aa';x.lineWidth=3;for(let r=58;r<120;r+=24){x.beginPath();x.arc(ix,iy,r+jolt*2,Math.PI*.12,Math.PI*.88);x.stroke()}x.globalAlpha=1;label(v.feedback?'6 FRAME HITSTOP · LOW-FREQ SHAKE · LONG RUMBLE':'PHYSICS ONLY',right+travel*.40,h*.34,v.feedback?'#8ee3aa':'#9bacc1','center')}x.restore()}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('tensor').setAttribute('aria-pressed',String(S.tensor));$('feedback').setAttribute('aria-pressed',String(S.feedback));const v=vals();$('mMove').textContent=v.move.toFixed(1)+' m';$('mSpin').textContent=v.spin;$('mSettle').textContent=v.settle.toFixed(1)+' s';$('mFeel').textContent=Math.round(v.feel)+' / 100';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.tensor=S.step>=3;S.feedback=S.step>=5;S.t=0;update()});$('mass').oninput=e=>{S.mass=+e.target.value;$('massOut').textContent=S.mass+' kg';S.t=0;update()};$('friction').oninput=e=>{S.friction=+e.target.value/100;$('frictionOut').textContent=S.friction.toFixed(2);S.t=0;update()};$('tensor').onclick=()=>{S.tensor=!S.tensor;S.t=0;update()};$('feedback').onclick=()=>{S.feedback=!S.feedback;S.t=0;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
