<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q73 중요도 기반 애님·AI LOD 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="모든 병사 풀 틱에서 애니메이션 LOD, AI LOD, 중요도 버킷, 타임 슬라이싱과 오프스크린 거시 시뮬까지 발전하는 실험"></canvas><div class="hud"><span>Q73 · <b id="stage">5천 명 전원 매 프레임 풀 틱</b></span><span id="status">보이지 않는 정밀도에도 같은 예산 소비</span></div></div>
<div class="steps" role="group" aria-label="중요도 기반 애님과 AI LOD 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전원 풀 틱</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>애님 LOD</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>AI LOD</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>중요도 버킷</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>타임 슬라이싱</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>보간·거시 Catch-up</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">선택 병사 카메라 거리</label><output id="distanceOut">70 m</output></div><input id="distance" type="range" min="5" max="180" value="70"></div><div><div class="ct"><label for="budget">프레임당 AI 갱신 예산</label><output id="budgetOut">700명</output></div><input id="budget" type="range" min="100" max="1500" step="100" value="700"></div><div class="toggles"><button id="interpolate" aria-pressed="false">표시 보간</button><button id="macro" aria-pressed="false">오프스크린 거시 시뮬</button></div></div>
<div class="metrics"><div class="m"><small>선택 병사 뼈 / 애님 Hz</small><strong id="mAnim">100 / 60Hz</strong></div><div class="m"><small>선택 병사 AI Hz</small><strong id="mAi">30 Hz</strong></div><div class="m"><small>이번 프레임 갱신</small><strong id="mUpdates">5,000명</strong></div><div class="m"><small>최대 반응 지연</small><strong id="mLag">33 ms</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,distance:70,budget:700,interpolate:false,macro:false,t:0};
const names=['5천 명 전원 매 프레임 풀 틱','화면 크기에 따라 뼈·평가율 축소','거리에 따라 판단 주파수·지능 축소','가까움·화면·위협으로 중요도 배정','총 예산 안에서 버킷을 순환 갱신','저Hz 표시는 보간·오프스크린은 거시 진행'],status=['보이지 않는 정밀도에도 같은 예산 소비','근접 100본 60Hz → 원거리 24본 10Hz','근접 전술 30Hz → 원거리 대열 1Hz','화면 기여도가 높은 개체부터 예산 확보','5천 명 갱신 스파이크를 여러 프레임으로 평탄화','micro를 꺼도 macro 세계 상태는 멈추지 않음'];
const desc=['<b>낭비 재현:</b> 카메라 뒤·능선의 몇 픽셀 병사도 눈앞 병사와 똑같이 100본, 풀 애님 그래프와 30Hz AI를 돌립니다.','<b>덜 정밀하게:</b> 거리가 멀수록 IK·표정을 끄고 뼈 수와 애님 평가 Hz를 낮춥니다. 평가 사이 포즈는 URO가 보간합니다.','<b>덜 똑똑하고 덜 자주:</b> 근접은 전술 행동트리·인지, 중간은 간이 전투, 원거리는 대열 유지 1Hz, 오프스크린은 부대 통계 상태만 갱신합니다.','<b>거리만이 아닌 기여도:</b> 거리·화면 안·위협도·플레이어 상호작용을 점수화해 HIGH/MID/LOW/OFF 버킷에 넣습니다.','<b>스파이크를 시간으로 펴기:</b> 프레임당 갱신 상한을 두고 버킷을 라운드로빈합니다. 가까운 버킷은 자주, 먼 버킷은 여러 프레임에 한 번 실행합니다.','<b>갱신과 표시를 분리:</b> 저Hz 위치·포즈는 매 프레임 보간하고 LOD 전환은 히스테리시스로 섞습니다. 오프스크린 부대도 거시 위치·목표·병력은 계속 전진합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const anim=S.step>=1,ai=S.step>=2,sig=S.step>=3,sliced=S.step>=4,interp=S.step>=5&&S.interpolate,macro=S.step>=5&&S.macro,off=S.distance>145,bones=!anim?100:S.distance<35?100:S.distance<90?52:S.distance<145?24:0,animHz=!anim?60:S.distance<35?60:S.distance<90?30:S.distance<145?10:2,aiHz=!ai?30:S.distance<35?30:S.distance<90?8:S.distance<145?1:macro?.2:0,updates=sliced?S.budget:5000,lag=aiHz?Math.round(1000/aiHz):Infinity,bucket=!sig?'ALL':off?'OFF':S.distance<35?'HIGH':S.distance<90?'MID':'LOW';return{anim,ai,sig,sliced,interp,macro,off,bones,animHz,aiHz,updates,lag,bucket}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),mapX=w*.05,mapY=h*.15,mapW=w*.57,mapH=h*.68,cx=mapX+mapW*.18,cy=mapY+mapH*.5;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#142936';x.fillRect(mapX,mapY,mapW,mapH);x.strokeStyle='#52677b';x.strokeRect(mapX,mapY,mapW,mapH);const radii=[mapW*.14,mapW*.28,mapW*.43,mapW*.58],cols=['#8ce3ae','#70ceff','#ffd06e','#ff7f78'];if(v.sig){radii.forEach((r,i)=>{x.strokeStyle=cols[i];x.globalAlpha=.6;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.globalAlpha=1;label(['HIGH 30Hz','MID 8Hz','LOW 1Hz','OFF MACRO'][i],cx+r*.72,cy-r*.72,cols[i])})}else label('ALL SOLDIERS · SAME 30Hz AI',mapX+mapW*.5,mapY+24,'#ff7f78');x.fillStyle='#f5f8fc';x.beginPath();x.arc(cx,cy,9,0,7);x.fill();label('CAMERA',cx,cy-20,'#f5f8fc');const selR=Math.min(mapW*.56,S.distance/180*mapW*.72),sx=cx+selR,sy=cy;x.fillStyle=v.bucket==='HIGH'?'#8ce3ae':v.bucket==='MID'?'#70ceff':v.bucket==='LOW'?'#ffd06e':'#ff7f78';x.beginPath();x.arc(sx,sy,8,0,7);x.fill();label(`SELECTED · ${v.bucket}`,sx,sy-20,x.fillStyle);if(S.step<3){const spokes=S.step===0?10:5,perception=S.step<2?42:22;for(let j=0;j<spokes;j++){const a=j/spokes*Math.PI*2;line(sx,sy,sx+Math.cos(a)*18,sy+Math.sin(a)*18,S.step===0?'#ff7f78':'#ffd06e',1)}x.strokeStyle=S.step<2?'#ff7f78':'#ffd06e';x.setLineDash([4,4]);x.beginPath();x.arc(sx,sy,perception,0,7);x.stroke();x.setLineDash([]);label(S.step===0?'100 BONES · 60Hz ANIM · 30Hz AI':S.step===1?'52 BONES · URO 30Hz · 30Hz AI':'52 BONES · URO 30Hz · SIMPLE AI 8Hz',mapX+mapW*.5,mapY+mapH-12,S.step===0?'#ff7f78':'#ffd06e')}for(let i=0;i<40;i++){const a=i*.9,r=20+(i%10)*mapW*.052,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.58;if(px>mapX&&px<mapX+mapW&&py>mapY&&py<mapY+mapH){x.globalAlpha=.42;x.fillStyle=cols[Math.min(3,Math.floor(r/(mapW*.14)))];x.beginPath();x.arc(px,py,3.5,0,7);x.fill();x.globalAlpha=1}}if(v.interp){line(sx-35,sy+30,sx+35,sy+30,'#8ce3ae',3);x.fillStyle='#8ce3ae';x.beginPath();x.arc(sx-35+((S.t*1.5)%70),sy+30,5,0,7);x.fill();label('1Hz UPDATE → 60fps DISPLAY',sx,sy+56,'#8ce3ae')}else if(v.ai&&v.aiHz<=1)label('VISIBLE POSITION JUMPS',sx,sy+35,'#ff7f78');
const px=w*.69,pw=w*.25;label('FRAME UPDATE BUDGET',px+pw*.5,h*.16,'#70ceff');const total=5000,done=v.updates,slot=Math.floor(S.t/18)%5;for(let i=0;i<5;i++){const y=h*(.25+i*.11);x.fillStyle='#203748';x.fillRect(px,y,pw,17);const active=!v.sliced||i===slot;x.fillStyle=active?'#8ce3ae':'#52677b';x.fillRect(px,y,pw*(v.sliced?done/total:1),17);label(`BUCKET ${i+1} ${active?'UPDATE':'WAIT'}`,px,y-7,active?'#8ce3ae':'#788ba1','left')}if(v.macro)label('OFFSCREEN MICRO OFF · MACRO ADVANCES',px+pw*.5,h*.84,'#ffd06e');
$('mAnim').textContent=v.bones+' / '+v.animHz+'Hz';$('mAi').textContent=v.aiHz?`${v.aiHz} Hz`:'정지';$('mUpdates').textContent=v.updates.toLocaleString()+'명';$('mLag').textContent=isFinite(v.lag)?v.lag.toLocaleString()+' ms':'무한';c.dataset.bucket=v.bucket;c.dataset.updates=v.updates}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('interpolate').setAttribute('aria-pressed',String(S.interpolate));$('macro').setAttribute('aria-pressed',String(S.macro));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.interpolate=S.step>=5;S.macro=S.step>=5;S.t=0;update()});$('distance').oninput=e=>{S.distance=+e.target.value;$('distanceOut').textContent=S.distance+' m';update()};$('budget').oninput=e=>{S.budget=+e.target.value;$('budgetOut').textContent=S.budget.toLocaleString()+'명';update()};$('interpolate').onclick=()=>{S.interpolate=!S.interpolate;update()};$('macro').onclick=()=>{S.macro=!S.macro;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
