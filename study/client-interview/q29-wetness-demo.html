<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q29 월드 웨트니스 단계형 실험실</title>
<style>
:root{--bg:#071018;--panel:#101d26;--line:#29414e;--ink:#edf8ff;--muted:#91a9b7;--rain:#62c8ff;--dry:#b99069;--wet:#255873;--red:#ff7e78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#111d25}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#071018dd}.hud b{color:var(--rain)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#4c7184}button:focus-visible,input:focus-visible{outline:2px solid var(--rain);outline-offset:2px}button[aria-pressed=true]{background:var(--rain);border-color:var(--rain);color:#06131b}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--rain);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--rain)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#708997;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="전역 즉발 젖음에서 하늘 노출, 상방 노멀, 시간 누적, 재질 다공성과 웅덩이까지 쌓는 비 오는 안뜰"></canvas><div class="hud"><span>Q29 · <b id="stage">전역 wetness 스위치</b></span><span id="status">실내까지 즉시 젖음</span></div></div>
<div class="steps" role="group" aria-label="월드 웨트니스 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전역 즉발</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>하늘 노출</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>상방 노멀</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>시간 누적·마름</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>재질 다공성</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>웅덩이·브로드캐스트</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="rain">비 강도</label><output id="rainOut">70%</output></div><input id="rain" type="range" min="0" max="100" value="70"></div><div><div class="ct"><label for="speed">시간 배속</label><output id="speedOut">1.0×</output></div><input id="speed" type="range" min="1" max="30" value="10"></div><div class="toggles" role="group" aria-label="날씨 진행과 캐릭터 위치"><button id="weather" aria-pressed="true">비 진행 중</button><button id="shelter" aria-pressed="false">처마 아래 이동</button></div></div>
<div class="metrics"><div class="m"><small>글로벌 wetness</small><strong id="mWorld">0%</strong></div><div class="m"><small>천 흡수</small><strong id="mCloth">0%</strong></div><div class="m"><small>돌 젖음</small><strong id="mStone">0%</strong></div><div class="m"><small>웅덩이 깊이</small><strong id="mPuddle">0 mm</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,rain:.7,speed:1,weather:true,shelter:false,wet:0,last:performance.now()},names=['global roughness/albedo switch','top-down sky occlusion','sky × saturate(N·up)','rain × dt accumulation','porosity response','puddle mask + global broadcast'],desc=['<b>문제 재현:</b> 전역 값을 켜 모든 재질의 알베도와 러프니스를 즉시 바꾸면 처마 밑, 벽 옆면, 천과 금속까지 한순간에 똑같이 젖습니다.','<b>젖을 수 있는 곳:</b> top-down 하늘 가림 마스크로 지붕 아래는 비를 받지 않게 합니다. 「처마 아래 이동」으로 동적 캐릭터 노출 게이트도 확인하세요.','<b>방향까지 제한:</b> 하늘 노출에 N·up을 곱해 윗면은 젖고 수직면·밑면은 마른 채 남습니다. 젖은 세계 속 마른 섬이 공간감을 만듭니다.','<b>상태를 적분:</b> 비 강도×dt로 천천히 0→1을 쌓고, 비를 멈추면 더 느리게 마릅니다. 버튼으로 비를 멈춰 실제 감쇠를 보세요.','<b>같은 비, 다른 반응:</b> porosity가 높은 천은 빠르게 흡수·다크닝되고 돌은 천천히, 금속은 색 대신 물방울 반사만 남습니다.','<b>세계 하나의 날씨:</b> 글로벌 wetness를 각 재질 마스크가 다르게 소비하고, 낮고 오목한 돌 틈은 마지막에 웅덩이와 파문을 축적합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function mix(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t|0)}function col(a){return`rgb(${a[0]},${a[1]},${a[2]})`}function tag(t,px,py,co='#edf8ff'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(4,12,18,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,mask=S.step>=1,normal=S.step>=2,timed=S.step>=3,porous=S.step>=4,puddle=S.step>=5,instant=timed?S.wet:(S.weather?S.rain:0),outdoor=instant,covered=mask?0:instant,wall=normal?instant*.12:instant,cloth=porous?Math.min(1,instant*1.45):instant,stone=porous?instant*.72:instant;x.fillStyle='#324856';x.fillRect(0,0,w,h);x.fillStyle='#1b2a31';x.fillRect(0,h*.16,w*.33,h*.84);x.fillStyle='#9c7350';x.fillRect(0,h*.16,w*.38,h*.08);x.fillStyle=col(mix([135,112,91],[45,66,76],covered));x.fillRect(0,h*.58,w*.38,h*.42);x.fillStyle=col(mix([151,126,98],[45,69,78],stone));x.fillRect(w*.38,h*.58,w*.62,h*.42);for(let i=0;i<9;i++){x.strokeStyle='rgba(8,20,26,.35)';x.strokeRect(w*(.38+i%3*.21),h*(.58+Math.floor(i/3)*.14),w*.21,h*.14)}x.fillStyle=col(mix([119,89,65],[46,54,58],wall));x.fillRect(w*.68,h*.23,w*.09,h*.35);x.fillStyle=col(mix([151,83,65],[43,55,63],cloth));x.beginPath();x.moveTo(w*.48,h*.22);x.lineTo(w*.59,h*.22);x.lineTo(w*.57,h*.55);x.lineTo(w*.50,h*.55);x.closePath();x.fill();if(S.weather){x.strokeStyle='rgba(120,211,255,.65)';x.lineWidth=1;for(let i=0;i<80*S.rain;i++){let px=(i*97+performance.now()*.08)%w,py=(i*53+performance.now()*.17)%h;x.beginPath();x.moveTo(px,py);x.lineTo(px-4,py+13);x.stroke()}}if(mask){x.fillStyle='rgba(255,126,120,.16)';x.fillRect(0,h*.24,w*.38,h*.34);tag('SKY OCCLUSION = 0',w*.08,h*.35,'#ff9c98')}if(normal)tag('N·UP ≈ 0 · VERTICAL DRY',w*.66,h*.52,'#ffdd9b');if(porous){tag('CLOTH '+Math.round(cloth*100)+'%',w*.47,h*.18,'#62c8ff');tag('STONE '+Math.round(stone*100)+'%',w*.78,h*.73,'#62c8ff')}if(puddle&&instant>.35){const d=(instant-.35)/.65;x.fillStyle=`rgba(65,156,200,${.18+d*.45})`;x.beginPath();x.ellipse(w*.76,h*.82,w*.15*d+15,h*.055*d+5,0,0,7);x.fill();for(let i=0;i<3;i++){x.strokeStyle=`rgba(174,232,255,${.55-i*.12})`;x.beginPath();x.ellipse(w*.76,h*.82,18+i*16,5+i*4,0,0,7);x.stroke()}tag('CURVATURE BASIN → RIPPLE',w*.67,h*.93,'#aee9ff')}const cx=S.shelter?w*.23:w*.47;x.fillStyle='#e7be8f';x.beginPath();x.arc(cx,h*.45,12,0,7);x.fill();x.strokeStyle=S.shelter?'#ff9c98':'#62c8ff';x.lineWidth=5;x.beginPath();x.moveTo(cx,h*.48);x.lineTo(cx,h*.57);x.stroke();tag(S.shelter?'DYNAMIC SKY GATE = 0':'DYNAMIC SKY GATE = 1',cx-55,h*.43,S.shelter?'#ff9c98':'#62c8ff');if(S.step===0)tag('ONE GLOBAL SWITCH · EVERY SURFACE',w*.48,h*.10,'#ff7e78')}
function metrics(){const timed=S.step>=3,v=timed?S.wet:(S.weather?S.rain:0),cloth=S.step>=4?Math.min(1,v*1.45):v,stone=S.step>=4?v*.72:v,p=S.step>=5?Math.max(0,(v-.35)/.65)*18:0;$('mWorld').textContent=Math.round(v*100)+'%';$('mCloth').textContent=Math.round(cloth*100)+'%';$('mStone').textContent=Math.round(stone*100)+'%';$('mPuddle').textContent=p.toFixed(1)+' mm'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['실내까지 즉시 젖음','처마는 마름','윗면만 젖음','젖고 천천히 마름','재질별 시간차','세계 상태 일관'][S.step];$('explain').innerHTML=desc[S.step];$('weather').setAttribute('aria-pressed',String(S.weather));$('weather').textContent=S.weather?'비 진행 중':'비 멈춤 · 마르는 중';$('shelter').setAttribute('aria-pressed',String(S.shelter));metrics();draw()}function tick(now){let dt=Math.min(.05,(now-S.last)/1000)*S.speed;S.last=now;if(S.step>=3)S.wet=Math.max(0,Math.min(1,S.wet+(S.weather?S.rain*.11:-.035)*dt));metrics();draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step>=5&&S.wet<.65)S.wet=.65;else if(S.step>=4&&S.wet<.35)S.wet=.35;else if(S.step>=3&&S.wet<.12)S.wet=.12;ui()});$('rain').oninput=e=>{S.rain=+e.target.value/100;$('rainOut').textContent=e.target.value+'%';ui()};$('speed').oninput=e=>{S.speed=+e.target.value/10;$('speedOut').textContent=S.speed.toFixed(1)+'×';ui()};$('weather').onclick=()=>{S.weather=!S.weather;ui()};$('shelter').onclick=()=>{S.shelter=!S.shelter;ui()};ui();requestAnimationFrame(tick);addEventListener('resize',draw)})();
</script></body></html>
