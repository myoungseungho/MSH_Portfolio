<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q17 캐스케이드 섀도우맵 단계형 실험실</title>
<style>
:root{--bg:#090d13;--panel:#121a25;--line:#2b394b;--ink:#edf3fa;--muted:#94a5b9;--amber:#ffca68;--cyan:#65d6e5;--red:#ff7077}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#080c12}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--amber)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171106}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6e8096;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="오픈월드 한 장 섀도우맵을 거리별 캐스케이드로 분할하고 경계 블렌드, 텍셀 스냅, 원거리 캐싱을 적용하는 단계"></canvas><div class="hud"><span>Q17 · <b id="stage">한 장으로 2km</b></span><span id="status">근거리 텍셀 부족</span></div></div>
<div class="steps" role="group" aria-label="캐스케이드 섀도우맵 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>한 장의 실패</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>거리 분할</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>실용 분할</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>경계 팝</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>블렌드·스냅</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>PCF·캐싱·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="split">로그 분할 가중치 λ</label><output id="splitOut">50%</output></div><input id="split" type="range" min="0" max="100" value="50"></div><div><div class="ct"><label for="blend">경계 블렌드 폭</label><output id="blendOut">0%</output></div><input id="blend" type="range" min="0" max="30" value="0"></div><div class="toggles" role="group" aria-label="캐스케이드 안정화와 비용 옵션"><button id="snap" aria-pressed="false">텍셀 스냅</button><button id="cache" aria-pressed="false">원거리 캐시·LOD</button></div></div>
<div class="metrics"><div class="m"><small>근거리 텍셀 크기</small><strong id="mTexel">97.7 cm</strong></div><div class="m"><small>경계 대비</small><strong id="mSeam">—</strong></div><div class="m"><small>카메라 이동 흔들림</small><strong id="mShimmer">3.2 px</strong></div><div class="m"><small>그림자 패스 / frame</small><strong id="mDraws">1.0×</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,lambda:.5,blend:0,snap:false,cache:false},names=['한 장으로 2km','프러스텀 4분할','practical split','캐스케이드 경계 노출','경계 블렌드 + 스냅','거리별 PCF + 캐싱·LOD'];
const desc=['<b>문제 재현:</b> 2048² 한 장으로 눈앞부터 2km까지 덮으면 텍셀 하나가 거의 1m입니다. 발밑 그림자가 레고 블록처럼 깨지고, 보이지도 않는 원거리에 같은 정밀도를 낭비합니다.','<b>예산 재배치:</b> 카메라 시야를 근·중·원 4구간으로 나누고 각 구간에 별도 맵을 배정합니다. 같은 2048²라도 좁은 근거리 영역은 훨씬 촘촘해집니다.','<b>지각에 맞춘 분할:</b> 균등 분할은 근거리에 여전히 성기고 순수 로그는 너무 몰립니다. λ로 둘을 섞은 practical split을 조절해 화면 크기에 맞게 텍셀을 배분합니다.','<b>새 실패:</b> 서로 다른 텍셀 크기가 만나는 거리에서 그림자 품질이 한 줄로 튀고, 카메라가 조금 움직일 때 광원 격자가 어긋나 먼 가장자리가 기어 다닙니다.','<b>전이와 시간 안정성:</b> 경계 주변에서 두 캐스케이드를 섞어 품질 점프를 그라데이션으로 바꾸고, 투영 원점을 월드 텍셀 단위로 스냅해 프레임 사이 흔들림을 없앱니다.','<b>최종 예산:</b> 근거리는 작은 PCF로 또렷하게, 원거리는 넓게 필터링합니다. 원거리 캐스케이드는 N프레임 재사용하고 그림자 LOD·작은 캐스터 컬링으로 4장 비용을 회수합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#eef3fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.84)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function splits(){const l=S.lambda,a=[.12,.31,.58];return a.map((v,i)=>v*(1-l)+[.035,.13,.37][i]*l)}
function drawShadow(px,py,size,blocks,alpha=.76){x.fillStyle=`rgba(2,4,7,${alpha})`;if(blocks<=1){x.beginPath();x.moveTo(px,py);x.lineTo(px+size*1.55,py+size*.22);x.lineTo(px+size*1.7,py+size*.36);x.lineTo(px+4,py+size*.15);x.fill();return}const n=blocks,step=size*1.55/n;for(let i=0;i<n;i++)x.fillRect(px+i*step,py+i*size*.22/n,step+1,Math.max(3,size*.15))}
function tree(px,ground,scale){x.fillStyle='#473226';x.fillRect(px-4*scale,ground-28*scale,8*scale,28*scale);x.fillStyle='#315b3d';for(const d of [[0,-42,16],[-9,-34,12],[10,-33,13]]){x.beginPath();x.arc(px+d[0]*scale,ground+d[1]*scale,d[2]*scale,0,7);x.fill()}}
function frustum(w,h,sp){const ox=w*.72,oy=h*.12,fw=w*.23,fh=h*.30;x.fillStyle='rgba(6,11,17,.82)';x.fillRect(ox,oy,fw,fh);x.strokeStyle='#73869b';x.lineWidth=1;x.beginPath();x.moveTo(ox+fw*.10,oy+fh*.86);x.lineTo(ox+fw*.86,oy+fh*.08);x.moveTo(ox+fw*.10,oy+fh*.86);x.lineTo(ox+fw*.94,oy+fh*.88);x.stroke();const cols=['#69d8e5','#87bd78','#d0aa62','#b07b85'],p=S.step===0?[0,1]:[0,...sp,1];for(let i=0;i<p.length-1;i++){const t=p[i+1],yy=oy+fh*(.86-t*.70),xx=ox+fw*(.10+t*.76);x.strokeStyle=cols[i];x.beginPath();x.moveTo(xx,yy);x.lineTo(ox+fw*(.10+t*.84),oy+fh*.86);x.stroke();x.fillStyle=cols[i];x.font='600 8px ui-monospace,monospace';x.fillText('C'+i,xx+3,yy-3)}tag(S.step===0?'1 MAP · 0–2000m':'4 MAPS · SPLIT VIEW',ox+8,oy+15,S.step===0?'#ff7077':'#65d6e5')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,g=h*.79,sp=splits();x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,g);sky.addColorStop(0,'#18344d');sky.addColorStop(1,'#6a817c');x.fillStyle=sky;x.fillRect(0,0,w,g);x.fillStyle='#1a2b20';x.fillRect(0,g,w,h-g);x.fillStyle='#304a36';x.beginPath();x.moveTo(0,g);x.lineTo(w*.52,h*.38);x.lineTo(w,g);x.fill();x.strokeStyle='#899f8c';x.lineWidth=1;x.beginPath();x.moveTo(0,g);x.lineTo(w,g);x.stroke();
const zs=[.15,.32,.53,.72],sizes=[1,.68,.43,.27];for(let i=3;i>=0;i--){const px=w*(.17+zs[i]*.58),gy=g-zs[i]*h*.23,sc=sizes[i];tree(px,gy,sc);let blocks=S.step===0?3:S.step>=5?Math.max(2,11-i*2):Math.max(2,14-i*3);drawShadow(px+4*sc,gy,34*sc,blocks,.72-i*.08)}
// near hero and its visibly aliased/clean shadow
const hx=w*.20,hy=g-3;x.strokeStyle='#e5edf5';x.lineWidth=6;x.lineCap='round';x.beginPath();x.arc(hx,hy-61,10,0,7);x.stroke();x.beginPath();x.moveTo(hx,hy-49);x.lineTo(hx,hy-22);x.moveTo(hx,hy-22);x.lineTo(hx-11,hy);x.moveTo(hx,hy-22);x.lineTo(hx+12,hy);x.stroke();drawShadow(hx+8,hy,52,S.step===0?3:20,.86);
if(S.step===0){tag('97.7 cm / texel',w*.08,h*.58,'#ff7077');x.strokeStyle='#ff7077';x.lineWidth=2;for(let i=0;i<6;i++)x.strokeRect(hx+18+i*13,hy+6+i*2,12,9)}
if(S.step>=1){const bands=[0,...sp,1],cols=['rgba(101,214,229,.10)','rgba(135,189,120,.09)','rgba(208,170,98,.08)','rgba(176,123,133,.08)'];for(let i=0;i<4;i++){const xa=w*(.06+bands[i]*.62),xb=w*(.06+bands[i+1]*.62);x.fillStyle=cols[i];x.fillRect(xa,h*.46,xb-xa,g-h*.46);x.fillStyle=['#65d6e5','#87bd78','#d0aa62','#b07b85'][i];x.font='600 9px ui-monospace,monospace';x.fillText('C'+i,xa+6,h*.50)}}
if(S.step>=3){const bx=w*(.06+sp[1]*.62);if(S.blend===0){x.strokeStyle='#ff7077';x.lineWidth=3;x.beginPath();x.moveTo(bx,h*.47);x.lineTo(bx,g);x.stroke();tag('해상도 POP',bx+8,h*.62,'#ff7077')}else{const bw=w*S.blend/250,gx=x.createLinearGradient(bx-bw,0,bx+bw,0);gx.addColorStop(0,'rgba(101,214,229,0)');gx.addColorStop(.5,'rgba(101,214,229,.28)');gx.addColorStop(1,'rgba(101,214,229,0)');x.fillStyle=gx;x.fillRect(bx-bw,h*.47,bw*2,g-h*.47);tag('C1 × C2 BLEND',bx-bw*.7,h*.61,'#65d6e5')}}
if(S.step>=4){const yy=h*.42;x.strokeStyle=S.snap?'#65d6e5':'#ff7077';for(let i=0;i<13;i++){const off=S.snap?0:(i%2)*3;x.strokeRect(w*.07+i*11+off,yy+(i%2)*2,10,8)}tag(S.snap?'WORLD TEXEL SNAP · 고정':'CAMERA MOVE · GRID DRIFT',w*.07,yy-8,S.snap?'#65d6e5':'#ff7077')}
if(S.step>=5){tag('NEAR: 3×3 PCF',w*.07,h*.33,'#65d6e5');tag('FAR: 7×7 · N-FRAME CACHE',w*.35,h*.28,'#ffca68');if(S.cache){x.fillStyle='rgba(101,214,229,.16)';x.fillRect(w*.55,h*.12,w*.11,h*.12);tag('REUSE',w*.57,h*.18,'#65d6e5')}}
frustum(w,h,S.step===0?[.25,.5,.75]:sp)}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['근거리 텍셀 부족','필요한 곳에 4장','근거리 밀도 조절','선·스위밍 발생','전이·격자 안정','원거리 비용 회수'][S.step];$('snap').setAttribute('aria-pressed',String(S.snap));$('cache').setAttribute('aria-pressed',String(S.cache));const near=S.step===0?97.7:Math.max(2.4,10.5-S.lambda*7.4);$('mTexel').textContent=near.toFixed(1)+' cm';$('mSeam').textContent=S.step<3?'—':S.blend===0?'42% (선명)':Math.max(2,42-S.blend*1.35).toFixed(0)+'%';$('mShimmer').textContent=S.step>=4&&S.snap?'0.0 px':'3.2 px';$('mDraws').textContent=S.step===0?'1.0×':S.step>=5&&S.cache?'1.9× avg':'4.0×';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===3){S.blend=0;$('blend').value=0;$('blendOut').textContent='0%'}if(S.step===4){S.blend=14;$('blend').value=14;$('blendOut').textContent='14%'}ui()});$('split').oninput=e=>{S.lambda=+e.target.value/100;$('splitOut').textContent=e.target.value+'%';ui()};$('blend').oninput=e=>{S.blend=+e.target.value;$('blendOut').textContent=e.target.value+'%';ui()};$('snap').onclick=()=>{S.snap=!S.snap;ui()};$('cache').onclick=()=>{S.cache=!S.cache;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
