<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q6 안개 속 빛 산란 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5;--red:#ff7469}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root">
<div class="viewport"><canvas id="scene" role="img" aria-label="블룸과 볼류메트릭 안개 산란의 차이를 단계별로 보여주는 밤거리"></canvas><div class="hud"><span>Q6 · <b id="stage">밝은 픽셀</b></span><span id="status">공기 산란 없음</span></div></div>
<div class="steps" role="group" aria-label="안개 산란 구현 단계">
<button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>밝은 픽셀</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>블룸</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>볼류메트릭</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>가림·빛기둥</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>위상 함수</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>국소·최적화</button>
</div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="density">안개 밀도</label><output id="densityOut">55%</output></div><input id="density" type="range" min="0" max="100" value="55"></div><div><div class="ct"><label for="samples">레이 마칭 표본</label><output id="samplesOut">48</output></div><input id="samples" type="range" min="8" max="96" value="48"></div><div class="toggles" role="group" aria-label="카메라 시선"><button data-view="0" aria-pressed="true">→ 빛을 마주봄</button><button data-view="1" aria-pressed="false">← 등지고 봄</button></div></div>
<div class="metrics"><div class="m"><small>공기 산란량</small><strong id="mScatter">0%</strong></div><div class="m"><small>가림 반영</small><strong id="mShadow">없음</strong></div><div class="m"><small>프로그 표본</small><strong id="mSamples">0</strong></div><div class="m"><small>예상 비용</small><strong id="mCost">0.2 ms</strong></div></div>
</div><script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,density:.55,samples:48,view:0,t:0};
const names=['밝은 픽셀','블룸','볼류메트릭','가림·빛기둥','위상 함수','국소·최적화'];
const desc=['<b>출발:</b> 랜턴과 네온이 HDR로 밝을 뿐, 빛과 카메라 사이의 공기는 계산하지 않습니다.','<b>광학적 번짐:</b> 화면의 밝은 픽셀을 2D로 흐립니다. 후광은 생기지만 안개 밀도·벽 가림·공간 깊이와 무관합니다.','<b>공간적 산란:</b> 카메라 광선을 여러 지점에서 표본화해 안개 입자가 카메라로 보낸 빛을 누적합니다. 밀도 슬라이더가 이제 후광 폭과 함께 움직입니다.','<b>가시성 추가:</b> 각 표본에서 광원이 보이는지 그림자 맵으로 확인합니다. 차양과 사람 뒤에 산란이 끊겨 빛기둥의 경계가 생깁니다.','<b>방향성 추가:</b> 위상 함수가 빛 진행 방향과 시선의 각도를 반영합니다. “빛을 마주봄/등지고 봄”을 바꾸면 같은 안개도 밝기가 달라집니다.','<b>최종:</b> 필요한 골목에만 국소 3D 밀도를 넣고 저해상도 프로그를 시간 누적으로 채웁니다. 표본은 줄지만 빠른 카메라에는 잔상을 관리해야 합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function glow(cx,cy,r,col,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.35,`rgba(${col},${a*.45})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function poly(p,fill){x.fillStyle=fill;x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fill()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,d=S.density,vol=S.step>=2,shadow=S.step>=3,phase=S.step>=4,local=S.step>=5;x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#07101f');sky.addColorStop(1,'#18222c');x.fillStyle=sky;x.fillRect(0,0,w,h);
// buildings and wet street
x.fillStyle='#0c1119';x.fillRect(0,h*.18,w*.23,h*.55);x.fillRect(w*.78,h*.12,w*.22,h*.61);x.fillStyle='#131922';x.fillRect(w*.24,h*.38,w*.18,h*.35);x.fillRect(w*.62,h*.31,w*.15,h*.42);poly([[0,h*.73],[w,h*.73],[w,h],[0,h]],'#111923');
for(let i=0;i<7;i++){x.fillStyle=i%2?'#ff4f9a':'#42e0e8';x.fillRect((i<4?w*.04:w*.82)+(i%4)*w*.035,h*(.27+(i%3)*.09),w*.022,h*.055)}
const lx=w*.52,ly=h*.28; // central lamp
x.strokeStyle='#4e5968';x.lineWidth=5;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx,h*.73);x.stroke();x.fillStyle='#fff2bd';x.fillRect(lx-16,ly-5,32,11);
if(S.step>=1)glow(lx,ly,55+d*55,'255,196,92',.85);
if(vol){const directional=phase?(S.view===0?1.0:.32):.68,scatter=d*directional;const fog=x.createLinearGradient(0,h*.18,0,h*.74);fog.addColorStop(0,`rgba(105,152,177,${scatter*.06})`);fog.addColorStop(1,`rgba(105,152,177,${scatter*.32})`);x.fillStyle=fog;x.fillRect(0,h*.18,w,h*.56);glow(lx,ly,w*(.16+d*.21),'255,205,126',scatter*.58);
 const beamAlpha=scatter*.42;poly([[lx-13,ly],[w*.28,h*.73],[w*.43,h*.73],[lx+2,ly]],`rgba(255,210,135,${beamAlpha})`);poly([[lx+13,ly],[w*.66,h*.73],[w*.78,h*.73],[lx-2,ly]],`rgba(255,210,135,${beamAlpha*.8})`);
 if(shadow){poly([[w*.395,h*.52],[w*.34,h*.73],[w*.46,h*.73]],'rgba(7,11,17,.67)');poly([[w*.69,h*.45],[w*.63,h*.73],[w*.77,h*.73]],'rgba(7,11,17,.7)')}
 if(local){for(let i=0;i<14;i++){const px=w*(.11+(i%7)*.12),py=h*(.47+Math.floor(i/7)*.15);x.strokeStyle='rgba(110,215,229,.20)';x.strokeRect(px,py,w*.10,h*.12)}glow(w*.20,h*.64,w*.17,'80,220,235',d*.25)}
}
// silhouettes after fog
x.fillStyle='#080b10';x.fillRect(w*.385,h*.49,w*.022,h*.24);x.beginPath();x.arc(w*.396,h*.47,10,0,7);x.fill();x.fillRect(w*.68,h*.42,w*.025,h*.31);x.beginPath();x.arc(w*.692,h*.40,11,0,7);x.fill();
// wet reflection
if(S.step>=1){const rg=x.createLinearGradient(lx,h*.72,lx,h);rg.addColorStop(0,'rgba(255,190,90,.30)');rg.addColorStop(1,'rgba(255,190,90,0)');x.fillStyle=rg;x.beginPath();x.moveTo(lx-8,h*.72);x.lineTo(lx+8,h*.72);x.lineTo(lx+w*.10,h);x.lineTo(lx-w*.10,h);x.fill()}
if(S.step===1){x.fillStyle='rgba(7,10,15,.83)';x.fillRect(w*.06,h*.10,w*.34,h*.10);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('2D 후처리: 안개 밀도와 무관',w*.08,h*.145);x.fillStyle='#8c99aa';x.font='10px system-ui';x.fillText('빛기둥과 공간 가림을 만들 수 없음',w*.08,h*.18)}
if(S.step>=2){x.fillStyle=phase?'#6ed7e5':'#a8b6c8';x.font='600 10px ui-monospace,monospace';x.fillText(phase?(S.view===0?'PHASE: 전방 산란 강함':'PHASE: 후방 산란 약함'):'RAY MARCH: 공기 중 표본 누적',w*.62,h*.20)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.view===S.view)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];const phase=S.step>=4?(S.view===0?1:.32):.68,scatter=S.step>=2?Math.round(S.density*phase*100):0,actual=S.step>=2?(S.step>=5?Math.round(S.samples*.42):S.samples):0,cost=.2+actual*.035+(S.step>=3?.55:0);$('mScatter').textContent=scatter+'%';$('mShadow').textContent=S.step>=3?'그림자 맵':'없음';$('mSamples').textContent=actual;$('mCost').textContent=cost.toFixed(1)+' ms';$('status').textContent=['공기 산란 없음','2D 후광만','균일 산란','가림 경계 생성',S.view===0?'전방 산란 강함':'후방 산란 약함','국소 프로그·누적'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=+b.dataset.view;ui()});$('density').oninput=e=>{S.density=+e.target.value/100;$('densityOut').textContent=e.target.value+'%';ui()};$('samples').oninput=e=>{S.samples=+e.target.value;$('samplesOut').textContent=e.target.value;ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
