<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q9 피부 SSS 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="피부 앞면 산란과 귀의 역광 투과를 단계별로 분리한 얼굴 렌더링"></canvas><div class="hud"><span>Q9 · <b id="stage">표준 PBR 피부</b></span><span id="status">딱딱한 그림자</span></div></div>
<div class="steps" role="group" aria-label="피부 SSS 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>표준 PBR</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>현상 분리</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>앞면 SSSS</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>두께 투과</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>각도 게이트</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>SSS LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="scatter">산란 반경</label><output id="scatterOut">55%</output></div><input id="scatter" type="range" min="0" max="100" value="55"></div><div><div class="ct"><label for="thickness">귀 두께</label><output id="thicknessOut">25%</output></div><input id="thickness" type="range" min="5" max="100" value="25"></div><div class="toggles" role="group" aria-label="광원 방향"><button data-light="0" aria-pressed="true">☀ 앞광</button><button data-light="1" aria-pressed="false">☀ 역광</button><button data-light="2" aria-pressed="false">☀ 측광</button></div></div>
<div class="metrics"><div class="m"><small>앞면 산란</small><strong id="mFront">0%</strong></div><div class="m"><small>귀 투과</small><strong id="mTrans">0%</strong></div><div class="m"><small>피부 처리</small><strong id="mMode">표준 BRDF</strong></div><div class="m"><small>상대 비용</small><strong id="mCost">1.0×</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,scatter:.55,thickness:.25,light:0,t:0},names=['표준 PBR 피부','산란·투과 분리','앞면 SSSS','두께맵 투과','각도 게이트','SSS LOD'];
const desc=['<b>문제 재현:</b> 표준 디퓨즈는 빛이 표면에서 즉시 튄다고 봅니다. 그림자 경계가 칼처럼 단단하고 역광의 귀가 검어 밀랍 인형처럼 보입니다.','<b>현상 분리:</b> 피부 속 빛을 “앞면에서 옆으로 퍼지는 산란”과 “얇은 부위를 뒤에서 통과하는 투과”로 나눕니다. 아직 계산은 적용하지 않은 진단 단계입니다.','<b>앞면 산란:</b> 디퓨즈 조명만 채널별로 흐립니다. 빨강을 더 넓게 퍼뜨려 코·볼의 그림자 경계가 발그레하고 부드러워집니다.','<b>두께 데이터:</b> 귀 두께맵을 사용해 얇은 곳에만 역광 투과를 더합니다. 귀 두께를 올리면 같은 역광에서도 붉은 빛이 줄어듭니다.','<b>방향 조건:</b> 두께만으로는 앞광에서도 얼굴이 발광합니다. 빛이 실제로 뒤에서 시선 쪽으로 올 때만 투과를 열어 두꺼운 볼과 잘못된 각도를 차단합니다.','<b>최종 LOD:</b> 가까운 히어로는 SSSS+투과, 중거리는 프리인테그레이티드 LUT, 먼 군중은 디퓨즈 틴트로 전환합니다. 화면에 보이는 가치만큼 비용을 씁니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function glow(cx,cy,r,col,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,front=S.step>=2,trans=S.step>=3,gate=S.step>=4,lod=S.step>=5,cx=w*.50,cy=h*.48,r=Math.min(w*.18,h*.34),back=S.light===1,side=S.light===2;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,back?'#4b2831':'#152337');bg.addColorStop(1,'#0b1019');x.fillStyle=bg;x.fillRect(0,0,w,h);
const lightX=back?w*.82:side?w*.17:w*.37,lightY=back?h*.24:h*.22;glow(lightX,lightY,w*.15,'255,193,107',.65);x.fillStyle='#fff2bc';x.beginPath();x.arc(lightX,lightY,9,0,7);x.fill();
// neck
x.fillStyle='#9f604d';x.fillRect(cx-r*.30,cy+r*.60,r*.60,r*.55);
// ears behind head
const transStrength=trans&&back?Math.max(0,1-S.thickness)*(gate?1:.8):trans&&!gate?.25:0;for(const s of [-1,1]){const ex=cx+s*r*.92,ey=cy;x.fillStyle=transStrength?`rgb(${210+Math.round(transStrength*35)},${82+Math.round(transStrength*35)},${67+Math.round(transStrength*18)})`:'#8d5145';x.beginPath();x.ellipse(ex,ey,r*.24,r*.38,0,0,7);x.fill();if(transStrength)glow(ex,ey,r*.38,'255,58,38',transStrength*.72)}
// face with hard or diffused terminator
const gx=side?cx-r*.65:back?cx+r*.50:cx-r*.50,gy=cy-r*.55,grad=x.createRadialGradient(gx,gy,r*.04,cx,cy,r*1.25);const lit=back?.30:.92;grad.addColorStop(0,`rgb(${Math.round(237*lit)},${Math.round(154*lit)},${Math.round(126*lit)})`);grad.addColorStop(front?.50:.52,front?'#bc7769':'#9b5b50');grad.addColorStop(front?.90:.62,front?'#6e3a38':'#321c24');x.fillStyle=grad;x.beginPath();x.ellipse(cx,cy,r*.78,r,0,0,7);x.fill();
if(front){glow(cx-r*.30,cy+r*.05,r*(.42+S.scatter*.35),'220,64,68',S.scatter*.16);glow(cx+r*.20,cy+r*.20,r*(.30+S.scatter*.20),'230,78,72',S.scatter*.10)}
// features
x.fillStyle='#2d1b20';x.beginPath();x.arc(cx-r*.28,cy-r*.13,4,0,7);x.arc(cx+r*.28,cy-r*.13,4,0,7);x.fill();x.strokeStyle='#7e3b42';x.lineWidth=3;x.beginPath();x.arc(cx,cy+r*.26,r*.18,.15,Math.PI-.15);x.stroke();
// thickness overlay indicator
if(S.step===1||S.step===3){x.strokeStyle='#6ed7e5';x.setLineDash([5,4]);x.lineWidth=2;x.beginPath();x.ellipse(cx-r*.92,cy,r*.24,r*.38,0,0,7);x.ellipse(cx+r*.92,cy,r*.24,r*.38,0,0,7);x.stroke();x.setLineDash([]);x.fillStyle='#6ed7e5';x.font='600 10px system-ui';x.fillText('얇음',cx+r*1.05,cy-r*.35)}
if(S.step===0){x.fillStyle='rgba(7,10,15,.84)';x.fillRect(w*.07,h*.14,w*.29,h*.12);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('표면에서 즉시 반사',w*.09,h*.19);x.fillStyle='#94a0b1';x.font='10px system-ui';x.fillText('딱딱한 경계 · 귀 투과 없음',w*.09,h*.23)}
if(lod){const labels=['HERO\\nSSSS + THICKNESS','MID\\nPRE-INTEGRATED','FAR\\nDIFFUSE TINT'];for(let i=0;i<3;i++){x.fillStyle='rgba(7,10,15,.74)';x.fillRect(w*(.04+i*.22),h*.77,w*.19,h*.13);x.fillStyle=i===0?'#ffb347':'#9aa8ba';x.font='600 9px ui-monospace,monospace';const [a,b]=labels[i].split('\\n');x.fillText(a,w*(.055+i*.22),h*.815);x.fillText(b,w*(.055+i*.22),h*.855)}}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-light]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.light===S.light)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];const front=S.step>=2?Math.round(S.scatter*100):0,trans=S.step>=3&&S.light===1?Math.round((1-S.thickness)*100):0;$('mFront').textContent=front+'%';$('mTrans').textContent=trans+'%';$('mMode').textContent=['표준 BRDF','두 항 진단','SSSS','SSSS+두께','SSSS+게이트','LOD 자동'][S.step];$('mCost').textContent=['1.0×','1.0×','2.4×','2.8×','2.8×','1.3×'][S.step];$('status').textContent=['딱딱한 그림자','앞면·뒷면 분리','붉은 경계 확산',S.light===1?'얇은 귀 투과':'역광에서 확인',S.light===1?'각도 조건 통과':'투과 게이트 닫힘','거리별 처리 전환'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>{S.light=+b.dataset.light;ui()});$('scatter').oninput=e=>{S.scatter=+e.target.value/100;$('scatterOut').textContent=e.target.value+'%';ui()};$('thickness').oninput=e=>{S.thickness=+e.target.value/100;$('thicknessOut').textContent=e.target.value+'%';ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
