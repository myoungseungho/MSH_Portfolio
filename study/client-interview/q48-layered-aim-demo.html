<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q48 레이어드 애님·에임 오프셋 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="하체 이동 레이어 위에 3x3 애디티브 에임 오프셋을 본 마스크로 합성하고 조준 요를 여러 척추에 분배하는 과정"></canvas><div class="hud"><span>Q48 · <b id="stage">이동×조준 조합마다 클립</b></span><span id="status">연속 각도를 이산 애셋으로 감당 못함</span></div></div>
<div class="steps" role="group" aria-label="상하체 독립 조준 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>조합별 클립</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>본 마스크 분리</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>고정 상체 포즈</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>3×3 에임 오프셋</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스파인 분배·클램프</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>턴 인계·서버 조준</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="yaw">조준 Yaw</label><output id="yawOut">58°</output></div><input id="yaw" type="range" min="-160" max="160" value="58"></div><div><div class="ct"><label for="pitch">조준 Pitch</label><output id="pitchOut">24°</output></div><input id="pitch" type="range" min="-80" max="80" value="24"></div><div class="toggles" role="group" aria-label="스파인 다본 분배와 턴인플레이스·서버 조준 동기"><button id="spine" aria-pressed="false">스파인 다본 분배</button><button id="handoff" aria-pressed="false">턴·서버 조준 동기</button></div></div>
<div class="metrics"><div class="m"><small>필요 애님 클립</small><strong id="mClips">72+</strong></div><div class="m"><small>한 본 최대 회전</small><strong id="mBone">58°</strong></div><div class="m"><small>하체 방향</small><strong id="mLower">0°</strong></div><div class="m"><small>총구↔서버 조준 오차</small><strong id="mMismatch">12.0°</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,yaw:58,pitch:24,spine:false,handoff:false,t:0},names=['clip for every locomotion × aim combination','lower locomotion + upper bone mask','one fixed upper-body aim pose','3×3 additive aim-offset blend','distributed spine twist + human clamp','turn-in-place handoff + replicated authority angles'],desc=['<b>문제 재현:</b> 이동 8방향×조준 9방향×자세·무기를 곱하면 수백 클립이 필요하고, 그 사이의 임의 각도는 여전히 비어 있습니다.','<b>곱셈을 두 층으로:</b> 골반 아래는 이동, 허리 위는 조준 레이어를 재생해 본 마스크로 합칩니다. 이동과 조준 애셋을 따로 만들 수 있습니다.','<b>남은 불연속:</b> 상체 레이어가 고정된 한 포즈면 슬라이더의 연속 조준 각도를 따라가지 못하고 가장 가까운 방향으로 스냅됩니다.','<b>작은 격자로 연속 조준:</b> 중심·상하좌우·대각선 3×3 포즈를 피치·요로 2D 보간하고 중심으로부터의 애디티브 델타를 이동 위에 더합니다.','<b>한 관절에 몰지 않기:</b> 요 회전을 spine1·2·3·목에 나눠 비틀고 인간 범위에서 클램프합니다. 토글을 꺼 목 하나에 몰린 각도를 비교하세요.','<b>한계 밖은 다리에 인계:</b> ±90°를 넘는 요는 하체 턴인플레이스가 받아 상체를 범위 안으로 되돌립니다. 네트워크는 각도만 복제하고 서버 판정과 총구를 같은 값으로 묶습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let continuous=S.step>=3,clamped=S.step>=4?Math.max(-90,Math.min(90,S.yaw)):S.yaw,lower=S.step>=5&&S.handoff&&Math.abs(S.yaw)>90?S.yaw-Math.sign(S.yaw)*90:0,upper=clamped-lower,bone=S.spine&&S.step>=4?Math.abs(upper)/4:Math.abs(upper),clips=S.step===0?'72+':S.step<3?'17':S.step<5?'17 + 9':'17 + 9',mismatch=S.step>=5&&S.handoff?0:S.step>=3?Math.abs(S.yaw)*.08+Math.abs(S.pitch)*.03:12;return{continuous,clamped,lower,upper,bone,clips,mismatch}}
function drawGrid(w,h){for(let r=0;r<3;r++)for(let col=0;col<3;col++){let px=w*.08+col*w*.095,py=h*.22+r*h*.15;x.fillStyle='#253b49';x.fillRect(px,py,w*.07,h*.10);x.strokeStyle='#526b79';x.strokeRect(px,py,w*.07,h*.10);tag(`${['L','C','R'][col]}${['U','C','D'][r]}`,px+8,py+h*.065,'#97aab8')}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),cx=w*.59,ground=h*.82,walk=Math.sin(S.t*.055)*16,aimYaw=v.upper*Math.PI/180,aimPitch=S.pitch*Math.PI/180;x.fillStyle='#142631';x.fillRect(0,0,w,h);if(S.step===0){for(let r=0;r<6;r++)for(let col=0;col<9;col++){let px=w*.06+col*w*.065,py=h*.14+r*h*.10;x.fillStyle=(r+col)%3?'#294352':'#ff817944';x.fillRect(px,py,w*.052,h*.065)}tag('8 MOVE DIRECTIONS × 9 AIM POSES × STANCES × WEAPONS',w*.22,h*.81,'#ff8179');tag('COMBINATION EXPLOSION',w*.39,h*.20,'#ff8179');return}if(S.step>=3){drawGrid(w,h);let gx=w*.08+(Math.max(-1,Math.min(1,S.yaw/90))+1)*w*.095,gy=h*.22+(1-Math.max(-1,Math.min(1,S.pitch/70)))*h*.15;x.strokeStyle='#8ce4b4';x.lineWidth=3;x.strokeRect(gx-8,gy-8,16,16);tag('BILINEAR BLEND POSITION',w*.08,h*.72,'#8ce4b4')}x.strokeStyle='#526c7c';x.lineWidth=3;x.beginPath();x.moveTo(w*.37,ground);x.lineTo(w*.88,ground);x.stroke();x.save();x.translate(cx,ground-4);x.rotate(v.lower*Math.PI/180*.18);x.strokeStyle='#72c9ff';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(-12,-80);x.lineTo(-26+walk,-8);x.moveTo(12,-80);x.lineTo(28-walk,-8);x.stroke();x.fillStyle='#507b90';x.fillRect(-35,-125,70,52);let segments=S.spine&&S.step>=4?4:1,segYaw=aimYaw/segments;x.save();x.translate(0,-125);for(let i=0;i<segments;i++){x.rotate(segYaw);x.strokeStyle=i===segments-1?'#8ce4b4':'#72c9ff';x.lineWidth=12;x.beginPath();x.moveTo(0,0);x.lineTo(0,-35);x.stroke();x.translate(0,-35)}x.rotate(aimPitch*.32);x.fillStyle='#f2f8fc';x.beginPath();x.arc(0,-17,15,0,7);x.fill();x.strokeStyle='#72c9ff';x.lineWidth=9;x.beginPath();x.moveTo(-4,-4);x.lineTo(52,-4-Math.sin(aimPitch)*35);x.stroke();x.strokeStyle='#ffd17f';x.lineWidth=6;x.beginPath();x.moveTo(42,-6-Math.sin(aimPitch)*35);x.lineTo(100,-6-Math.sin(aimPitch)*58);x.stroke();x.restore();x.restore();let muzzleX=cx+Math.cos(aimYaw)*105,muzzleY=ground-180-Math.sin(aimPitch)*70;x.strokeStyle='#ffd17f';x.setLineDash([7,5]);x.beginPath();x.moveTo(muzzleX,muzzleY);x.lineTo(muzzleX+Math.cos(aimYaw)*w*.23,muzzleY-Math.sin(aimPitch)*h*.36);x.stroke();x.setLineDash([]);if(S.step===1){x.strokeStyle='#ff8179';x.setLineDash([5,4]);x.beginPath();x.moveTo(w*.37,ground-h*.24);x.lineTo(w*.87,ground-h*.24);x.stroke();x.setLineDash([]);tag('UPPER AIM LAYER / LOWER LOCOMOTION MASK',w*.42,h*.50,'#8ce4b4');tag('FEATHERED SPINE BOUNDARY',w*.42,h*.60,'#97aab8')}if(S.step===2){let snap=Math.round(S.yaw/45)*45;tag(`FIXED / NEAREST POSE ${snap}°`,w*.43,h*.27,'#ff8179')}if(S.step>=3)tag(`ADDITIVE AIM Δ · YAW ${S.yaw}° · PITCH ${S.pitch}°`,w*.40,h*.20,'#8ce4b4');if(S.step===4){tag(S.spine?'SPINE1 25% · SPINE2 25% · SPINE3 25% · NECK 25%':'ALL TWIST ON ONE NECK BONE',w*.42,h*.29,S.spine?'#8ce4b4':'#ff8179');if(Math.abs(S.yaw)>90)tag('AIM CLAMPED AT HUMAN LIMIT ±90°',w*.44,h*.38,'#ff8179')}if(S.step>=5){if(v.lower)tag(`TURN-IN-PLACE HANDOFF ${v.lower.toFixed(0)}° TO LOWER BODY`,w*.40,h*.31,S.handoff?'#8ce4b4':'#ff8179');tag(S.handoff?'REPLICATED ANGLES → LOCAL POSE · SERVER HIT RAY':'LOCAL MUZZLE ≠ SERVER HIT RAY',w*.40,h*.40,S.handoff?'#8ce4b4':'#ff8179');x.strokeStyle=S.handoff?'#8ce4b4':'#ff8179';x.lineWidth=2;x.beginPath();x.moveTo(muzzleX,muzzleY+10);x.lineTo(muzzleX+w*.22,muzzleY+10-(S.handoff?Math.sin(aimPitch)*h*.35:0));x.stroke()}
}function metrics(){const v=vals();$('mClips').textContent=v.clips;$('mBone').textContent=v.bone.toFixed(1)+'°';$('mLower').textContent=v.lower.toFixed(0)+'°';$('mMismatch').textContent=v.mismatch.toFixed(1)+'°'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['연속 각도를 이산 애셋으로 감당 못함','이동과 조준을 덧셈으로 조합','각도 사이에서 포즈 스냅','9포즈 사이를 연속 보간','목 하나가 아닌 몸통 전체 비틀림','보이는 포즈와 맞는 판정을 같은 각도로'][S.step];$('explain').innerHTML=desc[S.step];$('spine').setAttribute('aria-pressed',String(S.spine));$('handoff').setAttribute('aria-pressed',String(S.handoff));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.spine=S.step>=4;S.handoff=S.step===5;ui()});$('yaw').oninput=e=>{S.yaw=+e.target.value;$('yawOut').textContent=e.target.value+'°';ui()};$('pitch').oninput=e=>{S.pitch=+e.target.value;$('pitchOut').textContent=e.target.value+'°';ui()};$('spine').onclick=()=>{S.spine=!S.spine;ui()};$('handoff').onclick=()=>{S.handoff=!S.handoff;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
