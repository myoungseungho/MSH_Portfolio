<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q20 앰비언트 오클루전 단계형 실험실</title>
<style>
:root{--bg:#090d13;--panel:#121a25;--line:#2b394b;--ink:#edf3fa;--muted:#94a5b9;--amber:#ffca68;--cyan:#65d7e6;--red:#ff7077}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#080c12}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:var(--amber)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52647b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171106}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#6e8096;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="평평한 실내에서 깊이 기반 SSAO, 노이즈와 헤일로, GTAO와 양방향·시간 필터, 간접광 전용 합성까지 쌓는 단계"></canvas><div class="hud"><span>Q20 · <b id="stage">라이트만 있는 방</b></span><span id="status">접점이 떠 보임</span></div></div>
<div class="steps" role="group" aria-label="앰비언트 오클루전 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>평평한 조명</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>깊이 재활용</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>SSAO 샘플</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>노이즈·헤일로</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>GTAO·필터</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>간접광에만</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="radius">AO 반경</label><output id="radiusOut">24 cm</output></div><input id="radius" type="range" min="4" max="80" value="24"></div><div><div class="ct"><label for="samples">반구 샘플</label><output id="samplesOut">8개</output></div><input id="samples" type="range" min="4" max="32" value="8" step="4"></div><div class="toggles" role="group" aria-label="AO 정확도와 합성 옵션"><button id="gtao" aria-pressed="false">GTAO·range</button><button id="indirect" aria-pressed="false">간접광에만 곱</button></div></div>
<div class="metrics"><div class="m"><small>접점 AO</small><strong id="mContact">0%</strong></div><div class="m"><small>평평한 벽 오염</small><strong id="mFlat">0%</strong></div><div class="m"><small>윤곽 헤일로</small><strong id="mHalo">0 px</strong></div><div class="m"><small>프레임간 분산</small><strong id="mNoise">0%</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,radius:24,samples:8,gtao:false,indirect:false},names=['라이트만 있는 방','깊이·노멀 버퍼','반구 SSAO','저샘플 화면공간 오류','GTAO + range·필터','AO × 간접광'];
const desc=['<b>현상 분리:</b> 직접광과 섀도우만으로는 사방의 간접광이 좁은 틈에서 덜 들어오는 효과를 만들 수 없습니다. 책상 다리와 벽 모서리가 바닥에서 떠 보입니다.','<b>이미 그린 정보:</b> 정확한 반구 광선을 쏘지 않고 화면의 깊이와 노멀을 재활용합니다. 주변 픽셀이 얼마나 가까이 둘러싸는지 판단할 좌표계를 복원합니다.','<b>SSAO 근사:</b> 표면 노멀 반구에 점을 뿌리고 깊이 버퍼보다 안쪽인 샘플 비율을 셉니다. 접점·모서리는 가려진 점이 많아 어두워집니다. 샘플 수를 줄이면 패턴이 눈에 띕니다.','<b>값싼 근사의 실패:</b> 깊이 불연속 건너편을 가림으로 세어 물체 윤곽에 검은 헤일로가 생기고, 큰 반경은 평평한 벽까지 오염시킵니다. 적은 샘플은 프레임마다 지글거립니다.','<b>원인별 정리:</b> GTAO는 노멀 기준 지평선 각도를 적분하고, range check는 먼 깊이를 제외합니다. 깊이·노멀 인지 블러와 템포럴 평균은 경계는 살리고 노이즈만 낮춥니다.','<b>결정적 배선:</b> AO는 사방 간접광이 덜 들어오는 정도입니다. 최종색 전체가 아니라 앰비언트·GI 항에만 곱해야 햇빛이 닿는 밝은 면을 더럽히지 않습니다. 토글로 잘못된 합성과 비교하세요.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tag(text,px,py,color='#eef3fa'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(5,9,14,.85)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function aoBlob(cx,cy,rx,ry,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');x.save();x.translate(cx,cy);x.scale(rx/Math.max(rx,ry),ry/Math.max(rx,ry));x.fillStyle=g;x.beginPath();x.arc(0,0,Math.max(rx,ry),0,7);x.fill();x.restore()}
function depthInset(w,h){const ix=w*.72,iy=h*.08,iw=w*.23,ih=h*.27;x.fillStyle='#071019';x.fillRect(ix,iy,iw,ih);x.strokeStyle='#65d7e6';x.strokeRect(ix,iy,iw,ih);const g=x.createLinearGradient(ix+8,0,ix+iw-8,0);g.addColorStop(0,'#f2f2f2');g.addColorStop(.55,'#777');g.addColorStop(1,'#151515');x.fillStyle=g;x.fillRect(ix+8,iy+23,iw-16,ih-31);x.fillStyle='#111';x.fillRect(ix+iw*.43,iy+ih*.35,iw*.16,ih*.57);tag('VIEW DEPTH + NORMAL',ix+10,iy+16,'#65d7e6')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,corner=w*.37,floor=h*.62;x.clearRect(0,0,w,h);x.fillStyle='#70808b';x.fillRect(0,0,w,h);x.fillStyle='#87949b';x.beginPath();x.moveTo(0,0);x.lineTo(corner,h*.14);x.lineTo(corner,floor);x.lineTo(0,h);x.closePath();x.fill();x.fillStyle='#a9a39a';x.beginPath();x.moveTo(corner,floor);x.lineTo(w,floor);x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fill();
// direct sun patch
x.fillStyle=S.step>=5&&!S.indirect?'rgba(176,135,70,.52)':'rgba(255,222,145,.70)';x.beginPath();x.moveTo(w*.50,floor);x.lineTo(w*.82,floor);x.lineTo(w*.94,h);x.lineTo(w*.61,h);x.closePath();x.fill();tag(S.step>=5&&!S.indirect?'잘못됨: DIRECT × AO':'DIRECT SUN · AO 제외',w*.64,h*.80,S.step>=5&&!S.indirect?'#ff7077':'#ffca68');
// table
x.fillStyle='#443b33';x.fillRect(w*.48,h*.36,w*.25,h*.08);for(const px of [w*.50,w*.69])x.fillRect(px,h*.44,w*.025,h*.37);x.fillStyle='#56616a';x.fillRect(w*.17,h*.42,w*.10,h*.13);x.fillRect(w*.19,h*.55,w*.025,h*.17);
if(S.step>=1)depthInset(w,h);
const active=S.step>=2,err=S.step===3&&!S.gtao,clean=S.step>=4&&S.gtao,strength=Math.min(.65,.18+S.radius/120);if(active){aoBlob(corner,floor,34+S.radius,22+S.radius*.35,strength);aoBlob(w*.51,h*.81,24+S.radius*.45,12+S.radius*.12,strength);aoBlob(w*.70,h*.81,24+S.radius*.45,12+S.radius*.12,strength);aoBlob(w*.21,h*.72,20+S.radius*.35,10+S.radius*.1,strength);
if(S.step===2||err){const count=Math.max(4,S.samples);for(let i=0;i<count;i++){const a=i*2.4,r=13+(i%4)*7,px=w*.50+Math.cos(a)*r,py=h*.78-Math.abs(Math.sin(a))*r;x.fillStyle=i%3?'#65d7e6':'#ffca68';x.beginPath();x.arc(px,py,2.4,0,7);x.fill()}tag('HEMISPHERE DEPTH TEST',w*.42,h*.67,'#65d7e6')}
if(err){x.strokeStyle='rgba(255,112,119,.62)';x.lineWidth=8+S.radius*.12;x.beginPath();x.moveTo(w*.46,h*.35);x.lineTo(w*.46,h*.82);x.stroke();for(let i=0;i<50;i++){x.fillStyle=`rgba(12,15,18,${.12+(i%4)*.08})`;x.fillRect((i*83)%w,(i*47)%h,3,3)}tag('DEPTH DISCONTINUITY · HALO',w*.30,h*.34,'#ff7077')}
if(clean){x.strokeStyle='#65d7e6';x.lineWidth=2;x.beginPath();x.arc(w*.50,h*.78,62,Math.PI,Math.PI*2);x.stroke();for(let i=0;i<5;i++){const a=Math.PI+i*Math.PI/4;x.beginPath();x.moveTo(w*.50,h*.78);x.lineTo(w*.50+Math.cos(a)*55,h*.78+Math.sin(a)*55);x.stroke()}tag('HORIZON ANGLE + RANGE CHECK',w*.39,h*.63,'#65d7e6');tag('BILATERAL + TEMPORAL',w*.72,h*.49,'#ffca68')}}
if(S.step>=5){const amb=x.createLinearGradient(0,0,w,0);amb.addColorStop(0,'rgba(64,92,115,.18)');amb.addColorStop(1,'rgba(64,92,115,.04)');x.fillStyle=amb;x.fillRect(0,0,w,h);tag(S.indirect?'FINAL = DIRECT + INDIRECT × AO':'FINAL = (DIRECT + INDIRECT) × AO',w*.05,h*.16,S.indirect?'#65d7e6':'#ff7077')}}
function metrics(){const active=S.step>=2,clean=S.step>=4&&S.gtao,contact=active?Math.min(82,30+S.radius*.62):0,flat=!active?0:clean?Math.max(0,(S.radius-48)*.10):Math.max(3,(S.radius-18)*.42),halo=S.step===3&&!S.gtao?Math.round(4+S.radius*.18):0,noise=!active?0:clean?Math.max(1,10-S.samples*.25):Math.max(4,31-S.samples*.72);$('mContact').textContent=contact.toFixed(0)+'%';$('mFlat').textContent=flat.toFixed(0)+'%';$('mHalo').textContent=halo+' px';$('mNoise').textContent=noise.toFixed(0)+'%'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('status').textContent=['접점이 떠 보임','화면 위치 복원','주변 가림 비율','검은 테두리·지글거림','지평선·경계 보존','직접광은 그대로'][S.step];$('gtao').setAttribute('aria-pressed',String(S.gtao));$('indirect').setAttribute('aria-pressed',String(S.indirect));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;if(S.step===3)S.gtao=false;if(S.step>=4)S.gtao=true;S.indirect=S.step===5;ui()});$('radius').oninput=e=>{S.radius=+e.target.value;$('radiusOut').textContent=e.target.value+' cm';ui()};$('samples').oninput=e=>{S.samples=+e.target.value;$('samplesOut').textContent=e.target.value+'개';ui()};$('gtao').onclick=()=>{S.gtao=!S.gtao;ui()};$('indirect').onclick=()=>{S.indirect=!S.indirect;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
