<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q64 퍼펙트 패링 피드백 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="피해 0과 단일 소리에서 프레임 판정, 국소 히트스톱, 동기화된 시청촉각 피드백, 성공 등급과 온라인 예측까지 발전하는 퍼펙트 패링 실험"></canvas><div class="hud"><span>Q64 · <b id="stage">피해 0 + 짧은 효과음</b></span><span id="status">막았는지 퍼펙트였는지 구분되지 않음</span></div></div>
<div class="steps" role="group" aria-label="퍼펙트 패링 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>피해만 0</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>프레임 판정</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>국소 히트스톱</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>채널 동기화</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>성공 등급</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>예측·서버 확정</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="timing">가드 진입 시점</label><output id="timingOut">3 frames 전</output></div><input id="timing" type="range" min="0" max="14" value="3"></div><div><div class="ct"><label for="strength">피드백 강도</label><output id="strengthOut">72%</output></div><input id="strength" type="range" min="10" max="100" value="72"></div><div class="toggles" role="group" aria-label="국소 히트스톱과 클라이언트 예측 설정"><button id="localStop" aria-pressed="false">국소 히트스톱</button><button id="predict" aria-pressed="false">로컬 예측</button></div></div>
<div class="metrics"><div class="m"><small>판정 등급</small><strong id="mGrade">일반 가드</strong></div><div class="m"><small>패링 겹침</small><strong id="mOverlap">—</strong></div><div class="m"><small>포즈 정지</small><strong id="mStop">0 ms</strong></div><div class="m"><small>피드백 시작 오차</small><strong id="mSkew">64 ms</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,timing:3,strength:72,localStop:false,predict:false,t:0};
const names=['피해 0 + 짧은 효과음','공격 활성과 가드 진입 프레임 비교','공격자·방어자 포즈만 짧게 정지','VFX·음향·진동·카메라를 같은 프레임에','퍼펙트·일반 가드·실패를 차등 표현','로컬 즉시 반응·서버 권위 확정'],status=['막았는지 퍼펙트였는지 구분되지 않음','±6프레임 안이면 퍼펙트 패링','주변 세계는 계속 움직이고 접촉만 눌림','눈·귀·손에 한 번의 사건으로 도착','정확할수록 더 짧고 강한 보상','지연 중에도 손맛은 즉시, 결과는 공정하게'];
const desc=['<b>실패 재현:</b> 가드 중 피해를 0으로 만들고 짧은 소리만 냅니다. 일반 가드와 퍼펙트 패링이 같은 반응이라 성공 자체를 알아차리기 어렵습니다.','<b>먼저 판정을 명확히:</b> 공격 활성 프레임과 가드 상태 진입 타임스탬프를 비교합니다. 슬라이더가 6프레임 이내면 퍼펙트, 그 밖이면 일반 가드입니다.','<b>충돌을 눌러 담기:</b> 성공 순간 공격자와 방어자의 애니메이션 포즈만 30~80ms 멈춥니다. 토글을 끄면 주변까지 멈추지 않는 대신 접촉의 무게도 사라집니다.','<b>같은 프레임에 함께:</b> 검·방패 접점 스파크, 금속 고음+저음 어택, 짧고 강한 고주파 진동, 미세한 카메라 킥을 하나의 ParryEvent로 발행합니다.','<b>정확도만큼 보상:</b> 퍼펙트는 강한 히트스톱과 불꽃, 일반 가드는 작은 스파크와 약한 진동, 실패는 별도 피격 피드백으로 즉시 구분합니다.','<b>네트워크 판정과 느낌 분리:</b> 클라이언트는 입력 즉시 패링 피드백을 예측하고 서버가 되감기 판정으로 확정합니다. 실패 시 보정하지만 첫 반응은 지연시키지 않습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const judged=S.step>=1,perfect=judged&&S.timing<=6,grade=!judged?'일반 가드':perfect?'퍼펙트':'일반 가드',stopOn=S.step>=2&&S.localStop,channels=S.step>=3,tiered=S.step>=4,predicted=S.step>=5&&S.predict,stop=stopOn?(perfect?Math.round(35+S.strength*.45):22):0,skew=channels?0:64,overlap=judged?Math.max(0,7-S.timing):null,burst=tiered?(perfect?S.strength:Math.round(S.strength*.32)):S.strength;return{judged,perfect,grade,stopOn,channels,tiered,predicted,stop,skew,overlap,burst}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),pulse=(S.t%100)/100,contact=pulse<.15,intensity=(contact?1-pulse/.15:0)*v.burst/100,cx=w*.43,cy=h*.50;x.fillStyle='#102331';x.fillRect(0,0,w,h);for(let i=0;i<12;i++){const bx=(i*110+S.t*1.1)%(w+100)-50;line(bx,h*.22,bx-40,h*.32,'#294355',2)}const ax=cx-125,dx=cx+95;line(ax,cy+80,ax,cy-5,'#ff7f78',11);x.fillStyle='#ff7f78';x.beginPath();x.arc(ax,cy-28,16,0,7);x.fill();line(ax,cy-5,cx+14,cy,'#f5f8fc',9);line(dx,cy+80,dx,cy-5,'#70ceff',11);x.fillStyle='#70ceff';x.beginPath();x.arc(dx,cy-28,16,0,7);x.fill();x.strokeStyle='#ffd06e';x.lineWidth=10;x.beginPath();x.arc(cx+22,cy+2,36,-1.2,1.2);x.stroke();if(contact){for(let i=0;i<Math.max(3,Math.round(v.burst/8));i++){const a=Math.PI*2*i/12,r=35+((i*19)%75)*intensity;line(cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,v.perfect?'#ffd06e':'#8ce3ae',3)}}
label(v.grade,cx,cy-105,v.perfect?'#ffd06e':'#8ce3ae','center');if(v.stopOn)label(`LOCAL POSE HOLD ${v.stop}ms · WORLD RUNS`,cx,cy+135,'#8ce3ae','center');else label('NO IMPACT HOLD',cx,cy+135,'#ff7f78','center');
const tx=w*.08,ty=h*.16,tw=w*.28;label('FRAME JUDGEMENT',tx,ty-10,'#70ceff');x.fillStyle='#465b70';x.fillRect(tx,ty+22,tw,18);x.fillStyle='#ff7f78';x.fillRect(tx+tw*.40,ty+22,tw*.22,18);label('ATTACK ACTIVE',tx+tw*.51,ty+15,'#ff7f78','center');const guardX=tx+tw*(.51-S.timing/28);line(guardX,ty-2,guardX,ty+52,v.perfect?'#ffd06e':'#70ceff',3);label(`GUARD -${S.timing}f`,guardX,ty+69,v.perfect?'#ffd06e':'#70ceff','center');if(v.judged)label(v.perfect?'WINDOW HIT · ±6f':'OUTSIDE PERFECT WINDOW',tx+tw*.5,ty+96,v.perfect?'#8ce3ae':'#ff7f78','center');
const rx=w*.70,ry=h*.17;label(S.step>=3?'PARRY EVENT · SAME FRAME':'SEPARATE FEEDBACK',rx,ry-12,S.step>=3?'#8ce3ae':'#ff7f78');const rows=[['VFX',v.channels?'SPARK NOW':'+'+v.skew+'ms'],['SOUND',v.channels?'METAL + LOW':'+'+Math.round(v.skew*.6)+'ms'],['RUMBLE',v.channels?'SHORT HIGH':'+'+Math.round(v.skew*.8)+'ms'],['CAMERA',v.channels?'MICRO KICK':'+'+Math.round(v.skew*.4)+'ms']];rows.forEach((r,i)=>{const yy=ry+i*h*.105;x.fillStyle=i===0?'#ffd06e':i===1?'#c4b5ff':i===2?'#70ceff':'#8ce3ae';x.fillRect(rx,yy,8,27);label(r[0],rx+18,yy+12,'#9aaabf');label(r[1],rx+w*.10,yy+12,'#f5f8fc')});if(S.step>=4){const tiers=[['PERFECT',1,'#ffd06e'],['GUARD',.38,'#8ce3ae'],['FAIL',.18,'#ff7f78']];tiers.forEach((r,i)=>{const yy=h*(.66+i*.055);label(r[0],rx,yy+8,'#9aaabf');x.fillStyle=r[2];x.fillRect(rx+w*.08,yy,w*.14*r[1],8)});label('FEEDBACK TIER OUTPUT',rx+w*.11,h*.64,'#70ceff','center')}if(S.step>=5){const ny=h*.86;label(v.predicted?'LOCAL FEEDBACK 16ms → SERVER CONFIRM':'WAIT SERVER RTT 180ms',w*.78,ny,v.predicted?'#8ce3ae':'#ff7f78','center');line(w*.68,ny+23,w*.88,ny+23,'#52677b',2);x.fillStyle=v.predicted?'#8ce3ae':'#ff7f78';x.beginPath();x.arc(v.predicted?w*.69:w*.87,ny+23,7,0,7);x.fill()}c.dataset.contact=String(contact);c.dataset.grade=v.grade}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('localStop').setAttribute('aria-pressed',String(S.localStop));$('predict').setAttribute('aria-pressed',String(S.predict));const v=vals();$('mGrade').textContent=v.grade;$('mOverlap').textContent=v.overlap==null?'—':v.overlap+' f';$('mStop').textContent=v.stop+' ms';$('mSkew').textContent=v.skew+' ms';draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.localStop=S.step>=2;S.predict=S.step>=5;S.t=0;update()});$('timing').oninput=e=>{S.timing=+e.target.value;$('timingOut').textContent=S.timing+' frames 전';S.t=0;update()};$('strength').oninput=e=>{S.strength=+e.target.value;$('strengthOut').textContent=S.strength+'%';S.t=0;update()};$('localStop').onclick=()=>{S.localStop=!S.localStop;update()};$('predict').onclick=()=>{S.predict=!S.predict;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
