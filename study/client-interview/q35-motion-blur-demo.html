<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q35 모션 블러 단계형 실험실</title>
<style>
:root{--bg:#090d13;--panel:#131b25;--line:#304253;--ink:#f3f8fc;--muted:#98a9b8;--motion:#77c7ff;--object:#ffae7a;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#172330}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#090d13dd}.hud b{color:var(--motion)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#557086}button:focus-visible,input:focus-visible{outline:2px solid var(--motion);outline-offset:2px}button[aria-pressed=true]{background:var(--motion);border-color:var(--motion);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--motion);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--motion)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#778c9c;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="이전 프레임 고스팅에서 픽셀 속도 버퍼, 방향 적분, 타일 최대속도·깊이 재구성과 반투명·UI 분리까지 쌓는 질주 장면"></canvas><div class="hud"><span>Q35 · <b id="stage">이전 프레임 블렌드</b></span><span id="status">방향 없는 이중상</span></div></div>
<div class="steps" role="group" aria-label="모션 블러 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>프레임 고스팅</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>픽셀 속도 버퍼</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>속도 방향 적분</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>딱딱한 경계 실패</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>타일 최대·깊이</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>반투명·UI·접근성</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">카메라 속도</label><output id="speedOut">70%</output></div><input id="speed" type="range" min="0" max="100" value="70"></div><div><div class="ct"><label for="shutter">셔터 각도</label><output id="shutterOut">120°</output></div><input id="shutter" type="range" min="0" max="360" value="120"></div><div class="toggles" role="group" aria-label="오브젝트 블러와 경계 재구성 옵션"><button id="objectBlur" aria-pressed="false">검·적 오브젝트 블러</button><button id="reconstruct" aria-pressed="false">타일·깊이 재구성</button></div></div>
<div class="metrics"><div class="m"><small>카메라 속도</small><strong id="mCamera">22 px</strong></div><div class="m"><small>검 속도</small><strong id="mSword">0 px</strong></div><div class="m"><small>실루엣 외부 커버</small><strong id="mEdge">0 px</strong></div><div class="m"><small>방향 샘플</small><strong id="mTaps">2 frames</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:.70,shutter:120,object:false,reconstruct:false,t:0},names=['previous/current frame blend','camera + object velocity buffer','sample along motion vector','self-only gather hard edge','tile max velocity + depth weights','transparent velocity / UI exclusion'],desc=['<b>문제 재현:</b> 이전 프레임을 현재와 섞으면 흐름 방향이 아니라 두 장이 겹친 고스팅입니다. 화면 전체 한 방향 블러도 전진 시 깊이별 속도를 설명하지 못합니다.','<b>각 픽셀의 실제 이동:</b> 현재·이전 클립 위치 차이로 카메라 이동과 오브젝트·스키닝 속도를 하나의 2D velocity buffer에 기록합니다. 화살표가 깊이와 검에 따라 달라집니다.','<b>셔터 시간 동안 적분:</b> 픽셀마다 자기 속도 벡터 방향으로 여러 탭을 모아, 가까운 나무는 길고 중앙 원경은 짧은 방사형 흐름을 만듭니다.','<b>자기 속도만 아는 실패:</b> 빠른 적·검 내부는 흐리지만 느린 배경은 그 물체가 지나간 자리를 몰라 실루엣 밖 경계가 딱 잘립니다.','<b>이웃의 최대 속도를 전파:</b> 타일 최대 velocity로 빠른 물체 범위를 찾고 깊이·속도 가중으로 앞 물체가 뒤 배경 위로 번지는 영역을 재구성합니다.','<b>누락과 접근성까지:</b> 반투명 오라는 부모 속도를 상속하거나 자체 stretch하고, 조준선·UI는 블러 이후 합성합니다. 카메라 성분을 줄이거나 완전히 끌 수 있습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f3f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,10,15,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}function trail(px,py,len,col,width=5){x.strokeStyle=col;x.lineWidth=width;x.beginPath();x.moveTo(px-len,py);x.lineTo(px+len*.2,py);x.stroke()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,vel=S.step>=1,integrate=S.step>=2,hard=S.step===3,recon=S.reconstruct&&S.step>=4,obj=S.object&&S.step>=2,scale=S.speed*(S.shutter/180),cam=31*scale,sword=obj?58*(S.shutter/180):0;x.fillStyle='#1d3040';x.fillRect(0,0,w,h);x.fillStyle='#536a74';x.beginPath();x.moveTo(w*.44,h);x.lineTo(w*.49,h*.42);x.lineTo(w*.51,h*.42);x.lineTo(w*.62,h);x.fill();for(let i=0;i<16;i++){let side=i%2?-1:1,z=(i%8)/8,px=w*.50+side*w*(.08+z*.45),py=h*(.48+z*.38),len=integrate?cam*(.35+z*1.3):0;x.fillStyle='#243b32';x.fillRect(px-8,py-80*z-15,16,80*z+35);x.fillStyle='#315844';x.beginPath();x.arc(px,py-80*z-10,18+z*20,0,7);x.fill();if(integrate&&len>1){for(let j=1;j<6;j++){x.globalAlpha=.12;x.fillStyle='#47755a';x.beginPath();x.arc(px-side*len*j/6,py-80*z-10,18+z*20,0,7);x.fill()}x.globalAlpha=1}if(vel&&i%3===0){x.strokeStyle='#77c7ff';x.lineWidth=2;x.beginPath();x.moveTo(px,py);x.lineTo(px-side*(8+z*cam),py);x.stroke()}}const ex=w*(.70+.04*Math.sin(S.t*.05)),ey=h*.56;if(obj&&integrate){for(let j=7;j>0;j--){x.globalAlpha=.07+(7-j)*.03;x.fillStyle='#e18a68';x.beginPath();x.arc(ex-j*sword/8,ey,18,0,7);x.fill()}x.globalAlpha=1;if(recon){x.fillStyle='rgba(255,174,122,.16)';x.fillRect(ex-sword,ey-35,sword+35,75)}}x.fillStyle='#d8986f';x.beginPath();x.arc(ex,ey,18,0,7);x.fill();x.fillStyle='#6d4050';x.fillRect(ex-13,ey+18,26,65);x.save();x.translate(ex,ey+26);x.rotate(-.55+Math.sin(S.t*.08)*.35);if(obj&&integrate)trail(0,0,sword,'rgba(220,235,245,.35)',8);x.strokeStyle='#dcecf4';x.lineWidth=7;x.beginPath();x.moveTo(0,0);x.lineTo(76,0);x.stroke();x.restore();if(S.step===0){x.globalAlpha=.35;x.fillStyle='#d8986f';x.beginPath();x.arc(ex-38,ey,18,0,7);x.fill();x.fillStyle='#6d4050';x.fillRect(ex-51,ey+18,26,65);x.globalAlpha=1;tag('PREVIOUS + CURRENT = DOUBLE IMAGE',w*.55,h*.82,'#ff7f78')}if(vel)tag('PER-PIXEL VELOCITY BUFFER',w*.05,h*.18,'#77c7ff');if(integrate)tag('INTEGRATE ALONG v × SHUTTER',w*.06,h*.88,'#f3f8fc');if(hard)tag('SELF GATHER ONLY · HARD SILHOUETTE',w*.55,h*.78,'#ff7f78');if(recon)tag('TILE MAX v + DEPTH RECONSTRUCTION',w*.50,h*.72,'#ffae7a');if(S.step>=5){x.strokeStyle='#f3f8fc';x.lineWidth=2;x.beginPath();x.moveTo(w*.5-10,h*.5);x.lineTo(w*.5+10,h*.5);x.moveTo(w*.5,h*.5-10);x.lineTo(w*.5,h*.5+10);x.stroke();x.strokeStyle='rgba(133,108,255,.5)';x.lineWidth=9;x.beginPath();x.moveTo(ex-sword*.8,ey-5);x.lineTo(ex+20,ey-5);x.stroke();tag('AURA: INHERIT v / STRETCH',w*.64,h*.43,'#cbbdff');tag('UI AFTER BLUR · VELOCITY 0',w*.42,h*.45,'#f3f8fc')}}
function metrics(){const scale=S.speed*(S.shutter/180),cam=31*scale,sword=S.object&&S.step>=2?58*(S.shutter/180):0,edge=S.reconstruct&&S.step>=4?sword*.65:0;$('mCamera').textContent=Math.round(cam)+' px';$('mSword').textContent=Math.round(sword)+' px';$('mEdge').textContent=Math.round(edge)+' px';$('mTaps').textContent=S.step===0?'2 frames':S.step>=2?`${Math.max(1,Math.round(4+S.shutter/30))} taps`:'vectors'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['방향 없는 이중상','픽셀별 속도 확보','방향성 속도감','실루엣 밖 미커버','경계까지 재구성','UI 선명·오라 일치'][S.step];$('explain').innerHTML=desc[S.step];$('objectBlur').setAttribute('aria-pressed',String(S.object));$('reconstruct').setAttribute('aria-pressed',String(S.reconstruct));metrics();draw()}function tick(){S.t+=1;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.object=S.step>=2;S.reconstruct=S.step>=4;ui()});$('speed').oninput=e=>{S.speed=+e.target.value/100;$('speedOut').textContent=e.target.value+'%';ui()};$('shutter').oninput=e=>{S.shutter=+e.target.value;$('shutterOut').textContent=e.target.value+'°';ui()};$('objectBlur').onclick=()=>{S.object=!S.object;ui()};$('reconstruct').onclick=()=>{S.reconstruct=!S.reconstruct;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
