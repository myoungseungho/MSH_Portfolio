<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q59 히트스톱 설계 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#72c9ff;--gold:#ffd06f;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="전역 정지 실패에서 공격자와 피격자 포즈 홀드, 정확한 충돌 프레임, 강도 커브, 입력 버퍼와 독립 VFX까지 발전하는 히트스톱 실험"></canvas><div class="hud"><span>Q59 · <b id="stage">전역 timeScale 정지</b></span><span id="status">화면 전체가 얼어 전투 리듬까지 끊김</span></div></div>
<div class="steps" role="group" aria-label="히트스톱 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전역 정지</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>국소 포즈</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>충돌 프레임</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>강도 커브</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>입력 버퍼</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>대비·빈도</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="frames">히트스톱 길이</label><output id="framesOut">6 frames</output></div><input id="frames" type="range" min="0" max="14" value="6"></div><div><div class="ct"><label for="energy">충돌 에너지</label><output id="energyOut">72%</output></div><input id="energy" type="range" min="10" max="100" value="72"></div><div class="toggles" role="group" aria-label="입력 버퍼와 독립 VFX 설정"><button id="buffer" aria-pressed="false">입력 버퍼</button><button id="vfx" aria-pressed="false">VFX 계속 재생</button></div></div>
<div class="metrics"><div class="m"><small>멈춘 대상</small><strong id="mScope">WORLD</strong></div><div class="m"><small>실제 포즈 홀드</small><strong id="mHold">6 f</strong></div><div class="m"><small>다음 공격 입력</small><strong id="mInput">유실</strong></div><div class="m"><small>연속 사용 피로도</small><strong id="mFatigue">높음</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,frames:6,energy:72,buffer:false,vfx:false,t:0};
const names=['전역 timeScale 정지','공격자·피격자만 포즈 홀드','정확한 임팩트 프레임 정렬','에너지별 홀드 커브','표현 시간과 로직 시간 분리','강타만 남기는 대비 설계'],status=['화면 전체가 얼어 전투 리듬까지 끊김','카메라·UI·월드는 계속 흐름','칼과 몸이 닿는 한 프레임에 정지','약공 2f · 강공 6~10f · 피니시 더 길게','멈춘 동안 입력을 받아 종료 직후 연결','연속타는 짧게, 강타 한 번만 깊게'];
const desc=['<b>실패 재현:</b> timeScale=0은 공격자뿐 아니라 적, 배경, UI, 파티클과 입력 처리까지 모두 멈춥니다. 멈춤은 보이지만 게임 전체가 끊깁니다.','<b>정지 범위 축소:</b> 공격자와 피격자의 애니메이션 포즈만 홀드합니다. 배경·카메라·UI는 정상 시간으로 움직여 “두 사람만 시간이 멎은” 대비가 생깁니다.','<b>한 프레임의 정확성:</b> 홀드는 칼이 몸에 닿은 임팩트 프레임에서 시작해야 합니다. 타임라인의 접촉선과 포즈를 정렬해 선행·지연 멈춤을 제거합니다.','<b>강도를 시간으로 번역:</b> 충돌 에너지로 홀드 프레임을 결정합니다. 에너지 슬라이더를 바꾸면 약공부터 강공까지 길이가 곡선으로 달라집니다.','<b>조작은 멈추지 않습니다:</b> 화면 포즈가 멈춰도 입력 버퍼는 unscaled 시간으로 계속 돕니다. 토글을 켜고 멈춤 중 입력이 다음 공격으로 이어지는지 확인하세요.','<b>남용을 막는 마지막 규칙:</b> 콤보의 모든 타격을 길게 멈추지 않고 연속타는 짧게, 강타 한 번만 강조합니다. VFX는 계속 흘려 완전 정지가 아닌 “눌린 시간”으로 보이게 합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const local=S.step>=1,aligned=S.step>=2,curve=S.step>=3,buffer=S.step>=4&&S.buffer,vfx=S.step>=5&&S.vfx,hold=curve?Math.round(Math.pow(S.energy/100,1.35)*S.frames):S.frames,fatigue=S.step>=5?(hold>8?'중간':'낮음'):'높음';return{local,aligned,curve,buffer,vfx,hold,fatigue}}
function person(px,py,flip,attack,co){x.save();x.translate(px,py);x.scale(flip,1);x.strokeStyle=co;x.lineCap='round';x.lineWidth=9;x.beginPath();x.arc(0,-61,13,0,7);x.moveTo(0,-43);x.lineTo(0,13);x.moveTo(0,-27);x.lineTo(attack?66:25,-47);x.moveTo(0,10);x.lineTo(24,42);x.moveTo(0,10);x.lineTo(-24,42);x.stroke();x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),cycle=S.t%150,impactAt=v.aligned?70:53,freeze=cycle>=impactAt&&cycle<impactAt+v.hold*2,worldFreeze=!v.local&&freeze,actorT=freeze?impactAt:cycle,phase=Math.min(1,actorT/impactAt),ax=w*.18+phase*w*.45,bx=w*.72,ground=h*.70;x.fillStyle='#112330';x.fillRect(0,0,w,h);for(let i=0;i<18;i++){const px=(i*83+(worldFreeze?0:S.t*1.3))%(w+100)-50;line(px,h*.20,px-32,h*.29,'#294055',2)}line(w*.04,ground,w*.96,ground,'#5e7387',3);
person(ax,ground,1,true,'#72c9ff');person(bx,ground,-1,false,'#ffd06f');const tip=ax+70;line(ax+38,ground-48,tip+34,ground-51,'#eaf4fa',7);const hit=Math.abs(tip+34-bx)<18;c.dataset.phase=freeze?'hold':cycle<impactAt?'approach':'follow';c.dataset.contact=String(hit);
if(hit||freeze){x.globalAlpha=.8;for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r=26+i%2*19;line(bx,ground-50,bx+Math.cos(a)*r,ground-50+Math.sin(a)*r,v.vfx?'#8ce3ae':'#ff7f78',3)}x.globalAlpha=1}
label(worldFreeze?'WORLD CLOCK = 0':v.local?'ONLY TWO ANIMATORS HOLD':'SAME VELOCITY OVERRIDE',w*.50,h*.15,worldFreeze?'#ff7f78':'#8ce3ae','center');if(S.step>=2){line(w*.50,h*.24,w*.50,h*.63,'#ffd06f',2,[5,4]);label('CONTACT FRAME',w*.50,h*.22,'#ffd06f','center')}
const ty=h*.84,x0=w*.08,x1=w*.92;line(x0,ty,x1,ty,'#53697d',3);for(let i=0;i<=15;i++){const px=x0+(x1-x0)*i/15;line(px,ty-5,px,ty+5,'#53697d',1)}const marker=x0+(x1-x0)*(cycle/150);line(marker,ty-17,marker,ty+17,'#72c9ff',3);const fs=x0+(x1-x0)*(impactAt/150),fw=(x1-x0)*(v.hold*2/150);x.fillStyle='#ffd06f55';x.fillRect(fs,ty-13,fw,26);label(`${v.hold}f POSE HOLD`,fs+fw/2,ty-22,'#ffd06f','center');
if(S.step>=4){const iy=h*.92;label(v.buffer?'INPUT PRESERVED → NEXT ATTACK':'INPUT DROPPED DURING HOLD',w*.50,iy,v.buffer?'#8ce3ae':'#ff7f78','center');for(let i=0;i<4;i++){x.fillStyle=i<3&&v.buffer?'#8ce3ae':'#50657a';x.fillRect(w*.39+i*w*.055,iy+8,30,5)}}if(S.step>=5)label(v.vfx?'VFX CLOCK: UNSCALED / PARTICLES FLOW':'VFX FROZEN WITH POSE',w*.76,h*.33,v.vfx?'#8ce3ae':'#9aaabf','center')}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('buffer').setAttribute('aria-pressed',String(S.buffer));$('vfx').setAttribute('aria-pressed',String(S.vfx));const v=vals();$('mScope').textContent=v.local?'ATTACKER + TARGET':'WORLD';$('mHold').textContent=v.hold+' f';$('mInput').textContent=v.buffer?'버퍼됨':'유실';$('mFatigue').textContent=v.fatigue;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.buffer=S.step>=4;S.vfx=S.step>=5;S.t=0;update()});$('frames').oninput=e=>{S.frames=+e.target.value;$('framesOut').textContent=S.frames+' frames';S.t=0;update()};$('energy').oninput=e=>{S.energy=+e.target.value;$('energyOut').textContent=S.energy+'%';S.t=0;update()};$('buffer').onclick=()=>{S.buffer=!S.buffer;update()};$('vfx').onclick=()=>{S.vfx=!S.vfx;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
