<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q51-100 인터랙티브 데모</title><style>
*{box-sizing:border-box}html,body{margin:0}body{background:#090c12;color:#edf2f8;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#r{padding:14px}.view{height:330px;border:1px solid #2b3546;border-radius:12px;overflow:hidden;background:#111a27}canvas{width:100%;height:100%;display:block}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:12px}.controls label{color:#ffcb7a;font-weight:700;font-size:12px}.controls input{width:100%;accent-color:#ffb448}.controls button{border:1px solid #354157;border-radius:8px;background:#151b27;color:#b9c5d6;padding:8px 12px;cursor:pointer}.controls button.on{background:#ffb448;color:#171008}.note{margin:11px 0 0;border-left:2px solid #4d95a5;padding-left:10px;color:#abb8ca;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:11px;background:#2b3546;border:1px solid #2b3546;border-radius:9px;overflow:hidden}.metrics div{background:#121823;padding:8px 10px;font:12px ui-monospace,Consolas,monospace}.metrics small{display:block;color:#718096;font-size:9px}@media(max-width:560px){.view{height:260px}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}</style></head><body><div id="r"><div class="view"><canvas id="c" role="img" aria-label="문항 인터랙티브 시뮬레이션"></canvas></div><div class="controls"><label id="label" for="range"></label><input id="range" type="range" min="0" max="100" value="25"><button id="mode" type="button">기본 구현</button></div><p class="note">강도와 개선 모드를 바꾸면 문항의 핵심 반응이 즉시 달라집니다.</p><div class="metrics"><div><small>강도</small><span id="m1"></span></div><div><small>처리</small><span id="m2"></span></div><div><small>출력</small><span id="m3"></span></div></div></div><script>
(()=>{const q=Math.max(51,Math.min(100,+(new URLSearchParams(location.search).get('q')||51))),c=document.querySelector('#c'),x=c.getContext('2d'),$=s=>document.querySelector(s);const N=['래그돌 지형 반응','부위별 피격·래그돌','천 시뮬레이션','머리카락 다이내믹','리지드바디 소품','파괴·잔해','로프·사슬 물리','질량 차이','히트스톱','카메라·VFX·진동','회피 슬로모션','공격 보정','콤보 입력 버퍼','패링 피드백','넉백·벽 충돌','카메라 충돌','전투 카메라 거리','심리스 대화 카메라','낙하 연출','보스 인트로 카메라','대규모 군중','군중 다양성·회피','군중 LOD','NPC 일과·반응','불 전파','마법 충전·발사','검기 트레일','폭발 충격파','GPU 파티클','재질별 피격 VFX','식생 상호작용','지면 흔적 복원','나무 절단','연속 지형','숲 LOD','지형 재질 블렌딩','화면 찢김 방지','입력 지연','프레임 스파이크','팝인 억제','사양 확장성','컬러 그레이딩','시간 누적 노이즈','안티앨리어싱','피격 화면 효과','수중 화면','상태 이상 화면','리버브·오클루전','공간 음향','수중 오디오'][q-51];let p=.25,on=false,t=0;$('#label').textContent=`Q${q} · ${N}`;const g=q<=65?0:q<=70?1:q<=74?2:q<=86?3:q<=94?4:5;function rs(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}function bg(w,h,a='#1a2a40',b='#31483f'){const z=x.createLinearGradient(0,0,0,h);z.addColorStop(0,a);z.addColorStop(1,b);x.fillStyle=z;x.fillRect(0,0,w,h)}function glow(cx,cy,r,col,a){const z=x.createRadialGradient(cx,cy,0,cx,cy,r);z.addColorStop(0,`rgba(${col},${a})`);z.addColorStop(1,`rgba(${col},0)`);x.fillStyle=z;x.fillRect(cx-r,cy-r,r*2,r*2)}function physics(w,h){bg(w,h);const cx=w*.43,gy=h*.76,k=on?p:0;x.strokeStyle='#efb08b';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(cx,gy-130);x.lineTo(cx+k*90,gy-70);x.lineTo(cx-50+k*110,gy-10);x.moveTo(cx+k*90,gy-70);x.lineTo(cx+70+k*130,gy-20);x.stroke();x.fillStyle='#efb08b';x.beginPath();x.arc(cx,gy-150,20,0,7);x.fill();x.strokeStyle='#7db3c9';x.lineWidth=4;x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy-p*75);x.stroke();if(q>=59&&q<=65){glow(w*.66,h*.45,80,'255,80,45',on?p:.08);x.fillStyle=`rgba(255,235,160,${on?p:0})`;x.fillRect(w*.55,h*.44,w*.25,5)}}function camera(w,h){bg(w,h,'#18263a','#425557');const zoom=on?1-p*.45:1;x.save();x.translate(w*.5,h*.5);x.scale(zoom,zoom);x.translate(-w*.5,-h*.5);x.fillStyle='#d7d8d2';x.fillRect(w*.47,h*.38,30,120);x.fillStyle='#492e2a';x.fillRect(w*.72,0,w*.28,h);x.restore();x.strokeStyle='#ffbd60';x.lineWidth=3;x.strokeRect(w*.15+p*80,h*.15+p*35,w*(.7-p*.18),h*(.7-p*.18))}function crowd(w,h){bg(w,h,'#375c78','#667c62');const n=on?Math.round(15+p*120):18;for(let i=0;i<n;i++){const xx=(i*83+t*(i%3))*1.7%w,yy=h*.35+((i*47)%(h*.55));x.fillStyle=`hsl(${(i*37)%360} 35% 55%)`;x.fillRect(xx,yy,3+(i%4),8+(i%5))}}function fx(w,h){bg(w,h,q>=84?'#36576d':'#22283a','#374536');const cx=w*.5,cy=h*.58;if(q===75){for(let i=0;i<12;i++){glow(cx+(i-6)*28,cy-(i%3)*15,35,'255,70,15',on?p:.12)}}else if(q===76||q===77){glow(cx,cy,60+p*100,'100,170,255',on?p:.1);x.strokeStyle='#9bdcff';x.lineWidth=3+p*8;x.beginPath();x.arc(cx,cy,45+p*90,3.4,6);x.stroke()}else if(q===78){x.strokeStyle=`rgba(180,230,255,${on?.8:.1})`;x.lineWidth=3;x.beginPath();x.arc(cx,cy,20+p*180,0,7);x.stroke()}else if(q===79||q===80){for(let i=0;i<100;i++){x.fillStyle=i%3?'#e4edf2':'#ffad45';x.fillRect((i*73+t*(on?180:30))%w,(i*41)%h,2+p*4,2+p*4)}}else if(q===81||q===82||q===83){x.fillStyle='#355f39';x.fillRect(0,h*.58,w,h*.42);for(let i=0;i<28;i++){x.strokeStyle='#7ca860';x.beginPath();x.moveTo(i*w/28,h*.8);x.lineTo(i*w/28+(on?p*45:0),h*.58);x.stroke()}}else{for(let i=0;i<55;i++){const z=((i*47)%100)/100,s=2+z*(on?18:7);x.fillStyle=i%2?'#29482f':'#796852';x.fillRect((i*91)%w,h*.32+z*h*.62,s,s*1.5)}}}function perf(w,h){bg(w,h,'#242d45','#53636a');if(q===87){x.fillStyle='#eff4f7';for(let i=0;i<15;i++)x.fillRect(i*w/15+(on?0:p*14),h*.2,w/22,h*.6)}else if(q===88||q===89){for(let i=0;i<90;i++){x.fillStyle=i<Math.round(p*90)?'#68c58b':'#d95c5c';x.fillRect((i%30)*w/30,h*.75-Math.floor(i/30)*10,w/34,6)}}else if(q===90||q===91){for(let i=0;i<50;i++){const s=on?4+((i*7)%10):2;x.fillStyle='#42684b';x.fillRect((i*67)%w,h*.35+((i*43)%(h*.6)),s,s*2)}}else if(q===92){x.fillStyle=`rgba(${on?25:110},${on?105:90},${on?130:80},${p})`;x.fillRect(0,0,w,h);glow(w*.6,h*.45,100,'255,140,60',.7)}else{for(let i=0;i<70;i++){x.fillStyle=`rgba(230,240,255,${on?.25:.9})`;x.fillRect((i*71)%w,(i*37)%h,on?4:1,on?4:1)}}}function screen(w,h){bg(w,h,'#26304a','#43515a');glow(w*.55,h*.45,100,'255,190,110',.75);if(q===95||q===97){x.fillStyle=`rgba(${q===97?'60,180,80':'210,25,35'},${on?p*.65:.08})`;x.fillRect(0,0,w,h);x.strokeStyle=`rgba(255,50,60,${on?p:0})`;x.lineWidth=25;x.strokeRect(0,0,w,h)}else if(q===96){x.fillStyle=`rgba(0,95,145,${on?.75*p:.15})`;x.fillRect(0,0,w,h);for(let i=0;i<8;i++){x.strokeStyle='#67cde8';x.beginPath();x.moveTo(0,h*.2+i*25);x.bezierCurveTo(w*.3,h*.1+i*30,w*.7,h*.35+i*15,w,h*.2+i*25);x.stroke()}}else{const bars=10;for(let i=0;i<bars;i++){const ht=(.1+Math.abs(Math.sin(t*3+i))*p)*h*.45;x.fillStyle=i<bars/2?'#68b5d0':'#ef9f58';x.fillRect(w*.2+i*w*.06,h*.72-ht,w*.035,ht)}}}function draw(ts=0){t=ts/1000;rs();const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);[physics,camera,crowd,fx,perf,screen][g](w,h);$('#m1').textContent=Math.round(p*100)+'%';$('#m2').textContent=on?'개선 ON':'기본';$('#m3').textContent=(on?Math.round(p*100):Math.round(p*15))+'%';requestAnimationFrame(draw)}$('#range').oninput=e=>p=+e.target.value/100;$('#mode').onclick=()=>{on=!on;$('#mode').classList.toggle('on',on);$('#mode').textContent=on?'개선 구현':'기본 구현'};addEventListener('resize',rs);draw();try{parent.postMessage({type:'q-lab-h',h:Math.ceil($('#r').getBoundingClientRect().height)+4},'*')}catch(e){}})();</script></body></html>
