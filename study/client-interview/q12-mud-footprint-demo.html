<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q12 진흙·모래 발자국 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="진흙 발자국의 데칼, POM 깊이, 착지 파티클과 스플랫 누적 단계"></canvas><div class="hud"><span>Q12 · <b id="stage">색 데칼</b></span><span id="status">표면 위 스티커</span></div></div>
<div class="steps" role="group" aria-label="진흙 발자국 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>색 데칼</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>G버퍼 변조</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>POM 깊이</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>투영 제한</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>착지 파티클</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>RT 스플랫</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="impact">착지 충격</label><output id="impactOut">55%</output></div><input id="impact" type="range" min="10" max="100" value="55"></div><div><div class="ct"><label for="crowd">동시 보행자</label><output id="crowdOut">1명</output></div><input id="crowd" type="range" min="1" max="100" value="1"></div><div class="toggles" role="group" aria-label="지면 재질과 착지"><button data-mat="0" aria-pressed="true">● 젖은 진흙</button><button data-mat="1" aria-pressed="false">░ 마른 모래</button><button id="land">↓ 착지</button></div></div>
<div class="metrics"><div class="m"><small>러프니스</small><strong id="mRough">0.72</strong></div><div class="m"><small>가짜 깊이</small><strong id="mDepth">0 mm</strong></div><div class="m"><small>파티클</small><strong id="mParticles">0</strong></div><div class="m"><small>자국 드로우</small><strong id="mDraws">1</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,impact:.55,crowd:1,mat:0,t:0,prints:[{x:.43,y:.58,a:-.15}],particles:[]},names=['색 데칼','G버퍼 변조','POM 깊이','투영 제한','착지 파티클','렌더타겟 스플랫'];
const desc=['<b>문제 재현:</b> 알베도 그림만 투영해 표면 위에 뜬 스티커입니다. 조명이 움직여도 진흙의 번들거림과 요철이 반응하지 않습니다.','<b>표면 자체 변조:</b> 디퍼드 데칼이 알베도·노멀·러프니스·AO를 함께 바꿉니다. 진흙은 어둡고 매끈하게, 모래는 밝고 거칠게 반응합니다.','<b>얕은 깊이 위조:</b> 높이맵을 시선 방향으로 탐색하는 POM이 실제 메시를 늘리지 않고 함몰과 자체 가림을 만듭니다.','<b>투영 누수 차단:</b> 접촉 노멀로 데칼을 눕히고 투영축과 각도가 큰 벽은 잘라냅니다. 오른쪽 벽에 번지던 진흙이 사라집니다.','<b>접촉 이벤트:</b> 착지 충격이 파티클 개수·속도를 정합니다. 진흙은 무거운 방울, 모래는 가벼운 먼지이며 자국 시스템과 별도입니다.','<b>최종:</b> 군중의 수천 데칼을 지형 렌더타겟 한 장에 합칩니다. 보행자 슬라이더를 올려도 자국 드로우는 1로 유지됩니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function stamp(px,py,a,scale=1){x.save();x.translate(px,py);x.rotate(a);const mud=S.mat===0,deferred=S.step>=1,pom=S.step>=2;x.fillStyle=mud?(deferred?'rgba(45,28,19,.85)':'rgba(91,55,35,.62)'):(deferred?'rgba(175,145,98,.65)':'rgba(189,163,119,.5)');x.beginPath();x.ellipse(0,0,17*scale,36*scale,0,0,7);x.fill();if(deferred){x.strokeStyle=mud?'rgba(230,180,110,.28)':'rgba(250,225,170,.34)';x.lineWidth=pom?6:2;x.beginPath();x.ellipse(0,0,17*scale,36*scale,0,0,7);x.stroke()}if(pom){x.fillStyle='rgba(0,0,0,.34)';x.beginPath();x.ellipse(4,6,11*scale,27*scale,0,0,7);x.fill()}x.restore()}
function spawn(){const n=Math.round(6+S.impact*36);for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+Math.random()*.2,v=(25+Math.random()*85)*S.impact;S.particles.push({x:.48,y:.55,vx:Math.cos(a)*v,vy:-Math.random()*v*.8-20,life:1,size:S.mat?2+Math.random()*3:3+Math.random()*5})}S.prints.push({x:.48,y:.60,a:(S.prints.length%2?.18:-.18)});if(S.prints.length>40)S.prints.shift();ui()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,mud=S.mat===0;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,mud?'#70563f':'#c5aa75');bg.addColorStop(1,mud?'#3c3028':'#8f744e');x.fillStyle=bg;x.fillRect(0,0,w,h);for(let i=0;i<80;i++){x.fillStyle=mud?'rgba(30,20,15,.12)':'rgba(255,239,190,.16)';x.beginPath();x.arc((i*73)%w,(i*41)%h,1+(i%4),0,7);x.fill()}
// floor perspective and wall projection leak
x.strokeStyle='rgba(255,255,255,.09)';for(let i=0;i<12;i++){x.beginPath();x.moveTo(i*w/11,0);x.lineTo(w*.5+(i-5.5)*w*.13,h);x.stroke()}x.fillStyle=mud?'#5c493a':'#a98d60';x.fillRect(w*.82,h*.18,w*.18,h*.53);
const count=S.step>=5?Math.min(34,Math.ceil(S.crowd*.34)):S.prints.length;for(let i=0;i<count;i++){const p=S.prints[i%S.prints.length]||{x:.4,y:.5,a:0},px=(p.x+(i*.137)% .55)*w% (w*.80),py=(p.y+(i*.217)% .48)*h%h;stamp(px,py,p.a,i>10?.65:1)}
if(S.step<3){x.save();x.translate(w*.84,h*.40);x.rotate(Math.PI/2);stamp(0,0,0,.8);x.restore();x.fillStyle='#ff7469';x.font='600 10px system-ui';x.fillText('박스 투영이 벽까지 칠함',w*.78,h*.62)}else{x.fillStyle='#6ed7e5';x.font='600 10px system-ui';x.fillText('ANGLE CUTOFF · 벽 제외',w*.77,h*.62)}
for(const p of S.particles){x.fillStyle=mud?'#4b2d1d':'rgba(229,202,145,.8)';x.beginPath();x.arc(p.x*w,p.y*h,p.size,0,7);x.fill()}
if(S.step===0){x.fillStyle='rgba(7,10,15,.84)';x.fillRect(w*.06,h*.10,w*.32,h*.11);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('색만 덮은 스티커',w*.08,h*.15);x.fillStyle='#96a2b2';x.font='10px system-ui';x.fillText('노멀·러프니스·깊이 변화 없음',w*.08,h*.185)}
if(S.step>=5){x.fillStyle='rgba(7,10,15,.78)';x.fillRect(w*.05,h*.82,w*.36,h*.09);x.fillStyle='#6ed7e5';x.font='600 10px ui-monospace,monospace';x.fillText(`RT SPLAT: ${S.crowd} ACTORS → 1 DRAW`,w*.07,h*.87)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-mat]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.mat===S.mat)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('mRough').textContent=(S.step>=1?(S.mat?0.88:0.24):0.72).toFixed(2);$('mDepth').textContent=(S.step>=2?(S.mat?8:18):0)+' mm';$('mParticles').textContent=S.particles.length;$('mDraws').textContent=S.step>=5?'1':Math.max(1,Math.ceil(S.crowd*S.prints.length));$('status').textContent=['표면 위 스티커','재질 채널 반응','시선 기반 함몰','벽 투영 차단','충격 '+Math.round(S.impact*100)+'%','군중 '+S.crowd+'명 → RT 1장'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>{S.mat=+b.dataset.mat;ui()});$('impact').oninput=e=>{S.impact=+e.target.value/100;$('impactOut').textContent=e.target.value+'%';ui()};$('crowd').oninput=e=>{S.crowd=+e.target.value;$('crowdOut').textContent=e.target.value+'명';ui()};$('land').onclick=spawn;let last=0;function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;S.t=t/1000;for(const p of S.particles){p.x+=p.vx/c.clientWidth*dt;p.vy+=95*dt;p.y+=p.vy/c.clientHeight*dt;p.life-=dt*.65}S.particles=S.particles.filter(p=>p.life>0&&p.y<.85);draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
