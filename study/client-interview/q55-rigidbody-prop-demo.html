<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q55 소품 리지드바디 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="모든 소품의 정밀 메시 물리를 항상 켜는 실패에서 슬립, 볼록 프록시, 브로드페이즈, 재질, 스택 워밍스타트, 활성 예산과 CCD로 개선하는 과정"></canvas><div class="hud"><span>Q55 · <b id="stage">전부 정밀 메시·항상 활성</b></span><span id="status">멈춘 50개도 1,225쌍을 계속 검사</span></div></div>
<div class="steps" role="group" aria-label="소품 리지드바디 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>항상 정밀 물리</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>Sleep·Wake</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>볼록 프록시</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>후보·재질</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>스택·예산</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>CCD·안전장치</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="impulse">차는 힘</label><output id="impulseOut">68%</output></div><input id="impulse" type="range" min="10" max="100" value="68"></div><div><div class="ct"><label for="bounce">재질 반발</label><output id="bounceOut">46%</output></div><input id="bounce" type="range" min="0" max="90" value="46"></div><div class="toggles" role="group" aria-label="슬립과 CCD 활성 예산 설정"><button id="sleep" aria-pressed="false">Sleep/Wake</button><button id="ccd" aria-pressed="false">CCD+활성 예산</button></div></div>
<div class="metrics"><div class="m"><small>활성 리지드바디</small><strong id="mActive">50 / 50</strong></div><div class="m"><small>충돌 후보 검사</small><strong id="mPairs">1,225 pairs</strong></div><div class="m"><small>충격 후 이동거리</small><strong id="mTravel">3.1 m</strong></div><div class="m"><small>빠른 통 vs 벽</small><strong id="mTunnel">미검사</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,impulse:68,bounce:46,sleep:false,ccd:false,t:0};
const names=['전부 정밀 메시·항상 활성','속도 임계 아래는 솔버에서 제외','렌더 메시와 충돌 프록시 분리','AABB 후보 축소와 물리 머티리얼','접촉 캐시·워밍스타트·활성 상한','빠른 물체만 연속 스윕 검사'],status=['멈춘 50개도 1,225쌍을 계속 검사','건드린 섬만 깨고 나머지는 비용 0','상자는 박스, 통은 캡슐로 싸고 안정적','나무·금속의 마찰·반발·소리가 연결','보이는 소품만 풀 품질, 나머지는 재움','한 틱 이동 경로가 얇은 벽을 놓치지 않음'];
const desc=['<b>실패 재현:</b> 방의 소품 50개가 멈춰 있어도 모두 활성이고, 오목한 렌더 삼각형끼리 전 쌍을 비교해 스택이 떨며 비용이 샙니다.','<b>가장 큰 절약:</b> 속도·각속도가 임계 이하인 바디를 Sleep시켜 솔버에서 빼고, 충격이 닿은 접촉 아일랜드만 Wake합니다. 토글로 활성 수를 비교하세요.','<b>형상 분리:</b> 보이는 복잡한 통·상자는 그대로 두되 충돌은 실린더·박스·볼록 헐로 근사합니다. 적은 접촉점으로 끼임과 지터가 줄어듭니다.','<b>넓게 거르고 좁게 풀기:</b> AABB/BVH가 가까운 후보만 남기고, 재질 반발이 나무의 둔탁함과 금속 통의 튕김·소리를 함께 결정합니다.','<b>쌓기와 규모:</b> 이전 접촉 힘을 워밍스타트해 스택을 안정시키고 활성 바디 상한을 둡니다. 초과·원거리 소품은 Sleep 또는 키네마틱으로 강등합니다.','<b>솔버 안전망:</b> 빠른 통만 CCD 스윕으로 이동 경로를 검사해 터널링을 막습니다. 끼임 복구는 클램프하고 오래 떨면 재워 비용과 폭주를 끝냅니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const sleep=S.step>=1&&S.sleep,broad=S.step>=3,budget=S.step>=4&&S.ccd,ccd=S.step>=5&&S.ccd,active=S.step===0?50:S.step>=4?(budget?8:sleep?24:50):sleep?6:50,pairs=broad?(budget?7:12):1225,travel=(S.impulse/100)*(1.8+S.bounce/45),tunnel=S.step<5?'미검사':ccd?'CCD 충돌':'벽 관통';return{sleep,broad,budget,ccd,active,pairs,travel,tunnel}}
function system(w,h,v){const ox=w*.035,oy=h*.18,gw=w*.34,gh=h*.68,narrow=w<900;label(S.step<2?'RAW RENDER-MESH PHYSICS':'COLLISION PIPELINE',ox,oy-16,S.step<2?'#ff8179':'#8ce4b4');if(S.step===0){for(let i=0;i<20;i++){const px=ox+(i%5)*gw*.19,py=oy+Math.floor(i/5)*gh*.20+Math.sin(S.t*.35+i)*4;x.strokeStyle='#ff8179';x.beginPath();x.moveTo(px,py+25);x.lineTo(px+18,py);x.lineTo(px+40,py+23);x.lineTo(px+28,py+48);x.lineTo(px+5,py+43);x.closePath();x.stroke()}label('50 ACTIVE · TRIANGLE CONTACT JITTER',ox+gw*.47,oy+gh*.90,'#ff8179','center');return}const rows=[['VELOCITY < ε',v.sleep?'SLEEP':'STILL SOLVING'],['RENDER MESH',narrow?'PRIMITIVE PROXY':'BOX / CAPSULE PROXY'],['ALL PAIRS',v.broad?(narrow?'AABB CANDIDATES':'AABB / BVH CANDIDATES'):'ALL PAIRS'],['CONTACT','MATERIAL + ISLAND'],['STACK',S.step>=4?(narrow?'WARMSTART':'CACHE + WARMSTART'):'COLD SOLVE'],['FAST BODY',v.ccd?'CCD SWEEP':'DISCRETE ONLY']];rows.forEach((r,i)=>{const y=oy+i*gh*.145;label(r[0],ox,y+12,'#97aab8');line(ox+gw*.29,y+6,ox+gw*.48,y+6,'#526b79',2);const on=i<=S.step;label(r[1],ox+gw*.52,y+12,on?'#8ce4b4':'#758b9b')});if(S.step>=3){if(!narrow){const boxes=[[.03,.06,.22,.15],[.20,.23,.24,.18],[.13,.48,.27,.18],[.53,.17,.22,.22],[.59,.53,.27,.17]];boxes.forEach((b,i)=>{x.strokeStyle=i<2?'#ffd17f':'#526b79';x.strokeRect(ox+b[0]*gw,oy+b[1]*gh,b[2]*gw,b[3]*gh)})}label(`${v.pairs} BROADPHASE CANDIDATES`,ox+gw*.45,oy+gh*.96,'#ffd17f','center')}}
function scene(w,h,v){const left=w*.43,right=w*.96,ground=h*.83,wall=w*.88,phase=Math.min(1,(S.t%140)/50),speed=S.impulse/100,xmove=(right-left)*phase*(S.step===5?.75+.55*speed:speed),metalBounce=Math.abs(Math.sin(phase*Math.PI*2.2))*(S.bounce/100)*h*.18;label('RUNTIME PROP ISLAND',left,h*.15,'#72c9ff');line(left,ground,right,ground,'#526b79',3);x.fillStyle='#2d4354';x.fillRect(wall,ground-h*.48,8,h*.48);label('THIN WALL',wall,ground-h*.51,'#97aab8','center');
if(S.step<4){for(let i=0;i<7;i++){let px=left+30+i*65;const awake=i===0||!v.sleep,jit=awake?Math.sin(S.t*.15+i)*3:0,bounceY=S.step>=3&&i===0?-metalBounce:jit;if(S.step>=3&&i===0)px=left+30+xmove*.62;if(i%2){x.fillStyle=awake?'#b9854d':'#40515c';x.fillRect(px,ground-45+bounceY,42,42);if(S.step>=2){x.strokeStyle='#8ce4b4';x.strokeRect(px+3,ground-42+bounceY,36,36)}}else{x.fillStyle=awake?'#668ba0':'#40515c';x.beginPath();x.ellipse(px+20,ground-25+bounceY,20,26,0,0,7);x.fill();if(S.step>=2){x.strokeStyle='#8ce4b4';x.strokeRect(px+2,ground-51+bounceY,36,52)}if(i===0&&S.step>=3)line(px+5,ground-25+bounceY,px+35,ground-25+bounceY,'#d8edf7',2)}if(!awake)label('Z',px+18,ground-56,'#97aab8','center')}if(S.step>=3){label(`WOOD μ HIGH · e ${(S.bounce*.45/100).toFixed(2)} · THUD`,left+95,h*.33,'#ffd17f');label(`METAL μ LOW · e ${(S.bounce/100).toFixed(2)} · CLANG`,left+95,h*.40,'#72c9ff')}}else if(S.step===4){for(let row=0;row<3;row++)for(let col=0;col<4-row;col++){const px=left+120+col*48+row*24,py=ground-42-row*44+(v.budget?0:Math.sin(S.t*.3+col+row)*5);x.fillStyle=row===2?'#ffd17f':'#668ba0';x.fillRect(px,py,42,40);x.strokeStyle=v.budget?'#8ce4b4':'#ff8179';x.strokeRect(px,py,42,40)}label(v.budget?'WARMSTARTED STACK · ACTIVE CAP 8':'COLD CONTACTS · 50 ACTIVE · JITTER',left+220,h*.31,v.budget?'#8ce4b4':'#ff8179','center')}else{let bx=left+30+xmove;if(v.ccd)bx=Math.min(bx,wall-31);else bx=Math.min(bx,right-28);const by=ground-26-metalBounce;x.fillStyle='#72c9ff';x.beginPath();x.arc(bx,by,26,0,7);x.fill();line(left+28,by,left+xmove,by,v.ccd?'#8ce4b4':'#ff8179',2,[6,4]);label(v.ccd?'SWEEP HIT → BOUNCE':'DISCRETE ENDPOINT → TUNNELED',left+210,h*.30,v.ccd?'#8ce4b4':'#ff8179','center');if(!v.ccd&&bx>wall)label('MISSED WALL',bx,by-38,'#ff8179','center')}
}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);system(w,h,v);scene(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('sleep').setAttribute('aria-pressed',String(S.sleep));$('ccd').setAttribute('aria-pressed',String(S.ccd));const v=vals();$('mActive').textContent=v.active+' / 50';$('mPairs').textContent=v.pairs.toLocaleString()+' pairs';$('mTravel').textContent=v.travel.toFixed(1)+' m';$('mTunnel').textContent=v.tunnel;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.sleep=S.step>=1;S.ccd=S.step>=4;S.t=0;update()});$('impulse').oninput=e=>{S.impulse=+e.target.value;$('impulseOut').textContent=S.impulse+'%';S.t=0;update()};$('bounce').oninput=e=>{S.bounce=+e.target.value;$('bounceOut').textContent=S.bounce+'%';S.t=0;update()};$('sleep').onclick=()=>{S.sleep=!S.sleep;update()};$('ccd').onclick=()=>{S.ccd=!S.ccd;S.t=0;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
