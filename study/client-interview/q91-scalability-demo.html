<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q91 품질 스케일러빌리티 실험실</title><style>
:root{--bg:#0a0d13;--panel:#131923;--line:#3a4352;--ink:#f6f7fa;--muted:#9fa9b6;--cyan:#72d3ff;--green:#7fe0a2;--gold:#ffd06c;--red:#ff7d76}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#121a25}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#060910df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8591a0;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="하드웨어 등급과 CPU GPU 병목에 따라 프리셋, 개별 품질 축, LOD 바이어스, 동적 해상도가 조절되는 실험"></canvas><div class="hud"><span>Q91 · <b id="stage">하나의 고정 최고 설정</b></span><span id="status">저사양은 슬라이드쇼, 고사양은 남는 성능을 낭비</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 울트라</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>품질 프리셋</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>통짜 설정 한계</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>병목별 축</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>LOD·밉 바이어스</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>자동감지·DRS</button></div><p id="explain" class="explain"></p>
<div class="controls"><div><div class="ct"><label for="cpu">CPU 성능</label><output id="cpuOut">45%</output></div><input id="cpu" type="range" min="20" max="100" value="45"></div><div><div class="ct"><label for="gpu">GPU 성능</label><output id="gpuOut">55%</output></div><input id="gpu" type="range" min="20" max="100" value="55"></div><div class="toggles"><button id="auto" aria-pressed="false">병목 자동감지</button><button id="fair" aria-pressed="false">경쟁 시야 고정</button></div></div>
<div class="metrics"><div class="m"><small>예상 프레임</small><strong id="mFps">29 fps</strong></div><div class="m"><small>지오메트리</small><strong id="mTris">18.0M tris</strong></div><div class="m"><small>텍스처 풀</small><strong id="mPool">4.0 GB</strong></div><div class="m"><small>적 식별 거리</small><strong id="mView">250 m</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,cpu:.45,gpu:.55,auto:false,fair:false};const names=['하나의 고정 최고 설정','낮음·중간·높음·울트라 묶음','CPU와 GPU가 엇갈린 PC','그림자·군중·후처리를 병목별 조절','세계 전체의 LOD·밉 전환을 당기기','벤치마크 추천 + 순간 부하는 DRS'];const stats=['저사양은 슬라이드쇼, 고사양은 남는 성능을 낭비','유저가 한 번에 하드웨어에 맞는 묶음을 선택','통짜 프리셋은 약한 부품을 정확히 겨냥하지 못함','CPU면 군중, GPU면 그림자·해상도를 선택적으로 절감','후처리뿐 아니라 지오메트리와 VRAM 바닥 자체를 낮춤','정적 설정으로 바닥을 낮추고 씬별 요동은 동적으로 흡수'];const desc=['<b>한 값으로 10배 범위를 못 담습니다:</b> 최고 설정을 고정하면 구형 기기는 무너지고 최신 GPU는 놀게 됩니다. CPU·GPU 슬라이더를 낮춰 차이를 보세요.','<b>대표 프리셋:</b> 그림자·텍스처·시야·파티클·후처리를 낮음~울트라 묶음으로 제공합니다. 쉬운 출발점이지만 병목이 다른 PC에는 너무 뭉툭합니다.','<b>비대칭 하드웨어:</b> CPU는 약하고 GPU는 강한데 통째로 낮추면 쓸 수 있는 화질까지 버립니다. 반대 조합도 마찬가지라 개별 축이 필요합니다.','<b>병목을 콕 집기:</b> CPU 바운드면 군중·물리·드로우콜, GPU 바운드면 그림자·반사·해상도를 내립니다. 자동감지를 껐다 켜 같은 부품에서 FPS를 비교하세요.','<b>세계의 바닥 줄이기:</b> LOD 전환을 당기고 밉 바이어스를 올려 지오메트리와 텍스처 풀을 줄입니다. 핵심 캐릭터는 같은 거리에서 저폴리로 남겨 공정성을 지킵니다.','<b>우아한 열화:</b> 벤치마크로 초기 축을 추천하고 DRS로 순간 부하를 흡수합니다. 경쟁 시야 고정을 끄면 성능은 늘지만 정보량이 달라지는 위험도 확인할 수 있습니다.'];
function calc(){let q=1,tris=18,pool=4,view=250,cpuCost=22/S.cpu,gpuCost=19/S.gpu;if(S.step>=1){q=Math.max(.35,Math.min(1,(S.cpu+S.gpu)/1.35));tris=18*q;pool=1.3+2.7*q}if(S.step===2)q=Math.max(.35,Math.min(1,(S.cpu+S.gpu)/1.35));if(S.step>=3&&S.auto){cpuCost*=.68;gpuCost*=.72;tris*=.8;pool*=.86}if(S.step>=4){tris*=.48;pool*=.62;view=S.fair?250:170}if(S.step>=5){cpuCost*=.86;gpuCost*=.8}let ms=Math.max(cpuCost*q,gpuCost*q,8),fps=Math.min(120,Math.round(1000/ms));return{q,tris,pool,view,fps,cpuMs:cpuCost*q,gpuMs:gpuCost*q}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc();x.fillStyle='#121a25';x.fillRect(0,0,w,h);x.fillStyle='#26394a';x.fillRect(0,h*.45,w,h*.55);let count=Math.round(8+V.q*22);for(let i=0;i<count;i++){let z=(i%11)/11,px=((i*83)%997)/997*w,size=7+z*30,y=h*(.48+z*.37);x.fillStyle=i%4?'#7fe0a2':'#72d3ff';x.fillRect(px,y-size*.5,Math.max(2,size*.11),size*.5);x.beginPath();x.arc(px,y-size*.65,size*(S.step>=4&&z<.6?.18:.3),0,Math.PI*2);x.fill();if(S.step<3||V.q>.7){x.fillStyle='#00000033';x.fillRect(px+size*.12,y,size*.42,3)}}let bx=w*.12,bw=w*.76,barH=23;x.font='600 10px ui-monospace,Consolas,monospace';[['CPU',V.cpuMs,'#72d3ff'],['GPU',V.gpuMs,'#ffd06c']].forEach((r,i)=>{let y=h*.12+i*40;x.fillStyle='#293243';x.fillRect(bx,y,bw,barH);x.fillStyle=r[1]>16.6?'#ff7d76':r[2];x.fillRect(bx,y,bw*Math.min(r[1]/28,1),barH);x.fillStyle='#f6f7fa';x.fillText(r[0]+' '+r[1].toFixed(1)+'ms',bx+7,y+15)});let budgetX=bx+bw*16.6/28;x.strokeStyle='#f6f7fa';x.beginPath();x.moveTo(budgetX,h*.1);x.lineTo(budgetX,h*.22);x.stroke();$('mFps').textContent=V.fps+' fps';$('mTris').textContent=V.tris.toFixed(1)+'M tris';$('mPool').textContent=V.pool.toFixed(1)+' GB';$('mView').textContent=V.view+' m';c.dataset.fps=V.fps;c.dataset.tris=V.tris.toFixed(1);c.dataset.pool=V.pool.toFixed(1);c.dataset.view=V.view;c.dataset.cpu=V.cpuMs.toFixed(1);c.dataset.gpu=V.gpuMs.toFixed(1)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('auto').setAttribute('aria-pressed',String(S.auto));$('fair').setAttribute('aria-pressed',String(S.fair));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.auto=S.step>=3;S.fair=S.step>=4;update()});$('cpu').oninput=e=>{S.cpu=+e.target.value/100;$('cpuOut').textContent=e.target.value+'%';draw()};$('gpu').oninput=e=>{S.gpu=+e.target.value/100;$('gpuOut').textContent=e.target.value+'%';draw()};$('auto').onclick=()=>{S.auto=!S.auto;update()};$('fair').onclick=()=>{S.fair=!S.fair;update()};update();addEventListener('resize',draw)})();
</script></body></html>
