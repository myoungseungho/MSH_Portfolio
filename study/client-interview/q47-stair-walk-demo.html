<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q47 계단 보행 Foot IK 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="계단을 걷는 캐릭터에게 경사 자세, 발 레이·IK, 골반 보정, 모서리 스무딩과 군중 IK 예산을 순서대로 적용하는 과정"></canvas><div class="hud"><span>Q47 · <b id="stage">캡슐만 계단을 추종</b></span><span id="status">평지 발 포즈는 세계와 분리</span></div></div>
<div class="steps" role="group" aria-label="계단 보행 IK 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>평지 보행 그대로</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>경사 자세 블렌드</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>양발 레이·IK</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>골반 공용 예산</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>모서리 지터</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>스무딩·K명 예산</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">계단 이동 속도</label><output id="speedOut">4.0 m/s</output></div><input id="speed" type="range" min="1" max="9" step=".5" value="4"></div><div><div class="ct"><label for="crowd">전장 병사 수</label><output id="crowdOut">180 명</output></div><input id="crowd" type="range" min="20" max="320" step="20" value="180"></div><div class="toggles" role="group" aria-label="멀티레이·크리티컬 스무딩과 가까운 K명 IK 예산"><button id="smooth" aria-pressed="false">멀티레이·스무딩</button><button id="budget" aria-pressed="false">가까운 K명만 IK</button></div></div>
<div class="metrics"><div class="m"><small>계단 모서리 발 지터</small><strong id="mJitter">18 cm</strong></div><div class="m"><small>발-단 높이 오차</small><strong id="mError">24 cm</strong></div><div class="m"><small>활성 IK 병사</small><strong id="mActive">180</strong></div><div class="m"><small>레이/프레임</small><strong id="mRays">360</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:4,crowd:180,smooth:false,budget:false,t:0},names=['capsule follows stairs · flat gait','slope additive posture','per-foot raycast + two-bone IK','pelvis as shared leg budget','single-ray stair-edge jitter','multi-ray smoothing + nearest-K budget'],desc=['<b>문제 재현:</b> 캡슐 중심만 계단 높이를 따라가면 평지 보행의 두 발은 평균 높이에 남아 한쪽이 뜨고 다른 쪽은 단을 뚫습니다.','<b>자세부터 지형에:</b> 발밑 평균 경사에 따라 오르막·내리막 애디티브 포즈를 블렌드해 몸통 기울기와 보폭의 결을 맞춥니다. 발별 접지는 아직 틀립니다.','<b>각 발을 실제 단으로:</b> 발마다 아래 레이를 쏴 높이·법선을 얻고 2본 IK로 각자 다른 계단 단에 붙입니다.','<b>두 다리가 나눠 쓰는 골반:</b> 낮은 발 기준으로 골반을 먼저 내린 뒤 양발을 올려 붙여 과신전 없이 서로 다른 단을 딛습니다.','<b>빠른 계단의 새 문제:</b> 단일 레이가 모서리 앞뒤를 넘을 때 목표 높이가 한 프레임에 한 단씩 점프해 IK 발이 덜덜 떱니다. 속도를 올려 보세요.','<b>시간·공간·인지를 함께 제한:</b> 발 앞뒤 멀티레이로 다음 단을 예측하고 목표를 크리티컬 댐프합니다. 군중은 가까운 K명만 풀 IK, 중거리는 저빈도, 원거리는 끕니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){if(c.clientWidth<900&&S.step===5&&(/^(SLOPE|PELVIS|FOOT )/.test(t)))return;x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let ik=S.step>=2,pelvis=S.step>=3,jitter=S.step>=4?(S.smooth&&S.step>=5?Math.max(1,S.speed*.7):Math.round(S.speed*4.5)):0,error=ik?(pelvis?2:9):24,active=S.budget&&S.step>=5?Math.min(28,S.crowd):S.crowd,rays=S.step<2?0:active*2*(S.smooth&&S.step>=5?1.5:1);return{ik,pelvis,jitter,error,active,rays}}
function stairY(px,w,h){let start=w*.12,stepW=w*.085,idx=Math.max(0,Math.min(8,Math.floor((px-start)/stepW)));return h*.82-idx*h*.055}function leg(sx,sy,tx,ty,bend,co){let L=70,dx=tx-sx,dy=ty-sy,d=Math.min(136,Math.max(15,Math.hypot(dx,dy))),mx=(sx+tx)/2,my=(sy+ty)/2,px=-dy/d,py=dx/d,k=Math.sqrt(Math.max(0,L*L-d*d/4)),kx=mx+px*k*bend,ky=my+py*k*bend;x.strokeStyle=co;x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(sx,sy);x.lineTo(kx,ky);x.lineTo(tx,ty);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(kx,ky,5,0,7);x.fill()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),start=w*.12,stepW=w*.085;x.fillStyle='#142631';x.fillRect(0,0,w,h);x.fillStyle='#365463';x.beginPath();x.moveTo(0,h);x.lineTo(start,h);for(let i=0;i<9;i++){let x0=start+i*stepW,y=stairY(x0+2,w,h);x.lineTo(x0,y);x.lineTo(x0+stepW,y)}x.lineTo(w,h);x.fill();let travel=(S.t*S.speed*.0012)%(stepW*2),cx=w*.48+travel,footL=cx-stepW*.38,footR=cx+stepW*.38,gL=stairY(footL,w,h),gR=stairY(footR,w,h),animY=(gL+gR)/2-8,pelvisDrop=v.pelvis?Math.abs(gL-gR)*.34:0,pelvisY=h*.38+pelvisDrop,lean=S.step>=1?-.15:0;x.save();x.translate(cx,pelvisY);x.rotate(lean);x.fillStyle='#6b9eb3';x.fillRect(-38,-28,76,45);x.strokeStyle='#72c9ff';x.lineWidth=10;x.beginPath();x.moveTo(0,-28);x.lineTo(0,-108);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(0,-126,18,0,7);x.fill();x.restore();let targetL=v.ik?gL-4:animY,targetR=v.ik?gR-4:animY;if(S.step===4&&!S.smooth){let jump=Math.sin(S.t*.34*S.speed)>0?1:-1;targetR+=jump*h*.055*.42}leg(cx-24,pelvisY,footL,targetL,-1,'#72c9ff');leg(cx+24,pelvisY,footR,targetR,1,'#72c9ff');[[footL,targetL],[footR,targetR]].forEach((p,i)=>{x.strokeStyle=v.ik?'#8ce4b4':'#f2f8fc';x.lineWidth=7;x.beginPath();x.moveTo(p[0]-13,p[1]);x.lineTo(p[0]+15,p[1]);x.stroke();if(!v.ik){x.strokeStyle='#ff8179';x.setLineDash([4,4]);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0],i?gR:gL);x.stroke();x.setLineDash([])}});if(S.step===0)tag('FLAT GAIT FEET FOLLOW CAPSULE AVERAGE',w*.30,h*.20,'#ff8179');if(S.step>=1){x.strokeStyle='#ffd17f';x.lineWidth=3;x.beginPath();x.moveTo(cx-80,pelvisY-75);x.lineTo(cx+70,pelvisY-100);x.stroke();tag('SLOPE ADDITIVE BODY LEAN',w*.36,h*.25,'#ffd17f')}if(S.step>=2){[[footL,gL],[footR,gR]].forEach((p,i)=>{x.strokeStyle='#ffd17f';x.setLineDash([5,4]);x.beginPath();x.moveTo(p[0],h*.48);x.lineTo(p[0],p[1]);x.stroke();x.setLineDash([]);tag(`FOOT ${i?'R':'L'} HIT`,p[0]-33,p[1]-18,'#ffd17f')})}if(S.step>=3){x.strokeStyle='#8ce4b4';x.beginPath();x.moveTo(cx-75,pelvisY-35);x.lineTo(cx+75,pelvisY-35);x.stroke();tag(`PELVIS SHARED OFFSET ${pelvisDrop.toFixed(0)} px`,cx-78,pelvisY-48,'#8ce4b4')}if(S.step===4){for(let i=0;i<5;i++){x.globalAlpha=.18;x.fillStyle='#ff8179';x.fillRect(footR-10,targetR+i*(i%2?10:-8),20,6)}x.globalAlpha=1;tag('SINGLE RAY TARGET JUMPS BETWEEN TREADS',w*.53,h*.22,'#ff8179')}if(S.step>=5){if(S.smooth){[-18,0,18].forEach((o,i)=>{x.strokeStyle=i===1?'#8ce4b4':'#ffd17f';x.setLineDash([3,3]);x.beginPath();x.moveTo(footR+o,h*.52);x.lineTo(footR+o,stairY(footR+o,w,h));x.stroke();x.setLineDash([])});tag('FORE · CENTER · HEEL PROBES → CRITICAL DAMP',w*.48,h*.20,'#8ce4b4')}const bars=12;for(let i=0;i<bars;i++){x.fillStyle=i<2?'#72c9ff':i<5?'#ffd17f':'#516876';x.fillRect(w*.73+i*17,h*.32+i*8,8,30)}tag(S.budget?'NEAREST K FULL · MID THROTTLED · FAR OFF':'EVERY SOLDIER FULL IK',w*.70,h*.27,S.budget?'#8ce4b4':'#ff8179')}
}function metrics(){const v=vals();$('mJitter').textContent=v.jitter.toFixed(0)+' cm';$('mError').textContent=v.error+' cm';$('mActive').textContent=v.active;$('mRays').textContent=Math.round(v.rays)}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['평지 발 포즈는 세계와 분리','몸통 결만 경사에 적응','각 발이 다른 단을 감지','낮은 발까지 다리 범위 확보','레이 목표가 단 사이를 왕복','정밀함을 보이는 곳에만 배분'][S.step];$('explain').innerHTML=desc[S.step];$('smooth').setAttribute('aria-pressed',String(S.smooth));$('budget').setAttribute('aria-pressed',String(S.budget));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.smooth=S.step===5;S.budget=S.step===5;ui()});$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=(+e.target.value).toFixed(1)+' m/s';ui()};$('crowd').oninput=e=>{S.crowd=+e.target.value;$('crowdOut').textContent=e.target.value+' 명';ui()};$('smooth').onclick=()=>{S.smooth=!S.smooth;ui()};$('budget').onclick=()=>{S.budget=!S.budget;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
