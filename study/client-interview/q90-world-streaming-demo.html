<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q90 오픈월드 스트리밍 실험실</title><style>
:root{--bg:#08100e;--panel:#111c19;--line:#344a43;--ink:#f4f8f6;--muted:#9fb1aa;--mint:#79dfad;--gold:#ffd06b;--red:#ff7c76;--blue:#75cfff}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#11201b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#050b09df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--mint)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:#07130e}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--mint);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--mint)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#849990;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="플레이어 앞의 월드 셀이 밉 스트리밍, 우선순위, 속도 프리페치, 메모리 퇴출과 디더 전환으로 준비되는 실험"></canvas><div class="hud"><span>Q90 · <b id="stage">보인 뒤에 로드</b></span><span id="status">이동 속도가 디스크 업로드보다 빨라 빈 셀이 눈앞에 도착</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>보이면 로드</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>밉 스트리밍</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>FIFO 대기열</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>우선순위</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>속도 프리페치</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>버짓·디더 전환</button></div><p id="explain" class="explain"></p>
<div class="controls"><div><div class="ct"><label for="speed">이동 속도</label><output id="speedOut">55 km/h</output></div><input id="speed" type="range" min="5" max="120" value="55"></div><div><div class="ct"><label for="band">스트리밍 대역폭</label><output id="bandOut">420 MB/s</output></div><input id="band" type="range" min="100" max="900" step="20" value="420"></div><div class="toggles"><button id="prefetch" aria-pressed="false">진행 방향 프리페치</button><button id="blend" aria-pressed="false">밉 디더 전환</button></div></div>
<div class="metrics"><div class="m"><small>전방 준비 거리</small><strong id="mAhead">0 m</strong></div><div class="m"><small>예상 팝인</small><strong id="mPop">7개</strong></div><div class="m"><small>VRAM / 예산</small><strong id="mMem">6.8 / 6GB</strong></div><div class="m"><small>긴급 / 프리페치 큐</small><strong id="mQueue">12 / 0</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:55,band:420,prefetch:false,blend:false};const names=['보인 뒤에 로드','거리별 텍스처 밉만 상주','우선순위 없는 스트리밍 큐','화면 크기·거리·시선으로 점수화','이동 벡터 앞쪽 셀을 여유 대역폭으로 준비','메모리 퇴출·히스테리시스·디더 폴백'];const stats=['이동 속도가 디스크 업로드보다 빨라 빈 셀이 눈앞에 도착','멀리서는 저밉이라도 보여 완전한 빈자리 제거','등 뒤 바위가 눈앞 벽보다 먼저 업로드됨','곧 크게 보일 에셋부터 대역폭을 차지','코너 너머 셀을 도착 전에 미리 준비','먼 셀을 내보내되 경계 스래싱과 갑작스런 팝을 방지'];const desc=['<b>보고 나서 읽으면 늦습니다:</b> 디스크→압축 해제→GPU 업로드 동안 플레이어가 먼저 도착해 나무와 건물이 뿅 나타납니다. 속도를 올려 팝인 수를 확인하세요.','<b>밉 폴백:</b> 텍스처 전체 대신 거리별 필요한 밉만 상주시킵니다. 빈 벽은 없어지지만 가까워질 때 뿌연 밉이 갑자기 선명해지는 전환은 남습니다.','<b>대역폭에도 줄이 있습니다:</b> FIFO는 등 뒤·화면 밖 요청까지 먼저 처리해 정작 눈앞 셀이 밀립니다. 대역폭을 낮추면 긴급 큐가 쌓이는 모습을 볼 수 있습니다.','<b>우선순위:</b> 화면 점유율, 거리, 시선 앞쪽, 히어로 여부로 점수를 매겨 긴급 요청부터 처리합니다. 같은 대역폭으로 팝인이 크게 줄어듭니다.','<b>프리페치는 남는 시간에:</b> 속도와 진행 방향으로 곧 지날 콘을 예측하되, 현재 보이는 요청 뒤의 여유 대역폭만 씁니다. 버튼을 꺼 준비 거리 차이를 비교하세요.','<b>예측 실패도 감춥니다:</b> VRAM이 차면 멀고 보이지 않는 셀을 퇴출하고 히스테리시스로 재입장 스래싱을 막습니다. 저밉 프록시를 디더로 섞어 급회전도 스며들게 합니다.'];
function calc(){let capability=S.band/Math.max(10,S.speed),ahead=0,pop=Math.max(0,Math.round(S.speed/11-capability*.35)),urgent=Math.round(5+S.speed/9),pre=0,mem=6.8;if(S.step>=1){pop=Math.max(0,pop-1);mem=5.4}if(S.step===2){pop+=2;urgent+=7}if(S.step>=3){pop=Math.max(0,pop-2);urgent=Math.round(urgent*.62)}if(S.step>=4&&S.prefetch){ahead=Math.round(capability*42);pop=Math.max(0,pop-Math.floor(ahead/100));pre=Math.round(ahead/55)}if(S.step>=5){mem=5.8;pop=Math.max(0,pop-(S.blend?2:0))}return{ahead,pop,urgent,pre,mem}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc();let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#19342e');sky.addColorStop(1,'#0d1814');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#465f42';x.beginPath();x.moveTo(0,h);x.lineTo(w*.44,h*.39);x.lineTo(w*.56,h*.39);x.lineTo(w,h);x.fill();for(let i=0;i<11;i++){let depth=i/10,py=h*(.42+depth*.5),spread=w*(.09+depth*.82),size=9+depth*42,ready=i>V.pop||S.step>=4,low=S.step>=1&&i<4;x.globalAlpha=!ready&&S.step===0?.12:S.blend&&S.step>=5&&!ready?.45:1;x.fillStyle=!ready?'#ff7c76':low?'#708e7f':'#79dfad';for(let side of[-1,1]){let px=w*.5+side*spread*.52;x.fillRect(px-size*.08,py-size*.35,size*.16,size*.35);x.beginPath();x.arc(px,py-size*.5,size*(low?.22:.32),0,Math.PI*2);x.fill()}x.globalAlpha=1;x.fillStyle=ready?'#75cfff':'#ff7c76';x.fillRect(w*.5-2,py,4,4)}if(S.step>=4&&S.prefetch){x.strokeStyle='#ffd06b';x.setLineDash([7,5]);x.beginPath();x.moveTo(w*.5,h*.86);x.lineTo(w*.5,h*.39);x.stroke();x.setLineDash([]);x.fillStyle='#ffd06b';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`PREFETCH ${V.ahead}m`,w*.52,h*.52)}x.fillStyle='#f4f8f6';x.fillText('● PLAYER',w*.46,h*.94);$('mAhead').textContent=V.ahead+' m';$('mPop').textContent=V.pop+'개';$('mMem').textContent=V.mem.toFixed(1)+' / 6GB';$('mQueue').textContent=V.urgent+' / '+V.pre;c.dataset.ahead=V.ahead;c.dataset.pop=V.pop;c.dataset.mem=V.mem.toFixed(1);c.dataset.queue=V.urgent+','+V.pre}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('prefetch').setAttribute('aria-pressed',String(S.prefetch));$('blend').setAttribute('aria-pressed',String(S.blend));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.prefetch=S.step>=4;S.blend=S.step>=5;update()});$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=e.target.value+' km/h';draw()};$('band').oninput=e=>{S.band=+e.target.value;$('bandOut').textContent=e.target.value+' MB/s';draw()};$('prefetch').onclick=()=>{S.prefetch=!S.prefetch;update()};$('blend').onclick=()=>{S.blend=!S.blend;update()};update();addEventListener('resize',draw)})();
</script></body></html>
