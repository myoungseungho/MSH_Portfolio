<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q94 안티에일리어싱 실험실</title><style>
:root{--bg:#090d14;--panel:#121a26;--line:#35445a;--ink:#f5f7fb;--muted:#9caabc;--cyan:#70d5ff;--gold:#ffd16d;--red:#ff7d77;--green:#7fe0a5}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#111a28}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#060910df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8292a5;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="사선과 전선이 SSAA, MSAA, TAA, TSR을 거치며 계단과 시간적 반짝임이 줄어드는 실험"></canvas><div class="hud"><span>Q94 · <b id="stage">한 픽셀 한 샘플</b></span><span id="status">사선과 서브픽셀 전선이 프레임마다 다른 계단으로 양자화</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>에일리어싱</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>4× SSAA</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>4× MSAA</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>TAA 지터</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>TSR 재구성</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>클램프·샤픈</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="motion">카메라 이동</label><output id="motionOut">35%</output></div><input id="motion" type="range" min="0" max="100" value="35"></div><div><div class="ct"><label for="scale">내부 렌더 스케일</label><output id="scaleOut">67%</output></div><input id="scale" type="range" min="50" max="100" value="67"></div><div class="toggles"><button id="clamp" aria-pressed="false">히스토리 클램프</button><button id="sharpen" aria-pressed="false">재구성 샤픈</button></div></div>
<div class="metrics"><div class="m"><small>유효 서브샘플</small><strong id="mSamples">1</strong></div><div class="m"><small>엣지 계단</small><strong id="mEdge">82%</strong></div><div class="m"><small>시간적 반짝임</small><strong id="mShimmer">74%</strong></div><div class="m"><small>상대 픽셀 비용</small><strong id="mCost">1.0×</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,motion:.35,scale:.67,clamp:false,sharpen:false};const names=['한 픽셀 한 샘플','가로·세로 2배로 렌더 후 축소','기하 경계에서만 커버리지 4샘플','서브픽셀 지터를 시간축으로 누적','저해상도 지터 샘플을 출력 해상도로 재구성','움직임 히스토리 거부 + 고주파 디테일 복원'];const stats=['사선과 서브픽셀 전선이 프레임마다 다른 계단으로 양자화','기준 화질은 완벽하지만 픽셀 셰이딩 비용 4배','실루엣은 매끈하나 스페큘러·텍스처 지글은 남음','기하·셰이더·텍스처 에일리어싱을 함께 안정화','AA와 업스케일을 한 패스에서 수행해 성능 확보','잔상과 흐림을 서로 다른 장치로 줄임'];const desc=['<b>샘플이 부족한 신호:</b> 한 픽셀보다 촘촘한 사선·전선은 있다/없다로 양자화되어 계단과 크롤링이 생깁니다. 카메라를 움직여 시간적 흔들림을 보세요.','<b>SSAA 기준점:</b> 가로·세로 두 배로 그려 네 샘플을 평균하면 모든 종류의 계단이 사라지지만 픽셀 비용도 정확히 네 배입니다.','<b>MSAA:</b> 기하 경계에서만 여러 커버리지를 계산해 SSAA보다 싸게 실루엣을 다듬습니다. 하지만 디퍼드 G버퍼 비용과 셰이더 반짝임은 남습니다.','<b>TAA:</b> 프레임마다 카메라를 서브픽셀로 지터하고 모션 벡터로 이전 샘플을 재투영해 시간축 SSAA를 만듭니다. 움직이면 오래된 히스토리가 잔상이 됩니다.','<b>TSR/DLSS류:</b> 낮은 내부 해상도의 서로 다른 지터 샘플을 출력 픽셀에 합쳐 AA와 업스케일을 동시에 해결합니다. 렌더 스케일을 낮춰 비용과 선명도를 비교하세요.','<b>흐림과 잔상을 분리:</b> 클램프는 잘못된 히스토리를 거부해 잔상을 줄이고, 샤픈은 누적이 깎은 고주파 디테일을 복원합니다. 두 버튼의 역할을 따로 확인하세요.'];
function calc(){let samples=[1,4,4,8,8,8][S.step],edge=[82,4,12,8,10,7][S.step],shim=[74,3,48,10,14,9][S.step],cost=[1,4,1.55,1.18,S.scale*S.scale*1.25,S.scale*S.scale*1.32][S.step];if(S.step>=3)shim+=Math.round(S.motion*26);if(S.step>=5&&S.clamp)shim=Math.round(shim*.42);if(S.step>=4&&S.sharpen)edge=Math.round(edge*.68);return{samples,edge,shim,cost}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc();x.fillStyle='#111a28';x.fillRect(0,0,w,h);let pix=S.step===0?14:S.step===2?6:S.step>=4?Math.max(2,Math.round((1-S.scale)*12)):2;x.strokeStyle='#25354a';for(let gx=0;gx<w;gx+=pix){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,h);x.stroke()}for(let gy=0;gy<h;gy+=pix){x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy);x.stroke()}x.save();if(S.step===0){x.imageSmoothingEnabled=false;x.translate(Math.round(S.motion*13),0)}x.strokeStyle='#f5f7fb';x.lineWidth=S.step===0?12:7;x.beginPath();x.moveTo(w*.08,h*.78);x.lineTo(w*.76,h*.17);x.stroke();x.strokeStyle='#70d5ff';x.lineWidth=S.step===0?5:2;x.beginPath();x.moveTo(w*.12,h*.28);x.lineTo(w*.92,h*.46);x.stroke();x.restore();if(S.step>=3){for(let i=0;i<8;i++){x.fillStyle=i%2?'#ffd16d':'#70d5ff';x.globalAlpha=.55;x.fillRect(w*.06+i*13,h*.88+(i%2)*4,5,5)}x.globalAlpha=1;x.fillStyle='#f5f7fb';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText('JITTER: 8-PHASE HALTON',w*.18,h*.92)}if(S.step>=4){x.fillStyle='#10141bdc';x.fillRect(w*.74,h*.69,w*.22,h*.19);x.fillStyle='#f5f7fb';x.fillText(`INPUT ${Math.round(S.scale*100)}% → OUTPUT 100%`,w*.765,h*.77);x.fillText(S.sharpen?'DETAIL RECONSTRUCTED':'SOFT HISTORY',w*.765,h*.82)}$('mSamples').textContent=V.samples;$('mEdge').textContent=V.edge+'%';$('mShimmer').textContent=V.shim+'%';$('mCost').textContent=V.cost.toFixed(2)+'×';c.dataset.samples=V.samples;c.dataset.edge=V.edge;c.dataset.shimmer=V.shim;c.dataset.cost=V.cost.toFixed(2)}
const smoothDraw=draw;draw=()=>{smoothDraw();if(S.step===0){const w=c.clientWidth,h=c.clientHeight;x.strokeStyle='#111a28';x.lineWidth=20;x.beginPath();x.moveTo(w*.08,h*.78);x.lineTo(w*.76,h*.17);x.stroke();x.fillStyle='#f5f7fb';const n=32,x0=w*.08,y0=h*.78,x1=w*.76,y1=h*.17;for(let i=0;i<n;i++){let ax=x0+(x1-x0)*i/n,ay=y0+(y1-y0)*i/n,bx=x0+(x1-x0)*(i+1)/n,by=y0+(y1-y0)*(i+1)/n;x.fillRect(Math.round(ax/7)*7,Math.round(Math.min(ay,by)/7)*7,Math.ceil(bx-ax)+8,14)}}};
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('clamp').setAttribute('aria-pressed',String(S.clamp));$('sharpen').setAttribute('aria-pressed',String(S.sharpen));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.clamp=S.step>=5;S.sharpen=S.step>=5;update()});$('motion').oninput=e=>{S.motion=+e.target.value/100;$('motionOut').textContent=e.target.value+'%';draw()};$('scale').oninput=e=>{S.scale=+e.target.value/100;$('scaleOut').textContent=e.target.value+'%';draw()};$('clamp').onclick=()=>{S.clamp=!S.clamp;update()};$('sharpen').onclick=()=>{S.sharpen=!S.sharpen;update()};update();addEventListener('resize',draw)})();
</script></body></html>
