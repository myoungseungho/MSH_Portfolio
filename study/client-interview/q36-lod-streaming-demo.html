<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q36 LOD·HLOD 스트리밍 단계형 실험실</title>
<style>
:root{--bg:#090d12;--panel:#141b23;--line:#354451;--ink:#f4f8fb;--muted:#9cabb6;--lod:#86c8ff;--stream:#91e2b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#203342}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#090d12dd}.hud b{color:var(--lod)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#607482}button:focus-visible,input:focus-visible{outline:2px solid var(--lod);outline-offset:2px}button[aria-pressed=true]{background:var(--lod);border-color:var(--lod);color:#07131c}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--lod);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--lod)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#7a8d99;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="항상 하이폴리에서 화면 커버리지 LOD, 전환 페이드, HLOD·임포스터와 이동 예측 스트리밍까지 쌓는 원경 성"></canvas><div class="hud"><span>Q36 · <b id="stage">항상 LOD0 하이폴리</b></span><span id="status">서브픽셀 삼각형 낭비</span></div></div>
<div class="steps" role="group" aria-label="LOD 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>항상 최고 디테일</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>화면 커버리지 LOD</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>하드 전환 팝핑</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>디더·히스테리시스</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>HLOD·임포스터</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>프리페치·클러스터</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">성까지 거리</label><output id="distanceOut">650 m</output></div><input id="distance" type="range" min="50" max="1500" value="650"></div><div><div class="ct"><label for="travel">접근 속도</label><output id="travelOut">70 km/h</output></div><input id="travel" type="range" min="0" max="160" value="70"></div><div class="toggles" role="group" aria-label="전환 페이드와 이동 예측 프리페치"><button id="fade" aria-pressed="false">전환 페이드</button><button id="prefetch" aria-pressed="false">이동 예측 프리페치</button></div></div>
<div class="metrics"><div class="m"><small>선택 상세도</small><strong id="mLod">LOD0</strong></div><div class="m"><small>화면 높이</small><strong id="mCoverage">8%</strong></div><div class="m"><small>삼각형</small><strong id="mTriangles">2.4M</strong></div><div class="m"><small>마을 드로우콜</small><strong id="mDraws">52</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,distance:650,travel:70,fade:false,prefetch:false},names=['always LOD0 high-poly','screen coverage LOD chain','instant threshold swap','dither fade + hysteresis','merged HLOD + impostor','velocity prefetch + cluster SSE'],desc=['<b>문제 재현:</b> 지평선에서 수십 픽셀인 성에도 240만 삼각형과 집 52개 드로우콜을 그대로 쓰면 서브픽셀 셰이딩·CPU 제출 비용만 낭비합니다.','<b>픽셀 수에 맞춘 디테일:</b> 거리 자체가 아니라 화면 커버리지로 LOD3→2→1→0을 선택합니다. 같은 성도 화면에서 커질 때만 창문·돌결·깃발을 추가합니다.','<b>임계값 교체의 실패:</b> LOD 경계를 넘는 순간 실루엣과 창문이 한 프레임에 툭 바뀝니다. 슬라이더를 360m 부근에서 왕복해 팝핑을 확인하세요.','<b>전환을 시간에 숨김:</b> 두 LOD를 짧게 디더 크로스페이드하고 히스테리시스로 경계 왕복을 막습니다. TAA가 약한 기기는 짧은 알파 페이드 또는 먼 하드 전환을 씁니다.','<b>원경 군집을 한 덩어리로:</b> 마을 50채를 병합 메시+아틀라스 HLOD 한 번으로 그리고 성은 원경 임포스터를 거쳐 실제 메시 체인으로 승격합니다.','<b>도착 전에 준비:</b> 이동 방향·속도로 곧 필요한 LOD를 예측 요청하고, 프록시는 고LOD 준비 완료까지 유지합니다. 최신 경로는 픽셀 오차로 클러스터를 연속 선택합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function coverage(){return Math.min(90,5200/S.distance)}function lod(){if(S.step===0)return 0;const cv=coverage();return cv>24?0:cv>12?1:cv>5?2:3}function tag(t,px,py,co='#f4f8fb'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,10,14,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function castle(cx,base,size,L,alpha=1){x.save();x.globalAlpha=alpha;x.fillStyle='#8e887f';x.fillRect(cx-size*.45,base-size*.70,size*.9,size*.70);for(let side of [-1,1]){x.fillRect(cx+side*size*.38-size*.14,base-size*.92,size*.28,size*.92);x.beginPath();x.moveTo(cx+side*size*.38-size*.18,base-size*.92);x.lineTo(cx+side*size*.38,base-size*1.12);x.lineTo(cx+side*size*.38+size*.18,base-size*.92);x.fill()}if(L<=2){x.fillStyle='#252c34';for(let i=0;i<5;i++)for(let j=0;j<2;j++)x.fillRect(cx-size*.32+i*size*.16,base-size*(.22+j*.25),size*.06,size*.10)}if(L<=1){x.strokeStyle='#5e5a56';x.lineWidth=1;for(let y=base-size*.65;y<base;y+=Math.max(4,size*.09)){x.beginPath();x.moveTo(cx-size*.45,y);x.lineTo(cx+size*.45,y);x.stroke()}for(let i=0;i<14;i++){let px=cx-size*.45+i*size*.07;x.beginPath();x.moveTo(px,base-size*.70);x.lineTo(px,base);x.stroke()}}if(L===0){x.fillStyle='#c34d46';x.fillRect(cx-size*.03,base-size*1.12,size*.02,-size*.35);x.beginPath();x.moveTo(cx,base-size*1.45);x.lineTo(cx+size*.30,base-size*1.34);x.lineTo(cx,base-size*1.25);x.fill()}x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cv=coverage(),L=lod(),size=Math.max(52,Math.min(h*.44,w*cv/100)),cx=w*.57,base=h*.70,doFade=S.fade&&S.step>=3,hlod=S.step>=4;x.fillStyle='#7398aa';x.fillRect(0,0,w,h);x.fillStyle='#658259';x.beginPath();x.moveTo(0,h*.66);for(let i=0;i<=16;i++)x.lineTo(i*w/16,h*(.54+.08*Math.sin(i*.7)));x.lineTo(w,h);x.lineTo(0,h);x.fill();if(hlod){for(let i=0;i<10;i++){let px=w*(.10+i*.07),py=h*(.66+(i%3)*.025);x.fillStyle='#8a7768';x.fillRect(px,py,20,15);x.fillStyle='#543f36';x.beginPath();x.moveTo(px-3,py);x.lineTo(px+10,py-10);x.lineTo(px+23,py);x.fill()}tag('50 HOUSES → 1 HLOD DRAW',w*.08,h*.79,'#91e2b4')}if(doFade){castle(cx,base,size,Math.min(3,L+1),.35);castle(cx,base,size,L,.75);for(let y=0;y<h;y+=7)for(let xx=(y/7)%2?0:4;xx<w;xx+=8){x.fillStyle='rgba(10,14,18,.10)';x.fillRect(xx,y,3,3)}}else castle(cx,base,size,L);if(S.step===0)tag('2.4M TRIANGLES AT EVERY DISTANCE',w*.42,h*.17,'#ff8179');if(S.step>=1)tag(`SCREEN COVERAGE ${cv.toFixed(1)}% → LOD${L}`,w*.39,h*.16,'#86c8ff');if(S.step===2){x.strokeStyle='#ff8179';x.lineWidth=3;x.strokeRect(cx-size*.55,base-size*1.2,size*1.1,size*1.25);tag('INSTANT SWAP · POP RISK',w*.64,h*.48,'#ff8179')}if(doFade)tag('DITHER CROSSFADE + HYSTERESIS',w*.60,h*.46,'#f4f8fb');if(hlod&&L===3)tag('CASTLE IMPOSTOR',cx-size*.3,base-size*1.25,'#91e2b4');if(S.step>=5){const lead=Math.round(S.travel*.8);x.strokeStyle=S.prefetch?'#91e2b4':'#ff8179';x.setLineDash([5,4]);x.beginPath();x.arc(cx,base-size*.55,size*.72,0,7);x.stroke();x.setLineDash([]);tag(S.prefetch?`PREFETCH LEAD ${lead}m · PROXY HELD`:'HIGH LOD NOT REQUESTED',w*.40,h*.86,S.prefetch?'#91e2b4':'#ff8179');tag('CLUSTER SSE → CONTINUOUS DETAIL',w*.39,h*.10,'#86c8ff')}}
function metrics(){const L=lod(),cv=coverage(),tris=S.step===0?2400000:[2400000,620000,120000,12000][L],draw=S.step>=4?1:52;$('mLod').textContent=L===3&&S.step>=4?'IMPOSTOR':`LOD${L}`;$('mCoverage').textContent=cv.toFixed(1)+'%';$('mTriangles').textContent=tris>=1000000?(tris/1000000).toFixed(1)+'M':Math.round(tris/1000)+'K';$('mDraws').textContent=draw+(S.step>=4?' HLOD':'')}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['서브픽셀 삼각형 낭비','픽셀 크기별 선택','경계에서 실루엣 팝','눈에 안 띄는 승격','군집 52→1 draw','도착 전 상세도 준비'][S.step];$('explain').innerHTML=desc[S.step];$('fade').setAttribute('aria-pressed',String(S.fade));$('prefetch').setAttribute('aria-pressed',String(S.prefetch));metrics();draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.fade=S.step>=3;S.prefetch=S.step===5;ui()});$('distance').oninput=e=>{S.distance=+e.target.value;$('distanceOut').textContent=e.target.value+' m';ui()};$('travel').oninput=e=>{S.travel=+e.target.value;$('travelOut').textContent=e.target.value+' km/h';ui()};$('fade').onclick=()=>{S.fade=!S.fade;ui()};$('prefetch').onclick=()=>{S.prefetch=!S.prefetch;ui()};ui();addEventListener('resize',draw)})();
</script></body></html>
