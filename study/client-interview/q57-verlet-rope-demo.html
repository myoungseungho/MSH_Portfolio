<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q57 버레이 밧줄 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="고정 흔들림 애니메이션에서 버레이 파티클, 거리 제약 반복, XPBD 신장 클램프, 하중 양방향 결합, 충돌 서브스텝과 선택적 CCD LOD로 발전하는 밧줄"></canvas><div class="hud"><span>Q57 · <b id="stage">고정 흔들림 루프</b></span><span id="status">하중을 바꿔도 같은 궤적만 반복</span></div></div>
<div class="steps" role="group" aria-label="밧줄 시뮬레이션 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>애님 루프</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>버레이 관성</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>거리 제약</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>XPBD·클램프</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>하중·충돌</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>CCD·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="load">매달린 하중</label><output id="loadOut">72 kg</output></div><input id="load" type="range" min="0" max="120" value="72"></div><div><div class="ct"><label for="iterations">제약 반복</label><output id="iterationsOut">8회</output></div><input id="iterations" type="range" min="1" max="20" value="8"></div><div class="toggles" role="group" aria-label="XPBD 롱레인지와 충돌 CCD LOD 설정"><button id="xpbd" aria-pressed="false">XPBD+롱레인지</button><button id="collision" aria-pressed="false">충돌+CCD·LOD</button></div></div>
<div class="metrics"><div class="m"><small>최대 세그먼트 신장</small><strong id="mStretch">측정 안 함</strong></div><div class="m"><small>중앙 처짐</small><strong id="mSag">34 cm</strong></div><div class="m"><small>스텝당 제약 연산</small><strong id="mOps">0</strong></div><div class="m"><small>빠른 검 vs 밧줄</small><strong id="mSword">반응 없음</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,load:72,iterations:8,xpbd:false,collision:false,t:0};
const names=['고정 흔들림 루프','이전 위치로 관성을 얻는 파티클','인접 점의 원래 길이를 반복 복원','컴플라이언스·신장 한계·롱레인지','캐릭터 하중과 밧줄이 힘을 주고받음','중요 충돌만 CCD, 먼 밧줄은 LOD'],status=['하중을 바꿔도 같은 궤적만 반복','힘 폭주 없이 매번 다른 흔들림','반복할수록 고무줄 신장이 줄어듦','적은 반복에도 길이 상한을 보장','무게가 밧줄을 처지게 하고 밧줄이 몸을 당김','검은 스윕, 장식 사슬은 낮은 해상도로'];
const desc=['<b>실패 재현:</b> 본 흔들림 루프는 매달린 무게·바람·접촉을 전혀 읽지 못합니다. 하중 슬라이더를 바꿔도 같은 사인 곡선만 반복됩니다.','<b>관성 만들기:</b> 각 점은 현재 위치와 직전 위치의 차이로 속도를 암묵적으로 얻습니다. 외력과 충돌마다 궤적이 달라지지만 길이를 지키는 규칙은 아직 없습니다.','<b>고무줄 잡기:</b> 인접 점의 거리를 rest length로 되돌리는 투영을 반복합니다. 반복 수를 올릴수록 신장은 줄지만 연산량은 점×반복으로 늘어납니다.','<b>반복과 강성 분리:</b> XPBD 컴플라이언스, 3% 신장 클램프, 끝-끝 롱레인지 제약이 적은 반복에도 길이 상한을 보장합니다. 토글로 비교하세요.','<b>게임플레이 결합:</b> 중앙 점에 캐릭터 질량을 붙여 하중이 처짐을 만들고, 밧줄 장력이 캐릭터를 되당깁니다. 몸·바닥 캡슐 충돌은 고정 서브스텝에서 풉니다.','<b>보이는 만큼 정확하게:</b> 빠른 검에만 캡슐 스윕 CCD를 켜 터널링을 막고, 먼 장식 밧줄은 점 수·업데이트율을 줄여 비용을 제한합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const constrained=S.step>=2,xpbd=S.step>=3&&S.xpbd,collision=S.step>=4&&S.collision,lod=S.step>=5&&S.collision,points=lod?8:16,stretch=S.step<1?null:S.step===1?28+S.load*.20:xpbd?Math.min(3,16/S.iterations):Math.max(2,34/S.iterations+S.load*.06),sag=S.step===0?34:(32+S.load*.72)*(1+(stretch||0)/100),ops=constrained?(points-1)*S.iterations*(collision?3:1):0,sword=S.step<5?'미검사':collision?'CCD 접촉':'터널링';return{constrained,xpbd,collision,lod,points,stretch,sag,ops,sword}}
function solver(w,h,v){const ox=w*.035,oy=h*.18,gw=w*.31,gh=h*.68,narrow=w<900;label('ONE PHYSICS STEP',ox,oy-16,'#72c9ff');const rows=[['ANIM LOOP',S.step===0?'PLAY CLIP':'REMOVED'],['INTEGRATE',S.step>=1?'pos+(pos-prev)+gΔt²':'NONE'],['DISTANCE',S.step>=2?'PROJECT × '+S.iterations:'NONE'],['STIFFNESS',v.xpbd?'XPBD + 3% CLAMP':'ITERATION-BOUND'],['COLLISION',v.collision?'CAPSULE + SUBSTEPS':'DISCRETE / OFF'],['LOD',v.lod?'8 POINTS · 1/2 RATE':'16 POINTS · FULL RATE']];rows.forEach((r,i)=>{const y=oy+i*gh*.14;label(r[0],ox,y+11,'#97aab8');line(ox+gw*.31,y+5,ox+gw*.48,y+5,'#526b79');let text=narrow?r[1].replace('pos+(pos-prev)+gΔt²','VERLET ΔPOS').replace('ITERATION-BOUND','ITERATION ONLY'):r[1];label(text,ox+gw*.52,y+11,i<=S.step?'#8ce4b4':'#758b9b')});if(S.step>=2){for(let i=0;i<S.iterations;i++){x.fillStyle=i<12?'#8ce4b4':'#ffd17f';x.fillRect(ox+i*(gw*.80/20),oy+gh*.91,gw*.031,5)}label(`${v.ops} CONSTRAINT OPS / STEP`,ox+gw*.42,oy+gh*.99,'#ffd17f','center')}}
function rope(w,h,v){const x0=w*.43,x1=w*.95,y0=h*.24,span=x1-x0,n=v.points,loadFactor=S.step===0?0:S.load/120,osc=Math.sin(S.t*.045),sagPx=h*(v.sag/300),pts=[];label('RUNTIME PARTICLE CHAIN',x0,h*.15,'#72c9ff');for(let i=0;i<n;i++){const u=i/(n-1),curve=4*u*(1-u),wind=S.step>=1?Math.sin(S.t*.035+i*.45)*14*curve:Math.sin(S.t*.055)*12*curve;let px=x0+span*u+wind,py=y0+curve*sagPx+(S.step===0?osc*18*curve:0);if(v.collision&&py>h*.62&&Math.abs(px-w*.69)<70){px=w*.69+(px<w*.69?-72:72)}pts.push({x:px,y:py})}for(let i=1;i<n;i++)line(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y,v.xpbd?'#8ce4b4':'#72c9ff',4);pts.forEach((p,i)=>{x.fillStyle=i===0||i===n-1?'#ffd17f':v.xpbd?'#8ce4b4':'#72c9ff';x.beginPath();x.arc(p.x,p.y,i===0||i===n-1?7:4,0,7);x.fill()});
const mid=pts[Math.floor(n/2)];if(S.step>=4){x.fillStyle='#f2f8fc';x.beginPath();x.arc(mid.x,mid.y+35,14,0,7);x.fill();line(mid.x,mid.y,mid.x,mid.y+78,'#f2f8fc',10);line(mid.x,mid.y+44,mid.x-25,mid.y+68,'#f2f8fc',8);line(mid.x,mid.y+44,mid.x+25,mid.y+68,'#f2f8fc',8);label(`${S.load} kg ↕ TWO-WAY COUPLING`,mid.x,mid.y+105,'#ffd17f','center');x.globalAlpha=.28;x.fillStyle=v.collision?'#8ce4b4':'#ff8179';x.beginPath();x.arc(w*.69,h*.62,70,0,7);x.fill();x.globalAlpha=1}
if(S.step>=2){label(v.xpbd?'XPBD · STRETCH CLAMPED ≤ 3%':`DISTANCE PROJECT × ${S.iterations}`,w*.69,h*.31,v.xpbd?'#8ce4b4':'#ffd17f','center')}if(S.step>=5){const sy=h*.69,sx=w*.50+((S.t%90)/90)*w*.38;line(sx-55,sy-30,sx+55,sy+30,'#ff8179',9);line(w*.50,sy,w*.88,sy,v.collision?'#8ce4b4':'#ff8179',2,[6,4]);label(v.collision?'SWORD CAPSULE SWEEP → CCD HIT':'DISCRETE SWORD → MISSED BETWEEN TICKS',w*.69,h*.78,v.collision?'#8ce4b4':'#ff8179','center');label(v.lod?'DISTANT ROPE LOD · 8 POINTS':'HERO ROPE · 16 POINTS',w*.69,h*.84,v.lod?'#8ce4b4':'#ffd17f','center')}
}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);solver(w,h,v);rope(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('xpbd').setAttribute('aria-pressed',String(S.xpbd));$('collision').setAttribute('aria-pressed',String(S.collision));const v=vals();$('mStretch').textContent=v.stretch==null?'측정 안 함':v.stretch.toFixed(1)+'%';$('mSag').textContent=v.sag.toFixed(0)+' cm';$('mOps').textContent=String(v.ops);$('mSword').textContent=v.sword;draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.xpbd=S.step>=3;S.collision=S.step>=4;S.t=0;update()});$('load').oninput=e=>{S.load=+e.target.value;$('loadOut').textContent=S.load+' kg';update()};$('iterations').oninput=e=>{S.iterations=+e.target.value;$('iterationsOut').textContent=S.iterations+'회';update()};$('xpbd').onclick=()=>{S.xpbd=!S.xpbd;update()};$('collision').onclick=()=>{S.collision=!S.collision;S.t=0;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
