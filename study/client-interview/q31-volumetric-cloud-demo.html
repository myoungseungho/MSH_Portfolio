<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q31 볼류메트릭 클라우드 단계형 실험실</title>
<style>
:root{--bg:#07111a;--panel:#101f2b;--line:#294656;--ink:#f2f9ff;--muted:#94abba;--sky:#6ec8ff;--sun:#ffe8a3;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#3c8ec0}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07111add}.hud b{color:var(--sky)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#52768a}button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}button[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#06151f}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--sky);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--sky)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#728c9c;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="스카이돔 패닝에서 3D 밀도 레이마칭, Beer·HG 라이팅, 템포럴 최적화와 땅 그림자까지 쌓는 구름"></canvas><div class="hud"><span>Q31 · <b id="stage">스카이돔 텍스처 패닝</b></span><span id="status">벽지 같은 2D 구름</span></div></div>
<div class="steps" role="group" aria-label="볼류메트릭 클라우드 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>2D 스카이돔</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>3D 밀도 셸</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>비용·평면광 실패</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>Beer·HG·powder</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>반해상도·템포럴</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>땅 그림자·날씨</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="coverage">구름 커버리지</label><output id="coverageOut">58%</output></div><input id="coverage" type="range" min="0" max="100" value="58"></div><div><div class="ct"><label for="windSpeed">바람 속도</label><output id="windSpeedOut">45%</output></div><input id="windSpeed" type="range" min="0" max="100" value="45"></div><div class="toggles" role="group" aria-label="구름 라이팅과 그림자 옵션"><button id="lighting" aria-pressed="false">구름 셀프섀도우</button><button id="shadow" aria-pressed="false">지상 그림자</button></div></div>
<div class="metrics"><div class="m"><small>시선 레이 스텝</small><strong id="mSteps">1</strong></div><div class="m"><small>태양 투과율</small><strong id="mTrans">100%</strong></div><div class="m"><small>새 픽셀 갱신</small><strong id="mUpdate">100%</strong></div><div class="m"><small>지상 직사광</small><strong id="mGround">100%</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,coverage:.58,wind:.45,lighting:false,shadow:false,t:0},names=['panning sky-dome texture','Perlin–Worley density shell','full-res flat lighting','Beer + HG + powder','half-res temporal reprojection','shared wind cloud-shadow map'],desc=['<b>문제 재현:</b> 하늘 돔에 2D 텍스처를 패닝하면 싸지만 두께·시차가 없고 태양이 구름 속으로 들어가거나 땅에 그림자를 드리울 수 없습니다.','<b>밀도를 걸어 적분:</b> 대기 셸 안을 시선 레이로 걷고 coverage×height gradient×3D noise를 적분합니다. 구름 덩어리마다 앞·뒤 깊이가 생깁니다.','<b>첫 볼륨의 실패:</b> 풀해상도 96스텝은 비싸고, 밀도만 밝게 칠하면 내부 감쇠가 없어 솜뭉치처럼 평평합니다.','<b>구름 속 빛:</b> 태양 방향 Beer 감쇠가 어두운 밑면을, HG 전방 산란이 은빛 테두리를, powder 항이 가장자리 결을 만듭니다.','<b>시간으로 비용 분산:</b> 반해상도에서 매 프레임 1/4 픽셀만 새로 마칭하고 과거를 재투영합니다. 빈 공간은 큰 스텝으로 건너뜁니다.','<b>같은 바람을 땅에 투영:</b> 구름 커버리지를 태양 방향 shadow map으로 만들고 같은 윈드 벡터로 이동해 구름과 그림자가 함께 들판을 훑습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f9ff'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,14,21,.84)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function blob(cx,cy,r,flat,lit){const g=x.createRadialGradient(cx-r*.25,cy-r*.28,r*.08,cx,cy,r);if(lit){g.addColorStop(0,'rgba(255,252,226,.98)');g.addColorStop(.55,'rgba(218,230,229,.96)');g.addColorStop(1,'rgba(93,117,129,.25)')}else{g.addColorStop(0,'rgba(232,238,238,.94)');g.addColorStop(1,'rgba(202,211,214,.82)')}x.fillStyle=g;x.beginPath();x.ellipse(cx,cy,r,flat?r*.36:r*.64,0,0,7);x.fill()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,volume=S.step>=1,flat=S.step===2,lit=S.lighting&&S.step>=3,opt=S.step>=4,ground=S.shadow&&S.step>=5,off=(S.t*S.wind*1.4)%(w+280);let sky=x.createLinearGradient(0,0,0,h*.65);sky.addColorStop(0,'#328fc7');sky.addColorStop(1,'#a4d9ee');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#ffe9a0';x.beginPath();x.arc(w*.72,h*.18,20,0,7);x.fill();const n=Math.round(3+S.coverage*7);for(let i=0;i<n;i++){let cx=(i*181+off)%(w+260)-130,cy=h*(.18+(i%3)*.08),r=volume?70+(i%4)*23:105;blob(cx,cy,r,!volume,lit);if(volume){blob(cx+r*.45,cy+10,r*.7,false,lit);blob(cx-r*.38,cy+15,r*.62,false,lit)}}x.fillStyle='#6f9a57';x.fillRect(0,h*.61,w,h*.39);for(let i=0;i<14;i++){x.fillStyle=i%2?'#5a8448':'#7aa45f';x.fillRect(i*w/14,h*.61,w/14,h*.39)}if(ground){for(let i=0;i<n;i++){let cx=((i*181+off)%(w+260)-130)-80,alpha=.12+S.coverage*.35;x.fillStyle=`rgba(24,48,40,${alpha})`;x.beginPath();x.ellipse(cx,h*.76,110+(i%3)*35,28,0,0,7);x.fill()}}if(S.step===0)tag('2D PAN · NO DEPTH / NO SHADOW',w*.06,h*.52,'#ff8179');if(volume)tag('DENSITY SHELL · DEPTH PARALLAX',w*.05,h*.52,'#6ec8ff');if(flat)tag('96 STEPS × FULL RES · FLAT LIGHT',w*.55,h*.49,'#ff8179');if(lit){tag('HG SILVER LINING',w*.67,h*.28,'#ffe8a3');tag('BEER ABSORPTION · DARK BASE',w*.48,h*.49,'#f2f9ff')}if(opt)tag('HALF RES · 1/4 TEMPORAL UPDATE',w*.06,h*.12,'#6ec8ff');if(ground)tag('SAME WIND → CLOUD SHADOW',w*.56,h*.89,'#f2f9ff')}
function metrics(){const lit=S.lighting&&S.step>=3,opt=S.step>=4,ground=S.shadow&&S.step>=5,trans=lit?Math.max(12,100-S.coverage*118):100,groundLight=ground?Math.max(18,100-S.coverage*82):100;$('mSteps').textContent=S.step===0?'1':S.step===2?'96':opt?'48 adaptive':'64';$('mTrans').textContent=Math.round(trans)+'%';$('mUpdate').textContent=opt?'25%':'100%';$('mGround').textContent=Math.round(groundLight)+'%'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['벽지 같은 2D 구름','통과 가능한 밀도','비용·라이팅 실패','은빛 테두리·암부','시간 분산 최적화','구름과 그림자 동기'][S.step];$('explain').innerHTML=desc[S.step];$('lighting').setAttribute('aria-pressed',String(S.lighting));$('shadow').setAttribute('aria-pressed',String(S.shadow));metrics();draw()}function tick(){S.t+=1;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.lighting=S.step>=3;S.shadow=S.step===5;ui()});$('coverage').oninput=e=>{S.coverage=+e.target.value/100;$('coverageOut').textContent=e.target.value+'%';ui()};$('windSpeed').oninput=e=>{S.wind=+e.target.value/100;$('windSpeedOut').textContent=e.target.value+'%';ui()};$('lighting').onclick=()=>{S.lighting=!S.lighting;ui()};$('shadow').onclick=()=>{S.shadow=!S.shadow;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
