<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q45 감속·거리 매칭 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.2;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:9px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:9px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="달리기 속도 곡선과 스탑 애니메이션 루트 변위가 거리 매칭으로 같은 정지 목표에 정렬되는 과정"></canvas><div class="hud"><span>Q45 · <b id="stage">속도 즉시 0</b></span><span id="status">관성과 포즈가 스냅</span></div></div>
<div class="steps" role="group" aria-label="자연스러운 정지 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>즉시 속도 0</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>스탑 애님</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>고정 거리 불일치</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>루트모션 동기화</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>거리 매칭</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>캔슬·물리 안전</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">진입 속도</label><output id="speedOut">7.0 m/s</output></div><input id="speed" type="range" min="1" max="12" step=".5" value="7"></div><div><div class="ct"><label for="decel">감속 강도</label><output id="decelOut">5.0 m/s²</output></div><input id="decel" type="range" min="2" max="14" step=".5" value="5"></div><div class="toggles" role="group" aria-label="재입력 캔슬 윈도우와 충돌·절벽 안전 검사"><button id="cancel" aria-pressed="false">재입력 캔슬 허용</button><button id="safety" aria-pressed="false">스윕·절벽 안전</button></div></div>
<div class="metrics"><div class="m"><small>필요 정지 거리</small><strong id="mDistance">4.90 m</strong></div><div class="m"><small>목표점 오차</small><strong id="mError">4.90 m</strong></div><div class="m"><small>접지 발 슬라이드</small><strong id="mSlide">88 cm</strong></div><div class="m"><small>재입력 반응 지연</small><strong id="mLatency">620 ms</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:7,decel:5,cancel:false,safety:false,t:0},names=['velocity snap to zero','dedicated stop animation blend','fixed authored stop distance','root motion drives capsule','distance-matched stop phase','cancel window + physical validation'],desc=['<b>문제 재현:</b> 입력을 놓는 프레임에 속도와 포즈를 바로 0으로 만들면 관성도 무게도 없이 몸이 꺾이고 발은 포즈 전환만큼 미끄러집니다.','<b>관성을 그리는 애님:</b> 앞으로 발을 내딛고 상체를 뒤로 흘리는 전용 스탑 포즈를 블렌드해 몸의 감속은 보이게 만듭니다.','<b>고정 에셋의 한계:</b> 애님은 1.8m 정지를 담았지만 실제 필요 거리는 진입 속도와 감속 강도마다 달라 목표를 지나치거나 못 미칩니다.','<b>발과 캡슐을 한 줄로:</b> 스탑 애님의 루트 변위로 캡슐도 함께 움직여 접지한 발이 같은 월드 위치에 남게 합니다.','<b>시간 대신 남은 거리:</b> 현재 속도에서 계산한 정지 거리와 일치하는 애님 지점부터 재생해 빠르든 느리든 목표선에서 섭니다.','<b>반응성과 안전:</b> 초반 재입력은 관성 블렌드로 달리기에 복귀하고, 루트 변위는 요청으로만 취급해 벽 스윕·절벽 레이가 최종 이동을 클램프합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function vals(){let dist=S.speed*S.speed/(2*S.decel),authored=1.8,error=S.step===0?dist:S.step<4?Math.abs(dist-authored):S.step>=4 ? .04 : .12,slide=S.step>=3?4:Math.round(25+S.speed*9),latency=S.step>=5&&S.cancel?55:620,safe=S.step>=5&&S.safety;return{dist,error,slide,latency,safe,authored}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.76,left=w*.10,right=w*.90,span=right-left,scale=span/Math.max(8,v.dist+2.5),start=left,target=Math.min(right,start+v.dist*scale),auth=Math.min(right,start+v.authored*scale);x.fillStyle='#142631';x.fillRect(0,0,w,h);x.strokeStyle='#526c7c';x.lineWidth=3;x.beginPath();x.moveTo(left,ground);x.lineTo(right,ground);x.stroke();const tickStep=scale<40?5:1;for(let m=0;m<=Math.ceil((right-left)/scale);m+=tickStep){let px=left+m*scale;x.strokeStyle='#314958';x.beginPath();x.moveTo(px,ground-9);x.lineTo(px,ground+9);x.stroke();tag(`${m}m`,px-7,ground+35,'#97aab8')}x.strokeStyle='#8ce4b4';x.lineWidth=3;x.beginPath();x.moveTo(target,ground-58);x.lineTo(target,ground+4);x.stroke();tag('PHYSICAL STOP TARGET',target-62,ground-128,'#8ce4b4');let phase=(Math.sin(S.t*.025)+1)/2,pos=S.step===0?start:S.step<4?start+(auth-start)*phase:target-(target-start)*(1-phase)*(1-phase);if(S.step>=5&&v.safe)pos=Math.min(pos,left+span*.64);function runner(px,lean,co){x.save();x.translate(px,ground-8);x.rotate(lean);x.strokeStyle=co;x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(0,-78);x.lineTo(0,-35);x.lineTo(-18,0);x.moveTo(0,-35);x.lineTo(24,-4);x.moveTo(0,-65);x.lineTo(28,-43);x.moveTo(0,-65);x.lineTo(-24,-48);x.stroke();x.fillStyle='#f2f8fc';x.beginPath();x.arc(0,-94,14,0,7);x.fill();x.restore()}runner(pos,S.step===0?.24:-.10*(1-phase),'#72c9ff');if(S.step===0){x.strokeStyle='#ff8179';x.lineWidth=6;x.beginPath();x.moveTo(start,ground-125);x.lineTo(start,ground-80);x.stroke();tag('VELOCITY 7 → 0 IN ONE FRAME',w*.31,h*.21,'#ff8179')}if(S.step>=1){for(let i=0;i<5;i++){let fp=start+(auth-start)*i/4;x.fillStyle=i%2?'#ffd17f':'#72c9ff';x.globalAlpha=.45+i*.12;x.fillRect(fp-10,ground-7,20,7)}x.globalAlpha=1;tag('AUTHORED STOP CLIP · 1.8 m',auth-65,ground-23,'#ffd17f')}if(S.step===2){x.strokeStyle='#ff8179';x.setLineDash([5,4]);x.beginPath();x.moveTo(auth,ground-45);x.lineTo(target,ground-45);x.stroke();x.setLineDash([]);tag(`DISTANCE MISMATCH ${v.error.toFixed(2)} m`,Math.min(auth,target)+12,ground-50,'#ff8179')}if(S.step>=3){x.strokeStyle='#72c9ff';x.lineWidth=4;x.beginPath();x.moveTo(start,h*.28);x.bezierCurveTo(w*.35,h*.28,w*.55,h*.54,pos,h*.63);x.stroke();tag('ROOT DELTA = CAPSULE DELTA',w*.25,h*.25,'#72c9ff');tag('PLANTED FOOT STAYS IN WORLD',w*.30,h*.88,'#8ce4b4')}if(S.step>=4){x.fillStyle='#8ce4b4';x.fillRect(target-5,h*.18,10,h*.16);tag(`JUMP TO CLIP PHASE WITH ${v.dist.toFixed(2)} m REMAINING`,w*.43,h*.16,'#8ce4b4')}if(S.step>=5){let wall=left+span*.67;x.fillStyle='#526c7c';x.fillRect(wall,ground-115,18,115);x.fillStyle='#081019';x.fillRect(wall+90,ground-2,right-wall-90,h-ground+2);tag('WALL SWEEP',wall+10,h*.30,v.safe?'#8ce4b4':'#ff8179');tag('CLIFF PROBE',wall+75,h*.60,v.safe?'#8ce4b4':'#ff8179');if(v.safe){x.strokeStyle='#8ce4b4';x.lineWidth=4;x.beginPath();x.moveTo(wall-12,ground-70);x.lineTo(wall-12,ground);x.stroke();tag('ROOT REQUEST CLAMPED BY WORLD',w*.58,h*.40,'#8ce4b4')}if(S.cancel)tag('EARLY REINPUT → INERTIAL BLEND TO RUN',w*.16,h*.35,'#8ce4b4');else tag('STOP CLIP COMMITTED · INPUT WAITS',w*.16,h*.35,'#ff8179')}
}function metrics(){const v=vals();$('mDistance').textContent=v.dist.toFixed(2)+' m';$('mError').textContent=v.error.toFixed(2)+' m';$('mSlide').textContent=v.slide+' cm';$('mLatency').textContent=v.latency+' ms'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['관성과 포즈가 스냅','몸은 감속을 표현','속도마다 목표 오차','발과 캡슐 변위 일치','목표까지 남은 거리로 재생','루트 요청을 입력·세계가 검증'][S.step];$('explain').innerHTML=desc[S.step];$('cancel').setAttribute('aria-pressed',String(S.cancel));$('safety').setAttribute('aria-pressed',String(S.safety));metrics();draw()}function tick(){S.t++;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.cancel=S.step===5;S.safety=S.step===5;ui()});$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=(+e.target.value).toFixed(1)+' m/s';ui()};$('decel').oninput=e=>{S.decel=+e.target.value;$('decelOut').textContent=(+e.target.value).toFixed(1)+' m/s²';ui()};$('cancel').onclick=()=>{S.cancel=!S.cancel;ui()};$('safety').onclick=()=>{S.safety=!S.safety;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
