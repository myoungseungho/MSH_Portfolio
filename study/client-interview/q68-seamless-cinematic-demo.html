<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q68 심리스 시네마틱 전환 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="페이드 카메라 교체에서 동일 액터 시퀀서, 카메라 블렌드, 모션 워프, 스트리밍과 조작권 반환까지 발전하는 심리스 시네마틱 실험"></canvas><div class="hud"><span>Q68 · <b id="stage">페이드 후 카메라 교체</b></span><span id="status">검은 화면과 포즈 스냅이 이음매를 노출</span></div></div>
<div class="steps" role="group" aria-label="심리스 시네마틱 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>페이드 교체</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>동일 액터</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>카메라 블렌드</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>상태 인수인계</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>비동기 스트리밍</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>조작권 반환</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">진입 순간 이동 속도</label><output id="speedOut">7.0 m/s</output></div><input id="speed" type="range" min="0" max="100" value="70"></div><div><div class="ct"><label for="load">다음 구역 로딩량</label><output id="loadOut">72%</output></div><input id="load" type="range" min="20" max="100" value="72"></div><div class="toggles"><button id="warp" aria-pressed="false">모션 워프</button><button id="prefetch" aria-pressed="false">스트리밍 프리페치</button></div></div>
<div class="metrics"><div class="m"><small>카메라 연속성</small><strong id="mCamera">0%</strong></div><div class="m"><small>포즈 오차</small><strong id="mPose">82 cm</strong></div><div class="m"><small>다음 구역 준비</small><strong id="mReady">20%</strong></div><div class="m"><small>조작 권한</small><strong id="mControl">게임 0%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:7,load:72,warp:false,prefetch:false,t:0};
const names=['페이드 후 카메라 교체','같은 월드·같은 액터','현재 카메라에서 첫 샷으로 블렌드','포즈·위치·속도 인수인계','컷신 동안 다음 구역 스트리밍','시네마틱에서 게임으로 권한 반환'],status=['검은 화면과 포즈 스냅이 이음매를 노출','장비와 월드 상태가 그대로 유지','컷이 아니라 연속된 카메라 이동','질주도 대화 시작 포즈로 서서히 수렴','카메라 뒤에서 로딩을 먼저 끝냄','마지막 샷에서 플레이 카메라로 자연스럽게 복귀'];
const desc=['<b>실패 재현:</b> 화면을 검게 덮고 다른 카메라·포즈로 교체합니다. 진입 속도가 빠를수록 다시 밝아질 때 위치와 포즈 점프가 크게 보입니다.','<b>같은 연속체 사용:</b> 별도 영상이 아니라 현재 월드의 실제 액터와 장비를 시퀀서 트랙이 제어합니다. 렌더와 상태가 갈라지지 않습니다.','<b>카메라는 교체가 아니라 이동:</b> 현재 위치·회전·FOV에서 대화 첫 샷까지 이징 곡선으로 블렌드해 검은 프레임 없이 권한을 넘깁니다.','<b>한 프레임 스냅을 여러 프레임 블렌드로:</b> 질주 포즈를 크로스페이드하고 모션 워프로 시작 마커에 서서히 정렬합니다.','<b>컷신을 로딩 창구로:</b> 다음 구역을 비동기로 프리페치하고 카메라 뒤의 지난 구역을 언로드합니다. 진행률이 끝나기 전엔 느린 연출 구간이 시간을 법니다.','<b>양방향 인수인계:</b> 마지막 시네마틱 샷을 현재 플레이 카메라와 맞춘 뒤 카메라·애님·입력 권한을 역순으로 부드럽게 돌려줍니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const same=S.step>=1,camBlend=S.step>=2,state=S.step>=3&&S.warp,stream=S.step>=4&&S.prefetch,hand=S.step>=5,phase=(Math.sin(S.t*.018-Math.PI/2)+1)/2,camera=camBlend?Math.round(phase*100):0,pose=state?Math.max(2,Math.round(S.speed*12*(1-phase))):Math.round(18+S.speed*9.2),ready=stream?Math.min(100,Math.round(20+phase*S.load)):20,control=hand?Math.round(phase*100):0;return{same,camBlend,state,stream,hand,phase,camera,pose,ready,control}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.72;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#1b3441';x.fillRect(0,ground,w,ground);const oldX=w*.20,newX=w*.62,actorX=v.state?oldX+(newX-oldX)*v.phase:newX,actorCol=v.same?'#70ceff':'#ff7f78';line(w*.06,ground,w*.94,ground,'#60768a',3);x.fillStyle=actorCol;x.beginPath();x.arc(actorX,ground-92,16,0,7);x.fill();line(actorX,ground-74,actorX,ground-20,actorCol,10);line(actorX,ground-56,actorX+28+(v.state?0:S.speed*2),ground-42,actorCol,7);line(actorX,ground-20,actorX-22,ground+1,actorCol,7);line(actorX,ground-20,actorX+22,ground+1,actorCol,7);label(v.same?'LIVE ACTOR · GEAR KEPT':'REPLACED CUTSCENE ACTOR',actorX,ground-120,actorCol);
const gameCamX=w*.09,gameCamY=h*.27,shotX=w*.73,shotY=h*.22,camX=v.camBlend?gameCamX+(shotX-gameCamX)*v.phase:shotX,camY=v.camBlend?gameCamY+(shotY-gameCamY)*v.phase:shotY;line(camX,camY,actorX,ground-70,v.camBlend?'#8ce3ae':'#ffd06e',2,[6,4]);x.fillStyle=v.camBlend?'#8ce3ae':'#ffd06e';x.fillRect(camX-15,camY-9,24,18);x.beginPath();x.moveTo(camX+9,camY-8);x.lineTo(camX+24,camY);x.lineTo(camX+9,camY+8);x.fill();if(v.camBlend){line(gameCamX,gameCamY,shotX,shotY,'#52677b',2,[3,5]);label(`CAMERA BLEND ${v.camera}%`,w*.46,h*.16,'#8ce3ae')}else label('HARD CAMERA SWAP',w*.46,h*.16,'#ff7f78');
const tx=w*.08,ty=h*.83,tw=w*.84;line(tx,ty,tx+tw,ty,'#52677b',3);const stages=['GAMEPLAY','CAM BLEND','POSE WARP','STREAM','HAND BACK'];for(let i=0;i<5;i++){const px=tx+tw*i/4;x.fillStyle=i<=Math.min(4,S.step)?'#70ceff':'#52677b';x.beginPath();x.arc(px,ty,6,0,7);x.fill();label(stages[i],px,ty+28,i<=S.step?'#70ceff':'#788ba1')}if(S.step>=4){x.fillStyle='#203748';x.fillRect(w*.72,h*.43,w*.20,13);x.fillStyle=v.ready===100?'#8ce3ae':'#ffd06e';x.fillRect(w*.72,h*.43,w*.20*v.ready/100,13);label(`NEXT ZONE ${v.ready}%`,w*.82,h*.41,v.ready===100?'#8ce3ae':'#ffd06e')}if(v.hand)label(`INPUT ${v.control}%`,w*.82,h*.57,'#8ce3ae');if(S.step===0){x.fillStyle=`rgba(0,0,0,${.35+.4*v.phase})`;x.fillRect(0,0,w,h);label('FADE HIDES THE SEAM',w*.5,h*.48,'#ff7f78')}
$('mCamera').textContent=v.camera+'%';$('mPose').textContent=v.pose+' cm';$('mReady').textContent=v.ready+'%';$('mControl').textContent='게임 '+v.control+'%';c.dataset.camera=v.camera;c.dataset.pose=v.pose;c.dataset.ready=v.ready;c.dataset.control=v.control}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('warp').setAttribute('aria-pressed',String(S.warp));$('prefetch').setAttribute('aria-pressed',String(S.prefetch));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.warp=S.step>=3;S.prefetch=S.step>=4;S.t=0;update()});$('speed').oninput=e=>{S.speed=+e.target.value/10;$('speedOut').textContent=S.speed.toFixed(1)+' m/s';update()};$('load').oninput=e=>{S.load=+e.target.value;$('loadOut').textContent=S.load+'%';update()};$('warp').onclick=()=>{S.warp=!S.warp;update()};$('prefetch').onclick=()=>{S.prefetch=!S.prefetch;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
