<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q83 벌목 물리 파이프라인 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="고정 쓰러짐 애니메이션에서 인스턴스 승격, 브레이크 컨스트레인트, 프리컷 단면, CCD 충돌과 슬립 풀링으로 발전하는 벌목 실험"></canvas><div class="hud"><span>Q83 · <b id="stage">항상 오른쪽으로 쓰러지는 애니메이션</b></span><span id="status">타격 방향·경사·바위를 무시하고 관통</span></div></div>
<div class="steps" role="group" aria-label="벌목 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>고정 애니메이션</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>싼 숲 인스턴스</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>물리 액터 승격</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>런타임 절단 비용</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>프리컷·단면 캡</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>슬립·풀 회수</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="direction">도끼 타격 방향</label><output id="directionOut">→ 65%</output></div><input id="direction" type="range" min="-100" max="100" value="65"></div><div><div class="ct"><label for="height">절단 희망 높이</label><output id="heightOut">43%</output></div><input id="height" type="range" min="20" max="75" value="43"></div><div class="toggles"><button id="hit" aria-pressed="false">도끼 타격</button><button id="ccd" aria-pressed="true">낙하 중 CCD</button></div></div>
<div class="metrics"><div class="m"><small>현재 파이프라인 상태</small><strong id="mState">ANIM</strong></div><div class="m"><small>브레이크 조인트 손상</small><strong id="mDamage">0%</strong></div><div class="m"><small>절단 높이 / 스냅 오차</small><strong id="mCut">43% / —</strong></div><div class="m"><small>활성 강체 / 풀 반환</small><strong id="mBodies">0 / 0</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,dir:.65,height:.43,ccd:true,t:0,damage:0,angle:0,av:0,broken:false,sleep:false,pool:0,hitPulse:0},joints=[.25,.4,.55,.7];
const names=['항상 오른쪽으로 쓰러지는 애니메이션','평소 수천 그루는 정적 인스턴스 한 배치','선택된 한 그루만 강체·브레이크 조인트로 승격','임의 절단 평면이 메시 재구성과 단면 생성을 요구','가까운 프리컷 조인트 절단 + 나이테 캡 표시','충돌 후 속도가 줄면 Sleep → 정적 프롭·풀 반환'];
const status=['타격 방향·경사·바위를 무시하고 관통','아직 강체·개별 로직이 없어 숲 비용이 낮다','세 번 타격하면 반대 방향으로 실제 회전 낙하','정확하지만 전투 중 반복하기엔 CPU 비용이 크다','43% 요청은 가장 가까운 40% 조인트로 스냅','넘어지는 동안만 CCD, 정착 후 물리 비용 0'];
const desc=['<b>가짜 쓰러짐:</b> HP가 0이면 미리 만든 회전을 재생합니다. 방향 슬라이더를 왼쪽으로 바꿔도 나무는 오른쪽 바위를 통과해 같은 자세로 눕습니다.','<b>평소에는 싸게:</b> 숲 전체는 정적 인스턴스라 강체도 개별 업데이트도 없습니다. 플레이어가 실제로 치는 그 한 그루만 다음 단계에서 비싼 액터로 바뀝니다.','<b>컨텍스트 승격:</b> 도끼 타격을 세 번 눌러 밑동 브레이크 임계값을 넘겨 보세요. 타격 방향의 반대쪽으로 각속도가 생기고 경사·바위와 충돌합니다.','<b>진짜 임의 슬라이스의 값:</b> 희망 높이 그대로 절단 평면을 만들려면 삼각형을 다시 자르고 열린 단면을 새로 메워야 합니다. 정확한 대신 CPU 메시 재구성 비용이 표시됩니다.','<b>비용을 속이는 프리컷:</b> 몇 개 조인트 중 희망 높이에 가장 가까운 곳을 끊고 나이테 캡으로 막습니다. 슬라이더를 움직여 실제 스냅 높이와 오차를 비교하세요.','<b>비싼 상태는 잠깐:</b> 쓰러지는 동안만 복합 충돌·CCD를 켜고, 바위나 지면에 정착해 속도가 작아지면 Sleep합니다. 다시 타격하면 풀에서 액터를 재사용합니다.'];
function snapped(){return joints.reduce((a,b)=>Math.abs(b-S.height)<Math.abs(a-S.height)?b:a)}
function reset(){S.t=0;S.damage=S.step===4?70:0;S.angle=0;S.av=0;S.broken=false;S.sleep=false;S.hitPulse=0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function hit(){if(S.step<2)return;if(S.sleep){S.pool++;reset()}S.damage=Math.min(105,S.damage+35);S.hitPulse=12;if(S.damage>=100){S.broken=true;S.av=-Math.sign(S.dir||1)*(.8+Math.abs(S.dir)*.9)}}
function simulate(dt){S.t+=dt;S.hitPulse=Math.max(0,S.hitPulse-1);if(S.step===0){S.angle=Math.min(1.5,S.t*.78);return}if(!S.broken||S.sleep)return;const side=Math.sign(S.angle||S.av||-S.dir),gravity=side*.78;S.av+=gravity*dt;S.av*=.992;S.angle+=S.av*dt;const rockLimit=1.05;if(S.ccd&&S.angle>rockLimit){S.angle=rockLimit;S.av*=-.18}else if(S.ccd&&S.angle<-1.35){S.angle=-1.35;S.av*=-.12}if(Math.abs(S.angle)>1.47&&!S.ccd)S.angle=Math.sign(S.angle)*1.47;if(S.step>=5&&S.t>3.2&&Math.abs(S.av)<.22){S.sleep=true;S.av=0}}
function drawTree(cx,base,len,angle,cut){x.save();x.translate(cx,base-len*cut);x.rotate(angle);const trunk=len*(1-cut),crown=42+46*Math.min(1,Math.abs(angle)/1.05);x.fillStyle='#6d482a';x.fillRect(-10,-trunk,20,trunk);x.fillStyle='#315e39';x.beginPath();x.arc(0,-trunk,crown,0,Math.PI*2);x.fill();x.restore();if(S.step>=4){x.save();x.translate(cx,base-len*cut);x.rotate(angle);x.fillStyle='#d7ad68';x.beginPath();x.ellipse(0,0,11,5,0,0,Math.PI*2);x.fill();x.strokeStyle='#754f2d';x.beginPath();x.ellipse(0,0,7,3,0,0,Math.PI*2);x.stroke();x.restore()}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.47,base=h*.77,len=h*.55,cut=S.step>=4?snapped():S.height;x.fillStyle='#111b23';x.fillRect(0,0,w,h);x.fillStyle='#293b2b';x.beginPath();x.moveTo(0,h*.8);x.lineTo(w*.35,h*.76);x.lineTo(w,h*.86);x.lineTo(w,h);x.lineTo(0,h);x.fill();x.fillStyle='#46505a';x.beginPath();x.ellipse(w*.72,h*.69,68,42,-.18,0,Math.PI*2);x.fill();if(S.step===1){for(let i=0;i<8;i++){x.fillStyle='#234a2d';x.fillRect(w*(.08+i*.11),h*.35,8,h*.43)}}drawTree(cx,base,len,S.angle,cut);x.fillStyle='#6d482a';x.fillRect(cx-13,base-len*cut,26,len*cut);if(S.step>=2&&!S.broken){x.strokeStyle=S.damage>=70?'#ff7f78':'#70ceff';x.lineWidth=3;x.beginPath();x.arc(cx,base-len*cut,18,0,Math.PI*2);x.stroke()}if(S.hitPulse){x.strokeStyle='#ffd06e';x.lineWidth=4;x.beginPath();x.moveTo(cx-S.dir*85,base-len*S.height-35);x.lineTo(cx,base-len*S.height);x.stroke()}if(S.step===3){x.strokeStyle='#ff7f78';x.setLineDash([6,5]);x.beginPath();x.moveTo(cx-60,base-len*S.height);x.lineTo(cx+60,base-len*S.height);x.stroke();x.setLineDash([]);x.fillStyle='#ff7f78';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText('RUNTIME BOOLEAN · REBUILD TRIANGLES + CAP',w*.34,h*.15)}if(S.step>=4){x.fillStyle='#8ce3ae';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`REQUEST ${(S.height*100).toFixed(0)}% → PRECUT ${(cut*100).toFixed(0)}%`,w*.4,h*.15)}if(S.ccd&&S.broken&&!S.sleep){x.fillStyle='#70ceff';x.fillText('CCD ON WHILE FALLING',w*.43,h*.21)}const state=S.step===0?'ANIM':S.step===1?'INSTANCE':S.sleep?'SLEEP/STATIC':S.broken?'FALLING':S.step>=2?'PHYSICS READY':'INSTANCE',cost=S.step===3?'4.8 ms':'—',err=S.step>=4?Math.abs(cut-S.height)*100:null;$('mState').textContent=state+(S.step===3?' · '+cost:'');$('mDamage').textContent=S.damage+'%';$('mCut').textContent=(S.height*100).toFixed(0)+'% / '+(err===null?'—':err.toFixed(0)+'%');$('mBodies').textContent=(S.step>=2&&!S.sleep?1:0)+' / '+S.pool;c.dataset.state=state;c.dataset.angle=S.angle.toFixed(3);c.dataset.damage=S.damage;c.dataset.cut=(cut*100).toFixed(0);c.dataset.error=err===null?'':err.toFixed(1);c.dataset.pool=S.pool;c.dataset.ccd=S.ccd?'1':'0'}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('ccd').setAttribute('aria-pressed',String(S.ccd));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;reset();update()});$('direction').oninput=e=>{S.dir=+e.target.value/100;$('directionOut').textContent=(S.dir<0?'← ':'→ ')+Math.abs(+e.target.value)+'%';reset();update()};$('height').oninput=e=>{S.height=+e.target.value/100;$('heightOut').textContent=e.target.value+'%';reset();update()};$('hit').onclick=()=>{hit();update()};$('ccd').onclick=()=>{S.ccd=!S.ccd;update()};let last=performance.now();function tick(now){const dt=Math.min(.033,(now-last)/1000);last=now;simulate(dt);draw();requestAnimationFrame(tick)}reset();update();requestAnimationFrame(tick);addEventListener('resize',draw);
})();
</script></body></html>
