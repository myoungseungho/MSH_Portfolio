<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q13 표면 에이징 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block;cursor:crosshair}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="모듈러 성벽의 이끼, 녹, 물때가 절차 마스크와 월드 좌표로 자연스럽게 이어지는 단계"></canvas><div class="hud"><span>Q13 · <b id="stage">완성 텍스처</b></span><span id="status">모든 조각이 똑같이 늙음</span></div></div>
<div class="steps" role="group" aria-label="표면 에이징 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>완성 텍스처</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>재질 레이어</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>수동 마스크</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>기하 마스크</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>월드 연속</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>의도·RVT</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="humidity">세계 습도</label><output id="humidityOut">55%</output></div><input id="humidity" type="range" min="0" max="100" value="55"></div><div><div class="ct"><label for="age">경과 시간</label><output id="ageOut">65%</output></div><input id="age" type="range" min="0" max="100" value="65"></div><div class="toggles" role="group" aria-label="표시 레이어"><button data-layer="0" aria-pressed="false">♣ 이끼</button><button data-layer="1" aria-pressed="false">⌁ 녹·물때</button><button data-layer="2" aria-pressed="true">▦ 모두</button></div></div>
<div class="metrics"><div class="m"><small>활성 재질 레이어</small><strong id="mLayers">1</strong></div><div class="m"><small>모듈 이음매</small><strong id="mSeam">끊김</strong></div><div class="m"><small>절차 마스크</small><strong id="mMasks">0</strong></div><div class="m"><small>런타임 텍스처 페치</small><strong id="mFetch">4</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,humidity:.55,age:.65,layer:2,t:0,paint:{x:.72,y:.44}},names=['완성 텍스처','재질 레이어','수동 마스크','기하 마스크','월드공간 연속','의도·RVT 캐시'];
const desc=['<b>문제 재현:</b> 이끼·녹·물때까지 한 장에 그린 모듈을 반복했습니다. 두 벽이 똑같이 늙고 중앙 이음매에서 무늬가 다시 시작합니다.','<b>레이어 분리:</b> 깨끗한 돌, 이끼, 녹·물때를 각자 알베도·노멀·러프니스 세트로 나눴습니다. 하지만 어디에 놓을지 정하는 마스크가 아직 없습니다.','<b>원점 회귀:</b> 마스크를 조각마다 손으로 그리면 모양은 좋아져도 재사용과 동적 변화가 사라집니다. 같은 수동 무늬가 모듈마다 반복됩니다.','<b>형태에서 규칙 추출:</b> AO는 돌 틈, 커버처는 닳은 모서리, 위를 향한 면은 이끼, 낮은 곳은 물때 마스크가 됩니다. 습도·시간을 바꾸면 규칙에 따라 자랍니다.','<b>좌표를 세계에 고정:</b> 마스크를 오브젝트 UV가 아닌 월드공간 트라이플래너로 샘플합니다. 중앙 이음매를 넘어 이끼와 물때가 연속됩니다.','<b>최종:</b> 절차 분포 위에 아티스트 의도점을 곱하고, 정적 결과는 RVT에 캐시해 런타임 페치를 줄입니다. 화면을 클릭하면 강조 지점을 옮길 수 있습니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function noise(a,b){return (Math.sin(a*12.9898+b*78.233)*43758.5453)%1}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,proc=S.step>=3,world=S.step>=4,final=S.step>=5,showM=S.layer!==1,showR=S.layer!==0;x.clearRect(0,0,w,h);const bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#536576');bg.addColorStop(1,'#1d2730');x.fillStyle=bg;x.fillRect(0,0,w,h);const left=w*.08,top=h*.12,ww=w*.84,wh=h*.75,cols=12,rows=8,bw=ww/cols,bh=wh/rows;
for(let iy=0;iy<rows;iy++)for(let ix=0;ix<cols;ix++){const module=ix<cols/2?0:1,localX=ix%(cols/2),seed=world?ix:localX,base=85+((ix*17+iy*31)%22);x.fillStyle=`rgb(${base},${base*.92},${base*.78})`;x.fillRect(left+ix*bw+1,top+iy*bh+1,bw-2,bh-2);
let moss=0,rust=0;if(S.step===0||S.step===2){moss=((localX+iy*2)%7<2)?S.age:.05;rust=((localX*3+iy)%9===0)?S.age:.02}else if(S.step===1){moss=.18*S.age;rust=.12*S.age}else if(proc){const crevice=(ix%3===0||iy%3===0)?.7:.12,low=iy/rows,up=(iy%2===0)?.35:.10,n=.5+.5*Math.sin(seed*1.7+iy*2.1);moss=Math.min(1,(crevice*.45+up*.25+n*.3)*S.humidity*S.age*1.55);rust=Math.min(1,(low*.55+crevice*.25+n*.20)*(1-S.humidity*.25)*S.age)}
if(final){const dx=(left+(ix+.5)*bw)/w-S.paint.x,dy=(top+(iy+.5)*bh)/h-S.paint.y,artist=Math.exp(-(dx*dx+dy*dy)/.012);rust=Math.min(1,rust+artist*.8);moss=Math.min(1,moss+artist*S.humidity*.35)}
if(showM&&moss>.05){x.fillStyle=`rgba(45,91,48,${moss*.85})`;x.fillRect(left+ix*bw+2,top+iy*bh+2,bw-4,bh-4);x.fillStyle=`rgba(96,137,67,${moss*.45})`;for(let k=0;k<3;k++){x.beginPath();x.arc(left+(ix+(k+1)/4)*bw,top+(iy+.65)*bh,2+moss*4,0,7);x.fill()}}
if(showR&&rust>.05){x.fillStyle=`rgba(125,56,28,${rust*.8})`;x.fillRect(left+ix*bw+bw*.18,top+iy*bh+bh*.12,bw*.16,bh*(.55+rust*.4));x.fillStyle=`rgba(45,34,29,${rust*.35})`;x.fillRect(left+ix*bw+bw*.13,top+iy*bh+bh*.72,bw*.28,bh*.17)}
if(proc&&iy===0){x.fillStyle='rgba(205,190,155,.28)';x.fillRect(left+ix*bw+1,top+iy*bh+1,bw-2,bh*.12)}
}
// pipe drives a meaningful rust streak
x.fillStyle='#4b5152';x.fillRect(w*.69,h*.14,w*.035,h*.37);x.fillStyle='#687071';x.beginPath();x.arc(w*.707,h*.16,17,0,7);x.fill();if(showR&&S.step>=3){const a=S.age*.75;x.fillStyle=`rgba(135,55,25,${a})`;x.fillRect(w*.69,h*.45,w*.035,h*.34);x.fillStyle=`rgba(75,43,27,${a*.65})`;x.fillRect(w*.675,h*.69,w*.065,h*.14)}
x.strokeStyle=S.step>=4?'rgba(110,215,229,.35)':'rgba(255,116,105,.8)';x.lineWidth=S.step>=4?1:3;x.setLineDash(S.step>=4?[5,5]:[]);x.beginPath();x.moveTo(w*.5,top);x.lineTo(w*.5,top+wh);x.stroke();x.setLineDash([]);x.fillStyle=S.step>=4?'#6ed7e5':'#ff7469';x.font='600 10px ui-monospace,monospace';x.fillText(S.step>=4?'WORLD COORD · CONTINUOUS':'MODULE UV SEAM · RESTART',w*.405,h*.92);
if(S.step===0){x.fillStyle='rgba(7,10,15,.84)';x.fillRect(w*.10,h*.18,w*.31,h*.11);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('왼쪽과 오른쪽이 같은 무늬',w*.12,h*.23);x.fillStyle='#96a2b2';x.font='10px system-ui';x.fillText('재사용할수록 반복과 이음매 노출',w*.12,h*.265)}
if(final){x.strokeStyle='#ffb347';x.lineWidth=2;x.beginPath();x.arc(S.paint.x*w,S.paint.y*h,18,0,7);x.stroke();x.fillStyle='#ffb347';x.font='600 10px system-ui';x.fillText('ARTIST WEIGHT',S.paint.x*w+22,S.paint.y*h)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.layer===S.layer)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];$('mLayers').textContent=S.step===0?'1':S.layer===2?'3':'2';$('mSeam').textContent=S.step>=4?'연속':'끊김';$('mMasks').textContent=S.step>=3?'AO·커버처·업·높이':'0';$('mFetch').textContent=S.step===0?'4':S.step>=5?'4 (RVT)':S.layer===2?'12':'8';$('status').textContent=['모든 조각이 똑같이 늙음','레이어는 있으나 분포 없음','수동 반복 마스크','형태를 따라 자동 분포','모듈 경계 연속','절차×수동·결과 캐시'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{S.layer=+b.dataset.layer;ui()});$('humidity').oninput=e=>{S.humidity=+e.target.value/100;$('humidityOut').textContent=e.target.value+'%';ui()};$('age').oninput=e=>{S.age=+e.target.value/100;$('ageOut').textContent=e.target.value+'%';ui()};c.onclick=e=>{if(S.step<5)return;const r=c.getBoundingClientRect();S.paint={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};ui()};function frame(t){S.t=t/1000;draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
