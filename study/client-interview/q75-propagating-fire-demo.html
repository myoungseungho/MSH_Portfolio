<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q75 번지는 화재 상태 시뮬레이션 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="고정 불 파티클에서 연료 데이터, 인접 전파, 버닝 마스크, 그을음 누적과 표현 예산·환경 소화까지 발전하는 화재 실험"></canvas><div class="hud"><span>Q75 · <b id="stage">맞은 자리에 루프 불 파티클</b></span><span id="status">불이 세계 상태와 무관한 스티커</span></div></div>
<div class="steps" role="group" aria-label="번지는 화재 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>스티커 불</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>연료 데이터</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>인접 전파</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>버닝 마스크</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>그을음 누적</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>표현 예산·환경</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="wind">바람</label><output id="windOut">→ 35%</output></div><input id="wind" type="range" min="-100" max="100" value="35"></div><div><div class="ct"><label for="rain">강우·젖음</label><output id="rainOut">0%</output></div><input id="rain" type="range" min="0" max="100" value="0"></div><div class="toggles"><button id="water" aria-pressed="false">국소 물 분사</button><button id="cluster" aria-pressed="false">VFX 군집화</button></div></div>
<div class="metrics"><div class="m"><small>타는 연료 셀</small><strong id="mBurning">1개</strong></div><div class="m"><small>남은 총 연료</small><strong id="mFuel">99%</strong></div><div class="m"><small>화염 방출기 / 라이트</small><strong id="mEmitters">1 / 1</strong></div><div class="m"><small>영속 그을음 면적</small><strong id="mScorch">0%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=12,H=7,S={step:0,wind:35,rain:0,water:false,cluster:false,t:0,cells:[]};
const names=['맞은 자리에 루프 불 파티클','표면을 연료 셀과 연소 진행도로 표현','열·거리·바람으로 인접 셀 발화','연소 진행도가 차링·이미시브·디졸브를 구동','전선이 지나간 자리에 그을음을 영속 기록','상태는 전부 유지하고 비싼 표현만 예산화'],status=['불이 세계 상태와 무관한 스티커','무엇이 얼마나 탈 수 있는지 데이터화','불길이 바람 방향으로 실제 이동','표면이 검어지고 벌건 경계 뒤로 재가 됨','화염이 사라져도 결과는 세계에 남음','군집 라이트·임포스터와 비·물 필드가 상호작용'];
const desc=['<b>가짜 재현:</b> 화살 충돌점에 같은 불 파티클 하나만 반복합니다. 바람·비·이웃 판자·연료가 아무 영향도 주지 않습니다.','<b>진실을 데이터로:</b> 판자를 셀로 나누고 연료·열·젖음·연소 진행도를 둡니다. 아직 이웃 전파는 없어 불붙은 셀만 줄어듭니다.','<b>셀룰러 전파:</b> 타는 셀이 이웃 열을 올리고 임계치를 넘으면 발화합니다. 바람은 순풍 이웃의 열 전달을 키우고 역풍을 줄입니다.','<b>상태를 읽는 표현:</b> 진행도 0→1이 알베도 차링, 벌건 이미시브 전선, 디졸브와 화염·연기 램프를 동시에 구동합니다.','<b>휘발 상태와 영속 결과 분리:</b> 연소 전선이 지나간 UV에 스코치를 누적해 불이 꺼지고 재가 되어도 검은 흔적은 남습니다.','<b>시뮬과 표현의 예산 분리:</b> 모든 연료 상태는 계속 돌되 화면 표현은 군집 VFX·대표 라이트로 묶습니다. 비와 물은 같은 젖음 필드에 써서 실제 연소를 낮춥니다.'];
function reset(){S.cells=Array.from({length:W*H},(_,i)=>({fuel:1,heat:0,burn:0,scorch:0,wet:S.rain/100*.55}));const idx=3+Math.floor(H/2)*W;S.cells[idx].heat=1;S.cells[idx].burn=.08;S.t=0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function simulate(){if(S.step===0)return;const next=S.cells.map(o=>({...o}));for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=xx+y*W,a=S.cells[i];a.wet=Math.min(1,a.wet+S.rain/100*.006);if(S.water&&xx>=5&&xx<=7&&y>=2&&y<=4)a.wet=Math.min(1,a.wet+.08);if(a.burn>0&&a.fuel>0){const rate=.018*(1-a.wet*.92);next[i].fuel=Math.max(0,a.fuel-rate);next[i].burn=Math.min(1,a.burn+rate*1.8);next[i].heat=Math.max(next[i].heat,Math.max(0,a.heat-.008-a.wet*.025));if(S.step>=4)next[i].scorch=Math.max(a.scorch,a.burn);if(S.step>=2){[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=xx+dx,ny=y+dy;if(nx<0||nx>=W||ny<0||ny>=H)return;const n=nx+ny*W,windBoost=dx===Math.sign(S.wind)?Math.abs(S.wind)/100*.045:dx===-Math.sign(S.wind)?-Math.abs(S.wind)/100*.018:0;next[n].heat=Math.min(1,next[n].heat+.022+windBoost-a.wet*.012)})}}else next[i].heat=Math.max(next[i].heat,Math.max(0,a.heat-.01));if(next[i].heat>.25&&next[i].fuel>.05&&next[i].wet<.78)next[i].burn=Math.max(next[i].burn,.025)}S.cells=next}
function values(){const burning=S.step===0?1:S.cells.filter(a=>a.burn>0&&a.fuel>.02&&a.heat>.05).length,fuel=S.step===0?99:S.cells.reduce((n,a)=>n+a.fuel,0)/S.cells.length*100,scorch=S.step>=4?S.cells.reduce((n,a)=>n+a.scorch,0)/S.cells.length*100:0,emit=S.cluster&&S.step>=5?Math.min(4,Math.ceil(burning/8)):burning,lights=S.cluster&&S.step>=5?Math.min(2,Math.ceil(burning/14)):burning;return{burning,fuel,scorch,emit,lights}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values(),gx=w*.08,gy=h*.18,gw=w*.84,gh=h*.59,cw=gw/W,ch=gh/H;x.fillStyle='#102331';x.fillRect(0,0,w,h);for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=xx+y*W,a=S.cells[i],px=gx+xx*cw,py=gy+y*ch,b=S.step===0?(i===3+Math.floor(H/2)*W?.22:0):a.burn,sc=S.step>=4?a.scorch:0;x.fillStyle=`rgb(${Math.round(74-50*Math.max(b,sc))},${Math.round(52-35*Math.max(b,sc))},${Math.round(34-22*Math.max(b,sc))})`;x.fillRect(px+1,py+1,cw-2,ch-2);x.strokeStyle='#8a6747';x.strokeRect(px+1,py+1,cw-2,ch-2);if(S.step>=1){x.fillStyle=`rgba(112,206,255,${a.wet*.55})`;x.fillRect(px+2,py+2,(cw-4)*a.wet,4);if(b>0){const front=Math.min(1,b*1.6);x.fillStyle=`rgba(255,68,48,${.3+front*.55})`;x.fillRect(px+cw*(1-front),py+3,cw*front-3,ch-6);x.fillStyle=`rgba(255,208,110,${Math.max(0,1-Math.abs(b-.48)*2)})`;x.fillRect(px+cw*(1-front)-2,py+3,4,ch-6);if(S.step>=3&&a.fuel<.12){x.fillStyle='#080d16';x.fillRect(px+cw*.25,py+ch*.25,cw*.5,ch*.5)}}}if(sc>.18){x.strokeStyle=`rgba(5,5,5,${Math.min(.9,sc)})`;x.lineWidth=3;x.strokeRect(px+4,py+4,cw-8,ch-8)}}if(S.step===0){const px=gx+(3+.5)*cw,py=gy+(Math.floor(H/2)+.5)*ch;for(let k=0;k<9;k++){x.fillStyle=k%2?'#ffd06e':'#ff7f78';x.beginPath();x.arc(px+Math.sin(k*2.2+S.t*.08)*12,py-8-(k%4)*9,5+(k%3),0,7);x.fill()}label('LOOP PARTICLE · NO STATE',px,py+37,'#ff7f78')}else{label(`FUEL FIELD ${W}×${H}`,w*.5,gy-13,'#70ceff');if(S.step>=2)label(`WIND ${S.wind<0?'←':'→'} ${Math.abs(S.wind)}% · HEAT PROPAGATION`,w*.5,gy+gh+23,'#ffd06e');if(S.water){x.strokeStyle='#70ceff';x.lineWidth=3;x.strokeRect(gx+5*cw,gy+2*ch,3*cw,3*ch);label('LOCAL WETNESS WRITE',gx+6.5*cw,gy+2*ch-9,'#70ceff')}}if(S.step>=3)label('CHAR → EMISSIVE FRONT → ASH DISSOLVE',w*.50,h*.12,'#8ce3ae');if(S.cluster&&S.step>=5)label(`${v.burning} FIRE STATES → ${v.emit} VFX CLUSTERS / ${v.lights} LIGHTS`,w*.50,h*.86,'#8ce3ae');
$('mBurning').textContent=v.burning+'개';$('mFuel').textContent=v.fuel.toFixed(0)+'%';$('mEmitters').textContent=v.emit+' / '+v.lights;$('mScorch').textContent=v.scorch.toFixed(0)+'%';c.dataset.burning=v.burning;c.dataset.fuel=v.fuel.toFixed(2)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('water').setAttribute('aria-pressed',String(S.water));$('cluster').setAttribute('aria-pressed',String(S.cluster));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.water=false;S.cluster=S.step>=5;reset();update()});$('wind').oninput=e=>{S.wind=+e.target.value;$('windOut').textContent=(S.wind<0?'← ':'→ ')+Math.abs(S.wind)+'%';reset();update()};$('rain').oninput=e=>{S.rain=+e.target.value;$('rainOut').textContent=S.rain+'%';reset();update()};$('water').onclick=()=>{S.water=!S.water;update()};$('cluster').onclick=()=>{S.cluster=!S.cluster;update()};function tick(){S.t++;if(S.t%4===0)simulate();draw();requestAnimationFrame(tick)}reset();update();tick();addEventListener('resize',draw);
})();
</script></body></html>
