<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q86 지형 재질 블렌딩 실험실</title><style>
:root{--bg:#0a1017;--panel:#121b27;--line:#344458;--ink:#f4f7fb;--muted:#9cabbc;--blue:#77ceff;--green:#82db9c;--rock:#a8a7a2;--snow:#eef6ff;--water:#4baee8;--gold:#f5ca68}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;font:11px ui-monospace,Consolas,monospace;pointer-events:none}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#060a11dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#07121a}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8292a5;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="지형이 경사, 높이, 물가 마스크와 하이트 블렌드, RVT로 발전하는 실험"></canvas><div class="hud"><span>Q86 · <b id="stage">한 장 텍스처 반복</b></span><span id="status">모든 경사와 높이에 같은 흙 무늬</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>한 장 도배</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>경사 마스크</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>높이·물가</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>선형 경계</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>하이트·노이즈</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>RVT 캐시</button></div><p id="explain" class="explain"></p>
<div class="controls"><div><div class="ct"><label for="slope">산 경사 강도</label><output id="slopeOut">58%</output></div><input id="slope" type="range" min="20" max="90" value="58"></div><div><div class="ct"><label for="water">물 높이</label><output id="waterOut">28%</output></div><input id="water" type="range" min="5" max="55" value="28"></div><div class="toggles"><button id="heightBlend" aria-pressed="false">하이트 블렌드</button><button id="rvt" aria-pressed="false">RVT 캐시</button></div></div>
<div class="metrics"><div class="m"><small>픽셀당 텍스처 페치</small><strong id="mFetch">4</strong></div><div class="m"><small>활성 레이어</small><strong id="mLayers">흙 1</strong></div><div class="m"><small>경계 폭</small><strong id="mEdge">0 px</strong></div><div class="m"><small>RVT 상태</small><strong id="mRvt">미사용</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,slope:.58,water:.28,height:false,rvt:false};const names=['한 장 텍스처 반복','노멀로 경사 마스크 만들기','월드 높이와 물가 마스크 추가','선형 블렌드의 흐린 경계','하이트 블렌드와 다중 스케일 노이즈','블렌드 결과를 RVT에 캐시'];const stat=['모든 경사와 높이에 같은 흙 무늬','가파른 곳은 바위 · 완만한 곳은 풀','정상은 눈 · 수면 언저리는 젖은 이끼','두 재질이 반투명하게 겹쳐 뭉개짐','요철의 높은 재질이 경계를 차지','복잡한 규칙을 굽고 매 프레임 4회만 샘플'];const desc=['<b>문제부터 보기:</b> 지형 전체에 흙 한 장을 타일링하면 반복 무늬가 드러나고 절벽·초원·설산의 구분도 없습니다.','<b>경사 규칙:</b> 노멀의 위쪽 성분이 작을수록 바위, 클수록 풀을 선택합니다. 경사 슬라이더로 바위 영역이 늘고 줄어드는 것을 확인하세요.','<b>공간 규칙 추가:</b> 월드 높이가 스노우라인을 넘으면 눈을, 수면과 가까우면 젖은 이끼를 띠처럼 얹습니다. 물 높이를 움직이면 젖은 띠도 함께 이동합니다.','<b>단순 알파의 한계:</b> 선형 보간은 경계에서 풀과 바위를 반씩 비쳐 회색빛으로 뭉갭니다. 날카롭게 자르면 등고선처럼 인공적입니다.','<b>경계를 지형답게:</b> 레이어의 하이트맵으로 돌출된 자갈이 먼저 나오게 하고 여러 크기의 노이즈로 경계를 흐트러뜨립니다. 하이트 블렌드 버튼으로 차이를 직접 비교하세요.','<b>비용을 굽기:</b> 여러 레이어의 알베도·노멀·러프니스·하이트 결과를 RVT에 저장하면 매 픽셀 수십 번의 샘플이 4회로 줄어듭니다. 캐시를 꺼 비용 차이를 확인하세요.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function terrain(u){return .78-Math.pow(Math.sin(u*Math.PI),1.2)*(S.slope*.58)-Math.sin(u*13)*.018}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight;x.fillStyle='#172538';x.fillRect(0,0,w,h);const waterY=h*(.86-S.water*.46),cut=1.15+S.slope;x.fillStyle='#4baee844';x.fillRect(0,waterY,w,h-waterY);for(let px=0;px<w;px+=3){let u=px/w,y=terrain(u),yn=terrain(Math.min(1,u+.004)),sl=Math.abs(yn-y)/.004,noise=Math.sin(u*91)+Math.sin(u*37)*.6,mat='dirt';if(S.step>=1)mat=sl>cut?'rock':'grass';if(S.step>=2){if(y<.49)mat='snow';if(Math.abs(y-waterY/h)<.045)mat='wet'}let col={dirt:'#98734e',grass:'#82db9c',rock:'#a8a7a2',snow:'#eef6ff',wet:'#356e5b'}[mat];if(S.step===3&&Math.abs(sl-cut)<.24)col='#929b87';if(S.step>=4&&S.height&&(mat==='grass'||mat==='rock')&&Math.abs(sl-cut+noise*.08)<.3)col=noise>0?'#a8a7a2':'#82db9c';x.strokeStyle=col;x.lineWidth=4;x.beginPath();x.moveTo(px,y*h);x.lineTo(px,h);x.stroke()}if(S.step===0){x.strokeStyle='#cf9f65';for(let i=0;i<12;i++){x.beginPath();x.arc(i*w/6,h*.7,22,0,Math.PI*2);x.stroke()}}x.strokeStyle='#4baee8';x.setLineDash([6,5]);x.beginPath();x.moveTo(0,waterY);x.lineTo(w,waterY);x.stroke();x.setLineDash([]);x.fillStyle='#f4f7fb';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`WATER ${Math.round(S.water*100)}%`,12,waterY-7);let fetch=S.step===0?4:S.step<5?S.step===1?8:S.step===2?16:20:S.rvt?4:20,layers=S.step===0?'흙 1':S.step===1?'풀·바위 2':'풀·바위·눈·이끼 4',edge=S.step<3?0:S.step===3?28:S.height?9:28;$('mFetch').textContent=fetch;$('mLayers').textContent=layers;$('mEdge').textContent=edge+' px';$('mRvt').textContent=S.step>=5?(S.rvt?'캐시 적중':'실시간 계산'):'미사용';c.dataset.fetch=fetch;c.dataset.edge=edge;c.dataset.water=Math.round(waterY);c.dataset.height=S.height;c.dataset.rvt=S.rvt}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stat[S.step];$('explain').innerHTML=desc[S.step];$('heightBlend').setAttribute('aria-pressed',String(S.height));$('rvt').setAttribute('aria-pressed',String(S.rvt));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.height=S.step>=4;S.rvt=S.step>=5;update()});$('slope').oninput=e=>{S.slope=+e.target.value/100;$('slopeOut').textContent=e.target.value+'%';draw()};$('water').oninput=e=>{S.water=+e.target.value/100;$('waterOut').textContent=e.target.value+'%';draw()};$('heightBlend').onclick=()=>{S.height=!S.height;update()};$('rvt').onclick=()=>{S.rvt=!S.rvt;update()};update();addEventListener('resize',draw)})();
</script></body></html>
