<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q65 넉백·래그돌 충돌 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="순간이동 넉백에서 속도 기반 캡슐 이동, 스윕 충돌, 접점 임펄스 래그돌, 파워드 래그돌과 슬립·LOD까지 발전하는 실험"></canvas><div class="hud"><span>Q65 · <b id="stage">위치를 한 번에 밀어냄</b></span><span id="status">벽을 통과하거나 공중에 멈추는 가짜 반응</span></div></div>
<div class="steps" role="group" aria-label="넉백과 래그돌 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>순간이동</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>속도·캡슐</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>스윕·CCD</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>접점 래그돌</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>파워드 래그돌</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>슬립·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="force">충격 임펄스</label><output id="forceOut">68 kN·s</output></div><input id="force" type="range" min="10" max="100" value="68"></div><div><div class="ct"><label for="mass">대상 질량</label><output id="massOut">82 kg</output></div><input id="mass" type="range" min="40" max="220" value="82"></div><div class="toggles" role="group" aria-label="스윕 충돌과 파워드 래그돌 설정"><button id="ccd" aria-pressed="false">스윕·CCD</button><button id="powered" aria-pressed="false">파워드 래그돌</button></div></div>
<div class="metrics"><div class="m"><small>예상 이동 거리</small><strong id="mTravel">6.8 m</strong></div><div class="m"><small>벽 충돌 결과</small><strong id="mWall">통과</strong></div><div class="m"><small>접점 회전</small><strong id="mRoll">0°</strong></div><div class="m"><small>활성 물리 본</small><strong id="mBones">0</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,force:68,mass:82,ccd:false,powered:false,t:0};
const names=['위치를 한 번에 밀어냄','속도와 중력으로 이동','스윕 경로로 벽을 먼저 검출','맞은 부위에 임펄스를 전달','애니메이션 근육을 가진 래그돌','안정되면 슬립·멀면 LOD'],status=['벽을 통과하거나 공중에 멈추는 가짜 반응','캡슐이 바닥과 벽에 물리적으로 반응','빠른 대상도 벽을 건너뛰지 않음','어깨 피격이면 몸이 비틀리며 구름','쓰러지면서도 자세와 무게가 남음','보이는 반응은 유지하고 계산은 줄임'];
const desc=['<b>실패 재현:</b> 충격 방향으로 위치를 순간 변경하고 쓰러지는 애니메이션만 재생합니다. 벽을 통과하고 경사면 위 공중에 멈춰도 경로의 충돌을 알 수 없습니다.','<b>위치 대신 속도:</b> 질량으로 임펄스를 속도로 바꾸고 캡슐 이동에 중력·마찰을 적용합니다. 무거운 대상은 같은 힘에도 덜 날아갑니다.','<b>경로 전체를 검사:</b> 프레임의 시작과 끝 사이를 스윕하고 빠른 이동에는 CCD를 적용합니다. 벽에 닿기 직전 멈춘 뒤 남은 속도를 감쇠합니다.','<b>몸 전체가 같은 방향으로 날지 않습니다:</b> 접점에 임펄스를 주어 어깨가 먼저 밀리고 몸이 회전합니다. 래그돌 관절이 바닥·벽과 충돌하며 자연스럽게 구릅니다.','<b>힘이 빠진 인형을 피하기:</b> 물리 본 위에 애니메이션 자세를 따라가는 약한 근육 토크를 더합니다. 낙하 중 웅크리고 충돌 뒤 힘이 풀리며 겟업 자세로 이어집니다.','<b>안정성과 예산:</b> 속도가 충분히 낮아지면 슬립시켜 지터를 멈추고, 먼 대상은 본 수와 업데이트율을 줄입니다. 결정적 캡슐 위치와 코스메틱 래그돌을 분리합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#52677b',lw=2,d=[]){x.beginPath();x.setLineDash(d);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f5f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const physical=S.step>=1,swept=S.step>=2&&S.ccd,ragdoll=S.step>=3,powered=S.step>=4&&S.powered,lod=S.step>=5,raw=S.force/S.mass*8.2,travel=physical?raw*1.12:raw,wall=physical?(swept?'접촉 정지':'터널링 위험'):'통과',roll=ragdoll?Math.min(165,S.force/S.mass*118):0,bones=ragdoll?(lod?7:powered?18:22):0;return{physical,swept,ragdoll,powered,lod,travel,wall,roll,bones}}
function body(px,py,a,v){x.save();x.translate(px,py);x.rotate(a);x.strokeStyle=v.ragdoll?'#ffd06e':'#70ceff';x.lineCap='round';x.lineWidth=9;x.beginPath();x.arc(0,-43,13,0,7);x.moveTo(0,-28);x.lineTo(0,22);x.moveTo(0,-15);x.lineTo(31,-3);x.moveTo(0,-15);x.lineTo(-25,3);x.moveTo(0,20);x.lineTo(25,48);x.moveTo(0,20);x.lineTo(-25,48);x.stroke();if(v.powered){x.strokeStyle='#8ce3ae';x.lineWidth=2;x.beginPath();x.arc(0,-5,42,-2.2,.8);x.stroke()}x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),ground=h*.76,start=w*.13,wall=w*.68,cycle=(S.t%180)/180,ease=Math.min(1,cycle*1.35),maxTravel=w*.66,desired=start+Math.min(maxTravel,v.travel/10*maxTravel)*ease,hitWall=desired>wall-33,px=v.swept&&hitWall?wall-34:desired,fall=v.physical?Math.sin(Math.min(1,ease)*Math.PI)*h*.19:0,py=v.physical?ground-fall:ground-h*.12,angle=v.ragdoll?ease*v.roll*Math.PI/180:0;x.fillStyle='#102331';x.fillRect(0,0,w,h);line(w*.04,ground,w*.96,ground,'#60768a',3);for(let i=0;i<15;i++)line(w*(.05+i*.065),ground,w*(.08+i*.065),ground+12,'#2b4255',2);x.fillStyle='#41566a';x.fillRect(wall,ground-h*.48,w*.06,h*.48);label('SOLID WALL',wall+w*.03,ground-h*.51,'#9aaabf','center');
if(S.step===0){line(start,ground-h*.05,desired,ground-h*.05,'#ff7f78',4,[8,5]);label('SET POSITION · NO PATH TEST',w*.38,h*.31,'#ff7f78','center')}if(v.physical){line(start,ground-h*.08,desired,ground-h*.08,'#70ceff',2,[6,4]);label(`v = J / m · ${v.travel.toFixed(1)}m PREDICTED`,w*.36,h*.28,'#70ceff','center')}if(v.swept){x.globalAlpha=.2;x.fillStyle='#8ce3ae';x.fillRect(start,ground-h*.38,wall-start-34,h*.34);x.globalAlpha=1;label('CAPSULE SWEEP / CCD',w*.40,h*.37,'#8ce3ae','center');if(hitWall){for(let i=0;i<7;i++)line(wall-33,py-20,wall-75-i*5,py-45+i*12,'#ffd06e',3)}}
body(px,py,angle,v);if(v.ragdoll){const hitX=px+24*Math.cos(angle),hitY=py-15+24*Math.sin(angle);x.fillStyle='#ff7f78';x.beginPath();x.arc(hitX,hitY,7,0,7);x.fill();label(`OFF-CENTER IMPULSE · ROLL ${v.roll.toFixed(0)}°`,px,py-92,'#ffd06e','center')}if(v.powered)label('MUSCLE TORQUE → ANIMATION POSE',px,py+78,'#8ce3ae','center');
const rx=w*.76,ry=h*.18;label('SIMULATION LAYERS',rx,ry-14,'#70ceff');const rows=[['GAMEPLAY CAPSULE',v.physical?'DETERMINISTIC':'TELEPORT'],['PATH COLLISION',v.swept?'SWEEP + CCD':'ENDPOINT ONLY'],['REACTION BODY',v.ragdoll?'RAGDOLL '+v.bones+' BONES':'ANIMATION'],['STABILITY',v.lod?'SLEEP + 1/2 RATE':'FULL UPDATE']];rows.forEach((r,i)=>{const yy=ry+i*h*.12;label(r[0],rx,yy,'#9aaabf');label(r[1],rx+w*.12,yy,r[1].includes('CCD')||r[1].includes('SLEEP')?'#8ce3ae':'#f5f8fc')});if(v.lod){label('NEAR: 7 BONES · FAR: BAKED FALL',w*.82,h*.72,'#8ce3ae','center');label('SLEEP WHEN v < 0.08m/s',w*.82,h*.80,'#8ce3ae','center')}c.dataset.hitWall=String(hitWall);c.dataset.x=px.toFixed(1)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('ccd').setAttribute('aria-pressed',String(S.ccd));$('powered').setAttribute('aria-pressed',String(S.powered));const v=vals();$('mTravel').textContent=v.travel.toFixed(1)+' m';$('mWall').textContent=v.wall;$('mRoll').textContent=v.roll.toFixed(0)+'°';$('mBones').textContent=String(v.bones);draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.ccd=S.step>=2;S.powered=S.step>=4;S.t=0;update()});$('force').oninput=e=>{S.force=+e.target.value;$('forceOut').textContent=S.force+' kN·s';S.t=0;update()};$('mass').oninput=e=>{S.mass=+e.target.value;$('massOut').textContent=S.mass+' kg';S.t=0;update()};$('ccd').onclick=()=>{S.ccd=!S.ccd;S.t=0;update()};$('powered').onclick=()=>{S.powered=!S.powered;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
