<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q81 인터랙티브 풀 벤딩 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="풀 포기별 CPU 거리 검사에서 방향 벤딩 렌더타겟, WPO 샘플링, 시간 복원과 토로이달 스크롤로 발전하는 실험"></canvas><div class="hud"><span>Q81 · <b id="stage">풀마다 캐릭터 거리 계산</b></span><span id="status">수십만 인스턴스 × 액터 수만큼 CPU 검사가 증가</span></div></div>
<div class="steps" role="group" aria-label="인터랙티브 풀 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>개별 거리 검사</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>벤딩 맵 도장</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>WPO 샘플</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>복원·범위 문제</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>감쇠·토로이달</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>바람·폭발 합성</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="recovery">복원 속도</label><output id="recoveryOut">45%</output></div><input id="recovery" type="range" min="0" max="100" value="45"></div><div><div class="ct"><label for="speed">이동 속도</label><output id="speedOut">55%</output></div><input id="speed" type="range" min="10" max="100" value="55"></div><div class="toggles"><button id="explosion" aria-pressed="false">방사형 폭발 도장</button><button id="map" aria-pressed="false">벤딩 맵 보기</button></div></div>
<div class="metrics"><div class="m"><small>CPU 거리 검사 / frame</small><strong id="mChecks">300,000회</strong></div><div class="m"><small>눌린 셀 / 최대 눌림</small><strong id="mBent">0 / 0%</strong></div><div class="m"><small>풀 셰이더 샘플</small><strong id="mSamples">0회</strong></div><div class="m"><small>토로이달 랩</small><strong id="mWrap">0회</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),GW=30,GH=14,S={step:0,recovery:.45,speed:.55,showMap:false,t:0,px:.16,wraps:0,field:[]};
const names=['각 풀 인스턴스에서 캐릭터 거리 검사','플레이어 위치를 방향 벡터 텍스처에 스플랫','모든 풀 정점이 자기 월드 위치에서 맵 샘플','도장은 남고 유한 텍스처 범위를 벗어남','이전 맵 감쇠 + 플레이어 중심 토로이달 스크롤','바람 WPO 위에 이동·말·폭발 스플랫 합성'];
const status=['수십만 인스턴스 × 액터 수만큼 CPU 검사가 증가','CPU는 위치·반경·방향 몇 개만 전달','인스턴싱을 유지한 채 GPU에서 함께 눕는다','지나간 풀은 영원히 누워 있고 새 영역이 없다','지나간 자리는 일어나고 가장자리만 재사용','눌린 풀도 바람에 흔들리고 폭발은 바깥으로 눕힘'];
const desc=['<b>스케일 실패:</b> 30만 포기가 매 프레임 플레이어 거리를 재고 개별 트랜스폼을 갱신한다고 가정합니다. 인스턴싱을 잃고 CPU 검사가 선형으로 폭증합니다.','<b>오브젝트 대신 공간:</b> 플레이어의 위치·반경·이동 방향을 위에서 본 RG 벤딩 맵에 도장 찍습니다. 맵 보기 버튼으로 풀 아래에 쌓이는 방향 필드를 확인하세요.','<b>GPU가 읽기만:</b> 각 풀 정점은 자기 월드 위치를 UV로 바꿔 같은 맵을 한 번 샘플하고 WPO로 눕습니다. CPU는 풀 포기 수와 무관하게 스플랫 몇 개만 보냅니다.','<b>두 번째 실패:</b> 도장을 계속 누적하지만 감쇠하지 않아 지나간 길이 영원히 눕습니다. 유한한 맵도 고정돼 플레이어가 오른쪽 경계를 넘으면 반응 영역을 벗어납니다.','<b>회복과 무한 월드 근사:</b> 이전 프레임 맵을 복원 속도만큼 감쇠하고, 플레이어가 경계에 닿으면 열을 감아 돌려 새 가장자리만 비웁니다. 이동해도 발밑 해상도가 유지됩니다.','<b>여러 힘의 합성:</b> 바람은 모든 풀의 기본 흔들림, 이동 도장은 국소 방향 벡터, 폭발은 방사형 벡터를 더합니다. 폭발 버튼을 누르면 중심에서 바깥으로 쓰러지는 링이 생깁니다.'];
function reset(){S.field=Array.from({length:GW*GH},()=>({x:0,y:0,m:0}));S.px=.16;S.wraps=0;S.t=0}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function stamp(cx,cy,rad,dx,dy,radial=false){for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const qx=(gx+.5)/GW,qy=(gy+.5)/GH,ddx=qx-cx,ddy=qy-cy,d=Math.hypot(ddx,ddy);if(d<rad){const f=(1-d/rad),a=S.field[gx+gy*GW],vx=radial?ddx/(d||1):dx,vy=radial?ddy/(d||1):dy;a.x=vx;a.y=vy;a.m=Math.min(1,a.m+f*.7)}}}
function shift(){for(let gy=0;gy<GH;gy++){const row=S.field.splice(gy*GW,4);S.field.splice(gy*GW+GW-4,0,...row.map(()=>({x:0,y:0,m:0})))}S.wraps++;S.px=.22}
function simulate(){S.t++;S.px+=.0008*S.speed;if(S.step>=4&&S.px>.82)shift();else if(S.px>1.06)S.px=.08;if(S.step>=1)stamp(S.px,.56,.095,1,0,false);if(S.step>=4){const fade=.0015+.006*S.recovery;for(const a of S.field)a.m=Math.max(0,a.m-fade)}}
function values(){const bent=S.field.filter(a=>a.m>.08).length,peak=S.field.reduce((n,a)=>Math.max(n,a.m),0);return{bent,peak}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=values(),ox=w*.04,oy=h*.18,fw=w*.92,fh=h*.67,cw=fw/GW,ch=fh/GH;x.fillStyle='#0e1a1a';x.fillRect(0,0,w,h);x.fillStyle='#17291e';x.fillRect(ox,oy,fw,fh);if(S.showMap||S.step===1){for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const a=S.field[gx+gy*GW];if(a.m>.02){x.fillStyle=`rgba(112,206,255,${a.m*.55})`;x.fillRect(ox+gx*cw,oy+gy*ch,cw+1,ch+1)}}}for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const a=S.field[gx+gy*GW],px=ox+(gx+.5)*cw,py=oy+(gy+.8)*ch,wind=S.step>=5?Math.sin(S.t*.05+gx*.7)*4:0,bx=S.step>=2?a.x*a.m*13:0,by=S.step>=2?a.y*a.m*7:0;x.strokeStyle=a.m>.1?'#8ce3ae':'#5f9a61';x.lineWidth=1.2;x.beginPath();x.moveTo(px,py);x.lineTo(px+wind+bx,py-ch*.65+by);x.stroke()}x.fillStyle='#ffd06e';x.beginPath();x.arc(ox+S.px*fw,oy+.56*fh,10,0,Math.PI*2);x.fill();x.strokeStyle='#ffd06e';x.lineWidth=2;x.beginPath();x.moveTo(ox+S.px*fw-20,oy+.56*fh);x.lineTo(ox+S.px*fw+25,oy+.56*fh);x.stroke();if(S.step===0){x.fillStyle='rgba(255,127,120,.14)';x.fillRect(ox,oy,fw,fh);x.fillStyle='#ff7f78';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText('300,000 GRASS × ACTOR DISTANCE CHECK',w*.37,h*.12)}else{x.fillStyle='#70ceff';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText('WORLD → UV → RG BEND VECTOR → WPO',w*.39,h*.12)}if(S.step>=4){x.strokeStyle='#70ceff';x.setLineDash([5,5]);x.strokeRect(ox,oy,fw,fh);x.setLineDash([]);x.fillStyle='#70ceff';x.fillText(`TOROIDAL WINDOW · WRAP ${S.wraps}`,w*.41,h*.9)}$('mChecks').textContent=S.step===0?'300,000회':S.step<2?'1회 스플랫':'0회';$('mBent').textContent=v.bent+' / '+(v.peak*100).toFixed(0)+'%';$('mSamples').textContent=S.step>=2?'300,000회':'0회';$('mWrap').textContent=S.wraps+'회';c.dataset.bent=v.bent;c.dataset.peak=v.peak.toFixed(3);c.dataset.wraps=S.wraps;c.dataset.player=S.px.toFixed(3);c.dataset.checks=S.step===0?'300000':S.step<2?'1':'0'}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('map').setAttribute('aria-pressed',String(S.showMap));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.showMap=S.step===1;reset();update()});$('recovery').oninput=e=>{S.recovery=+e.target.value/100;$('recoveryOut').textContent=e.target.value+'%';update()};$('speed').oninput=e=>{S.speed=+e.target.value/100;$('speedOut').textContent=e.target.value+'%';update()};$('explosion').onclick=()=>{stamp(.58,.52,.23,0,0,true);update()};$('map').onclick=()=>{S.showMap=!S.showMap;update()};function tick(){simulate();draw();requestAnimationFrame(tick)}reset();update();tick();addEventListener('resize',draw);
})();
</script></body></html>
