<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q32 글로벌 윈드 필드 단계형 실험실</title>
<style>
:root{--bg:#07110d;--panel:#102019;--line:#2a493a;--ink:#f2fff7;--muted:#96b2a2;--wind:#6ee7ad;--gust:#bde97c;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10261b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07110ddd}.hud b{color:var(--wind)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#527a64}button:focus-visible,input:focus-visible{outline:2px solid var(--wind);outline-offset:2px}button[aria-pressed=true]{background:var(--wind);border-color:var(--wind);color:#06150e}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--wind);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--wind)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#759181;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="제각각 사인파에서 전역 바람 벡터, 위치별 돌풍, 계층 강성과 로컬 풀 눌림·망토 LOD까지 쌓는 바람 장면"></canvas><div class="hud"><span>Q32 · <b id="stage">오브젝트별 사인파</b></span><span id="status">각자 다른 방향으로 진동</span></div></div>
<div class="steps" role="group" aria-label="글로벌 바람 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>제각각 사인파</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>전역 바람 벡터</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>판때기 바람 실패</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>월드 돌풍 필드</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>계층·강성 마스크</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>로컬 눌림·천 LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="direction">바람 방향</label><output id="directionOut">25°</output></div><input id="direction" type="range" min="-180" max="180" value="25"></div><div><div class="ct"><label for="strength">전역 세기</label><output id="strengthOut">65%</output></div><input id="strength" type="range" min="0" max="100" value="65"></div><div class="toggles" role="group" aria-label="돌풍과 로컬 상호작용 옵션"><button id="gust" aria-pressed="false">월드 돌풍 필드</button><button id="local" aria-pressed="false">캐릭터 풀 눌림</button></div></div>
<div class="metrics"><div class="m"><small>방향 정렬도</small><strong id="mAlign">28%</strong></div><div class="m"><small>국소 세기 범위</small><strong id="mRange">65–65%</strong></div><div class="m"><small>눌림 맵 반경</small><strong id="mBend">0 m</strong></div><div class="m"><small>풀 천 시뮬 슬롯</small><strong id="mCloth">0</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,dir:25,strength:.65,gust:false,local:false,t:0},names=['per-object sine offsets','shared global wind vector','uniform phase slab','advected world-space gust field','trunk / branch / leaf stiffness','local bend map + cloth LOD'],desc=['<b>문제 재현:</b> 각 오브젝트가 자기 사인파·방향으로 흔들리면 풀은 왼쪽, 깃발은 오른쪽으로 움직여 바람이 아니라 제각각 진동처럼 보입니다.','<b>방향의 일관성:</b> 풀·나무·깃발·망토와 게임 로직이 같은 글로벌 방향·세기 벡터를 읽습니다. 방향 슬라이더를 돌리면 전부 함께 눕습니다.','<b>반대 실패:</b> 모든 정점이 같은 위상·세기로 움직이면 풀밭 전체가 통짜 판처럼 기울고 돌풍이 지나가는 결이 없습니다.','<b>공간을 이동하는 세기:</b> 저주파 gust 텍스처를 월드 위치로 샘플하고 바람 방향으로 이류해, 밝은 돌풍 띠가 풀밭을 차례로 훑습니다.','<b>같은 바람, 다른 강성:</b> 뿌리는 고정하고 줄기→가지→잎으로 주파수와 진폭을 나눕니다. 풀·깃발도 고정점에서 멀수록 크게 반응합니다.','<b>전역과 국소를 합성:</b> 캐릭터 주변 벤딩 맵은 밟힌 풀만 눕히고 회복시킵니다. 망토는 가까운 하나만 PBD, 중·원거리는 본/버텍스 LOD를 씁니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2fff7'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(4,13,8,.84)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function windAt(px,i,w){const global=Math.sin(S.dir*Math.PI/180)*S.strength,independent=S.step===0?Math.sin(S.t*.035+i*1.7)*S.strength:global,field=S.gust&&S.step>=3?.45*Math.sin(px/w*13-S.t*.025):0;return independent+field}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,hier=S.step>=4,local=S.local&&S.step>=5;x.fillStyle='#8ec5cc';x.fillRect(0,0,w,h*.60);x.fillStyle='#315d32';x.fillRect(0,h*.60,w,h*.40);if(S.gust&&S.step>=3){for(let i=0;i<5;i++){let gx=(i*270+S.t*2.2)%(w+240)-120,g=x.createLinearGradient(gx-90,0,gx+90,0);g.addColorStop(0,'rgba(189,233,124,0)');g.addColorStop(.5,'rgba(189,233,124,.22)');g.addColorStop(1,'rgba(189,233,124,0)');x.fillStyle=g;x.fillRect(gx-90,h*.60,180,h*.40)}}const playerX=w*(.46+.16*Math.sin(S.t*.012));for(let i=0;i<72;i++){let px=i*w/71,base=h*.89,len=32+(i%5)*6,b=windAt(px,i,w),near=local?Math.max(0,1-Math.abs(px-playerX)/(w*.11)):0,tipX=px+b*len*.72+(px<playerX?-1:1)*near*len*.8,tipY=base-len+near*15;x.strokeStyle=i%3?'#72b54e':'#9ccb61';x.lineWidth=2;x.beginPath();x.moveTo(px,base);x.quadraticCurveTo(px+b*len*.25,base-len*.48,tipX,tipY);x.stroke()}const tx=w*.72,base=h*.61,trunkB=windAt(tx,4,w);x.strokeStyle='#4d3826';x.lineWidth=15;x.beginPath();x.moveTo(tx,base);x.quadraticCurveTo(tx+trunkB*(hier?12:30),h*.42,tx+trunkB*(hier?22:45),h*.25);x.stroke();for(let i=0;i<7;i++){let by=h*(.27+i*.035),side=i%2?-1:1,phase=hier?Math.sin(S.t*.07+i)*12:trunkB*30;x.strokeStyle='#38582e';x.lineWidth=5;x.beginPath();x.moveTo(tx+trunkB*18,by);x.lineTo(tx+side*55+trunkB*30+phase,by-35);x.stroke();x.fillStyle='#4d8a3c';x.beginPath();x.arc(tx+side*55+trunkB*30+phase,by-35,15,0,7);x.fill()}const pole=w*.18;x.fillStyle='#4c4f50';x.fillRect(pole,h*.24,5,h*.37);let fb=windAt(pole,8,w),fw=85+Math.abs(fb)*35;x.fillStyle='#d46c57';x.beginPath();x.moveTo(pole+5,h*.26);x.quadraticCurveTo(pole+fw*.55,h*.25+fb*20,pole+fw,h*.31+fb*35);x.lineTo(pole+fw*.9,h*.42+fb*28);x.quadraticCurveTo(pole+fw*.45,h*.36+fb*15,pole+5,h*.38);x.closePath();x.fill();x.fillStyle='#e8bd8d';x.beginPath();x.arc(playerX,h*.56,10,0,7);x.fill();x.strokeStyle='#263944';x.lineWidth=5;x.beginPath();x.moveTo(playerX,h*.58);x.lineTo(playerX,h*.70);x.stroke();let cape=windAt(playerX,11,w);x.fillStyle='#7a4059';x.beginPath();x.moveTo(playerX,h*.59);x.quadraticCurveTo(playerX-30+cape*35,h*.64+Math.sin(S.t*.09)*8,playerX-45+cape*65,h*.76);x.lineTo(playerX-5,h*.70);x.closePath();x.fill();if(S.step===0)tag('NO SHARED DIRECTION',w*.05,h*.52,'#ff8179');if(S.step>=1)tag('GLOBAL WIND '+S.dir+'° · ALL SYSTEMS',w*.04,h*.52,'#6ee7ad');if(S.step===2)tag('SAME PHASE → RIGID SLAB',w*.55,h*.52,'#ff8179');if(S.gust&&S.step>=3)tag('ADVECTED GUST FIELD',w*.40,h*.82,'#bde97c');if(hier)tag('ROOT 0 → BRANCH → LEAF FLUTTER',w*.62,h*.18,'#f2fff7');if(local){x.strokeStyle='#ffcf7e';x.setLineDash([5,4]);x.beginPath();x.arc(playerX,h*.82,w*.11,0,7);x.stroke();x.setLineDash([]);tag('LOCAL BEND RT · RECOVERY',playerX-w*.07,h*.78,'#ffcf7e');tag('CAPE: PBD / BONE / VERTEX LOD',w*.34,h*.48,'#f2fff7')}}
function metrics(){const align=S.step===0?28:100,range=S.gust&&S.step>=3?`${Math.max(0,Math.round(S.strength*100-45))}–${Math.min(100,Math.round(S.strength*100+35))}%`:`${Math.round(S.strength*100)}–${Math.round(S.strength*100)}%`;$('mAlign').textContent=align+'%';$('mRange').textContent=range;$('mBend').textContent=S.local&&S.step>=5?'3.5 m':'0 m';$('mCloth').textContent=S.step>=5?'1 / 200':'0'}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['각자 다른 방향으로 진동','세계 방향 일치','동시 위상 판때기','돌풍 결 이동','부위별 강성 반응','전역+국소·LOD'][S.step];$('explain').innerHTML=desc[S.step];$('gust').setAttribute('aria-pressed',String(S.gust));$('local').setAttribute('aria-pressed',String(S.local));metrics();draw()}function tick(){S.t+=1;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.gust=S.step>=3;S.local=S.step===5;ui()});$('direction').oninput=e=>{S.dir=+e.target.value;$('directionOut').textContent=e.target.value+'°';ui()};$('strength').oninput=e=>{S.strength=+e.target.value/100;$('strengthOut').textContent=e.target.value+'%';ui()};$('gust').onclick=()=>{S.gust=!S.gust;ui()};$('local').onclick=()=>{S.local=!S.local;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
