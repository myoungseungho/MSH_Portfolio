<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q27 에어리얼 퍼스펙티브 단계형 실험실</title>
<style>
:root{--bg:#07101a;--panel:#111d29;--line:#294052;--ink:#edf7ff;--muted:#91a9ba;--blue:#68b8ff;--sun:#ffd486;--red:#ff7d78}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#091827}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101add}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#4d718b}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06121d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#70899c;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="회색 거리 안개에서 높이 안개, 트랜스미턴스, 레일리·미 산란과 하늘 일치까지 쌓는 산악 원경"></canvas><div class="hud"><span>Q27 · <b id="stage">거리 단색 안개</b></span><span id="status">산과 하늘이 따로 놈</span></div></div>
<div class="steps" role="group" aria-label="에어리얼 퍼스펙티브 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>회색 거리 안개</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>높이 안개</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>트랜스미턴스</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>레일리 산란</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>미·태양 위상</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>하늘·froxel 통합</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="visibility">가시거리</label><output id="visibilityOut">55%</output></div><input id="visibility" type="range" min="15" max="100" value="55"></div><div><div class="ct"><label for="sunAngle">태양 시선각</label><output id="sunAngleOut">35°</output></div><input id="sunAngle" type="range" min="-70" max="70" value="35"></div><div class="toggles" role="group" aria-label="높이 적분과 하늘 통일 옵션"><button id="heightFog" aria-pressed="false">높이 적분</button><button id="unifySky" aria-pressed="false">하늘 LUT 통일</button></div></div>
<div class="metrics"><div class="m"><small>원경 트랜스미턴스</small><strong id="mTrans">31%</strong></div><div class="m"><small>봉우리 선명도</small><strong id="mPeak">31%</strong></div><div class="m"><small>지평선 색 이음매</small><strong id="mSeam">18%</strong></div><div class="m"><small>태양 헤일로</small><strong id="mHalo">없음</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,visibility:.55,sunAngle:35,heightFog:false,unifySky:false};
const names=['gray distance fog','exponential height fog','Beer–Lambert transmittance','Rayleigh in-scattering','Mie phase halo','shared sky / froxel LUT'];
const desc=['<b>문제 재현:</b> 깊이만 보고 회색을 덧칠하면 산 정상과 계곡이 똑같이 흐리고, 푸른 하늘과 회색 산 사이에 띠가 생깁니다.','<b>높이를 적분:</b> 저지대 밀도를 지수적으로 높여 계곡에 안개가 고이고 봉우리는 빠져나옵니다. 아직 안개색은 고정이라 시간대와 맞지 않습니다.','<b>먼 물체색을 먼저 지움:</b> Beer–Lambert 트랜스미턴스로 경로가 길수록 산의 고유색·대비가 지수적으로 소멸합니다.','<b>공기가 하늘빛을 채움:</b> 짧은 파장의 레일리 인스캐터링을 더해 먼 산일수록 파랗고 옅게 겹칩니다. 최종색은 scene × T + atmosphere입니다.','<b>태양 방향성:</b> 미 산란 위상함수로 해를 바라볼 때만 따뜻하고 넓은 헤일로가 강해집니다. 슬라이더로 시선각에 따른 변화를 확인하세요.','<b>같은 대기로 수렴:</b> 불투명 산과 하늘이 같은 LUT를 사용하고 최원거리 froxel이 하늘값에 수렴해, 지평선의 색 이음매가 사라집니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function lerp(a,b,t){return a+(b-a)*t}function rgb(a,b,t){return `rgb(${lerp(a[0],b[0],t)|0},${lerp(a[1],b[1],t)|0},${lerp(a[2],b[2],t)|0})`}
function tag(text,px,py,color='#edf7ff'){x.font='600 9px ui-monospace,monospace';const tw=x.measureText(text).width;x.fillStyle='rgba(4,12,20,.82)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=color;x.fillText(text,px,py)}
function ridge(base,amp,seed,w,h){x.beginPath();x.moveTo(0,h);for(let i=0;i<=80;i++){const px=i*w/80,py=base+Math.sin(i*.38+seed)*amp*.32+Math.sin(i*.13+seed*2)*amp*.55-Math.abs(Math.sin(i*.21+seed))*amp*.36;x.lineTo(px,py)}x.lineTo(w,h);x.closePath()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,physical=S.step>=2,rayleigh=S.step>=3,mie=S.step>=4,unified=S.unifySky&&S.step>=5,heightOn=S.heightFog&&S.step>=1;
const sky=x.createLinearGradient(0,0,0,h*.72);sky.addColorStop(0,rayleigh?'#2869a1':'#406478');sky.addColorStop(1,unified?'#9cc9e5':rayleigh?'#83b7d8':'#a0a9a8');x.fillStyle=sky;x.fillRect(0,0,w,h);
const sunX=w*(.5+S.sunAngle/180),sunY=h*.22,halo=mie*Math.max(0,1-Math.abs(S.sunAngle)/80);if(mie){const g=x.createRadialGradient(sunX,sunY,3,sunX,sunY,140+halo*80);g.addColorStop(0,'rgba(255,241,190,.95)');g.addColorStop(.15,`rgba(255,211,134,${.38+.4*halo})`);g.addColorStop(1,'rgba(255,211,134,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}x.fillStyle='#fff0bd';x.beginPath();x.arc(sunX,sunY,9,0,7);x.fill();
const bases=[h*.45,h*.54,h*.64,h*.78],amps=[h*.12,h*.14,h*.13,h*.18],orig=[[70,84,70],[64,88,66],[58,89,59],[48,83,47]];for(let k=0;k<4;k++){const distance=(4-k)/4,fog=Math.min(.94,(1-S.visibility)*.55+distance*.52),T=physical?Math.exp(-fog*2.15):1-fog,peakBoost=heightOn?.17:0,colorAtm=rayleigh?[104,169,213]:[145,151,151],blend=Math.max(0,Math.min(.95,1-T-peakBoost*(1-distance)));ridge(bases[k],amps[k],k*1.7,w,h);x.fillStyle=rgb(orig[k],colorAtm,blend);x.fill();if(heightOn){const vg=x.createLinearGradient(0,bases[k]-amps[k],0,bases[k]+h*.18);vg.addColorStop(0,'rgba(177,211,225,0)');vg.addColorStop(1,rayleigh?'rgba(126,184,217,.55)':'rgba(170,176,176,.5)');x.fillStyle=vg;x.fill()}}
if(S.step===0){tag('DISTANCE → CONSTANT GRAY',w*.05,h*.88,'#ff7d78');x.strokeStyle='#ff7d78';x.setLineDash([5,5]);x.strokeRect(1,h*.57,w-2,3);x.setLineDash([])}if(S.step>=1)tag(heightOn?'VALLEY DENSE · PEAK CLEAR':'HEIGHT INTEGRATION OFF',w*.05,h*.82,heightOn?'#68b8ff':'#ff7d78');if(S.step>=2){x.strokeStyle='#edf7ff';x.lineWidth=1.5;x.beginPath();x.moveTo(w*.08,h*.73);x.lineTo(w*.78,h*.48);x.stroke();for(let i=1;i<8;i++){x.fillStyle=`rgba(255,255,255,${1-i*.1})`;x.fillRect(w*(.08+i*.087),h*(.73-i*.031),12,3)}tag('SCENE × T',w*.11,h*.69)}if(S.step>=3)tag('＋ RAYLEIGH IN-SCATTERING',w*.58,h*.37,'#a9d8ff');if(S.step>=4)tag('MIE PHASE · SUNWARD',Math.min(w*.70,sunX+20),sunY+35,'#ffd486');if(S.step>=5){x.strokeStyle=unified?'#68b8ff':'#ff7d78';x.lineWidth=3;x.beginPath();x.moveTo(0,h*.55);x.lineTo(w,h*.55);x.stroke();tag(unified?'SAME LUT · SEAM 0%':'SKY / GEOMETRY LUT MISMATCH',w*.48,h*.53,unified?'#68b8ff':'#ff7d78')}}
function metrics(){const physical=S.step>=2,farFog=Math.min(.94,(1-S.visibility)*.55+.52),t=physical?Math.exp(-farFog*2.15):1-farFog,peak=Math.min(1,t+(S.heightFog&&S.step>=1?.28:0)),seam=S.step>=5?(S.unifySky?0:14):S.step>=3?9:18,halo=S.step>=4?Math.max(0,100-Math.abs(S.sunAngle)*1.25):0;$('mTrans').textContent=Math.round(t*100)+'%';$('mPeak').textContent=Math.round(peak*100)+'%';$('mSeam').textContent=seam+'%';$('mHalo').textContent=S.step<4?'없음':Math.round(halo)+'%'}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['산과 하늘이 따로 놈','계곡층 형성','원래 색 소멸','푸른 원경 형성','태양 방향성 추가','지평선 연속'][S.step];$('explain').innerHTML=desc[S.step];$('heightFog').setAttribute('aria-pressed',String(S.heightFog));$('unifySky').setAttribute('aria-pressed',String(S.unifySky));metrics();draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.heightFog=S.step>=1;S.unifySky=S.step===5;ui()});$('visibility').oninput=e=>{S.visibility=+e.target.value/100;$('visibilityOut').textContent=e.target.value+'%';ui()};$('sunAngle').oninput=e=>{S.sunAngle=+e.target.value;$('sunAngleOut').textContent=e.target.value+'°';ui()};$('heightFog').onclick=()=>{S.heightFog=!S.heightFog;ui()};$('unifySky').onclick=()=>{S.unifySky=!S.unifySky;ui()};ui();addEventListener('resize',draw);
})();
</script></body></html>
