<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q51 애니메이션-래그돌 인계 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--blue:#72c9ff;--amber:#ffd17f;--green:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:10px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.5;min-height:38px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:8px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="고정 죽음 애니메이션에서 물리 바디와 임펄스, 모멘텀 상속, 애니메이션-물리 블렌드, 파워드 래그돌과 슬립 예산으로 발전하는 과정"></canvas><div class="hud"><span>Q51 · <b id="stage">고정 죽음 클립</b></span><span id="status">평지용 포즈가 계단을 무시</span></div></div>
<div class="steps" role="group" aria-label="래그돌 인계 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>죽음 클립</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>순수 래그돌</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>임펄스 상속</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>점진 블렌드</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>파워드 모터</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>슬립·LOD</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="angle">타격 방향</label><output id="angleOut">32°</output></div><input id="angle" type="range" min="-80" max="80" value="32"></div><div><div class="ct"><label for="weight">물리 가중치</label><output id="weightOut">70%</output></div><input id="weight" type="range" min="0" max="100" value="70"></div><div class="toggles" role="group" aria-label="파워드 모터와 시뮬 예산 설정"><button id="motor" aria-pressed="false">PD 근육 모터</button><button id="budget" aria-pressed="false">슬립+LOD 예산</button></div></div>
<div class="metrics"><div class="m"><small>전환 포즈 점프</small><strong id="mPop">48 cm</strong></div><div class="m"><small>타격 방향 보존</small><strong id="mImpulse">0%</strong></div><div class="m"><small>관절 근긴장</small><strong id="mMuscle">0%</strong></div><div class="m"><small>활성 물리 바디</small><strong id="mBodies">0</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,angle:32,weight:70,motor:false,budget:false,t:0};
const names=['고정 죽음 클립','한 프레임 순수 래그돌','맞은 본에 임펄스와 속도 상속','애님 포즈에서 물리 포즈로 램프','목표 포즈를 좇는 PD 근육','안착 뒤 슬립하고 먼 바디 단순화'],status=['평지용 포즈가 계단을 무시','지형에는 닿지만 전환 팝·흐물함','타격과 달리던 관성이 죽음에 연결','통제권을 몇 프레임에 걸쳐 인계','관절이 버티다 힘을 놓음','켜진 솔버 수를 예산으로 제한'];
const desc=['<b>문제 재현:</b> 평지에서 만든 죽음 클립은 계단을 모르므로 몸이 단을 관통하거나 허공에 뜨고, 타격 방향과 상관없이 같은 포즈를 반복합니다.','<b>물리 접촉:</b> 본마다 물리 바디와 관절을 켜면 계단에 걸쳐 안착합니다. 하지만 0→100% 즉시 전환은 포즈가 튀고 몸이 힘없는 인형처럼 접힙니다.','<b>연속성 복원:</b> 맞은 본에 방향성 임펄스를 주고 죽기 직전 달리기 속도를 각 바디에 상속합니다. 슬라이더로 충격 방향이 쓰러짐을 바꾸는지 확인하세요.','<b>이음매 해결:</b> 마지막 애님 포즈에서 물리 가중치를 점진적으로 올리고 초기 속도를 클램프합니다. 가중치를 움직여 포즈 점프가 줄어드는 과정을 보세요.','<b>근육 추가:</b> PD 모터가 관절을 목표 애님 포즈로 되끌어 비틀거리며 버티게 합니다. 토글을 끄면 같은 힘에도 관절이 흐물하게 접힙니다.','<b>예산 관리:</b> 가까운 활성 시체만 전신 솔버로 두고, 안착하면 Sleep·먼 거리는 LOD 바디로 굳힙니다. 예산 토글로 활성 바디 수 변화를 비교하세요.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(ax,ay,bx,by,co='#526b79',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=co;x.lineWidth=lw;x.stroke();x.setLineDash([])}
function label(t,px,py,co='#f2f8fc',align='left'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,11,16,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=co;x.fillText(t,px,py);x.textAlign='left'}
function node(t,px,py,w,on,bad){x.beginPath();x.roundRect(px,py,w,27,5);x.fillStyle=bad?'#4b2428':on?'#173f45':'#1d303c';x.fill();x.strokeStyle=bad?'#ff8179':on?'#8ce4b4':'#526b79';x.stroke();x.fillStyle=bad?'#ffb1ac':on?'#8ce4b4':'#c7d5de';x.font='600 9px ui-monospace,Consolas,monospace';x.textAlign='center';x.fillText(t,px+w/2,py+17);x.textAlign='left'}
function vals(){const blended=S.step>=3,controlled=S.step>=4&&S.motor,sleep=S.step>=5&&S.budget;return{pop:S.step<1?48:S.step<3?31:Math.max(1,31*(1-S.weight/100)),impulse:S.step>=2?100:0,muscle:controlled?Math.round(25+S.weight*.65):0,bodies:S.step<1?0:sleep?6:18,sleep}}
function pipeline(w,h,v){const ox=w*.04,oy=h*.19,gw=w*.38;label('CONTROL HANDOFF',ox,oy-19,'#72c9ff');const items=[['ANIM POSE',0],['PHYSICS ON',1],['IMPULSE + v',2],['WEIGHT RAMP',3],['PD MOTOR',4],['SLEEP / LOD',5]];items.forEach((it,i)=>{const y=oy+i*h*.105;node(it[0],ox,y,gw*.38,S.step>=it[1],S.step===1&&i===1);if(i)line(ox+gw*.19,y-10,ox+gw*.19,y,'#526b79')});const tx=ox+gw*.49;label('OWNERSHIP',tx,oy-19,'#97aab8');for(let i=0;i<6;i++){const y=oy+i*h*.105;if(i>S.step){x.fillStyle='#263b47';x.fillRect(tx,y,gw*.43,12);label('NOT ACTIVE',tx+gw*.215,y+30,'#758b9b','center');continue}const anim=i<3?Math.max(0,100-S.step*25):Math.max(0,100-S.weight),phys=100-anim;x.fillStyle='#263b47';x.fillRect(tx,y,gw*.43,12);x.fillStyle='#72c9ff';x.fillRect(tx,y,gw*.43*anim/100,12);x.fillStyle='#8ce4b4';x.fillRect(tx+gw*.43*anim/100,y,gw*.43*phys/100,12);label(`${anim}% A / ${phys}% P`,tx+gw*.215,y+30,'#f2f8fc','center')}}
function stairs(w,h){const sx=w*.48,base=h*.82,sw=w*.49,steps=6;for(let i=0;i<steps;i++){const px=sx+i*sw/steps,py=base-i*h*.065;x.fillStyle=i%2?'#253b47':'#2d4654';x.fillRect(px,py,sw/steps+1,h-py);line(px,py,px+sw/steps,py,'#78909c',2)}}
function body(w,h,v){const a=S.angle*Math.PI/180,phase=v.sleep?.35:(S.t%180)/180,baseX=v.sleep?w*.72:w*.72+Math.cos(a)*phase*46,baseY=v.sleep?h*.58:h*.45+Math.sin(a)*phase*34,phys=S.step===0?0:S.step<3?1:S.weight/100,flop=phys*(S.motor&&S.step>=4?.30:1),j=v.sleep?0:Math.sin(S.t*.08);let torso=S.step===0?Math.PI/2:v.sleep?1.08:a*.55+flop*(.65+j*.09),hipX=baseX+Math.sin(torso)*50,hipY=baseY+Math.cos(torso)*50;label(S.step===0?'AUTHORED FLAT-GROUND POSE':'RUNTIME PHYSICS BODIES',w*.53,h*.15,S.step===0?'#ff8179':'#8ce4b4');if(S.step>=2&&!v.sleep){line(baseX-90*Math.cos(a),baseY+90*Math.sin(a),baseX,baseY,'#ffd17f',4);label(`IMPULSE ${S.angle}°`,baseX-88*Math.cos(a),baseY+90*Math.sin(a)-12,'#ffd17f')}
x.lineCap='round';line(baseX,baseY,hipX,hipY,S.motor&&S.step>=4?'#8ce4b4':'#72c9ff',15);x.fillStyle='#f2f8fc';x.beginPath();x.arc(baseX-Math.sin(torso)*23,baseY-Math.cos(torso)*23,15,0,7);x.fill();const armSwing=.8*flop+j*.18;line(baseX+5,baseY+12,baseX+55*Math.cos(torso+armSwing),baseY+55*Math.sin(torso+armSwing),'#72c9ff',10);line(baseX,baseY+15,baseX-50*Math.cos(torso-armSwing),baseY-50*Math.sin(torso-armSwing),'#72c9ff',10);const knee1={x:hipX+45*Math.cos(torso+flop),y:hipY+45*Math.sin(torso+flop)},knee2={x:hipX-37*Math.cos(torso-flop*.7),y:hipY-37*Math.sin(torso-flop*.7)};line(hipX,hipY,knee1.x,knee1.y,'#72c9ff',12);line(knee1.x,knee1.y,knee1.x+38,knee1.y+24,'#72c9ff',11);line(hipX,hipY,knee2.x,knee2.y,'#72c9ff',12);line(knee2.x,knee2.y,knee2.x-25,knee2.y+34,'#72c9ff',11);if(S.step===0)label('STAIRS PENETRATION',w*.74,h*.77,'#ff8179','center');if(S.step===1)label('ONE-FRAME POP + LIMP COLLAPSE',w*.72,h*.24,'#ff8179','center');if(S.step>=4)label(S.motor?'MOTOR PULLS TOWARD TARGET POSE':'MOTOR OFF · JOINTS GO LIMP',w*.73,h*.24,S.motor?'#8ce4b4':'#ff8179','center');if(S.step>=5)label(v.sleep?'SETTLED → 6-BODY LOD / SLEEP':'18 BODIES STILL SOLVING',w*.73,h*.70,v.sleep?'#8ce4b4':'#ff8179','center')}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals();x.clearRect(0,0,w,h);x.fillStyle='#132631';x.fillRect(0,0,w,h);pipeline(w,h,v);stairs(w,h);body(w,h,v)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('motor').setAttribute('aria-pressed',String(S.motor));$('budget').setAttribute('aria-pressed',String(S.budget));const v=vals();$('mPop').textContent=v.pop.toFixed(0)+' cm';$('mImpulse').textContent=v.impulse+'%';$('mMuscle').textContent=v.muscle+'%';$('mBodies').textContent=String(v.bodies);draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.motor=S.step>=4;S.budget=S.step>=5;update()});$('angle').oninput=e=>{S.angle=+e.target.value;$('angleOut').textContent=S.angle+'°';update()};$('weight').oninput=e=>{S.weight=+e.target.value;$('weightOut').textContent=S.weight+'%';update()};$('motor').onclick=()=>{S.motor=!S.motor;update()};$('budget').onclick=()=>{S.budget=!S.budget;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
