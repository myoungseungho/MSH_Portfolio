<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q69 낙하감 카메라 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10202d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="캐릭터와 함께 떨어지는 고정 카메라에서 랙, 속도 FOV, 참조물, 충돌 보정과 멀미 저감까지 발전하는 낙하감 실험"></canvas><div class="hud"><span>Q69 · <b id="stage">캐릭터와 같은 속도로 추적</b></span><span id="status">상대 운동이 없어 화면에서는 정지처럼 보임</span></div></div>
<div class="steps" role="group" aria-label="낙하감 카메라 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>딱 붙여 추적</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>카메라 랙</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>속도 FOV</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>참조물·블러</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>협곡 충돌 보정</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>멀미 저감</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">낙하 속도</label><output id="speedOut">38 m/s</output></div><input id="speed" type="range" min="5" max="60" value="38"></div><div><div class="ct"><label for="width">협곡 폭</label><output id="widthOut">5.0 m</output></div><input id="width" type="range" min="18" max="90" value="50"></div><div class="toggles"><button id="collision" aria-pressed="false">예측 충돌 보정</button><button id="comfort" aria-pressed="false">멀미 저감 모드</button></div></div>
<div class="metrics"><div class="m"><small>카메라-캐릭터 벌어짐</small><strong id="mLag">0.0 m</strong></div><div class="m"><small>현재 FOV</small><strong id="mFov">58°</strong></div><div class="m"><small>벽 관통 위험</small><strong id="mRisk">없음</strong></div><div class="m"><small>주변부 자극 강도</small><strong id="mStimulus">0%</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:38,width:5,collision:false,comfort:false,t:0};
const names=['캐릭터와 같은 속도로 추적','스프링 랙으로 상대 운동 생성','낙하 속도에 따라 FOV 확대','스쳐가는 벽·바람·블러 추가','좁은 협곡에서 랙 방향 보정','중심 시야를 고정하고 주변부로 전달'],status=['상대 운동이 없어 화면에서는 정지처럼 보임','캐릭터가 카메라에서 떨어져 나감','원근이 벌어져 주변부 속도가 커짐','주변 참조물이 위로 흘러 낙하 방향을 증명','예측 프로브가 벽 쪽 랙을 위쪽으로 전환','FOV 변화는 줄이고 터널 비네트로 선택권 보존'];
const desc=['<b>실패 재현:</b> 카메라와 캐릭터가 똑같이 내려가면 화면 안 상대속도는 0입니다. 수치상 빠르지만 낙하 단서가 없습니다.','<b>일부러 어긋나기:</b> 급가속 때 카메라가 한 박자 늦게 따라오게 해 캐릭터가 화면 아래로 벌어집니다. 등속에서는 다시 가까워집니다.','<b>원근 과장:</b> 낙하 속도를 상한 있는 FOV 변화로 매핑합니다. 주변부가 더 빨리 스쳐 보이지만 변화 속도가 크면 멀미가 납니다.','<b>배경이 속도를 말하게:</b> 벽의 바위 턱, 바람 선과 주변부 모션 블러가 위로 흐르며 절대속도를 화면의 상대 운동으로 바꿉니다.','<b>랙은 자유 공간에서만:</b> 협곡 폭을 미리 프로브하고 좁으면 뒤쪽 랙을 줄여 위쪽 축으로 돌립니다. 카메라 충돌은 항상 마지막에 적용합니다.','<b>감각 단서 재배분:</b> 민감 모드는 FOV 변화와 중심 블러를 제한하고, 가장자리 비네트·참조물에 속도감을 맡깁니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function line(a,b,d,e,col='#52677b',lw=2,dash=[]){x.beginPath();x.setLineDash(dash);x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=lw;x.moveTo(a,b);x.lineTo(d,e);x.stroke();x.setLineDash([])}
function label(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.9)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function vals(){const lagged=S.step>=1,fovOn=S.step>=2,refs=S.step>=3,guard=S.step>=4&&S.collision,safe=S.step>=5&&S.comfort,pulse=(Math.sin(S.t*.025)+1)/2,rawLag=lagged?Math.min(3.8,S.speed*.07)*(0.55+pulse*.45):0,space=Math.max(0,(S.width-2.2)/3),lag=guard?Math.min(rawLag,space):rawLag,risk=lagged&&S.width<4&&rawLag>space&&!guard,fov=fovOn?58+Math.min(safe?8:24,S.speed*(safe?.14:.38)):58,stim=refs?Math.round(Math.min(100,S.speed*(safe?1.15:2.1))):0;return{lagged,fovOn,refs,guard,safe,pulse,rawLag,lag,risk,fov,stim}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,v=vals(),cx=w*.5,cy=h*.48,gap=w*(.13+S.width*.016),flow=(S.t*S.speed*.16)%90;x.fillStyle='#102331';x.fillRect(0,0,w,h);x.fillStyle='#33495a';x.fillRect(0,0,cx-gap,h);x.fillRect(cx+gap,0,w-(cx+gap),h);for(let y=-90+flow;y<h;y+=90){x.fillStyle='#60768a';x.fillRect(0,y,cx-gap,9);x.fillRect(cx+gap,y,w-(cx+gap),9)}if(v.refs){for(let i=0;i<9;i++){const px=cx-gap+18+i*(gap*2-36)/8;line(px,cy-150-(i%3)*22,px,cy-20+(i%2)*25,'rgba(112,206,255,.55)',2,[8,7])}}
const actorY=cy+v.lag*34;x.fillStyle='#70ceff';x.beginPath();x.arc(cx,actorY-20,15,0,7);x.fill();line(cx,actorY-4,cx,actorY+45,'#70ceff',10);line(cx,actorY+12,cx-26,actorY+34,'#70ceff',7);line(cx,actorY+12,cx+26,actorY+34,'#70ceff',7);const camY=cy-110;line(cx,camY,cx,actorY-35,v.lagged?'#8ce3ae':'#ffd06e',2,[6,4]);x.fillStyle=v.risk?'#ff7f78':'#ffd06e';x.fillRect(cx-18,camY-10,27,20);x.beginPath();x.moveTo(cx+9,camY-9);x.lineTo(cx+26,camY);x.lineTo(cx+9,camY+9);x.fill();label(v.lagged?`RELATIVE GAP ${v.lag.toFixed(1)}m`:'RELATIVE SPEED 0',cx,camY-25,v.lagged?'#8ce3ae':'#ff7f78');label(`FOV ${v.fov.toFixed(0)}°`,cx,actorY+77,v.fovOn?'#8ce3ae':'#788ba1');
if(v.guard){line(cx-gap+5,camY,cx+gap-5,camY,'#8ce3ae',3,[5,4]);label('PREDICTIVE SPHERE PROBE',cx,camY+28,'#8ce3ae')}else if(v.risk)label('CAMERA CLIPS CANYON WALL',cx,camY+28,'#ff7f78');if(v.safe){const g=x.createRadialGradient(cx,cy,Math.min(w,h)*.18,cx,cy,Math.min(w,h)*.58);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=g;x.fillRect(0,0,w,h);label('STABLE CENTER · PERIPHERAL VIGNETTE',cx,h*.88,'#8ce3ae')}if(v.refs)label('WALL REFERENCES FLOW ↑',w*.18,h*.18,'#70ceff')
$('mLag').textContent=v.lag.toFixed(1)+' m';$('mFov').textContent=v.fov.toFixed(0)+'°';$('mRisk').textContent=v.risk?'높음':v.guard?'보정됨':'없음';$('mStimulus').textContent=v.stim+'%';c.dataset.lag=v.lag.toFixed(3);c.dataset.risk=String(v.risk)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('collision').setAttribute('aria-pressed',String(S.collision));$('comfort').setAttribute('aria-pressed',String(S.comfort));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.collision=S.step>=4;S.comfort=S.step>=5;S.t=0;update()});$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=S.speed+' m/s';update()};$('width').oninput=e=>{S.width=+e.target.value/10;$('widthOut').textContent=S.width.toFixed(1)+' m';update()};$('collision').onclick=()=>{S.collision=!S.collision;update()};$('comfort').onclick=()=>{S.comfort=!S.comfort;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw);
})();
</script></body></html>
