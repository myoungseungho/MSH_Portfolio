<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q10 세계 젖음 단계형 실험실</title>
<style>
:root{--bg:#090c12;--panel:#121925;--line:#2b3748;--ink:#eef3fa;--muted:#96a5b8;--amber:#ffb347;--cyan:#6ed7e5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#07101adc}.hud b{color:#ffd27b}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 6px;cursor:pointer}button:hover{color:var(--ink);border-color:#52627a}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#171006}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.63}.explain{margin:11px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--amber)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#69798e;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="비가 내리며 바닥이 젖고 처마 아래는 마르며 낮은 곳에 웅덩이가 생기는 단계별 시뮬레이션"></canvas><div class="hud"><span>Q10 · <b id="stage">텍스처 스왑</b></span><span id="status">마름/젖음 이진 전환</span></div></div>
<div class="steps" role="group" aria-label="젖음 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>텍스처 스왑</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>물리 변조</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>시간 누적</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>비 가림</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>높이 웅덩이</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>경계·반사</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="wet">전역 웨트니스</label><output id="wetOut">35%</output></div><input id="wet" type="range" min="0" max="100" value="35"></div><div><div class="ct"><label for="water">물 높이</label><output id="waterOut">42%</output></div><input id="water" type="range" min="5" max="90" value="42"></div><div class="toggles" role="group" aria-label="날씨 상태"><button data-rain="1" aria-pressed="true">☂ 비 내림</button><button data-rain="0" aria-pressed="false">☀ 건조 중</button></div></div>
<div class="metrics"><div class="m"><small>노출 바닥 젖음</small><strong id="mWet">35%</strong></div><div class="m"><small>처마 아래 젖음</small><strong id="mCover">35%</strong></div><div class="m"><small>표면 러프니스</small><strong id="mRough">0.68</strong></div><div class="m"><small>웅덩이 면적</small><strong id="mPool">0%</strong></div></div></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,wet:.35,water:.42,rain:1,t:0},names=['텍스처 스왑','물리 파라미터 변조','시간 누적','비 오클루전','높이 기반 웅덩이','경계·반사 완성'];
const desc=['<b>문제 재현:</b> 마른/젖은 텍스처를 통째로 바꾸면 메모리가 두 배이고, 화면 전체가 한순간에 켜지며 부분 젖음과 건조 과정이 없습니다.','<b>젖음의 물리:</b> 웨트니스 하나가 러프니스를 낮추고 알베도를 어둡혀 얇은 물막을 표현합니다. 슬라이더로 연속 전이를 확인하세요.','<b>상태 누적:</b> 비가 오면 웨트니스가 시간에 따라 쌓이고, 건조 중에는 천천히 빠집니다. 표면이 즉시 스위치처럼 바뀌지 않습니다.','<b>공간 게이트:</b> 위에서 본 비 깊이/스카이 가시성으로 처마 아래를 차단합니다. 같은 전역 날씨에도 왼쪽 노출 바닥만 젖습니다.','<b>낮은 곳부터:</b> 바닥 높이와 물 높이를 비교해 오목한 곳부터 웅덩이를 채웁니다. 아직 경계가 이진이라 스티커처럼 딱 끊깁니다.','<b>최종:</b> 물→젖은 링→마른 돌을 높이 기반 smoothstep 밴드로 연결하고, 물 영역에만 반사와 파문을 넣습니다. 비가 그치면 상태가 서서히 마릅니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function height(nx,ny){return .40+.24*Math.sin(nx*9)+.14*Math.sin(ny*12+nx*3)+.10*Math.sin(nx*24-ny*7)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,mod=S.step>=1,mask=S.step>=3,puddle=S.step>=4,soft=S.step>=5,openWet=mod?S.wet:(S.wet>.5?1:0),coverWet=mask?0:openWet;x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,S.rain?'#263b4d':'#7d91a0');sky.addColorStop(1,'#111922');x.fillStyle=sky;x.fillRect(0,0,w,h*.35);
// awning on right
x.fillStyle='#2b2522';x.fillRect(w*.58,h*.12,w*.36,h*.08);x.fillStyle='#14171b';x.fillRect(w*.62,h*.20,w*.035,h*.23);x.fillRect(w*.90,h*.20,w*.035,h*.23);x.fillStyle='#b05a35';x.fillRect(w*.68,h*.26,w*.15,h*.10);
// tiled ground, with height-colored stones
const cols=24,rows=10,gy=h*.35,gh=h*.65;for(let iy=0;iy<rows;iy++)for(let ix=0;ix<cols;ix++){const nx=(ix+.5)/cols,ny=(iy+.5)/rows,hv=height(nx,ny),under=nx>.58,wet=under?coverWet:openWet,pool=puddle&&!under&&hv<S.water,edge=soft?Math.max(0,Math.min(1,(S.water-hv)/.15)):pool?1:0,ring=soft&&!pool?Math.max(0,1-Math.abs(hv-S.water)/.13):0;let base=70+hv*35;if(mod)base*=1-wet*.38;if(edge)base*=.55;x.fillStyle=`rgb(${base*(1-ring*.18)},${base*.94*(1-ring*.12)},${base*.82})`;x.fillRect(ix*w/cols,gy+iy*gh/rows,w/cols+1,gh/rows+1);if(pool){x.fillStyle=`rgba(45,100,135,${.28+edge*.44})`;x.fillRect(ix*w/cols,gy+iy*gh/rows,w/cols+1,gh/rows+1)}}x.strokeStyle='rgba(15,20,25,.28)';for(let i=0;i<=cols;i++){x.beginPath();x.moveTo(i*w/cols,gy);x.lineTo(i*w/cols,h);x.stroke()}for(let i=0;i<=rows;i++){x.beginPath();x.moveTo(0,gy+i*gh/rows);x.lineTo(w,gy+i*gh/rows);x.stroke()}
// reflection and ripples only in final
if(soft){x.save();x.beginPath();x.rect(0,gy,w*.58,gh);x.clip();x.globalAlpha=Math.max(0,S.water-.18);x.fillStyle='#d17b48';x.fillRect(w*.18,gy+h*.08,w*.09,h*.16);x.fillStyle='#202f40';x.fillRect(w*.41,gy+h*.02,w*.035,h*.25);x.globalAlpha=1;for(let i=0;i<8;i++){const px=(i*.137%1)*w*.58,py=gy+((i*.31+S.t*.08)%1)*gh;x.strokeStyle='rgba(160,210,230,.45)';x.beginPath();x.ellipse(px,py,8+Math.sin(S.t+i)*5,3,0,0,7);x.stroke()}x.restore()}
// rain
if(S.rain){x.strokeStyle='rgba(160,210,235,.45)';x.lineWidth=1;for(let i=0;i<70;i++){const px=(i*83+S.t*210)%w,py=(i*47+S.t*310)%h;x.beginPath();x.moveTo(px,py);x.lineTo(px-4,py+13);x.stroke()}}
if(S.step===0){x.fillStyle='rgba(7,10,15,.84)';x.fillRect(w*.06,h*.10,w*.35,h*.11);x.fillStyle='#ffcb7c';x.font='600 11px system-ui';x.fillText('0 또는 1 · 전 세계가 동시에 스왑',w*.08,h*.15);x.fillStyle='#93a0b1';x.font='10px system-ui';x.fillText('부분 젖음·점진 전이 없음',w*.08,h*.185)}
if(mask){x.fillStyle='#6ed7e5';x.font='600 10px ui-monospace,monospace';x.fillText('RAIN VISIBILITY 1',w*.13,h*.41);x.fillStyle='#ffb347';x.fillText('RAIN VISIBILITY 0',w*.72,h*.41)}
if(puddle&&!soft){x.fillStyle='rgba(7,10,15,.83)';x.fillRect(w*.05,h*.82,w*.31,h*.08);x.fillStyle='#ff7469';x.font='600 10px system-ui';x.fillText('이진 경계 = 스티커 같은 웅덩이',w*.07,h*.87)}
}
function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));document.querySelectorAll('[data-rain]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.rain===S.rain)));$('stage').textContent=names[S.step];$('explain').innerHTML=desc[S.step];const wet=S.step>=1?S.wet:(S.wet>.5?1:0),cover=S.step>=3?0:wet,pool=S.step>=4?Math.max(0,Math.round((S.water-.22)*125)):0;$('mWet').textContent=Math.round(wet*100)+'%';$('mCover').textContent=Math.round(cover*100)+'%';$('mRough').textContent=(.85*(1-wet)+.16*wet).toFixed(2);$('mPool').textContent=Math.min(100,pool)+'%';$('status').textContent=['마름/젖음 이진 전환','러프니스↓ 알베도↓',S.rain?'젖음 누적':'천천히 건조','처마 아래 마름','낮은 곳부터 채움','물·젖은 링·마른 돌'][S.step]}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;ui()});document.querySelectorAll('[data-rain]').forEach(b=>b.onclick=()=>{S.rain=+b.dataset.rain;ui()});$('wet').oninput=e=>{S.wet=+e.target.value/100;$('wetOut').textContent=e.target.value+'%';ui()};$('water').oninput=e=>{S.water=+e.target.value/100;$('waterOut').textContent=e.target.value+'%';ui()};let last=0;function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;S.t=t/1000;if(S.step>=2){S.wet=Math.max(0,Math.min(1,S.wet+(S.rain?.035:-.018)*dt));$('wet').value=Math.round(S.wet*100);$('wetOut').textContent=Math.round(S.wet*100)+'%';ui()}draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
})();
</script></body></html>
