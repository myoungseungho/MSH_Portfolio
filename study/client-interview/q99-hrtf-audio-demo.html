<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q99 HRTF 공간 음향 실험실</title><style>
:root{--bg:#090d14;--panel:#121a25;--line:#364458;--ink:#f5f7fa;--muted:#9da9b8;--cyan:#71d6ff;--gold:#ffd16f;--green:#7fe0a5;--red:#ff7d76}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.view{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#111a28}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#060910df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.hud b{color:var(--cyan)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#07131b}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--cyan);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--cyan)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#8491a2;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.view{aspect-ratio:4/3}}</style></head><body><div id="root"><div class="view"><canvas id="scene" role="img" aria-label="소스가 리스너 좌표계, 거리 감쇠, 공기 흡수, HRTF의 ITD ILD 스펙트럼 노치, 오디오 LOD를 거쳐 방향과 거리로 번역되는 실험"></canvas><div class="hud"><span>Q99 · <b id="stage">좌우 팬 + 볼륨</b></span><span id="status">좌우는 알지만 정면·후면·높이와 거리는 모호</span></div></div>
<div class="steps"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>볼륨 팬</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>리스너 좌표</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>거리·공기 흡수</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>HRTF</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>잔향비·도플러</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>보이스 예산</button></div><p class="explain" id="explain"></p>
<div class="controls"><div><div class="ct"><label for="azimuth">소스 방위각</label><output id="azimuthOut">−120°</output></div><input id="azimuth" type="range" min="-180" max="180" value="-120"></div><div><div class="ct"><label for="distance">소스 거리</label><output id="distanceOut">18 m</output></div><input id="distance" type="range" min="1" max="60" value="18"></div><div class="toggles"><button id="hrtf" aria-pressed="false">HRTF 필터</button><button id="doppler" aria-pressed="false">도플러·잔향비</button></div></div>
<div class="metrics"><div class="m"><small>양귀 시간차 ITD</small><strong id="mItd">0 μs</strong></div><div class="m"><small>양귀 레벨차 ILD</small><strong id="mIld">8.7 dB</strong></div><div class="m"><small>공기흡수 컷오프</small><strong id="mCut">20 kHz</strong></div><div class="m"><small>HRTF / 리얼 보이스</small><strong id="mVoices">0 / 200</strong></div></div></div><script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,az:-120,dist:18,hrtf:false,doppler:false,t:0};const names=['좌우 팬 + 볼륨','월드 소스를 리스너 로컬 방위·거리로 변환','거리 커브 + 고역 공기 흡수','방향별 HRTF 컨볼루션으로 ITD·ILD·귓바퀴 노치','직접음/잔향 비율 + 접근·이탈 도플러','가까운 중요 N개만 HRTF, 나머지는 팬·버추얼'];const stats=['좌우는 알지만 정면·후면·높이와 거리는 모호','카메라가 돌아도 귀 기준 방향이 정확히 갱신','멀수록 작고 둔탁해져 크기와 거리의 혼동 완화','헤드폰 밖 특정 방향으로 소리가 외재화','다가오는 소리는 피치가 오르고 먼 소리는 잔향 비율 증가','200개가 울려도 방향 정보가 중요한 소수에 DSP 집중'];const desc=['<b>팬의 한계:</b> 왼쪽이면 L을 크게 하는 것만으로는 앞과 뒤가 같은 값이라 cone of confusion이 남고, 볼륨만으로는 큰 먼 소리와 작은 가까운 소리를 구분하기 어렵습니다.','<b>리스너 좌표계:</b> 소스 월드 위치를 카메라의 오른쪽·앞·위 축으로 변환해 방위와 거리를 계산합니다. 방위각을 돌려 귀 주변 위치가 그대로 따라가는지 보세요.','<b>거리 단서 보강:</b> 역제곱에 가까운 감쇠 커브뿐 아니라 먼 소리의 고음을 로우패스로 깎아, 스펙트럼 변화가 거리 단서를 함께 제공합니다.','<b>HRTF 핵심:</b> 머리 때문에 생기는 양귀 시간차·레벨차와 귓바퀴의 방향별 스펙트럼 노치를 좌우 채널 컨볼루션으로 적용해 앞뒤·상하를 구분하고 외재화합니다.','<b>움직임과 공간 단서:</b> 멀수록 직접음보다 잔향 send를 높이고, 접근/이탈 속도에 따라 피치를 바꿉니다. 도플러 버튼으로 보조 단서를 분리해 보세요.','<b>중요한 것만 정밀하게:</b> 동시에 200개가 울려도 가까운 발소리·총성 24개만 HRTF를 사용하고, 중간은 값싼 팬, 먼 군중은 버추얼/버킷 앰비언스로 유지합니다.'];
function calc(){let rad=S.az*Math.PI/180,ild=Math.abs(Math.sin(rad))*10,itd=S.step>=3&&S.hrtf?Math.round(Math.sin(rad)*650):0,cut=S.step>=2?Math.max(3,20-S.dist*.24):20,voices=S.step<3||!S.hrtf?0:S.step>=5?24:200,real=S.step>=5?64:200;return{ild,itd,cut,voices,real}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);x.setTransform(d,0,0,d,0,0)}function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc(),cx=w*.34,cy=h*.42,rad=S.az*Math.PI/180,r=Math.min(w*.25,80+S.dist*3.3),sx=cx+Math.sin(rad)*r,sy=cy-Math.cos(rad)*r;x.fillStyle='#111a28';x.fillRect(0,0,w,h);x.strokeStyle='#34475d';for(let rr=70;rr<260;rr+=48){x.beginPath();x.arc(cx,cy,rr,0,Math.PI*2);x.stroke()}x.fillStyle='#9da9b8';x.beginPath();x.ellipse(cx,cy,55,70,0,0,Math.PI*2);x.fill();x.fillStyle='#71d6ff';x.beginPath();x.arc(cx-55,cy,13,0,Math.PI*2);x.arc(cx+55,cy,13,0,Math.PI*2);x.fill();x.fillStyle='#ffd16f';x.beginPath();x.arc(sx,sy,12,0,Math.PI*2);x.fill();x.strokeStyle='#ffd16f';x.beginPath();x.moveTo(cx,cy);x.lineTo(sx,sy);x.stroke();x.fillStyle='#f5f7fa';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`${S.az}° / ${S.dist}m`,sx+15,sy);let px=w*.64,py=h*.16,pw=w*.3,ph=h*.53;x.strokeStyle='#364458';x.strokeRect(px,py,pw,ph);for(let ch=0;ch<2;ch++){x.strokeStyle=ch?'#ff7d76':'#71d6ff';x.beginPath();for(let i=0;i<100;i++){let f=i/99,notch=S.step>=3&&S.hrtf?Math.exp(-Math.pow((f-(.35+(S.az+180)/900))/.07,2))*.35:0,amp=.34+.22*Math.sin(f*18+ch)-notch,yy=py+ph*(.2+ch*.48)+amp*40;x.lineTo(px+f*pw,yy)}x.stroke();x.fillText(ch?'RIGHT EAR':'LEFT EAR',px+8,py+18+ch*ph*.48)}if(S.step>=4&&S.doppler){let pitch=1+Math.sin(S.t*.025)*.08;x.fillStyle='#7fe0a5';x.fillText(`DOPPLER PITCH ${pitch.toFixed(2)}× · WET ${Math.min(85,20+S.dist).toFixed(0)}%`,px,py+ph+28)}$('mItd').textContent=V.itd+' μs';$('mIld').textContent=V.ild.toFixed(1)+' dB';$('mCut').textContent=V.cut.toFixed(1)+' kHz';$('mVoices').textContent=V.voices+' / '+V.real;c.dataset.itd=V.itd;c.dataset.ild=V.ild.toFixed(1);c.dataset.cutoff=V.cut.toFixed(1);c.dataset.voices=V.voices+','+V.real;c.dataset.azimuth=S.az}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=stats[S.step];$('explain').innerHTML=desc[S.step];$('hrtf').setAttribute('aria-pressed',String(S.hrtf));$('doppler').setAttribute('aria-pressed',String(S.doppler));draw()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.hrtf=S.step>=3;S.doppler=S.step>=4;update()});$('azimuth').oninput=e=>{S.az=+e.target.value;$('azimuthOut').textContent=(S.az<0?'−':'')+Math.abs(S.az)+'°';draw()};$('distance').oninput=e=>{S.dist=+e.target.value;$('distanceOut').textContent=e.target.value+' m';draw()};$('hrtf').onclick=()=>{S.hrtf=!S.hrtf;update()};$('doppler').onclick=()=>{S.doppler=!S.doppler;update()};function tick(){S.t++;draw();requestAnimationFrame(tick)}update();tick();addEventListener('resize',draw)})();
</script></body></html>
