<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q76 응축 마법 차징 실험실</title>
<style>
:root{--bg:#080d16;--panel:#111a28;--line:#304056;--ink:#f5f8fc;--muted:#9aaabf;--blue:#70ceff;--violet:#b89cff;--gold:#ffd06e;--green:#8ce3ae;--red:#ff7f78}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#10182a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#070b12dd}.hud b{color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#60748d}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--blue);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--blue)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#788ba1;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="손 주변의 빛 입자가 소용돌이치며 응축되고 주변을 비춘 뒤 투사체로 발사되는 단계형 마법 실험"></canvas><div class="hud"><span>Q76 · <b id="stage">손 소켓 반짝이</b></span><span id="status">밖으로 흩어지는 파티클뿐, 응축과 빛은 없음</span></div></div>
<div class="steps" role="group" aria-label="응축 마법 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>붙인 반짝이</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>점 어트랙터</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>컬 소용돌이</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>HDR·블룸</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>실제 조명</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>진행도·발사</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="duration">실제 차징 시간</label><output id="durationOut">1.2초</output></div><input id="duration" type="range" min="3" max="20" value="12"></div><div><div class="ct"><label for="casters">동시 시전자</label><output id="castersOut">1명</output></div><input id="casters" type="range" min="1" max="8" value="1"></div><div class="toggles"><button id="charge" aria-pressed="true">차징 중</button><button id="budget" aria-pressed="false">화면 기여도 LOD</button></div></div>
<div class="metrics"><div class="m"><small>게임플레이 진행도</small><strong id="mProgress">0%</strong></div><div class="m"><small>시뮬 입자 / 표시 입자</small><strong id="mParticles">0 / 0</strong></div><div class="m"><small>HDR 이미시브 / 라이트</small><strong id="mLight">1.0 / 0</strong></div><div class="m"><small>예상 오버드로 비용</small><strong id="mCost">1.0×</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,S={step:0,duration:1.2,casters:1,charging:true,budget:false,progress:0,phase:'charge',t:0,releaseX:0};
const names=['손 소켓에서 밖으로 뿌리는 고정 버스트','껍질 스폰 → 점 어트랙터로 중심 수렴','컬 노이즈를 더해 나선형 수렴','진행도에 따라 이미시브·블룸 램프','포인트 라이트가 얼굴·바닥을 실제 조명','0→1 진행도 하나로 차징·캔슬·발사 인계'];
const status=['고정 길이 파티클은 차징 상태를 모른다','입자의 속도가 중심을 향해 뒤집힌다','직선 수렴 대신 살아 있는 회전 흐름','화면의 광채가 발사 직전까지 고조','블룸과 별개로 주변 표면 밝기가 변함','릴리스 이벤트가 응축 구체를 투사체로 넘김'];
const desc=['<b>가짜 재현:</b> 손 소켓에서 반짝이를 바깥으로 뿌립니다. 차징 시간을 바꿔도 재생 길이는 그대로라 애니메이션과 어긋납니다.','<b>형태부터 수정:</b> 입자를 손 앞 껍질에서 만들고 점 어트랙터로 중심에 끌어당깁니다. 이제 흩어진 빛이 실제로 한 점에 모입니다.','<b>컬 흐름 추가:</b> 중심 방향 속도에 접선 속도를 섞어 입자들이 나선을 그리며 수렴합니다. 같은 입자 수여도 응축의 방향성이 읽힙니다.','<b>발광의 고조:</b> 진행도 하나가 코어 이미시브와 블룸 반경을 함께 올립니다. 화면에 밝은 구체가 생기지만 아직 주변 표면은 밝아지지 않습니다.','<b>진짜 광원:</b> 손 위치의 동적 포인트 라이트 하나가 얼굴과 바닥 밝기를 진행도에 맞춰 바꿉니다. 그림자는 끄고 라이트 개수는 예산으로 제한합니다.','<b>상태와 표현 동기화:</b> 실제 어빌리티 진행도 0→1이 방출량·반경·이미시브·라이트를 함께 몹니다. 차징 버튼을 끄면 현재 값에서 발사되고, LOD는 다중 시전의 표시 비용만 줄입니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function pill(t,px,py,col='#f5f8fc',align='center'){x.font='600 10px ui-monospace,Consolas,monospace';x.textAlign=align;const tw=x.measureText(t).width,ox=align==='center'?-tw/2:align==='right'?-tw:0;x.fillStyle='rgba(5,9,15,.88)';x.fillRect(px+ox-5,py-12,tw+10,18);x.fillStyle=col;x.fillText(t,px,py);x.textAlign='left'}
function values(){const p=S.step===0?0:S.progress,sim=S.step<1?36:Math.round(80+220*p),shown=S.budget?Math.round(sim/Math.max(1,S.casters*.58)):sim,em=S.step>=3?1+7*p:1,lights=S.step>=4?(S.budget?Math.min(1,S.casters):S.casters):0,cost=(shown/100*S.casters*(S.step>=3?1.45:1)*(S.step>=4?1.18:1));return{p,sim,shown,em,lights,cost}}
function updateMotion(dt){S.t+=dt;if(S.step<5){S.progress=Math.min(.92,S.progress+dt/Math.max(.3,S.duration)*.34);return}if(S.charging){S.phase='charge';S.progress=Math.min(1,S.progress+dt/S.duration);S.releaseX=0}else if(S.progress>0){S.phase='release';S.releaseX+=dt*1.15;if(S.releaseX>1.2){S.progress=0;S.phase='idle'}}}
function drawPerson(w,h,cx,cy,lit){x.fillStyle='#263147';x.beginPath();x.arc(cx-w*.22,cy-h*.15,22,0,TAU);x.fill();x.fillRect(cx-w*.245,cy-h*.08,w*.05,h*.44);x.strokeStyle='#4c5d75';x.lineWidth=13;x.beginPath();x.moveTo(cx-w*.22,cy+h*.02);x.lineTo(cx-w*.08,cy-h*.02);x.stroke();if(lit>0){const g=x.createRadialGradient(cx-w*.12,cy-h*.08,2,cx-w*.12,cy-h*.08,75+lit*45);g.addColorStop(0,`rgba(149,104,255,${.28*lit})`);g.addColorStop(1,'rgba(149,104,255,0)');x.fillStyle=g;x.fillRect(cx-w*.33,cy-h*.32,w*.32,h*.58)}}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cx=w*.57,cy=h*.47,v=values(),light=S.step>=4?v.p:0;x.fillStyle='#10182a';x.fillRect(0,0,w,h);const bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#15152d');bg.addColorStop(1,'#09111d');x.fillStyle=bg;x.fillRect(0,0,w,h);x.strokeStyle='#29364d';x.lineWidth=1;x.beginPath();x.moveTo(0,h*.78);x.lineTo(w,h*.78);x.stroke();if(light>0){const floor=x.createRadialGradient(cx,h*.79,5,cx,h*.79,120+light*90);floor.addColorStop(0,`rgba(119,83,255,${.42*light})`);floor.addColorStop(1,'rgba(119,83,255,0)');x.fillStyle=floor;x.fillRect(cx-220,h*.58,440,h*.36)}drawPerson(w,h,cx,cy,light);
const coreX=S.phase==='release'?cx+S.releaseX*w*.34:cx,coreY=cy,spread=S.step===0?42:112*(1-v.p*.72),count=Math.min(105,v.shown);for(let i=0;i<count;i++){const q=(i*.618033+S.t*.08)%1,a=i*2.399+S.t*(S.step>=2?2.5:.35),r=S.step===0?(18+q*55+S.t*22%24):(18+q*spread),px=coreX+Math.cos(a)*r+(S.step===0?S.t*18:0),py=coreY+Math.sin(a)*(r*.48),alpha=.25+.7*(1-q);x.fillStyle=i%4===0?`rgba(255,208,110,${alpha})`:`rgba(184,156,255,${alpha})`;x.beginPath();x.arc(px,py,1.5+(i%3)*.45,0,TAU);x.fill()}if(S.step>=3){const bloom=x.createRadialGradient(coreX,coreY,1,coreX,coreY,14+v.p*46);bloom.addColorStop(0,`rgba(255,255,255,${.86*v.p})`);bloom.addColorStop(.22,`rgba(143,112,255,${.72*v.p})`);bloom.addColorStop(1,'rgba(100,70,255,0)');x.fillStyle=bloom;x.beginPath();x.arc(coreX,coreY,18+v.p*49,0,TAU);x.fill()}x.strokeStyle='#b89cff';x.lineWidth=2;x.beginPath();x.arc(coreX,coreY,8+v.p*11,0,TAU);x.stroke();if(S.phase==='release'){x.strokeStyle='rgba(184,156,255,.7)';x.lineWidth=6;x.beginPath();x.moveTo(cx,cy);x.lineTo(coreX-12,coreY);x.stroke();pill('RELEASE → PROJECTILE HANDOFF',w*.66,h*.73,'#ffd06e')}else pill(S.step===0?'OUTWARD BURST · FIXED TIMELINE':`ABILITY CHARGE ${(v.p*100).toFixed(0)}% → ALL PARAMETERS`,w*.58,h*.73,S.step===0?'#ff7f78':'#8ce3ae');if(S.step>=4)pill(`${v.lights} DYNAMIC LIGHT${v.lights===1?'':'S'} · SHADOW OFF`,w*.58,h*.16,'#70ceff');$('mProgress').textContent=(v.p*100).toFixed(0)+'%';$('mParticles').textContent=v.sim+' / '+v.shown;$('mLight').textContent=v.em.toFixed(1)+' / '+v.lights;$('mCost').textContent=v.cost.toFixed(1)+'×';c.dataset.progress=v.p.toFixed(3);c.dataset.particles=v.shown;c.dataset.lights=v.lights;c.dataset.phase=S.phase}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=status[S.step];$('explain').innerHTML=desc[S.step];$('charge').textContent=S.charging?'차징 중':'릴리스';$('charge').setAttribute('aria-pressed',String(S.charging));$('budget').setAttribute('aria-pressed',String(S.budget));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.progress=S.step===0?0:.08;S.charging=true;S.phase='charge';S.releaseX=0;update()});$('duration').oninput=e=>{S.duration=+e.target.value/10;$('durationOut').textContent=S.duration.toFixed(1)+'초';S.progress=.08;update()};$('casters').oninput=e=>{S.casters=+e.target.value;$('castersOut').textContent=S.casters+'명';update()};$('charge').onclick=()=>{S.charging=!S.charging;if(S.charging&&S.phase==='idle')S.progress=.08;update()};$('budget').onclick=()=>{S.budget=!S.budget;update()};let last=performance.now();function tick(now){const dt=Math.min(.033,(now-last)/1000);last=now;updateMotion(dt);draw();requestAnimationFrame(tick)}update();requestAnimationFrame(tick);addEventListener('resize',draw);
})();
</script></body></html>
