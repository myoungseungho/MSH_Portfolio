<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q39 심리스 월드 스트리밍 단계형 실험실</title>
<style>
:root{--bg:#081019;--panel:#111d28;--line:#2d4354;--ink:#f2f8fc;--muted:#97aab8;--loaded:#72c9ff;--queue:#ffd17f;--hlod:#6f8f9e;--safe:#8ce4b4;--red:#ff8179}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/8.3;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#13222d}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#081019dd}.hud b{color:var(--loaded)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#577187}button:focus-visible,input:focus-visible{outline:2px solid var(--loaded);outline-offset:2px}button[aria-pressed=true]{background:var(--loaded);border-color:var(--loaded);color:#06131d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:11px 0 0;border-left:2px solid var(--loaded);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.55;min-height:40px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-top:11px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--loaded)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:11px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#758b9b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="세계 전체 상주에서 셀 링, 동기 히치, 비동기 큐, 속도 방향 프리페치와 HLOD·상주 충돌 베이스까지 쌓는 이동 창"></canvas><div class="hud"><span>Q39 · <b id="stage">세계 전체 메모리 상주</b></span><span id="status">용량·초기 로딩 붕괴</span></div></div>
<div class="steps" role="group" aria-label="월드 스트리밍 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>세계 통째로 로드</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>플레이어 셀 링</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>동기 경계 히치</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>비동기 I/O 큐</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>속도·방향 프리페치</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>HLOD·예산·안전 바닥</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="speed">이동 속도</label><output id="speedOut">70 km/h</output></div><input id="speed" type="range" min="0" max="180" value="70"></div><div><div class="ct"><label for="bandwidth">스트리밍 대역폭</label><output id="bandwidthOut">450 MB/s</output></div><input id="bandwidth" type="range" min="50" max="1200" value="450"></div><div class="toggles" role="group" aria-label="비동기 타임슬라이싱과 상주 저LOD 충돌"><button id="async" aria-pressed="false">비동기·타임슬라이스</button><button id="collision" aria-pressed="false">저LOD 충돌 상주</button></div></div>
<div class="metrics"><div class="m"><small>상주 메모리</small><strong id="mMemory">84 GB</strong></div><div class="m"><small>선행 로드 거리</small><strong id="mLead">0 m</strong></div><div class="m"><small>경계 프레임 히치</small><strong id="mHitch">310 ms</strong></div><div class="m"><small>빈 바닥 위험</small><strong id="mGap">없음</strong></div></div></div>
<script>
(()=>{const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,speed:70,bandwidth:450,async:false,collision:false,t:0},names=['entire world resident','player-centered cell ring','synchronous cell activation','async I/O + time-sliced finalize','velocity-direction prefetch cone','HLOD horizon + persistent collision base'],desc=['<b>문제 재현:</b> 84GB 세계 전체를 십몇 GB 메모리에 올리는 건 불가능하고 초기 로딩·보이지 않는 액터 업데이트까지 폭발합니다.','<b>움직이는 메모리 창:</b> 플레이어 주변 상세 셀만 로드하고 뒤 셀은 언로드해 어디서든 상주량을 일정하게 유지합니다.','<b>셀 경계의 멈춤:</b> 디스크 읽기·인스턴스화·GPU 업로드를 경계에서 메인 스레드로 몰아 처리하면 셀 하나가 들어올 때 수백 ms 히치가 납니다.','<b>읽기와 만들기를 분리:</b> 논블로킹 I/O는 워커에서, 액터 등록·GPU 업로드는 프레임 예산 안에서 여러 프레임에 나눕니다.','<b>현재가 아니라 도착할 곳:</b> 이동 방향·속도에 비례해 앞쪽 큐를 길게 만들고 저LOD부터 요청합니다. 속도를 올리면 노란 선행 링이 더 멀리 뻗습니다.','<b>늦어도 세계는 존재:</b> 상세 셀 전에는 HLOD가 지평선을 채우고 저LOD 지형·충돌은 항상 상주합니다. 프레임당 업로드 상한으로 히치를 평탄화합니다.'];
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}function tag(t,px,py,co='#f2f8fc'){x.font='600 9px ui-monospace,monospace';let tw=x.measureText(t).width;x.fillStyle='rgba(5,11,16,.86)';x.fillRect(px-6,py-13,tw+12,20);x.fillStyle=co;x.fillText(t,px,py)}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,cols=12,rows=7,cw=w/cols,ch=h/rows,ring=S.step>=1,pref=S.step>=4,hlod=S.step>=5,lead=Math.min(4,Math.ceil(S.speed/55)),offset=(S.t*S.speed*.0006)%1;x.fillStyle='#172631';x.fillRect(0,0,w,h);for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let dx=i-5,dy=j-3,dist=Math.hypot(dx,dy),loaded=!ring||dist<=2.35,queued=pref&&dx>1&&dx<=2+lead&&Math.abs(dy)<=1+dx*.28,color=loaded?'#72c9ff':queued?'#ffd17f':hlod?'#6f8f9e':'#253542';x.fillStyle=color;x.globalAlpha=loaded?(.62+((i+j)%3)*.1):queued?.7:hlod?.34:.28;x.fillRect(i*cw+2,j*ch+2,cw-4,ch-4);x.globalAlpha=1;if(loaded){x.fillStyle='rgba(8,22,30,.36)';for(let k=0;k<3;k++)x.fillRect(i*cw+8+k*11,j*ch+12+(k%2)*13,7,10)}}const px=(5.5+offset*.7)*cw,py=3.5*ch;x.fillStyle='#f4fbff';x.beginPath();x.arc(px,py,10,0,7);x.fill();x.fillStyle='#72c9ff';x.beginPath();x.moveTo(px+13,py);x.lineTo(px+36,py-10);x.lineTo(px+36,py+10);x.fill();if(S.step===0)tag('ALL 84 CELLS RESIDENT · 84 GB',w*.37,h*.10,'#ff8179');if(ring)tag('DETAIL RING · LOAD NEAR / UNLOAD BEHIND',w*.27,h*.10,'#72c9ff');if(S.step===2){x.strokeStyle='#ff8179';x.lineWidth=5;x.beginPath();x.moveTo(8*cw,0);x.lineTo(8*cw,h);x.stroke();tag('SYNC I/O + SPAWN + UPLOAD = HITCH',w*.57,h*.86,'#ff8179')}if(S.async&&S.step>=3)tag('WORKER I/O → FRAME-BUDGET FINALIZE',w*.30,h*.88,'#8ce4b4');if(pref){x.strokeStyle='#ffd17f';x.setLineDash([6,4]);x.beginPath();x.moveTo(px+20,py);x.lineTo(Math.min(w-10,px+cw*(2+lead)),py);x.stroke();x.setLineDash([]);tag(`VELOCITY PREFETCH +${lead} CELLS`,w*.62,h*.16,'#ffd17f')}if(hlod){tag('GRAY HLOD HORIZON PROXIES',w*.05,h*.18,'#a6bdc7');if(S.collision){x.strokeStyle='#8ce4b4';x.lineWidth=2;x.strokeRect(2,2,w-4,h-4);tag('PERSISTENT LOW-LOD TERRAIN + COLLISION',w*.22,h*.94,'#8ce4b4')}}}
function vals(){const lead=S.step>=4?Math.round(220+S.speed*5.4):0,async=S.async&&S.step>=3,hitch=S.step===0?310:S.step===2?Math.round(120+9000/S.bandwidth):async?Math.max(2,Math.round(28-S.bandwidth/60)):65,mem=S.step===0?84:S.step>=5?5.8:4.6,gap=S.collision&&S.step>=5?'없음':S.speed>Math.max(30,S.bandwidth/4)?'위험':'없음';return{lead,hitch,mem,gap}}function metrics(){const v=vals();$('mMemory').textContent=v.mem+' GB';$('mLead').textContent=v.lead+' m';$('mHitch').textContent=v.hitch+' ms';$('mGap').textContent=v.gap}function ui(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=['용량·초기 로딩 붕괴','일정한 상주 반경','경계에서 메인 스레드 정지','읽기·생성 평탄화','고속일수록 먼 곳 예약','상세가 늦어도 바닥 보장'][S.step];$('explain').innerHTML=desc[S.step];$('async').setAttribute('aria-pressed',String(S.async));$('collision').setAttribute('aria-pressed',String(S.collision));metrics();draw()}function tick(){S.t+=1;draw();requestAnimationFrame(tick)}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.async=S.step>=3;S.collision=S.step===5;ui()});$('speed').oninput=e=>{S.speed=+e.target.value;$('speedOut').textContent=e.target.value+' km/h';ui()};$('bandwidth').oninput=e=>{S.bandwidth=+e.target.value;$('bandwidthOut').textContent=e.target.value+' MB/s';ui()};$('async').onclick=()=>{S.async=!S.async;ui()};$('collision').onclick=()=>{S.collision=!S.collision;ui()};ui();tick();addEventListener('resize',draw)})();
</script></body></html>
