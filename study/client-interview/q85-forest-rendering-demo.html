<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q85 대규모 숲 렌더링 실험실</title>
<style>
:root{--bg:#07100d;--panel:#101c18;--line:#30483d;--ink:#f3f8f5;--muted:#9bb0a5;--mint:#7ee2ad;--gold:#f6cf72;--red:#ff817b;--blue:#74cfff}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}#root{padding:14px}.viewport{position:relative;aspect-ratio:16/7.05;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#101d18}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:11px ui-monospace,Consolas,monospace}.hud span{padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;background:#050b08dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hud span:first-child{max-width:54%}.hud span:last-child{max-width:44%}.hud b{color:var(--mint)}.legend{position:absolute;left:10px;bottom:9px;display:flex;gap:10px;padding:5px 8px;border-radius:7px;background:#050b08c9;color:var(--muted);font:9px ui-monospace,Consolas,monospace}.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:2px}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font:600 11px inherit;padding:7px 5px;cursor:pointer}button:hover{color:var(--ink);border-color:#668373}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}button[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:#06130d}.n{display:block;font:9px ui-monospace,Consolas,monospace;opacity:.64}.explain{margin:9px 0 0;border-left:2px solid var(--mint);padding:1px 0 1px 11px;color:var(--muted);font-size:12px;line-height:1.45;min-height:37px}.explain b{color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px;margin-top:7px}.ct{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px}.ct output{color:var(--ink);font-family:ui-monospace,Consolas,monospace}input{width:100%;accent-color:var(--mint)}.toggles{display:flex;gap:5px}.toggles button{flex:1;min-height:34px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:7px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.m{background:var(--panel);padding:7px 9px}.m small{display:block;color:#7f988b;font:9px ui-monospace,Consolas,monospace}.m strong{font:14px ui-monospace,Consolas,monospace}@media(max-width:720px){.steps{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.viewport{aspect-ratio:4/3}}
</style></head><body><div id="root"><div class="viewport"><canvas id="scene" role="img" aria-label="수만 그루의 숲이 메시 LOD, 옥타헤드럴 임포스터, HLOD와 GPU 컬링으로 최적화되는 실험"></canvas><div class="hud"><span>Q85 · <b id="stage">모든 나무를 최고 메시로</b></span><span id="status">멀리 있는 숲까지 잎 하나하나 그리는 중</span></div><div class="legend"><span><i style="background:#7ee2ad"></i>메시</span><span><i style="background:#f6cf72"></i>임포스터</span><span><i style="background:#74cfff"></i>HLOD 군집</span><span><i style="background:#ff817b"></i>컬링됨</span></div></div>
<div class="steps" role="group" aria-label="대규모 숲 구현 단계"><button data-step="0" aria-pressed="true"><span class="n">STEP 0</span>전부 최고 메시</button><button data-step="1" aria-pressed="false"><span class="n">STEP 1</span>메시 LOD</button><button data-step="2" aria-pressed="false"><span class="n">STEP 2</span>인스턴싱</button><button data-step="3" aria-pressed="false"><span class="n">STEP 3</span>먼 거리 한계</button><button data-step="4" aria-pressed="false"><span class="n">STEP 4</span>임포스터·HLOD</button><button data-step="5" aria-pressed="false"><span class="n">STEP 5</span>GPU 컬링·밀도</button></div>
<p class="explain" id="explain"></p><div class="controls"><div><div class="ct"><label for="distance">카메라 전진</label><output id="distanceOut">35%</output></div><input id="distance" type="range" min="0" max="100" value="35"></div><div><div class="ct"><label for="angle">시선 방위각</label><output id="angleOut">20°</output></div><input id="angle" type="range" min="-70" max="70" value="20"></div><div class="toggles"><button id="cull" aria-pressed="false">GPU 시야 컬링</button><button id="density" aria-pressed="false">원거리 밀도 페이드</button></div></div>
<div class="metrics"><div class="m"><small>그린 나무 / 전체</small><strong id="mDrawn">24,000 / 24,000</strong></div><div class="m"><small>삼각형</small><strong id="mTris">1.68B</strong></div><div class="m"><small>드로우 콜</small><strong id="mCalls">24,000</strong></div><div class="m"><small>표현 방식</small><strong id="mRep">M 24k</strong></div></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),x=c.getContext('2d'),$=id=>document.getElementById(id),S={step:0,distance:.35,angle:20,cull:false,density:false};
const names=['모든 나무를 최고 메시로','거리에 따라 메시 복잡도 낮추기','같은 메시와 재질을 한 번에 제출','가장 낮은 LOD도 숲 전체에서는 무겁다','옥타헤드럴 임포스터와 HLOD 군집','GPU 시야 컬링과 원거리 밀도 페이드'];
const statuses=['화면 밖 나무도 잎 메시와 개별 드로우 콜을 유지','근경 LOD0 · 중경 LOD1 · 원경 LOD2','같은 LOD 나무를 인스턴스 버퍼 한 번으로 제출','24,000개의 저해상도 메시가 여전히 병목','원경은 보는 방향의 베이크 프레임으로 교체','보이는 군집만 GPU가 압축해 간접 드로우'];
const desc=['<b>무작정 전부 그리기:</b> 나무 한 그루가 7만 삼각형이라면 2만4천 그루는 16억 개를 넘습니다. 카메라를 움직여도 보이지 않는 나무까지 CPU가 하나씩 제출합니다.','<b>화면 크기에 맞춘 메시 LOD:</b> 가까운 나무는 잎 메시, 중간은 단순화한 가지, 먼 나무는 성긴 실루엣으로 바뀝니다. 카메라 전진을 움직여 LOD 띠가 이동하는 모습을 보세요.','<b>인스턴싱으로 CPU 병목 제거:</b> 같은 LOD의 메시·재질을 공유하고 위치와 크기만 인스턴스 버퍼에 담습니다. 삼각형 수는 같지만 드로우 콜이 수만 번에서 LOD별 몇 번으로 줄어듭니다.','<b>최저 메시 LOD의 한계:</b> 먼 나무 하나가 작아도 수만 그루가 겹치면 버텍스 처리와 오버드로우가 남습니다. 이제 메시가 아닌 한 장의 방향성 표현이 필요합니다.','<b>임포스터 + HLOD:</b> 중원경 나무는 시선 방위각에 맞는 옥타헤드럴 아틀라스 프레임을 선택하고, 지평선의 숲은 여러 그루를 하나의 HLOD 군집으로 합칩니다. 전환 띠에서는 디더 크로스페이드로 팝을 숨깁니다.','<b>GPU 주도 가시성:</b> 컴퓨트 셰이더가 프러스텀 밖 군집을 버리고 원거리 밀도를 확률적으로 줄인 뒤 간접 드로우 개수를 만듭니다. 두 버튼을 껐다 켜며 실제 제출량 차이를 확인하세요.'];
const trees=Array.from({length:180},(_,i)=>({z:(i%18)/18,x:((i*47)%181)/180,y:((i*71)%31)/31,s:.7+((i*37)%30)/50}));
function calc(){let base=[24000,24000,24000,24000,24000,24000][S.step],visible=S.step>=5&&S.cull?Math.round(base*(.48+Math.abs(S.angle)/700)):base;if(S.step>=5&&S.density)visible=Math.round(visible*(.64+.12*S.distance));let mesh=visible,imp=0,hlod=0;if(S.step>=4){mesh=Math.round(visible*(.13+.17*S.distance));imp=Math.round(visible*(.48-.10*S.distance));hlod=visible-mesh-imp}let tris;if(S.step===0)tris=base*70000;else if(S.step<=3)tris=Math.round(visible*(S.step===3?2600:11800-5200*S.distance));else tris=Math.round(mesh*16000+imp*12+hlod*520);let calls=S.step<2?visible:S.step<4?3:S.step===4?8:6;return{visible,mesh,imp,hlod,tris,calls}}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}x.setTransform(d,0,0,d,0,0)}
function tree(px,py,size,rep,fade){x.save();x.globalAlpha=fade;x.translate(px,py);if(rep==='mesh'){x.strokeStyle='#795b39';x.lineWidth=Math.max(1,size*.08);x.beginPath();x.moveTo(0,0);x.lineTo(0,-size*.58);x.stroke();x.fillStyle='#7ee2ad';for(let k=0;k<7;k++){const a=k*2.4+S.angle*.008,r=size*(.08+(k%3)*.08);x.beginPath();x.arc(Math.cos(a)*r,-size*(.55+(k%2)*.12),size*(.22+(k%3)*.025),0,Math.PI*2);x.fill()}}else if(rep==='imp'){const frame=Math.round((S.angle+70)/17.5);x.fillStyle='#f6cf72';x.beginPath();x.ellipse(0,-size*.48,size*(.25+frame%3*.02),size*.48,0,0,Math.PI*2);x.fill();x.strokeStyle='#ffe7a3';x.lineWidth=1;x.stroke()}else{x.fillStyle='#74cfff';x.beginPath();x.moveTo(-size*.42,0);x.quadraticCurveTo(-size*.2,-size*.72,0,-size*.64);x.quadraticCurveTo(size*.28,-size*.76,size*.44,0);x.fill()}x.restore()}
function draw(){resize();const w=c.clientWidth,h=c.clientHeight,V=calc();let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#17332d');sky.addColorStop(.55,'#264436');sky.addColorStop(1,'#0b1711');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#476448';x.fillRect(0,h*.44,w,h*.56);for(let band=0;band<18;band++){let z=(band/18+S.distance*.28)%1,depth=.08+.92*z,py=h*(.46+depth*.5),spread=w*(.17+depth*.92),center=w*.5-S.angle*1.15*(1-depth);for(let j=0;j<10;j++){let t=trees[band*10+j],px=center+(t.x-.5)*spread,size=(7+38*depth)*t.s;let culled=S.step>=5&&S.cull&&(px<-size||px>w+size||((band*13+j*7)%9)<3);let faded=S.step>=5&&S.density&&depth<.35&&((band*11+j*5)%10)<4;if(culled||faded){if(S.step===5&&band%3===0){x.fillStyle='#ff817b44';x.fillRect(Math.max(1,Math.min(w-3,px)),py-2,2,2)}continue}let rep='mesh';if(S.step>=4)rep=depth>.58?'mesh':depth>.24?'imp':'hlod';if(S.step===1||S.step===2||S.step===3){x.fillStyle=depth>.58?'#7ee2ad':depth>.28?'#6fc18f':'#5a9877'}tree(px,py,size,rep,1)}}
if(S.step>=1&&S.step<4){x.fillStyle='#07100db8';x.fillRect(w*.035,h*.62,w*.93,26);[['LOD2',.18],['LOD1',.49],['LOD0',.78]].forEach(q=>{x.fillStyle=q[0]==='LOD0'?'#7ee2ad':q[0]==='LOD1'?'#f6cf72':'#74cfff';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(q[0],w*q[1],h*.675)})}
if(S.step>=4){const frame=Math.round((S.angle+70)/17.5);x.fillStyle='#07100dd6';x.fillRect(w*.76,h*.12,w*.2,h*.18);x.strokeStyle='#f6cf72';x.strokeRect(w*.76,h*.12,w*.2,h*.18);x.fillStyle='#f3f8f5';x.font='600 10px ui-monospace,Consolas,monospace';x.fillText(`OCTA FRAME ${frame}/8`,w*.785,h*.17);x.fillStyle='#f6cf72';x.beginPath();x.ellipse(w*.86,h*.235,16+frame%3*2,29,0,0,Math.PI*2);x.fill()}
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n);$('mDrawn').textContent=V.visible.toLocaleString()+' / 24,000';$('mTris').textContent=fmt(V.tris);$('mCalls').textContent=V.calls.toLocaleString();$('mRep').textContent=S.step>=4?`M ${fmt(V.mesh)} · I ${fmt(V.imp)} · H ${fmt(V.hlod)}`:`M ${fmt(V.visible)}`;c.dataset.drawn=V.visible;c.dataset.tris=V.tris;c.dataset.calls=V.calls;c.dataset.rep=[V.mesh,V.imp,V.hlod].join(',');c.dataset.frame=Math.round((S.angle+70)/17.5)}
function update(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===S.step)));$('stage').textContent=names[S.step];$('status').textContent=statuses[S.step];$('explain').innerHTML=desc[S.step];$('cull').setAttribute('aria-pressed',String(S.cull));$('density').setAttribute('aria-pressed',String(S.density));draw()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;S.cull=S.step>=5;S.density=S.step>=5;update()});$('distance').oninput=e=>{S.distance=+e.target.value/100;$('distanceOut').textContent=e.target.value+'%';draw()};$('angle').oninput=e=>{S.angle=+e.target.value;$('angleOut').textContent=e.target.value+'°';draw()};$('cull').onclick=()=>{S.cull=!S.cull;update()};$('density').onclick=()=>{S.density=!S.density;update()};update();addEventListener('resize',draw);
})();
</script></body></html>
