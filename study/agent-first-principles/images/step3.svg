<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#f8fafc"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-family="Pretendard, Segoe UI, sans-serif" fill="#1f2937">역할을 Task Contract로 환원</text>

  <rect x="78" y="82" width="270" height="220" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="213" y="115" text-anchor="middle" font-size="18" fill="#991b1b">사람 중심 지시</text>
  <text x="213" y="150" text-anchor="middle" font-size="16" fill="#7f1d1d">"전투 더 재밌게"</text>
  <text x="213" y="178" text-anchor="middle" font-size="16" fill="#7f1d1d">"서버 안정화해"</text>
  <text x="213" y="206" text-anchor="middle" font-size="16" fill="#7f1d1d">"아트 퀄리티 올려"</text>
  <text x="213" y="250" text-anchor="middle" font-size="14" fill="#b91c1c">의도는 좋지만 실행 기준이 없음</text>

  <rect x="452" y="82" width="270" height="220" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="587" y="115" text-anchor="middle" font-size="18" fill="#0f766e">Task Contract</text>
  <text x="587" y="148" text-anchor="middle" font-size="15" fill="#155e75">Input</text>
  <text x="587" y="173" text-anchor="middle" font-size="15" fill="#155e75">Output</text>
  <text x="587" y="198" text-anchor="middle" font-size="15" fill="#155e75">Constraint</text>
  <text x="587" y="223" text-anchor="middle" font-size="15" fill="#155e75">Check</text>
  <text x="587" y="248" text-anchor="middle" font-size="15" fill="#155e75">Handoff</text>
  <text x="587" y="280" text-anchor="middle" font-size="14" fill="#0f766e">검증 가능한 상태 전이로 정의</text>

  <line x1="355" y1="190" x2="442" y2="190" stroke="#2563eb" stroke-width="4"/>
  <polygon points="442,190 430,182 430,198" fill="#2563eb"/>
</svg>
