<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#f8fafc"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-family="Pretendard, Segoe UI, sans-serif" fill="#1f2937">모호한 지시가 누수되는 과정</text>

  <rect x="70" y="88" width="150" height="70" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="145" y="118" text-anchor="middle" font-size="16" fill="#0c4a6e">요청</text>
  <text x="145" y="140" text-anchor="middle" font-size="14" fill="#155e75">"재밌게 해줘"</text>

  <rect x="265" y="88" width="150" height="70" rx="12" fill="#fef9c3" stroke="#fde047"/>
  <text x="340" y="118" text-anchor="middle" font-size="16" fill="#854d0e">해석</text>
  <text x="340" y="140" text-anchor="middle" font-size="14" fill="#a16207">가정 충돌</text>

  <rect x="460" y="88" width="150" height="70" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="535" y="118" text-anchor="middle" font-size="16" fill="#991b1b">실행</text>
  <text x="535" y="140" text-anchor="middle" font-size="14" fill="#b91c1c">재작업 반복</text>

  <rect x="655" y="88" width="100" height="70" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="705" y="118" text-anchor="middle" font-size="16" fill="#6b21a8">결과</text>
  <text x="705" y="140" text-anchor="middle" font-size="14" fill="#7e22ce">불일치</text>

  <line x1="220" y1="123" x2="265" y2="123" stroke="#f97316" stroke-width="3"/>
  <line x1="415" y1="123" x2="460" y2="123" stroke="#f97316" stroke-width="3"/>
  <line x1="610" y1="123" x2="655" y2="123" stroke="#f97316" stroke-width="3"/>

  <circle cx="242" cy="100" r="8" fill="#ef4444"/>
  <circle cx="438" cy="100" r="8" fill="#ef4444"/>
  <circle cx="633" cy="100" r="8" fill="#ef4444"/>
  <text x="400" y="210" text-anchor="middle" font-size="18" fill="#b91c1c">누락 포인트: Input / Check / Handoff</text>

  <rect x="110" y="238" width="580" height="86" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="400" y="270" text-anchor="middle" font-size="17" fill="#155e75">같은 지시문이라도 계약이 없으면 단계마다 정보 손실</text>
  <text x="400" y="298" text-anchor="middle" font-size="17" fill="#0f766e">최종 결과는 "처음 의도"와 멀어진다</text>
</svg>
