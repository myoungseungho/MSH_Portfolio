<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#f8fafc"/>
  <text x="400" y="44" text-anchor="middle" font-size="22" font-family="Pretendard, Segoe UI, sans-serif" fill="#1f2937">직군 이름만 복제한 상태</text>

  <rect x="60" y="90" width="130" height="60" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="125" y="126" text-anchor="middle" font-size="16" fill="#1e3a8a">클라 Agent</text>

  <rect x="240" y="90" width="130" height="60" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="305" y="126" text-anchor="middle" font-size="16" fill="#166534">서버 Agent</text>

  <rect x="420" y="90" width="130" height="60" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="485" y="126" text-anchor="middle" font-size="16" fill="#92400e">DB Agent</text>

  <rect x="600" y="90" width="130" height="60" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="665" y="126" text-anchor="middle" font-size="16" fill="#6b21a8">아트 Agent</text>

  <line x1="190" y1="120" x2="240" y2="120" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="370" y1="120" x2="420" y2="120" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="550" y1="120" x2="600" y2="120" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>

  <text x="400" y="210" text-anchor="middle" font-size="18" fill="#b91c1c">핸드오프 규칙/완료 기준 없음</text>
  <text x="400" y="245" text-anchor="middle" font-size="16" fill="#374151">역할은 있는데 실행 계약이 없어 병목 발생</text>

  <rect x="200" y="275" width="400" height="52" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="400" y="307" text-anchor="middle" font-size="18" fill="#991b1b">"직군명"만으로는 협업 자동화가 되지 않는다</text>
</svg>
