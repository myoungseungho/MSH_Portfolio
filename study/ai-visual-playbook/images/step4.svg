<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#f8fafc"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-family="Pretendard, Segoe UI, sans-serif" fill="#1f2937">직무별 플레이북 협업</text>

  <rect x="80" y="90" width="150" height="78" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="155" y="124" text-anchor="middle" font-size="15" fill="#1e3a8a">레벨 에이전트</text>
  <text x="155" y="146" text-anchor="middle" font-size="13" fill="#1e40af">동선 설계</text>

  <rect x="250" y="90" width="150" height="78" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="325" y="124" text-anchor="middle" font-size="15" fill="#166534">아트 에이전트</text>
  <text x="325" y="146" text-anchor="middle" font-size="13" fill="#15803d">스타일 반영</text>

  <rect x="420" y="90" width="150" height="78" rx="12" fill="#fef9c3" stroke="#fde047"/>
  <text x="495" y="124" text-anchor="middle" font-size="15" fill="#854d0e">애니 에이전트</text>
  <text x="495" y="146" text-anchor="middle" font-size="13" fill="#a16207">클립 제작</text>

  <rect x="590" y="90" width="150" height="78" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="665" y="124" text-anchor="middle" font-size="15" fill="#5b21b6">통합 에이전트</text>
  <text x="665" y="146" text-anchor="middle" font-size="13" fill="#6d28d9">씬 통합</text>

  <line x1="230" y1="129" x2="250" y2="129" stroke="#2563eb" stroke-width="3"/>
  <line x1="400" y1="129" x2="420" y2="129" stroke="#2563eb" stroke-width="3"/>
  <line x1="570" y1="129" x2="590" y2="129" stroke="#2563eb" stroke-width="3"/>

  <line x1="665" y1="178" x2="325" y2="228" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="325,228 336,218 338,232" fill="#ef4444"/>
  <text x="500" y="224" text-anchor="middle" font-size="14" fill="#b91c1c">피드백 티켓으로 재요청</text>

  <rect x="126" y="252" width="548" height="70" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="400" y="280" text-anchor="middle" font-size="16" fill="#374151">공통 포맷: 입력 -> 출력 -> 검증 -> 인수</text>
  <text x="400" y="304" text-anchor="middle" font-size="14" fill="#6b7280">직무별 자유도는 유지하되, 전달 형식은 통일</text>
</svg>
