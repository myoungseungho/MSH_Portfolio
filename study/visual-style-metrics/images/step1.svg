<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#f8fafc"/>
  <text x="400" y="44" text-anchor="middle" font-size="22" font-family="Pretendard, Segoe UI, sans-serif" fill="#1f2937">보이는 작업의 모호함</text>

  <rect x="80" y="95" width="270" height="170" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="215" y="130" text-anchor="middle" font-size="18" fill="#991b1b">기존 방식</text>
  <text x="215" y="165" text-anchor="middle" font-size="15" fill="#7f1d1d">"뭔가 별로야"</text>
  <text x="215" y="190" text-anchor="middle" font-size="15" fill="#7f1d1d">"좀 더 예쁘게"</text>
  <text x="215" y="215" text-anchor="middle" font-size="15" fill="#7f1d1d">기준 없음</text>
  <text x="215" y="240" text-anchor="middle" font-size="14" fill="#b91c1c">사람마다 판정이 다름</text>

  <rect x="450" y="95" width="270" height="170" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text x="585" y="130" text-anchor="middle" font-size="18" fill="#166534">환원 방식</text>
  <text x="585" y="165" text-anchor="middle" font-size="15" fill="#14532d">가독성 점수: 75 이상</text>
  <text x="585" y="190" text-anchor="middle" font-size="15" fill="#14532d">동선 완주율: 95%</text>
  <text x="585" y="215" text-anchor="middle" font-size="15" fill="#14532d">드로우콜: 2200 이하</text>
  <text x="585" y="240" text-anchor="middle" font-size="14" fill="#15803d">누가 해도 같은 판정</text>

  <line x1="360" y1="180" x2="440" y2="180" stroke="#2563eb" stroke-width="4"/>
  <polygon points="440,180 428,172 428,188" fill="#2563eb"/>
