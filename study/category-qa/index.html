<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA / 테스트 - MSH Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; }
        .back-link:hover { color: #111; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 2rem; font-weight: 700; color: #111; margin-bottom: 8px; }
        .header p { color: #666; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #eee;
            border-left: 4px solid #14B8A6;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: #111; }
        .card-desc { font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../" class="back-link">← 메인으로</a>
        <header class="header">
            <h1>QA / 테스트</h1>
            <p>품질 보증의 본질과, 꼼꼼한 테스트 리스트를 짜는 기준</p>
        </header>
        <div class="card-grid">
            <a href="../qa-essence/" class="card">
                <h3 class="card-title">QA의 본질 &amp; 테스트 리스트 짜는 기준</h3>
                <p class="card-desc">"기본은 되네"의 함정, 행동 × 8축 전수 교차로 케이스 뽑기, 실무 사고 회고</p>
            </a>
            <a href="../qa-techniques/" class="card">
                <h3 class="card-title">QA 기법 카탈로그 &mdash; 다른 분야는 어떻게 검증하나</h3>
                <p class="card-desc">오라클 문제, 자동차·의료·반도체·금융 검증법, 경계값·속성기반·퍼징·메타모픽·차등·불변식</p>
            </a>
            <a href="../qa-change-impact/" class="card">
                <h3 class="card-title">변경의 함정 &mdash; "바꿔라"는 "부수지 마라"를 숨긴다</h3>
                <p class="card-desc">기능 완료 ≠ 통합 안전. 명세의 빙산, 변경의 파문(blast radius), 닿는 시스템 목록부터</p>
            </a>
        </div>
    </div>
<script src="/MSH_Portfolio/study/notes.js"></script></body>
</html>
